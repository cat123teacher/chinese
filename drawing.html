<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小魚填色遊戲</title>
    <!-- 引入 DragDropTouch Polyfill 輔助工具 -->
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>
    <style>
        /* 基礎樣式，適合兒童的活潑配色 */
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: 'Comic Sans MS', '微軟正黑體', sans-serif; 
            background-color: #e0f7fa; 
            user-select: none;
            touch-action: none; /* 防止整個網頁在手機上被滑動 */
        }

        /* 首頁樣式 */
        #home-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        #home-screen h1 { 
            color: #ff5252; 
            font-size: 3rem; 
            text-shadow: 3px 3px #fff; 
            margin-bottom: 20px;
            text-align: center;
        }
        #start-btn { 
            border: none; 
            background: none; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        #start-btn:active { transform: scale(0.9); }
        
        #start-btn img { 
            max-width: 80vw; 
            width: 400px; 
            border-radius: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); 
            border: 8px solid white; 
            background-color: white;
        }

        /* 遊戲填色頁面樣式 */
        #game-screen { 
            display: none; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw;
        }
        
        /* 上方畫板工具列 */
        #toolbar { 
            display: flex; 
            flex-wrap: wrap; 
            align-items: center;
            justify-content: center; 
            gap: 12px; 
            padding: 15px; 
            background-color: #ffffff; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            z-index: 10; 
        }
        
        .color-btn { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            border: 4px solid #eee; 
            cursor: pointer; 
            transition: transform 0.1s;
        }
        .color-btn.active { 
            border-color: #333; 
            transform: scale(1.15); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .size-btn, .tool-btn { 
            padding: 10px 20px; 
            font-size: 1.2rem; 
            font-weight: bold;
            border-radius: 15px; 
            border: 3px solid #ccc; 
            background: #f9f9f9; 
            cursor: pointer; 
            color: #333;
        }
        .size-btn.active, .tool-btn.active { 
            background: #ffeb3b; 
            border-color: #ff9800; 
            color: #d84315;
        }
        
        .divider { width: 3px; height: 40px; background: #ddd; margin: 0 5px; border-radius: 2px; }

        /* 畫布區域 */
        #canvas-container { 
            flex-grow: 1; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #b2ebf2; 
            overflow: hidden; 
            width: 100%;
        }
        
        #coloring-canvas {
            position: absolute;
            background-color: #ffffff;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            touch-action: none;
            z-index: 1;
            border-radius: 10px;
        }
        
        #fish-overlay {
            position: absolute;
            z-index: 2;
            pointer-events: none; 
            mix-blend-mode: multiply; 
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- 首頁 -->
    <div id="home-screen">
        <h1>🎨 小魚填色遊戲 🖌️</h1>
        <button id="start-btn">
            <img src="Nfish.jpg" alt="按我開始填色！">
        </button>
    </div>

    <!-- 填色遊戲頁面 -->
    <div id="game-screen">
        <!-- 工具列 -->
        <div id="toolbar">
            <button class="tool-btn active" id="btn-brush">🖌️ 畫筆</button>
            <button class="tool-btn" id="btn-eraser">🧽 橡皮擦</button>

            <div class="divider"></div>

            <button class="size-btn" data-size="10">細</button>
            <button class="size-btn active" data-size="25">中</button>
            <button class="size-btn" data-size="45">粗</button>

            <div class="divider"></div>

            <div class="color-btn active" style="background-color: #f44336;" data-color="#f44336"></div>
            <div class="color-btn" style="background-color: #ff9800;" data-color="#ff9800"></div>
            <div class="color-btn" style="background-color: #ffeb3b;" data-color="#ffeb3b"></div>
            <div class="color-btn" style="background-color: #4caf50;" data-color="#4caf50"></div>
            <div class="color-btn" style="background-color: #2196f3;" data-color="#2196f3"></div>
            <div class="color-btn" style="background-color: #9c27b0;" data-color="#9c27b0"></div>
            <div class="color-btn" style="background-color: #000000;" data-color="#000000"></div>

            <div class="divider"></div>
            
            <button class="tool-btn" id="btn-clear">🗑️ 重新開始</button>
            <button class="tool-btn" id="btn-home">🏠 回首頁</button>
        </div>
        
        <!-- 畫布與圖層 -->
        <div id="canvas-container">
            <canvas id="coloring-canvas"></canvas>
            <img src="Nfish.jpg" id="fish-overlay" alt="fish outline">
        </div>
    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const gameScreen = document.getElementById('game-screen');
        const startBtn = document.getElementById('start-btn');
        const canvas = document.getElementById('coloring-canvas');
        const overlay = document.getElementById('fish-overlay');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;
        let currentColor = '#f44336';
        let currentSize = 25;
        let isEraser = false;
        let lastX = 0;
        let lastY = 0;

        // 初始化畫布大小
        function initCanvas() {
            const container = document.getElementById('canvas-container');
            
            // 安全取得圖片比例
            let imgAspect = overlay.naturalWidth / overlay.naturalHeight;
            if (!imgAspect || isNaN(imgAspect)) {
                imgAspect = 1; 
            }

            const containerAspect = container.clientWidth / container.clientHeight;
            let newWidth, newHeight;
            
            if (containerAspect > imgAspect) {
                newHeight = container.clientHeight * 0.95;
                newWidth = newHeight * imgAspect;
            } else {
                newWidth = container.clientWidth * 0.95;
                newHeight = newWidth / imgAspect;
            }

            canvas.width = newWidth;
            canvas.height = newHeight;
            overlay.style.width = newWidth + 'px';
            overlay.style.height = newHeight + 'px';

            clearCanvas();
        }

        function clearCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        startBtn.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            setTimeout(initCanvas, 150); 
        });

        document.getElementById('btn-home').addEventListener('click', () => {
            gameScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });

        document.getElementById('btn-clear').addEventListener('click', clearCanvas);

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentColor = e.target.getAttribute('data-color');
                isEraser = false;
                updateToolUI();
            });
        });

        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentSize = parseInt(e.target.getAttribute('data-size'));
            });
        });

        document.getElementById('btn-brush').addEventListener('click', () => {
            isEraser = false;
            updateToolUI();
        });

        document.getElementById('btn-eraser').addEventListener('click', () => {
            isEraser = true;
            updateToolUI();
        });

        function updateToolUI() {
            document.getElementById('btn-brush').classList.toggle('active', !isEraser);
            document.getElementById('btn-eraser').classList.toggle('active', isEraser);
        }

        // --- 繪圖邏輯 (重要修正區域) ---
        
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            // 【真正生效的修正】：明確加上  來取得第一隻手指！
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches.clientX;
                clientY = e.touches.clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                // 加入 changedTouches 增加相容性
                clientX = e.changedTouches.clientX;
                clientY = e.changedTouches.clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;

            ctx.beginPath();
            ctx.arc(lastX, lastY, currentSize / 2, 0, Math.PI * 2);
            ctx.fillStyle = isEraser ? '#ffffff' : currentColor;
            ctx.fill();
            ctx.closePath();
        }

        function draw(e) {
            e.preventDefault();
            if (!isDrawing) return;
            const pos = getPos(e);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = isEraser ? '#ffffff' : currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round'; 
            ctx.lineJoin = 'round';
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // 綁定事件
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);

        window.addEventListener('resize', () => {
            if (gameScreen.style.display === 'flex') {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

                initCanvas();
                ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
            }
        });
    </script>
</body>
</html>
