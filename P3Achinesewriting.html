        let currentLevelId = 1;
        let currentQuestions = [];
        let questionIndex = 0;
        let score = 0;
        let selectedOption = null;
        let userAnswersHistory = [];

        window.onload = function() {
            generateLobbyGrid();
            showLobby();
        };

        function getStarsAndScoreHtml(levelId) {
            const bestScore = localStorage.getItem(`level_score_lvl_${levelId}`);
            if (bestScore === null) {
                return {
                    stars: `<span class="star-empty">⛤⛤⛤</span>`,
                    scoreText: "未挑戰"
                };
            }

            const scoreNum = parseInt(bestScore);
            let starsStr = "";
            
            if (scoreNum === 20) {
                starsStr = `<span class="star-big">🌟🌟🌟</span>`;
            } else if (scoreNum >= 10) {
                starsStr = `<span class="star-small">⭐⭐⭐</span>`;
            } else {
                starsStr = `<span class="star-empty">⛤⛤⛤</span>`;
            }

            return {
                stars: starsStr,
                scoreText: `最高得分: ${scoreNum} 分`
            };
        }

        function generateLobbyGrid() {
            const grid = document.getElementById("levels-grid");
            grid.innerHTML = "";
            for (let id in gameLevels) {
                const lvl = gameLevels[id];
                const card = document.createElement("div");
                card.className = "level-card active";
                card.onclick = () => showIntro(id);
                
                const meta = getStarsAndScoreHtml(id);

                card.innerHTML = `
                    <span class="icon">${lvl.icon}</span>
                    <span class="num">關卡 ${id}</span>
                    <div class="title">${lvl.title}</div>
                    <div class="stars-container">${meta.stars}</div>
                    <div class="score-badge">${meta.scoreText}</div>
                `;
                grid.appendChild(card);
            }
        }

        function showLobby() {
            document.getElementById("lobby-view").classList.remove("hidden");
            document.getElementById("intro-view").classList.add("hidden");
            document.getElementById("quiz-view").classList.add("hidden");
            document.getElementById("result-view").classList.add("hidden");
            document.getElementById("game-title").innerText = "小三上中文寫作大冒險";
            generateLobbyGrid();
        }

        function confirmBackToLobby() {
            if (confirm("📢 現在回到地圖主頁，這關的做題進度將會遺失喔！確定要返回嗎？")) {
                showLobby();
            }
        }

        function confirmClearRecords() {
            if (confirm("🧹 確定要清除所有關卡的星星和最高分數記錄嗎？此操作將會重新開始喔！")) {
                for (let id in gameLevels) {
                    localStorage.removeItem(`level_score_lvl_${id}`);
                }
                alert("🧹 紀錄清除成功！快點燃鬥志重新挑戰吧！");
                generateLobbyGrid();
            }
        }

        function showIntro(levelId) {
            currentLevelId = parseInt(levelId);
            const lvl = gameLevels[currentLevelId];

            document.getElementById("game-title").innerText = `關卡 ${currentLevelId} - ${lvl.title}`;
            document.getElementById("intro-title-text").innerText = lvl.introTitle;
            document.getElementById("intro-teaching-text").innerHTML = lvl.teaching;
            document.getElementById("intro-example-text").innerHTML = lvl.example;

            document.getElementById("lobby-view").classList.add("hidden");
            document.getElementById("intro-view").classList.remove("hidden");
            document.getElementById("quiz-view").classList.add("hidden");
            document.getElementById("result-view").classList.add("hidden");
        }

        function startGameSession() {
            const lvl = gameLevels[currentLevelId];
            
            const shuffledEasy = shuffleArray([...lvl.easy]);
            const shuffledHard = shuffleArray([...lvl.hard]);

            const selectedEasy = shuffledEasy.slice(0, 10);
            const selectedHard = shuffledHard.slice(0, 10);

            currentQuestions = [...selectedEasy, ...selectedHard];
            
            userAnswersHistory = [];
            currentQuestions.forEach(q => {
                userAnswersHistory.push({
                    qText: q.q,
                    options: q.a,
                    correctIndex: q.ans,
                    userSelectedIndex: -1,
                    isCorrect: false
                });
            });

            questionIndex = 0;
            score = 0;
            
            document.getElementById("lobby-view").classList.add("hidden");
            document.getElementById("intro-view").classList.add("hidden");
            document.getElementById("quiz-view").classList.remove("hidden");
            document.getElementById("result-view").classList.add("hidden");

            document.getElementById("level-indicator").innerText = `${lvl.icon} 關卡 ${currentLevelId}`;
            updateScoreDisplay();
            loadQuestion();
        }

        function loadQuestion() {
            selectedOption = null;
            const qData = currentQuestions[questionIndex];
            const history = userAnswersHistory[questionIndex];

            document.getElementById("wrong-next-panel").classList.add("hidden");
            document.getElementById("btn-prev-q").disabled = (questionIndex === 0);
            document.getElementById("btn-next-q").disabled = false;

            if (questionIndex === 19) {
                document.getElementById("btn-next-q").innerHTML = `提交結算 <i class="fa-solid fa-flag-checkered"></i>`;
            } else {
                document.getElementById("btn-next-q").innerHTML = `下一題 <i class="fa-solid fa-arrow-right"></i>`;
            }

            document.getElementById("question-indicator").innerText = `第 ${questionIndex + 1} / 20 題`;
            const progressPercent = ((questionIndex) / 20) * 100;
            document.getElementById("game-progress").style.width = `${progressPercent}%`;

            const difficultyTag = questionIndex < 10 ? "⭐ [基礎挑戰]" : "🔥 [進階挑戰]";
            document.getElementById("q-text").innerHTML = `
                <div style="display:flex; flex-direction:column;">
                    <span style="color:${questionIndex < 10 ? '#4ECA64':'#FF5C77'}; font-weight:bold; font-size:0.82rem; margin-bottom:4px;">${difficultyTag}</span>
                    <span>${qData.q}</span>
                </div>
            `;

            const ttsQBtn = document.getElementById("tts-q-trigger");
            ttsQBtn.style.animation = "float 1.5s ease-in-out infinite";

            const optionsBox = document.getElementById("options-box");
            optionsBox.innerHTML = "";
            qData.a.forEach((optText, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                
                if (history.userSelectedIndex !== -1) {
                    if (idx === history.correctIndex) {
                        btn.classList.add("correct");
                    } else if (idx === history.userSelectedIndex) {
                        btn.classList.add("wrong");
                    }
                }

                btn.innerHTML = `
                    <span><b>${idx + 1}.</b> ${optText}</span>
                    <button class="option-tts-btn" onclick="speakOption(event, '${optText}')" title="點讀該選項"><i class="fa-solid fa-volume-high"></i></button>
                `;
                
                btn.onclick = () => selectOption(idx, btn);
                optionsBox.appendChild(btn);
            });

            // speakText(qData.q); // 已停用自動讀題，需手動點擊喇叭朗讀
        }

        function navigatePrev() {
            if (questionIndex > 0) {
                questionIndex--;
                loadQuestion();
            }
        }

        function navigateNext() {
            if (questionIndex < 19) {
                questionIndex++;
                loadQuestion();
            } else {
                showResult();
            }
        }

        function selectOption(index, buttonElement) {
            const history = userAnswersHistory[questionIndex];
            if (history.userSelectedIndex !== -1) return;

            history.userSelectedIndex = index;
            const qData = currentQuestions[questionIndex];
            const correctIndex = qData.ans;
            const optionButtons = document.getElementById("options-box").getElementsByClassName("option-btn");

            if (index === correctIndex) {
                buttonElement.classList.add("correct");
                history.isCorrect = true;
                score += 1;
                updateScoreDisplay();
                
                playCorrectSound();
                startConfettiEffect();
                speakText("答對了！你太棒了！");

                setTimeout(() => {
                    navigateNext();
                }, 2000);
            } else {
                buttonElement.classList.add("wrong");
                optionButtons[correctIndex].classList.add("correct");
                history.isCorrect = false;
                speakText("不太對，看清楚答案，再試試看！");
                document.getElementById("wrong-next-panel").classList.remove("hidden");
            }
        }

        function updateScoreDisplay() {
            document.getElementById("score-counter").innerText = `得分: ${score} / 20 分`;
        }

        function updateResultCardUI() {
            document.getElementById("final-score").innerText = `得分: ${score} / 20 分`;

            const previousBest = parseInt(localStorage.getItem(`level_score_lvl_${currentLevelId}`)) || 0;
            if (score > previousBest) {
                localStorage.setItem(`level_score_lvl_${currentLevelId}`, score);
            }

            const emojiEl = document.getElementById("result-emoji");
            const msgEl = document.getElementById("result-msg");

            if (score === 20) {
                emojiEl.innerText = "👑";
                msgEl.innerText = "太完美了！你得到了滿分 20 分，成功點亮了閃耀大星星！🌟🌟🌟";
            } else if (score >= 10) {
                emojiEl.innerText = "⭐";
                msgEl.innerText = "表現很棒！你已達到合格分數，成功點亮了可愛小星星勳章！⭐⭐⭐";
            } else {
                emojiEl.innerText = "🍀";
                msgEl.innerText = "差一點點就合格 (10分) 囉！多做下方錯題練習，再次挑戰必定成功！";
            }
        }

        function showResult() {
            document.getElementById("quiz-view").classList.add("hidden");
            document.getElementById("result-view").classList.remove("hidden");

            updateResultCardUI();

            if (score === 20) {
                // speakText("太完美了！你獲得了二十分滿分！"); // 已停用自動讀題
            } else if (score >= 10) {
                // speakText("做得好！你順利合格了！"); // 已停用自動讀題
            } else {
                // speakText("沒關係，多讀幾遍，重新挑戰一次吧！"); // 已停用自動讀題
            }

            generateReportList();
        }

        function restartLevel() {
            startGameSession();
        }

        function generateReportList() {
            const listEl = document.getElementById("report-list");
            listEl.innerHTML = "";

            userAnswersHistory.forEach((record, idx) => {
                const item = document.createElement("div");
                item.className = "report-item";
                
                const statusText = record.isCorrect 
                    ? `<span class="report-status status-correct"><i class="fa-solid fa-circle-check"></i> 答對</span>` 
                    : `<span class="report-status status-wrong"><i class="fa-solid fa-circle-xmark"></i> 答錯</span>`;

                const actionButton = record.isCorrect 
                    ? `<span style="color:#999; font-size:0.85rem;"><i class="fa-solid fa-face-smile"></i> 完成了！</span>` 
                    : `<button class="btn btn-blue" style="padding:6px 14px; font-size:0.85rem; margin:0; border-radius:12px; box-shadow: 0 3px 0px #1A75C7;" onclick="openRedoQuestion(${idx})"><i class="fa-solid fa-play"></i> 重新挑戰</button>`;

                item.innerHTML = `
                    <div style="flex: 1; padding-right: 10px;">
                        <strong style="color:var(--primary-color);">第 ${idx+1} 題：</strong>
                        <span style="font-size:0.95rem; line-height: 1.4;">${record.qText}</span>
                    </div>
                    <div style="display:flex; align-items:center; justify-content: space-between; gap: 15px; margin-top: 5px;">
                        ${statusText}
                        ${actionButton}
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function openRedoQuestion(historyIndex) {
            const record = userAnswersHistory[historyIndex];
            
            const currentHint = levelWritingHints[currentLevelId] || "細心閱讀題目，找出句子或格式中的關鍵答案喔！";
            document.getElementById("redo-hint-text").innerText = currentHint;

            document.getElementById("redo-q-text").innerText = `第 ${historyIndex + 1} 題：${record.qText}`;
            document.getElementById("redo-speak-q-btn").onclick = () => speakText(record.qText);
            document.getElementById("redo-feedback").innerText = "";

            const box = document.getElementById("redo-options-box");
            box.innerHTML = "";

            let isRedoFinished = false;

            record.options.forEach((optText, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerHTML = `
                    <span><b>${idx + 1}.</b> ${optText}</span>
                    <button class="option-tts-btn" onclick="speakOption(event, '${optText}')"><i class="fa-solid fa-volume-high"></i></button>
                `;
                
                btn.onclick = () => {
                    if (isRedoFinished) return;

                    if (idx === record.correctIndex) {
                        isRedoFinished = true;
                        btn.className = "option-btn correct";
                        document.getElementById("redo-feedback").innerHTML = "<span style='color:var(--correct-color);'><i class='fa-solid fa-face-laugh-beam'></i> 答對了！你太棒了！</span>";
                        playCorrectSound();
                        startConfettiEffect();
                        // speakText("完全正確！你成功改正了錯誤！"); // 已停用自動讀題
                        
                        record.isCorrect = true;
                        score += 1;
                        
                        updateResultCardUI();
                        
                        setTimeout(() => {
                            closeRedoModal();
                            generateReportList();
                        }, 1500);
                    } else {
                        btn.className = "option-btn wrong";
                        document.getElementById("redo-feedback").innerHTML = "<span><i class='fa-solid fa-hand-fist'></i> 差一點點，再試試別的答案！</span>";
                        // speakText("不太對，再想一想！"); // 已停用自動讀題
                    }
                };
                box.appendChild(btn);
            });

            document.getElementById("redo-modal").classList.remove("hidden");
        }

        function closeRedoModal() {
            document.getElementById("redo-modal").classList.add("hidden");
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function speakCurrentQuestion() {
            const qData = currentQuestions[questionIndex];
            if (qData) {
                let fullSpeechText = qData.q + "。選項有：";
                qData.a.forEach((optText, idx) => {
                    fullSpeechText += `。第${idx + 1}個選項：${optText}。`;
                });
                speakText(fullSpeechText);
            }
        }

        function speakOption(event, text) {
            event.stopPropagation();
            speakText(text);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const cleanText = text.replace(/<\/?[^>]+(>|$)/g, "").replace(/💡/g, "").replace(/例：/g, "例如：");
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'zh-HK'; 
                utterance.rate = 0.86;    
                utterance.pitch = 1.12;   
                window.speechSynthesis.speak(utterance);
            }
        }

        function playCorrectSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.type = 'sine';
                const now = ctx.currentTime;
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                osc.frequency.setValueAtTime(1046.50, now + 0.24);
                
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                
                osc.start();
                osc.stop(now + 0.5);
            } catch (e) {
                console.log("AudioContext blocked.");
            }
        }

        const confettiCanvas = document.getElementById("confetti-canvas");
        const confettiCtx = confettiCanvas.getContext("2d");
        let confettiActive = false;
        let particles = [];

        function resizeConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeConfetti);

        function startConfettiEffect() {
            resizeConfetti();
            confettiCanvas.classList.remove("hidden");
            confettiActive = true;
            particles = [];
            
            for (let i = 0; i < 110; i++) {
                particles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * confettiCanvas.height,
                    color: `hsl(${Math.random() * 360}, 100%, 55%)`,
                    tilt: Math.random() * 10 - 5,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                    tiltAngle: 0
                });
            }
            animateConfetti();
            
            setTimeout(() => {
                confettiActive = false;
                confettiCanvas.classList.add("hidden");
            }, 2000);
        }

        function animateConfetti() {
            if (!confettiActive) return;
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            
            particles.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleIncremental;
                p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle);
                p.tilt = Math.sin(p.tiltAngle - index / 3) * 15;

                confettiCtx.beginPath();
                confettiCtx.lineWidth = p.r;
                confettiCtx.strokeStyle = p.color;
                confettiCtx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                confettiCtx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                confettiCtx.stroke();
            });
            requestAnimationFrame(animateConfetti);
        }
    </script>
</body>
