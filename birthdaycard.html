<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1B生日卡練習</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --sky-1: #dff4ff;
    --sky-2: #fff6e8;
    --primary: #ff6b8b;
    --primary-dark: #e0486c;
    --secondary: #4ecdc4;
    --secondary-dark: #2ba89f;
    --sunny: #ffd166;
    --sunny-dark: #e0a82e;
    --purple: #845ef7;
    --purple-dark: #6741d9;
    --blue: #339af0;
    --blue-dark: #1c7ed6;
    --ink: #2d3142;
    --muted: #5c6378;
    --card-bg: #ffffff;
    --shadow: 0 10px 26px rgba(45, 49, 66, 0.12);
    --radius: 24px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", "Heiti TC", sans-serif;
    background: linear-gradient(160deg, var(--sky-1) 0%, var(--sky-2) 55%, #ffe9f0 100%);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ===== Top Bar ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 3px solid #ffe0eb;
    padding: 10px 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .brand-badge {
    width: 44px;
    height: 44px;
    border-radius: 16px;
    background: linear-gradient(145deg, #ff8fab, #ff5d8f);
    color: #fff;
    font-weight: 900;
    font-size: 20px;
    display: grid;
    place-items: center;
    box-shadow: 0 5px 0 #d93b6b;
  }
  .brand h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 900;
    color: #e0486c;
    letter-spacing: 1px;
  }
  .brand small {
    display: block;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .lang-toggle {
    display: inline-flex;
    background: #f1f5f9;
    padding: 4px;
    border-radius: 999px;
    border: 2px solid #e2e8f0;
  }
  .lang-btn {
    border: none;
    background: transparent;
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.2s;
  }
  .lang-btn.active {
    background: linear-gradient(135deg, #4ecdc4, #2ba89f);
    color: #fff;
    box-shadow: 0 3px 8px rgba(43, 168, 159, 0.35);
  }

  .star-pill {
    background: linear-gradient(135deg, #ffe066, #fab005);
    color: #5c3b00;
    font-weight: 900;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 15px;
    box-shadow: 0 4px 0 #d99300;
  }

  /* ===== Main Layout ===== */
  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px 16px 60px;
  }

  /* ===== 3D Pixar Stage ===== */
  .stage-card {
    position: relative;
    background: linear-gradient(180deg, #b8e8ff 0%, #e5f6ff 60%, #fff4d6 100%);
    border-radius: 28px;
    border: 4px solid #ffffff;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 18px;
  }
  #three-wrap {
    width: 100%;
    height: 240px;
    position: relative;
    cursor: grab;
    touch-action: pan-y;
    user-select: none;
  }
  #three-wrap:active { cursor: grabbing; }
  .stage-overlay {
    position: absolute;
    left: 16px;
    bottom: 14px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    gap: 10px;
  }
  .bear-speech {
    pointer-events: auto;
    background: rgba(255, 255, 255, 0.94);
    border: 3px solid #ffd166;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    max-width: 680px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stage-hint {
    background: rgba(45, 49, 66, 0.65);
    color: #fff;
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* ===== Navigation Tabs ===== */
  .nav-tabs {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  @media (max-width: 820px) {
    .nav-tabs { grid-template-columns: repeat(3, 1fr); }
    #three-wrap { height: 200px; }
    .stage-hint { display: none; }
  }
  .tab-btn {
    border: none;
    border-radius: 18px;
    padding: 12px 8px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    background: #ffffff;
    color: var(--ink);
    box-shadow: 0 5px 0 #dce3ee;
    transition: transform 0.12s, background 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .tab-btn:active { transform: translateY(3px); }
  .tab-btn .t-ico { font-size: 20px; }
  .tab-btn.active {
    background: linear-gradient(145deg, #ff758f, #ff4d6d);
    color: #fff;
    box-shadow: 0 5px 0 #c9184a;
  }
  .tab-btn.ultimate.active {
    background: linear-gradient(145deg, #9775fa, #7048e8);
    box-shadow: 0 5px 0 #5f3dc4;
  }

  /* ===== Panels & Buttons ===== */
  .panel {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    border: 3px solid #fff;
  }
  .btn {
    border: none;
    border-radius: 16px;
    padding: 11px 18px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: transform 0.12s, filter 0.15s;
    color: #fff;
  }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { transform: translateY(3px); }
  .btn-pink { background: linear-gradient(135deg, #ff758f, #ff4d6d); box-shadow: 0 4px 0 #c9184a; }
  .btn-teal { background: linear-gradient(135deg, #4ecdc4, #20b2aa); box-shadow: 0 4px 0 #17857f; }
  .btn-blue { background: linear-gradient(135deg, #4dabf7, #228be6); box-shadow: 0 4px 0 #1864ab; }
  .btn-sunny { background: linear-gradient(135deg, #ffd43b, #fab005); color: #5c3b00; box-shadow: 0 4px 0 #d99300; }
  .btn-purple { background: linear-gradient(135deg, #9775fa, #7950f2); box-shadow: 0 4px 0 #5f3dc4; }
  .btn-gray { background: #eef2f7; color: var(--ink); box-shadow: 0 4px 0 #cbd5e1; }
  .btn-sm { padding: 7px 13px; font-size: 13px; border-radius: 12px; }

  /* ===== Home Dashboard ===== */
  .home-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }
  .level-card {
    background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    border: 3px solid #e7f0ff;
    border-radius: 22px;
    padding: 18px;
    cursor: pointer;
    transition: transform 0.16s, border-color 0.2s;
    position: relative;
  }
  .level-card:hover { transform: translateY(-4px); border-color: #ff8fab; }
  .level-card .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    background: #ffe3ec;
    color: #c9184a;
    margin-bottom: 8px;
  }
  .level-card h3 { margin: 4px 0 8px; font-size: 19px; }
  .level-card p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }

  .worksheet-box {
    margin-top: 22px;
    background: linear-gradient(135deg, #fff9db 0%, #ffe8f3 100%);
    border: 3px dashed #ff8fab;
    border-radius: 24px;
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .worksheet-box h3 { margin: 0 0 6px; font-size: 20px; color: #c2255c; }
  .worksheet-box p { margin: 0; font-size: 14px; color: #5c4b51; }

  /* ===== Quiz Header & Progress ===== */
  .quiz-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 2px dashed #e9ecef;
  }
  .progress-dots {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .p-dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #eef2f7;
    color: var(--muted);
    font-weight: 800;
    font-size: 13px;
    display: grid;
    place-items: center;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.12s;
  }
  .p-dot.current { border-color: #ff4d6d; background: #fff0f3; color: #c9184a; transform: scale(1.08); }
  .p-dot.done-ok { background: #38d9a9; color: #fff; }
  .p-dot.done-err { background: #ff8787; color: #fff; }

  /* ===== Birthday Card Visual Display ===== */
  .bcard-paper {
    background: linear-gradient(180deg, #fffdf7 0%, #fff7eb 100%);
    border: 4px solid #ffd8a8;
    border-radius: 22px;
    padding: 22px 24px;
    position: relative;
    font-size: 20px;
    line-height: 1.9;
    box-shadow: inset 0 0 0 4px #fff;
    margin: 14px 0;
  }
  .bcard-line {
    padding: 4px 10px;
    border-radius: 12px;
    transition: background 0.2s;
    position: relative;
  }
  .bcard-line.highlight {
    background: #fff3bf;
    outline: 3px solid #fab005;
    font-weight: 800;
  }
  .bcard-line.highlight::after {
    content: " ◀ 看這裡！";
    font-size: 13px;
    background: #fab005;
    color: #fff;
    padding: 2px 9px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: middle;
    display: inline-block;
  }
  .indent-boxes {
    display: inline-flex;
    gap: 3px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .indent-box {
    width: 20px;
    height: 20px;
    border: 2px solid #adb5bd;
    background: #f8f9fa;
    display: inline-block;
    border-radius: 4px;
  }
  .stair-wrap {
    margin-top: 16px;
    position: relative;
  }
  .stair-rel { text-align: right; padding-right: min(120px, 26%); }
  .stair-from { text-align: right; padding-right: min(36px, 8%); }
  .stair-date { text-align: right; padding-right: 12px; }
  .stair-guide {
    border-top: 3px dashed #ffa8a8;
    border-right: 3px dashed #ffa8a8;
    width: 96px;
    height: 62px;
    position: absolute;
    right: min(116px, 25%);
    top: 34px;
    pointer-events: none;
    border-top-right-radius: 6px;
    opacity: 0.65;
  }
  @media (max-width: 560px) {
    .bcard-paper { font-size: 17px; padding: 16px 14px; }
    .stair-guide { display: none; }
    .stair-rel { padding-right: 22%; }
    .stair-from { padding-right: 8%; }
    .stair-date { padding-right: 2%; }
  }
  .bad-left { text-align: left !important; padding-right: 0 !important; }

  /* ===== Options Grid ===== */
  .opt-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  .opt-btn {
    text-align: left;
    background: #f8fafc;
    border: 3px solid #e2e8f0;
    border-radius: 16px;
    padding: 13px 16px;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s;
  }
  .opt-btn:hover:not(:disabled) { border-color: #4dabf7; background: #eef8ff; transform: translateY(-2px); }
  .opt-btn.correct { background: #d3f9d8; border-color: #2b8a3e; color: #1b5e20; }
  .opt-btn.wrong { background: #ffe3e3; border-color: #e03131; color: #9b1c1c; }

  .feedback-box {
    margin-top: 14px;
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.6;
    font-weight: 600;
  }
  .feedback-ok { background: #e6fcf5; border: 2px solid #20c997; color: #087f5b; }
  .feedback-err { background: #fff5f5; border: 2px solid #ff8787; color: #c92a2a; }

  /* ===== Level 3 Block Builder ===== */
  .slot-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .slot-label {
    min-width: 108px;
    font-size: 14px;
    font-weight: 800;
    color: var(--muted);
  }
  .slot-box {
    flex: 1;
    min-height: 48px;
    border: 3px dashed #adb5bd;
    border-radius: 14px;
    padding: 8px 14px;
    background: #fff;
    display: flex;
    align-items: center;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .slot-box.filled { border-style: solid; border-color: #4dabf7; background: #e7f5ff; }
  .slot-box.align-rel { margin-left: 18%; }
  .slot-box.align-from { margin-left: 32%; }
  .slot-box.align-date { margin-left: 38%; }
  @media (max-width: 560px) {
    .slot-label { min-width: 84px; font-size: 12px; }
    .slot-box { font-size: 15px; }
    .slot-box.align-rel { margin-left: 10%; }
    .slot-box.align-from { margin-left: 20%; }
    .slot-box.align-date { margin-left: 26%; }
  }
  .block-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 16px 0;
    padding: 14px;
    background: #f1f5f9;
    border-radius: 18px;
  }
  .block-chip {
    border: none;
    border-radius: 14px;
    padding: 10px 16px;
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    transition: transform 0.12s;
  }
  .block-chip:active { transform: translateY(3px); }
  .block-chip.used { opacity: 0.35; pointer-events: none; }

  /* ===== Level 4 Writing Studio ===== */
  .prompt-banner {
    background: linear-gradient(135deg, #fff0f6 0%, #fff9db 100%);
    border: 3px solid #ffadd2;
    border-radius: 20px;
    padding: 16px 20px;
    font-size: 19px;
    font-weight: 800;
    color: #862e9c;
    margin-bottom: 14px;
    line-height: 1.6;
  }
  .w-grid {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 18px;
  }
  @media (max-width: 820px) { .w-grid { grid-template-columns: 1fr; } }

  .card-editor {
    background: #fffdf5;
    border: 4px solid #ffd8a8;
    border-radius: 22px;
    padding: 20px;
  }
  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-size: 13px; font-weight: 800; color: #8c6d46; margin-bottom: 4px; }
  .field-input, .field-textarea {
    width: 100%;
    border: 2px solid #e9d8be;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 17px;
    font-family: inherit;
    background: #fff;
  }
  .field-input:focus, .field-textarea:focus { outline: none; border-color: #ff6b8b; }
  .stair-inputs { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin-top: 10px; }
  .stair-inputs .field-row { margin-bottom: 0; }
  .stair-inputs .s-rel { margin-right: 18%; width: 54%; }
  .stair-inputs .s-from { margin-right: 4%; width: 54%; }
  .stair-inputs .s-date { margin-right: 0; width: 54%; }

  .helper-box {
    background: #f8fbff;
    border: 2px solid #d0ebff;
    border-radius: 20px;
    padding: 16px;
  }
  .helper-box h4 { margin: 0 0 8px; font-size: 15px; color: #1971c2; }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .word-chip {
    background: #fff;
    border: 2px solid #a5d8ff;
    color: #1864ab;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .word-chip:hover { background: #e7f5ff; }

  .stamp-box {
    display: inline-block;
    border: 4px solid #e03131;
    color: #e03131;
    border-radius: 16px;
    padding: 5px 14px;
    font-size: 18px;
    font-weight: 900;
    transform: rotate(-5deg);
  }
  .check-list { list-style: none; padding: 0; margin: 10px 0 0; }
  .check-list li { padding: 4px 0; font-size: 14.5px; font-weight: 700; }

  /* ===== Level 5 Ultimate Blank Exam ===== */
  .exam-paper {
    background: #fffef9;
    border: 4px solid #d0bfff;
    border-radius: 22px;
    padding: 20px 24px;
    box-shadow: inset 0 0 0 4px #fff;
  }
  .lined-textarea {
    width: 100%;
    min-height: 310px;
    border: none;
    outline: none;
    resize: vertical;
    font-family: inherit;
    font-size: 21px;
    line-height: 44px;
    padding: 0 10px;
    color: #1e293b;
    background-color: transparent;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 42px,
      #94a3b8 42px,
      #94a3b8 44px
    );
  }

  /* ===== Print System (Debugged: Zero Blank-Page Overflow) ===== */
  #print-root { display: none; }

  @media print {
    @page {
      size: A4 portrait;
      margin: 10mm;
    }
    html, body {
      background: #ffffff !important;
      margin: 0 !important;
      padding: 0 !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    #app-root { display: none !important; }
    #print-root { display: block !important; }

    .print-page {
      width: 100%;
      page-break-after: always;
      break-after: page;
      box-sizing: border-box;
      overflow: hidden;
    }
    .print-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    /* --- Mode A: Cute Cartoon 1-Question-Per-Page A4 Portrait --- */
    .cute-page {
      height: 266mm;
      border: 4px solid #ff8fab;
      border-radius: 18px;
      padding: 8mm 10mm;
      background: linear-gradient(180deg, #fff9fc 0%, #ffffff 30%, #fffdf5 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .cute-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px dashed #ffd166;
      padding-bottom: 4mm;
    }
    .cute-title-block h1 {
      margin: 0;
      font-size: 21pt;
      color: #e0486c;
      letter-spacing: 2px;
    }
    .cute-title-block p {
      margin: 1.5mm 0 0;
      font-size: 10.5pt;
      color: #475569;
      font-weight: 700;
    }
    .cute-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11.5pt;
      font-weight: 700;
      margin: 3.5mm 0;
      color: #334155;
    }
    .cute-qbox {
      background: #fff0f6;
      border: 3px solid #ffadd2;
      border-radius: 14px;
      padding: 4.5mm 5.5mm;
      font-size: 14pt;
      font-weight: 800;
      color: #4a154b;
      line-height: 1.55;
    }
    .cute-card-area {
      flex: 1;
      margin: 5mm 0;
      border: 3px solid #74c0fc;
      border-radius: 16px;
      padding: 6mm 8mm 5mm;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .cute-card-tag {
      position: absolute;
      top: -11px;
      left: 16px;
      background: #4dabf7;
      color: #fff;
      font-size: 10pt;
      font-weight: 800;
      padding: 2px 12px;
      border-radius: 999px;
    }
    .cute-write-line {
      flex: 1;
      border-bottom: 1.5px solid #64748b;
      display: flex;
      align-items: flex-end;
      padding-bottom: 2mm;
    }
    .cute-indent-hint {
      display: inline-flex;
      gap: 2px;
      margin-right: 4px;
      opacity: 0.55;
    }
    .cute-indent-sq {
      width: 5.5mm;
      height: 5.5mm;
      border: 1.5px dashed #94a3b8;
    }
    .cute-footer {
      background: #fff9db;
      border: 2px solid #ffd43b;
      border-radius: 12px;
      padding: 3mm 4.5mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10pt;
      font-weight: 700;
      color: #5c3b00;
    }

    /* --- Mode B: Level 4 Clean 2-Questions-Per-Page A4 Portrait --- */
    .clean-2up-page {
      height: 266mm;

<script>
/* =========================================================================
   1. SPEECH SYNTHESIS (廣東話 zh-HK + 普通話 zh-CN) — Debugged Timing
   ========================================================================= */
let currentLang = 'zh-HK';
let totalStars = 0;
let availableVoices = [];
let speakTimer = null;

// Safe default animation hooks in case WebGL / CDN is offline
window.triggerBearCelebrate = function() {};
window.triggerBearEncourage = function() {};

function loadVoices() {
  if ('speechSynthesis' in window) {
    availableVoices = window.speechSynthesis.getVoices();
  }
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function setLanguage(lang) {
  currentLang = lang;
  document.getElementById('lang-hk').classList.toggle('active', lang === 'zh-HK');
  document.getElementById('lang-cn').classList.toggle('active', lang === 'zh-CN');
  const greeting = lang === 'zh-HK'
    ? '已切換到廣東話發音！熊熊老師陪你一齊練習寫生日卡！'
    : '已切换到普通话发音！熊熊老师陪你一起练习写生日卡！';
  setBearMessage(greeting, true);
}

function speakText(text) {
  if (!('speechSynthesis' in window) || !text) return;
  try {
    if (speakTimer) clearTimeout(speakTimer);
    window.speechSynthesis.cancel();
    const clean = String(text)
      .replace(/[🔊⭐🎉🐻🏆✏️🔍🕵️🧱🖨️🔄🏠💯🌟💪❓📝🎯]/g, '')
      .replace(/□□/g, '空兩格');

    speakTimer = setTimeout(() => {
      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang = currentLang;
      utter.rate = 0.92;
      utter.pitch = 1.06;

      if (!availableVoices.length) loadVoices();
      let voice = null;
      if (currentLang === 'zh-HK') {
        voice = availableVoices.find(v => /zh[-_]HK|yue/i.test(v.lang))
             || availableVoices.find(v => /hong kong|cantonese|粵/i.test(v.name));
      } else {
        voice = availableVoices.find(v => /zh[-_]CN|cmn/i.test(v.lang) && !/HK/i.test(v.lang))
             || availableVoices.find(v => /mandarin|putonghua|普通話|普通话|ting/i.test(v.name))
             || availableVoices.find(v => /zh[-_]TW/i.test(v.lang));
      }
      if (voice) utter.voice = voice;
      window.speechSynthesis.speak(utter);
    }, 40);
  } catch (e) {}
}

function setBearMessage(msg, autoSpeak = false) {
  const el = document.getElementById('bear-msg');
  if (el) el.textContent = msg;
  if (autoSpeak) speakText(msg);
}

function addStars(n) {
  totalStars += n;
  document.getElementById('total-stars').textContent = totalStars;
}

function shuffleArray(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function triggerCleanPrint() {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      window.print();
    });
  });
}

          '记得写生日卡五宝：收卡人、祝福语、关系、送卡人和日期哦！',
          '写给长辈记得用“您”和加“敬上”，你真棒！'
        ];
        const pool = currentLang === 'zh-HK' ? cheersHK : cheersCN;
        setBearMessage(pool[Math.floor(Math.random() * pool.length)], true);
      }
      dragging = false;
    });

    window.addEventListener('resize', () => {
      if (!wrap.clientWidth) return;
      camera.aspect = wrap.clientWidth / wrap.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      world.rotation.y += (targetRotY - world.rotation.y) * 0.1;

      let jumpY = 0;
      if (threeState.celebrateTimer > 0) {
        threeState.celebrateTimer -= dt;
        jumpY = Math.abs(Math.sin(t * 11)) * 0.45;
      }
      bear.position.y = jumpY + Math.sin(t * 2.4) * 0.03;

      if (threeState.shakeTimer > 0) {
        threeState.shakeTimer -= dt;
        head.rotation.y = Math.sin(t * 22) * 0.25;
      } else {
        head.rotation.y = Math.sin(t * 1.2) * 0.1;
        head.rotation.z = Math.sin(t * 1.6) * 0.04;
      }

      if (threeState.waveTimer > 0) {
        threeState.waveTimer -= dt;
        rightArm.rotation.z = 2.15 + Math.sin(t * 14) * 0.35;
      } else {
        rightArm.rotation.z += (0 - rightArm.rotation.z) * 0.12;
      }

      balloons.forEach(b => {
        b.grp.position.y = b.baseY + Math.sin(t * 2.1 + b.phase) * 0.14;
        b.grp.rotation.z = Math.sin(t * 1.4 + b.phase) * 0.06;
      });

      flames.forEach((f, i) => {
        const s = 0.9 + Math.sin(t * 16 + i * 2) * 0.16;
        f.scale.set(0.8 * s, 1.45 * s, 0.8 * s);
      });

      for (let i = threeState.particles.length - 1; i >= 0; i--) {
        const p = threeState.particles[i];
        p.life -= dt;
        p.mesh.position.x += p.vx;
        p.mesh.position.y += p.vy;
        p.mesh.position.z += p.vz;
        p.vy -= 0.0038;
        p.mesh.rotation.x += p.vr;
        p.mesh.rotation.y += p.vr;
        if (p.life <= 0) {
          world.remove(p.mesh);
          threeState.particles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }
    animate();
  } catch (e) {
    showStageFallback(wrap);
  }
}

   ========================================================================= */
let currentView = 'home';

const L3_COLORS = ['#ff6b8b', '#4dabf7', '#20c997', '#9775fa', '#f59f00'];
const L3_SLOTS = [
  { key:'to', label:'1. 收卡人稱呼', cls:'' },
  { key:'body', label:'2. 祝福的話', cls:'' },
  { key:'rel', label:'3. 關係／自稱', cls:'align-rel' },
  { key:'from', label:'4. 送卡人名字', cls:'align-from' },
  { key:'date', label:'5. 日期', cls:'align-date' }
];

const state = {
  l1: { list: [], idx: 0, results: {}, answers: {}, awarded: {} },
  l2: { list: [], idx: 0, results: {}, answers: {}, optOrder: [], awarded: {} },
  l3: { list: [], idx: 0, results: {}, slotsByIdx: {}, poolByIdx: {}, checkedByIdx: {}, awarded: {} },
  l4: { list: [], idx: 0, results: {}, indentOn: true, draft: {}, grades: {}, awarded: {} },
  l5: { list: [], idx: 0, results: {}, draft: {}, grades: {}, awarded: {} }
};

function resetLevelSession(lvl) {
  if (lvl === 'l1') {
    state.l1 = { list: shuffleArray(L1_BANK).slice(0, 10), idx: 0, results: {}, answers: {}, awarded: {} };
  } else if (lvl === 'l2') {
    const picked = shuffleArray(L2_BANK).slice(0, 10);
    const optOrder = picked.map(() => shuffleArray([0, 1, 2, 3]));
    state.l2 = { list: picked, idx: 0, results: {}, answers: {}, optOrder, awarded: {} };
  } else if (lvl === 'l3') {
    const picked = shuffleArray(L3_BANK).slice(0, 10);
    state.l3 = { list: picked, idx: 0, results: {}, slotsByIdx: {}, poolByIdx: {}, checkedByIdx: {}, awarded: {} };
    picked.forEach((_, i) => prepareL3Question(i));
  } else if (lvl === 'l4') {
    state.l4 = { list: shuffleArray(L4_BANK).slice(0, 10), idx: 0, results: {}, indentOn: true, draft: {}, grades: {}, awarded: {} };
  } else if (lvl === 'l5') {
    state.l5 = { list: shuffleArray(L4_BANK).slice(0, 10), idx: 0, results: {}, draft: {}, grades: {}, awarded: {} };
  }
}

['l1','l2','l3','l4','l5'].forEach(resetLevelSession);

function switchView(view) {
  currentView = view;
  ['home','l1','l2','l3','l4','l5'].forEach(v => {
    const el = document.getElementById('tab-' + v);
    if (el) el.classList.toggle('active', v === view);
  });
  renderCurrentView();
}

function renderCurrentView() {
  if (currentView === 'home') renderHome();
  else if (currentView === 'l1') renderL1();
  else if (currentView === 'l2') renderL2();
  else if (currentView === 'l3') renderL3();
  else if (currentView === 'l4') renderL4();
  else if (currentView === 'l5') renderL5();
}

function speakCurrentQuestion(lvl) {
  const s = state[lvl];
  const q = s.list[s.idx];
  if (!q) return;
  if (lvl === 'l1') {
    speakText(`第一關第${s.idx + 1}題，請看看黃色標示的部分，選出它代表生日卡的哪一個部分。`);
  } else if (lvl === 'l2') {
    speakText(q.prompt);
  } else if (lvl === 'l3') {
    speakText(`第三關，請砌出一張生日卡：${q.title}`);
  } else if (lvl === 'l4') {
    speakText(`寫作題目：${q.prompt}`);
  } else if (lvl === 'l5') {
    speakText(q.prompt);
  }
}

function renderDots(lvl) {
  const s = state[lvl];
  return `<div class="progress-dots">${s.list.map((_, i) => {
    const r = s.results[i];
    const cls = (i === s.idx ? 'current ' : '') + (r === true ? 'done-ok' : r === false ? 'done-err' : '');
    return `<div class="p-dot ${cls}" onclick="jumpQuestion('${lvl}', ${i})">${i + 1}</div>`;
  }).join('')}</div>`;
}

function jumpQuestion(lvl, i) {
  state[lvl].idx = i;
  renderCurrentView();
}

  const q = s.list[s.idx];

function pickL3Block(poolIdx) {
  const s = state.l3;
  const i = s.idx;
  if (s.checkedByIdx[i]) return;
  const slots = s.slotsByIdx[i];
  const emptyIdx = slots.findIndex(v => v === null);
  if (emptyIdx === -1) return;
  slots[emptyIdx] = s.poolByIdx[i][poolIdx];
  renderL3();
}

function removeL3Slot(slotIdx) {
  const s = state.l3;
  const i = s.idx;
  if (s.checkedByIdx[i] || !s.slotsByIdx[i][slotIdx]) return;
  s.slotsByIdx[i][slotIdx] = null;
  renderL3();
}

function checkL3() {
  const s = state.l3;
  const i = s.idx;
  const slots = s.slotsByIdx[i];
  if (slots.some(v => v === null)) {
    setBearMessage('仲有空格未放積木呀，放齊 5 塊再檢查啦！', true);
    return;
  }
  const ok = slots.every((item, k) => item.key === L3_SLOTS[k].key);
  s.results[i] = ok;
  s.checkedByIdx[i] = true;

  if (ok) {
    if (!s.awarded[i]) {
      s.awarded[i] = true;
      addStars(2);
    }
    window.triggerBearCelebrate();
    setBearMessage('嘩！五個位置全部砌啱，完美梯級排版！', true);
  } else {
    window.triggerBearEncourage();
    setBearMessage('有幾塊積木排錯位呀，試下點清空重砌，再檢查一次！', true);
  }
  renderL3();
}

function evaluateStructuredCard(q, to, body, hasIndent, rel, from, date, extraNote) {
  const checks = [];
  let score = 0;

  // 1. Recipient & colon
  const ok1 = to.includes(q.recipient) && /[：:]\s*$/.test(to.trim());
  if (ok1) score++;
  checks.push({
    ok: ok1,
    text: ok1
      ? `✅ 上款正確寫出「${q.recipient}」及冒號`
      : `❌ 上款需包含收卡人「${q.recipient}」並以冒號（：）結尾`
  });

  // 2. Indent
  const ok2 = hasIndent && body.trim().length > 0;
  if (ok2) score++;
  checks.push({
    ok: ok2,
    text: ok2
      ? '✅ 正文開頭已正確空兩格（□□）'
      : '❌ 正文開頭記得空兩格（可用兩個全形空格、□□ 或 XX）並寫上祝福內容'
  });

  // 3. Blessing & 您/你
  const hasBless = /(生日快樂|快樂|健康|開心|平安|幸福|進步|順利|如意|長大|美麗|愛您|愛你|長命百歲|笑口常開|心想事成)/.test(body);
  const pronounOk = q.elder ? (body.includes('您') && !body.includes('你')) : (!body.includes('您'));
  const ok3 = hasBless && pronounOk;
  if (ok3) score++;
  let msg3 = '';
  if (ok3) {
    msg3 = `✅ 祝福語切題，而且正確使用${q.elder ? '尊稱「您」' : '平輩「你」'}`;
  } else if (!hasBless) {
    msg3 = '❌ 正文請寫上生日祝福語（例如：祝您／你生日快樂！）';
  } else if (q.elder) {
    msg3 = body.includes('你')
      ? '❌ 寫給長輩請把「你」改為尊稱「您」'
      : '❌ 寫給長輩請記得在祝福語中使用尊稱「您」（例如：祝您生日快樂！）';
  } else {
    msg3 = '❌ 寫給平輩用「你」即可，不用「您」';
  }
  checks.push({ ok: ok3, text: msg3 });

  // 4. Relation
  const ok4 = rel.includes(q.relation);
  if (ok4) score++;
  checks.push({
    ok: ok4,
    text: ok4
      ? `✅ 關係／自稱正確寫出「${q.relation}」`
      : `❌ 審題提示：送卡人關係／自稱應為「${q.relation}」`
  });

  // 5. Sender & 敬上
  const hasSender = from.includes(q.sender);
  const hasJing = from.includes('敬上');
  const ok5 = hasSender && (q.elder ? hasJing : !hasJing);
  if (ok5) score++;
  checks.push({
    ok: ok5,
    text: ok5
      ? `✅ 下款名字「${q.sender}」及敬詞運用完全正確`
      : !hasSender
        ? `❌ 下款請寫上題目指定的送卡人名字「${q.sender}」`
        : (q.elder ? '❌ 寫給長輩時，名字後面要加上「敬上」' : '❌ 寫給平輩同學／朋友，名字後面不用寫「敬上」')
  });

  // 6. Chinese Date
  const cleanDate = date.trim().replace(/[。．.]$/, '');
  const ok6 = /^[一二三四五六七八九十]+月[一二三四五六七八九十廿卅]+日$/.test(cleanDate);
  if (ok6) score++;
  checks.push({
    ok: ok6,
    text: ok6
      ? `✅ 日期「${cleanDate}」符合中文數字格式`
      : '❌ 日期請用中文數字寫成「〇月〇日」（例如：十一月二日）'
  });

  if (extraNote) {
    checks.push({ ok: false, text: `💡 ${extraNote}` });
  }

  return { score, checks };
}

function gradeL4() {
  const s = state.l4;
  const i = s.idx;
  const q = s.list[i];
  saveL4Draft(q.id);
  const d = s.draft[q.id];
  const hasIndent = s.indentOn || /^(  | {2,}|□□|口口|XX|xx|\t)/.test(d.body);
  const res = evaluateStructuredCard(q, d.to, d.body, hasIndent, d.rel, d.from, d.date);

  const pass = res.score >= 5;
  s.results[i] = pass;
  if (pass) {
    if (!s.awarded[i]) {
      s.awarded[i] = true;
      addStars(3);
    }
    window.triggerBearCelebrate();
    setBearMessage(`太棒了！你在寫作題 #${q.id} 拿到 ${res.score} 分（滿分 6 分）！`, true);
  } else {
    window.triggerBearEncourage();
    setBearMessage(`得到 ${res.score} 分，看看熊熊老師的紅筆建議，改好再交卷吧！`, true);
  }

  const stamp = res.score === 6 ? '💯 滿分小作家！' : res.score >= 5 ? '🌟 非常優秀！' : '💪 繼續加油！';
  s.grades[i] = `
    <div class="feedback-box ${pass ? 'feedback-ok' : 'feedback-err'}">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <b>🐻 熊熊老師批改結果：${res.score} / 6 分</b>
        <span class="stamp-box">${stamp}</span>
      </div>
      <ul class="check-list">
        ${res.checks.map(c => `<li>${c.text}</li>`).join('')}
      </ul>
    </div>
  `;
  renderL4();
}

// --- LEVEL 4 & 5 PRINT: A4 PORTRAIT, 2 QUESTIONS PER PAGE, ONLY PROMPT + WRITING LINES ---
function printTwoPerPage(questionList) {
  const pages = [];
  for (let i = 0; i < questionList.length; i += 2) {
    pages.push(questionList.slice(i, i + 2));
  }

  const printRoot = document.getElementById('print-root');
  printRoot.innerHTML = pages.map(pair => `
    <div class="print-page clean-2up-page">
      ${pair.map(q => `
        <div class="clean-q-block">
          <div class="clean-q-title">寫作題目（#${q.id}）：${q.prompt}</div>
          <div class="clean-lines-wrap">
            <div class="clean-write-line"></div>
            <div class="clean-write-line"></div>
            <div class="clean-write-line"></div>
            <div class="clean-write-line"></div>
            <div class="clean-write-line"></div>
            <div class="clean-write-line"></div>
            <div class="clean-write-line"></div>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');

  setBearMessage('已準備好 A4 直向每頁 2 題的簡潔答題線練習紙，正在開啟列印！', true);
  triggerCleanPrint();
}

/* =========================================================================
   10. ULTIMATE LEVEL 5: NO HINTS, NO ROW SELECTORS, SMART LINE PARSER
   ========================================================================= */
function renderL5() {
  const s = state.l5;
  const i = s.idx;
  const q = s.list[i];
  const textVal = s.draft[q.id] || '';
  const panel = document.getElementById('main-panel');

  panel.innerHTML = `
    <div class="quiz-head">
      <div>
        <h2 style="margin:0;font-size:21px;color:#6741d9;">🏆 終極第五關：無提示寫作大考驗（第 ${i + 1} / 10 題・寫作 #${q.id}）</h2>
        <small style="color:var(--muted);">沒有提示、沒有分行框，完全靠自己獨立完成一張完整的生日卡！</small>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-sunny btn-sm" onclick="speakCurrentQuestion('l5')">🔊 聽老師讀題</button>
        <button class="btn btn-blue btn-sm" onclick="printTwoPerPage(state.l5.list)">🖨️ 列印本組試卷（A4每頁2題）</button>
        <button class="btn btn-gray btn-sm" onclick="resetLevelSession('l5');renderL5();setBearMessage('終極第五關已重新抽出 10 條考題！',true);">🔄 重新抽 10 題</button>
      </div>
    </div>

    ${renderDots('l5')}

    <div class="prompt-banner" style="border-color:#b197fc;background:linear-gradient(135deg,#f3f0ff,#fff9db);color:#4c1d95;">
      ${q.prompt}
    </div>

    <div class="exam-paper">
      <textarea
        id="l5-answer"
        class="lined-textarea"
        placeholder="請在橫線上直接寫出整張生日卡..."
        oninput="state.l5.draft[${q.id}] = this.value"
      >${escapeHtml(textVal)}</textarea>
    </div>

    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-purple" onclick="gradeL5()">🐻 提交給熊熊老師批改</button>
      <button class="btn btn-gray" onclick="clearL5Draft(${i}, ${q.id})">🧹 清空重寫</button>
      ${i < 9
        ? `<button class="btn btn-teal" onclick="jumpQuestion('l5', ${i + 1})">下一題 ➡️</button>`
        : `<button class="btn btn-sunny" onclick="switchView('home')">返回首頁 🏠</button>`}
    </div>

    <div id="l5-grade-area">${s.grades[i] || ''}</div>
  `;
}

function clearL5Draft(i, qid) {
  state.l5.draft[qid] = '';
  state.l5.grades[i] = '';
  renderL5();
}

function gradeL5() {
  const s = state.l5;
  const i = s.idx;
  const q = s.list[i];
  const raw = document.getElementById('l5-answer').value || '';
  s.draft[q.id] = raw;

  const lines = raw.split(/\r?\n/).filter(l => l.trim().length > 0);
  if (lines.length < 2) {
    setBearMessage('請先分行寫出完整的生日卡再交卷喔！', true);
    return;
  }

  const line1 = lines[0].trim();
  const working = lines.slice(1);

  // Smartly detect if last line is a date (avoid eating sender name if date omitted)
  let dateLine = '';
  const lastCandidate = working[working.length - 1].trim();
  if (/[月日\/\-\d]/.test(lastCandidate) && lastCandidate.length <= 14) {
    dateLine = working.pop().trim();
  }

  let bodyRaw = '';
  let relLine = '';
  let fromLine = '';
  let extraNote = '';

  if (working.length >= 3) {
    fromLine = working[working.length - 1].trim();
    relLine = working[working.length - 2].trim();
    bodyRaw = working.slice(0, working.length - 2).join('\n');
  } else if (working.length === 2) {
    bodyRaw = working[0];
    const combinedSign = working[1].trim();
    relLine = combinedSign;
    fromLine = combinedSign;
    if (combinedSign.includes(q.relation) && combinedSign.includes(q.sender)) {
      extraNote = '排版小提示：送卡人的「關係」和「名字」記得要分開兩行呈梯級排列喔！';
    }
  } else if (working.length === 1) {
    bodyRaw = working[0];
  }

  const hasIndent = /^(  | {2,}|□□|口口|XX|xx|\t)/.test(bodyRaw);
  const res = evaluateStructuredCard(q, line1, bodyRaw, hasIndent, relLine, fromLine, dateLine, extraNote);

  const pass = res.score >= 5;
  s.results[i] = pass;

  if (pass) {
    if (!s.awarded[i]) {
      s.awarded[i] = true;
      addStars(5);
    }
    window.triggerBearCelebrate();
    setBearMessage(`終極大考驗成功！你獨立完成並拿到 ${res.score} 分（滿分 6 分）！`, true);
  } else {
    window.triggerBearEncourage();
    setBearMessage(`得到 ${res.score} 分，看看下面每一項檢查結果，改好就滿分啦！`, true);
  }

  const stamp = res.score === 6 ? '🏆 終極滿分王！' : res.score >= 5 ? '🌟 挑戰成功！' : '💪 再接再厲！';
  s.grades[i] = `
    <div class="feedback-box ${pass ? 'feedback-ok' : 'feedback-err'}">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <b>🐻 熊熊老師終極批改：${res.score} / 6 分</b>
        <span class="stamp-box">${stamp}</span>
      </div>
      <ul class="check-list">
        ${res.checks.map(c => `<li>${c.text}</li>`).join('')}
      </ul>
    </div>
  `;
  renderL5();
}

/* =========================================================================
   11. INITIALIZE APP
   ========================================================================= */
window.addEventListener('DOMContentLoaded', () => {
  initThreeStage();
  renderHome();
});
</script>
