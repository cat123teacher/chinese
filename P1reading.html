<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 小朋友閱讀大挑戰 🌟</title>
<style>
    :root {
        --primary: #FF9A9E;
        --secondary: #FECFEF;
        --accent: #A18CD1;
        --bg: #FDFBFB;
        --text: #333;
        --correct: #84E7B2;
        --wrong: #FFB3B3;
    }
    body {
        font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', '微軟正黑體', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        text-align: center;
        background-image: radial-gradient(#FECFEF 10%, transparent 11%), radial-gradient(#FECFEF 10%, transparent 11%);
        background-size: 40px 40px;
        background-position: 0 0, 20px 20px;
        overflow-x: hidden;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 25px;
        padding: 30px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        position: relative;
    }

    /* 左上角圖標設計 */
    .top-logo-bar {
        display: flex;
        justify-content: flex-start;
        margin-bottom: -20px;
    }
    .brand-logo {
        width: 75px;
        height: 75px;
        border-radius: 50%;
        border: 4px solid var(--accent);
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        object-fit: cover;
        z-index: 10;
        background-color: #fff;
    }

    h1 {
        color: var(--accent);
        font-size: 2.5em;
        text-shadow: 2px 2px 0px #fff;
        margin-top: 10px;
    }
    
    /* 進度記錄區 (Progress Record) */
    .progress-section {
        background: #FFF5F7;
        border: 3px dashed #FFB3B3;
        border-radius: 20px;
        padding: 20px;
        margin: 20px 0;
    }
    .progress-header {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-bottom: 15px;
    }
    .progress-header h2 {
        color: var(--accent);
        margin: 0;
    }
    .clear-btn {
        background: #FF6B6B;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 15px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.1s;
    }
    .clear-btn:active { transform: scale(0.95); }
    
    .stars-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
    }
    .star-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 60px;
    }
    .star-label {
        font-size: 0.9em;
        color: #777;
        font-weight: bold;
    }
    .star {
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .star.dim {
        font-size: 1.8em;
        color: #ccc;
        filter: grayscale(100%);
    }
    .star.lit {
        font-size: 3em;
        color: #FFD700;
        text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        transform: scale(1.1);
        animation: pop 0.5s ease-out;
    }
    @keyframes pop {
        0% { transform: scale(0); }
        80% { transform: scale(1.3); }
        100% { transform: scale(1.1); }
    }

    /* 首頁關卡網格 */
    #level-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 20px;
    }
    .level-btn {
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        border: none;
        border-radius: 15px;
        padding: 20px 10px;
        font-size: 1.1em;
        font-weight: bold;
        color: #fff;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
    }
    .level-btn:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 8px 20px rgba(255, 154, 158, 0.6);
    }
    .level-btn.completed {
        background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
    }
    
    /* 返回主連結按鈕 */
    .return-main-btn {
        display: inline-block;
        margin-top: 40px;
        padding: 15px 40px;
        background: linear-gradient(135deg, #A18CD1 0%, #FBC2EB 100%);
        color: white;
        text-decoration: none;
        font-size: 1.4em;
        font-weight: bold;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(161, 140, 209, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .return-main-btn:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 8px 25px rgba(161, 140, 209, 0.6);
    }

    /* 遊戲畫面 */
    #game-screen { display: none; }
    
    /* 文章閱讀區 */
    #reading-area {
        background: #fff;
        border: 4px dashed var(--secondary);
        border-radius: 20px;
        padding: 25px;
        margin-bottom: 25px;
    }
    
    /* 點擊提示特效 */
    #story-image {
        max-width: 100%;
        max-height: 400px;
        border-radius: 15px;
        object-fit: contain;
        margin-bottom: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        cursor: pointer; /* 鼠標變成點擊手勢 */
        transition: transform 0.2s, box-shadow 0.2s;
    }
    #story-image:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    
    /* 圖片放大的模態框 (Modal) 樣式 */
    #image-modal {
        display: none; 
        position: fixed; 
        z-index: 10000; 
        padding-top: 40px; 
        left: 0;
        top: 0;
        width: 100%; 
        height: 100%; 
        overflow: auto; 
        background-color: rgba(0,0,0,0.85); /* 半透明黑色背景 */
        backdrop-filter: blur(5px);
        cursor: pointer; /* 點擊任意處可關閉 */
    }
    .modal-content {
        margin: auto;
        display: block;
        max-width: 95%;
        max-height: 85vh;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        animation: zoomIn 0.3s ease;
        object-fit: contain;
    }
    .close-modal {
        position: absolute;
        top: 15px;
        right: 35px;
        color: #f1f1f1;
        font-size: 50px;
        font-weight: bold;
        transition: 0.3s;
    }
    .close-modal:hover,
    .close-modal:focus {
        color: #FF9A9E;
        text-decoration: none;
        cursor: pointer;
    }
    .modal-tip {
        color: white;
        text-align: center;
        margin-top: 15px;
        font-size: 1.2em;
        font-weight: bold;
        letter-spacing: 2px;
    }
    @keyframes zoomIn {
        from {transform: scale(0.8); opacity: 0;}
        to {transform: scale(1); opacity: 1;}
    }

    #story-text-container {
        background: #FDFBFB;
        border-radius: 15px;
        padding: 20px;
        border: 2px solid #E2E2EC;
    }
    .story-line {
        display: flex;
        align-items: flex-start;
        text-align: left;
        gap: 12px;
        margin-bottom: 15px;
        padding: 8px;
        border-radius: 10px;
        transition: background 0.2s;
    }
    .story-line:hover { background: #F4F4F9; }
    .story-text {
        font-size: 1.4em;
        line-height: 1.5;
        color: #444;
        margin-top: 3px;
    }

    /* 發音按鈕 */
    .audio-btn {
        background: #FFE259;
        border: none;
        border-radius: 50%;
        min-width: 50px;
        height: 50px;
        font-size: 1.2em;
        cursor: pointer;
        box-shadow: 0 4px 0 #D4B83C;
        transition: transform 0.1s;
        flex-shrink: 0;
    }
    .audio-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #D4B83C; }
    .mini-btn { min-width: 40px; height: 40px; font-size: 1em; box-shadow: 0 3px 0 #D4B83C; }
    
    /* 題目與導航區 */
    .question-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f1e9ff;
        padding: 10px 20px;
        border-radius: 15px;
        margin-bottom: 15px;
    }
    .progress-text { font-size: 1.3em; font-weight: bold; color: var(--accent); }
    
    .question-box {
        background: #fff;
        border: 4px solid var(--secondary);
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 20px;
        font-size: 1.6em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
    }
    .options-grid { display: flex; flex-direction: column; gap: 15px; }
    .option-box {
        display: flex;
        align-items: center;
        background: #F4F4F9;
        border: 3px solid #E2E2EC;
        border-radius: 15px;
        padding: 15px 25px;
        font-size: 1.4em;
        cursor: pointer;
        transition: all 0.2s;
        gap: 15px;
        text-align: left;
    }
    .option-box:hover { background: #E8E8FE; border-color: var(--accent); }
    .option-box.correct { background: var(--correct); border-color: #5BC994; color: white; }
    .option-box.wrong { background: var(--wrong); border-color: #E58D8D; color: white; }
    
    #feedback { font-size: 2em; font-weight: bold; margin-top: 20px; min-height: 50px; }

    /* 題目下方的獨立導航按鈕 */
    .q-nav-bar {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 2px dashed #ddd;
    }
    .q-nav-btn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 15px;
        font-size: 1.2em;
        font-weight: bold;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
    }
    .q-nav-btn:active { transform: scale(0.95); }
    .q-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; background: #ccc; }
    .q-nav-home { background: #FF9A9E; }

    /* 結算頁面專屬按鈕 */
    .settlement-btns {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
    }

    /* 最下方社群媒體連結區 */
    .brand-footer {
        margin-top: 40px;
        padding-top: 25px;
        border-top: 3px dashed var(--secondary);
        text-align: center;
    }
    .brand-footer h3 { color: var(--accent); font-size: 1.5em; margin-bottom: 15px; }
    .social-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; font-size: 1.1em; }
    .social-links a {
        color: #FF758C; text-decoration: none; font-weight: bold;
        padding: 5px 10px; background: #FFF0F2; border-radius: 10px; transition: all 0.2s;
    }
    .social-links a:hover { background: #FF9A9E; color: #fff; }
    .social-links span { color: #FF758C; font-weight: bold; padding: 5px 10px; background: #FFF0F2; border-radius: 10px; }

    /* 視覺特效：碎紙花 */
    .confetti {
        position: fixed;
        top: -10px;
        width: 15px;
        height: 15px;
        z-index: 9999;
        animation: fall linear forwards;
        border-radius: 2px;
    }
    @keyframes fall {
        to { transform: translateY(100vh) rotate(720deg); }
    }

</style>
</head>

<div class="container">

</div>

// 狀態變數
let currentSessionQs = [];
let currentQIndex = 0;
let currentLevelLang = 'zh';
let currentLevelId = 0;
let maxUnlockedQIndex = 0; 

// 從 LocalStorage 載入進度
let completedLevels = JSON.parse(localStorage.getItem('teachercat_progress')) || [];

// 1. 介面初始化與星星進度渲染
function initHome() {
    renderProgress();
    const grid = document.getElementById("level-grid");
    grid.innerHTML = "";
    gameData.forEach(level => {
        const btn = document.createElement("button");
        btn.className = `level-btn ${completedLevels.includes(level.id) ? 'completed' : ''}`;
        btn.innerText = level.title;
        btn.onclick = () => startLevel(level.id);
        grid.appendChild(btn);
    });
}

function renderProgress() {
    const container = document.getElementById("stars-display");
    container.innerHTML = "";
    for (let i = 1; i <= 20; i++) {
        let isDone = completedLevels.includes(i);
        container.innerHTML += `
            <div class="star-wrapper">
                <span class="star ${isDone ? 'lit' : 'dim'}">${isDone ? '⭐' : '✰'}</span>
                <span class="star-label">${i}</span>
            </div>
        `;
    }
}

function clearProgress() {
    if(confirm("確定要清除所有學習記錄和星星嗎？")) {
        completedLevels = [];
        localStorage.removeItem('teachercat_progress');
        initHome();
    }
}

// 2. 音效與視覺特效系統
function playCorrectSound() {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
        osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.3);
        
        gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1);
        
        osc.connect(gainNode);
        gainNode.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 1);
    } catch(e) {
        console.log("Audio not supported");
    }
}

function showConfetti() {
    const colors = ['#FF9A9E', '#A18CD1', '#84E7B2', '#FFE259', '#FFD700', '#FF758C'];
    for(let i = 0; i < 40; i++) {
        let conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
        conf.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 4000);
    }
}

// 語音朗讀
function playAudio(text, event, isFeedback = false) {
    if (event) event.stopPropagation();
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = currentLevelLang === 'en' ? 'en-US' : 'zh-HK';
        msg.rate = 0.85; 
        window.speechSynthesis.speak(msg);
    }
}

// 開啟/關閉圖片放大模態框的功能
function openModal() {
    const modal = document.getElementById("image-modal");
    const modalImg = document.getElementById("expanded-image");
    const storyImg = document.getElementById("story-image");
    modal.style.display = "block";
    modalImg.src = storyImg.src; 
}

function closeModal() {
    document.getElementById("image-modal").style.display = "none";
}

// 3. 遊戲流程控制
function startLevel(levelId) {
    currentLevelId = levelId;
    const level = gameData.find(l => l.id === levelId);
    currentLevelLang = level.lang;
    maxUnlockedQIndex = 0; 
    
    document.getElementById("level-title").innerText = level.title;
    document.getElementById("story-image").src = level.image;
    
    let storyHtml = '';
    level.story.forEach(line => {
        let safeText = line.replace(/'/g, "\\'"); 
        storyHtml += `
            <div class="story-line">
                <button class="audio-btn mini-btn" onclick="playAudio('${safeText}', event)">🔊</button>
                <span class="story-text">${line}</span>
            </div>
        `;
    });
    document.getElementById("story-text-container").innerHTML = storyHtml;
    document.getElementById("reading-area").style.display = "block";
    document.getElementById("q-nav-bar").style.display = "flex";
    
    currentSessionQs = [...level.q].sort(() => 0.5 - Math.random()); 
    currentQIndex = 0;
    
    document.getElementById("home-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";
    
    renderQuestion();
}

function renderQuestion() {
    const qData = currentSessionQs[currentQIndex];
    const contentBox = document.getElementById("game-content");
    
    let shuffledOptions = qData.o.map((opt, index) => {
        return { text: opt, isCorrect: index === qData.a };
    });
    shuffledOptions.sort(() => Math.random() - 0.5); 

    let html = `
        <div class="question-header-bar">
            <div class="progress-text">題數: ${currentQIndex + 1} / ${currentSessionQs.length}</div>
        </div>
        <div class="question-box">
            <button class="audio-btn" onclick="playAudio('${qData.q.replace(/'/g, "\\'")}', event)">🔊</button>
            <span>${qData.q}</span>
        </div>
        <div class="options-grid" id="options-grid">
    `;
    
    shuffledOptions.forEach((optObj) => {
        html += `
            <div class="option-box" onclick="checkAnswer(${optObj.isCorrect}, this)">
                <button class="audio-btn" onclick="playAudio('${optObj.text.replace(/'/g, "\\'")}', event)">🔊</button>
                <span>${optObj.text}</span>
            </div>
        `;
    });
    
    html += `</div>`;
    contentBox.innerHTML = html;
    document.getElementById("feedback").innerText = "";
    
    updateNavButtons();
}

// 4. 導航按鈕邏輯
function updateNavButtons() {
    document.getElementById("btn-prev").disabled = (currentQIndex === 0);
    document.getElementById("btn-next").disabled = (currentQIndex >= maxUnlockedQIndex); 
}

function changeQuestion(step) {
    let newIndex = currentQIndex + step;
    if (step === 1 && currentQIndex >= maxUnlockedQIndex) {
        return;
    }
    
    if (newIndex >= 0 && newIndex < currentSessionQs.length) {
        currentQIndex = newIndex;
        renderQuestion();
    } else if (newIndex >= currentSessionQs.length && maxUnlockedQIndex >= currentSessionQs.length) {
        showCompletion();
    }
}

// 5. 判斷答案與結算
function checkAnswer(isCorrect, element) {
    const allOptions = document.querySelectorAll('.option-box');
    allOptions.forEach(opt => opt.style.pointerEvents = 'none');
    
    const feedback = document.getElementById("feedback");
    
    if (isCorrect) {
        element.classList.add("correct");
        
        let isNewUnlock = (currentQIndex === maxUnlockedQIndex);
        if (isNewUnlock) {
            maxUnlockedQIndex++; 
        }
        
        updateNavButtons();
        
        playCorrectSound();
        showConfetti();
        
        if (currentLevelLang === 'en') {
            feedback.innerText = "🎉 Correct! Great job!";
            playAudio("Correct! Great job!", null, true);
        } else {
            feedback.innerText = "🎉 答對了！好棒！";
            playAudio("答對了", null, true);
        }
        feedback.style.color = "#5BC994";
        
        if (isNewUnlock) {
            setTimeout(() => {
                if (currentQIndex === maxUnlockedQIndex - 1) {
                    currentQIndex++;
                    if (currentQIndex < currentSessionQs.length) {
                        renderQuestion();
                    } else {
                        showCompletion();
                    }
                }
            }, 2000);
        }
        
    } else {
        element.classList.add("wrong");
        if (currentLevelLang === 'en') {
            feedback.innerText = "💪 Oops! Try again!";
            playAudio("Try again", null, true);
        } else {
            feedback.innerText = "💪 哎呀！再試一次！";
            playAudio("再試一次", null, true);
        }
        feedback.style.color = "#FF8080";
        
        setTimeout(() => {
            element.classList.remove("wrong");
            feedback.innerText = "";
            allOptions.forEach(opt => opt.style.pointerEvents = 'auto');
        }, 1500);
    }
}

function showCompletion() {
    if (!completedLevels.includes(currentLevelId)) {
        completedLevels.push(currentLevelId);
        localStorage.setItem('teachercat_progress', JSON.stringify(completedLevels));
    }
    
    const contentBox = document.getElementById("game-content");
    const titleText = currentLevelLang === 'en' ? "Amazing! You got a Star!" : "太厲害了！你獲得了一顆大星星！";
    const nextText = currentLevelLang === 'en' ? "Back to Home" : "回到主頁";
    const retryText = currentLevelLang === 'en' ? "Re-challenge" : "重新挑戰這一關";
    
    document.getElementById("reading-area").style.display = "none";
    document.getElementById("q-nav-bar").style.display = "none";
    
    contentBox.innerHTML = `
        <div class="question-box" style="flex-direction: column; padding: 50px;">
            <div style="font-size: 5em; margin-bottom: 10px; animation: pop 0.5s;">⭐</div>
            <h2>${titleText}</h2>
            <div class="settlement-btns">
                <button class="level-btn" onclick="startLevel(${currentLevelId})">🔄 ${retryText}</button>
                <button class="level-btn" onclick="goHome()" style="background: var(--accent);">🏠 ${nextText}</button>
            </div>
        </div>
    `;
    
    playAudio(titleText, null, true);
    showConfetti();
}

function goHome() {
    document.getElementById("game-screen").style.display = "none";
    document.getElementById("home-screen").style.display = "block";
    window.speechSynthesis.cancel();
    initHome(); 
}

window.onload = initHome;

</script>
