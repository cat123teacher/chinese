<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <!-- 確保手機裝置正確縮放的 meta 標籤 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Letterland 英文拼音老虎機(3個字母)</title>
    <style>
        /* 基本重置，確保排版不會溢出 */
        * { box-sizing: border-box; }
        
        /* 糖果風活潑背景 */
        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            text-align: center;
            background: repeating-linear-gradient(
                45deg,
                #e0f7fa,
                #e0f7fa 20px,
                #b2ebf2 20px,
                #b2ebf2 40px
            );
            color: #333;
            margin: 0;
            padding: 15px;
            overflow-x: hidden; /* 防止手機橫向捲動 */
        }
        
        /* 跳動的彩虹標題 */
        h1 {
            font-size: 40px;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #fff, 5px 5px 0px rgba(0,0,0,0.1);
            line-height: 1.2;
        }
        h1 span:nth-child(1) { color: #f44336; }
        h1 span:nth-child(2) { color: #ff9800; }
        h1 span:nth-child(3) { color: #4caf50; }
        h1 span:nth-child(4) { color: #2196f3; }
        h1 span:nth-child(5) { color: #9c27b0; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .bouncing-title {
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        p.instruction {
            font-size: 20px;
            font-weight: bold;
            color: #00695c;
            background-color: rgba(255, 255, 255, 0.8);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px dashed #009688;
            line-height: 1.5;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            max-width: 100%;
        }
        
        /* 圓潤可愛的字母鎖定器 (加入 flex 自動換行) */
        .lock-panel {
            background: linear-gradient(135deg, #fff9c4, #ffecb3);
            border: 4px solid #ffb300;
            border-radius: 25px;
            padding: 15px;
            margin: 10px auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            max-width: 100%;
            font-size: 20px;
            font-weight: bold;
            color: #e65100;
            box-shadow: 0px 8px 0px #ffb300, 0px 12px 15px rgba(0,0,0,0.2);
        }
        .lock-panel select {
            font-size: 18px;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            padding: 5px 10px;
            border-radius: 12px;
            border: 3px solid #ff9800;
            cursor: pointer;
            background-color: white;
            color: #d32f2f;
            font-weight: bold;
            outline: none;
            box-shadow: inset 0px 2px 5px rgba(0,0,0,0.1);
        }

        /* 3D 玩具機台外觀 */
        .slot-machine {
            background: linear-gradient(to bottom, #ffe082, #ffca28);
            border: 12px solid #ff5252;
            border-radius: 40px;
            display: inline-block;
            padding: 25px 20px 30px 20px;
            box-shadow: 0px 15px 0px #d32f2f, 0px 25px 20px rgba(0,0,0,0.3);
            position: relative;
            margin-bottom: 20px;
            max-width: 100%;
            width: 100%;
            max-width: 550px; 
        }
        
        /* 專屬貓咪圖標 */
        .brand-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 0 15px #ffeb3b, 0 5px 10px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            background-color: white;
        }

        /* 紅、藍、綠 經典三色格子 */
        .slots {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .slot {
            width: 110px;
            height: 130px;
            background: white;
            border-radius: 20px;
            font-size: 90px;
            line-height: 130px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: inset 0px 8px 10px rgba(0,0,0,0.1), 0px 6px 0px rgba(0,0,0,0.2);
            user-select: none;
            -webkit-user-select: none;
        }
        #slot1 { border: 8px solid #ff1744; color: #d50000; }
        #slot2 { border: 8px solid #2979ff; color: #2962ff; }
        #slot3 { border: 8px solid #00e676; color: #00c853; }

        .slot:hover:not(.disabled) { transform: scale(1.05); }
        .slot:active:not(.disabled) { transform: scale(0.95); }
        .slot.disabled { cursor: default; }

        /* 轉動時的震動特效 */
        @keyframes slot-shake {
            0% { transform: translateY(0); }
            25% { transform: translateY(-8px); }
            50% { transform: translateY(8px); }
            75% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }
        .spinning-effect .slot:not(.locked) {
            animation: slot-shake 0.1s infinite;
            filter: blur(1px);
        }
        
        /* 果凍光澤大拉桿按鈕 */
        .pull-btn {
            font-size: 30px;
            padding: 15px 30px;
            cursor: pointer;
            background: linear-gradient(to bottom, #ff5252, #d32f2f);
            color: white;
            border: 3px solid #b71c1c;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0px 8px 0px #b71c1c, 0px 15px 20px rgba(0,0,0,0.3);
            text-shadow: 2px 2px 0px #b71c1c;
            transition: all 0.1s;
            max-width: 90%;
            -webkit-tap-highlight-color: transparent;
        }
        .pull-btn:active {
            transform: translateY(8px);
            box-shadow: 0px 0px 0px #b71c1c, 0px 5px 10px rgba(0,0,0,0.3);
        }
        .pull-btn:disabled {
            background: #bdbdbd;
            border-color: #9e9e9e;
            box-shadow: 0px 8px 0px #757575;
            color: #f5f5f5;
            text-shadow: none;
            cursor: not-allowed;
        }

        .action-btns {
            margin-top: 30px;
            display: none; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .action-btn {
            font-size: 20px;
            padding: 12px 20px;
            cursor: pointer;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 20px;
            font-weight: bold;
            color: white;
            display: inline-block;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
            flex: 1 1 auto;
        }
        .btn-sound { background: linear-gradient(to bottom, #66bb6a, #388e3c); box-shadow: 0px 6px 0px #2e7d32; }
        .btn-meaning { background: linear-gradient(to bottom, #42a5f5, #1976d2); box-shadow: 0px 6px 0px #1565c0; }
        .btn-dict { background: linear-gradient(to bottom, #ab47bc, #7b1fa2); box-shadow: 0px 6px 0px #4a148c; display: none; }
        
        .action-btn:active { transform: translateY(6px); box-shadow: 0px 0px 0px; }
        
        /* 中文解釋顯示區域 */
        #result-text {
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            min-height: 45px;
            background-color: white;
            border-radius: 15px;
            padding: 8px 15px;
            display: inline-block;
            border: 3px dashed #ff9800;
            max-width: 100%;
            word-wrap: break-word;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 🎵 專屬中文語音小按鈕 🎵 */
        .ch-sound-btn {
            font-size: 18px;
            padding: 6px 15px;
            cursor: pointer;
            background: linear-gradient(to bottom, #ffca28, #ff8f00);
            color: white;
            border: 2px solid #e65100;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0px 4px 0px #e65100;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
            transition: all 0.1s;
        }
        .ch-sound-btn:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #e65100;
        }

        /* 返回大冒險按鈕 */
        .return-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 25px;
            background: linear-gradient(to bottom, #00acc1, #00838f);
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 40px;
            border: 3px solid #006064;
            box-shadow: 0px 8px 0px #004d40, 0px 10px 15px rgba(0,0,0,0.2);
            text-shadow: 1px 1px 0px #004d40;
            transition: all 0.1s;
            max-width: 95%;
        }
        .return-btn:active {
            transform: translateY(8px);
            box-shadow: 0px 0px 0px #004d40;
        }

        /* 聯絡欄設計 */
        .contact-footer {
            margin-top: 35px;
            padding: 20px;
            background-color: #fff8e1;
            border-radius: 30px;
            border: 5px dashed #ffca28;
            display: inline-block;
            width: 100%;
            max-width: 850px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.1);
        }
        .contact-footer h3 {
            color: #f57f17;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
            text-shadow: 1px 1px 0px #ffe082;
        }
        .contact-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .contact-links a, .contact-links span {
            display: inline-block;
            background-color: white;
            padding: 8px 15px;
            border-radius: 20px;
            color: #00838f;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border: 3px solid #80deea;
            box-shadow: 0px 4px 0px #b2ebf2;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        /* 紙花特效畫布 */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* =========================================
           針對手機與小螢幕的專屬 RWD 響應式優化 
           ========================================= */
        @media (max-width: 600px) {
            h1 { font-size: 26px; }
            p.instruction { font-size: 16px; padding: 8px 15px; }
            .slot-machine {
                border-width: 8px; 
                padding: 15px 10px 20px 10px;
                border-radius: 25px;
            }
            .brand-icon {
                width: 60px; height: 60px;
                border-width: 3px; margin-bottom: 10px;
            }
            .slots { gap: 8px; margin-bottom: 15px; }
            .slot {
                width: 75px; height: 95px;
                font-size: 60px; line-height: 95px;
                border-width: 5px !important; border-radius: 12px;
            }
            .pull-btn { font-size: 22px; padding: 10px 20px; }
            .action-btn { font-size: 16px; padding: 8px 10px; }
            #result-text { font-size: 20px; padding: 5px 10px; }
            .ch-sound-btn { font-size: 14px; padding: 4px 10px; } 
            .return-btn { font-size: 16px; padding: 12px 20px; }
            .contact-footer h3 { font-size: 18px; }
            .contact-links a, .contact-links span { font-size: 14px; padding: 6px 12px; }
            .lock-panel { font-size: 16px; padding: 10px; }
            .lock-panel select { font-size: 14px; padding: 2px 5px; }
        }
    </style>
</head>
<body>

        <span style="color:#f44336;">英</span><span style="color:#ff9800;">文</span><span style="color:#4caf50;">拼</span><span style="color:#2196f3;">音</span>老虎機(3個字母) <span>🎰</span>
    </h1>
    <br>
    <p class="instruction">
        🎯 可以在上方「鎖定」想要專注練習的字母<br>

        👆 點擊單一字母聽發音，再用「🔊 連續發音」拼讀 (Blending)！

    <!-- 字母鎖定器面板 -->
    <div class="lock-panel">
        <label>第1格: <select id="lock1"></select></label>
        <label>第2格: <select id="lock2"></select></label>

    </div>

    <div class="slot-machine" id="machineContainer">

        <img src="cat.jpeg" alt="Teacher Cat" class="brand-icon">
        
        <div class="slots" id="slotsArea">
            <div class="slot disabled" id="slot1" onclick="playLetterSound('slot1')">?</div>
            <div class="slot disabled" id="slot2" onclick="playLetterSound('slot2')">?</div>
            <div class="slot disabled" id="slot3" onclick="playLetterSound('slot3')">?</div>
        </div>
        
        <button class="pull-btn" id="spinBtn" onclick="startSpin()">🕹️ 拉動老虎機！</button>
        
        <div class="action-btns" id="actionBtns" style="display:none;">
            <button class="action-btn btn-sound" onclick="playWordSoundFast()">🔊 連續發音</button>
            <button class="action-btn btn-meaning" onclick="showMeaning()">📖 中文解釋</button>
            <button class="action-btn btn-dict" id="btnDict" onclick="playDictionarySound()">🗣️ 字典發音</button>
        </div>
        
        <!-- 解釋顯示區域 (結合按鈕) -->

    </div>

    <br>
    <!-- 返回按鈕 -->

        <a href="https://cat123teacher.github.io/chinese/main.html" class="return-btn">🚀 返回小朋友學習大冒險</a>
    </div>

    <!-- 社群聯絡欄 -->
    <div class="contact-footer">
        <h3>✨ Teacher Cat 的快樂AI教室 ✨</h3>
        <div class="contact-links">
            <a href="https://www.youtube.com/@TeacherCat123" target="_blank">▶️ YouTube</a>

            <a href="https://xhslink.com/m/5UQtqPpcsWK" target="_blank">📕 小紅書</a>
            <span>🎵 抖音: 74254902683</span>
        </div>
    </div>

    <script>
        const alphabet = "abcdefghijklmnopqrstuvwxyz".split("");
        
        // --- ★ 小朋友專屬：高頻詞與常用 CVC 字庫 (約150字) ★ ---
        const commonKidsWords = [
            "act","add","age","air","all","and","ant","any","ape","are","arm","art","ask","ate",
            "bad","bag","bat","bed","bee","beg","big","bin","bit","box","boy","bug","bus","but","buy","bye",
            "can","cap","car","cat","cow","cry","cub","cup","cut",
            "dad","day","did","die","dig","dip","dog","dry",
            "ear","eat","egg","end","eye",
            "fan","far","fat","few","fit","fly","fog","for","fox","fun",
            "get","god","got","gum","gun","gym",
            "had","hat","hen","her","hid","him","his","hit","hot","how","hug","ice","ill","ink",
            "jam","jar","jaw","jet","job","jog","joy","key","kid",
            "lay","leg","let","lie","lip","log","lot","low",
            "mad","man","map","mat","may","men","mix","mom","moo","mud","mug","mum",
            "net","new","nod","not","now","nut","oak","off","oil","old","one","out","owl","own",
            "pan","pay","pea","pen","pet","pie","pig","pin","pot","put",
            "rag","ran","rat","red","rib","rub","run",
            "sad","saw","say","sea","see","set","she","sit","six","sky","son","sun",
            "tea","ten","tie","toe","top","toy","try","tub","two","use","van","vet",
            "war","was","wax","way","web","wet","who","why","win","wow","yes","yet","you","zoo"
        ];

        // 初始化下拉選單
        window.onload = function() {
            const selects = ['lock1', 'lock2', 'lock3'];
            selects.forEach(id => {
                const el = document.getElementById(id);
                el.innerHTML = '<option value="?">🎲 隨機</option>';
                alphabet.forEach(letter => {
                    el.innerHTML += `<option value="${letter}">${letter}</option>`;
                });
            });
            initCanvas(); 
        };

        // ====== 特效與音效系統 (Web Audio API) ======
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let spinTickInterval;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if(audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol=0.1) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startSpinSound() {
            initAudio();
            let freq = 300;
            spinTickInterval = setInterval(() => {
                playTone(freq, 'triangle', 0.05, 0.05);
                freq = freq === 300 ? 400 : 300; 
            }, 100);
        }

        function stopSpinSound() {
            clearInterval(spinTickInterval);
        }

        function playWinSound() {
            setTimeout(() => playTone(523.25, 'sine', 0.3, 0.2), 0);   
            setTimeout(() => playTone(659.25, 'sine', 0.3, 0.2), 150); 
            setTimeout(() => playTone(783.99, 'sine', 0.3, 0.2), 300); 
            setTimeout(() => playTone(1046.50, 'sine', 0.6, 0.3), 450); 
        }

        function playNeutralSound() {
            setTimeout(() => playTone(300, 'square', 0.2, 0.05), 0);
            setTimeout(() => playTone(250, 'square', 0.4, 0.05), 150);
        }

        // ====== 紙花大噴發特效 ======
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        function fireConfetti() {
            particles = [];
            let isMobile = window.innerWidth < 600;
            let confettiCount = isMobile ? 80 : 150; 
            
            for(let i=0; i<confettiCount; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100, 
                    r: Math.random() * 8 + 4,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -15 - 10,
                    color: `hsl(${Math.random()*360}, 100%, 50%)`,
                    tilt: Math.random() * 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            particles.forEach(p => {
                p.tiltAngle += p.tiltAngleInc;
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.5; 
                p.tilt = Math.sin(p.tiltAngle) * 15;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();

                if(p.y < canvas.height) active = true;
            });
            if(active) {
                requestAnimationFrame(updateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        let currentWord = "";
        let isSpinning = false;
        let currentAudio = null; 

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("actionBtns").style.display = "none";
            document.getElementById("result-text").style.display = "none";
            document.getElementById("result-text").innerHTML = "";
            
            const spinBtn = document.getElementById("spinBtn");
            spinBtn.disabled = true; 
            
            startSpinSound();
            document.getElementById("machineContainer").classList.add("spinning-effect");

            // 處理格子外觀與鎖定狀態
            const l1 = document.getElementById("lock1").value;
            const l2 = document.getElementById("lock2").value;
            const l3 = document.getElementById("lock3").value;

            document.querySelectorAll('.slot').forEach(el => {
                el.classList.add('disabled');
                el.classList.remove('locked');
            });
            if(l1 !== '?') document.getElementById("slot1").classList.add('locked');
            if(l2 !== '?') document.getElementById("slot2").classList.add('locked');
            if(l3 !== '?') document.getElementById("slot3").classList.add('locked');

            // --- 機率分配核心邏輯 ---
            const allWords = Object.keys(wordDictionary);
            const validWords = allWords.filter(w => {
                return (l1 === '?' || w.charAt(0) === l1) &&
                       (l2 === '?' || w.charAt(1) === l2) &&
                       (l3 === '?' || w.charAt(2) === l3);
            });

            const abbrWords = validWords.filter(w => wordDictionary[w].includes("簡寫"));
            const normalWords = validWords.filter(w => !wordDictionary[w].includes("簡寫"));
            const commonWords = normalWords.filter(w => commonKidsWords.includes(w));
            const otherWords = normalWords.filter(w => !commonKidsWords.includes(w));

            let targetWord = "";
            const rand = Math.random();

            if (rand < 0.70) {
                if (commonWords.length > 0) targetWord = commonWords[Math.floor(Math.random() * commonWords.length)];
                else if (otherWords.length > 0) targetWord = otherWords[Math.floor(Math.random() * otherWords.length)];
                else if (abbrWords.length > 0) targetWord = abbrWords[Math.floor(Math.random() * abbrWords.length)];
            } else if (rand < 0.90) {
                if (abbrWords.length > 0) targetWord = abbrWords[Math.floor(Math.random() * abbrWords.length)];
                else if (commonWords.length > 0) targetWord = commonWords[Math.floor(Math.random() * commonWords.length)];
                else if (otherWords.length > 0) targetWord = otherWords[Math.floor(Math.random() * otherWords.length)];
            } else {
                if (Math.random() < 0.5 && otherWords.length > 0) {
                    targetWord = otherWords[Math.floor(Math.random() * otherWords.length)];
                }
            }

            if (!targetWord) {
                targetWord = (l1 === '?' ? alphabet[Math.floor(Math.random() * 26)] : l1) +
                             (l2 === '?' ? alphabet[Math.floor(Math.random() * 26)] : l2) +
                             (l3 === '?' ? alphabet[Math.floor(Math.random() * 26)] : l3);
            }

            let spinCount = 0;
            const maxSpins = 20; 

            const spinInterval = setInterval(() => {
                document.getElementById("slot1").innerText = l1 === '?' ? alphabet[Math.floor(Math.random() * 26)] : l1;
                document.getElementById("slot2").innerText = l2 === '?' ? alphabet[Math.floor(Math.random() * 26)] : l2;
                document.getElementById("slot3").innerText = l3 === '?' ? alphabet[Math.floor(Math.random() * 26)] : l3;
                
                spinCount++;
                if (spinCount >= maxSpins) {
                    clearInterval(spinInterval);
                    
                    document.getElementById("slot1").innerText = targetWord.charAt(0);
                    document.getElementById("slot2").innerText = targetWord.charAt(1);
                    document.getElementById("slot3").innerText = targetWord.charAt(2);
                    
                    finishSpin(targetWord); 
                    spinBtn.disabled = false;
                }
            }, 100); 
        }

        function finishSpin(finalWord) {
            isSpinning = false;
            currentWord = finalWord;
            
            stopSpinSound();
            document.getElementById("machineContainer").classList.remove("spinning-effect");
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('disabled', 'locked'));
            document.getElementById("actionBtns").style.display = "flex";

            if (wordDictionary[currentWord]) {
                document.getElementById("btnDict").style.display = "inline-block";
                playWinSound();
                fireConfetti(); 
            } else {
                document.getElementById("btnDict").style.display = "none";
                playNeutralSound(); 
            }
        }

        function playLetterSound(slotId) {
            if (isSpinning) return;
            const letter = document.getElementById(slotId).innerText;
            if (letter === "?") return;

            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            currentAudio = new Audio(letter + '.mp3');
            currentAudio.playbackRate = 1.0; 
            currentAudio.play().catch(error => {
                alert("找不到音檔：" + letter + ".mp3！請確認音檔放在同一個資料夾。");
            });
        }

        // --- ⭐ 修改：連讀速度調整回 2 倍速 ⭐ ---
        function playWordSoundFast() {
            if (currentWord.length !== 3) return;

            let letters = currentWord.split("");
            let index = 0;

            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            function playNextLetter() {
                if (index < letters.length) {
                    currentAudio = new Audio(letters[index] + ".mp3");
                    currentAudio.playbackRate = 2.0; // 從 3.0 改回 2.0 倍速
                    currentAudio.onended = playNextLetter; 
                    currentAudio.play().catch(error => {
                        console.log("找不到音檔：" + letters[index] + ".mp3");
                        index++;
                        playNextLetter();
                    });
                    index++;
                }
            }
            playNextLetter();
        }

        function playDictionarySound() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                let utterance = new SpeechSynthesisUtterance(currentWord);
                utterance.lang = 'en-US'; 
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            } else {
                alert("你的瀏覽器不支援語音功能哦！");
            }
        }

        function playChineseSound(textToRead) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                let cleanText = textToRead.replace(/\(簡寫\)/g, ""); 
                let utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'zh-HK'; 
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            } else {
                alert("你的瀏覽器不支援語音功能哦！");
            }
        }

        function showMeaning() {
            const meaning = wordDictionary[currentWord];
            const resultBox = document.getElementById("result-text");
            resultBox.style.display = "flex";
            
            if (meaning) {
                resultBox.innerHTML = `
                    <span>${meaning}</span>
                    <button class="ch-sound-btn" onclick="playChineseSound('${meaning}')">📢 聽中文</button>
                `;
                resultBox.style.color = "#d84315"; 
                resultBox.style.borderColor = "#4caf50";
            } else {
                resultBox.innerHTML = "<span>没有解釋</span>";
                resultBox.style.color = "#9e9e9e"; 
                resultBox.style.borderColor = "#f44336";
            }
        }
