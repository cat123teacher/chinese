<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小一英文寫作大冒險 - Teacher Cat</title>
    <style>
        /* 動態漸層的鮮艷背景 */
        body { 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 300% 300%;
            animation: gradientBG 12s ease infinite;
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        #logo { position: fixed; top: 10px; left: 10px; width: 80px; height: 80px; border-radius: 50%; border: 3px solid #ff69b4; z-index: 1000; background-color: white; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        /* 容器半透明白底與虛線外框 */
        #game-container { background-color: rgba(255, 255, 255, 0.95); border-radius: 25px; box-shadow: 0 15px 25px rgba(0,0,0,0.15); width: 90%; max-width: 800px; padding: 30px; text-align: center; border: 6px dashed #ff9a9e; position: relative; margin-top: 50px; margin-bottom: 50px; box-sizing: border-box; }
        
        h1 { color: #ff69b4; font-size: 2.6em; text-shadow: 2px 2px #ffe4e1; margin-bottom: 5px; }
        
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 3px dashed #ffb6c1; padding-bottom: 10px; }
        .nav-btn { background-color: #ffb6c1; color: white; border: none; padding: 10px 15px; border-radius: 12px; font-size: 1.2em; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #ff69b4; margin: 5px; transition: transform 0.1s, box-shadow 0.1s; }
        .nav-btn:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }
        .nav-btn:disabled { background-color: #ccc; box-shadow: 0 5px 0 #999; cursor: not-allowed; }
        
        /* 學習重點頁面 */
        .intro-box { background-color: #fffacd; border: 4px dashed #ffd700; border-radius: 20px; padding: 20px; margin-bottom: 20px; text-align: left; font-size: 1.2em; line-height: 1.6; }
        .big-start-btn { background-color: #32cd32; color: white; font-size: 2em; padding: 20px 40px; border-radius: 25px; border: none; cursor: pointer; box-shadow: 0 8px 0 #228b22; font-weight: bold; animation: pulse 1.5s infinite; }
        .big-start-btn:active { transform: translateY(8px); box-shadow: 0 0 0 transparent; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Progress Record & 彩虹關卡按鈕 */
        .header-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .clear-btn { background-color: #ff4757; color: white; border: none; padding: 10px 15px; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 0 #ff1e3c; transition: all 0.2s; }
        .clear-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        
        .level-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; margin-top: 10px; }
        
        .level-btn { color: white; border: none; border-radius: 20px; padding: 15px 5px; font-size: 1.1em; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 140px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .level-btn:nth-child(5n+1) { background-color: #ff6b81; box-shadow: 0 6px 0 #d93853; } 
        .level-btn:nth-child(5n+2) { background-color: #70a1ff; box-shadow: 0 6px 0 #3b60c4; } 
        .level-btn:nth-child(5n+3) { background-color: #eccc68; box-shadow: 0 6px 0 #b3922e; color: #444; } 
        .level-btn:nth-child(5n+4) { background-color: #7bed9f; box-shadow: 0 6px 0 #3aae64; color: #333; } 
        .level-btn:nth-child(5n+5) { background-color: #a29bfe; box-shadow: 0 6px 0 #6c5ce7; } 
        
        .level-btn:hover { transform: scale(1.05) translateY(-3px); }
        .level-btn:active { transform: scale(1) translateY(6px); box-shadow: 0 0 0 transparent !important; }
        
        .star-small { font-size: 1.3em; text-shadow: 1px 1px 2px rgba(0,0,0,0.4); }
        .star-big { font-size: 2.2em; text-shadow: 0 0 15px gold; display: block; animation: shine 2s infinite; }
        @keyframes shine { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }

        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 遊戲選項 */
        .question-text { font-size: 2.2em; color: #333; font-weight: bold; margin: 20px 0; line-height: 1.4; }
        .options-grid { display: flex; flex-direction: column; gap: 15px; }
        .option-row { display: flex; align-items: center; gap: 10px; }
        .option-btn { background-color: #dda0dd; color: white; border: none; border-radius: 15px; padding: 15px 20px; font-size: 1.5em; cursor: pointer; flex-grow: 1; box-shadow: 0 5px 0 #ba55d3; text-align: left; font-weight: bold; transition: all 0.1s; }
        .option-btn:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }
        .audio-btn { background-color: #ffdab9; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 1.5em; cursor: pointer; box-shadow: 0 4px 0 #f4a460; flex-shrink: 0; display:flex; justify-content:center; align-items:center; transition: transform 0.1s; }
        .audio-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        
        #skip-btn { background-color: #ff8c00; color: white; font-size: 1.3em; font-weight: bold; padding: 12px; border-radius: 15px; border: none; cursor: pointer; margin-top: 15px; box-shadow: 0 5px 0 #cd6600; display: none; width: 100%; transition: all 0.1s; }
        #skip-btn:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }

        #hint-box { display: none; background-color: #fff3cd; border: 4px solid #ffecb5; border-radius: 20px; padding: 15px; margin-top: 20px; color: #856404; font-size: 1.2em; text-align: left; position: relative; }

        .summary-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 20px; }
        .sum-box { padding: 15px; border-radius: 15px; font-size: 1.2em; color: white; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .sum-correct { background-color: #2ed573; }
        .sum-wrong { background-color: #ff4757; cursor: pointer; box-shadow: 0 5px 0 #cc3700; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        #footer { width: 100%; background-color: rgba(255, 255, 255, 0.9); border-top: 4px dashed #ff9a9e; text-align: center; padding: 15px 10px; font-size: 0.9em; margin-top: auto; box-sizing: border-box; }
        #footer a { color: #1e90ff; text-decoration: none; margin: 0 5px; font-weight: bold; }
        
        .main-adventure-btn { display: block; margin: 30px auto 0 auto; background-color: #20b2aa; color: white; font-size: 1.5em; padding: 15px 30px; border-radius: 20px; text-decoration: none; font-weight: bold; box-shadow: 0 6px 0 #008b8b; width: fit-content; transition: all 0.2s; }
        .main-adventure-btn:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }
        
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
        .confetti { position: fixed; width: 15px; height: 15px; z-index: 2000; animation: fall 2.5s linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
    </style>
</head>

    </div>

    <!-- 學習重點預習頁 (Intro Screen) -->
    <div id="intro-screen" class="screen">
        <h1 id="intro-title" style="font-size: 2em; color: #ff8c00;">Level</h1>
        <div class="intro-box">
            <h3 style="display:flex; align-items:center;">📖 Language Focus：
                <button class="audio-btn" style="width:35px; height:35px; font-size:1em; margin-left:10px;" onclick="playText(document.getElementById('intro-focus').innerText)">🔊</button>
            </h3>
            <p id="intro-focus"></p>
            <h3>💡 Examples：</h3>
            <ul id="intro-examples" style="list-style: none; padding-left: 0;"></ul>
        </div>
        <button class="big-start-btn" onclick="executeStartGame()">🚀 Start Game</button>
        <br><br>
        <button class="nav-btn" onclick="showScreen('home-screen')">🏠 Home</button>
    </div>

    <!-- 遊戲頁面 -->
    <div id="game-screen" class="screen">
        <div class="nav-bar" id="game-nav">
            <button class="nav-btn" id="btn-prev" onclick="prevQuestion()">◀ Back</button>
            <button class="nav-btn" id="btn-home" onclick="showScreen('home-screen')">🏠 Home</button>
            <button class="nav-btn" id="btn-next" onclick="nextQuestion()">Next ▶</button>
        </div>
        <h2 id="progress-text" style="color: #888;"></h2>
        <div style="display:flex; justify-content:center; gap:15px; align-items:center;">
            <button class="audio-btn" style="transform: scale(1.2);" onclick="playText(document.getElementById('question-text').innerText)">🔊</button>
            <div class="question-text" id="question-text"></div>
        </div>
        <div class="options-grid" id="options-grid"></div>
        
        <button id="skip-btn" onclick="forceNextQuestion()">⏭️ Skip to Next</button>
        
        <div id="hint-box">
            <button class="audio-btn" style="position: absolute; right: 10px; top: 10px; width: 40px; height: 40px; font-size: 1.2em;" onclick="playText(document.getElementById('hint-text').innerText)">🔊</button>
            <strong>💡 Hint：</strong><br><span id="hint-text"></span>
        </div>
    </div>

    <!-- 結算頁面 -->
    <div id="summary-screen" class="screen">
        <h1>🎉 Level Completed! 🎉</h1>
        <h2 id="final-score" style="color: #ff69b4; font-size: 2.5em;"></h2>
        <p style="font-size: 1.2em;">Click the <span style="color:red; font-weight:bold;">Red</span> buttons to try the wrong questions again!</p>
        <div class="summary-grid" id="summary-grid"></div>
        <br><br>
        <button class="nav-btn" style="padding:15px 25px; font-size:1.3em;" onclick="executeStartGame()">🔄 Retry Level</button>
        <button class="nav-btn" style="padding:15px 25px; font-size:1.3em; background-color:#32cd32; box-shadow: 0 5px 0 #228b22;" onclick="finishLevelAndSave()">💾 Save & Home</button>
    </div>
</div>

    let currentLevel = 1;
    let currentQuestions = [];
    let userAnswers = [];
    let currentQIndex = 0;
    let isRetryMode = false;
    let retryIndex = -1;
    let currentScore = 0;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    function initAudio() {
        if(!audioCtx) audioCtx = new AudioContext();
        if(audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playText(text) {
        window.speechSynthesis.cancel();
        let cleanText = text.replace(/___/g, "blank");
        let utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-GB';
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
    }

    function playWinSound() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function playWrongSound() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function fireConfetti() {
        for(let i=0; i<60; i++) {
            let conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.top = '-20px';
            conf.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
            conf.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 2500);
        }
    }

    function clearRecord() {
        if(confirm("Are you sure you want to clear all records?")) {
            localStorage.removeItem('teacherCatProgressV4');
            initLevels();
        }
    }

    function initLevels() {
        const grid = document.getElementById('level-grid');
        grid.innerHTML = '';
        let savedProgress = JSON.parse(localStorage.getItem('teacherCatProgressV4')) || {};

        for(let i = 1; i <= 15; i++) {
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            
            let record = savedProgress[i] || { score: 0 };
            let score = record.score;
            let starHtml = "☆☆☆"; 
            
            if (score === 20) {
                starHtml = '<span class="star-big">🌟</span>';
            } else if (score >= 10) {
                starHtml = '<span class="star-small">⭐</span>';
            }
            
            let levelTitle = levelsData[i].title;
            
            btn.innerHTML = `<div style="font-size:0.95em; font-weight:bold; line-height:1.2; margin-bottom:5px;">${levelTitle}</div>
                             <div style="min-height: 40px; display:flex; align-items:center; justify-content:center;">${starHtml}</div>
                             <span style="font-size:0.85em; font-weight:bold; background:rgba(255,255,255,0.3); padding:3px 8px; border-radius:10px;">Best: ${score}/20</span>`;
            
            btn.onclick = () => openIntro(i);
            grid.appendChild(btn);
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function openIntro(level) {
        currentLevel = level;
        let data = levelsData[level];
        document.getElementById('intro-title').innerText = data.title;
        document.getElementById('intro-focus').innerText = data.focus;
        
        let exList = document.getElementById('intro-examples');
        exList.innerHTML = '';
        data.examples.forEach(ex => {
            let li = document.createElement('li');
            li.style.marginBottom = '10px';
            li.style.display = 'flex';
            li.style.alignItems = 'center';
            li.style.gap = '10px';
            
            let btn = document.createElement('button');
            btn.className = 'audio-btn';
            btn.style.width = '35px';
            btn.style.height = '35px';
            btn.style.fontSize = '1em';
            btn.innerText = '🔊';
            btn.onclick = () => playText(ex);
            
            let span = document.createElement('span');
            span.innerText = ex;
            
            li.appendChild(btn);
            li.appendChild(span);
            exList.appendChild(li);
        });
        
        showScreen('intro-screen');
    }

    function executeStartGame() {
        const data = levelsData[currentLevel];
        let easy = shuffle([...data.easyPool]).slice(0, 10);
        let hard = shuffle([...data.hardPool]).slice(0, 10);
        
        currentQuestions = [...easy, ...hard];
        userAnswers = new Array(currentQuestions.length).fill(null);
        currentQIndex = 0;
        isRetryMode = false;
        
        renderQuestion();
        showScreen('game-screen');
    }

    function renderQuestion() {
        document.getElementById('hint-box').style.display = 'none';
        document.getElementById('skip-btn').style.display = 'none';
        
        let qIndex = isRetryMode ? retryIndex : currentQIndex;
        let qData = currentQuestions[qIndex];
        
        document.getElementById('progress-text').innerText = isRetryMode ? `Retry Wrong Question` : `Question: ${qIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('question-text').innerText = qData.q;
        
        document.getElementById('game-nav').style.display = 'flex';
        let btnPrev = document.getElementById('btn-prev');
        let btnNext = document.getElementById('btn-next');
        
        if (isRetryMode) {
            btnPrev.disabled = true;
            btnNext.onclick = () => renderSummary(); 
        } else {
            btnPrev.disabled = (currentQIndex === 0);
            btnNext.onclick = () => nextQuestion();
        }

        let grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        
        let opts = shuffle([...qData.options]);
        opts.forEach(opt => {
            let row = document.createElement('div');
            row.className = 'option-row';
            
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            
            if(!isRetryMode && userAnswers[qIndex] === opt) {
                btn.style.border = "3px solid #ff69b4";
            }
            
            btn.onclick = () => handleAnswer(opt, qData, btn);
            
            let audioBtn = document.createElement('button');
            audioBtn.className = 'audio-btn';
            audioBtn.innerText = '🔊';
            audioBtn.onclick = (e) => { e.stopPropagation(); playText(opt); };
            
            row.appendChild(audioBtn);
            row.appendChild(btn);
            grid.appendChild(row);
        });

        if (isRetryMode) showHint(qData.answer);
    }

    function handleAnswer(selected, qData, btnNode) {
        // 【修改重點】移除首次鎖定！只要不是在結算後的 Retry 模式，都持續更新該題的作答紀錄。
        // 這代表就算第一次按錯了，只要小朋友即時重按正確答案過關，就會被記錄為答對，並且獲得分數。
        if(!isRetryMode) {
            userAnswers[currentQIndex] = selected;
        }
        
        let allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.style.pointerEvents = 'none');

        if(selected === qData.answer) {
            playWinSound();
            fireConfetti();
            playText("Excellent!");
            btnNode.style.backgroundColor = "#2ed573";
            document.getElementById('skip-btn').style.display = 'none';
            document.getElementById('hint-box').style.display = 'none';
            
            setTimeout(() => {
                if(isRetryMode) {
                    userAnswers[retryIndex] = "CORRECTED"; 
                    renderSummary();
                } else {
                    if (currentQIndex < currentQuestions.length - 1) {
                        currentQIndex++;
                        renderQuestion();
                    } else {
                        renderSummary();
                    }
                }
            }, 1500);
        } else {
            playWrongSound();
            let container = document.getElementById('game-container');
            container.classList.remove('shake');
            void container.offsetWidth;
            container.classList.add('shake');
            btnNode.style.backgroundColor = "#ff4757";
            
            showHint(qData.answer);
            
            if (!isRetryMode) {
                document.getElementById('skip-btn').style.display = 'block';
            }
            
            setTimeout(() => {
                allBtns.forEach(b => b.style.pointerEvents = 'auto');
            }, 500);
        }
    }

    function showHint(correctAnswer) {
        let hintBox = document.getElementById('hint-box');
        let hintText = document.getElementById('hint-text');
        hintText.innerText = `${levelsData[currentLevel].focus}\nCorrect Answer：${correctAnswer}`;
        hintBox.style.display = 'block';
        playText("Try again! " + hintText.innerText);
    }

    function prevQuestion() {
        if(isRetryMode) { renderSummary(); return; }
        if (currentQIndex > 0) { currentQIndex--; renderQuestion(); }
    }

    function nextQuestion() {
        if(isRetryMode) { renderSummary(); return; }
        if (currentQIndex < currentQuestions.length - 1) {
            currentQIndex++;
            renderQuestion();
        } else {
            renderSummary();
        }
    }

    function forceNextQuestion() { nextQuestion(); }

    function renderSummary() {
        isRetryMode = false;
        showScreen('summary-screen');
        let grid = document.getElementById('summary-grid');
        grid.innerHTML = '';
        currentScore = 0;

        currentQuestions.forEach((q, i) => {
            let box = document.createElement('div');
            box.className = 'sum-box';
            
            if(userAnswers[i] === q.answer || userAnswers[i] === "CORRECTED") {
                box.classList.add('sum-correct');
                box.innerText = `${i + 1} ✔`;
                currentScore++; 
            } else {
                box.classList.add('sum-wrong');
                box.innerHTML = `${i + 1} ❌<br><span style="font-size:0.7em;">(Retry)</span>`;
                box.onclick = () => startRetry(i);
            }
            grid.appendChild(box);
        });

        document.getElementById('final-score').innerText = `Your Score: ${currentScore} / ${currentQuestions.length}`;
        saveHighestScore(currentScore);
    }

    function startRetry(index) {
        isRetryMode = true;
        retryIndex = index;
        showScreen('game-screen');
        renderQuestion();
    }

    function saveHighestScore(score) {
        let savedProgress = JSON.parse(localStorage.getItem('teacherCatProgressV4')) || {};
        let oldRecord = savedProgress[currentLevel] || { score: 0 };
        
        if(score > oldRecord.score) {
            savedProgress[currentLevel] = { score: score };
            localStorage.setItem('teacherCatProgressV4', JSON.stringify(savedProgress));
        }
    }

    function finishLevelAndSave() {
        initLevels();
        showScreen('home-screen');
    }

    initLevels();
</script>
