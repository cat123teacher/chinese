    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Nunito:wght@600;800&display=swap');
        
        /* 動態漸變背景 - 修改了 padding 和對齊方式以配合非固定 Footer */
        body { 
            font-family: 'Nunito', 'Microsoft JhengHei', sans-serif; 
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #ffdde1);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            margin: 0; 
            padding: 0; /* 移除原本為了 fixed footer 留的底部空間 */
            display: flex; 
            flex-direction: column; /* 讓內容垂直排列 */
            align-items: center; 
            min-height: 100vh; 
            color: #2d3436; 
            overflow-x: hidden; 
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .top-logo { position: fixed; top: 15px; left: 15px; width: 70px; height: 70px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; border: 3px solid white; background-color: white;}
        
        /* Teacher Cat 聯絡欄 (已取消 position: fixed 置底，改為滑動到底部才顯示) */
        .footer { 
            width: 100%; 
            background: rgba(255, 255, 255, 0.95); 
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1); 
            padding: 20px 0; 
            text-align: center; 
            z-index: 1000; 
            font-size: 0.9em; 
            border-top: 4px solid #fff; 
            margin-top: auto; /* 若畫面不夠長，會自動推到畫面最下方 */
        }
        .footer h3 { margin: 0 0 5px 0; color: #ff6b81; font-family: 'Comic Neue', cursive; font-size: 1.2em;}
        .social-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 0 10px; }
        .social-links a { color: white; text-decoration: none; font-weight: bold; background: #0984e3; padding: 5px 12px; border-radius: 15px; transition: 0.3s; box-shadow: 0 3px 0 #074ac7;}
        .social-links a:hover { background: #fdcb6e; color: #2d3436; box-shadow: 0 3px 0 #e1b12c; transform: translateY(-2px);}

        /* 美化主容器 - 加入響應式寬度確保手機顯示正常 */
        .container { 
            background-color: rgba(255, 255, 255, 0.95); 
            border-radius: 35px; 
            box-shadow: 0 20px 50px rgba(255, 107, 129, 0.2); 
            width: calc(100% - 40px); /* 保持左右 20px 的距離 */
            max-width: 850px; 
            padding: 40px; 
            text-align: center; 
            border: 6px solid #fff; 
            position: relative; 
            margin-top: 100px; /* 避開左上角的 Logo */
            margin-bottom: 40px; /* 與 Footer 保持距離 */
            box-sizing: border-box; /* 確保 padding 不會撐破版面 */
        }
        
        /* 果凍立體標題 */
        h1 { 
            color: #fff; 
            font-size: 3em; 
            font-family: 'Comic Neue', cursive; 
            text-shadow: 
                -2px -2px 0 #ff6b81,  
                 2px -2px 0 #ff6b81,
                -2px  2px 0 #ff6b81,
                 2px  2px 0 #ff6b81,
                 4px  4px 0 #ff4757,
                 6px  6px 0 #ffa502,
                 8px  8px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px; 
            letter-spacing: 2px;
        }
        
        /* 彩虹立體懸浮按鈕 */
        .level-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 18px; margin-bottom: 25px;}
        .level-btn { 
            color: white; border: 3px solid rgba(255,255,255,0.6); 
            padding: 15px 10px; border-radius: 20px; font-size: 1.3em; font-weight: 800; 
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            display: flex; flex-direction: column; align-items: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .level-btn:hover { transform: translateY(-5px) scale(1.05); filter: brightness(1.1); }
        .level-btn:active { transform: translateY(3px) scale(0.95); }
        
        .stars-container { margin-top: 8px; color: #ffeaa7; text-shadow: 1px 1px 0px #d63031; letter-spacing: 2px;}
        .stars-small { font-size: 1.1em; }
        .stars-big { font-size: 1.6em; transform: scale(1.1); animation: pop 1s infinite alternate;}
        @keyframes pop { from { transform: scale(1); } to { transform: scale(1.1); } }
        
        .score-badge { background: rgba(0,0,0,0.25); padding: 4px 12px; border-radius: 12px; font-size: 0.85em; margin-top: 8px; border: 1px solid rgba(255,255,255,0.3);}

        .hidden { display: none !important; }
        
        /* 預習區塊美化 */
        .intro-box { background-color: #fff9c4; padding: 25px; border-radius: 25px; border: 5px dashed #fdcb6e; margin: 25px 0; text-align: left; font-size: 1.25em; line-height: 1.6; box-shadow: inset 0 0 20px rgba(253, 203, 110, 0.2);}
        
        .action-btn { color: white; border: 2px solid rgba(255,255,255,0.3); padding: 12px 30px; font-size: 1.2em; border-radius: 50px; cursor: pointer; font-weight: bold; margin: 5px; transition: 0.3s; text-decoration: none;}
        .action-btn:hover { filter: brightness(1.15); transform: translateY(-3px); } 
        .action-btn:active { transform: translateY(3px); box-shadow: 0 0 0 transparent !important; }
        
        .btn-huge { font-size: 1.8em; padding: 15px 50px; background-color: #e17055; box-shadow: 0 8px 0 #d63031; animation: pulse 1.5s infinite; border-radius: 50px;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .nav-bar { display: flex; justify-content: space-between; margin-top: 30px; border-top: 3px dashed #dfe6e9; padding-top: 25px; }
        
        .question-text { font-size: 1.8em; color: #2d3436; margin-bottom: 25px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; background: #f1f2f6; padding: 20px; border-radius: 20px; border: 3px solid #dfe6e9;}
        .speak-btn { background-color: #fdcb6e; border: 2px solid white; border-radius: 50%; width: 50px; height: 50px; font-size: 1.3em; cursor: pointer; box-shadow: 0 5px 0 #e1b12c; transition: 0.2s; display: flex; justify-content: center; align-items: center; flex-shrink: 0;}
        .speak-btn:hover { background-color: #ffeaa7; transform: translateY(-2px);}
        .speak-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #e1b12c; }
        
        .options-grid { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px;}
        .option-row { display: flex; gap: 12px; align-items: center; }
        .option-btn { flex-grow: 1; background-color: #74b9ff; border: 3px solid rgba(255,255,255,0.5); padding: 18px; font-size: 1.4em; font-weight: bold; color: white; border-radius: 20px; cursor: pointer; box-shadow: 0 6px 0 #0984e3; transition: 0.2s; text-shadow: 1px 1px 1px rgba(0,0,0,0.2);}
        .option-btn:hover { background-color: #00cec9; box-shadow: 0 6px 0 #00b894; transform: translateY(-2px); }
        
        .skip-btn-container { text-align: center; margin-top: 20px; animation: fadeIn 0.5s;}
        
        .inline-hint-box { background: #fff9c4; padding: 20px; border-radius: 20px; border: 4px solid #ff7675; margin-bottom: 25px; text-align: left; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 20px rgba(214, 48, 49, 0.15);}
        
        .summary-list { text-align: left; max-height: 400px; overflow-y: auto; background: #f1f2f6; padding: 25px; border-radius: 20px; margin-bottom: 20px; border: 3px solid #dfe6e9; }
        .summary-item { padding: 15px; margin-bottom: 15px; border-radius: 15px; background: white; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #ccc; box-shadow: 0 4px 10px rgba(0,0,0,0.05);}
        .summary-item.correct { border-color: #00b894; }
        .summary-item.wrong { border-color: #d63031; cursor: pointer; background-color: #ffeaa7; transition: 0.2s; }
        .summary-item.wrong:hover { background-color: #fdcb6e; transform: scale(1.02); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(5px);}
        .modal-content { background: white; padding: 35px; border-radius: 30px; max-width: 90%; width: 550px; text-align: center; border: 6px solid #ff7675; position: relative; animation: bounceIn 0.5s; box-shadow: 0 20px 50px rgba(0,0,0,0.3);}
        .modal-cat-img { width: 110px; height: 110px; border-radius: 50%; position: absolute; top: -55px; left: 50%; transform: translateX(-50%); border: 5px solid #ff7675; background: white; box-shadow: 0 5px 15px rgba(0,0,0,0.2);}
        @keyframes bounceIn { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
        
        .progress-bar { width: 100%; height: 25px; background-color: #dfe6e9; border-radius: 25px; overflow: hidden; margin-bottom: 25px; border: 2px solid rgba(0,0,0,0.05);}
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); width: 0%; transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
    </style>
</head>

    <!-- 結算頁面 -->

<script>
    const teacherCatHints = {
        1: "日期的介詞要用 on，寫法記得加 th 喔！另外，第三人稱單數動詞（He/She）記得要加 s 或 es。",
        2: "注意！'can' 後面的動詞必須是原形，不用加 s 或 ing 喔！",
        3: "描述物品時，記得加上 'a' (例如 a lemon)。問價錢時要用 How much。",
        4: "shorts, gloves 等由兩個部分組成的衣物通常是眾數。I like 後面通常接動詞 ing 喔！",
        5: "介詞要注意：在巴士上用 'on the bus'，在巴士站用 'at the bus stop'。",
        6: "留意日期的正確寫法是 'on 24th July'。形容詞的搭配要注意文法順序！",
        7: "第三人稱單數（He/She）的動作，記得動詞要加 es (teaches) 或 s (works)。",
        8: "形容人的外表可以直接說 'She is tall'，千萬不能寫 'She looks like tall' 喔！",
        9: "這關是過去式！不規則變化要記熟 (go->went, ride->rode)。玩機動遊戲要用 ride on 或 play on。",
        10: "天氣突變和寫日記都要用過去式！記得打羽毛球是 'play badminton'，前面不需要加 the。",
        11: "日期拼寫有陷阱，12th 應該拼成 twelfth！過去式 eat 變成 ate, have 變成 had。",
        12: "不要漏掉動詞！例如 'It was windy'。到達目的地用 reach，後面不用加介詞。",
        13: "寫信的上款記得加上逗號 (Dear Aunt Helen,)。swim 的過去式是 swam 喔！",
        14: "節日名稱必須大寫 (Christmas Day)。sing 的過去式是 sang，find 是 found。",
        15: "在農曆新年期間要用介詞 'at' (at Chinese New Year)。如果特指除夕某一天則用 'on'。"
    };

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text.replace(/_+/g, "blank")); 
            utterance.lang = 'en-GB'; utterance.rate = 0.85; window.speechSynthesis.speak(utterance);
        }
    }
    function speakCurrentQuestion() { speakText(document.getElementById('question-content').innerText); }

    // ====================================================================================
    // Level 1 和 Level 15 的完整 4 選項題庫
    // ====================================================================================

    const rainbowColors = [
        { bg: '#ff7675', shadow: '#d63031' },
        { bg: '#fdcb6e', shadow: '#e1b12c' },
        { bg: '#00cec9', shadow: '#00b894' },
        { bg: '#0984e3', shadow: '#074ac7' },
        { bg: '#6c5ce7', shadow: '#4834d4' },
        { bg: '#e84393', shadow: '#b33939' } 
    ];

    function clearRecords() {
        if(confirm("確定要清除所有辛苦獲得的星星與分數紀錄嗎？")) {
            for(let i=1; i<=15; i++) {
                localStorage.removeItem('tc_score_L' + i);
            }
            renderLevelButtons();
            alert("記錄已清除！重新挑戰吧！");
        }
    }

    function getMaxScore(level) {
        return parseInt(localStorage.getItem('tc_score_L' + level)) || 0;
    }
    
    function saveMaxScore(level, currentScore) {
        let oldMax = getMaxScore(level);
        if(currentScore > oldMax) {
            localStorage.setItem('tc_score_L' + level, currentScore);
            return true;
        }
        return false;
    }

    function renderLevelButtons() {
        const container = document.getElementById('level-container');
        container.innerHTML = '';
        
        for (let i = 1; i <= 15; i++) {
            if(!levelData[i]) continue; 
            
            let maxScore = getMaxScore(i);
            let starsHTML = '';
            
            if (maxScore === 20) {
                starsHTML = '<span class="stars-big">🌟🌟🌟</span>';
            } else if (maxScore >= 10) {
                starsHTML = '<span class="stars-small">⭐⭐⭐</span>';
            } else {
                starsHTML = '<span class="stars-small" style="color:rgba(255,255,255,0.4);">☆☆☆</span>';
            }

            const btn = document.createElement('button');
            btn.className = 'level-btn';
            
            const colorTheme = rainbowColors[(i - 1) % rainbowColors.length];
            btn.style.backgroundColor = colorTheme.bg;
            btn.style.boxShadow = `0 6px 0 ${colorTheme.shadow}`;
            
            btn.innerHTML = `
                <span style="font-size: 0.95em; line-height: 1.3; margin-bottom: 5px; display: block;">
                    ${levelData[i].title}
                </span> 
                <div class="stars-container">${starsHTML}</div>
                <div class="score-badge">最高分: ${maxScore}/20</div>
            `;
            
            btn.onclick = () => loadLevel(i);
            container.appendChild(btn);
        }
    }

    window.onload = renderLevelButtons;

    function switchView(viewId) {
        ['home-view', 'intro-view', 'game-view', 'result-view', 'hint-modal'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
        if(viewId === 'home-view') renderLevelButtons(); 
        
        // 切換視圖時自動滾動到最上方
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goHome() { switchView('home-view'); window.speechSynthesis.cancel(); }

    function loadLevel(level) {
        currentLevel = level;
        const data = levelData[level];
        document.getElementById('intro-title').innerText = data.title;
        document.getElementById('intro-focus').innerText = data.focus;
        document.getElementById('intro-example').innerText = data.example;
        switchView('intro-view');
    }

    function startGame() {
        document.getElementById('final-score').innerText = '0'; 
        
        const allQ = levelData[currentLevel].q;
        const easyQ = allQ.filter(q => q.d === 'e').sort(() => 0.5 - Math.random()).slice(0, 10);
        const hardQ = allQ.filter(q => q.d === 'h').sort(() => 0.5 - Math.random()).slice(0, 10);
        selectedQuestions = [...easyQ, ...hardQ];
        
        currentQIndex = 0; score = 0; userAnswers = new Array(20).fill(-1);
        isRetrying = false;
        switchView('game-view');
        renderQuestion();
    }

    function changeQ(dir) {
        window.speechSynthesis.cancel();
        if (dir === -1 && currentQIndex > 0) currentQIndex--;
        else if (dir === 1 && currentQIndex < 19) currentQIndex++;
        else if (dir === 1 && currentQIndex === 19) { showResult(); return; }
        renderQuestion();
    }

    function renderQuestion() {
        if (currentQIndex >= selectedQuestions.length) { showResult(); return; }
        const qData = selectedQuestions[currentQIndex];
        
        document.getElementById('inline-hint-container').classList.add('hidden');
        document.getElementById('skip-btn-wrapper').classList.add('hidden');

        document.getElementById('btn-prev').disabled = (currentQIndex === 0);
        document.getElementById('btn-next').innerText = (currentQIndex === 19) ? "看成績 🏆" : "下一頁 ➡️";
        document.getElementById('q-current').innerText = currentQIndex + 1;
        document.getElementById('question-content').innerText = qData.q;
        
        const diffBadge = document.getElementById('q-diff-badge');
        diffBadge.innerText = (qData.d === 'e') ? '⭐ 淺程度' : '🔥 深程度 (常犯錯誤)';
        diffBadge.style.backgroundColor = (qData.d === 'e') ? '#00b894' : '#d63031';
        diffBadge.style.boxShadow = (qData.d === 'e') ? '0 4px 0 #009688' : '0 4px 0 #b33939';

        document.getElementById('progress').style.width = `${((currentQIndex + 1) / 20) * 100}%`;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = ''; 
        
        qData.o.forEach((opt, index) => {
            const row = document.createElement('div');
            row.className = 'option-row';
            
            const speakO = document.createElement('button');
            speakO.className = 'speak-btn'; speakO.innerText = '🔊';
            speakO.onclick = (e) => { e.stopPropagation(); speakText(opt); };
            
            const btn = document.createElement('button');
            btn.className = 'option-btn'; btn.innerText = opt;
            
            if(userAnswers[currentQIndex] !== -1) {
                btn.disabled = true;
                if(index === qData.a) {
                    btn.style.backgroundColor = '#00b894'; 
                    btn.style.boxShadow = '0 6px 0 #009688';
                }
                else if(index === userAnswers[currentQIndex]) {
                    btn.style.backgroundColor = '#ff7675';
                    btn.style.boxShadow = '0 6px 0 #d63031';
                }
            } else {
                btn.onclick = () => { speakText(opt); checkAnswer(index, qData.a, btn); };
            }
            
            row.appendChild(speakO);
            row.appendChild(btn);
            optionsContainer.appendChild(row);
        });
    }

    function checkAnswer(selectedIndex, correctIndex, btnElement) {
        const qData = selectedQuestions[isRetrying ? retryIndex : currentQIndex];

        if (selectedIndex === correctIndex) {
            document.getElementById('sfx-correct').play();
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            btnElement.style.backgroundColor = '#00b894';
            btnElement.style.boxShadow = '0 6px 0 #009688';
            
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);
            
            if(isRetrying) {
                userAnswers[retryIndex] = selectedIndex; 
                setTimeout(() => { showResult(); }, 1200); 
            } else {
                userAnswers[currentQIndex] = selectedIndex; 
                setTimeout(() => { changeQ(1); }, 1500); 
            }

        } else {
            document.getElementById('sfx-wrong').play();
            btnElement.style.backgroundColor = '#ff7675'; 
            btnElement.style.boxShadow = '0 6px 0 #d63031';
            
            btnElement.disabled = true; 
            
            if(isRetrying) {
                speakText("Try again.");
            } else {
                userAnswers[currentQIndex] = selectedIndex; 
                
                setTimeout(() => {
                    document.getElementById('modal-hint-text').innerText = teacherCatHints[currentLevel] || "請仔細看清楚題目中的關鍵字喔！";
                    document.getElementById('hint-modal').classList.remove('hidden');
                    speakText("Oops! Let's check the hint.");
                }, 600);
            }
        }
    }

    function closeHintModal() {
        document.getElementById('hint-modal').classList.add('hidden');
        document.getElementById('skip-btn-wrapper').classList.remove('hidden'); 
    }

    function showResult() {
        const wasRetrying = isRetrying; 
        isRetrying = false; 
        switchView('result-view');
        
        let correctCount = userAnswers.filter((ans, i) => ans === selectedQuestions[i].a).length;
        const scoreSpan = document.getElementById('final-score');
        let oldScore = parseInt(scoreSpan.innerText) || 0;
        
        scoreSpan.innerText = correctCount;
        
        if (wasRetrying && correctCount > oldScore) {
            scoreSpan.style.animation = 'none';
            setTimeout(() => { scoreSpan.style.animation = 'pop 0.5s ease'; }, 10);
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.7 } });
        }
        
        let isRecord = saveMaxScore(currentLevel, correctCount);
        const msg = document.getElementById('result-msg');
        
        if (correctCount === 20) { 
            msg.innerText = "太棒了！你是英文小天才！🏆"; 
            if(!wasRetrying) document.getElementById('sfx-win').play(); 
            confetti({ particleCount: 400, spread: 150, zIndex: 3000 });
        } else if (correctCount >= 15) { 
            msg.innerText = "做得好！繼續努力！🌟" + (isRecord?" (⭐破最高分紀錄了！)":""); 
        } else { 
            msg.innerText = "再接再厲，點擊下方黃色錯題重做吧！💪"; 
        }

        const listDOM = document.getElementById('summary-list');
        listDOM.innerHTML = '';
        selectedQuestions.forEach((qData, i) => {
            const item = document.createElement('div');
            let isCorrect = (userAnswers[i] === qData.a);
            
            item.className = 'summary-item ' + (isCorrect ? 'correct' : 'wrong');
            item.innerHTML = `
                <div>
                    <strong>Q${i+1}:</strong> ${qData.q} <br>
                    <span style="font-size:1em; color:#636e72;">你的答案: ${userAnswers[i] !== -1 ? qData.o[userAnswers[i]] : "未作答"} 
                    ${isCorrect ? "✅" : "❌ <strong style='color:#d63031;'>(點擊重答)</strong>"}</span>
                </div>
            `;
            
            if(!isCorrect) {
                item.onclick = () => {
                    isRetrying = true;
                    retryIndex = i;
                    switchView('game-view');
                    renderRetryQuestion(i);
                };
            }
            listDOM.appendChild(item);
        });
    }

    function renderRetryQuestion(qIndex) {
        document.getElementById('btn-prev').disabled = true;
        document.getElementById('btn-next').innerText = "放棄重答，回總結";
        document.getElementById('btn-next').onclick = showResult; 
        
        document.getElementById('q-current').innerText = qIndex + 1 + " (錯題重做)";
        const qData = selectedQuestions[qIndex];
        document.getElementById('question-content').innerText = qData.q;
        
        document.getElementById('inline-hint-container').classList.remove('hidden');
        document.getElementById('inline-hint-text').innerText = teacherCatHints[currentLevel] || "仔細看看！";
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = ''; 
        qData.o.forEach((opt, index) => {
            const row = document.createElement('div');
            row.className = 'option-row';
            
            const speakO = document.createElement('button');
            speakO.className = 'speak-btn'; speakO.innerText = '🔊';
            speakO.onclick = (e) => { e.stopPropagation(); speakText(opt); };
            
            const btn = document.createElement('button');
            btn.className = 'option-btn'; btn.innerText = opt;
            btn.onclick = () => { speakText(opt); checkAnswer(index, qData.a, btn); };
            
            row.appendChild(speakO);
            row.appendChild(btn);
            optionsContainer.appendChild(row);
        });
    }
</script>
</body>
</html>
