<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>影輝苑A,B座設計DIY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --vvh: 100dvh;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1120;
      font-family: 'Noto Sans HK', sans-serif;
      color: #f8fafc;
      touch-action: none;
    }
    /* ==========================================================================
       80% 3D LAYOUT STAGE + 20% ULTRA-COMPACT ICON DOCK
       ========================================================================== */
    #app-shell {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: var(--vvh, 100dvh);
      overflow: hidden;
    }
    #viewport-stage {
      position: relative;
      flex: 0 0 80%;
      height: 80%;
      width: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #090d16 100%);
    }
    #design-drawer {
      position: relative;
      width: 100%;
      flex: 0 0 20%;
      height: 20%;
      max-height: 20%;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(148, 163, 184, 0.25);
      z-index: 40;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }
    #app-shell.sheet-is-minimized #viewport-stage {
      flex: 1 1 calc(100% - 38px) !important;
      height: calc(100% - 38px) !important;
    }
    #design-drawer.drawer-minimized {
      flex: 0 0 38px !important;
      height: 38px !important;
      max-height: 38px !important;
      min-height: 38px !important;
    }
    @media (orientation: landscape) and (max-height: 580px) {
      #app-shell {
        flex-direction: row !important;
      }
      #viewport-stage {
        flex: 0 0 80% !important;
        width: 80% !important;
        height: 100% !important;
      }
      #design-drawer {
        flex: 0 0 20% !important;
        width: 20% !important;
        height: 100% !important;
        max-height: 100% !important;
        border-top: none !important;
        border-left: 1px solid rgba(148, 163, 184, 0.28) !important;
      }
      #primary-dock-nav {
        grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
      }
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.22);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .dock-btn-active {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
      color: #090d16 !important;
      border-color: #fbbf24 !important;
      font-weight: 900 !important;
    }
    .zone-focus-btn.active, .zone-pill.active {
      background: #f59e0b !important;
      color: #090d16 !important;
      border-color: #fde68a !important;
      font-weight: 900 !important;
    }
    .swatch-card.active {
      border-color: #f59e0b !important;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.45);
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <!-- ==================================================================== -->
    <!-- TOP 80%: 3D VIEWPORT STAGE                                           -->
    <!-- ==================================================================== -->
    <div id="viewport-stage">
      <div id="canvas-container" class="w-full h-full"></div>

      <!-- ULTRA-COMPACT FLOATING TOP BAR (Pure Icons + Short Text) -->
      <header class="fixed-top-bar absolute top-1.5 left-1.5 right-1.5 z-20 flex flex-col gap-1 pointer-events-none">
        <div class="flex items-center justify-between gap-1">
          <!-- Unit Picker Pill -->
          <div class="glass-panel px-1.5 py-0.5 rounded-xl flex items-center gap-1 pointer-events-auto shadow-lg">
            <button onclick="openUnitPickerModal()" class="px-2 py-0.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-[11px] flex items-center gap-0.5 shadow transition active:scale-95">
              <span>🏢</span><span id="unit-badge-box">B10室</span><span class="text-[9px]">▼</span>
            </button>
            <span class="text-[10px] font-extrabold text-amber-300 hidden sm:inline">影輝苑A,B座設計DIY</span>
          </div>

          <!-- Pure Icon + 1-Char Toolbar -->
          <div class="glass-panel px-1 py-0.5 rounded-xl flex items-center gap-0.5 pointer-events-auto overflow-x-auto no-scrollbar shadow-lg">
            <button onclick="setCameraView('top2d')" id="cam-top2d" title="平面" class="px-1.5 py-0.5 rounded-lg bg-slate-800/90 text-slate-200 text-[10px] font-bold shrink-0">📐2D</button>
            <button onclick="setCameraView('iso3d')" id="cam-iso3d" title="3D立體" class="px-1.5 py-0.5 rounded-lg bg-amber-500 text-slate-950 text-[10px] font-black shrink-0">🧊3D</button>
            <button onclick="setCameraView('seaview')" id="cam-seaview" title="望景觀" class="px-1.5 py-0.5 rounded-lg bg-slate-800/90 text-sky-300 text-[10px] font-bold shrink-0">🌊景</button>
            <button onclick="cycleWallHeight()" id="btn-wall-h" title="牆高" class="px-1.5 py-0.5 rounded-lg bg-slate-800/90 text-amber-300 text-[10px] font-bold shrink-0">🧱半牆</button>
            <button onclick="toggleNightMode()" id="btn-night" title="日夜燈光" class="px-1.5 py-0.5 rounded-lg bg-slate-800/90 text-yellow-300 text-[10px] font-bold shrink-0">☀️</button>
            <button onclick="toggleDimensions()" id="btn-dim" title="尺寸" class="px-1.5 py-0.5 rounded-lg bg-rose-950/80 text-rose-200 text-[10px] font-bold shrink-0">📏</button>
            <button onclick="takeScreenshot()" title="截圖" class="px-1.5 py-0.5 rounded-lg bg-emerald-600 text-white text-[10px] font-bold shrink-0">📷</button>
          </div>
        </div>

        <!-- COMPACT ICON + 1-CHAR ZONE FOCUS BAR -->
        <div class="glass-panel px-1 py-0.5 rounded-xl flex items-center gap-1 pointer-events-auto overflow-x-auto no-scrollbar shadow-md">
          <button onclick="focusDesignZone('all')" id="zf-all" class="zone-focus-btn active px-1.5 py-0.5 rounded-lg bg-slate-800/90 border border-slate-700 text-slate-200 text-[10px] font-bold shrink-0">🏠全</button>
          <button onclick="focusDesignZone('foyer')" id="zf-foyer" class="zone-focus-btn px-1.5 py-0.5 rounded-lg bg-slate-800/90 border border-slate-700 text-slate-200 text-[10px] font-bold shrink-0">🚪廳</button>
          <button onclick="focusDesignZone('liv')" id="zf-liv" class="zone-focus-btn px-1.5 py-0.5 rounded-lg bg-slate-800/90 border border-slate-700 text-slate-200 text-[10px] font-bold shrink-0">🪟窗1</button>
          <button onclick="focusDesignZone('rm_bot')" id="zf-rm_bot" class="zone-focus-btn px-1.5 py-0.5 rounded-lg bg-slate-800/90 border border-slate-700 text-slate-200 text-[10px] font-bold shrink-0">🌅窗2</button>
          <button onclick="focusDesignZone('rm_left')" id="zf-rm_left" class="zone-focus-btn px-1.5 py-0.5 rounded-lg bg-slate-800/90 border border-slate-700 text-slate-200 text-[10px] font-bold shrink-0">🛏️房</button>
          <button onclick="focusDesignZone('kit')" id="zf-kit" class="zone-focus-btn px-1.5 py-0.5 rounded-lg bg-slate-800/90 border border-slate-700 text-slate-200 text-[10px] font-bold shrink-0">🍳廚</button>
          <button onclick="focusDesignZone('bath')" id="zf-bath" class="zone-focus-btn px-1.5 py-0.5 rounded-lg bg-slate-800/90 border border-slate-700 text-slate-200 text-[10px] font-bold shrink-0">🚿廁</button>
          <button onclick="toggleZoneIsolateMode()" id="btn-zone-isolate" class="ml-auto px-1.5 py-0.5 rounded-lg bg-sky-950/90 border border-sky-500/50 text-sky-300 text-[9px] font-bold shrink-0">🔍專注</button>
        </div>
      </header>

      <!-- FLOATING TOUCH QUICK-ACTION BAR WHEN FURNITURE IS SELECTED -->
      <div id="mobile-item-quickbar" class="hidden absolute bottom-1.5 left-1.5 right-1.5 z-30 pointer-events-auto">
        <div class="glass-panel rounded-xl px-1.5 py-1 border border-amber-500/60 shadow-2xl flex items-center justify-between gap-1 overflow-x-auto no-scrollbar">
          <div class="flex items-center gap-1 min-w-0 shrink-0">
            <span id="quickbar-item-name" class="text-[10px] font-extrabold text-amber-300 truncate max-w-[75px]">傢俬</span>
            <span id="quickbar-item-dim" class="text-[8px] font-mono text-slate-300 bg-slate-900 px-1 py-0.5 rounded">1000×600</span>
          </div>
          <div class="flex items-center gap-0.5 shrink-0">
            <button onclick="rotateSelected(90)" title="旋轉90°" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold">↻</button>
            <button onclick="nudgeSelected(-50,0)" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-200 text-[10px] font-bold">◀</button>
            <button onclick="nudgeSelected(0,-50)" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-200 text-[10px] font-bold">▲</button>
            <button onclick="nudgeSelected(0,50)" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-200 text-[10px] font-bold">▼</button>
            <button onclick="nudgeSelected(50,0)" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-200 text-[10px] font-bold">▶</button>
            <button onclick="nudgeSelectedY(100)" title="升高" class="px-1.5 py-0.5 rounded bg-indigo-950/90 text-indigo-200 text-[10px] font-bold">⬆️</button>
            <button onclick="nudgeSelectedY(-100)" title="降低" class="px-1.5 py-0.5 rounded bg-indigo-950/90 text-indigo-200 text-[10px] font-bold">⬇️</button>
            <button onclick="groundSelectedY()" title="貼地" class="px-1.5 py-0.5 rounded bg-slate-800 text-amber-300 text-[9px] font-bold">⬇地</button>
            <button onclick="openEditModal()" title="尺寸及顏色" class="px-1.5 py-0.5 rounded bg-amber-500 text-slate-950 text-[10px] font-black">📏改</button>
            <button onclick="duplicateSelected()" title="複製" class="px-1.5 py-0.5 rounded bg-sky-600 text-white text-[10px] font-bold">＋</button>
            <button onclick="deleteSelected()" title="刪除" class="px-1.5 py-0.5 rounded bg-rose-600 text-white text-[10px] font-bold">🗑️</button>
            <button onclick="deselectItem()" title="取消選取" class="px-1.5 py-0.5 rounded bg-slate-700 text-slate-200 text-[10px] font-bold">✕</button>
          </div>
        </div>
      </div>

      <!-- TOAST BANNER -->
      <div id="toast-msg" class="absolute top-14 left-1/2 -translate-x-1/2 z-30 pointer-events-none transition-all duration-300">
        <div class="glass-panel px-2.5 py-0.5 rounded-full border border-amber-500/40 text-[10px] font-medium text-slate-200 flex items-center gap-1 shadow-xl">
          <span>✨</span>
          <span id="toast-text">單指轉3D・點選拖拉</span>
        </div>
      </div>
    </div>

    <!-- ==================================================================== -->
    <!-- BOTTOM 20%: ULTRA-COMPACT ICON + SHORT TEXT DESIGN DOCK              -->
    <!-- ==================================================================== -->
    <section id="design-drawer">
      <nav id="primary-dock-nav" class="bg-slate-950 px-1 py-0.5 border-b border-slate-800 grid grid-cols-8 gap-1 shrink-0 items-center">
        <button onclick="activateMainDock('templates')" id="dock-templates" class="dock-btn-active py-1 px-0.5 rounded-lg bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex items-center justify-center gap-0.5">
          <span class="text-xs leading-none">📋</span>
          <span class="text-[10px] font-bold leading-none">範本</span>
        </button>
        <button onclick="activateMainDock('floors')" id="dock-floors" class="py-1 px-0.5 rounded-lg bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex items-center justify-center gap-0.5">
          <span class="text-xs leading-none">🪵</span>
          <span class="text-[10px] font-bold leading-none">地板</span>
        </button>
        <button onclick="activateMainDock('walls')" id="dock-walls" class="py-1 px-0.5 rounded-lg bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex items-center justify-center gap-0.5">
          <span class="text-xs leading-none">🎨</span>
          <span class="text-[10px] font-bold leading-none">牆身</span>
        </button>
        <button onclick="activateMainDock('furniture')" id="dock-furniture" class="py-1 px-0.5 rounded-lg bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex items-center justify-center gap-0.5">
          <span class="text-xs leading-none">🛋️</span>
          <span class="text-[10px] font-bold leading-none">家具</span>
        </button>
        <button onclick="activateMainDock('appliances')" id="dock-appliances" class="py-1 px-0.5 rounded-lg bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex items-center justify-center gap-0.5">
          <span class="text-xs leading-none">⚡</span>
          <span class="text-[10px] font-bold leading-none">家電</span>
        </button>
        <button onclick="activateMainDock('lighting')" id="dock-lighting" class="py-1 px-0.5 rounded-lg bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex items-center justify-center gap-0.5">
          <span class="text-xs leading-none">💡</span>
          <span class="text-[10px] font-bold leading-none">燈具</span>
        </button>
        <button onclick="openBomModal()" id="dock-bom" class="py-1 px-0.5 rounded-lg bg-sky-950/90 border border-sky-500/40 text-sky-300 hover:bg-sky-900 transition flex items-center justify-center gap-0.5">
          <span class="text-xs leading-none">📦</span>
          <span id="bom-count-badge" class="text-[10px] font-bold leading-none">清單</span>
        </button>
        <button onclick="toggleBottomSheet()" id="sheet-toggle-label" title="收起/展開選單" class="py-1 px-0.5 rounded-lg bg-slate-800 border border-slate-600 text-amber-300 text-[10px] font-black flex items-center justify-center">
          ▼
        </button>
      </nav>

      <div id="bottom-sheet-body" class="flex-1 overflow-y-auto overflow-x-hidden px-1.5 py-1 no-scrollbar">
        <!-- TAB 1: 30 TEMPLATES -->
        <div id="tab-content-templates">
          <div id="templates-grid" class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 2: ZONED FLOORS (24 STYLES) -->
        <div id="tab-content-floors" class="hidden space-y-1">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
            <div id="floor-zone-pills" class="flex items-center gap-0.5 shrink-0"></div>
            <button onclick="filterFloorCat('all')" id="fcat-all" class="ml-auto px-1.5 py-0.5 rounded bg-amber-500 text-slate-950 text-[9px] font-black shrink-0">全</button>
            <button onclick="filterFloorCat('marble')" id="fcat-marble" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">💎石</button>
            <button onclick="filterFloorCat('wood')" id="fcat-wood" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🪵木</button>
            <button onclick="filterFloorCat('chevron')" id="fcat-chevron" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">📐斜</button>
            <button onclick="filterFloorCat('tile')" id="fcat-tile" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🧱磚</button>
          </div>
          <div id="floor-styles-grid" class="flex gap-1 overflow-x-auto no-scrollbar"></div>
        </div>

        <!-- TAB 3: ZONED WALLS (24 STYLES) -->
        <div id="tab-content-walls" class="hidden space-y-1">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
            <div id="wall-zone-pills" class="flex items-center gap-0.5 shrink-0"></div>
            <button onclick="filterWallCat('all')" id="wcat-all" class="ml-auto px-1.5 py-0.5 rounded bg-amber-500 text-slate-950 text-[9px] font-black shrink-0">全</button>
            <button onclick="filterWallCat('art')" id="wcat-art" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">✨漆</button>
            <button onclick="filterWallCat('marble')" id="wcat-marble" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">💎石</button>
            <button onclick="filterWallCat('wood')" id="wcat-wood" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🪵木</button>
            <button onclick="filterWallCat('paint')" id="wcat-paint" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🎨色</button>
          </div>
          <div id="wall-styles-grid" class="flex gap-1 overflow-x-auto no-scrollbar"></div>
        </div>

        <!-- TAB 4: FURNITURE & PARTITIONS (60 ITEMS) -->
        <div id="tab-content-furniture" class="hidden space-y-1">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
            <button onclick="filterFurnSubCat('all')" id="furnsub-all" class="px-1.5 py-0.5 rounded bg-amber-500 text-slate-950 text-[9px] font-black shrink-0">🌟全</button>
            <button onclick="filterFurnSubCat('storage')" id="furnsub-storage" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🚪櫃</button>
            <button onclick="filterFurnSubCat('beds')" id="furnsub-beds" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🛏️床</button>
            <button onclick="filterFurnSubCat('kit_bath_furn')" id="furnsub-kit_bath_furn" class="px-1.5 py-0.5 rounded bg-slate-800 text-amber-300 text-[9px] font-bold shrink-0">☕廚衛</button>
            <button onclick="filterFurnSubCat('living')" id="furnsub-living" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🛋️廳枱</button>
            <button onclick="filterFurnSubCat('partition')" id="furnsub-partition" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🧱牆門</button>
            <button onclick="toggleSmartStackMode()" id="btn-smart-stack" class="ml-auto px-1.5 py-0.5 rounded bg-emerald-950/90 border border-emerald-500/50 text-emerald-300 text-[9px] font-bold shrink-0">🧲疊:開</button>
          </div>
          <div id="furniture-catalog-grid" class="flex gap-1 overflow-x-auto no-scrollbar"></div>
        </div>

        <!-- TAB 5: APPLIANCES (40 ITEMS) -->
        <div id="tab-content-appliances" class="hidden">
          <div id="appliances-catalog-grid" class="flex gap-1 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 6: LIGHTING (20 ITEMS) -->
        <div id="tab-content-lighting" class="hidden">
          <div id="lighting-catalog-grid" class="flex gap-1 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>
      </div>
    </section>
  </div>

  <!-- ====================================================================== -->
  <!-- MODAL 1: UNIT PICKER (A座 18室 + B座 18室 = 36室)                      -->
  <!-- ====================================================================== -->
  <div id="unit-picker-modal" class="hidden fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-4 py-2.5 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-base">🏢</span>
          <h3 class="text-sm font-black text-white">揀選座數及單位 (共36個戶型)</h3>
        </div>
        <button onclick="closeUnitPickerModal()" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 font-bold text-xs">✕</button>
      </div>
      <div class="px-3 py-2 bg-slate-950/60 border-b border-slate-800 flex gap-1.5">
        <button onclick="filterUnitBlock('ALL')" id="ublock-ALL" class="px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 font-black text-xs">全部(36室)</button>
        <button onclick="filterUnitBlock('A')" id="ublock-A" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-200 font-bold text-xs">🅰️ A座 (18室)</button>
        <button onclick="filterUnitBlock('B')" id="ublock-B" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-200 font-bold text-xs">🅱️ B座 (18室)</button>
      </div>
      <div id="unit-picker-grid" class="p-3 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 gap-2"></div>
    </div>
  </div>

  <!-- ====================================================================== -->
  <!-- MODAL 2: ITEM DIMENSION & COLOR EDITOR                                 -->
  <!-- ====================================================================== -->
  <div id="edit-item-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h3 id="edit-modal-title" class="text-sm font-black text-amber-400 truncate">修改尺寸與顏色</h3>

    // =========================================================================
    // 5. PROCEDURAL TEXTURE GENERATOR (1024x1024 WOOD / MARBLE / CHEVRON)
    // =========================================================================
    const textureCache = {};
    const previewUrlCache = {};

    function generateProceduralCanvas(kind, style) {
      const cv = document.createElement('canvas');
      cv.width = 256;
      cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = style.c1 || '#e2e8f0';
      ctx.fillRect(0, 0, 256, 256);

      if (style.type === 'plank' || style.type === 'diag_wood') {
        ctx.save();
        if (style.type === 'diag_wood') {
          ctx.translate(128, 128);
          ctx.rotate(Math.PI / 4);
          ctx.translate(-192, -192);
        }
        const span = style.type === 'diag_wood' ? 384 : 256;
        const plankW = 48;
        for (let x = 0; x < span; x += plankW) {
          ctx.fillStyle = (Math.floor(x / plankW) % 2 === 0) ? style.c1 : style.c2;
          ctx.fillRect(x, 0, plankW - 1.5, span);
          ctx.strokeStyle = style.knot || '#8c653a';
          ctx.globalAlpha = 0.25;
          for (let i = 0; i < 6; i++) {
            ctx.beginPath();
            ctx.moveTo(x + 4 + i * 7, 0);
            ctx.bezierCurveTo(x + 12, span * 0.33, x + plankW - 10, span * 0.66, x + 6 + i * 6, span);
            ctx.stroke();
          }
          ctx.globalAlpha = 1.0;
          ctx.fillStyle = 'rgba(30,20,10,0.35)';
          ctx.fillRect(x + plankW - 1.5, 0, 1.5, span);
          const jointY = ((x * 37) % 180) + 30;
          ctx.fillRect(x, jointY, plankW, 1.5);
        }
        ctx.restore();
      } else if (style.type === 'chevron' || style.type === 'herringbone') {
        const w = 32, h = 64;
        for (let y = -64; y < 320; y += h / 2) {
          for (let x = -32; x < 320; x += w) {
            const colIdx = Math.floor(x / w);
            ctx.save();
            ctx.translate(x, y);
            ctx.transform(1, colIdx % 2 === 0 ? 0.45 : -0.45, 0, 1, 0, 0);
            ctx.fillStyle = ((colIdx + Math.floor(y / 32)) % 2 === 0) ? style.c1 : style.c2;
            ctx.fillRect(0, 0, w - 1, h / 2 - 1);
            ctx.strokeStyle = 'rgba(40,25,10,0.3)';
            ctx.strokeRect(0, 0, w - 1, h / 2 - 1);
            ctx.restore();
          }
        }
      } else if (style.type === 'marble') {
        ctx.strokeStyle = style.c2 || '#94a3b8';
        ctx.lineWidth = 2.2;
        for (let i = 0; i < 9; i++) {
          ctx.beginPath();
          ctx.moveTo((i * 43) % 256, 0);
          ctx.bezierCurveTo(60 + i * 18, 90, 200 - i * 15, 170, ((i * 71) + 90) % 256, 256);
          ctx.stroke();

          ctx.fillRect(x, 0, 11, 256);
          ctx.fillStyle = style.c2;
          ctx.fillRect(x + 11, 0, 5, 256);
        }

        ctx.strokeStyle = style.c2 || '#64748b';
        ctx.lineWidth = 2;
        for (let i = 0; i <= 256; i += 64) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();

          ctx.globalAlpha = 0.08;
          ctx.beginPath();
          ctx.arc((i * 53) % 256, (i * 97) % 256, 18 + (i % 25), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      }
      return cv;
    }

    function getThreeTexture(kind, styleId) {
      const key = kind + '_' + styleId;
      if (textureCache[key]) return textureCache[key];
      const list = kind === 'floor' ? FLOOR_STYLES : WALL_STYLES;
      const style = list.find(s => s.id === styleId) || list[0];
      const cv = generateProceduralCanvas(kind, style);
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(kind === 'floor' ? 2.4 : 1.8, kind === 'floor' ? 2.4 : 1.2);
      textureCache[key] = tex;
      return tex;
    }

    function getPreviewDataURL(kind, style) {
      const key = kind + '_url_' + style.id;
      if (previewUrlCache[key]) return previewUrlCache[key];
      const cv = generateProceduralCanvas(kind, style);
      const url = cv.toDataURL('image/png');
      previewUrlCache[key] = url;
      return url;
    }

    // =========================================================================

    function initApp() {
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || Math.floor(window.innerHeight * 0.8);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1120);

      camera = new THREE.PerspectiveCamera(42, w / h, 50, 45000);
      camera.position.set(2200, 7600, 7800);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2 - 0.03;
      controls.minDistance = 1200;
      controls.maxDistance = 19000;
      controls.target.set(2000, 300, 3200);

      hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.72);
      scene.add(hemiLight);

      ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
      scene.add(ambientLight);

      dirLight = new THREE.DirectionalLight(0xfffbeb, 0.85);
      dirLight.position.set(4500, 8500, 5500);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 500;
      dirLight.shadow.camera.far = 22000;
      const d = 6500;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      // Subtle architectural grid
      const grid = new THREE.GridHelper(14000, 28, 0x334155, 0x1e293b);
      grid.position.set(2000, -15, 3200);

      structureGroup = new THREE.Group();

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      updateSmartWallTransparency();
      if (renderer && scene && camera) renderer.render(scene, camera);

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      if (!container || !renderer || !camera) return;
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w > 10 && h > 10) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

    // =========================================================================
    // 8. PARAMETRIC UNIT STRUCTURE BUILDER FOR ALL 36 UNITS (A1-A22, B1-B22)
    // =========================================================================
    function getUnitGeometryProfile(unitId) {
      // Base archetypes:
      // 1) '3BR_BOT_WIN': B10, B9 (mirrorX)
      // 2) '3BR_TOP_WIN': B1, B15
      // 3) '2BR_BOT_WIN': B4, B6, A4, A11, A13
      // 4) '2BR_TOP_WIN': B3, B16, B18, A1, A14, A16
      // 5) '2BR_BAY_4900': B11, B13, B14 (mirrorX)
      // 6) '1BR_COMPACT_TOP': B2, B17 (mirrorX), A15 (mirrorX)
      // 7) '1BR_COMPACT_BOT': B5, B12 (mirrorX), A12 (mirrorX)
      // 8) '2BR_HORIZ': B21, B22 (mirrorX), A10, A19, A20, A21
      // 9) '3BR_HORIZ': A2, A3, A7, A8, A9, A22
      const mirrorXUnits = ['B9', 'B14', 'B12', 'B17', 'B22', 'A1', 'A4', 'A9', 'A11', 'A12', 'A13', 'A14', 'A15', 'A16', 'B16', 'B18', 'A21'];
      const mirrorZUnits = ['B1', 'B15', 'B3', 'B16', 'B18', 'B2', 'B17', 'A1', 'A2', 'A7', 'A14', 'A15', 'A16'];
      const is1BR = ['B2', 'B5', 'B12', 'B17', 'A12', 'A15'].includes(unitId);
      const is2BR = ['B3', 'B4', 'B6', 'B11', 'B13', 'B14', 'B16', 'B18', 'B21', 'B22', 'A1', 'A4', 'A10', 'A11', 'A13', 'A14', 'A16', 'A19', 'A20', 'A21'].includes(unitId);
      const isBay4900 = ['B11', 'B13', 'B14'].includes(unitId);
      const isHoriz = ['B21', 'B22', 'A2', 'A3', 'A7', 'A8', 'A9', 'A10', 'A19', 'A20', 'A21', 'A22'].includes(unitId);

      return {
        unitId,
        is1BR,
        is2BR,
        is3BR: !is1BR && !is2BR,
        isBay4900,
        isHoriz,
        mirrorX: mirrorXUnits.includes(unitId),
        mirrorZ: mirrorZUnits.includes(unitId)
      };
    }

    function clearStructureGroups() {
      while (structureGroup.children.length) structureGroup.remove(structureGroup.children[0]);
      while (dimensionGroup.children.length) dimensionGroup.remove(dimensionGroup.children[0]);
      floorZoneMeshes = {};
      wallZoneMeshes = { w_liv: [], w_tv: [], w_rm_left: [], w_rm_top: [], w_rm_bot: [], w_kit: [], w_bath: [], w_part: [] };
      structuralWalls = [];
    }

    function addFloorTileZone(zoneId, x, z, w, d) {
      const styleId = zoneFloorAssignment[zoneId] || 'f_oak_nat';
      const tex = getThreeTexture('floor', styleId);
      const geo = new THREE.BoxGeometry(w, 24, d);
      const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45, metalness: 0.05 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x + w / 2, -12, z + d / 2);
      mesh.receiveShadow = true;
      mesh.userData = { isFloorZone: true, zoneId };
      structureGroup.add(mesh);
      if (!floorZoneMeshes[zoneId]) floorZoneMeshes[zoneId] = [];
      floorZoneMeshes[zoneId].push(mesh);
    }

    function addStructWall(x, z, w, d, wallZoneId, isExterior, hasWindow, isSeaWindow) {
      const maxH = 2550;
      const styleId = zoneWallAssignment[wallZoneId] || 'w_cream';
      const tex = getThreeTexture('wall', styleId);

      if (hasWindow) {
        // Sill wall (900mm)
        const sillH = 900;
        const sillGeo = new THREE.BoxGeometry(w, sillH, d);
        const sillMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 });
        const sillMesh = new THREE.Mesh(sillGeo, sillMat);
        sillMesh.position.set(x + w / 2, sillH / 2, z + d / 2);
        sillMesh.castShadow = true;
        sillMesh.receiveShadow = true;
        structureGroup.add(sillMesh);

        // Glass pane
        const glassH = 1350;
        const glassGeo = new THREE.BoxGeometry(w > d ? w - 40 : 28, glassH, d > w ? d - 40 : 28);
        const glassMat = new THREE.MeshPhysicalMaterial({
          color: isSeaWindow ? 0x38bdf8 : 0xbae6fd,
          transparent: true,
          opacity: 0.36,
          roughness: 0.1,
          transmission: 0.5
        });
        const glassMesh = new THREE.Mesh(glassGeo, glassMat);
        glassMesh.position.set(x + w / 2, sillH + glassH / 2, z + d / 2);
        structureGroup.add(glassMesh);

        // Black aluminum window frame
        const frameEdges = new THREE.EdgesGeometry(glassGeo);
        const frameLine = new THREE.LineSegments(frameEdges, new THREE.LineBasicMaterial({ color: 0x0f172a }));
        glassMesh.add(frameLine);

        structuralWalls.push({ mesh: sillMesh, maxH: sillH, baseCenterY: sillH / 2, isExterior, glassMesh, glassBaseY: sillH + glassH / 2, zoneId: wallZoneId });
        if (wallZoneMeshes[wallZoneId]) wallZoneMeshes[wallZoneId].push(sillMesh);
      } else {
        const geo = new THREE.BoxGeometry(w, maxH, d);
        const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.65 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x + w / 2, maxH / 2, z + d / 2);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = { isWallZone: true, zoneId: wallZoneId };
        structureGroup.add(mesh);
        structuralWalls.push({ mesh, maxH, baseCenterY: maxH / 2, isExterior, zoneId: wallZoneId });
        if (wallZoneMeshes[wallZoneId]) wallZoneMeshes[wallZoneId].push(mesh);
      }
    }

    function makeDimLabelSprite(text, colorHex = '#fda4af') {
      const cv = document.createElement('canvas');
      cv.width = 256;
      cv.height = 64;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(6, 6, 244, 52, 12);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 24px "Noto Sans HK", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 33);
      const tex = new THREE.CanvasTexture(cv);
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(780, 195, 1);
      return sp;
    }

    function addDimLine(x1, z1, x2, z2, labelText) {
      const y = 60;
      const pts = [new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2)];
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xf43f5e }));
      dimensionGroup.add(line);
      const sp = makeDimLabelSprite(labelText);
      sp.position.set((x1 + x2) / 2, y + 90, (z1 + z2) / 2);
      dimensionGroup.add(sp);
    }

    function applyCurrentWallHeightToStructure() {
      const targetH = wallHeightMode === 'low' ? 450 : (wallHeightMode === 'mid' ? 1300 : 2550);
      structuralWalls.forEach(w => {
        const effH = Math.min(targetH, w.maxH);
        const ratio = effH / w.maxH;
        w.mesh.scale.y = ratio;
        w.mesh.position.y = effH / 2;
        if (w.glassMesh) {
          w.glassMesh.visible = (wallHeightMode === 'full');
        }
      });
      // Sync user-added partition walls & doors with structural wall height
      placedItems.forEach(item => {
        if (item.cat === 'partition' && item.mesh) {
          const effH = Math.min(targetH, item.h);
          const ratio = effH / item.h;
          item.mesh.scale.y = ratio;
        }
      });
    }

    function updateSmartWallTransparency() {
      if (!camera || !controls) return;
      const camDir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
      structuralWalls.forEach(w => {
        if (!w.mesh || !w.mesh.material) return;
        if (zoneIsolateMode && activeFocusZone !== 'all') {
          w.mesh.material.transparent = true;
          w.mesh.material.opacity = 0.22;
          return;
        }
        w.mesh.material.transparent = false;
        w.mesh.material.opacity = 1.0;
      });
    }

    // =========================================================================
    // 9. HIGH-DETAIL 3D MESH GENERATOR (PHOTO-ACCURATE KITCHEN/BATH/FURNITURE)
    // =========================================================================
    function buildDetailedItemMesh(itemData) {
      const group = new THREE.Group();
      const { id, cat, w, d, h, color } = itemData;
      const mainColor = new THREE.Color(color || '#d8b78e');
      const baseMat = new THREE.MeshStandardMaterial({ color: mainColor, roughness: 0.45, metalness: 0.08 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3, metalness: 0.5 });
      const chromeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.15, metalness: 0.85 });
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25, metalness: 0.05 });
      const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.38, roughness: 0.1 });

      // 1. PHOTO-ACCURATE L-SHAPED KITCHEN COMBO (Attachments 3 & 4)
      if (id === 'kit_l_combo_photo' || id === 'kit_i_combo_full') {
        const counterH = 860;
        // Main base cabinet + countertop
        const baseCab = new THREE.Mesh(new THREE.BoxGeometry(w, counterH - 35, 600), baseMat);
        baseCab.position.set(0, (counterH - 35) / 2, -d / 2 + 300);
        group.add(baseCab);
        const topStone = new THREE.Mesh(new THREE.BoxGeometry(w, 35, 620), stoneMat);
        topStone.position.set(0, counterH - 17, -d / 2 + 300);
        group.add(topStone);

        // Front-load Drum Washer embedded under counter (Black porthole ring + dial)
        const washerBody = new THREE.Mesh(new THREE.BoxGeometry(590, 810, 570), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }));
        washerBody.position.set(w / 2 - 330, 405, -d / 2 + 305);
        group.add(washerBody);

    // =========================================================================
    // 11. SCENE ITEM PLACEMENT, SELECTION & TOUCH DRAGGING
    // =========================================================================
    function rebuildPlacedItemsMeshes() {
      while (furnitureGroup.children.length) furnitureGroup.remove(furnitureGroup.children[0]);
      placedItems.forEach(item => {
        const mesh = buildDetailedItemMesh(item);
        mesh.position.set(item.x, item.y || 0, item.z);
        mesh.rotation.y = THREE.MathUtils.degToRad(item.rot || 0);
        mesh.userData = { isPlacedItem: true, itemRef: item };
        item.mesh = mesh;
        furnitureGroup.add(mesh);
      });
      applyCurrentWallHeightToStructure();
      updateBomBadge();
    }

    function computeSmartAutoStackY(movingItem, targetX, targetZ) {
      if (!smartStackEnabled) return movingItem.y || 0;
      let bestY = 0;
      placedItems.forEach(other => {
        if (other === movingItem) return;
        const dx = Math.abs(targetX - other.x);
        const dz = Math.abs(targetZ - other.z);
        if (dx < (other.w + movingItem.w) * 0.38 && dz < (other.d + movingItem.d) * 0.38) {
          // Allow slotting washer under kitchen counter
          if (movingItem.id.includes('washer') || movingItem.id.includes('dishwasher')) {
            bestY = 0;
          } else if (other.id.startsWith('plat_')) {
            bestY = Math.max(bestY, other.h);
          } else if (movingItem.cat === 'appliances' && other.h <= 950) {
            bestY = Math.max(bestY, other.h);
          }
        }
      });
      return bestY;
    }

    function onPointerDown(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerDownPos = { x: e.clientX, y: e.clientY };
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const itemHits = raycaster.intersectObjects(furnitureGroup.children, true);

      if (itemHits.length > 0) {
        let obj = itemHits[0].object;
        while (obj && !obj.userData.isPlacedItem) obj = obj.parent;
        if (obj && obj.userData.itemRef) {
          selectItem(obj.userData.itemRef);
          isDraggingItem = true;
          controls.enabled = false;
          dragPlane.constant = -(selectedItem.y || 0);
          const intersectPt = new THREE.Vector3();
          if (raycaster.ray.intersectPlane(dragPlane, intersectPt)) {
            dragOffset.set(selectedItem.x - intersectPt.x, 0, selectedItem.z - intersectPt.z);
          }
          return;
        }
      }
    }

    function onPointerMove(e) {
      if (!isDraggingItem || !selectedItem) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersectPt = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(dragPlane, intersectPt)) {
        const snapX = Math.round((intersectPt.x + dragOffset.x) / 50) * 50;
        const snapZ = Math.round((intersectPt.z + dragOffset.z) / 50) * 50;
        selectedItem.x = snapX;
        selectedItem.z = snapZ;
        if (selectedItem.cat !== 'lighting') {
          selectedItem.y = computeSmartAutoStackY(selectedItem, snapX, snapZ);
        }
        if (selectedItem.mesh) {
          selectedItem.mesh.position.set(selectedItem.x, selectedItem.y, selectedItem.z);
        }
        updateQuickbarInfo();
      }
    }

    function onPointerUp(e) {
      if (isDraggingItem) {
        isDraggingItem = false;
        controls.enabled = true;
        return;
      }
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist < 6) {
        // Check if user tapped floor zone to switch zone
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const itemHits = raycaster.intersectObjects(furnitureGroup.children, true);
        if (itemHits.length === 0) {
          deselectItem();
        }
      }
    }

      if (!selectedItem) return;
      selectedItem.rot = ((selectedItem.rot || 0) + deg) % 360;
      if (selectedItem.mesh) selectedItem.mesh.rotation.y = THREE.MathUtils.degToRad(selectedItem.rot);

    function nudgeSelected(dx, dz) {
      if (!selectedItem) return;
      selectedItem.x += dx;
      selectedItem.z += dz;
      if (selectedItem.mesh) selectedItem.mesh.position.set(selectedItem.x, selectedItem.y, selectedItem.z);

    function nudgeSelectedY(dy) {
      if (!selectedItem) return;
      selectedItem.y = Math.max(0, (selectedItem.y || 0) + dy);
      if (selectedItem.mesh) selectedItem.mesh.position.y = selectedItem.y;

    function groundSelectedY() {
      if (!selectedItem) return;
      selectedItem.y = 0;
      if (selectedItem.mesh) selectedItem.mesh.position.y = 0;

    }

    function copyBomText() {
      const lines = placedItems.map((it, i) => `${i + 1}. ${it.name}: 闊${it.w} x 深${it.d} x 高${it.h}mm`);
      const text = `【影輝苑 ${UNIT_META[currentUnitId].name} 室內設計清單】\n` + lines.join('\n');
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已複製清單至剪貼簿');
    }

    function takeScreenshot() {
      if (!renderer || !scene || !camera) return;
      renderer.render(scene, camera);
      const url = renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = `影輝苑_${currentUnitId}室_3D設計.png`;
      a.click();
      showToast('已下載高清截圖');
    }

    function showToast(msg) {
      const el = document.getElementById('toast-text');
      if (el) el.textContent = msg;
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
