                    {q:"What is the weather like in spring?", options:["warm","hot","cold"], ans:"warm"}
                 ],
                 hard: [
                    {q:"Choose the correct phrase:", options:["in spring","on spring","at spring"], ans:"in spring"},
                    {q:"Choose the correct phrase:", options:["in summer","on summer","at summer"], ans:"in summer"},
                    {q:"Choose the correct phrase:", options:["in autumn","on autumn","at autumn"], ans:"in autumn"},
                    {q:"Choose the correct phrase:", options:["in winter","on winter","at winter"], ans:"in winter"},
                    {q:"Spelling check:", options:["autumn","autum","autunm"], ans:"autumn"},
                    {q:"Spelling check:", options:["summer","sumer","summor"], ans:"summer"},
                    {q:"Spelling check:", options:["jumper","jumber","jumpur"], ans:"jumper"},
                    {q:"Spelling check:", options:["trousers","trouzers","trouseres"], ans:"trousers"},
                    {q:"Spelling check:", options:["scarf","scarff","scaf"], ans:"scarf"},
                    {q:"Grammar: I swim ___ the sea.", options:["in","on","at"], ans:"in"},
                    {q:"Grammar: look ___ the flowers", options:["at","on","in"], ans:"at"},
                    {q:"Grammar: have ___ barbecue", options:["a","an","some"], ans:"a"},
                    {q:"Grammar: eat ice ___", options:["lollies","lollys","lollie"], ans:"lollies"},

                    {q:"Grammar: I like ___ ice cream.", options:["eating","eat","eats"], ans:"eating"}

            },
            15: { title: "Level 15: Birthday", teach: "1. 生日派對。<br>2. 食物：biscuits, cookies, cakes。<br>3. 感覺：delighted, overjoyed, excited (都是開心的意思喔).",
                 easy: [
                    {q:"What date is Ada's birthday?", options:["3rd July","1st May","25th December"], ans:"3rd July"},
                    {q:"What do you eat at a birthday party?", options:["cakes","rice","homework"], ans:"cakes"},
                    {q:"What salty snack is made of potatoes?", options:["potato chips","cake","ice cream"], ans:"potato chips"},

                    {q:"Which word means 'happy to do something'?", options:["pleased","lazy","tired"], ans:"pleased"},
                    {q:"Which word means 'happy and looking forward to something'?", options:["excited","bored","sad"], ans:"excited"},
                    {q:"Where does Ada have her birthday party?", options:["at home","in the hospital","in the library"], ans:"at home"},
                    {q:"What do you sing at a birthday party?", options:["birthday song","lullaby","school song"], ans:"birthday song"},
                    {q:"What goes on top of a birthday cake?", options:["candles","shoes","books"], ans:"candles"},
                    {q:"What do you give someone for their birthday?", options:["a present","a pencil","a problem"], ans:"a present"},
                    {q:"What month comes after June?", options:["July","May","August"], ans:"July"},
                    {q:"What healthy food do you mix with vegetables?", options:["salad","sweets","potato chips"], ans:"salad"},
                    {q:"Another word for biscuits is...", options:["cookies","cakes","sweets"], ans:"cookies"},
                    {q:"A feeling of happiness is...", options:["glad","angry","scared"], ans:"glad"}
                 ],
                 hard: [
                    {q:"Spelling check:", options:["biscuits","biscuts","biscutes"], ans:"biscuits"},
                    {q:"Spelling check:", options:["sandwiches","sandwichs","sandwitches"], ans:"sandwiches"},
                    {q:"Spelling check:", options:["potato chips","potato chip","potatos chips"], ans:"potato chips"},
                    {q:"Spelling check:", options:["delighted","delited","dlighted"], ans:"delighted"},
                    {q:"Spelling check:", options:["overjoyed","overjoy","overjoied"], ans:"overjoyed"},
                    {q:"Spelling check:", options:["excited","exsited","excitted"], ans:"excited"},
                    {q:"Choose the correct phrase:", options:["Today is the 3rd of July.","Today is a 3rd of July.","Today is an 3rd of July."], ans:"Today is the 3rd of July."},
                    {q:"Choose the correct phrase:", options:["Today is the 3rd of July.","Today is the 3rd on July.","Today is the 3rd in July."], ans:"Today is the 3rd of July."},
                    {q:"Grammar: She feels ___.", options:["great","greatly","greats"], ans:"great"},
                    {q:"Grammar: Friends ___ to her home.", options:["come","comes","coming"], ans:"come"},
                    {q:"Grammar: What do they ___ at the party?", options:["eat","eats","eating"], ans:"eat"},
                    {q:"Grammar: What do friends ___ to her?", options:["give","gives","giving"], ans:"give"},
                    {q:"Grammar: It ___ Ada's birthday.", options:["is","are","am"], ans:"is"},
                    {q:"Word choice: She is ___.", options:["pleased","please","pleasing"], ans:"pleased"},
                    {q:"Choose the correct plural form:", options:["presents","presentes","present"], ans:"presents"},
                    {q:"Choose the correct plural form:", options:["cookies","cookys","cookey"], ans:"cookies"},
                    {q:"Grammar: She ___ excited.", options:["feels","feel","feeling"], ans:"feels"},
                    {q:"Spelling check:", options:["sweets","swets","sweetes"], ans:"sweets"},
                    {q:"Choose the correct sentence:", options:["Today is Ada's birthday.","Today is Ada birthday.","Today are Ada's birthday."], ans:"Today is Ada's birthday."},
                    {q:"Choose the correct question:", options:["What date is it today?","What date it is today?","What is date today?"], ans:"What date is it today?"}
                 ]
            }
        };

        let currentLevel = 1;
        let quizQueue = [];
        let userAnswers = []; 
        let currentQuestionIndex = 0;
        let currentQ = null;
        let retryMode = false; 
        let currentLevelVocab = []; 
        
        let progressScores = JSON.parse(localStorage.getItem('teacherCatScores')) || {};

        window.onload = () => { renderHome(); };

        function clearRecords() {
            if(confirm("確定要清除所有辛苦獲得的星星與分數記錄嗎？")) {
                localStorage.removeItem('teacherCatScores');
                progressScores = {};
                renderHome();
            }
        }

        function renderHome() {
            const grid = document.getElementById("level-grid");
            grid.innerHTML = "";
            const colorPalette = [
                {bg: "#FF5252", shadow: "#C62828"}, {bg: "#FF9800", shadow: "#E65100"},
                {bg: "#4CAF50", shadow: "#2E7D32"}, {bg: "#29B6F6", shadow: "#0277BD"},
                {bg: "#AB47BC", shadow: "#6A1B9A"}, {bg: "#EC407A", shadow: "#AD1457"}
            ];

            for (let i = 1; i <= 15; i++) {
                // 如果該關卡目前還沒有資料庫內容，顯示為準備中，不影響網頁運行
                if (!database[i]) {
                    database[i] = { title: `Level ${i}: 準備中`, teach: "老師準備中...", easy: [{q:"Test", options:["A"], ans:"A"}], hard: [{q:"Test", options:["A"], ans:"A"}] };
                }
                
                let btn = document.createElement("button");
                btn.className = "level-btn";
                
                let color = colorPalette[(i-1) % colorPalette.length];
                btn.style.setProperty('--bg-color', color.bg);
                btn.style.setProperty('--shadow-color', color.shadow);
                
                let bestScore = progressScores[i] || 0;
                let starHTML = "";
                // 滿分標準：20分
                if (bestScore === 20) { starHTML = '<div class="star-big">🌟</div>'; }
                else if (bestScore >= 10) { starHTML = '<div class="star-small">⭐</div>'; }
                else { starHTML = '<div class="star-none">☆</div>'; }
                
                let fullTitle = database[i].title; 
                let themePart = fullTitle.includes(":") ? fullTitle.split(":").slice(1).join(":").trim() : fullTitle;
                
                btn.innerHTML = `
                    ${starHTML}
                    <div class="level-number">Level ${i}</div>
                    <div class="level-theme">${themePart}</div>
                    <div class="score-text">最高分: ${bestScore}/20</div>
                `;
                
                btn.onclick = () => openIntro(i);
                grid.appendChild(btn);
            }
        }

        function openIntro(level) {
            currentLevel = level;
            document.getElementById("home-page").style.display = "none";
            document.getElementById("summary-page").style.display = "none";
            document.getElementById("quiz-page").style.display = "none";
            
            document.getElementById("intro-title").innerText = database[level].title;
            document.getElementById("intro-content").innerHTML = database[level].teach;
            
            document.getElementById("intro-page").style.display = "block";
            window.speechSynthesis.cancel(); 
        }

        function speakIntro() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let plainText = document.getElementById("intro-content").innerHTML.replace(/<[^>]*>?/gm, ''); 
                let utterance = new SpeechSynthesisUtterance(plainText);
                utterance.lang = 'zh-HK'; 
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function shuffleArray(array) {
            let arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            window.speechSynthesis.cancel(); 
            retryMode = false;
            document.getElementById("intro-page").style.display = "none";
            document.getElementById("quiz-page").style.display = "block";
            
            let data = database[currentLevel];
            let allOpts = [];
            data.easy.forEach(q => allOpts.push(...q.options));
            data.hard.forEach(q => allOpts.push(...q.options));
            currentLevelVocab = [...new Set(allOpts)]; 
            
            // 🚨 絕不重複抽題：完全打亂並嚴格抽取 10 題淺 + 10 題深！
            let easyQs = shuffleArray(data.easy).slice(0, 10);
            let hardQs = shuffleArray(data.hard).slice(0, 10);
            
            quizQueue = easyQs.concat(hardQs);
            userAnswers = new Array(quizQueue.length).fill(null);
            currentQuestionIndex = 0;
            
            showQuestion();
        }

        function showQuestion() {
            document.getElementById("tc-hint").style.display = "none"; 
            document.getElementById("skip-btn").style.display = "none"; 
            currentQ = quizQueue[currentQuestionIndex];
            
            if(!retryMode) { document.getElementById("progress-text").innerText = `題號: ${currentQuestionIndex + 1} / ${quizQueue.length}`; }
            else { document.getElementById("progress-text").innerText = `🔄 重新挑戰錯誤題目！`; }
            
            document.getElementById("question-text").innerText = currentQ.q;
            
            let optionsGrid = document.getElementById("options-grid");
            optionsGrid.innerHTML = "";
            
            let currentOpts = [...currentQ.options];
            let loopGuard = 0;
            while (currentOpts.length < 4 && loopGuard < 50) {
                let randomOpt = currentLevelVocab[Math.floor(Math.random() * currentLevelVocab.length)];
                if (!currentOpts.includes(randomOpt)) {
                    currentOpts.push(randomOpt);
                }
                loopGuard++; 
            }
            
            let shuffledOptions = shuffleArray(currentOpts);
            
            shuffledOptions.forEach(opt => {
                let wrap = document.createElement("div");
                wrap.className = "option-wrapper";
                
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, currentQ.ans, wrap);
                
                let tts = document.createElement("button");
                tts.className = "tts-btn";
                tts.innerText = "🔊";
                tts.onclick = () => speakText(opt);
                
                wrap.appendChild(btn);
                wrap.appendChild(tts);
                optionsGrid.appendChild(wrap);
            });
            
            document.getElementById("next-btn").innerText = (currentQuestionIndex === quizQueue.length - 1 && !retryMode) ? "完成關卡 🏁" : "下一頁 ➡️";

            if (retryMode) { showTeacherCatHint("這題之前答錯了，重溫一下知識點吧！"); }
        }

        let autoNextTimeout;

        function checkAnswer(selected, correct, wrapElement) {
            clearTimeout(autoNextTimeout); 
            
            let btns = document.getElementsByClassName("option-btn");
            for(let btn of btns) { btn.disabled = true; }

            if (selected === correct) {
                wrapElement.style.backgroundColor = "#66BB6A"; 
                wrapElement.style.boxShadow = "0 6px 0 #388E3C";
                
                userAnswers[currentQuestionIndex] = { correct: true, selected: selected };
                document.getElementById("skip-btn").style.display = "none";

                if (!retryMode) {
                    triggerExaggeratedEffect(); 
                    autoNextTimeout = setTimeout(nextQ, 2000); 
                } else {
                    let correctCount = userAnswers.filter(ans => ans && ans.correct).length;
                    let currentBest = progressScores[currentLevel] || 0;
                    
                    if (correctCount > currentBest) {
                        progressScores[currentLevel] = correctCount;
                        localStorage.setItem('teacherCatScores', JSON.stringify(progressScores));
                        triggerExaggeratedEffect("🏆 分數 +1！破紀錄啦！");
                    } else {
                        triggerExaggeratedEffect("✅ 成功訂正！分數 +1！"); 
                    }
                    setTimeout(() => { showSummary(); }, 2000); 
                }
            } else {
                wrapElement.style.backgroundColor = "#EF5350"; 
                wrapElement.style.boxShadow = "0 6px 0 #C62828";
                let audio = new Audio('https://www.myinstants.com/media/sounds/error_CDpn0.mp3'); 
                audio.play().catch(e=>{});
                
                if (!retryMode) {
                    userAnswers[currentQuestionIndex] = { correct: false, selected: selected };
                    
                    document.getElementById("skip-btn").style.display = "inline-block";
                    showTeacherCatHint("哎呀，答錯了！試試其他選項！記得：");
                    
                    setTimeout(() => {
                        wrapElement.style.backgroundColor = "#4DD0E1";
                        wrapElement.style.boxShadow = "0 6px 0 #0097A7";
                        for(let btn of btns) { btn.disabled = false; }
                    }, 1000);

                } else {
                    showTeacherCatHint("再試一次！記得：");
                    setTimeout(() => {
                        wrapElement.style.backgroundColor = "#4DD0E1";
                        wrapElement.style.boxShadow = "0 6px 0 #0097A7";
                        for(let btn of btns) { btn.disabled = false; }
                    }, 1000);
                }
            }
        }

        function showTeacherCatHint(prefix) {
            let hintBox = document.getElementById("tc-hint");
            let hintText = document.getElementById("hint-text");
            let plainTeach = database[currentLevel].teach.replace(/<[^>]*>?/gm, ''); 
            hintText.innerText = prefix + plainTeach;
            hintBox.style.display = "block";
        }

        function skipToNext() { document.getElementById("skip-btn").style.display = "none"; nextQ(); }

        function triggerExaggeratedEffect(customMessage) {
            let effect = document.createElement('div');
            const cheers = ["🎉 AMAZING! 🎉", "🤩 SUPER! 🤩", "✨ GENIUS! ✨", "🚀 EXCELLENT! 🚀"];
            effect.innerHTML = customMessage || cheers[Math.floor(Math.random() * cheers.length)];
            effect.className = 'exaggerated-effect';
            
            if(customMessage) { effect.style.fontSize = "3.5em"; }
            
            document.body.appendChild(effect);
            
            let msg = new SpeechSynthesisUtterance("Excellent! Good Job!");
            msg.rate = 1.2;
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);

            setTimeout(() => effect.remove(), 2000);
        }

        function prevQ() {
            if(retryMode) { showSummary(); return; }
            if (currentQuestionIndex > 0) { currentQuestionIndex--; showQuestion(); }
        }

        function nextQ() {
            if(retryMode) { showSummary(); return; }
            if (currentQuestionIndex < quizQueue.length - 1) { currentQuestionIndex++; showQuestion(); } 
            else { showSummary(); }
        }

        function showSummary() {
            retryMode = false;
            document.getElementById("quiz-page").style.display = "none";
            document.getElementById("summary-page").style.display = "block";
            
            let correctCount = userAnswers.filter(ans => ans && ans.correct).length;
            let total = quizQueue.length;
            let currentBest = progressScores[currentLevel] || 0;
            
            if (correctCount > currentBest) {
                progressScores[currentLevel] = correctCount;
                localStorage.setItem('teacherCatScores', JSON.stringify(progressScores));
                currentBest = correctCount; 
            }
            
            document.getElementById("score-text").innerHTML = `
                目前成績：${correctCount} / ${total} <br>
                <span style="font-size: 0.7em; color: #757575;">(最高分紀錄: ${currentBest} / ${total})</span>
            `;
            
            let starsDisplay = document.getElementById("stars-display");
            if (correctCount === 20) { starsDisplay.innerHTML = '<span class="star-big">🌟 滿分大星星！</span>'; } 
            else if (correctCount >= 10) { starsDisplay.innerHTML = '<span class="star-small">⭐ 合格星星！</span>'; } 
            else { starsDisplay.innerHTML = '<span class="star-none">☆ 繼續努力！</span>'; }
            
            let grid = document.getElementById("summary-grid");
            grid.innerHTML = "";
            
            quizQueue.forEach((q, index) => {
                let ansLog = userAnswers[index];
                let item = document.createElement("div");
                
                if (ansLog && ansLog.correct) {
                    item.className = "sum-item sum-correct";
                    item.innerHTML = `✅ 第 ${index+1} 題: ${q.q} <br><small>答對了！</small>`;
                } else {
                    item.className = "sum-item sum-wrong";
                    item.innerHTML = `❌ 第 ${index+1} 題: ${q.q} <br><small>點擊重新挑戰</small>`;
                    item.onclick = () => {
                        retryMode = true;
                        currentQuestionIndex = index;
                        document.getElementById("summary-page").style.display = "none";
                        document.getElementById("quiz-page").style.display = "block";
                        showQuestion();
                    };
                }
                grid.appendChild(item);
            });
        }

        function goHome() {
            document.getElementById("intro-page").style.display = "none";
            document.getElementById("quiz-page").style.display = "none";
            document.getElementById("summary-page").style.display = "none";
            document.getElementById("home-page").style.display = "block";
            window.speechSynthesis.cancel();
            renderHome(); 
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; 
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakHint() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let text = document.getElementById("hint-text").innerText;
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK'; 
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
