<!DOCTYPE html>
<!-- 影輝苑 A、B座 1:1 室內設計 DIY 系統 (36單位) -->
<!-- 1:1 圖則 + 居屋/私樓15款間隔 + 10款風格 -->
<!-- 實景入屋漫遊 + 平面圖瞬移導航系統 -->
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>影輝苑 A、B座 1:1 室內設計 DIY 系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b1120;
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      color: #f8fafc;
    }

    #app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* 88% Screen Height for 3D Layout Viewport */
    #viewport-stage {
      position: relative;
      width: 100%;
      flex: 1 1 88%;
      min-height: 75dvh;
      background: radial-gradient(circle at 50% 35%, #24344d 0%, #111a2e 70%, #090e1a 100%);
      overflow: hidden;
    }

    /* Compact Bottom Design Bar (~12% height) */
    #design-drawer {
      width: 100%;
      height: 12dvh;
      min-height: 82px;
      max-height: 112px;
      background: rgba(9, 14, 26, 0.98);
      border-top: 1px solid rgba(148, 163, 184, 0.22);
      display: flex;
      flex-direction: column;
      z-index: 30;
      transition: height 0.2s ease, min-height 0.2s ease;
    }

    #design-drawer.collapsed {
      height: 38px !important;
      min-height: 38px !important;
    }

    #design-drawer.collapsed #drawer-content {
      display: none;
    }

    .glass-pill {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.24);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .zone-3d-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(251, 191, 36, 0.65);
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      white-space: nowrap;
      transition: transform 0.15s ease, background 0.15s ease;
      z-index: 15;
    }
    .zone-3d-pin:hover, .zone-3d-pin.active {
      background: #f59e0b;
      color: #090e1a;
      transform: translate(-50%, -50%) scale(1.1);
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <!-- ==================== TOP 88%: 3D LAYOUT VIEWPORT ==================== -->
    <div id="viewport-stage">
      <div id="canvas-container" class="w-full h-full"></div>
      <div id="zone-pins-layer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

      <!-- Top Ultra-Compact Floating Bar -->
      <div class="absolute top-1.5 left-1.5 right-1.5 z-20 flex flex-col gap-1 pointer-events-none">
        <div class="flex items-center justify-between gap-1">
          <!-- Unit Selector Pill -->
          <div class="glass-pill px-2 py-1 rounded-xl flex items-center gap-1 pointer-events-auto shadow-lg">
            <span class="text-[11px] font-black text-amber-400">🏢影輝苑</span>
            <select id="unit-select" onchange="switchUnit(this.value)" class="bg-slate-900 text-white text-[11px] font-extrabold rounded-lg px-1.5 py-0.5 border border-amber-400/50 focus:outline-none">
              <optgroup label="B座 (18個單位)">
                <option value="B10">B10室 (3房大則)</option>
                <option value="B11" selected>B11室 (2房凸窗闊廳)</option>
                <option value="B12">B12室 (精巧1房/開放式)</option>
                <option value="B1">B1室 (3房大則)</option>
                <option value="B2">B2室 (精巧1房)</option>
                <option value="B3">B3室 (2房闊廳)</option>
                <option value="B4">B4室 (2房闊廳)</option>
                <option value="B5">B5室 (精巧1房)</option>
                <option value="B6">B6室 (2房闊廳)</option>
                <option value="B9">B9室 (3房大則)</option>
                <option value="B13">B13室 (2房凸窗闊廳)</option>
                <option value="B14">B14室 (2房凸窗闊廳)</option>
                <option value="B15">B15室 (3房大則)</option>
                <option value="B16">B16室 (2房闊廳)</option>
                <option value="B17">B17室 (精巧1房)</option>
                <option value="B18">B18室 (2房闊廳)</option>
                <option value="B21">B21室 (橫廳2房)</option>
                <option value="B22">B22室 (橫廳2房)</option>
              </optgroup>
              <optgroup label="A座 (18個單位)">
                <option value="A1">A1室 (2房闊廳)</option>
                <option value="A2">A2室 (橫廳3房)</option>
                <option value="A3">A3室 (橫廳3房)</option>
                <option value="A4">A4室 (2房闊廳)</option>
                <option value="A7">A7室 (橫廳3房)</option>
                <option value="A8">A8室 (橫廳3房)</option>
                <option value="A9">A9室 (橫廳3房)</option>
                <option value="A10">A10室 (橫廳2房)</option>
                <option value="A11">A11室 (2房闊廳)</option>
                <option value="A12">A12室 (精巧1房)</option>
                <option value="A13">A13室 (2房闊廳)</option>
                <option value="A14">A14室 (2房闊廳)</option>
                <option value="A15">A15室 (精巧1房)</option>
                <option value="A16">A16室 (2房闊廳)</option>
                <option value="A19">A19室 (橫廳2房)</option>
                <option value="A20">A20室 (橫廳2房)</option>
                <option value="A21">A21室 (橫廳2房)</option>
                <option value="A22">A22室 (橫廳3房)</option>
              </optgroup>
            </select>
            <span id="unit-badge-info" class="hidden sm:inline text-[10px] text-slate-300 font-semibold px-1">4900×5325mm</span>
          </div>

          <!-- Top Right Action Buttons -->
          <div class="glass-pill px-1 py-0.5 rounded-xl flex items-center gap-0.5 pointer-events-auto overflow-x-auto no-scrollbar shadow-lg">
            <button onclick="toggleWalkthroughMode()" id="btn-walkthrough" class="px-2 py-0.5 rounded-lg bg-gradient-to-r from-rose-500 via-orange-500 to-amber-400 text-slate-950 text-[10px] font-black shrink-0 shadow">🚶‍♂️實景入屋</button>
            <button onclick="fitFullLayoutTopView()" id="cam-fitall" class="px-2 py-0.5 rounded-lg bg-gradient-to-r from-cyan-400 to-sky-500 text-slate-950 text-[10px] font-black shrink-0 shadow">🗺️全景俯視</button>
            <button onclick="setCameraView('iso3d')" id="cam-iso3d" class="px-1.5 py-0.5 rounded-lg bg-amber-500 text-slate-950 text-[10px] font-black shrink-0">🧊3D</button>
            <button onclick="cycleWallHeight()" id="btn-wall-h" class="px-1.5 py-0.5 rounded-lg bg-slate-800 text-amber-300 text-[10px] font-bold shrink-0">🧱半牆</button>
            <button onclick="toggleDimensions()" id="btn-dim" class="px-1.5 py-0.5 rounded-lg bg-rose-950/80 text-rose-200 text-[10px] font-bold shrink-0">📏尺</button>
            <button onclick="takeScreenshot()" id="btn-snap" class="px-1.5 py-0.5 rounded-lg bg-emerald-600 text-white text-[10px] font-bold shrink-0">📷圖</button>
            <button onclick="openDebugDiagnosticsModal()" id="btn-debug-diag" class="px-1.5 py-0.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-black shrink-0 shadow">🔧診斷</button>
          </div>
        </div>

        <!-- 7 Zone Focus Bar -->
        <div class="flex items-center justify-between gap-1">
          <div class="glass-pill px-1 py-0.5 rounded-xl flex items-center gap-0.5 pointer-events-auto overflow-x-auto no-scrollbar shadow">
            <button onclick="focusZone('all')" id="zbtn-all" class="px-1.5 py-0.5 rounded-lg bg-amber-500 text-slate-950 text-[10px] font-black shrink-0">🏠全</button>
            <button onclick="focusZone('main_hall')" id="zbtn-main_hall" class="px-1.5 py-0.5 rounded-lg text-slate-200 text-[10px] font-bold shrink-0">🚪廳</button>
            <button onclick="focusZone('hall_1')" id="zbtn-hall_1" class="px-1.5 py-0.5 rounded-lg text-slate-200 text-[10px] font-bold shrink-0">🪟窗1</button>
            <button onclick="focusZone('hall_2')" id="zbtn-hall_2" class="px-1.5 py-0.5 rounded-lg text-slate-200 text-[10px] font-bold shrink-0">🌅窗2</button>
            <button onclick="focusZone('side_room')" id="zbtn-side_room" class="px-1.5 py-0.5 rounded-lg text-slate-200 text-[10px] font-bold shrink-0">🛏️房</button>
            <button onclick="focusZone('kitchen')" id="zbtn-kitchen" class="px-1.5 py-0.5 rounded-lg text-slate-200 text-[10px] font-bold shrink-0">🍳廚</button>
            <button onclick="focusZone('bathroom')" id="zbtn-bathroom" class="px-1.5 py-0.5 rounded-lg text-slate-200 text-[10px] font-bold shrink-0">🚿廁</button>
          </div>
        </div>
      </div>

      <!-- Right Floating Camera Zoom & Orbit Controls -->
      <div class="absolute right-2 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-1 glass-pill p-1 rounded-2xl shadow-xl pointer-events-auto">
        <button onclick="stepZoomCamera(0.82)" title="放大" class="w-7 h-7 rounded-xl bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-white font-black text-xs flex items-center justify-center">➕</button>
        <button onclick="stepZoomCamera(1.22)" title="縮小" class="w-7 h-7 rounded-xl bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-white font-black text-xs flex items-center justify-center">➖</button>
        <button onclick="stepRotateCamera(-Math.PI/4)" title="左轉視角" class="w-7 h-7 rounded-xl bg-slate-800 hover:bg-sky-400 hover:text-slate-950 text-sky-300 font-black text-xs flex items-center justify-center">⟲</button>
        <button onclick="stepRotateCamera(Math.PI/4)" title="右轉視角" class="w-7 h-7 rounded-xl bg-slate-800 hover:bg-sky-400 hover:text-slate-950 text-sky-300 font-black text-xs flex items-center justify-center">⟳</button>
      </div>

      <!-- Selected Furniture Floating Toolbar (with Move Lock Protection) -->
      <div id="selected-item-bar" class="hidden absolute bottom-2 left-1/2 -translate-x-1/2 z-25 glass-pill px-2.5 py-1.5 rounded-2xl flex items-center gap-1.5 shadow-2xl border border-amber-400/60 max-w-[96vw] overflow-x-auto no-scrollbar">
        <span id="sel-item-title" class="text-[10px] font-black text-amber-300 shrink-0 max-w-[110px] truncate">已選物件</span>
        <button onclick="toggleMoveLockMode()" id="btn-move-lock" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[10px] font-black border border-slate-600 shrink-0">✥移動:關</button>
        <button onclick="rotateSelectedItem(-Math.PI/2)" class="px-1.5 py-0.5 rounded-lg bg-slate-800 text-sky-300 text-[10px] font-bold shrink-0">↺左轉90°</button>
        <button onclick="rotateSelectedItem(Math.PI/2)" class="px-1.5 py-0.5 rounded-lg bg-slate-800 text-sky-300 text-[10px] font-bold shrink-0">↻右轉90°</button>
        <div id="sel-color-swatches" class="flex items-center gap-1 px-1 shrink-0"></div>
        <button onclick="deleteSelectedItem()" class="px-1.5 py-0.5 rounded-lg bg-rose-600 text-white text-[10px] font-bold shrink-0">🗑️刪除</button>
        <button onclick="deselectItem()" class="px-1.5 py-0.5 rounded-lg bg-slate-700 text-slate-300 text-[10px] font-bold shrink-0">✕</button>
      </div>

      <!-- Toast Notification -->
      <div id="toast-banner" class="hidden absolute top-14 left-1/2 -translate-x-1/2 z-40 glass-pill px-3 py-1 rounded-full text-[11px] font-bold text-emerald-300 border border-emerald-500/50 shadow-lg pointer-events-none"></div>

      <!-- ==================== FIRST-PERSON INDOOR WALKTHROUGH + 2D FLOOR PLAN HUD ==================== -->
      <div id="walkthrough-hud" class="hidden absolute inset-0 z-25 pointer-events-none">
        <!-- Top-Left Interactive 2D Floor Plan Mini-Map -->
        <div id="walkthrough-minimap-box" class="pointer-events-auto absolute top-14 left-2 glass-pill p-1.5 rounded-2xl border border-amber-400/60 shadow-2xl flex flex-col gap-1">
          <div class="flex items-center justify-between gap-1 px-0.5">
            <span class="text-[10px] font-black text-amber-300">🗺️平面圖導航 <span class="text-[8px] text-slate-300 font-normal">(點圖瞬移)</span></span>
            <button onclick="toggleMinimapSize()" id="btn-minimap-size" class="px-1.5 py-0.2 rounded bg-slate-800 text-sky-300 text-[9px] font-bold">🔍放大</button>
          </div>
          <canvas id="walkthrough-minimap-canvas" width="150" height="150" class="rounded-xl bg-slate-950/95 border border-slate-700 cursor-crosshair touch-none"></canvas>
          <div class="grid grid-cols-3 gap-1 pt-0.5">
            <button onclick="teleportWalkthroughTo('foyer')" class="px-1 py-0.5 rounded bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-[9px] font-bold text-slate-200">🚪玄關</button>
            <button onclick="teleportWalkthroughTo('living')" class="px-1 py-0.5 rounded bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-[9px] font-bold text-slate-200">🛋️客廳</button>
            <button onclick="teleportWalkthroughTo('master')" class="px-1 py-0.5 rounded bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-[9px] font-bold text-slate-200">🛏️主房</button>
            <button onclick="teleportWalkthroughTo('kid')" class="px-1 py-0.5 rounded bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-[9px] font-bold text-slate-200">🧸童房</button>
            <button onclick="teleportWalkthroughTo('kitchen')" class="px-1 py-0.5 rounded bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-[9px] font-bold text-slate-200">🍳廚房</button>
            <button onclick="teleportWalkthroughTo('bathroom')" class="px-1 py-0.5 rounded bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-[9px] font-bold text-slate-200">🚿廁所</button>
          </div>
        </div>

        <!-- Top-Right Walkthrough Status & Gyroscope Controls -->
        <div class="pointer-events-auto absolute top-14 right-11 glass-pill px-2 py-1.5 rounded-2xl border border-rose-400/50 shadow-xl flex flex-col gap-1 items-end">
          <div class="flex items-center gap-1">
            <button onclick="toggleEyeHeightMode()" id="btn-eye-height" class="px-2 py-0.5 rounded-lg bg-slate-800 text-amber-300 text-[10px] font-bold border border-slate-600">👁️成人1.55m</button>
            <button onclick="toggleGyroscopeLook()" id="btn-gyro" class="px-2 py-0.5 rounded-lg bg-slate-800 text-sky-300 text-[10px] font-bold border border-slate-600">📱體感鏡頭:關</button>
            <button onclick="toggleWalkthroughMode()" class="px-2 py-0.5 rounded-lg bg-rose-600 text-white text-[10px] font-black shadow">✕退出實景</button>
          </div>
          <div class="text-[9px] text-slate-300">👆單指掃畫面360°轉頭・點左上平面圖或按下方鍵行路</div>
        </div>

        <!-- Bottom Virtual Walking D-Pad -->
        <div class="pointer-events-auto absolute bottom-2.5 left-1/2 -translate-x-1/2 glass-pill px-2.5 py-1.5 rounded-2xl border border-amber-400/50 shadow-2xl flex items-center gap-1.5">
          <button onpointerdown="startWalkMove('turnLeft')" onpointerup="stopWalkMove()" onpointerleave="stopWalkMove()" class="w-9 h-9 rounded-xl bg-slate-800 active:bg-sky-400 active:text-slate-950 text-sky-300 font-black text-xs flex flex-col items-center justify-center border border-slate-700">
            <span>⟲</span><span class="text-[8px]">左轉</span>
          </button>
          <button onpointerdown="startWalkMove('left')" onpointerup="stopWalkMove()" onpointerleave="stopWalkMove()" class="w-9 h-9 rounded-xl bg-slate-800 active:bg-amber-500 active:text-slate-950 text-white font-black text-xs flex flex-col items-center justify-center border border-slate-700">
            <span>⬅️</span><span class="text-[8px]">左移</span>
          </button>
          <div class="flex flex-col gap-1">
            <button onpointerdown="startWalkMove('forward')" onpointerup="stopWalkMove()" onpointerleave="stopWalkMove()" class="w-12 h-9 rounded-xl bg-gradient-to-b from-amber-400 to-orange-500 text-slate-950 font-black text-xs flex flex-col items-center justify-center shadow">
              <span>⬆️</span><span class="text-[8px] font-black">前進</span>
            </button>
            <button onpointerdown="startWalkMove('backward')" onpointerup="stopWalkMove()" onpointerleave="stopWalkMove()" class="w-12 h-8 rounded-xl bg-slate-800 active:bg-amber-500 active:text-slate-950 text-white font-black text-[10px] flex items-center justify-center border border-slate-700">
              <span>⬇️後退</span>
            </button>
          </div>
          <button onpointerdown="startWalkMove('right')" onpointerup="stopWalkMove()" onpointerleave="stopWalkMove()" class="w-9 h-9 rounded-xl bg-slate-800 active:bg-amber-500 active:text-slate-950 text-white font-black text-xs flex flex-col items-center justify-center border border-slate-700">
            <span>➡️</span><span class="text-[8px]">右移</span>
          </button>
          <button onpointerdown="startWalkMove('turnRight')" onpointerup="stopWalkMove()" onpointerleave="stopWalkMove()" class="w-9 h-9 rounded-xl bg-slate-800 active:bg-sky-400 active:text-slate-950 text-sky-300 font-black text-xs flex flex-col items-center justify-center border border-slate-700">
            <span>⟳</span><span class="text-[8px]">右轉</span>
          </button>
        </div>
      </div>

      <!-- Pop-up Selector Overlay for "人數 / 類別 / 間隔 / 風格" -->
      <div id="tpl-popup-overlay" class="hidden absolute bottom-2 left-2 right-2 z-30 glass-pill p-2.5 rounded-2xl border border-amber-400/60 shadow-2xl max-h-[46vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-1.5 pb-1 border-b border-slate-700/80">
          <span id="tpl-popup-title" class="text-xs font-black text-amber-300">選擇項目</span>
          <button onclick="closeTemplatePopup()" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-300 text-[10px] font-bold">✕ 關閉</button>
        </div>
        <div id="tpl-popup-body" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-1.5"></div>
      </div>

      <!-- Built-in Self-Diagnostic & Method 3 Prompt Helper Modal -->
      <div id="debug-diag-modal" class="hidden absolute inset-3 z-50 glass-pill p-3 rounded-2xl border border-indigo-400/70 shadow-2xl flex flex-col justify-between overflow-hidden">
        <div class="flex items-center justify-between border-b border-slate-700 pb-2">
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-black text-indigo-300">🔧 系統診斷中心 ＆ 方法三(分段修改) Prompt 產生器</span>
            <span id="diag-status-pill" class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[10px] font-black">運作正常</span>
          </div>
          <button onclick="closeDebugDiagnosticsModal()" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-300 text-[10px] font-bold">✕ 關閉</button>
        </div>
        <div id="debug-diag-content" class="flex-1 overflow-y-auto my-2 space-y-1.5 text-[11px] font-mono text-slate-200 pr-1"></div>
        <div class="flex flex-col gap-1.5 pt-2 border-t border-slate-700">
          <div class="text-[10px] font-bold text-amber-300">📋 點擊下方按鈕即可一鍵複製「方法三：分段指定函數修改」Prompt：</div>
          <div class="flex flex-wrap items-center gap-1.5">
            <button onclick="copyMethod3Prompt('layout')" class="px-2 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold">① 複製「只改單位間隔/擺位」Prompt</button>
            <button onclick="copyMethod3Prompt('mesh')" class="px-2 py-1 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-[10px] font-bold">② 複製「只改3D傢俬細節」Prompt</button>
            <button onclick="copyMethod3Prompt('ui')" class="px-2 py-1 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-[10px] font-bold">③ 複製「只改介面按鈕」Prompt</button>
            <button onclick="copyMethod3Prompt('full')" class="px-2 py-1 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-[10px] font-black">④ 複製「100%無省略全檔重寫」Prompt</button>
            <button onclick="runSystemSelfCheck()" class="px-2 py-1 rounded-lg bg-indigo-600 text-white text-[10px] font-bold ml-auto">🔄 重新檢測</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== BOTTOM 12%: ULTRA-COMPACT DESIGN DRAWER ==================== -->
    <div id="design-drawer">
      <!-- Top Tab Bar -->

    let isGyroEnabled = false;
    let gyroBaseAlpha = null;

    const zoneFloorAssignment = {
      main_hall: 'f_oak',
      hall_1: 'f_oak',
      hall_2: 'f_oak',
      side_room: 'f_oak',
      kitchen: 'f_kit_stone',
      bathroom: 'f_bath_slate'
    };

    const zoneWallAssignment = {
      main_hall: 'w_cream',
      hall_1: 'w_cream',
      hall_2: 'w_cream',
      side_room: 'w_cream',
      kitchen: 'w_pearl',
      bathroom: 'w_trav'
    };

    const textureCache = {};

    // =========================================================================
    // 5. PROCEDURAL TEXTURES FOR WOOD & STONE
    // =========================================================================
    function getProceduralTexture(styleObj) {
      const key = styleObj.id + '_' + styleObj.color;
      if (textureCache[key]) return textureCache[key];

      const cvs = document.createElement('canvas');
      cvs.width = 256;
      cvs.height = 256;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = styleObj.color;
      ctx.fillRect(0, 0, 256, 256);

      if (styleObj.type === 'wood') {
        ctx.strokeStyle = 'rgba(60, 35, 15, 0.14)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 64; i += 16) {
          ctx.beginPath();
          ctx.moveTo(0, i * 4);
          ctx.lineTo(256, i * 4);
          ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        for (let i = 0; i < 30; i++) {
          ctx.beginPath();
          ctx.moveTo(Math.random() * 256, 0);
          ctx.lineTo(Math.random() * 256, 256);
          ctx.stroke();
        }
      } else if (styleObj.type === 'tile') {
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.22)';
        ctx.lineWidth = 3;
        ctx.strokeRect(2, 2, 124, 124);
        ctx.strokeRect(130, 2, 124, 124);
        ctx.strokeRect(2, 130, 124, 124);
        ctx.strokeRect(130, 130, 124, 124);
      }

      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      textureCache[key] = tex;
      return tex;
    }

    // =========================================================================
    // 6. UNIT GEOMETRY PROFILE & COORDINATE TRANSFORM ENGINE
    // =========================================================================
    function getUnitGeometryProfile(unitId) {
      const meta = UNIT_META[unitId] || UNIT_META.B11;
      const is1BR = meta.type === '1BR';
      const isBay4900 = meta.type === '2BR_BAY';
      const is2BR = meta.type === '2BR' || meta.type === '2BR_H' || isBay4900;
      const is3BR = meta.type === '3BR' || meta.type === '3BR_H';
      const isHoriz = meta.type === '2BR_H' || meta.type === '3BR_H';

      const mirrorX = ['B9', 'B1', 'B4', 'B14', 'B18', 'B2', 'B17', 'A3', 'A9', 'A11', 'A14', 'A15', 'A20'].includes(unitId);
      const mirrorZ = ['B3', 'B16', 'A1', 'A16'].includes(unitId);

      const baseW = is1BR ? 2350 : (isBay4900 ? 4900 : (is2BR ? 4525 : 3820));
      const baseD = is1BR ? 6000 : (isBay4900 ? 5325 : (is2BR ? 6165 : 6665));

      const toWorldXZ = (x, z) => {
        if (isBay4900) {
          const fx = mirrorX ? (baseW - x) : x;
          return [fx, z];
        }
        let fx = mirrorX ? (baseW - x) : x;
        let fz = mirrorZ ? (baseD - z) : z;
        if (isHoriz) return [fz, fx];
        return [fx, fz];
      };

      const toWorldRot = (deg) => {
        let r = deg;
        if (mirrorX) r = -r;
        if (mirrorZ) r = 180 - r;
        if (isHoriz) r += 90;
        return r;
      };

      return { meta, is1BR, isBay4900, is2BR, is3BR, isHoriz, mirrorX, mirrorZ, baseW, baseD, toWorldXZ, toWorldRot };
    }

    // =========================================================================
    // 7. BUILD 1:1 UNIT STRUCTURE, FLOORS, WALLS, WINDOWS & 3D DOORS
    // =========================================================================
    function getTargetWallHeightMM() {
      if (wallHeightMode === 'full') return 2550;
      if (wallHeightMode === 'low') return 420;
      return 1320;
    }

    function applyCurrentWallHeightToStructure() {
      const targetH = getTargetWallHeightMM();
      wallZoneMeshes.forEach(w => {
        const maxH = w.userData.maxH || 2550;
        const h = Math.min(targetH, maxH);
        w.scale.y = h / maxH;
        w.position.y = (w.userData.baseY || 0) + h / 2;
      });
      placedFurniture.forEach(entry => {
        if (entry.data.cat === 'partition') {
          const maxH = entry.data.h || 2450;
          const h = Math.min(targetH, maxH);
          entry.mesh.scale.y = h / maxH;
        }
      });
    }

        const [wx1, wz1] = toWorldXZ(x1, z1);

        const w = Math.abs(wx2 - wx1);
        const d = Math.abs(wz2 - wz1);
        const cx = (wx1 + wx2) / 2;
        const cz = (wz1 + wz2) / 2;

        const styleObj = FLOOR_STYLES.find(s => s.id === zoneFloorAssignment[zoneId]) || FLOOR_STYLES[0];
        const geo = new THREE.BoxGeometry(w, 40, d);
        const mat = new THREE.MeshStandardMaterial({
          map: getProceduralTexture(styleObj),
          roughness: 0.55,
          metalness: 0.05
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(cx, -20, cz);
        mesh.receiveShadow = true;
        mesh.userData = { zoneId, cx, cz, w, d };
        structureGroup.add(mesh);
        floorZoneMeshes.push(mesh);
      };

      const addStructWall = (zoneId, x1, z1, x2, z2, thickness = 120, maxH = 2550, baseY = 0) => {
        const [wx1, wz1] = toWorldXZ(x1, z1);
        const [wx2, wz2] = toWorldXZ(x2, z2);
        const dx = wx2 - wx1;
        const dz = wz2 - wz1;
        const len = Math.hypot(dx, dz);
        if (len < 20) return;

        const styleObj = WALL_STYLES.find(s => s.id === zoneWallAssignment[zoneId]) || WALL_STYLES[0];
        const geo = new THREE.BoxGeometry(len, maxH, thickness);
        const mat = new THREE.MeshStandardMaterial({
          color: styleObj.color,
          roughness: 0.72,
          metalness: 0.02
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set((wx1 + wx2) / 2, baseY + maxH / 2, (wz1 + wz2) / 2);
        mesh.rotation.y = -Math.atan2(dz, dx);
        mesh.userData = { zoneId, maxH, baseY };

        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.45 }));

        structureGroup.add(mesh);
        wallZoneMeshes.push(mesh);

      const addDoorWithSwingShadow = (hx, hz, radius, startDeg, endDeg, labelText = '') => {

        const steps = 20;

        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        for (let i = 0; i <= steps; i++) {

          shape.lineTo(Math.cos(a) * radius, Math.sin(a) * radius);
        }
        shape.closePath();

        const swingGeo = new THREE.ShapeGeometry(shape);

    function addOutlineBox(parent, w, h, d, colorHex, x, y, z, roughness = 0.55, metalness = 0.05) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness, metalness });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      const edges = new THREE.EdgesGeometry(geo);
      mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.35 })));
      parent.add(mesh);
      return mesh;
    }

      const mat = new THREE.MeshBasicMaterial({ color: 0xffdf7a });
      const strip = new THREE.Mesh(geo, mat);

      parent.add(strip);

          addOutlineBox(g, doorW, baseH - 40, 26, c1, dx, baseH / 2 + 10, d / 2 - 12);
          addOutlineBox(g, 10, 110, 16, '#1e293b', dx + doorW / 2 - 18, baseH - 95, d / 2 + 4);

        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x1e293b, transparent: true, opacity: 0.52, roughness: 0.12 });
        const leftGlass = new THREE.Mesh(new THREE.BoxGeometry(395, 1900, 22), glassMat);
        leftGlass.position.set(-w / 2 + 205, 960, d / 2 - 10);

    // 10. APPLY TEMPLATE, SPAWN FURNITURE & BOM MANAGEMENT
    // =========================================================================
    function applyCurrentSelectionTemplate() {
      const style = DESIGN_STYLES[(currentStyleIndex - 1) % DESIGN_STYLES.length] || DESIGN_STYLES[0];
      ['main_hall', 'hall_1', 'hall_2', 'side_room'].forEach(z => {
        zoneFloorAssignment[z] = style.floor;
        zoneWallAssignment[z] = style.wall;
      });

      clearAndBuildUnitStructure(currentUnitId);
      clearAllFurniture(false);

      const items = getItemsForUnitAndTemplate(
        currentUnitId,
        currentPeopleCount,
        currentEstateType,
        currentLayoutIndex,
        currentStyleIndex
      );

      items.forEach(it => {
        const catMeta = CATALOG_ITEMS.find(c => c.id === it.id);
        if (!catMeta) return;
        spawnFurnitureMesh({
          ...catMeta,
          color: it.color || catMeta.color,
          sec: it.sec || catMeta.sec
        }, it.x, it.z, it.rot);
      });

      applyCurrentWallHeightToStructure();
      updateTemplateButtonsSummary();
      updateBomList();
    }

    function spawnFurnitureMesh(itemData, x, z, rotY = 0) {
      const mesh = buildDetailedItemMesh(itemData);
      mesh.position.set(x, 0, z);
      mesh.rotation.y = rotY;
      mesh.userData = { isFurniture: true, data: { ...itemData } };
      furnitureGroup.add(mesh);
      placedFurniture.push({ mesh, data: mesh.userData.data });
      return mesh;
    }

    function addCatalogItemToScene(itemId) {
      const meta = CATALOG_ITEMS.find(c => c.id === itemId);
      if (!meta) return;
      const zb = getZoneBounds(currentFocusZone === 'all' ? 'main_hall' : currentFocusZone);
      const mesh = spawnFurnitureMesh(meta, zb.cx, zb.cz, 0);
      applyCurrentWallHeightToStructure();
      selectItem(mesh);
      updateBomList();
      showToast(`✅ 已加入「${meta.name}」`);
    }

    function clearAllFurniture(notify = true) {
      deselectItem();

    // =========================================================================
    // 12. ZONE FOCUS, CAMERA CONTROLS & FLOATING 3D ZONE PINS
    // =========================================================================
    function getZoneBounds(zoneId) {
      const meshes = zoneId === 'all'
        ? floorZoneMeshes
        : floorZoneMeshes.filter(m => m.userData.zoneId === zoneId);
      const targetList = meshes.length ? meshes : floorZoneMeshes;
      const box = new THREE.Box3();
      targetList.forEach(m => box.expandByObject(m));
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      box.getCenter(center);
      box.getSize(size);
      return { cx: center.x, cz: center.z, w: Math.max(1500, size.x), d: Math.max(1500, size.z) };
    }

    function createZone3DPins() {
      const layer = document.getElementById('zone-pins-layer');
      if (!layer) return;
      layer.innerHTML = '';
      zonePinElements = [];

      const zones = [
        { id: 'main_hall', label: '🔍主廳' },
        { id: 'hall_1',    label: '🔍窗1' },
        { id: 'hall_2',    label: '🔍窗2' },
        { id: 'side_room', label: '🔍側房' },
        { id: 'kitchen',   label: '🔍廚房' },
        { id: 'bathroom',  label: '🔍廁所' }
      ];

      zones.forEach(z => {
        const hasZone = floorZoneMeshes.some(m => m.userData.zoneId === z.id);
        if (!hasZone) return;
        const zb = getZoneBounds(z.id);
        const btn = document.createElement('button');
        btn.className = 'zone-3d-pin';
        btn.textContent = z.label;
        btn.onclick = (e) => {
          e.stopPropagation();
          focusZone(currentFocusZone === z.id ? 'all' : z.id);
        };
        layer.appendChild(btn);
        zonePinElements.push({ id: z.id, el: btn, worldPos: new THREE.Vector3(zb.cx, 1550, zb.cz) });
      });
    }

    function updateZone3DPinsPosition() {
      if (!camera || !zonePinElements.length) return;
      if (isWalkthroughMode) {
        zonePinElements.forEach(p => { p.el.style.display = 'none'; });
        return;
      }
      const stage = document.getElementById('viewport-stage');
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      zonePinElements.forEach(pin => {
        const v = pin.worldPos.clone().project(camera);
        if (v.z > 1) {
          pin.el.style.display = 'none';
          return;
        }
        pin.el.style.display = 'block';
        pin.el.style.left = `${(v.x * 0.5 + 0.5) * w}px`;
        pin.el.style.top = `${(-v.y * 0.5 + 0.5) * h}px`;
        pin.el.classList.toggle('active', currentFocusZone === pin.id);
      });
    }

    function applyZoneIsolationVisuals() {
      floorZoneMeshes.forEach(m => {
        const match = currentFocusZone === 'all' || m.userData.zoneId === currentFocusZone;
        m.material.transparent = !match;
        m.material.opacity = match ? 1.0 : 0.18;
      });
      wallZoneMeshes.forEach(w => {
        if (!w.material) return;
        const match = currentFocusZone === 'all' || w.userData.zoneId === currentFocusZone;
        w.material.transparent = !match;
        w.material.opacity = match ? 1.0 : 0.12;
      });
    }

    function focusZone(zoneId) {
      if (isWalkthroughMode) toggleWalkthroughMode();
      currentFocusZone = zoneId;
      FLOOR_ZONES.forEach(z => {
        const btn = document.getElementById('zbtn-' + z.id);
        if (btn) {
          btn.className = z.id === zoneId
            ? 'px-1.5 py-0.5 rounded-lg bg-amber-500 text-slate-950 text-[10px] font-black shrink-0'
            : 'px-1.5 py-0.5 rounded-lg text-slate-200 text-[10px] font-bold shrink-0';
        }
      });

      applyZoneIsolationVisuals();
      if (zoneId === 'all') {
        setCameraView('iso3d');
        return;
      }
      const zb = getZoneBounds(zoneId);
      const dist = Math.max(zb.w, zb.d) * 1.45;
      controls.target.set(zb.cx, 550, zb.cz);
      camera.position.set(zb.cx + dist * 0.55, dist * 0.95, zb.cz + dist * 0.65);
      controls.update();
    }

    function fitFullLayoutTopView() {
      if (isWalkthroughMode) toggleWalkthroughMode();
      currentFocusZone = 'all';
      applyZoneIsolationVisuals();
      const zb = getZoneBounds('all');
      const maxDim = Math.max(zb.w, zb.d);
      controls.target.set(zb.cx, 0, zb.cz);
      camera.position.set(zb.cx, maxDim * 1.55, zb.cz + 20);
      controls.update();
      showToast('🗺️ 已切換至全屋正上方俯視圖');
    }

    function setCameraView(mode) {
      if (isWalkthroughMode) toggleWalkthroughMode();
      const zb = getZoneBounds('all');
      const maxDim = Math.max(zb.w, zb.d);
      controls.target.set(zb.cx, 450, zb.cz);
      if (mode === 'iso3d') {
        camera.position.set(zb.cx + maxDim * 0.72, maxDim * 1.05, zb.cz + maxDim * 0.88);
      }
      controls.update();
    }

    function stepZoomCamera(factor) {
      if (isWalkthroughMode) return;
      const offset = camera.position.clone().sub(controls.target);
      offset.multiplyScalar(factor);
      camera.position.copy(controls.target).add(offset);
      controls.update();
    }

    function stepRotateCamera(angleRad) {
      if (isWalkthroughMode) {
        walkYaw += angleRad;
        syncWalkthroughCamera();
        return;
      }
      const offset = camera.position.clone().sub(controls.target);
      const cos = Math.cos(angleRad), sin = Math.sin(angleRad);
      const nx = offset.x * cos - offset.z * sin;
      const nz = offset.x * sin + offset.z * cos;
      offset.x = nx;
      offset.z = nz;
      camera.position.copy(controls.target).add(offset);
      controls.update();
    }

    // =========================================================================
    // 13. FIRST-PERSON INDOOR WALKTHROUGH + 2D FLOOR PLAN MINI-MAP + GYROSCOPE
    // =========================================================================
    function buildWalkthroughCeilingAndLights() {
      while (walkthroughCeilingGroup.children.length) walkthroughCeilingGroup.remove(walkthroughCeilingGroup.children[0]);
      const zb = getZoneBounds('all');
      const ceilGeo = new THREE.PlaneGeometry(zb.w + 1200, zb.d + 1200);
      ceilGeo.rotateX(Math.PI / 2);
      const ceilMesh = new THREE.Mesh(ceilGeo, new THREE.MeshStandardMaterial({ color: 0xf5f2eb, roughness: 0.75, side: THREE.DoubleSide }));
      ceilMesh.position.set(zb.cx, 2560, zb.cz);
      walkthroughCeilingGroup.add(ceilMesh);

      ['main_hall', 'hall_1', 'hall_2', 'kitchen', 'bathroom'].forEach(zid => {
        const b = getZoneBounds(zid);
        const pt = new THREE.PointLight(0xfff1d6, 0.42, 4200, 1.4);
        pt.position.set(b.cx, 2320, b.cz);
        walkthroughCeilingGroup.add(pt);
      });
    }

    function toggleWalkthroughMode() {
      isWalkthroughMode = !isWalkthroughMode;
      const btn = document.getElementById('btn-walkthrough');
      const hud = document.getElementById('walkthrough-hud');

      if (isWalkthroughMode) {
        deselectItem();
        closeTemplatePopup();
        savedWallHeightModeBeforeWalk = wallHeightMode;
        wallHeightMode = 'full';
        document.getElementById('btn-wall-h').textContent = '🧱全牆';
        applyCurrentWallHeightToStructure();

        currentFocusZone = 'all';
        applyZoneIsolationVisuals();
        dimensionGroup.visible = false;

        buildWalkthroughCeilingAndLights();
        walkthroughCeilingGroup.visible = true;

        camera.fov = 65;
        camera.updateProjectionMatrix();
        controls.enabled = false;

        if (btn) {
          btn.textContent = '🚪退出實景';
          btn.className = 'px-2 py-0.5 rounded-lg bg-rose-600 text-white text-[10px] font-black shrink-0 shadow';
        }
        if (hud) hud.classList.remove('hidden');
        teleportWalkthroughTo('foyer');
        showToast('🚶‍♂️ 已進入實景入屋！點左上平面圖可瞬移，單指掃畫面可360°轉頭');
      } else {
        stopWalkMove();
        if (isGyroEnabled) toggleGyroscopeLook();
        walkthroughCeilingGroup.visible = false;
        wallHeightMode = savedWallHeightModeBeforeWalk || 'mid';
        document.getElementById('btn-wall-h').textContent = wallHeightMode === 'full' ? '🧱全牆' : (wallHeightMode === 'low' ? '🧱底座' : '🧱半牆');
        applyCurrentWallHeightToStructure();
        dimensionGroup.visible = showDimensions;

        camera.fov = 42;
        camera.updateProjectionMatrix();
        controls.enabled = true;

        if (btn) {
          btn.textContent = '🚶‍♂️實景入屋';
          btn.className = 'px-2 py-0.5 rounded-lg bg-gradient-to-r from-rose-500 via-orange-500 to-amber-400 text-slate-950 text-[10px] font-black shrink-0 shadow';
        }
        if (hud) hud.classList.add('hidden');
        setCameraView('iso3d');
      }
    }

      walkEyeHeight = walkEyeHeight === 1550 ? 1080 : 1550;

      if (btn) btn.textContent = walkEyeHeight === 1550 ? '👁️成人1.55m' : '🧒小童1.08m';

    function teleportWalkthroughTo(spot) {
      const prof = getUnitGeometryProfile(currentUnitId);
      const { toWorldXZ, toWorldRot } = prof;
      let cx = 2500, cz = 680, lookDeg = 0;

      if (prof.is1BR) {
        if (spot === 'foyer')    { cx = 650;  cz = 650;  lookDeg = 0; }
        if (spot === 'living')   { cx = 1175; cz = 3100; lookDeg = 0; }
        if (spot === 'master')   { cx = 1175; cz = 4650; lookDeg = 0; }
        if (spot === 'kid')      { cx = 1550; cz = 4850; lookDeg = -90; }
        if (spot === 'kitchen')  { cx = -650; cz = 2350; lookDeg = 180; }
        if (spot === 'bathroom') { cx = -1650;cz = 1050; lookDeg = -90; }
      } else if (prof.isBay4900) {
        if (spot === 'foyer')    { cx = 2500; cz = 650;  lookDeg = 0; }
        if (spot === 'living')   { cx = 3300; cz = 4150; lookDeg = 0; }
        if (spot === 'master')   { cx = 1050; cz = 4500; lookDeg = 0; }
        if (spot === 'kid')      { cx = 3650; cz = 1650; lookDeg = 90; }
        if (spot === 'kitchen')  { cx = 650;  cz = 950;  lookDeg = -90; }
        if (spot === 'bathroom') { cx = 1150; cz = 2250; lookDeg = 0; }
      } else if (prof.is2BR) {
        if (spot === 'foyer')    { cx = 1950; cz = 680;  lookDeg = 0; }
        if (spot === 'living')   { cx = 1350; cz = 4500; lookDeg = 0; }
        if (spot === 'master')   { cx = 3350; cz = 4550; lookDeg = 0; }
        if (spot === 'kid')      { cx = 950;  cz = 1850; lookDeg = -90; }
        if (spot === 'kitchen')  { cx = 4650; cz = 950;  lookDeg = 90; }
        if (spot === 'bathroom') { cx = 3350; cz = 2250; lookDeg = 0; }
      } else {
        const sideZ1 = (currentUnitId === 'B15' || currentUnitId === 'A8' || currentUnitId === 'A9') ? 650 : 2500;
        if (spot === 'foyer')    { cx = 3350; cz = 750;  lookDeg = -90; }
        if (spot === 'living')   { cx = 1350; cz = 5250; lookDeg = 0; }
        if (spot === 'master')   { cx = 3350; cz = 5550; lookDeg = 0; }
        if (spot === 'kid')      { cx = -750; cz = sideZ1 + 1050; lookDeg = -90; }
        if (spot === 'kitchen')  { cx = 4550; cz = 2450; lookDeg = 90; }
        if (spot === 'bathroom') { cx = 3350; cz = 3850; lookDeg = 0; }
      }

      const [wx, wz] = toWorldXZ(cx, cz);
      walkPos.set(wx, walkEyeHeight, wz);
      walkYaw = THREE.MathUtils.degToRad(toWorldRot(lookDeg));
      walkPitch = -0.04;
      syncWalkthroughCamera();
    }

    function syncWalkthroughCamera() {
      if (!isWalkthroughMode || !camera) return;
      camera.position.set(walkPos.x, walkEyeHeight, walkPos.z);
      const d = 1000;
      camera.lookAt(
        walkPos.x + Math.sin(walkYaw) * Math.cos(walkPitch) * d,
        walkEyeHeight + Math.sin(walkPitch) * d,
        walkPos.z + Math.cos(walkYaw) * Math.cos(walkPitch) * d
      );
      renderWalkthroughMinimap();
    }

    function startWalkMove(cmd) { activeWalkCommand = cmd; }
    function stopWalkMove() { activeWalkCommand = null; }

    function updateWalkthroughStep() {
      if (!isWalkthroughMode || !activeWalkCommand) return;
      const spd = 48;
      const fwdX = Math.sin(walkYaw), fwdZ = Math.cos(walkYaw);
      const rightX = -Math.cos(walkYaw), rightZ = Math.sin(walkYaw);
      if (activeWalkCommand === 'forward')  { walkPos.x += fwdX * spd; walkPos.z += fwdZ * spd; }
      if (activeWalkCommand === 'backward') { walkPos.x -= fwdX * spd; walkPos.z -= fwdZ * spd; }
      if (activeWalkCommand === 'left')     { walkPos.x -= rightX * spd; walkPos.z -= rightZ * spd; }
      if (activeWalkCommand === 'right')    { walkPos.x += rightX * spd; walkPos.z += rightZ * spd; }
      if (activeWalkCommand === 'turnLeft') { walkYaw += 0.035; }
      if (activeWalkCommand === 'turnRight'){ walkYaw -= 0.035; }

      if (structureGroup && floorZoneMeshes.length > 0) {
        const box = new THREE.Box3().setFromObject(structureGroup);
        if (isFinite(box.min.x) && isFinite(box.max.x)) {
          walkPos.x = THREE.MathUtils.clamp(walkPos.x, box.min.x + 180, box.max.x - 180);
          walkPos.z = THREE.MathUtils.clamp(walkPos.z, box.min.z + 180, box.max.z - 180);
        }
      }
      syncWalkthroughCamera();
    }

    function toggleMinimapSize() {
      isMinimapExpanded = !isMinimapExpanded;
      const cvs = document.getElementById('walkthrough-minimap-canvas');
      const btn = document.getElementById('btn-minimap-size');
      if (!cvs) return;
      const sz = isMinimapExpanded ? 240 : 150;
      cvs.width = sz;
      cvs.height = sz;
      if (btn) btn.textContent = isMinimapExpanded ? '🗕縮小' : '🔍放大';
      renderWalkthroughMinimap();
    }

    function getMinimapTransform(cvs) {
      const box = new THREE.Box3().setFromObject(structureGroup);
      const minX = isFinite(box.min.x) ? box.min.x - 300 : -2200;
      const maxX = isFinite(box.max.x) ? box.max.x + 300 : 6200;
      const minZ = isFinite(box.min.z) ? box.min.z - 300 : -400;
      const maxZ = isFinite(box.max.z) ? box.max.z + 300 : 7200;
      const spanX = Math.max(1000, maxX - minX);
      const spanZ = Math.max(1000, maxZ - minZ);
      const pad = 10;
      const scale = Math.min((cvs.width - pad * 2) / spanX, (cvs.height - pad * 2) / spanZ);
      const ox = (cvs.width - spanX * scale) / 2;
      const oz = (cvs.height - spanZ * scale) / 2;
      return {
        worldToMap: (wx, wz) => [ox + (wx - minX) * scale, oz + (wz - minZ) * scale],
        mapToWorld: (mx, mz) => [minX + (mx - ox) / scale, minZ + (mz - oz) / scale]
      };
    }

    function renderWalkthroughMinimap() {
      const cvs = document.getElementById('walkthrough-minimap-canvas');
      if (!cvs || !isWalkthroughMode) return;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      const { worldToMap } = getMinimapTransform(cvs);

      floorZoneMeshes.forEach(m => {
        const b = new THREE.Box3().setFromObject(m);
        const [x1, y1] = worldToMap(b.min.x, b.min.z);
        const [x2, y2] = worldToMap(b.max.x, b.max.z);
        ctx.fillStyle = m.userData.zoneId === 'kitchen' ? '#78350f' : (m.userData.zoneId === 'bathroom' ? '#0f4c5c' : '#334155');
        ctx.fillRect(x1, y1, Math.max(2, x2 - x1), Math.max(2, y2 - y1));
      });

      placedFurniture.forEach(entry => {
        const b = new THREE.Box3().setFromObject(entry.mesh);
        const [x1, y1] = worldToMap(b.min.x, b.min.z);
        const [x2, y2] = worldToMap(b.max.x, b.max.z);
        ctx.fillStyle = 'rgba(251, 191, 36, 0.42)';
        ctx.fillRect(x1, y1, Math.max(2, x2 - x1), Math.max(2, y2 - y1));
      });

      wallZoneMeshes.forEach(w => {
        const b = new THREE.Box3().setFromObject(w);
        const [x1, y1] = worldToMap(b.min.x, b.min.z);
        const [x2, y2] = worldToMap(b.max.x, b.max.z);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(x1, y1, Math.max(2, x2 - x1), Math.max(2, y2 - y1));
      });

      const [px, py] = worldToMap(walkPos.x, walkPos.z);
      const mapAngle = Math.atan2(Math.cos(walkYaw), Math.sin(walkYaw));
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.arc(px, py, 26, mapAngle - 0.5, mapAngle + 0.5);
      ctx.closePath();
      ctx.fillStyle = 'rgba(251, 191, 36, 0.55)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#f43f5e';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    function initMinimapEvents() {
      const cvs = document.getElementById('walkthrough-minimap-canvas');
      if (!cvs) return;
      let dragging = false;
      const jump = (e) => {
        const r = cvs.getBoundingClientRect();
        const mx = ((e.clientX - r.left) / r.width) * cvs.width;
        const mz = ((e.clientY - r.top) / r.height) * cvs.height;
        const { mapToWorld } = getMinimapTransform(cvs);
        const [wx, wz] = mapToWorld(mx, mz);
        walkPos.x = wx;
        walkPos.z = wz;
        syncWalkthroughCamera();
      };
      cvs.addEventListener('pointerdown', e => { e.stopPropagation(); dragging = true; jump(e); });
      cvs.addEventListener('pointermove', e => { if (dragging) { e.stopPropagation(); jump(e); } });
      window.addEventListener('pointerup', () => { dragging = false; });

      window.addEventListener('keydown', e => {
        if (!isWalkthroughMode) return;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') startWalkMove('forward');
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') startWalkMove('backward');
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') startWalkMove('turnLeft');
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') startWalkMove('turnRight');
      });
      window.addEventListener('keyup', e => {
        if (!isWalkthroughMode) return;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D'].includes(e.key)) {
          stopWalkMove();
        }
      });
    }

    function onDeviceOrientationChange(e) {
      if (!isWalkthroughMode || !isGyroEnabled || e.alpha === null) return;
      if (gyroBaseAlpha === null) gyroBaseAlpha = e.alpha;
      walkYaw = THREE.MathUtils.degToRad(e.alpha - gyroBaseAlpha);
      if (e.beta !== null) {
        walkPitch = THREE.MathUtils.degToRad(THREE.MathUtils.clamp(e.beta - 75, -35, 35));
      }
      syncWalkthroughCamera();
    }

    async function toggleGyroscopeLook() {
      const btn = document.getElementById('btn-gyro');
      if (!isGyroEnabled) {
        try {
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            const p = await DeviceOrientationEvent.requestPermission();
            if (p !== 'granted') return;
          }
          gyroBaseAlpha = null;
          isGyroEnabled = true;
          window.addEventListener('deviceorientation', onDeviceOrientationChange, true);
          if (btn) btn.textContent = '📱體感鏡頭:開';
          showToast('📱 已開啟手機體感鏡頭！轉動手機即可環視室內');
        } catch (err) {
          showToast('⚠️ 此裝置瀏覽器暫不支援陀螺儀，可用單指滑動畫面轉向');
        }
      } else {
        isGyroEnabled = false;
        window.removeEventListener('deviceorientation', onDeviceOrientationChange, true);
        if (btn) btn.textContent = '📱體感鏡頭:關';
      }
    }

    // =========================================================================
    // 14. INTERACTION, SELECTION, MOVE LOCK & UI GRIDS
    // =========================================================================
    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function onPointerDown(e) {
      if (e.button !== undefined && e.button !== 0) return;
      if (isWalkthroughMode) {
        isLookingAround = true;
        lookStartPointer.x = e.clientX;
        lookStartPointer.y = e.clientY;
        lookStartPointer.yaw = walkYaw;
        lookStartPointer.pitch = walkPitch;
        return;
      }

      updatePointerNDC(e);
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(furnitureGroup.children, true);

      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj.parent && obj.parent !== furnitureGroup) obj = obj.parent;
        selectItem(obj);

        if (isMoveModeArmed) {
          isDraggingItem = true;
          controls.enabled = false;
          const pt = new THREE.Vector3();
          raycaster.ray.intersectPlane(dragPlane, pt);
          dragOffset.subVectors(obj.position, pt);
        }
      }
    }

    function onPointerMove(e) {
      if (isWalkthroughMode && isLookingAround) {
        const dx = e.clientX - lookStartPointer.x;
        const dy = e.clientY - lookStartPointer.y;
        walkYaw = lookStartPointer.yaw - dx * 0.0055;
        walkPitch = THREE.MathUtils.clamp(lookStartPointer.pitch - dy * 0.0045, -Math.PI / 2.6, Math.PI / 2.8);
        syncWalkthroughCamera();
        return;
      }
      if (!isDraggingItem || !selectedItem || !isMoveModeArmed) return;
      updatePointerNDC(e);
      raycaster.setFromCamera(pointerNDC, camera);
      const pt = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(dragPlane, pt)) {
        selectedItem.position.x = Math.round((pt.x + dragOffset.x) / 25) * 25;
        selectedItem.position.z = Math.round((pt.z + dragOffset.z) / 25) * 25;
        if (selectionBoxHelper) selectionBoxHelper.update();
      }
    }

    function onPointerUp() {
      isLookingAround = false;
      if (isDraggingItem) {
        isDraggingItem = false;
        controls.enabled = true;
      }
    }

    function selectItem(mesh) {
      selectedItem = mesh;
      isMoveModeArmed = false;
      updateMoveLockUI();

      if (selectionBoxHelper) {
        scene.remove(selectionBoxHelper);
        selectionBoxHelper = null;
      }
      selectionBoxHelper = new THREE.BoxHelper(mesh, 0xfbbf24);
      scene.add(selectionBoxHelper);

      const bar = document.getElementById('selected-item-bar');
      const title = document.getElementById('sel-item-title');
      const swatches = document.getElementById('sel-color-swatches');
      if (bar) bar.classList.remove('hidden');
      if (title) title.textContent = mesh.userData.data.name;
      if (swatches) {
        swatches.innerHTML = '';
        FURNITURE_COLORS.forEach(c => {
          const b = document.createElement('button');
          b.className = 'w-4 h-4 rounded-full border border-white/50';
          b.style.backgroundColor = c;
          b.onclick = () => recolorSelectedItem(c);
          swatches.appendChild(b);
        });
      }
    }

    function deselectItem() {
      selectedItem = null;
      isMoveModeArmed = false;
      isDraggingItem = false;
      if (selectionBoxHelper && scene) {
        scene.remove(selectionBoxHelper);
        selectionBoxHelper = null;
      }
      if (controls && !isWalkthroughMode) controls.enabled = true;
      const bar = document.getElementById('selected-item-bar');

    function recolorSelectedItem(hex) {
      if (!selectedItem) return;
      const data = selectedItem.userData.data;
      data.color = hex;
      const pos = selectedItem.position.clone();
      const rot = selectedItem.rotation.y;
      furnitureGroup.remove(selectedItem);
      placedFurniture = placedFurniture.filter(e => e.mesh !== selectedItem);
      const nextMesh = spawnFurnitureMesh(data, pos.x, pos.z, rot);
      selectItem(nextMesh);

      if (!selectedItem) return;

    }

    function onWindowResize() {
      const stage = document.getElementById('viewport-stage');
      if (!stage || !renderer || !camera) return;
      const w = Math.max(300, stage.clientWidth || window.innerWidth || 800);
      const h = Math.max(260, stage.clientHeight || Math.round((window.innerHeight || 600) * 0.85));
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    // =========================================================================
    // 16. INITIALIZE 3D ENGINE & START RENDER LOOP
    // =========================================================================
    function initApp() {
      if (renderer) return;
      if (document.body && document.body.childNodes) {
        Array.from(document.body.childNodes).forEach(node => {
          if (node.nodeType === Node.TEXT_NODE && node.textContent.trim().length > 0) {
            node.textContent = '';
          }
        });
      }
      const stage = document.getElementById('viewport-stage');
      const container = document.getElementById('canvas-container');
      const initW = Math.max(320, stage.clientWidth || window.innerWidth || 800);
      const initH = Math.max(300, stage.clientHeight || Math.round((window.innerHeight || 600) * 0.85));

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111a2e);

      camera = new THREE.PerspectiveCamera(42, initW / initH, 50, 45000);
      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
      renderer.setSize(initW, initH);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.92;
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2 - 0.03;

      scene.add(new THREE.AmbientLight(0xffffff, 0.48));
      const dirLight = new THREE.DirectionalLight(0xfffaf0, 0.65);
      dirLight.position.set(4500, 8500, 5500);
      dirLight.castShadow = true;
      scene.add(dirLight);

      raycaster = new THREE.Raycaster();
      structureGroup = new THREE.Group();
      furnitureGroup = new THREE.Group();
      dimensionGroup = new THREE.Group();
      walkthroughCeilingGroup = new THREE.Group();
      walkthroughCeilingGroup.visible = false;

      scene.add(structureGroup);
      scene.add(furnitureGroup);
      scene.add(dimensionGroup);
      scene.add(walkthroughCeilingGroup);

      renderer.domElement.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('resize', onWindowResize);

      initMinimapEvents();
      renderFloorAndWallTabs();
      renderCatalogTabs();
      switchUnit('B11');
      setTimeout(onWindowResize, 120);

      const animate = () => {
        requestAnimationFrame(animate);
        if (isWalkthroughMode) {
          updateWalkthroughStep();
        } else if (controls) {
          controls.update();
        }
        updateZone3DPinsPosition();
        renderer.render(scene, camera);
      };
      animate();
    }

    // =========================================================================
    // 17. SELF-DIAGNOSTIC & METHOD 3 PROMPT GENERATOR
    // =========================================================================
    const runtimeErrorLog = [];

    window.addEventListener('error', (event) => {
      const errMsg = `[Line ${event.lineno || '?'}] ${event.message}`;
      runtimeErrorLog.push(errMsg);
      const btn = document.getElementById('btn-debug-diag');
      if (btn) {
        btn.textContent = '⚠️異常';
        btn.className = 'px-1.5 py-0.5 rounded-lg bg-rose-600 text-white text-[10px] font-black shrink-0 animate-pulse';
      }
    });

    function runSystemSelfCheck() {
      const container = document.getElementById('debug-diag-content');
      const pill = document.getElementById('diag-status-pill');
      if (!container) return;

      const htmlSource = document.documentElement.outerHTML || '';
      const firstTextNode = document.body && document.body.firstChild && document.body.firstChild.nodeType === 3
        ? document.body.firstChild.textContent.trim()
        : '';
      const hasFenceLeak = firstTextNode.indexOf('```') !== -1;
      const tokenA = ['exi', 'sting'].join('');
      const tokenB = ['co', 'de'].join('');
      const hasPlaceholderLeak = htmlSource.indexOf(tokenA + ' ' + tokenB) !== -1;
      const hasThree = typeof THREE !== 'undefined' && typeof THREE.OrbitControls !== 'undefined';
      const hasCanvas = !!(renderer && renderer.domElement && renderer.domElement.width > 0);
      const unitCount = Object.keys(UNIT_META || {}).length;
      const catalogCount = (CATALOG_ITEMS || []).length;
      const wallCount = (wallZoneMeshes || []).length;
      const furnCount = (placedFurniture || []).length;

      const checks = [
        { ok: !hasPlaceholderLeak && !hasFenceLeak, name: 'HTML 首尾與全檔完整性檢測', detail: (hasPlaceholderLeak || hasFenceLeak) ? '❌ 發現殘留標記' : '✅ 100% 乾淨 HTML 結構（無殘留符號）' },
        { ok: hasThree,            name: 'Three.js + OrbitControls 3D 引擎', detail: hasThree ? '✅ 已成功載入 (r128)' : '❌ 3D 引擎未載入' },
        { ok: hasCanvas,           name: 'WebGL 3D 渲染畫布狀態', detail: hasCanvas ? `✅ 正常 (${renderer.domElement.width}×${renderer.domElement.height}px)` : '❌ 畫布未初始化' },
        { ok: unitCount === 36,    name: '影輝苑 A/B座 單位結構庫', detail: `✅ 已載入 ${unitCount}/36 個單位 (當前: ${currentUnitId})` },
        { ok: catalogCount >= 30,  name: '3D 傢俬/燈帶櫃/冷氣/電掣目錄', detail: `✅ 已載入 ${catalogCount} 款精細模型` },
        { ok: wallCount > 0,       name: '當前單位結構牆與門窗場景', detail: `✅ 已建立 ${wallCount} 組牆體與門扇 / ${furnCount} 件傢俬` },
        { ok: runtimeErrorLog.length === 0, name: 'JavaScript 執行期錯誤監控', detail: runtimeErrorLog.length === 0 ? '✅ 0 錯誤 (Zero Runtime Errors)' : `❌ 捕捉到 ${runtimeErrorLog.length} 個錯誤: ${runtimeErrorLog.join(' | ')}` }
      ];

      const allPassed = checks.every(c => c.ok);
      if (pill) {
        pill.textContent = allPassed ? '全部檢測通過' : '發現潛在問題';
        pill.className = allPassed
          ? 'px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[10px] font-black'
          : 'px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/40 text-[10px] font-black';
      }

      container.innerHTML = checks.map(c => `
        <div class="p-2 rounded-xl border ${c.ok ? 'bg-slate-900/90 border-slate-700/80' : 'bg-rose-950/60 border-rose-500/60'} flex items-center justify-between gap-2">
          <span class="font-bold ${c.ok ? 'text-slate-200' : 'text-rose-200'}">${c.name}</span>
          <span class="text-[10px] ${c.ok ? 'text-emerald-300' : 'text-rose-300 font-bold'}">${c.detail}</span>
        </div>
      `).join('');
    }

    function openDebugDiagnosticsModal() {
      const modal = document.getElementById('debug-diag-modal');
      if (!modal) return;
      modal.classList.remove('hidden');
      runSystemSelfCheck();
    }

    function closeDebugDiagnosticsModal() {
      const modal = document.getElementById('debug-diag-modal');
      if (modal) modal.classList.add('hidden');
    }

    function copyMethod3Prompt(mode) {
      const prompts = {
        layout: `【方法三：分段修改】請只修改 getItemsForUnitAndTemplate() 函數內關於 ${currentUnitId} 室的傢俬擺位與間隔，其他函數及 HTML 保持不變。`,
        mesh: `【方法三：分段修改】請只修改 buildDetailedItemMesh() 函數內的 3D 傢俬模型細節，不要改動 HTML 結構與其他函數。`,
        ui: `【方法三：分段修改】請只修改 HTML 選單介面與對應的按鈕函數，不要更動 3D 結構與傢俬資料庫。`,
        full: `請不要使用任何省略標記，由第 1 行 <!DOCTYPE html> 至最後一行 </html> 100% 完整覆寫整個檔案。`
      };
      const text = prompts[mode] || prompts.full;
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(`📋 已複製 Prompt：「${text}」`);
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>

<!-- 36 Units 1:1 Floor Plan & Furniture Engine -->
