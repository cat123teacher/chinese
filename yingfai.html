<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>影輝苑A,B座設計DIY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0f172a;
      font-family: 'Noto Sans TC', sans-serif;
      color: #f8fafc;
    }
    #app-shell {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }
    /* 3D Layout occupies 80% of screen height on mobile/portrait */
    #viewport-stage {
      position: relative;
      width: 100%;
      height: 80dvh;
      flex: 1 1 80%;
      min-height: 55%;
      background: radial-gradient(circle at 50% 42%, #1e293b 0%, #0f172a 100%);
      overflow: hidden;
    }
    /* Bottom Design Menu occupies 20% of screen height */
    #design-drawer {
      width: 100%;
      height: 20dvh;
      flex: 0 0 20dvh;
      background: rgba(15, 23, 42, 0.98);
      border-top: 1px solid rgba(245, 158, 11, 0.4);
      display: flex;
      flex-direction: column;
      z-index: 40;
      transition: height 0.22s ease, flex-basis 0.22s ease;
    }
    #design-drawer.drawer-collapsed {
      height: 40px !important;
      flex: 0 0 40px !important;
    }
    #design-drawer.drawer-collapsed #drawer-body {
      display: none !important;
    }
    /* Landscape split view for mobile rotation */
    @media (orientation: landscape) and (max-height: 540px) {
      #app-shell {
        flex-direction: row;
      }
      #viewport-stage {
        width: 74vw;
        height: 100dvh !important;
        flex: 1 1 74%;
      }
      #design-drawer {
        width: 26vw;
        height: 100dvh !important;
        flex: 0 0 26vw;
        border-top: none;
        border-left: 1px solid rgba(245, 158, 11, 0.4);
      }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-pill {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .nav-tab-active {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%) !important;
      color: #0f172a !important;
      font-weight: 900 !important;
    }
    .zone-btn-active {
      background: #f59e0b !important;
      color: #0f172a !important;
      font-weight: 900 !important;
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <!-- ==================== 80% 3D LAYOUT STAGE ==================== -->
    <div id="viewport-stage">
      <div id="canvas-container" class="w-full h-full"></div>

      <!-- Compact Top Overlay Bar (Unit Picker + View Icons + 6 Focus Zones) -->
      <div class="absolute top-1.5 left-1.5 right-1.5 z-20 flex flex-col gap-1 pointer-events-none">
        <div class="flex items-center justify-between gap-1">
          <!-- Title & Unit Selector Button -->
          <div class="glass-pill px-2 py-1 rounded-xl flex items-center gap-1.5 pointer-events-auto shadow-lg">
            <span class="text-[11px] font-black text-white tracking-tight hidden sm:inline">影輝苑A,B座設計DIY</span>
            <button onclick="openUnitModal()" class="px-2 py-0.5 rounded-lg bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black text-[11px] flex items-center gap-1 shadow active:scale-95">
              <span>🏢</span>
              <span id="current-unit-label">B10室</span>
              <span class="text-[9px]">▼</span>
            </button>
            <span id="current-unit-type-badge" class="text-[9px] text-amber-300 font-bold hidden md:inline">三房大則</span>
          </div>

          <!-- Simple Icon + Short Text Toolbar (No Day/Night Toggle - Pure Vibrant Color) -->
          <div class="glass-pill px-1 py-0.5 rounded-xl flex items-center gap-0.5 pointer-events-auto overflow-x-auto no-scrollbar shadow-lg">
            <button onclick="fitFullLayoutTopView()" id="cam-fitall" class="px-2 py-0.5 rounded-lg bg-gradient-to-r from-cyan-500 to-sky-500 text-slate-950 text-[10px] font-black shrink-0 shadow">🗺️全景俯視</button>
            <button onclick="setCameraView('top2d')" id="cam-top2d" class="px-1.5 py-0.5 rounded-lg bg-slate-800/90 text-slate-200 text-[10px] font-bold shrink-0">📐2D</button>
            <button onclick="setCameraView('iso3d')" id="cam-iso3d" class="px-1.5 py-0.5 rounded-lg bg-amber-500 text-slate-950 text-[10px] font-black shrink-0">🧊3D</button>
            <button onclick="setCameraView('seaview')" id="cam-seaview" class="px-1.5 py-0.5 rounded-lg bg-slate-800/90 text-sky-300 text-[10px] font-bold shrink-0">🌊景</button>
            <button onclick="cycleWallHeight()" id="btn-wall-h" class="px-1.5 py-0.5 rounded-lg bg-slate-800/90 text-amber-300 text-[10px] font-bold shrink-0">🧱半牆</button>
            <button onclick="toggleDimensions()" id="btn-dim" class="px-1.5 py-0.5 rounded-lg bg-rose-950/80 text-rose-200 text-[10px] font-bold shrink-0">📏尺</button>
            <button onclick="takeScreenshot()" class="px-1.5 py-0.5 rounded-lg bg-emerald-600 text-white text-[10px] font-bold shrink-0">📷圖</button>
          </div>
        </div>

        <!-- 6 Focus Zones Bar (Icon + 1-2 Char) -->
        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pointer-events-auto">
          <div class="glass-pill px-1 py-0.5 rounded-xl flex items-center gap-0.5 shadow">
            <button onclick="focusZone('all')" id="zbtn-all" class="zone-btn-active px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🏠全屋</button>
            <button onclick="focusZone('main_hall')" id="zbtn-main_hall" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🚪主廳</button>
            <button onclick="focusZone('hall_1')" id="zbtn-hall_1" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🪟廳1</button>
            <button onclick="focusZone('hall_2')" id="zbtn-hall_2" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🌅廳2</button>
            <button onclick="focusZone('side_room')" id="zbtn-side_room" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🛏️側房</button>
            <button onclick="focusZone('kitchen')" id="zbtn-kitchen" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🍳廚房</button>
            <button onclick="focusZone('bathroom')" id="zbtn-bathroom" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🚿廁所</button>
            <button onclick="toggleIsolateZone()" id="btn-isolate" class="px-1.5 py-0.5 rounded-lg text-[9px] font-bold bg-indigo-950/90 text-indigo-200 border border-indigo-500/40 shrink-0">🔍專注:開</button>
          </div>
        </div>
      </div>

      <!-- 3D Floating Zone Zoom-In Badges Container -->
      <div id="zone-3d-pins-container" class="absolute inset-0 pointer-events-none overflow-hidden z-10"></div>

      <!-- On-Screen Zoom In / Zoom Out / Orbit Direction Controls -->
      <div class="absolute right-2 top-1/2 -translate-y-1/2 z-20 glass-pill p-1 rounded-2xl flex flex-col gap-1 shadow-xl pointer-events-auto border border-slate-700/70">
        <button onclick="zoomCameraStep(-1400)" title="放大 Zoom In" class="w-8 h-8 rounded-xl bg-slate-800/95 hover:bg-amber-500 hover:text-slate-950 text-white font-black text-sm flex items-center justify-center shadow active:scale-90 transition">➕</button>
        <button onclick="zoomCameraStep(1400)" title="縮小 Zoom Out" class="w-8 h-8 rounded-xl bg-slate-800/95 hover:bg-amber-500 hover:text-slate-950 text-white font-black text-sm flex items-center justify-center shadow active:scale-90 transition">➖</button>
        <div class="h-px bg-slate-700 my-0.5"></div>
        <button onclick="orbitCameraAngle(-Math.PI/4)" title="向左轉視角" class="w-8 h-8 rounded-xl bg-slate-800/95 hover:bg-sky-500 hover:text-slate-950 text-sky-300 font-black text-xs flex items-center justify-center shadow active:scale-90 transition">⟲</button>
        <button onclick="orbitCameraAngle(Math.PI/4)" title="向右轉視角" class="w-8 h-8 rounded-xl bg-slate-800/95 hover:bg-sky-500 hover:text-slate-950 text-sky-300 font-black text-xs flex items-center justify-center shadow active:scale-90 transition">⟳</button>
        <button onclick="fitFullLayoutTopView()" title="俯視全屋" class="w-8 h-8 rounded-xl bg-cyan-950/90 hover:bg-cyan-400 hover:text-slate-950 text-cyan-300 font-black text-[10px] flex items-center justify-center shadow active:scale-90 transition">俯視</button>
      </div>

      <!-- Selected Item Floating Quick Action Bar (With Move Lock Toggle to prevent accidental dragging) -->
      <div id="selected-floating-bar" class="hidden absolute bottom-2 left-1/2 -translate-x-1/2 z-30 glass-pill px-2 py-1 rounded-xl flex items-center gap-1 shadow-2xl border border-amber-400/60 max-w-[96vw] overflow-x-auto no-scrollbar">
        <span id="sel-bar-name" class="text-[10px] font-extrabold text-amber-300 truncate max-w-[80px]">物件</span>
        <button onclick="toggleMoveSelectedMode()" id="btn-move-toggle" class="px-2 py-0.5 rounded bg-slate-700 text-slate-200 text-[10px] font-black shrink-0 border border-slate-500">✥移動:關</button>
        <button onclick="rotateSelected(90)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">↻90°</button>
        <button onclick="rotateSelected(45)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">↺45°</button>
        <button onclick="nudgeSelected(-50,0)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">◀</button>
        <button onclick="nudgeSelected(50,0)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">▶</button>
        <button onclick="nudgeSelected(0,-50)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">▲</button>
        <button onclick="nudgeSelected(0,50)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">▼</button>
        <button onclick="elevateSelected(100)" class="px-1.5 py-0.5 rounded bg-sky-900/80 text-sky-200 text-[10px] font-bold shrink-0">⬆️升</button>
        <button onclick="elevateSelected(-100)" class="px-1.5 py-0.5 rounded bg-sky-900/80 text-sky-200 text-[10px] font-bold shrink-0">⬇️降</button>
        <button onclick="openInspectorModal()" class="px-1.5 py-0.5 rounded bg-amber-500 text-slate-950 text-[10px] font-black shrink-0">📏尺寸/色</button>
        <button onclick="duplicateSelected()" class="px-1.5 py-0.5 rounded bg-emerald-700 text-white text-[10px] font-bold shrink-0">＋</button>
        <button onclick="deleteSelected()" class="px-1.5 py-0.5 rounded bg-rose-600 text-white text-[10px] font-bold shrink-0">🗑️</button>
        <button onclick="deselectItem()" class="px-1 py-0.5 text-slate-400 text-[10px] font-bold shrink-0">✕</button>
      </div>

      <!-- Toast Message -->
      <div id="toast-banner" class="hidden absolute top-14 left-1/2 -translate-x-1/2 z-30 glass-pill px-3 py-1 rounded-full text-[11px] font-bold text-emerald-300 border border-emerald-500/40 shadow-lg pointer-events-none"></div>
    </div>

    <!-- ==================== 20% ULTRA-COMPACT ICON MENU ==================== -->
    <div id="design-drawer">
      <!-- Top Icon + 2-Char Tab Strip -->
      <div class="flex items-center justify-between px-1.5 py-1 bg-slate-900 border-b border-slate-800 shrink-0 gap-1 overflow-x-auto no-scrollbar">
        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
          <button onclick="switchMainTab('templates')" id="tab-btn-templates" class="nav-tab-active px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>📋</span><span>範本</span>
          </button>
          <button onclick="switchMainTab('floors')" id="tab-btn-floors" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>🪵</span><span>地板</span>
          </button>
          <button onclick="switchMainTab('walls')" id="tab-btn-walls" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>🎨</span><span>牆身</span>
          </button>
          <button onclick="switchMainTab('furniture')" id="tab-btn-furniture" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>🛋️</span><span>家具</span>
          </button>
          <button onclick="switchMainTab('appliances')" id="tab-btn-appliances" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>⚡</span><span>家電</span>
          </button>
          <button onclick="switchMainTab('lighting')" id="tab-btn-lighting" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>💡</span><span>燈具</span>
          </button>
          <button onclick="switchMainTab('bom')" id="tab-btn-bom" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>📦</span><span id="bom-count-label">清單</span>
          </button>
        </div>
        <button onclick="toggleDrawerCollapse()" id="btn-collapse-drawer" class="px-2 py-0.5 rounded-lg bg-slate-800 text-amber-300 text-[10px] font-bold shrink-0">▼</button>
      </div>

      <!-- Compact Horizontal Scrollable Drawer Body -->
      <div id="drawer-body" class="flex-1 overflow-y-auto overflow-x-hidden px-2 py-1 no-scrollbar">
        <!-- TAB 1: 30 TEMPLATES -->
        <div id="panel-templates" class="h-full flex flex-col justify-center">
          <div id="templates-grid" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 2: 24 FLOORS -->
        <div id="panel-floors" class="hidden h-full flex flex-col justify-between">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-0.5">
            <span class="text-[9px] text-amber-400 font-bold shrink-0">分區:</span>
            <div id="floor-zone-pills" class="flex items-center gap-1"></div>
          </div>
          <div id="floor-styles-grid" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 3: 24 WALLS -->
        <div id="panel-walls" class="hidden h-full flex flex-col justify-between">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-0.5">
            <span class="text-[9px] text-amber-400 font-bold shrink-0">分區:</span>
            <div id="wall-zone-pills" class="flex items-center gap-1"></div>
          </div>
          <div id="wall-styles-grid" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 4: FURNITURE -->
        <div id="panel-furniture" class="hidden h-full flex flex-col justify-between">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-0.5">
            <button onclick="filterCatalog('furniture','all')" class="px-1.5 py-0.5 rounded bg-amber-500 text-slate-950 text-[9px] font-black shrink-0">全部</button>
            <button onclick="filterCatalog('furniture','partition')" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🧱間牆/門</button>
            <button onclick="filterCatalog('furniture','storage')" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🚪C字櫃/玻璃櫃</button>
            <button onclick="filterCatalog('furniture','bed')" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🛏️子母床/地台</button>
            <button onclick="filterCatalog('furniture','living')" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🛋️梳化/書枱</button>
            <button onclick="filterCatalog('furniture','kitbath')" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🍳L廚櫃/浴缸</button>
          </div>
          <div id="furniture-catalog-grid" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 5: APPLIANCES -->
        <div id="panel-appliances" class="hidden h-full flex flex-col justify-center">
          <div id="appliances-catalog-grid" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 6: LIGHTING -->
        <div id="panel-lighting" class="hidden h-full flex flex-col justify-center">
          <div id="lighting-catalog-grid" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 7: BOM LIST -->
        <div id="panel-bom" class="hidden h-full flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span id="bom-title-unit" class="text-[10px] font-black text-amber-400">全屋傢俬家電尺寸清單</span>
            <div class="flex gap-1">
              <button onclick="copyBomText()" class="px-2 py-0.5 rounded bg-amber-500 text-slate-950 text-[10px] font-black">📋複製報價單</button>
              <button onclick="clearAllFurniture()" class="px-2 py-0.5 rounded bg-rose-700 text-white text-[10px] font-bold">🗑️清空</button>
            </div>
          </div>
          <div id="bom-list-container" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 36-UNIT PICKER MODAL (MOBILE / IPAD OPTIMIZED) ==================== -->
  <div id="unit-modal" class="hidden fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-amber-500/40 rounded-2xl w-full max-w-2xl max-h-[86dvh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-4 py-2.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h2 class="text-sm font-black text-amber-400">🏢 揀選影輝苑座數及單位 (共36個戶型)</h2>
          <p class="text-[10px] text-slate-400">全部戶型均配備30款包含實景L型廚房及乾濕分離矮身浴缸廁所的範本</p>
        </div>
        <button onclick="closeUnitModal()" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 font-bold text-xs">✕</button>
      </div>
      <div class="px-4 py-2 bg-slate-900/90 border-b border-slate-800 flex gap-1.5">
        <button onclick="filterUnitModalBlock('ALL')" id="ublock-ALL" class="px-3 py-1 rounded-lg bg-amber-500 text-slate-950 font-black text-xs">全部 (36室)</button>
        <button onclick="filterUnitModalBlock('A')" id="ublock-A" class="px-3 py-1 rounded-lg bg-slate-800 text-slate-200 font-bold text-xs">🅰️ A座 (18室)</button>
        <button onclick="filterUnitModalBlock('B')" id="ublock-B" class="px-3 py-1 rounded-lg bg-slate-800 text-slate-200 font-bold text-xs">🅱️ B座 (18室)</button>
      </div>
      <div id="unit-modal-grid" class="p-3 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2"></div>
    </div>
  </div>

  <!-- ==================== ITEM SIZE & COLOR INSPECTOR MODAL ==================== -->
  <div id="inspector-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-amber-500/40 rounded-2xl w-full max-w-md p-4 shadow-2xl space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h3 id="insp-title" class="text-xs font-black text-amber-400">📏 自訂尺寸與顏色 (毫米 mm)</h3>
        <button onclick="closeInspectorModal()" class="w-6 h-6 rounded bg-slate-800 text-slate-300 text-xs font-bold">✕</button>
      </div>
      <div class="grid grid-cols-3 gap-2 text-[11px]">
        <div>
          <label class="text-slate-400 block mb-0.5">闊度 W (mm)</label>
          <input id="insp-w" type="number" step="50" min="100" max="6000" onchange="applyInspectorDimensions()" class="w-full px-2 py-1 rounded bg-slate-950 border border-slate-700 text-white font-bold" />
        </div>
        <div>
          <label class="text-slate-400 block mb-0.5">深度 D (mm)</label>
          <input id="insp-d" type="number" step="50" min="100" max="6000" onchange="applyInspectorDimensions()" class="w-full px-2 py-1 rounded bg-slate-950 border border-slate-700 text-white font-bold" />
        </div>
        <div>
          <label class="text-slate-400 block mb-0.5">高度 H (mm)</label>
          <input id="insp-h" type="number" step="50" min="100" max="3000" onchange="applyInspectorDimensions()" class="w-full px-2 py-1 rounded bg-slate-950 border border-slate-700 text-white font-bold" />
        </div>

    // 3. PROCEDURAL TEXTURE GENERATOR FOR 48 FLOOR & WALL MATERIALS
    // =========================================================================
    const textureCache = {};
    const thumbDataUrlCache = {};

    function generateStyleCanvas(styleObj, size = 256) {
      const cvs = document.createElement('canvas');
      cvs.width = size;
      cvs.height = size;
      const ctx = cvs.getContext('2d');
      const { type, c1, c2, knot, gold } = styleObj;

      ctx.fillStyle = c1;
      ctx.fillRect(0, 0, size, size);

      if (type === 'plank') {
        const planks = 4;
        const pw = size / planks;
        for (let i = 0; i < planks; i++) {
          ctx.fillStyle = i % 2 === 0 ? c1 : c2;
          ctx.fillRect(i * pw, 0, pw, size);
          ctx.strokeStyle = knot || '#5c3a18';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(i * pw, 0, pw, size);
          ctx.globalAlpha = 0.25;
          for (let g = 0; g < 10; g++) {
            ctx.beginPath();
            ctx.moveTo(i * pw + (g / 10) * pw, 0);
            ctx.bezierCurveTo(i * pw + pw * 0.25, size * 0.35, i * pw + pw * 0.75, size * 0.65, i * pw + (g / 10) * pw, size);
            ctx.stroke();
          }
          ctx.globalAlpha = 0.55;
          ctx.fillStyle = knot || '#4a2c10';
          ctx.beginPath();
          ctx.ellipse(i * pw + pw * 0.5, ((i * 73 + 40) % (size - 40)) + 20, 4, 9, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }
      } else if (type === 'diag_wood' || type === 'chevron' || type === 'herringbone') {
        ctx.save();
        ctx.translate(size / 2, size / 2);
        ctx.rotate(Math.PI / 4);
        const step = size / 6;
        for (let i = -8; i < 8; i++) {
          ctx.fillStyle = i % 2 === 0 ? c1 : c2;
          ctx.fillRect(i * step, -size, step, size * 2);
          ctx.strokeStyle = knot || '#5c3a18';
          ctx.lineWidth = 1.4;
          ctx.strokeRect(i * step, -size, step, size * 2);
        }
        ctx.restore();
      } else if (type === 'marble') {
        const grad = ctx.createLinearGradient(0, 0, size, size);
        grad.addColorStop(0, c1);
        grad.addColorStop(0.55, c2);
        grad.addColorStop(1, c1);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);
        for (let v = 0; v < 7; v++) {
          ctx.strokeStyle = v % 2 === 0 ? (gold || c2) : c2;
          ctx.lineWidth = v % 2 === 0 ? 2.2 : 1.1;
          ctx.globalAlpha = 0.65;
          ctx.beginPath();
          ctx.moveTo((v * 47) % size, 0);
          ctx.bezierCurveTo(size * 0.3, size * 0.35, size * 0.75, size * 0.65, ((v * 83) + 50) % size, size);
          ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
      } else if (type === 'tile_grid' || type === 'palace') {
        const gridN = 2;
        const tw = size / gridN;
        for (let x = 0; x < gridN; x++) {
          for (let y = 0; y < gridN; y++) {
            ctx.fillStyle = (x + y) % 2 === 0 ? c1 : c2;
            ctx.fillRect(x * tw, y * tw, tw, tw);
            ctx.strokeStyle = gold || '#cbd5e1';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(x * tw, y * tw, tw, tw);
          }
        }
      } else if (type === 'terrazzo') {
        const colors = [c2, gold || '#0284c7', '#64748b', '#d97706'];
        for (let i = 0; i < 55; i++) {
          ctx.fillStyle = colors[i % colors.length];
          ctx.beginPath();
          ctx.arc((i * 73) % size, (i * 137) % size, (i % 5) + 3, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'slat') {
        const slats = 12;
        const sw = size / slats;
        for (let i = 0; i < slats; i++) {
          ctx.fillStyle = i % 2 === 0 ? c1 : c2;
          ctx.fillRect(i * sw, 0, sw * 0.72, size);
          ctx.fillStyle = knot || '#1e1005';
          ctx.fillRect(i * sw + sw * 0.72, 0, sw * 0.28, size);
        }
      } else {
        // Paint / Wabi-sabi cement
        const g = ctx.createRadialGradient(size * 0.4, size * 0.4, 15, size * 0.5, size * 0.5, size * 0.75);
        g.addColorStop(0, c1);
        g.addColorStop(1, c2);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
      }
      return cvs;
    }

    function getThreeTextureForStyle(styleId, isFloor = true) {
      const key = styleId + (isFloor ? '_F' : '_W');
      if (textureCache[key]) return textureCache[key];
      const list = isFloor ? FLOOR_STYLES : WALL_STYLES;
      const styleObj = list.find(s => s.id === styleId) || list[0];
      const cvs = generateStyleCanvas(styleObj, 256);
      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(isFloor ? 3.5 : 2.5, isFloor ? 3.5 : 1.5);
      textureCache[key] = tex;
      return tex;
    }

    function getThumbDataUrl(styleObj) {
      if (thumbDataUrlCache[styleObj.id]) return thumbDataUrlCache[styleObj.id];
      const cvs = generateStyleCanvas(styleObj, 72);
      const url = cvs.toDataURL('image/png');
      thumbDataUrlCache[styleObj.id] = url;
      return url;
    }

    // =========================================================================
    // 7. INITIALIZE 3D SCENE & EVENT LISTENERS (COMFORTABLE MATTE ARCHITECTURAL LIGHTING)
    // =========================================================================
    function initApp() {
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || Math.floor(window.innerHeight * 0.8);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(42, w / h, 50, 45000);
      camera.position.set(2200, 7600, 7800);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      // Reduced exposure so colors look solid, rich and never washed-out or glaring
      renderer.toneMappingExposure = 0.86;
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2 - 0.01;
      controls.minDistance = 900;
      controls.maxDistance = 24000;
      controls.target.set(2000, 300, 3200);

      // Balanced studio lighting with clear depth contrast (no overexposure)
      hemiLight = new THREE.HemisphereLight(0xf8fafc, 0x334155, 0.45);
      scene.add(hemiLight);

      ambientLight = new THREE.AmbientLight(0xf1f5f9, 0.28);
      scene.add(ambientLight);

      dirLight = new THREE.DirectionalLight(0xfffbeb, 0.58);
      dirLight.position.set(4200, 8800, 5200);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 500;
      dirLight.shadow.camera.far = 22000;
      const d = 6500;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      const grid = new THREE.GridHelper(14000, 28, 0x334155, 0x1e293b);
      grid.position.set(2000, -15, 3200);
      scene.add(grid);

      structureGroup = new THREE.Group();
      furnitureGroup = new THREE.Group();
      dimensionGroup = new THREE.Group();
      scene.add(structureGroup);
      scene.add(furnitureGroup);
      scene.add(dimensionGroup);

      // Pointer events for dragging furniture & clicking zones
      const dom = renderer.domElement;
      dom.addEventListener('pointerdown', onPointerDown);
      dom.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('resize', onWindowResize);

      // Build UI Panels
      renderTemplatesGrid();
      renderFloorZonePills();
      renderFloorStylesGrid();
      renderWallZonePills();
      renderWallStylesGrid();
      filterCatalog('furniture', 'all');
      renderAppliancesCatalog();
      renderLightingCatalog();
      renderColorSwatches();

      // Load Default Unit & Template
      switchUnit('B10');
      animate();
    }

    function getUnitGeometryProfile(unitId) {
      const is1BR = ['B2', 'B5', 'B12', 'B17', 'A12', 'A15'].includes(unitId);
      const isBay4900 = ['B11', 'B13', 'B14'].includes(unitId);
      const is2BR = ['B3', 'B4', 'B6', 'B11', 'B13', 'B14', 'B16', 'B18', 'B21', 'B22', 'A1', 'A4', 'A10', 'A11', 'A13', 'A14', 'A16', 'A19', 'A20', 'A21'].includes(unitId);
      const mirrorX = ['B9', 'B11', 'B12', 'B13', 'B16', 'B17', 'B18', 'B21', 'A1', 'A4', 'A9', 'A10', 'A11', 'A12', 'A13', 'A14', 'A15', 'A16', 'A19', 'A20'].includes(unitId);
      const mirrorZ = ['B1', 'B2', 'B3', 'B15', 'B16', 'B17', 'B18', 'A1', 'A2', 'A7', 'A14', 'A15', 'A16', 'A20'].includes(unitId);
      return { is1BR, isBay4900, is2BR, mirrorX, mirrorZ };
    }

    // Helper to draw dark semi-transparent door swing shadow on floor + leaf panel
    function addDoorSwingShadowToStructure(hingeX, hingeZ, radius, startAngleDeg, sweepAngleDeg, zoneId = 'main_hall', doorColor = 0x8b5a2b) {
      const group = new THREE.Group();
      const startRad = THREE.MathUtils.degToRad(startAngleDeg);
      const sweepRad = THREE.MathUtils.degToRad(sweepAngleDeg);

      // Dark translucent floor sector shadow showing door swing clearance area
      const absSweep = Math.abs(sweepRad);
      const thetaStart = sweepRad >= 0 ? startRad : startRad + sweepRad;
      const sectorGeo = new THREE.CircleGeometry(radius, 28, thetaStart, absSweep);
      sectorGeo.rotateX(-Math.PI / 2);
      const sectorMat = new THREE.MeshBasicMaterial({
        color: 0x0f172a,
        transparent: true,
        opacity: 0.36,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const sectorMesh = new THREE.Mesh(sectorGeo, sectorMat);
      sectorMesh.position.y = 6;
      group.add(sectorMesh);

      // Dashed / Glowing arc border on floor so user clearly sees door swing boundary
      const arcPts = [];
      const steps = 24;
      for (let i = 0; i <= steps; i++) {
        const ang = startRad + (sweepRad * i) / steps;
        arcPts.push(new THREE.Vector3(Math.cos(ang) * radius, 8, -Math.sin(ang) * radius));
      }
      arcPts.push(new THREE.Vector3(0, 8, 0));
      const arcGeo = new THREE.BufferGeometry().setFromPoints(arcPts);
      const arcLine = new THREE.Line(arcGeo, new THREE.LineBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.85 }));
      group.add(arcLine);

      // Semi-open physical door leaf (opened at 75% of swing)
      const openAng = startRad + sweepRad * 0.85;
      const leafH = 2100;
      const leafGeo = new THREE.BoxGeometry(radius, leafH, 42);
      leafGeo.translate(radius / 2, leafH / 2, 0);
      const leafMat = new THREE.MeshStandardMaterial({ color: doorColor, roughness: 0.55, transparent: true, opacity: 0.78 });
      const leafMesh = new THREE.Mesh(leafGeo, leafMat);
      leafMesh.rotation.y = openAng;
      leafMesh.userData = { zoneId, maxH: leafH, baseH: leafH };
      group.add(leafMesh);
      structuralWalls.push(leafMesh);

      group.position.set(hingeX, 0, hingeZ);
      group.userData = { zoneId };
      structureGroup.add(group);
    }

    function clearAndBuildUnitStructure(unitId) {
      while (structureGroup.children.length) structureGroup.remove(structureGroup.children[0]);
      while (dimensionGroup.children.length) dimensionGroup.remove(dimensionGroup.children[0]);
      floorZoneMeshes = [];
      wallZoneMeshes = [];
      structuralWalls = [];

      const prof = getUnitGeometryProfile(unitId);
      const W_TOTAL = prof.is1BR ? 2350 : (prof.isBay4900 ? 4900 : 4525);
      const Z_TOTAL = 6815;
      const mx = x => prof.mirrorX ? (W_TOTAL - x) : x;
      const mz = z => prof.mirrorZ ? (Z_TOTAL - z) : z;

      const addFloorSlab = (zoneId, x1, z1, x2, z2) => {
        const ax1 = Math.min(mx(x1), mx(x2)), ax2 = Math.max(mx(x1), mx(x2));
        const az1 = Math.min(mz(z1), mz(z2)), az2 = Math.max(mz(z1), mz(z2));
        const fw = ax2 - ax1, fd = az2 - az1;
        const styleId = zoneFloorAssignment[zoneId] || 'f_oak_nat';
        const tex = getThreeTextureForStyle(styleId, true);
        const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.72, metalness: 0.02 });
        const geo = new THREE.BoxGeometry(fw, 30, fd);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(ax1 + fw / 2, -15, az1 + fd / 2);
        mesh.receiveShadow = true;
        mesh.userData = { isFloorZone: true, zoneId };
        structureGroup.add(mesh);
        floorZoneMeshes.push(mesh);
      };

      const addWallSeg = (zoneId, x1, z1, x2, z2, maxH = 2550, isWindowWall = false) => {
        const ax1 = Math.min(mx(x1), mx(x2)), ax2 = Math.max(mx(x1), mx(x2));
        const az1 = Math.min(mz(z1), mz(z2)), az2 = Math.max(mz(z1), mz(z2));
        const ww = Math.max(80, ax2 - ax1), wd = Math.max(80, az2 - az1);
        const styleId = zoneWallAssignment[zoneId] || 'w_ivory';
        const tex = getThreeTextureForStyle(styleId, false);
        const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.78, metalness: 0.02 });

        if (isWindowWall) {
          const sillH = 850;
          const sill = new THREE.Mesh(new THREE.BoxGeometry(ww, sillH, wd), mat);
          sill.position.set(ax1 + ww / 2, sillH / 2, az1 + wd / 2);
          sill.castShadow = true;
          sill.receiveShadow = true;
          sill.userData = { zoneId, maxH: sillH, baseH: sillH };
          const sEdge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(ww, sillH, wd)), new THREE.LineBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.5 }));
          sill.add(sEdge);
          structureGroup.add(sill);
          wallZoneMeshes.push(sill);
          structuralWalls.push(sill);

          const glassH = maxH - sillH - 200;
          const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0x38bdf8, transparent: true, opacity: 0.35, roughness: 0.15, metalness: 0.05
          });
          const glass = new THREE.Mesh(new THREE.BoxGeometry(ww * 0.96, glassH, Math.min(40, wd * 0.5)), glassMat);
          glass.position.set(ax1 + ww / 2, sillH + glassH / 2, az1 + wd / 2);
          glass.userData = { zoneId, isGlass: true, maxH, sillH };
          structureGroup.add(glass);
        } else {
          const wall = new THREE.Mesh(new THREE.BoxGeometry(ww, maxH, wd), mat);
          wall.position.set(ax1 + ww / 2, maxH / 2, az1 + wd / 2);
          wall.castShadow = true;
          wall.receiveShadow = true;
          wall.userData = { zoneId, maxH, baseH: maxH };
          const wEdge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(ww, maxH, wd)), new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.55 }));
          wall.add(wEdge);
          structureGroup.add(wall);
          wallZoneMeshes.push(wall);
          structuralWalls.push(wall);
        }
      };

      const addDimLabel = (text, x, z, color = '#fb7185') => {
        const cvs = document.createElement('canvas');
        cvs.width = 256; cvs.height = 64;
        const ctx = cvs.getContext('2d');
        ctx.fillStyle = 'rgba(15,23,42,0.88)';
        ctx.fillRect(8, 8, 240, 48);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.strokeRect(8, 8, 240, 48);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 128, 33);
        const tex = new THREE.CanvasTexture(cvs);
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
        sp.position.set(mx(x), 180, mz(z));
        sp.scale.set(950, 240, 1);
        dimensionGroup.add(sp);

        addWallSeg('main_hall', 0, -100, 2350, 0, 2550, false);
        addWallSeg('main_hall', 2350, 0, 2450, 6165, 2550, false);
        addWallSeg('hall_1',    0, 6165, 2350, 6265, 2550, true);
        addWallSeg('hall_1',   -100, 3415, 0, 6165, 2550, false);
        addWallSeg('kitchen',  -1515, 1650, -1415, 3415, 2550, true);
        addWallSeg('kitchen',  -1415, 3415, 0, 3500, 2550, false);
        // Shared divider wall between Bathroom and Kitchen at Z=1650
        addWallSeg('bathroom', -1580, 1605, 0, 1690, 2550, false);
        addWallSeg('bathroom', -1680, 0, -1580, 1650, 2550, false);
        addWallSeg('bathroom', -1580, -100, 0, 0, 2550, false);

        // Main Entrance Door, Kitchen Door & Bathroom Door Swing Shadows
        addDoorSwingShadowToStructure(mx(350), mz(80), 860, prof.mirrorX ? 180 : 0, -90 * sX * sZ, 'main_hall', 0x78350f);
        addDoorSwingShadowToStructure(mx(-40), mz(1800), 750, prof.mirrorX ? 0 : 180, 90 * sX * sZ, 'kitchen', 0x9a5b25);
        addDoorSwingShadowToStructure(mx(-40), mz(920), 720, prof.mirrorX ? 0 : 180, -90 * sX * sZ, 'bathroom', 0x9a5b25);

        addDimLabel('闊 2350mm', 1175, 5800, '#38bdf8');
        addDimLabel('總長 6165mm', 1850, 3100, '#fb7185');
        addDimLabel('廚房 1415×1765', -700, 2550, '#fbbf24');
        addDimLabel('廁所 1580×1650', -780, 820, '#34d399');
      } else if (prof.is2BR) {
        // 2BR: Kitchen Z=0..1650 (X=2860..4925), Bathroom Z=1650..3120 (X=2525..4525)

        const wHall = prof.isBay4900 ? 4900 : 4525;
        addFloorSlab('main_hall', 0, 0, 2525, 3120);
        addFloorSlab('main_hall', 2525, 0, 2860, 1650); // Foyer corridor outside kitchen
        addFloorSlab('hall_1',    0, 3120, 2440, 6165);

        addFloorSlab('kitchen',   2860, 0, 4925, 1650);
        addFloorSlab('bathroom',  2525, 1650, 4525, 3120);

        addWallSeg('main_hall', 0, -100, 2860, 0, 2550, false);
        addWallSeg('main_hall', -100, 0, 0, 6165, 2550, false);
        addWallSeg('hall_1',    0, 6165, 2440, 6265, 2550, true);
        addWallSeg('hall_2',    2440, 6165, wHall, 6265, 2550, true);
        addWallSeg('hall_2',    wHall, 3120, wHall + 100, 6165, 2550, true);
        // Bathroom walls (Z=1650..3120)
        addWallSeg('bathroom',  2440, 1650, 2525, 3120, 2550, false);
        addWallSeg('bathroom',  2525, 3075, 4525, 3160, 2550, false);
        addWallSeg('bathroom',  4525, 1650, 4610, 3120, 2550, false);
        // Shared partition wall at Z=1650 between Kitchen (Z=0..1650) and Bathroom (Z=1650..3120)
        addWallSeg('kitchen',   2525, 1605, 4925, 1690, 2550, false);
        addWallSeg('kitchen',   2815, 0, 2900, 1650, 2550, false);
        addWallSeg('kitchen',   4925, 0, 5010, 1650, 2550, true);
        addWallSeg('kitchen',   2860, -100, 4925, 0, 2550, false);

        // Main Entrance Door, Kitchen Door & Bathroom Door Swing Shadows
        addDoorSwingShadowToStructure(mx(1650), mz(80), 880, prof.mirrorX ? 180 : 0, -90 * sX * sZ, 'main_hall', 0x78350f);
        addDoorSwingShadowToStructure(mx(2900), mz(720), 760, prof.mirrorX ? 180 : 0, -90 * sX * sZ, 'kitchen', 0x9a5b25);
        addDoorSwingShadowToStructure(mx(3350), mz(1690), 720, prof.mirrorX ? 0 : 180, -90 * sX * sZ, 'bathroom', 0x9a5b25);

        addDimLabel(`大窗闊 ${wHall}mm`, wHall / 2, 5900, '#38bdf8');
        addDimLabel('長牆 6165mm', 450, 3100, '#fb7185');
        addDimLabel('廳2 2000×2885', 3480, 4800, '#f59e0b');
        addDimLabel('廁所 2000×1470', 3525, 2385, '#34d399');
        addDimLabel('廚房 2065×1650', 3890, 825, '#fbbf24');
      } else {
        // 3BR Units (B10, B9, B1, B15, A2, A3, A7, A8, A9, A22):
        // FIXED: Main Hall Z=0..3650 (X=0..2525), Foyer Z=0..1600 (X=2525..4200), Corridor Z=1600..3250 (X=2525..3135)
        // Kitchen: X=3135..5200, Z=1600..3250 (1650mm deep)
        // Bathroom: X=2525..4525, Z=3250..4720 (1470mm deep, strictly starts at Z=3250 after Kitchen!)
        // Hall_2: X=2440..4525, Z=4720..6815
        // ZERO OVERLAP between Kitchen and Bathroom!
        addFloorSlab('main_hall', 0, 0, 2525, 3650);

        addFloorSlab('main_hall', 2525, 1600, 3135, 3250);

        addFloorSlab('hall_1',    0, 3650, 2440, 6815);

        addWallSeg('bathroom',  4525, 3250, 4610, 4720, 2550, false);

        addDimLabel('頂闊 4200mm', 2100, 350, '#fb7185');

        addDimLabel('廚房 2065×1650', 4160, 2425, '#fbbf24');
      }

      applyCurrentWallHeightToStructure();
      createZone3DPins();
    }

    // =========================================================================
    // 9. HIGH-DETAIL 3D MESH GENERATOR (CABINET DOORS, HANDLES, GLASS DISPLAYS,
    //    DOOR-AWARE L-KITCHEN & VANITY->TOILET->BATHTUB SEQUENCE)
    // =========================================================================
    function addCabinetDoorsAndHandles(parentGroup, totalW, bottomY, doorH, zFront, numDoors, doorMat, handleMat, isGlassDisplay = false, glassMat = null) {
      const gap = 8;
      const singleW = (totalW - gap * (numDoors + 1)) / numDoors;
      const frameThick = 34;

      for (let i = 0; i < numDoors; i++) {
        const cx = -totalW / 2 + gap + singleW / 2 + i * (singleW + gap);
        const cy = bottomY + doorH / 2;

        if (isGlassDisplay && glassMat) {
          const frameOuter = new THREE.Mesh(new THREE.BoxGeometry(singleW, doorH, 20), handleMat);
          frameOuter.position.set(cx, cy, zFront + 10);
          parentGroup.add(frameOuter);

          const glassPane = new THREE.Mesh(new THREE.BoxGeometry(Math.max(40, singleW - frameThick * 2), Math.max(40, doorH - frameThick * 2), 24), glassMat);
          glassPane.position.set(cx, cy, zFront + 11);
          parentGroup.add(glassPane);

          const shelf = new THREE.Mesh(new THREE.BoxGeometry(singleW - 20, 16, 260), doorMat);
          shelf.position.set(cx, cy, zFront - 140);
          parentGroup.add(shelf);

          const decorColor = (i % 2 === 0) ? 0xf59e0b : 0x38bdf8;
          const vase = new THREE.Mesh(new THREE.CylinderGeometry(28, 38, 130, 14), new THREE.MeshStandardMaterial({ color: decorColor, roughness: 0.2, metalness: 0.3 }));
          vase.position.set(cx, cy + 75, zFront - 130);
          parentGroup.add(vase);
        } else {
          const doorPanel = new THREE.Mesh(new THREE.BoxGeometry(singleW, doorH - 6, 20), doorMat);
          doorPanel.position.set(cx, cy, zFront + 10);
          parentGroup.add(doorPanel);

          const doorEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(singleW, doorH - 6, 20));
          const doorLine = new THREE.LineSegments(doorEdges, new THREE.LineBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.45 }));
          doorLine.position.set(cx, cy, zFront + 10);
          parentGroup.add(doorLine);
        }

        const handleOffset = (i % 2 === 0) ? (singleW / 2 - 28) : (-singleW / 2 + 28);
        const handleH = Math.min(280, Math.max(90, doorH * 0.26));
        const handleBar = new THREE.Mesh(new THREE.BoxGeometry(12, handleH, 18), handleMat);
        handleBar.position.set(cx + handleOffset, cy, zFront + 26);
        parentGroup.add(handleBar);
      }
    }

    function buildDetailedItemMesh(itemData) {
      const group = new THREE.Group();
      const { id, cat, w, d, h, color } = itemData;
      const mainColor = new THREE.Color(color || '#c48a45');
      const baseMat = new THREE.MeshStandardMaterial({ color: mainColor, roughness: 0.62, metalness: 0.05 });

      const stoneMat = new THREE.MeshStandardMaterial({ color: 0xdad6ce, roughness: 0.45, metalness: 0.04 });

      // 1. PHOTO-ACCURATE L-SHAPED KITCHEN COMBO (Attachments 3 & 4)
      if (id === 'kit_l_combo_photo' || id === 'kit_i_combo_full') {
        const counterH = 860;

        const baseCab = new THREE.Mesh(new THREE.BoxGeometry(w, counterH - 35, depthMain), baseMat);
        baseCab.position.set(0, (counterH - 35) / 2, zBack);
        group.add(baseCab);

        addCabinetDoorsAndHandles(group, w * 0.55, 40, counterH - 85, zFrontFace, 3, baseMat, darkMat, false, null);

        const topStone = new THREE.Mesh(new THREE.BoxGeometry(w, 38, depthMain + 24), stoneMat);
        topStone.position.set(0, counterH - 18, zBack + 6);
        group.add(topStone);

        // Front-load Drum Washer embedded under right side of main counter
        const washerX = w / 2 - 320;
        const washerBody = new THREE.Mesh(new THREE.BoxGeometry(590, 815, 575), new THREE.MeshStandardMaterial({ color: 0xdbe2ea, roughness: 0.35 }));
        washerBody.position.set(washerX, 408, zBack + 12);
        group.add(washerBody);
        const drumOuter = new THREE.Mesh(new THREE.CylinderGeometry(205, 205, 34, 28), darkMat);
        drumOuter.rotation.x = Math.PI / 2;
        drumOuter.position.set(washerX, 385, zFrontFace + 18);
        group.add(drumOuter);
        const drumGlass = new THREE.Mesh(new THREE.CylinderGeometry(155, 155, 38, 24), glassMat);
        drumGlass.rotation.x = Math.PI / 2;
        drumGlass.position.set(washerX, 385, zFrontFace + 20);
        group.add(drumGlass);
        const dialKnob = new THREE.Mesh(new THREE.CylinderGeometry(22, 22, 20, 16), chromeMat);
        dialKnob.rotation.x = Math.PI / 2;
        dialKnob.position.set(washerX, 735, zFrontFace + 18);
        group.add(dialKnob);

        // Black Nano Sink + Gooseneck Faucet
        const sinkBasin = new THREE.Mesh(new THREE.BoxGeometry(580, 18, 430), darkMat);
        sinkBasin.position.set(-40, counterH + 4, zBack + 10);
        group.add(sinkBasin);
        const faucetStem = new THREE.Mesh(new THREE.CylinderGeometry(14, 14, 260, 12), darkMat);
        faucetStem.position.set(-40, counterH + 130, zBack - 160);
        group.add(faucetStem);
        const faucetSpout = new THREE.Mesh(new THREE.BoxGeometry(18, 18, 160), darkMat);
        faucetSpout.position.set(-40, counterH + 250, zBack - 90);
        group.add(faucetSpout);

        // Countertop See-through Steam/Microwave Oven
        const ovenBox = new THREE.Mesh(new THREE.BoxGeometry(490, 350, 420), darkMat);
        ovenBox.position.set(-w / 2 + 280, counterH + 175, zBack - 20);
        group.add(ovenBox);
        const ovenWindow = new THREE.Mesh(new THREE.BoxGeometry(370, 210, 14), new THREE.MeshBasicMaterial({ color: 0xfbbf24 }));
        ovenWindow.position.set(-w / 2 + 280, counterH + 170, zBack + 192);
        group.add(ovenWindow);
        const ovenHandle = new THREE.Mesh(new THREE.BoxGeometry(340, 14, 20), chromeMat);
        ovenHandle.position.set(-w / 2 + 280, counterH + 305, zBack + 202);

          pole.position.set(-w * 0.25, (h - 280) / 2 + 180, 0);
          pole.userData.noEdge = true;
          group.add(pole);

          const arm = new THREE.Mesh(new THREE.CylinderGeometry(10, 12, w * 0.75, 12), brassMat);
          arm.rotation.z = -Math.PI / 3;
          arm.position.set(0, h - 180, 0);
          arm.userData.noEdge = true;
          group.add(arm);

          const domeShade = new THREE.Mesh(new THREE.SphereGeometry(145, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.55), brassMat);
          domeShade.position.set(w * 0.24, h - 260, 0);
          domeShade.userData.noEdge = true;
          group.add(domeShade);

          const bulb = new THREE.Mesh(new THREE.SphereGeometry(55, 16, 16), warmGlowMat);
          bulb.position.set(w * 0.24, h - 295, 0);
          bulb.userData.noEdge = true;
          group.add(bulb);
        }
      }
      // 14. ROOM DOORS WITH FLOOR SWING SHADOW ARC + PARTITIONS
      else if (id === 'door_wood_room' || id === 'door_pocket_slide') {
        const framePostL = new THREE.Mesh(new THREE.BoxGeometry(45, h, d + 20), darkMat);
        framePostL.position.set(-w / 2 + 22, h / 2, 0);
        group.add(framePostL);
        const framePostR = new THREE.Mesh(new THREE.BoxGeometry(45, h, d + 20), darkMat);
        framePostR.position.set(w / 2 - 22, h / 2, 0);
        group.add(framePostR);

        if (id === 'door_wood_room') {
          // Swing door leaf opened at 75 deg + dark floor swing shadow sector
          const leafRadius = w - 70;
          const sectorGeo = new THREE.CircleGeometry(leafRadius, 24, 0, Math.PI / 2);
          sectorGeo.rotateX(-Math.PI / 2);
          const sectorMat = new THREE.MeshBasicMaterial({
            color: 0x0f172a,
            transparent: true,
            opacity: 0.35,
            side: THREE.DoubleSide,
            depthWrite: false
          });
          const sector = new THREE.Mesh(sectorGeo, sectorMat);
          sector.position.set(-w / 2 + 35, 8, 0);
          sector.userData.noEdge = true;
          group.add(sector);

          const leafGeo = new THREE.BoxGeometry(leafRadius, h - 40, 42);
          leafGeo.translate(leafRadius / 2, (h - 40) / 2, 0);
          const leaf = new THREE.Mesh(leafGeo, baseMat);
          leaf.position.set(-w / 2 + 35, 0, 0);
          leaf.rotation.y = Math.PI * 0.42;
          group.add(leaf);
        } else {
          const slideLeaf = new THREE.Mesh(new THREE.BoxGeometry(w - 60, h - 40, 45), baseMat);
          slideLeaf.position.set(0, h / 2, 0);
          group.add(slideLeaf);
        }
      }
      else {
        const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), baseMat);
        box.position.set(0, h / 2, 0);
        group.add(box);
        const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d));
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.38 }));
        line.position.set(0, h / 2, 0);
        group.add(line);
      }

      group.traverse(obj => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
          // Add crisp dark architectural outlines so every furniture piece is clearly visible from above
          if (obj.geometry && !obj.userData.noEdge) {
            const edgeGeo = new THREE.EdgesGeometry(obj.geometry);
            const edgeLine = new THREE.LineSegments(
              edgeGeo,
              new THREE.LineBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.42 })
            );
            edgeLine.userData.noEdge = true;
            obj.add(edgeLine);
          }
        }
      });
      return group;
    }

        let r = rot;
        if (prof.mirrorX && (r === 90 || r === -90)) r = -r;
        if (prof.mirrorZ && (r === 0 || r === 180)) r = 180 - r;
        return r;

      const items = [];

          name: base.name,
          cat: base.cat,

          d: customD || base.d,
          h: customH || base.h,
          x: mx(x),

        pushItem('part_brick_100', 2350, 750, 90, 1450, 100, 2550);

        pushItem('cab_tv_full_2400', 2220, 5650, -90, 1950, 360, 2400);
        pushItem('cab_bay_window', 1200, 6550, 180, 1950, 450, 420);
        pushItem('light_chandelier', 1200, 5550, 0, 780, 780, 360, '#d97706', 2180);

    // =========================================================================
    // 11. UNIT SWITCHING, TEMPLATE APPLICATION & FURNITURE SPAWNING
    // =========================================================================
    function getTargetWallHeightMM() {
      if (wallHeightMode === 'full') return 2550;
      if (wallHeightMode === 'low') return 420;
      return 1250;
    }

    function spawnFurnitureMesh(itemData) {
      const mesh = buildDetailedItemMesh(itemData);
      mesh.position.set(itemData.x, itemData.y || 0, itemData.z);
      mesh.rotation.y = THREE.MathUtils.degToRad(itemData.rot || 0);
      mesh.userData = { isFurnitureRoot: true, uid: itemData.uid };
      furnitureGroup.add(mesh);
      const entry = { uid: itemData.uid, data: itemData, mesh };
      placedFurniture.push(entry);
      return entry;
    }

    function addCatalogItemToScene(catId) {
      const base = CATALOG_ITEMS.find(c => c.id === catId);
      if (!base) return;
      const b = getZoneBounds(currentFocusZone === 'all' ? 'main_hall' : currentFocusZone);
      const newItem = {
        uid: 'it_' + Date.now() + '_' + Math.floor(Math.random() * 999),
        id: base.id,
        name: base.name,
        cat: base.cat,
        w: base.w,
        d: base.d,
        h: base.h,
        x: Math.round(b.cx / 50) * 50,
        y: base.defaultY || 0,
        z: Math.round(b.cz / 50) * 50,
        rot: 0,
        color: base.color
      };
      const entry = spawnFurnitureMesh(newItem);
      applyCurrentWallHeightToStructure();
      applyZoneIsolationVisuals();
      selectItem(entry, true); // Newly added item comes with move mode armed for convenience
      updateBomList();
      showToast(`✅ 已新增「${base.name.replace(/^\d+\.\s*/, '')}」(可直接拖動擺位)`);
    }

    function applyTemplate(tplId) {
      currentTemplateId = tplId;
      const tpl = THIRTY_TEMPLATES.find(t => t.id === tplId) || THIRTY_TEMPLATES[0];

      ['main_hall', 'hall_1', 'hall_2', 'side_room'].forEach(z => {
        zoneFloorAssignment[z] = tpl.floor;
        zoneWallAssignment[z] = tpl.wall;
      });
      zoneFloorAssignment.kitchen = 'f_slate_dk';
      zoneFloorAssignment.bathroom = 'f_slate_dk';
      zoneWallAssignment.kitchen = 'w_tile_kit';
      zoneWallAssignment.bathroom = 'w_tile_bath';

      clearAndBuildUnitStructure(currentUnitId);

      deselectItem();
      while (furnitureGroup.children.length) furnitureGroup.remove(furnitureGroup.children[0]);
      placedFurniture = [];

      const items = getItemsForUnitAndTemplate(currentUnitId, tplId);
      items.forEach(it => spawnFurnitureMesh(it));

      applyCurrentWallHeightToStructure();
      applyZoneIsolationVisuals();
      renderTemplatesGrid();
      updateBomList();
      showToast(`✨ 已套用「${tpl.name}」至 ${UNIT_META[currentUnitId].name}`);
    }

    function switchUnit(unitId) {
      if (!UNIT_META[unitId]) unitId = 'B10';
      currentUnitId = unitId;
      const meta = UNIT_META[unitId];
      const lbl = document.getElementById('current-unit-label');
      if (lbl) lbl.textContent = meta.name;
      const badge = document.getElementById('current-unit-type-badge');
      if (badge) badge.textContent = meta.badge;

      currentFocusZone = 'all';
      ['all', 'main_hall', 'hall_1', 'hall_2', 'side_room', 'kitchen', 'bathroom'].forEach(id => {
        const btn = document.getElementById('zbtn-' + id);
        if (btn) btn.classList.toggle('zone-btn-active', id === 'all');
      });

      applyTemplate(currentTemplateId);
      setCameraView('iso3d');
    }

    function toggleIsolateZone() {
      isolateZoneMode = !isolateZoneMode;
      const btn = document.getElementById('btn-isolate');
      if (btn) btn.textContent = isolateZoneMode ? '🔍專注:開' : '🔍專注:關';
      applyZoneIsolationVisuals();
    }

    function applyZoneIsolationVisuals() {
      const isFocusing = (currentFocusZone !== 'all' && isolateZoneMode);
      const b = isFocusing ? getZoneBounds(currentFocusZone) : null;

      floorZoneMeshes.forEach(m => {
        const match = !isFocusing || m.userData.zoneId === currentFocusZone;
        m.material.transparent = !match;
        m.material.opacity = match ? 1.0 : 0.14;
        m.material.needsUpdate = true;
      });

      wallZoneMeshes.forEach(w => {
        const match = !isFocusing || w.userData.zoneId === currentFocusZone;
        w.material.transparent = !match;
        w.material.opacity = match ? 1.0 : 0.12;
        w.material.needsUpdate = true;
      });

      structureGroup.children.forEach(ch => {
        if (ch.userData && ch.userData.zoneId && !ch.userData.isFloorZone && !wallZoneMeshes.includes(ch)) {
          const match = !isFocusing || ch.userData.zoneId === currentFocusZone;
          ch.visible = match;
        }
      });

      placedFurniture.forEach(entry => {
        if (!isFocusing) {
          entry.mesh.visible = true;
          return;
        }
        const x = entry.data.x, z = entry.data.z;
        const inZone = (x >= b.minX && x <= b.maxX && z >= b.minZ && z <= b.maxZ);
        entry.mesh.visible = inZone;
      });
    }

    // =========================================================================
    // 12. 6-ZONE FOCUS, 3D FLOATING ZOOM BADGES & ISOLATION SYSTEM
    // =========================================================================
    function getZoneBounds(zoneId) {
      const prof = getUnitGeometryProfile(currentUnitId);
      const W_TOTAL = prof.is1BR ? 2350 : (prof.isBay4900 ? 4900 : 4525);
      const Z_TOTAL = 6815;
      const mx = x => prof.mirrorX ? (W_TOTAL - x) : x;
      const mz = z => prof.mirrorZ ? (Z_TOTAL - z) : z;
      const box = (x1, z1, x2, z2) => ({
        minX: Math.min(mx(x1), mx(x2)) - 200,
        maxX: Math.max(mx(x1), mx(x2)) + 200,
        minZ: Math.min(mz(z1), mz(z2)) - 200,
        maxZ: Math.max(mz(z1), mz(z2)) + 200,
        cx: (mx(x1) + mx(x2)) / 2,
        cz: (mz(z1) + mz(z2)) / 2
      });

      if (prof.is1BR) {
        if (zoneId === 'main_hall') return box(0, 0, 2350, 3415);
        if (zoneId === 'hall_1' || zoneId === 'hall_2' || zoneId === 'side_room') return box(0, 3415, 2350, 6165);
        if (zoneId === 'kitchen') return box(-1415, 1650, 0, 3415);
        if (zoneId === 'bathroom') return box(-1580, 0, 0, 1650);
      } else if (prof.is2BR) {
        if (zoneId === 'main_hall' || zoneId === 'side_room') return box(0, 0, 2525, 3120);
        if (zoneId === 'hall_1') return box(0, 3120, 2440, 6165);
        if (zoneId === 'hall_2') return box(2440, 3120, W_TOTAL, 6165);
        if (zoneId === 'kitchen') return box(2860, 0, 4925, 1650);
        if (zoneId === 'bathroom') return box(2525, 1650, 4525, 3120);
      } else {
        if (zoneId === 'main_hall') return box(0, 0, 3135, 3250);
        if (zoneId === 'side_room') return box(-2000, 2500, 0, 4650);
        if (zoneId === 'hall_1') return box(0, 3650, 2440, 6815);
        if (zoneId === 'hall_2') return box(2440, 4720, 4525, 6815);
        if (zoneId === 'kitchen') return box(3135, 1600, 5200, 3250);
        if (zoneId === 'bathroom') return box(2525, 3250, 4525, 4720);
      }
      return { minX: -3000, maxX: 6000, minZ: -500, maxZ: 7500, cx: 1800, cz: 3200 };
    }

    // Create clickable 3D floating "🔍 Zoom In" badges directly above each zone in the layout
    function createZone3DPins() {
      const container = document.getElementById('zone-3d-pins-container');
      if (!container) return;
      container.innerHTML = '';
      zonePinElements = [];

      const prof = getUnitGeometryProfile(currentUnitId);
      const zonesToShow = prof.is1BR
        ? [
            { id: 'main_hall', label: '🔍主廳' },
            { id: 'hall_1',    label: '🔍廳1' },
            { id: 'kitchen',   label: '🔍廚房' },
            { id: 'bathroom',  label: '🔍廁所' }
          ]
        : (prof.is2BR
          ? [
              { id: 'main_hall', label: '🔍主廳' },
              { id: 'hall_1',    label: '🔍廳1' },
              { id: 'hall_2',    label: '🔍廳2' },
              { id: 'kitchen',   label: '🔍廚房' },
              { id: 'bathroom',  label: '🔍廁所' }
            ]
          : [
              { id: 'main_hall', label: '🔍主廳' },
              { id: 'hall_1',    label: '🔍廳1' },
              { id: 'hall_2',    label: '🔍廳2' },
              { id: 'side_room', label: '🔍側房' },
              { id: 'kitchen',   label: '🔍廚房' },
              { id: 'bathroom',  label: '🔍廁所' }
            ]);

      zonesToShow.forEach(z => {
        const b = getZoneBounds(z.id);
        const btn = document.createElement('button');
        btn.className = 'pointer-events-auto absolute -translate-x-1/2 -translate-y-1/2 px-2 py-0.5 rounded-full text-[10px] font-black shadow-lg border transition active:scale-90 flex items-center gap-0.5 ' +
          (currentFocusZone === z.id
            ? 'bg-amber-500 text-slate-950 border-white ring-2 ring-amber-300'
            : 'bg-slate-900/85 text-amber-300 border-amber-400/50 hover:bg-amber-500 hover:text-slate-950');
        btn.innerHTML = `<span>${z.label}</span>`;
        btn.onclick = (ev) => {
          ev.stopPropagation();
          if (currentFocusZone === z.id) {
            focusZone('all');
          } else {
            isolateZoneMode = true;
            document.getElementById('btn-isolate').textContent = '🔍專注:開';
            focusZone(z.id);
          }
        };
        container.appendChild(btn);
        zonePinElements.push({ id: z.id, el: btn, worldPos: new THREE.Vector3(b.cx, 1650, b.cz) });
      });
    }

    function updateZone3DPinsPosition() {
      if (!camera || !renderer || !zonePinElements.length) return;
      const stage = document.getElementById('viewport-stage');
      const w = stage.clientWidth;
      const h = stage.clientHeight;

      zonePinElements.forEach(pin => {
        const v = pin.worldPos.clone().project(camera);
        if (v.z > 1) {
          pin.el.style.display = 'none';
          return;
        }
        const x = (v.x * 0.5 + 0.5) * w;
        const y = (-(v.y * 0.5) + 0.5) * h;
        if (x < 30 || x > w - 30 || y < 55 || y > h - 30) {
          pin.el.style.display = 'none';
        } else {
          pin.el.style.display = 'flex';
          pin.el.style.left = `${x}px`;
          pin.el.style.top = `${y}px`;
        }
      });

    function applyCurrentWallHeightToStructure() {
      const targetH = getTargetWallHeightMM();
      structuralWalls.forEach(w => {
        const maxH = w.userData.maxH || 2550;
        const h = Math.min(targetH, maxH);
        w.scale.y = h / maxH;
        w.position.y = h / 2;
      });
      structureGroup.children.forEach(ch => {
        if (ch.userData && ch.userData.isGlass) {
          ch.visible = (wallHeightMode === 'full');
        }
      });
      placedFurniture.forEach(entry => {
        if (entry.data.cat === 'partition') {
          const maxH = entry.data.h || 2500;
          const h = Math.min(targetH, maxH);
          entry.mesh.scale.y = h / maxH;
        }
      });

    // =========================================================================
    // 14. SAFE TOUCH / MOUSE SELECTION & LOCKED MOVE MODE (NO ACCIDENTAL DRAGGING)
    // =========================================================================
    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function onPointerDown(e) {
      if (e.button !== undefined && e.button !== 0) return;
      updatePointerNDC(e);
      raycaster.setFromCamera(pointerNDC, camera);

      const roots = placedFurniture.filter(f => f.mesh.visible).map(f => f.mesh);
      const hits = raycaster.intersectObjects(roots, true);
      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj && (!obj.userData || !obj.userData.isFurnitureRoot)) obj = obj.parent;
        if (obj) {
          const entry = placedFurniture.find(f => f.uid === obj.userData.uid);
          if (entry) {
            const wasSameItem = (selectedItem && selectedItem.uid === entry.uid);
            selectItem(entry, wasSameItem ? isMoveModeArmed : false);

            // Only start dragging if user explicitly enabled "✥移動:開" for this selected item!
            if (wasSameItem && isMoveModeArmed) {
              isDraggingItem = true;
              controls.enabled = false;
              dragPlane.constant = -(entry.data.y || 0);
              const pt = new THREE.Vector3();
              raycaster.ray.intersectPlane(dragPlane, pt);
              dragOffset.set(entry.data.x - pt.x, 0, entry.data.z - pt.z);
            } else {
              showToast('💡 已選中物件！如需拖動位置，請按下方「✥移動」按鈕');
            }
            return;
          }
        }
      }
    }

    function onPointerMove(e) {
      if (!isDraggingItem || !selectedItem || !isMoveModeArmed) return;
      updatePointerNDC(e);
      raycaster.setFromCamera(pointerNDC, camera);
      const pt = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(dragPlane, pt)) {
        const nx = Math.round((pt.x + dragOffset.x) / 50) * 50;
        const nz = Math.round((pt.z + dragOffset.z) / 50) * 50;
        selectedItem.data.x = nx;
        selectedItem.data.z = nz;

        if (!selectedItem.data.id.startsWith('plat_') && selectedItem.data.cat !== 'partition' && selectedItem.data.cat !== 'lighting') {
          let stackY = 0;
          placedFurniture.forEach(other => {
            if (other.uid !== selectedItem.uid && other.data.id.startsWith('plat_')) {
              const dx = Math.abs(nx - other.data.x);
              const dz = Math.abs(nz - other.data.z);
              if (dx < other.data.w / 2 && dz < other.data.d / 2) {
                stackY = Math.max(stackY, other.data.h);
              }
            }
          });
          if (stackY > 0) selectedItem.data.y = stackY;
        }

        selectedItem.mesh.position.set(selectedItem.data.x, selectedItem.data.y || 0, selectedItem.data.z);
      }
    }

    function onPointerUp() {
      if (isDraggingItem) {
        isDraggingItem = false;
        controls.enabled = true;
        updateBomList();
      }
    }

    // One-click Zoom Out & Top-Down Full Layout Overview
    function fitFullLayoutTopView() {
      if (!camera || !controls) return;
      currentFocusZone = 'all';
      ['all', 'main_hall', 'hall_1', 'hall_2', 'side_room', 'kitchen', 'bathroom'].forEach(id => {
        const btn = document.getElementById('zbtn-' + id);
        if (btn) btn.classList.toggle('zone-btn-active', id === 'all');
      });
      applyZoneIsolationVisuals();
      createZone3DPins();

      const box = new THREE.Box3().setFromObject(structureGroup);
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      box.getCenter(center);
      box.getSize(size);

      const maxDim = Math.max(size.x, size.z, 6800);
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const aspect = camera.aspect || 1;
      const fitDist = (maxDim / 2) / Math.tan(fovRad / 2) / Math.min(1, aspect) * 1.18;

      controls.target.set(center.x, 0, center.z);
      camera.position.set(center.x, Math.max(9600, fitDist), center.z + 10);
      controls.update();
      showToast('🗺️ 已縮細並俯視全屋完整 Layout');
    }

    // Zoom In / Zoom Out & Rotate Camera View Direction Buttons
    function zoomCameraStep(deltaDist) {
      if (!camera || !controls) return;
      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      const curLen = offset.length();
      const newLen = THREE.MathUtils.clamp(curLen + deltaDist, 1100, 20000);
      offset.setLength(newLen);
      camera.position.copy(controls.target).add(offset);
      controls.update();
    }

    function orbitCameraAngle(deltaAngleRad) {
      if (!camera || !controls) return;
      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      const cosA = Math.cos(deltaAngleRad);
      const sinA = Math.sin(deltaAngleRad);
      const nx = offset.x * cosA - offset.z * sinA;
      const nz = offset.x * sinA + offset.z * cosA;
      offset.x = nx;
      offset.z = nz;
      camera.position.copy(controls.target).add(offset);
      controls.update();
    }

    function setCameraView(mode) {
      if (!camera || !controls) return;
      const box = new THREE.Box3().setFromObject(structureGroup);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const cx = isFinite(center.x) ? center.x : 1800;
      const cz = isFinite(center.z) ? center.z : 3300;

      if (mode === 'top2d') {
        fitFullLayoutTopView();
      } else if (mode === 'seaview') {
        controls.target.set(cx, 800, cz + 2800);
        camera.position.set(cx, 1500, cz - 1800);
        controls.update();
      } else {
        controls.target.set(cx, 300, cz);
        camera.position.set(cx + 600, 7600, cz + 4600);
        controls.update();
      }
    }

      link.href = renderer.domElement.toDataURL('image/png');
      link.click();
      showToast('📷 已保存高清設計圖！');
    }

    function showToast(msg) {
      const b = document.getElementById('toast-banner');
      b.textContent = msg;
      b.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => b.classList.add('hidden'), 2600);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || Math.floor(window.innerHeight * 0.8);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      updateZone3DPinsPosition();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
