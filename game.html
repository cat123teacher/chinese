<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>童話城堡大偵探：誰動了我的水果？</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'PingFang HK', 'Microsoft JhengHei', 'Comic Sans MS', sans-serif;
            background-color: #dcd0ff;
            touch-action: none;
        }
        canvas {
            display: block;
        }

        /* 1. 開始選單 (粉彩紫童話風格) */
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #fdfbfb 0%, #e6d5fa 50%, #cbb4d4 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            text-align: center;
            padding: 20px;
        }
        .castle-badge {
            font-size: 4rem;
            margin-bottom: 5px;
            animation: float 2.5s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        #startScreen h1 {
            color: #6a1b9a;
            font-size: 2.6rem;
            text-shadow: 2px 3px 0px #ffffff, 0 5px 15px rgba(106,27,154,0.25);
            margin: 10px 0;
        }
        #startScreen p {
            font-size: 1.35rem;
            color: #5e35b1;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .char-select {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .char-card {
            background: white;
            border: 5px solid #b39ddb;
            border-radius: 28px;
            padding: 20px 35px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(106, 27, 154, 0.15);
            transition: all 0.25s;
        }
        .char-card:hover, .char-card:active {
            transform: translateY(-8px) scale(1.05);
            border-color: #ec407a;
            background-color: #fce4ec;
        }
        .char-icon {
            font-size: 4.5rem;
            display: block;
            margin-bottom: 10px;
        }
        .char-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4a148c;
        }

        /* 2. 頂部任務提示欄 */
        #hudTop {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.92);
            border: 4px solid #9575cd;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #4a148c;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            z-index: 10;
            display: none;
            text-align: center;
            white-space: nowrap;
        }
        #clueButton {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #ff80ab;
            color: white;
            border: 3px solid white;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 10;
            display: none;
        }

        /* 3. 虛擬方向桿 (左下) 與 跳躍鍵 (右下) */
        #controlsUI {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 15;
            display: none;
        }
        #joystickZone {
            position: absolute;
            bottom: 35px;
            left: 35px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(179,157,219,0.5) 100%);
            border: 5px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            pointer-events: auto;
            touch-action: none;
        }
        #joystickKnob {
            position: absolute;
            top: 50%; left: 50%;
            width: 64px; height: 64px;
            margin-top: -32px; margin-left: -32px;
            background: radial-gradient(circle at 30% 30%, #ba68c8, #7b1fa2);
            border: 4px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        #jumpBtn {
            position: absolute;
            bottom: 45px;
            right: 40px;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 30% 30%, #ff8a80, #e53935);
            border: 5px solid #ffffff;
            border-radius: 50%;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            cursor: pointer;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        #jumpBtn:active {
            transform: scale(0.92);
            background: #c62828;
        }

        /* 4. 對話框 UI */
        #dialogBox {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.97);
            border: 6px solid #ab47bc;
            border-radius: 28px;
            padding: 22px 28px;
            z-index: 30;
            display: none;
            box-shadow: 0 12px 30px rgba(74, 20, 140, 0.35);
        }
        #dialogHeader {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        #dialogBadge {
            background: #ab47bc;
            color: white;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 1.35rem;
            font-weight: bold;
        }
        #dialogText {
            font-size: 1.35rem;
            line-height: 1.6;
            color: #2c2c2c;
            margin-bottom: 16px;
            white-space: pre-line;
        }
        .dialog-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #7e57c2;
            color: white;
            border: none;
            padding: 12px 26px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .action-btn.accuse {
            background: #ec407a;
        }
        .action-btn.restart {
            background: #26a69a;
        }
        .action-btn:hover {
            filter: brightness(1.1);
        }

        /* 房間名牌提示 */
        #roomBanner {
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(123, 31, 162, 0.85);
            color: #fff;
            padding: 6px 22px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 8;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 1. 角色選擇開始畫面 -->
    <div id="startScreen">
        <div class="castle-badge">🏰🔍🍎</div>
        <h1>童話城堡大偵探：誰動了我的水果？</h1>
        <p>請選擇你的 3D 動畫小偵探角色進入城堡：</p>
        <div class="char-select">
            <div class="char-card" onclick="startGame('boy')">
                <span class="char-icon">👦🏻</span>
                <span class="char-title">小男孩偵探</span>
            </div>
            <div class="char-card" onclick="startGame('girl')">
                <span class="char-icon">👧🏻</span>
                <span class="char-title">小女孩偵探</span>
            </div>
        </div>
    </div>

    <!-- 2. 頂部任務欄與線索卡按鈕 -->
    <div id="hudTop">🎯 任務：推動左下角方向桿，走進左前方【書房】找大象爺爺報案！</div>
    <button id="clueButton" onclick="showClueCard()">📜 查看挑戰紙條</button>
    <div id="roomBanner">📍 中央皇家走廊</div>

    <!-- 3. 對話框 -->
    <div id="dialogBox">
        <div id="dialogHeader">
            <span id="dialogBadge">大象爺爺</span>
        </div>
        <div id="dialogText">對話內容</div>
        <div class="dialog-actions" id="dialogButtons">
            <button class="action-btn" onclick="closeDialog()">知道啦！</button>
        </div>
    </div>

    <!-- 4. 虛擬搖桿與跳躍按鈕 -->
    <div id="controlsUI">
        <div id="joystickZone">
            <div id="joystickKnob"></div>
        </div>
        <div id="jumpBtn" id="jumpButton">
            <span>⬆️</span>
            <span>跳躍</span>
        </div>
    </div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ================= 遊戲核心變數 =================
        let scene, camera, renderer;
        let playerGroup, leftArm, rightArm, leftLeg, rightLeg;
        let elephantGroup, rabbitGroup, monkeyGroup, hedgehogGroup, appleGroup;
        let suspectClickableMeshes = [];
        let wallColliders = []; // 牆壁碰撞箱

        let gameState = 'START'; // START, FIND_ELEPHANT, INVESTIGATE, ENDING
        let playerGender = 'girl';
        let hasAcceptedQuest = false;

        // 角色物理與動畫
        let playerVelocityY = 0;
        let isGrounded = true;
        const moveSpeed = 28;
        const jumpForce = 42;
        const gravity = 98;
        let walkCycle = 0;

        // 虛擬方向桿狀態
        let joyInput = { x: 0, y: 0 }; // x: 左右轉向/移動, y: 前後移動
        let cameraYaw = 0; // 鏡頭水平角度

        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let prevTime = performance.now();

        // ================= 啟動遊戲 =================
        function startGame(gender) {
            playerGender = gender;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('hudTop').style.display = 'block';
            document.getElementById('roomBanner').style.display = 'block';
            document.getElementById('controlsUI').style.display = 'block';

            initScene();
            initJoystickAndButtons();
            gameState = 'FIND_ELEPHANT';

            showDialog(
                "🏰 歡迎來到童話城堡",
                `你好，勇敢的${gender === 'boy' ? '小男孩' : '小女孩'}偵探！\n請滑動左下角的【紫色方向桿】控制主角走動，先到左前方的【1號房：大象爺爺書房】找村長了解案情吧！`,
                [{ text: "出發調查！", action: closeDialog }]
            );
        }

        // ================= 初始化 3D 場景與動畫材質 =================
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdcd0ff);
            scene.fog = new THREE.FogExp2(0xdcd0ff, 0.0035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 溫暖的動畫風打光
            const hemiLight = new THREE.HemisphereLight(0xfff8ff, 0xb39ddb, 0.75);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xfffdf0, 0.85);
            dirLight.position.set(60, 120, 80);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -120;
            dirLight.shadow.camera.right = 120;
            dirLight.shadow.camera.top = 120;
            dirLight.shadow.camera.bottom = -120;
            scene.add(dirLight);

            // 建立整座城堡與 4 間房間佈置
            buildCastleAndRooms();

            // 建立 3D 動畫風主角
            createAnimatedHero(playerGender);

            // 建立大象爺爺與 3 位嫌疑犯 + 藏匿的大蘋果
            createAllNPCs();

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDownScene);

            prevTime = performance.now();
            animate();
        }

        // 輔助函式：卡通光滑材質
        function toonMat(color) {
            return new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.35,
                metalness: 0.05
            });
        }

        // 輔助函式：建立帶碰撞的牆壁
        function addWall(w, h, d, x, y, z, color = 0xf3e5f5, hasCollision = true) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toonMat(color));
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            if (hasCollision) {
                const box = new THREE.Box3().setFromObject(mesh);
                wallColliders.push(box);
            }
            return mesh;
        }

        // ================= 建造城堡、走廊與 4 個主題房間 =================
        function buildCastleAndRooms() {
            // 城堡總地板 (寬 120 x 深 140)
            const mainFloor = new THREE.Mesh(new THREE.PlaneGeometry(140, 160), toonMat(0xf5f0ff));
            mainFloor.rotation.x = -Math.PI / 2;
            mainFloor.receiveShadow = true;
            scene.add(mainFloor);

            // 中央皇家走廊紅紫地毯 (x: -14 ~ 14, z: -70 ~ 70)
            const carpet = new THREE.Mesh(new THREE.BoxGeometry(16, 0.2, 136), toonMat(0xab47bc));
            carpet.position.set(0, 0.1, 0);
            carpet.receiveShadow = true;
            scene.add(carpet);

            const carpetGoldTrimL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.25, 136), toonMat(0xffd54f));
            carpetGoldTrimL.position.set(-7.6, 0.12, 0);
            scene.add(carpetGoldTrimL);
            const carpetGoldTrimR = carpetGoldTrimL.clone();
            carpetGoldTrimR.position.set(7.6, 0.12, 0);
            scene.add(carpetGoldTrimR);

            // 4 個房間的專屬彩色地板
            const addRoomFloor = (x, z, color) => {
                const rf = new THREE.Mesh(new THREE.BoxGeometry(44, 0.15, 56), toonMat(color));
                rf.position.set(x, 0.08, z);
                rf.receiveShadow = true;
                scene.add(rf);
            };
            addRoomFloor(-38, 34, 0xfff9c4);  // 1. 左前：大象書房 (暖黃)
            addRoomFloor(38, 34, 0xe1f5fe);   // 2. 右前：玩具遊戲室 (粉藍)
            addRoomFloor(-38, -34, 0xe8f5e9); // 3. 左後：室內花園房 (粉綠)
            addRoomFloor(38, -34, 0xfce4ec);  // 4. 右後：皇室客廳 (粉紅)

            const wallH = 22;
            const wallColor = 0xede7f6;
            const pillarColor = 0xd1c4e9;

            // 外圍城堡大牆
            addWall(124, wallH, 4, 0, wallH/2, -66, wallColor); // 北牆
            addWall(124, wallH, 4, 0, wallH/2, 66, wallColor);  // 南牆
            addWall(4, wallH, 132, -62, wallH/2, 0, wallColor); // 西牆
            addWall(4, wallH, 132, 62, wallH/2, 0, wallColor);  // 東牆

            // 房間之間的中隔牆 (橫向 z = 0)
            addWall(44, wallH, 3, -38, wallH/2, 0, 0xe1bee7);
            addWall(44, wallH, 3, 38, wallH/2, 0, 0xe1bee7);

            // 走廊與房間的隔牆 (留出寬敞拱門供進出)
            // 左側隔牆 (x = -16)，門洞在 z=34 及 z=-34
            addWall(3, wallH, 18, -16, wallH/2, 55, pillarColor);
            addWall(3, wallH, 28, -16, wallH/2, 0, pillarColor);
            addWall(3, wallH, 18, -16, wallH/2, -55, pillarColor);

            // 右側隔牆 (x = 16)，門洞在 z=34 及 z=-34
            addWall(3, wallH, 18, 16, wallH/2, 55, pillarColor);
            addWall(3, wallH, 28, 16, wallH/2, 0, pillarColor);
            addWall(3, wallH, 18, 16, wallH/2, -55, pillarColor);

            // 門楣裝飾 (無碰撞，讓門看起來像城堡拱門)
            const addDoorHeader = (x, z, badgeColor) => {
                addWall(3.5, 6, 24, x, 19, z, badgeColor, false);
            };
            addDoorHeader(-16, 34, 0xffca28);
            addDoorHeader(16, 34, 0x29b6f6);
            addDoorHeader(-16, -34, 0x66bb6a);
            addDoorHeader(16, -34, 0xec407a);

            // 城堡四角童話高塔 (尖頂圓錐)
            const createTower = (x, z) => {
                const tower = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 36, 16), toonMat(0xd1c4e9));
                tower.position.set(x, 18, z);
                scene.add(tower);
                const roof = new THREE.Mesh(new THREE.ConeGeometry(11, 16, 16), toonMat(0x8e24aa));
                roof.position.set(x, 44, z);
                scene.add(roof);
            };
            createTower(-62, -66);
            createTower(62, -66);
            createTower(-62, 66);
            createTower(62, 66);

            // -------- 佈置中央走廊 --------
            for (let z = -45; z <= 45; z += 30) {
                // 走廊金色壁畫與花瓶
                const frameL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 7, 9), toonMat(0xffca28));
                frameL.position.set(-14.2, 11, z);
                scene.add(frameL);
                const artL = new THREE.Mesh(new THREE.BoxGeometry(0.7, 5, 7), toonMat(0x80deea));
                artL.position.set(-14.1, 11, z);
                scene.add(artL);

                const frameR = frameL.clone();
                frameR.position.set(14.2, 11, z);
                scene.add(frameR);
                const artR = new THREE.Mesh(new THREE.BoxGeometry(0.7, 5, 7), toonMat(0xf48fb1));
                artR.position.set(14.1, 11, z);
                scene.add(artR);

                // 走廊羅馬花柱
                const pedL = addWall(2.5, 4, 2.5, -12, 2, z + 10, 0xffffff, false);
                const plantL = new THREE.Mesh(new THREE.SphereGeometry(2, 12, 12), toonMat(0x66bb6a));
                plantL.position.set(-12, 5.2, z + 10);
                scene.add(plantL);

                const pedR = addWall(2.5, 4, 2.5, 12, 2, z + 10, 0xffffff, false);
                const plantR = plantL.clone();
                plantR.position.set(12, 5.2, z + 10);
                scene.add(plantR);
            }

            // -------- 佈置房間 1：大象爺爺的書房 (左前: x=-38, z=34) --------
            // 大木書桌
            addWall(14, 4.5, 8, -42, 2.25, 34, 0x8d6e63);
            // 桌上的粉紅色神祕挑戰信封
            const noteCard = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.3, 1.8), toonMat(0xff80ab));
            noteCard.position.set(-40, 4.7, 34);
            scene.add(noteCard);
            // 書櫃與彩色書本
            addWall(4, 15, 22, -57, 7.5, 34, 0x6d4c41);
            const bookColors = [0xef5350, 0x42a5f5, 0x66bb6a, 0xffca28, 0xab47bc];
            for (let i = 0; i < 5; i++) {
                const book = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 3), toonMat(bookColors[i]));
                book.position.set(-55, 4 + i * 2.5, 28 + i * 2.5);
                scene.add(book);
            }
            // 大地球儀裝飾
            const globeStand = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 2, 4, 12), toonMat(0xffb300));
            globeStand.position.set(-28, 2, 52);
            scene.add(globeStand);
            const globeSphere = new THREE.Mesh(new THREE.SphereGeometry(2.8, 16, 16), toonMat(0x29b6f6));
            globeSphere.position.set(-28, 6, 52);
            scene.add(globeSphere);

            // -------- 佈置房間 2：玩具遊戲室 - 跳跳兔與小猴子 (右前: x=38, z=34) --------
            // 彩色大積木塔
            addWall(5, 5, 5, 50, 2.5, 50, 0xff7043);
            addWall(5, 5, 5, 45, 2.5, 52, 0x42a5f5);
            addWall(4.5, 4.5, 4.5, 47.5, 7.25, 51, 0xffca28);
            // 小帳篷
            const tent = new THREE.Mesh(new THREE.ConeGeometry(8, 12, 6), toonMat(0xff80ab));
            tent.position.set(50, 6, 18);
            scene.add(tent);
            // 證物 1：跳跳兔旁的半截紅蘿蔔
            const carrot = new THREE.Mesh(new THREE.ConeGeometry(1.2, 4.5, 12), toonMat(0xff5722));
            carrot.rotation.z = Math.PI / 2.2;
            carrot.position.set(27, 1, 47);
            scene.add(carrot);
            // 證物 2：小猴子旁的黃色香蕉皮
            const banana = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.5, 8, 12, Math.PI), toonMat(0xffeb3b));
            banana.rotation.x = Math.PI / 2;
            banana.position.set(39, 0.6, 26);
            scene.add(banana);

            // -------- 佈置房間 3：室內自然花園 - 刺蝟弟弟 (左後: x=-38, z=-34) --------
            // 巨大童話紅傘蘑菇
            const createMushroom = (mx, mz, scale) => {
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(1.2*scale, 1.6*scale, 4*scale, 12), toonMat(0xfff9c4));
                stem.position.set(mx, 2*scale, mz);
                scene.add(stem);
                const cap = new THREE.Mesh(new THREE.SphereGeometry(3.5*scale, 16, 12, 0, Math.PI*2, 0, Math.PI/2), toonMat(0xff5252));

        // ================= 虛擬方向桿與跳躍按鈕邏輯 =================
        function initJoystickAndButtons() {
            const zone = document.getElementById('joystickZone');
            const knob = document.getElementById('joystickKnob');
            const maxRadius = 48;
            let dragging = false;
            let activePointerId = null;

            const updateJoystick = (clientX, clientY) => {
                const rect = zone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let dx = clientX - centerX;
                let dy = clientY - centerY;
                const dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joyInput.x = dx / maxRadius; // -1 (左) ~ +1 (右)
                joyInput.y = dy / maxRadius; // -1 (前) ~ +1 (後)
            };

            const resetJoystick = () => {
                dragging = false;
                activePointerId = null;
                knob.style.transform = `translate(0px, 0px)`;
                joyInput.x = 0;
                joyInput.y = 0;
            };

            zone.addEventListener('pointerdown', (e) => {
                dragging = true;
                activePointerId = e.pointerId;
                zone.setPointerCapture(e.pointerId);
                updateJoystick(e.clientX, e.clientY);
            });

            zone.addEventListener('pointermove', (e) => {
                if (!dragging || e.pointerId !== activePointerId) return;
                updateJoystick(e.clientX, e.clientY);
            });

            zone.addEventListener('pointerup', resetJoystick);
            zone.addEventListener('pointercancel', resetJoystick);

            // 跳躍按鈕
            const jumpBtn = document.getElementById('jumpBtn');
            jumpBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (isGrounded && gameState !== 'ENDING') {
                    playerVelocityY = jumpForce;
                    isGrounded = false;
                }
            });
        }

        // ================= 點擊嫌疑犯進行詢問或指認 =================
        function onPointerDownScene(event) {
            if (gameState !== 'INVESTIGATE') return;
            // 若對話框正開著則忽略點擊
            if (document.getElementById('dialogBox').style.display === 'block') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(suspectClickableMeshes, true);

            if (intersects.length > 0) {
                const suspectName = intersects[0].object.name;
                openSuspectDialog(suspectName);
            }
        }

        // ================= 對話框 UI 控制 =================
        function showDialog(speaker, text, buttons) {
            document.getElementById('dialogBadge').innerText = speaker;
            document.getElementById('dialogText').innerText = text;
            const btnContainer = document.getElementById('dialogButtons');
            btnContainer.innerHTML = '';

            buttons.forEach(b => {

                btn.className = 'action-btn ' + (b.style || '');
                btn.innerText = b.text;
                btn.onclick = b.action;
                btnContainer.appendChild(btn);
            });

            document.getElementById('dialogBox').style.display = 'block';
        }

        }

        // 更新主角所在房間名牌
        function updateRoomName() {
            const x = playerGroup.position.x;
            const z = playerGroup.position.z;
            const banner = document.getElementById('roomBanner');

            if (Math.abs(x) <= 16) {
                banner.innerText = "📍 中央皇家走廊";
            } else if (x < -16 && z > 0) {
                banner.innerText = "📍 1號房：大象爺爺的書房";
            } else if (x > 16 && z > 0) {
                banner.innerText = "📍 2號房：跳跳兔與小猴子的遊戲室";
            } else if (x < -16 && z <= 0) {
                banner.innerText = "📍 3號房：刺蝟弟弟的室內花園";
            } else {
                banner.innerText = "📍 4號房：皇室客廳";
            }
        }

        // ================= 主迴圈：角色走動動畫與碰撞偵測 =================
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min((now - prevTime) / 1000, 0.1);
            prevTime = now;

            if (playerGroup && gameState !== 'START') {
                const isDialogShowing = document.getElementById('dialogBox').style.display === 'block';

                if (!isDialogShowing && gameState !== 'ENDING') {
                    // 1. 根據虛擬方向桿旋轉視角與推進主角
                    if (Math.abs(joyInput.x) > 0.08) {
                        cameraYaw -= joyInput.x * 2.0 * delta;
                    }

                    const moveAmount = -joyInput.y; // 往上推為前進 (+1)
                    const isMoving = Math.abs(moveAmount) > 0.08 || Math.abs(joyInput.x) > 0.25;

                    if (Math.abs(moveAmount) > 0.08) {
                        const forwardX = -Math.sin(cameraYaw) * moveAmount * moveSpeed * delta;
                        const forwardZ = -Math.cos(cameraYaw) * moveAmount * moveSpeed * delta;

                        const nextPos = playerGroup.position.clone();
                        nextPos.x += forwardX;
                        nextPos.z += forwardZ;

                        // 簡易牆壁碰撞檢查
                        const playerRadius = 2.4;
                        let canMoveX = true, canMoveZ = true;

                        const boxX = new THREE.Box3(
                            new THREE.Vector3(playerGroup.position.x + forwardX - playerRadius, 1, playerGroup.position.z - playerRadius),
                            new THREE.Vector3(playerGroup.position.x + forwardX + playerRadius, 10, playerGroup.position.z + playerRadius)
                        );
                        const boxZ = new THREE.Box3(
                            new THREE.Vector3(playerGroup.position.x - playerRadius, 1, playerGroup.position.z + forwardZ - playerRadius),
                            new THREE.Vector3(playerGroup.position.x + playerRadius, 10, playerGroup.position.z + forwardZ + playerRadius)
                        );

                        for (let collider of wallColliders) {
                            if (collider.intersectsBox(boxX)) canMoveX = false;
                            if (collider.intersectsBox(boxZ)) canMoveZ = false;
                        }

                        if (canMoveX) playerGroup.position.x += forwardX;
                        if (canMoveZ) playerGroup.position.z += forwardZ;
                    }

                    // 讓主角面向前進方向
                    playerGroup.rotation.y = cameraYaw;

                    // 2. 主角手腳擺動動畫
                    if (isMoving && isGrounded) {
                        walkCycle += delta * 12;
                        leftLeg.rotation.x = Math.sin(walkCycle) * 0.65;
                        rightLeg.rotation.x = -Math.sin(walkCycle) * 0.65;
                        leftArm.rotation.x = -Math.sin(walkCycle) * 0.55;
                        rightArm.rotation.x = Math.sin(walkCycle) * 0.55;
                    } else {
                        leftLeg.rotation.x *= 0.85;
                        rightLeg.rotation.x *= 0.85;
                        leftArm.rotation.x *= 0.85;
                        rightArm.rotation.x *= 0.85;
                    }
                }

                // 3. 跳躍與重力物理
                playerGroup.position.y += playerVelocityY * delta;
                if (!isGrounded) {
                    playerVelocityY -= gravity * delta;
                    // 跳躍時雙手舉高
                    leftArm.rotation.x = Math.PI * 0.7;
                    rightArm.rotation.x = Math.PI * 0.7;
                    if (playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0;
                        playerVelocityY = 0;
                        isGrounded = true;
                    }
                }

                // 4. 過肩跟隨鏡頭 (可清楚看見 3D 主角在畫面中走動，同時保持身歷其境感)
                const camDist = 17;
                const camHeight = 12.5;
                const targetCamX = playerGroup.position.x + Math.sin(cameraYaw) * camDist;
                const targetCamZ = playerGroup.position.z + Math.cos(cameraYaw) * camDist;

                camera.position.lerp(new THREE.Vector3(targetCamX, playerGroup.position.y + camHeight, targetCamZ), 0.18);
                camera.lookAt(
                    playerGroup.position.x - Math.sin(cameraYaw) * 8,
                    playerGroup.position.y + 7.5,
                    playerGroup.position.z - Math.cos(cameraYaw) * 8
                );

                updateRoomName();

                // 5. 檢查是否走到大象爺爺身邊觸發報案對話
                if (gameState === 'FIND_ELEPHANT' && !hasAcceptedQuest) {
                    const distToElephant = playerGroup.position.distanceTo(elephantGroup.position);
                    if (distToElephant < 14) {
                        hasAcceptedQuest = true;
                        gameState = 'INVESTIGATE';
                        document.getElementById('clueButton').style.display = 'block';
                        document.getElementById('hudTop').innerText = "🔍 任務：到各房間調查並【點擊嫌疑犯】找出誰偷了大蘋果！";

                        showDialog(
                            "🐘 大象爺爺（森林村長）",
                            "「天啊！小偵探你終於來了！我準備在今晚派對分享的【巨無霸大蘋果】不見了，桌上只留下一張粉紅色的神祕挑戰紙條：\n\n1️⃣ 犯人【不吃香蕉】\n2️⃣ 犯人身上【沒有長耳朵】\n3️⃣ 犯人【不是走著路】離開的\n\n現在【跳跳兔】和【小猴子】在右前方的 2 號遊戲室，【刺蝟弟弟】在左後方的 3 號花園房。請你走過去點擊他們，幫我找出誰是小偷！」",
                            [{ text: "開始搜查房間！", action: closeDialog }]
                        );
                    }
                }

                // 嫌疑犯待機微幅呼吸/跳動動畫
                if (rabbitGroup) {
                    rabbitGroup.position.y = Math.abs(Math.sin(now * 0.004)) * 1.2;
                }
                if (monkeyGroup) {
                    monkeyGroup.rotation.y = Math.sin(now * 0.003) * 0.5;
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
