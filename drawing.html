<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>兒童填色與畫畫遊戲</title>
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: 'Comic Sans MS', '微軟正黑體', sans-serif; 
            background-color: #e0f7fa; 
            user-select: none;
        }

        /* ================= 首頁圖庫選單樣式 (油畫風格升級) ================= */
        #home-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh; 
            background-color: #e0f7fa;
            /* 加上一點活潑的背景紋理 */
            background-image: radial-gradient(#b2ebf2 20%, transparent 20%), radial-gradient(#b2ebf2 20%, transparent 20%);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
        }
        #home-screen h1 { 
            color: #ff5252; 
            font-size: 2.2rem; 
            text-shadow: 3px 3px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; 
            margin: 20px 0 10px 0;
            text-align: center;
            letter-spacing: 2px;
        }
        .instruction {
            color: #00796b;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        #image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px;
            width: 92%;
            max-width: 700px;
            max-height: 75vh;
            overflow-y: auto; 
            touch-action: pan-y; 
            padding: 15px;
            padding-bottom: 40px;
        }
        @media (min-width: 500px) { #image-grid { grid-template-columns: repeat(3, 1fr); } }

        /* 油畫風格卡片按鈕 */
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            /* 模擬厚實的畫框與立體感 */
            border: 6px solid #ffffff;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2), inset 0 0 20px rgba(0,0,0,0.1);
            padding: 12px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            position: relative;
        }
        .card:active { 
            transform: scale(0.92); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* 圖案本身 */
        .card-img { 
            width: 100%;
            height: 100px;
            object-fit: contain;
            /* 將白底變透明，黑線與鮮豔背景融合，呈現已上色的錯覺 */
            mix-blend-mode: multiply; 
            filter: contrast(1.2); /* 加深線條 */
        }

        /* 名牌標題 */
        .card-title {
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: 900;
            color: #d84315;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 4px 16px;
            border-radius: 20px;
            border: 2px solid #ffca28;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            letter-spacing: 1px;
        }

        /* ================= 遊戲主頁面樣式 ================= */
        #game-screen { 
            display: none; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw;
        }
        
        #toolbar-wrapper {
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
            flex-shrink: 0;
            width: 100%;
        }

        #toggle-toolbar-btn {
            background-color: #ffe082;
            color: #d84315;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px;
            border: none;
            cursor: pointer;
            border-bottom: 2px solid #ffca28;
            text-align: center;
            width: 100%;
        }
        #toggle-toolbar-btn:active { background-color: #ffca28; }

        #toolbar { 
            display: flex; 
            flex-wrap: wrap; 
            align-items: center;
            justify-content: center; 
            gap: 8px; 
            padding: 10px; 
        }
        #toolbar.collapsed {
            display: none !important;
        }
        
        .color-btn { 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            border: 3px solid #eee; 
            cursor: pointer; 
            transition: transform 0.1s;
        }
        .color-btn.active { 
            border-color: #333; 
            transform: scale(1.15); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .size-btn, .tool-btn { 
            padding: 6px 10px; 
            font-size: 1rem; 
            font-weight: bold;
            border-radius: 10px; 
            border: 2px solid #ccc; 
            background: #f9f9f9; 
            cursor: pointer; 
            color: #333;
        }
        .size-btn.active, .tool-btn.active { 
            background: #ffeb3b; 
            border-color: #ff9800; 
            color: #d84315;
        }
        
        .divider { width: 2px; height: 25px; background: #ddd; margin: 0 2px; border-radius: 2px; }

        #workspaces {
            flex-grow: 1;
            overflow-y: auto;          
            touch-action: pan-y;       
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0 40px 0;
            gap: 20px;
            background-color: #b2ebf2;
        }

        .section-title {
            font-size: 1.3rem;
            color: #00796b;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 1px 1px #fff;
        }

        .canvas-wrapper {
            position: relative;
            background-color: #ffffff;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 10px;
            touch-action: none;
        }

        .draw-canvas {
            display: block;
            border-radius: 10px;
            z-index: 1;
        }

        #image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none; 
            mix-blend-mode: multiply; 
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- 首頁 -->
    <div id="home-screen">
        <h1>🎨 兒童畫畫樂園 🖌️</h1>
        <div class="instruction">👇 點擊喜歡的畫布開始 👇</div>
        <div id="image-grid"></div>
    </div>

    <!-- 遊戲頁面 -->
    <div id="game-screen">
        <div id="toolbar-wrapper">
            <button id="toggle-toolbar-btn">⬆️ 收起工具列 (放大畫布)</button>
            <div id="toolbar">
                <button class="tool-btn active" id="btn-brush">🖌️ 畫筆</button>
                <button class="tool-btn" id="btn-eraser">🧽 橡皮</button>
                <div class="divider"></div>
                <button class="size-btn" data-size="10">細</button>
                <button class="size-btn active" data-size="25">中</button>
                <button class="size-btn" data-size="45">粗</button>
                <div class="divider"></div>
                <div class="color-btn active" style="background-color: #f44336;" data-color="#f44336"></div>
                <div class="color-btn" style="background-color: #ff9800;" data-color="#ff9800"></div>
                <div class="color-btn" style="background-color: #ffeb3b;" data-color="#ffeb3b"></div>
                <div class="color-btn" style="background-color: #4caf50;" data-color="#4caf50"></div>
                <div class="color-btn" style="background-color: #2196f3;" data-color="#2196f3"></div>
                <div class="color-btn" style="background-color: #9c27b0;" data-color="#9c27b0"></div>
                <div class="color-btn" style="background-color: #000000;" data-color="#000000"></div>
                <div class="divider"></div>
                <button class="tool-btn" id="btn-clear">🗑️ 重畫</button>
                <button class="tool-btn" id="btn-home">🏠 首頁</button>
            </div>
        </div>
        
        <div id="workspaces">
            <div>
                <div class="section-title">✨ 開心填色區 ✨</div>
                <div class="canvas-wrapper">
                    <canvas id="coloring-canvas" class="draw-canvas"></canvas>
                    <img src="" id="image-overlay" alt="coloring outline">
                </div>
            </div>
            <div>
                <div class="section-title">✨ 創意自畫區 ✨</div>
                <div class="canvas-wrapper">
                    <canvas id="drawing-canvas" class="draw-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 帶有標題的圖片清單 (已經過優化命名)
        const imageList = [
            { src: "Dcar.jpg", name: "汽車" },
            { src: "Dcat.jpg", name: "小貓" },
            { src: "Ddeer.jpg", name: "小鹿" },
            { src: "Dexcavator.jpg", name: "挖土機" },
            { src: "Dhorse.jpg", name: "小馬" },
            { src: "Drat.jpg", name: "小兔" }, // 圖片是拿著蘿蔔的兔子
            { src: "D倉鼠.jpg", name: "倉鼠" },
            { src: "D消防車.jpg", name: "消防車" },
            { src: "Nfish.jpg", name: "小魚" },
            { src: "公主.jpg", name: "公主" },
            { src: "城堡.jpg", name: "城堡" },
            { src: "巴士.jpg", name: "巴士" },
            { src: "恐龍.jpg", name: "恐龍" },
            { src: "拖車.jpg", name: "拖車" },
            { src: "救護車.jpg", name: "救護車" },
            { src: "火車.jpg", name: "火車" },
            { src: "獅子.jpg", name: "獅子" },
            { src: "老鷹.jpg", name: "老鷹" },
            { src: "蜘蛛.jpg", name: "蜘蛛" },
            { src: "警車.jpg", name: "警車" },
            { src: "貨車.jpg", name: "貨車" },
            { src: "鯊魚.jpg", name: "鯊魚" }
        ];

        // 鮮豔的油畫風格漸層背景庫
        const vibrantGradients = [
            'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)', // 粉彩紅
            'linear-gradient(135deg, #f6d365 0%, #fda085 100%)', // 暖陽橘
            'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)', // 薄荷藍
            'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)', // 天空藍
            'linear-gradient(135deg, #fccb90 0%, #d57eeb 100%)', // 夢幻紫
            'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)', // 薰衣草
            'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', // 蜜桃色
            'linear-gradient(135deg, #cfd9df 0%, #e2ebf0 100%)'  // 雲朵白
        ];

        const homeScreen = document.getElementById('home-screen');
        const gameScreen = document.getElementById('game-screen');
        const imageGrid = document.getElementById('image-grid');
        const overlay = document.getElementById('image-overlay');
        const workspaces = document.getElementById('workspaces');
        const canvases = document.querySelectorAll('.draw-canvas');

        let isDrawing = false;
        let currentColor = '#f44336';
        let currentSize = 25;
        let isEraser = false;
        let activeCanvas = null;
        let activeCtx = null;
        let lastX = 0, lastY = 0;

        // 動態生成帶有名牌與漸層的「油畫畫框」按鈕
        imageList.forEach((item, index) => {
            // 建立畫框卡片
            const card = document.createElement('div');
            card.className = 'card';
            // 隨機套用一個鮮豔的油畫背景
            card.style.background = vibrantGradients[index % vibrantGradients.length];
            
            // 建立圖案
            const img = document.createElement('img');
            img.src = item.src;
            img.className = 'card-img';
            
            // 建立標題名牌
            const title = document.createElement('div');
            title.className = 'card-title';
            title.innerText = item.name;
            
            card.appendChild(img);
            card.appendChild(title);

            // 點擊事件
            card.addEventListener('click', () => {
                overlay.src = item.src; 
                homeScreen.style.display = 'none';
                gameScreen.style.display = 'flex';
                
                overlay.onload = () => { initCanvas(false); };
                setTimeout(() => { initCanvas(false); }, 150); 
            });
            
            imageGrid.appendChild(card);
        });

        function initCanvas(preserveDrawing = false) {
            const tempCanvases = [];
            if (preserveDrawing) {
                canvases.forEach((canvas, index) => {
                    const temp = document.createElement('canvas');
                    temp.width = canvas.width;
                    temp.height = canvas.height;
                    temp.getContext('2d').drawImage(canvas, 0, 0);
                    tempCanvases[index] = temp;
                });
            }

            let imgAspect = overlay.naturalWidth / overlay.naturalHeight;
            if (!imgAspect || isNaN(imgAspect)) imgAspect = 1; 

            let maxWidth = workspaces.clientWidth * 0.95;
            let maxHeight = workspaces.clientHeight * 0.85; 
            if (maxWidth > 600) maxWidth = 600;

            let newWidth = maxWidth;
            let newHeight = newWidth / imgAspect;

            if (newHeight > maxHeight && maxHeight > 100) {
                newHeight = maxHeight;
                newWidth = newHeight * imgAspect;
            }

            canvases.forEach((canvas, index) => {
                canvas.width = newWidth;
                canvas.height = newHeight;
                canvas.parentElement.style.width = newWidth + 'px';
                canvas.parentElement.style.height = newHeight + 'px';

                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (preserveDrawing && tempCanvases[index]) {
                    ctx.drawImage(tempCanvases[index], 0, 0, canvas.width, canvas.height);
                }
            });

            overlay.style.width = newWidth + 'px';
            overlay.style.height = newHeight + 'px';
        }

        document.getElementById('toggle-toolbar-btn').addEventListener('click', function() {
            const tb = document.getElementById('toolbar');
            tb.classList.toggle('collapsed');
            
            if (tb.classList.contains('collapsed')) {
                this.innerHTML = '⬇️ 打開畫筆與顏色 🎨';
            } else {
                this.innerHTML = '⬆️ 收起工具列 (放大畫布)';
            }
            setTimeout(() => { initCanvas(true); }, 50);
        });

        function clearCanvas() {
            canvases.forEach(canvas => {
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            });
        }

        document.getElementById('btn-home').addEventListener('click', () => {
            gameScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });
        document.getElementById('btn-clear').addEventListener('click', clearCanvas);

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentColor = e.target.getAttribute('data-color');
                isEraser = false;
                updateToolUI();
            });
        });

        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentSize = parseInt(e.target.getAttribute('data-size'));
            });
        });

        document.getElementById('btn-brush').addEventListener('click', () => { isEraser = false; updateToolUI(); });
        document.getElementById('btn-eraser').addEventListener('click', () => { isEraser = true; updateToolUI(); });

        function updateToolUI() {
            document.getElementById('btn-brush').classList.toggle('active', !isEraser);
            document.getElementById('btn-eraser').classList.toggle('active', isEraser);
        }

        function getPos(e, targetCanvas) {
            const rect = targetCanvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches.item(0).clientX;
                clientY = e.touches.item(0).clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches.item(0).clientX;
                clientY = e.changedTouches.item(0).clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) {
            e.preventDefault(); 
            isDrawing = true;
            activeCanvas = e.target; 
            activeCtx = activeCanvas.getContext('2d');
            
            const pos = getPos(e, activeCanvas);
            lastX = pos.x;
            lastY = pos.y;

            activeCtx.beginPath();
            activeCtx.arc(lastX, lastY, currentSize / 2, 0, Math.PI * 2);
            activeCtx.fillStyle = isEraser ? '#ffffff' : currentColor;
            activeCtx.fill();
            activeCtx.closePath();
        }

        function draw(e) {
            e.preventDefault();
            if (!isDrawing || e.target !== activeCanvas) return; 
            const pos = getPos(e, activeCanvas);
            activeCtx.beginPath();
            activeCtx.moveTo(lastX, lastY);
            activeCtx.lineTo(pos.x, pos.y);
            activeCtx.strokeStyle = isEraser ? '#ffffff' : currentColor;
            activeCtx.lineWidth = currentSize;
            activeCtx.lineCap = 'round'; 
            activeCtx.lineJoin = 'round';
            activeCtx.stroke();
            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing(e) {
            if (e) e.preventDefault();
            isDrawing = false;
            activeCanvas = null;
            activeCtx = null;
        }

        canvases.forEach(canvas => {
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            canvas.addEventListener('touchstart', startDrawing, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', stopDrawing, {passive: false});
            canvas.addEventListener('touchcancel', stopDrawing, {passive: false});
        });

        window.addEventListener('resize', () => {
            if (gameScreen.style.display === 'flex') initCanvas(true);
        });
    </script>
</body>
</html>
