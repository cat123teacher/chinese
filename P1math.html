<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小一數學大冒險 (星級進度紀錄版)</title>
<style>
    :root {
        --primary: #ff6b6b;
        --secondary: #4ecdc4;
        --accent: #ffe66d;
        --bg: #e0f7fa;
        --text: #2c3e50;
    }
    body {
        font-family: "Comic Sans MS", "微軟正黑體", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px 20px 150px 20px;
        text-align: center;
        user-select: none;
        position: relative;
        min-height: 100vh;
        box-sizing: border-box;
    }
    
    /* 左上角圖標 */
    .top-left-logo {
        position: absolute;
        top: 15px; left: 15px; width: 70px; height: 70px; border-radius: 50%;
        border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); z-index: 1000; background-color: white;
    }

    h1 { color: var(--primary); font-size: 2.5em; text-shadow: 2px 2px #fff; margin: 10px 0 20px 0; }
    .container {
        max-width: 850px; margin: 0 auto; background: white; padding: 20px 30px;
        border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); min-height: 500px;
    }
    .hidden { display: none !important; }
    
    /* 首頁按鈕與進度區 */
    #levels-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; margin-bottom: 20px; }
    .level-btn { background-color: var(--secondary); color: white; border: none; border-radius: 15px; padding: 15px; font-size: 1.2em; cursor: pointer; transition: transform 0.2s; box-shadow: 0 5px #1a938c; font-weight: bold; }
    .level-btn:hover { transform: translateY(-2px); background-color: #45b7b0; }
    .level-btn:active { transform: translateY(3px); box-shadow: 0 2px #1a938c; }
    
    /* 進度紀錄 (Progress Record) */
    .progress-section { background: #fdf2e9; border: 3px dashed #e67e22; padding: 15px; border-radius: 15px; margin-bottom: 30px; text-align: left;}
    .progress-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e67e22; padding-bottom: 10px; margin-bottom: 10px;}
    .progress-header h3 { margin: 0; color: #d35400; font-size: 1.5em; }
    .clear-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 3px #c0392b;}
    .clear-btn:active { transform: translateY(2px); box-shadow: 0 1px #c0392b;}
    .progress-list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 5px; border-bottom: 1px dashed #ccc; font-size: 1.1em;}
    .progress-list-item:last-child { border-bottom: none; }
    
    .main-adventure-btn { background-color: #e67e22; color: white; text-decoration: none; display: inline-block; font-size: 1.3em; padding: 15px 40px; border-radius: 20px; box-shadow: 0 5px #d35400; font-weight: bold; transition: 0.2s; }
    .main-adventure-btn:active { transform: translateY(3px); box-shadow: 0 2px #d35400; }
    
    /* 教學與通用按鈕 */
    .intro-box { background-color: var(--accent); padding: 20px; border-radius: 15px; font-size: 1.2em; line-height: 1.6; text-align: left; margin-bottom: 20px; border: 2px dashed #f39c12; }
    .action-btn { background-color: var(--primary); color: white; font-size: 1.3em; padding: 12px 30px; border: none; border-radius: 15px; cursor: pointer; box-shadow: 0 5px #c0392b; margin: 5px; }
    .action-btn:active { transform: translateY(3px); box-shadow: 0 2px #c0392b; }
    .speak-btn { font-size: 1.2em; background: #f39c12; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; box-shadow: 0 4px #d68910; display: inline-flex; align-items: center; justify-content: center; margin-right: 10px;}
    
    /* 遊戲區佈局 */
    .status-bar { display: flex; justify-content: space-between; font-size: 1.2em; font-weight: bold; color: #7f8c8d; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px;}
    .question-title { font-size: 2.2em; color: var(--text); margin-bottom: 20px; display: flex; align-items: center; justify-content: center;}
    
    /* 跳到下一題按鈕 (答錯時顯示) */
    .skip-btn { background-color: #f39c12; color: white; border: none; font-size: 1.2em; padding: 10px 30px; border-radius: 12px; cursor: pointer; box-shadow: 0 5px #d68910; margin-top: 15px; animation: pulse 1.5s infinite;}
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    
    /* 導航按鈕區 (上一頁/下一頁) */
    .nav-bar { display: flex; justify-content: center; gap: 15px; margin-top: 25px; padding-top: 20px; border-top: 2px dashed #bdc3c7;}
    .nav-btn { background: #34495e; color: white; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 12px; cursor: pointer; box-shadow: 0 4px #2c3e50; transition: 0.2s;}
    .nav-btn:active { transform: translateY(2px); box-shadow: 0 2px #2c3e50; }
    .nav-btn:disabled { background: #95a5a6; box-shadow: 0 4px #7f8c8d; cursor: not-allowed; opacity: 0.7;}
    
    /* Teacher Cat 提示區 */

    .option-btn { background-color: #3498db; color: white; font-size: 2em; padding: 15px; border: none; border-radius: 15px; cursor: pointer; box-shadow: 0 5px #2980b9; transition: background 0.2s; }
    .option-btn:hover:not(:disabled) { background-color: #2980b9; }
    .option-btn:disabled { background-color: #95a5a6; box-shadow: 0 5px #7f8c8d; cursor: not-allowed; opacity: 0.7;}
    .feedback { font-size: 1.8em; font-weight: bold; min-height: 40px; margin-top: 15px; display: flex; flex-direction: column; align-items: center;}
    .correct { color: #2ecc71; }
    .wrong { color: #e74c3c; }

    /* 成績總結區 */
    .summary-list { text-align: left; background: #f9f9f9; padding: 20px; border-radius: 15px; border: 2px solid #ecf0f1; max-height: 350px; overflow-y: auto; margin-bottom: 20px;}
    .summary-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #ddd; font-size: 1.2em;}
    .summary-item:last-child { border-bottom: none; }
    .redo-btn { background: #e74c3c; color: white; border: none; border-radius: 8px; padding: 5px 15px; cursor: pointer; box-shadow: 0 3px #c0392b;}
    .redo-btn:active { transform: translateY(2px); box-shadow: 0 1px #c0392b;}

        position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6);

    .retry-modal-content {
        background: white; padding: 30px; border-radius: 20px; border: 5px dashed #f39c12;

    }
    @keyframes pop-up-scale { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* 彩帶動畫特效 */
    .confetti {
        position: fixed; bottom: -50px; font-size: 2.5rem; animation: pop-up linear forwards;

    @keyframes pop-up {

        100% { transform: translateY(-120vh) rotate(720deg); opacity: 0; }

    .social-links a, .social-links span { color: #ecf0f1; text-decoration: none; transition: 0.2s; }
    .social-links a:hover { color: #f39c12; text-decoration: underline; }
</style>

<script>
// --- 音效與畫面特效 ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playCorrectSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let osc = audioCtx.createOscillator(); let gainNode = audioCtx.createGain();
    osc.type = 'sine'; osc.connect(gainNode); gainNode.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.5);
}

function showConfetti() {
    const emojis = ['🎉', '✨', '⭐', '🎊', '🌟'];
    for (let i = 0; i < 25; i++) {
        let conf = document.createElement('div'); conf.className = 'confetti';
        conf.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        conf.style.left = Math.floor(Math.random() * 90 + 5) + '%';
        conf.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 3000);
    }
}

// --- 語音系統 ---
let questionToSpeak = ""; let hintToSpeak = "";
function speak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-HK'; msg.rate = 0.85; window.speechSynthesis.speak(msg);
    }
}
function speakQuestion() { speak(questionToSpeak); }
function speakCatHint() { speak(hintToSpeak); }

// --- 工具與題庫生成 ---
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(array) { return array.sort(() => Math.random() - 0.5); }
function getWrongOptions(ans) {
    let opts = new Set([ans]);
    while(opts.size < 4) { let w = ans + rand(-5, 5); if(w !== ans && w >= 0) opts.add(w); }
    return shuffle(Array.from(opts));
}
function generateUniqueQ(count, generator) {
    let set = new Set(); let arr = [];
    while(arr.length < count) {
        let qData = generator();
        if(!set.has(qData.q)) { set.add(qData.q); arr.push(qData); }
    }
    return arr;
}

const levels = [
    { name: "第一關：18以內加法", type: 1, intro: "利用「湊十法」把兩個數合起來。<br>例子： 8 + 5 = 13", genEasy: () => { let a=rand(1,9), b=rand(1,10-a); return {q:`${a} + ${b} = ?`, a:a+b, n1:a, n2:b, op1:'+'}; }, genHard: () => { let a=rand(5,9), b=rand(11-a,9); return {q:`${a} + ${b} = ?`, a:a+b, n1:a, n2:b, op1:'+'}; } },
    { name: "第二關：18以內減法", type: 2, intro: "減法代表「取去」。<br>例子： 15 - 6 = 9", genEasy: () => { let a=rand(2,10), b=rand(1,a-1); return {q:`${a} - ${b} = ?`, a:a-b, n1:a, n2:b, op1:'-'}; }, genHard: () => { let a=rand(11,18), b=rand(2,9); return {q:`${a} - ${b} = ?`, a:a-b, n1:a, n2:b, op1:'-'}; } },
    { name: "第三關：兩位數加法(不進位)", type: 3, intro: "十位加十位，個位加個位。<br>例子： 23 + 14 = 37", genEasy: () => { let a=rand(10,40), b=rand(1,9); let au=a%10; b=Math.min(b, 9-au); return {q:`${a} + ${b} = ?`, a:a+b, n1:a, n2:b, op1:'+'}; }, genHard: () => { let t1=rand(1,5), t2=rand(1,8-t1), u1=rand(1,8), u2=rand(1,9-u1); let n1=t1*10+u1, n2=t2*10+u2; return {q:`${n1} + ${n2} = ?`, a:n1+n2, n1:n1, n2:n2, op1:'+'}; } },
    { name: "第四關：兩位數減法(不退位)", type: 4, intro: "十位減十位，個位減個位。注意0的處理！<br>例子： 26 - 16 = 10", genEasy: () => { let t=rand(2,9), u1=rand(2,9), u2=rand(1,u1); let n1=t*10+u1; return {q:`${n1} - ${u2} = ?`, a:n1-u2, n1:n1, n2:u2, op1:'-'}; }, genHard: () => { let t1=rand(3,9), t2=rand(1,t1-1), u1=rand(2,9), u2=rand(1,u1); let n1=t1*10+u1, n2=t2*10+u2; return {q:`${n1} - ${n2} = ?`, a:n1-n2, n1:n1, n2:n2, op1:'-'}; } },
    { name: "第五關：兩位數加法(進位)", type: 0, intro: "個位相加滿十，要向十位進一！可用下方畫板寫直式！<br>例子： 28 + 15 = 43", genEasy: () => { let t=rand(1,7), u1=rand(2,9), u2=rand(10-u1,9); let n1=t*10+u1; return {q:`${n1} + ${u2} = ?`, a:n1+u2, n1:n1, n2:u2, op1:'+'}; }, genHard: () => { let t1=rand(1,6), t2=rand(1,7-t1), u1=rand(2,9), u2=rand(10-u1,9); let n1=t1*10+u1, n2=t2*10+u2; return {q:`${n1} + ${n2} = ?`, a:n1+n2, n1:n1, n2:n2, op1:'+'}; } },
    { name: "第六關：50以內加減混合", type: 0, intro: "有加有減，要依次序「由左至右」分層計算。<br>例子： 20 + 15 - 5 = 30", genEasy: () => { let a=rand(10,30), b=rand(5,15), c=rand(1,a+b-1); return {q:`${a} + ${b} - ${c} = ?`, a:a+b-c, n1:a, n2:b, n3:c, op1:'+', op2:'-'}; }, genHard: () => { let a=rand(20,50), b=rand(1,15), c=rand(5,20); return {q:`${a} - ${b} + ${c} = ?`, a:a-b+c, n1:a, n2:b, n3:c, op1:'-', op2:'+'}; } },
    { name: "第七關：100以內連加法", type: 0, intro: "三個數相加，由左至右。<br>例子： 12 + 18 + 5 = 35", genEasy: () => { let a=rand(5,20), b=rand(5,20), c=rand(5,20); return {q:`${a} + ${b} + ${c} = ?`, a:a+b+c, n1:a, n2:b, n3:c, op1:'+', op2:'+'}; }, genHard: () => { let a=rand(15,35), b=rand(15,35), c=rand(10,25); return {q:`${a} + ${b} + ${c} = ?`, a:a+b+c, n1:a, n2:b, n3:c, op1:'+', op2:'+'}; } },
    { name: "第八關：100以內連減法", type: 0, intro: "連減法要依著次序，減完第一個再減第二個。<br>例子： 86 - 21 - 14 = 51", genEasy: () => { let a=rand(20,49), b=rand(1,10), c=rand(1,a-b-1); return {q:`${a} - ${b} - ${c} = ?`, a:a-b-c, n1:a, n2:b, n3:c, op1:'-', op2:'-'}; }, genHard: () => { let a=rand(50,99), b=rand(11,20), c=rand(11,a-b-1); return {q:`${a} - ${b} - ${c} = ?`, a:a-b-c, n1:a, n2:b, n3:c, op1:'-', op2:'-'}; } },
    { name: "第九關：100以內減法(退位)", type: 0, intro: "個位不夠減，要向十位借一當十。<br>例子： 72 - 38 = 34", genEasy: () => { let t=rand(3,9), u1=rand(0,7), u2=rand(u1+1,9); let n1=t*10+u1; return {q:`${n1} - ${u2} = ?`, a:n1-u2, n1:n1, n2:u2, op1:'-'}; }, genHard: () => { let t1=rand(5,9), t2=rand(1,t1-2), u1=rand(0,7), u2=rand(u1+1,9); let n1=t1*10+u1, n2=t2*10+u2; return {q:`${n1} - ${n2} = ?`, a:n1-n2, n1:n1, n2:n2, op1:'-'}; } },
    { name: "第十關：加減混合終極挑戰", type: 0, intro: "計算請保持細心，記得由左至右！善用下方畫板來算草喔！", genEasy: () => { let a=rand(30,60), b=rand(10,25), c=rand(10,20); return {q:`${a} + ${b} - ${c} = ?`, a:a+b-c, n1:a, n2:b, n3:c, op1:'+', op2:'-'}; }, genHard: () => { let a=rand(50,90), b=rand(20,40), c=rand(20,40); return {q:`${a} - ${b} + ${c} = ?`, a:a-b+c, n1:a, n2:b, n3:c, op1:'-', op2:'+'}; } }
];

// --- 狀態控制與 Progress Record (Local Storage) ---
let currLvlIdx = 0, currentQuestions = [], qIndex = 0, score = 0;
let userAnswers = []; // null(未答), true(對), false(錯)
let isRetryMode = false;
let autoAdvanceTimer = null;

// 初始化讀取 LocalStorage (最高分為20分)
let levelHighScores = JSON.parse(localStorage.getItem('catMathScores_v2')) || new Array(10).fill(0);

function showScreen(id) {
    ['home-screen', 'intro-screen', 'game-screen', 'result-screen'].forEach(s => document.getElementById(s).classList.add('hidden'));
    document.getElementById(id + '-screen').classList.remove('hidden');
    if (id === 'home') renderProgressRecord();
}

// 渲染進度紀錄與星星
function renderProgressRecord() {
    const list = document.getElementById('progress-list');
    list.innerHTML = "";
    levels.forEach((lvl, i) => {
        let s = levelHighScores[i];
        let starHtml = '';
        if (s === 20) starHtml = '<span style="font-size: 1.8em; color: #f1c40f; text-shadow: 1px 1px #d35400;">🌟</span>'; // 滿分大星星
        else if (s >= 10) starHtml = '<span style="font-size: 1.2em; color: #f1c40f;">⭐</span>'; // 合格小星星
        else starHtml = '<span style="font-size: 1.2em; color: #bdc3c7;">☆</span>'; // 未合格空心星
        
        list.innerHTML += `
            <div class="progress-list-item">
                <span>${lvl.name}</span>
                <span style="font-weight:bold; color:#2c3e50;">最高分: ${s}/20 ${starHtml}</span>
            </div>
        `;
    });
}

function clearRecord() {
    if(confirm("確定要清除所有的星星和進度紀錄嗎？")) {
        localStorage.removeItem('catMathScores_v2');
        levelHighScores = new Array(10).fill(0);
        renderProgressRecord();
    }
}

window.onload = () => {
    const grid = document.getElementById('levels-grid');
    levels.forEach((lvl, i) => {
        let btn = document.createElement('button');
        btn.className = 'level-btn'; btn.innerHTML = lvl.name;
        btn.onclick = () => {
            currLvlIdx = i;
            document.getElementById('intro-title').innerText = lvl.name;
            document.getElementById('intro-text').innerHTML = "<b>教學重點：</b><br>" + lvl.intro;
            showScreen('intro');
        };
        grid.appendChild(btn);
    });
    initCanvas(); 
    renderProgressRecord();
};

function startGame() {
    let lvl = levels[currLvlIdx];
    let easyPool = generateUniqueQ(20, lvl.genEasy);
    let hardPool = generateUniqueQ(20, lvl.genHard);
    currentQuestions = [...shuffle(easyPool).slice(0,10), ...shuffle(hardPool).slice(0,10)];
    userAnswers = new Array(20).fill(null); 
    
    isRetryMode = false;
    qIndex = 0; 
    updateScoreDisplay();
    showScreen('game');
    loadQuestion();
}

function updateScoreDisplay() {
    // 每一題 1 分，共 20 分
    score = userAnswers.filter(a => a === true).length;
    document.getElementById('score-display').innerText = `分數：${score} / 20`;
    
    // 即時儲存最高分
    if (score > levelHighScores[currLvlIdx]) {
        levelHighScores[currLvlIdx] = score;
        localStorage.setItem('catMathScores_v2', JSON.stringify(levelHighScores));
    }
}

function loadQuestion() {
    if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
    
    let qData = currentQuestions[qIndex];
    let lvl = levels[currLvlIdx];
    document.getElementById('question-progress').innerText = `題數：${qIndex + 1} / 20 (${qIndex < 10 ? "淺程度" : "深程度"})`;
    document.getElementById('question-text').innerText = qData.q;
    questionToSpeak = `第${qIndex+1}題： ${qData.q.replace('=', '等於').replace('?', '多少')}`;
    
    // 控制導航與跳過按鈕
    document.getElementById('skip-btn').classList.add('hidden');
    if(isRetryMode) {
        document.getElementById('normal-nav').classList.add('hidden');
        document.getElementById('retry-nav').classList.remove('hidden');
    } else {
        document.getElementById('normal-nav').classList.remove('hidden');
        document.getElementById('retry-nav').classList.add('hidden');
        document.getElementById('prev-btn').disabled = (qIndex === 0);
        document.getElementById('next-btn').innerText = (qIndex === 19) ? "查看成績" : "下一頁";
    }
    
    let fbText = document.getElementById('fb-text');
    let fbArea = document.getElementById('feedback');
    fbArea.className = "feedback";
    
    if (isRetryMode) {
        fbText.innerText = "⭐ 重做模式：請細心計算，直到答對為止！"; 
        fbText.style.color = "#f39c12";
        // 重做時自動開啟中文提示窗
        document.getElementById('retry-modal').classList.remove('hidden');
        speak("請看清楚提示，再試一次");
    } else if(userAnswers[qIndex] === true) {
        fbText.innerText = "✅ 你已經答對這題了！"; fbText.style.color = "#2ecc71";
    } else if (userAnswers[qIndex] === false) {
        fbText.innerText = "❌ 之前答錯了，重做時再試吧！"; fbText.style.color = "#e74c3c";
    } else {
        fbText.innerText = "";
    }
    
    document.getElementById('options-container').innerHTML = "";
    document.getElementById('cat-hint-box').classList.add('hidden'); 
    
    const hintBtn = document.getElementById('btn-show-hint');
    if (currLvlIdx >= 2) { hintBtn.classList.remove('hidden'); prepareTeacherCatHint(qData); } 
    else { hintBtn.classList.add('hidden'); }

    const zone = document.getElementById('interactive-zone');
    const scratchpad = document.getElementById('scratchpad-container');
    let optsDiv = document.getElementById('options-container');
    
    let interactionDone = (userAnswers[qIndex] !== null || isRetryMode); 
    
    if(lvl.type === 0) {
        zone.classList.add('hidden'); scratchpad.classList.remove('hidden');
        clearCanvas(); interactionDone = true; 
    } else {
        scratchpad.classList.add('hidden'); zone.classList.remove('hidden'); zone.innerHTML = "";
        if(lvl.type === 1) buildDragAddUI(qData.n1, qData.n2, interactionDone);
        else if(lvl.type === 2) buildClickSubUI(qData.n1, qData.n2, interactionDone);
        else if(lvl.type === 3) { buildVisualBlocks(qData.n1, qData.n2, '+'); interactionDone = true; }
        else if(lvl.type === 4) { buildVisualBlocks(qData.n1, qData.n2, '-'); interactionDone = true; }
    }
    
    let opts = getWrongOptions(qData.a);
    opts.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'option-btn'; btn.innerText = opt;
        btn.onclick = () => checkAns(opt, qData.a);
        optsDiv.appendChild(btn);
    });
    
    if(interactionDone) optsDiv.classList.remove('hidden');
    else optsDiv.classList.add('hidden');
}

// 導航控制
function prevQuestion() { if(qIndex > 0) { qIndex--; loadQuestion(); } }
function nextQuestion() { 
    if(qIndex < 19) { qIndex++; loadQuestion(); }
    else { showResult(); }
}
function redoQuestion(index) {
    isRetryMode = true;
    qIndex = index;
    showScreen('game');
    loadQuestion();
}
function backToSummary() {
    isRetryMode = false;
    showResult();
}

// --- Teacher Cat 提示 ---
function prepareTeacherCatHint(q) {
    let text = ""; let mathHtml = "";
    if (q.n3 !== undefined) {
        text = `連加減混合題，約定次序要「由左至右」分層計算！先計： ${q.n1} ${q.op1} ${q.n2}。`;
        mathHtml = `<div>&nbsp;&nbsp;${q.n1}</div><div class="vertical-line">${q.op1} ${q.n2}</div>`;
    } else {
        text = "列直式時，緊記相同數位上的數字才能相加減！個位對齊個位，從個位開始計起喔！";
        if(q.op1 === '+' && (q.n1%10 + q.n2%10 >= 10)) text += " 個位滿十，記得向十位進一！";
        if(q.op1 === '-' && (q.n1%10 < q.n2%10)) text += " 個位不夠減，記得向十位借一當十！";
        let n2Str = q.n2 < 10 ? `&nbsp;${q.n2}` : q.n2; 
        mathHtml = `<div>&nbsp;&nbsp;${q.n1}</div><div class="vertical-line">${q.op1} ${n2Str}</div>`;
    }
    document.getElementById('cat-hint-text').innerText = text;
    document.getElementById('cat-hint-vertical').innerHTML = mathHtml;
    hintToSpeak = text;
}
function toggleCatHint() {
    let box = document.getElementById('cat-hint-box');
    if (box.classList.contains('hidden')) { box.classList.remove('hidden'); speakCatHint(); } 
    else { box.classList.add('hidden'); }
}

// --- 大畫皮 Canvas ---
const canvas = document.getElementById('scratchpad'); const ctx = canvas.getContext('2d');
let isDrawing = false; let currentMode = 'pen'; 
function initCanvas() {
    canvas.addEventListener('pointerdown', startPosition); canvas.addEventListener('pointerup', endPosition);
    canvas.addEventListener('pointermove', draw); canvas.addEventListener('pointerleave', endPosition);
    canvas.addEventListener('touchstart', (e) => e.preventDefault(), {passive: false});
}
function setDrawMode(mode) {
    currentMode = mode;
    document.getElementById('btn-pen').classList.remove('active'); document.getElementById('btn-eraser').classList.remove('active');
    document.getElementById('btn-' + mode).classList.add('active');
}
function getPointerPos(e) {
    let rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
}
function startPosition(e) { isDrawing = true; let pos = getPointerPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); draw(e); }
function endPosition() { isDrawing = false; ctx.beginPath(); }
function draw(e) {
    if (!isDrawing) return;
    let pos = getPointerPos(e); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (currentMode === 'eraser') { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; } 
    else { ctx.globalCompositeOperation = 'source-over'; ctx.lineWidth = 2.5; ctx.strokeStyle = '#2980b9'; }
    ctx.lineTo(pos.x, pos.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
}
function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

// --- 互動 UI ---
function buildDragAddUI(a, b, forceShowOptions) {
    let zone = document.getElementById('interactive-zone');
    zone.innerHTML = `<div class="hint-text">請把外面的蘋果點擊放入格子湊成十！</div>`;
    let framesHtml = `<div class="frames-container"><div class="ten-frame" id="frame1">${makeSlots(10, a)}</div>${(a+b > 10) ? `<div class="ten-frame" id="frame2">${makeSlots(10, 0)}</div>` : ''}</div>`;
    zone.innerHTML += framesHtml;
    let sourceHtml = document.createElement('div'); sourceHtml.className = 'source-apples'; sourceHtml.id = 'source-box';
    for(let i=0; i<b; i++){
        let ap = document.createElement('div'); ap.className = 'apple-item'; ap.innerHTML = '🍎';
        ap.onclick = () => {
            let emptySlot = document.querySelector('.slot.empty');
            if(emptySlot) { emptySlot.innerHTML = '🍎'; emptySlot.classList.remove('empty'); ap.remove();
                if(document.getElementById('source-box').children.length === 0) document.getElementById('options-container').classList.remove('hidden');
            }
        };
        sourceHtml.appendChild(ap);
    }
    zone.appendChild(sourceHtml);
    if(forceShowOptions) document.getElementById('options-container').classList.remove('hidden');
}
function makeSlots(total, filled) { let h = ''; for(let i=0; i<total; i++) h += `<div class="slot ${i>=filled ? 'empty':''}">${i<filled ? '🍎':''}</div>`; return h; }

function buildClickSubUI(a, b, forceShowOptions) {
    let zone = document.getElementById('interactive-zone');
    zone.innerHTML = `<div class="hint-text">請點擊 ${b} 個蘋果把它們「取去」！</div>`;
    let box = document.createElement('div'); box.className = 'cross-container'; let eaten = 0;
    for(let i=0; i<a; i++){
        let ap = document.createElement('div'); ap.className = 'cross-apple'; ap.innerHTML = '🍎';
        ap.onclick = () => {
            if(eaten < b && !ap.classList.contains('crossed')) { ap.classList.add('crossed'); eaten++;
                if(eaten === b) document.getElementById('options-container').classList.remove('hidden');
            }
        };
        box.appendChild(ap);
    }
    zone.appendChild(box);
    if(forceShowOptions) document.getElementById('options-container').classList.remove('hidden');
}

function buildVisualBlocks(a, b, op) {
    let zone = document.getElementById('interactive-zone');
    zone.innerHTML = `<div class="hint-text">長條代表10，單粒代表1。看看積木來計算！</div>`;
    zone.innerHTML += `<div class="blocks-container">${getBlocksHtml(a)} <div style="color:var(--primary); font-weight:bold;">${op}</div> ${getBlocksHtml(b)}</div>`;
}
function getBlocksHtml(num) {
    let t = Math.floor(num/10), u = num%10; let h = `<div class="block-group">`;
    for(let i=0; i<t; i++) h += `<div class="tens-stick"></div>`;
    if(u > 0) { h += `<div class="ones-col">`; for(let i=0; i<u; i++) h += `<div class="ones-cube"></div>`; h += `</div>`; }
    return h + `</div>`;
}

// --- 答案檢查與結算 (包含重做邏輯) ---
function checkAns(selected, correct) {
    let btns = document.querySelectorAll('.option-btn');
    btns.forEach(b => b.disabled = true);
    let fbText = document.getElementById('fb-text');
    let skipBtn = document.getElementById('skip-btn');
    
    if(selected === correct) {
        playCorrectSound(); showConfetti();
        fbText.innerText = "⭕ 答對了！太棒了！"; fbText.style.color = "#2ecc71";
        
        if (isRetryMode) {
            userAnswers[qIndex] = true;
            updateScoreDisplay(); // 加回星星和分數
            setTimeout(() => { backToSummary(); }, 2000); // 答對自動回總結
        } else {
            userAnswers[qIndex] = true;
            updateScoreDisplay();
            autoAdvanceTimer = setTimeout(() => { nextQuestion(); }, 2000);
        }
    } else {
        if (isRetryMode) {
            // 重做模式答錯：即時重來，不跳走，不公佈答案
            fbText.innerText = `❌ 還是答錯了，請細心計算，再試一次吧！`; fbText.style.color = "#e74c3c";
            speak("答錯了，請再試一次");
            setTimeout(() => { btns.forEach(b => b.disabled = false); }, 1500); // 解鎖按鈕再次嘗試
        } else {
            // 一般模式答錯：記錄錯題，停止自動跳轉，顯示「跳到下一題」
            if(userAnswers[qIndex] === null) userAnswers[qIndex] = false; 
            fbText.innerText = `❌ 答錯了，正確答案是 ${correct}`; fbText.style.color = "#e74c3c";
            speak("答錯了");
            skipBtn.classList.remove('hidden');
        }
    }
}

function showResult() {
    showScreen('result');
    updateScoreDisplay();
    document.getElementById('final-score').innerText = `你在 ${levels[currLvlIdx].name.split('(')} 得到：${score} / 20 分！`;
    
    let summaryHTML = '<h3>📝 題目總結：</h3><div class="summary-list">';
    currentQuestions.forEach((q, i) => {
        let status = userAnswers[i] === true ? '<span style="color:#2ecc71;">⭕ 答對</span>' : 
                    (userAnswers[i] === false ? '<span style="color:#e74c3c;">❌ 答錯</span>' : '<span style="color:#95a5a6;">➖ 未答</span>');
        let redoBtn = userAnswers[i] !== true ? `<button class="redo-btn" onclick="redoQuestion(${i})">重做這題</button>` : '';
        summaryHTML += `<div class="summary-item"><span>第 ${i+1} 題： ${q.q}</span> <div>${status} ${redoBtn}</div></div>`;
    });
    summaryHTML += '</div>';
    document.getElementById('summary-container').innerHTML = summaryHTML;
}
</script>
