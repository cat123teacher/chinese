    <script>
        // 課前預習知識庫 (關卡按鈕顯示的文字會直接套用 title)
        const levelsData = [
            { id: 1, title: "第一關 - 五位數", tutorial: "<b>五位數的概念：</b><br>五位數有萬位、千位、百位、十位和個位。<br>例如：42,710 讀作「四萬二千七百一十」。<br><br><b>💡 Teacher Cat 秘訣：</b><br>比較大小時，要從最左邊的「萬位」開始比較哦！" },
            { id: 2, title: "第二關 - 公里", tutorial: "<b>認識公里 (km)：</b><br>1 公里 (km) = 1000 米 (m)。<br><br><b>💡 Teacher Cat 秘訣：</b><br>我們通常用公里來量度較長的距離，例如汽車行駛的距離、香港到日本的距離等。" },
            { id: 3, title: "第三關 - 毫米", tutorial: "<b>認識毫米 (mm)：</b><br>1 厘米 (cm) = 10 毫米 (mm)。<br><br><b>💡 Teacher Cat 秘訣：</b><br>毫米用來量度很微小的物件，例如硬幣的厚度、螞蟻的長度。" },
            { id: 4, title: "第四關 - 合適的長度單位", tutorial: "<b>選擇合適的單位：</b><br>毫米(mm)極短，厘米(cm)量書本，米(m)量操場，公里(km)量車程。<br><br><b>💡 Teacher Cat 秘訣：</b><br>把單位代入生活，一本字典厚約 50mm，不是 50cm 哦！" },
            { id: 5, title: "第五關 - 乘法(一)", tutorial: "<b>兩位數乘一位數：</b><br>例如：15 × 4 = 60。<br><br><b>💡 Teacher Cat 秘訣：</b><br>記得乘法可以交換相乘，結果是一樣的 (24 × 5 = 5 × 24)。" },
            { id: 6, title: "第六關 - 乘法(二)", tutorial: "<b>三位數乘一位數：</b><br>例如：125 × 4 = 500。<br><br><b>💡 Teacher Cat 秘訣：</b><br>計算時要小心進位！如果估算，可以把 386 看成 400 來快算。" },
            { id: 7, title: "第七關 - 乘法應用題", tutorial: "<b>解應用題技巧：</b><br>找出「每份有多少」和「共有多少份」。<br><br><b>💡 Teacher Cat 秘訣：</b><br>例如每盒有6件蛋糕，買4盒共有：6 × 4 = 24件。" },
            { id: 8, title: "第八關 - 時間應用題", tutorial: "<b>計算時間間隔：</b><br>結束時間 - 開始時間 = 所用時間。<br><br><b>💡 Teacher Cat 秘訣：</b><br>如果經過了正午 12 點，要特別小心上午和下午的轉換喔！" },
            { id: 9, title: "第九關 - 秒", tutorial: "<b>認識秒 (s)：</b><br>1 分鐘 = 60 秒 (s)。<br><br><b>💡 Teacher Cat 秘訣：</b><br>秒針走一小格就是1秒，走一圈就是60秒（即1分鐘）。" },
            { id: 10, title: "第十關 - 除法(一)", tutorial: "<b>兩位數除以一位數：</b><br>例如：64 ÷ 2 = 32。<br><br><b>💡 Teacher Cat 秘訣：</b><br>如果有餘數，餘數必定要比「除數」小！" },
            { id: 11, title: "第十一關 - 除法(二)", tutorial: "<b>三位數除以一位數：</b><br>例如：418 ÷ 4。<br><br><b>💡 Teacher Cat 秘訣：</b><br>要注意不夠除時，要在商的該位置補「0」。" },
            { id: 12, title: "第十二關 - 除法應用題", tutorial: "<b>餘數的處理：</b><br>把東西平均分配就要用除法。<br><br><b>💡 Teacher Cat 秘訣：</b><br>如果問「最少要多少個盒子」，記得餘下的東西也要多加一個盒子喔！" },
            { id: 13, title: "第十三關 - 比較重量", tutorial: "<b>天平的使用：</b><br>天平向下沉的一邊代表比較「重」，升起的一邊代表比較「輕」。<br><br><b>💡 Teacher Cat 秘訣：</b><br>如果天平平衡，代表兩邊的物件一樣重！" },
            { id: 14, title: "第十四關 - 克和公斤", tutorial: "<b>認識重量單位：</b><br>1 公斤 (kg) = 1000 克 (g)。<br><br><b>💡 Teacher Cat 秘訣：</b><br>較輕的物件用「克」(例如：餅乾)，較重的物件用「公斤」(例如：西瓜、體重)。" },
            { id: 15, title: "第十五關 - 平行線", tutorial: "<b>認識平行線：</b><br>兩條直線如果永遠保持相同的距離，無論畫多長都不會相交，它們就是「平行線」。<br><br><b>💡 Teacher Cat 秘訣：</b><br>就像火車路軌一樣，永遠平排！" },
            { id: 16, title: "第十六關 - 平行四邊形", tutorial: "<b>平行四邊形的特性：</b><br>它有「兩組」對邊分別互相平行，而且對邊的長度相等。<br><br><b>💡 Teacher Cat 秘訣：</b><br>長方形和正方形都是平行四邊形的一種喔！" },
            { id: 17, title: "第十七關 - 梯形", tutorial: "<b>梯形的特性：</b><br>梯形「只有一組」對邊互相平行。這組平行的邊叫做上底和下底。<br><br><b>💡 Teacher Cat 秘訣：</b><br>只要有兩組平行邊，它就變成平行四邊形，而不是梯形了。" },
            { id: 18, title: "第十八關 - 24小時制", tutorial: "<b>報時制轉換：</b><br>把一天的時間由 0 時至 24 時表示。<br><br><b>💡 Teacher Cat 秘訣：</b><br>下午的時間，只要把 12 小時制的時數加上 12 就可以了！（例如下午1時 = 13:00）" }
        ];

        let currentLevel = null;

        let currentQIndex = 0;

        let progressScores = JSON.parse(localStorage.getItem('teacherCatScores')) || {};

        const btnColors = [
            "linear-gradient(to bottom, #ff9a9e 0%, #fecfef 100%)",

        ];

        function initHome() {
            const container = document.getElementById("level-container");
            container.innerHTML = "";
            
            levelsData.forEach((level, index) => {
                let btn = document.createElement("button");
                btn.className = "level-btn";
                btn.style.background = btnColors[index % btnColors.length];
                btn.style.color = "#333";
                
                let maxScore = progressScores[level.id] || 0;
                let starHTML = "";
                if (maxScore === 20) {
                    starHTML = `<div style="font-size: 1.8em; margin: 5px 0; text-shadow: 0 0 10px #FFEB3B;">🌟大星星🌟</div>`;
                } else if (maxScore >= 10) {
                    starHTML = `<div style="font-size: 1.3em; margin: 5px 0;">⭐小星星⭐</div>`;
                } else {
                    starHTML = `<div style="font-size: 1.1em; margin: 5px 0; color:#999;">☆☆☆</div>`;
                }
                
                let scoreHTML = `<div style="font-size: 0.9em; background: rgba(255,255,255,0.7); border-radius: 10px; padding: 5px; margin-top: auto;">最高分數: <b>${maxScore}</b> / 20</div>`;
                
                // 顯示「第一關 - 五位數」這類的名稱
                btn.innerHTML = `<span style="font-size:1.1em;">${level.title}</span>${starHTML}${scoreHTML}`;
                btn.onclick = () => playLevel(level.id);
                container.appendChild(btn);
            });
        }

        function clearRecords() {
            if (confirm("🚨 Teacher Cat 提提你：確定要清除所有辛苦獲得的星星與分數記錄嗎？")) {
                localStorage.removeItem('teacherCatScores');
                progressScores = {};
                initHome();
                alert("記錄已清除！重新開始挑戰吧！");
            }
        }

        function playLevel(levelId) {
            currentLevel = levelsData.find(l => l.id === levelId);
            document.getElementById("home-screen").classList.add("hidden");
            document.getElementById("summary-screen").classList.add("hidden");
            
            document.getElementById("intro-title").innerText = `【 ${currentLevel.title} 】 準備出發！`;
            document.getElementById("intro-content").innerHTML = currentLevel.tutorial;
            document.getElementById("intro-screen").classList.remove("hidden");
            // 已移除 playIntroSound(); 的自動播放，小朋友需要手動點擊按鈕才會朗讀
        }

        function playIntroSound() {
            let text = currentLevel.tutorial.replace(/<[^>]*>?/gm, ''); 
            playText("學習重點： " + text);
        }

        function startActualGame() {
            let questions = questionBank[currentLevel.id] || [];
            
            // 防呆機制：如果該關卡題庫為空，生成測試題
            if (questions.length === 0) {
                for(let i=0; i<40; i++) questions.push({ q: `開發中測試題目 ${i+1}`, options: ["A", "B", "C", "D"], ans: 0 });
            }

            let half = Math.floor(questions.length / 2);
            let easyPool = shuffle(questions.slice(0, half)).slice(0, 10);
            let hardPool = shuffle(questions.slice(half)).slice(0, 10);
            selectedQuestions = easyPool.concat(hardPool);
            
            userAnswers = new Array(20).fill(-1);
            currentQIndex = 0;
            isRetryMode = false;
            
            document.getElementById("intro-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            
            showQuestion();
        }

        function showQuestion() {
            document.getElementById("hint-box").classList.add("hidden");
            document.getElementById("skip-btn").classList.add("hidden"); 
            
            let qData = selectedQuestions[currentQIndex];
            
            if (isRetryMode) {
                document.getElementById("progress-text").innerText = `🔧 重做模式 (原第 ${currentQIndex + 1} 題)`;
                document.getElementById("btn-prev").classList.add("hidden");
                document.getElementById("btn-next").classList.add("hidden");
            } else {
                document.getElementById("progress-text").innerText = `📝 題目: ${currentQIndex + 1} / ${selectedQuestions.length}`;
                document.getElementById("btn-prev").classList.toggle("hidden", currentQIndex === 0);
                document.getElementById("btn-next").innerText = currentQIndex === selectedQuestions.length - 1 ? "完成並看成績 ➡️" : "下一頁 ➡️";
                document.getElementById("btn-prev").classList.remove("hidden");
                document.getElementById("btn-next").classList.remove("hidden");
            }
            
            document.getElementById("question-text").innerText = qData.q;
            let optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";
            
            qData.options.forEach((opt, index) => {
                let wrapper = document.createElement("div");
                wrapper.className = "option-wrapper";
                
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                
                if (!isRetryMode && userAnswers[currentQIndex] !== -1) {
                    if (userAnswers[currentQIndex] === index) {
                        btn.style.backgroundColor = userAnswers[currentQIndex] === qData.ans ? "#4CAF50" : "#F44336";
                    }
                }

                btn.onclick = () => selectAnswer(index, qData.ans, btn);
                
                let soundBtn = document.createElement("button");
                soundBtn.className = "opt-sound-btn";
                soundBtn.innerText = "🔊";
                soundBtn.onclick = (e) => { e.stopPropagation(); playText(opt); };
                
                wrapper.appendChild(btn);
                wrapper.appendChild(soundBtn);
                optionsContainer.appendChild(wrapper);
            });
        }

        function selectAnswer(selectedIndex, correctIndex, btnElement) {
            
            // 已經答對過的不再處理
            if (userAnswers[currentQIndex] === correctIndex && !isRetryMode) return;

            userAnswers[currentQIndex] = selectedIndex; 
            
            if (selectedIndex === correctIndex) {
                btnElement.style.backgroundColor = "#4CAF50";
                playCorrectEffect();
                document.getElementById("skip-btn").classList.add("hidden"); 

                if (isRetryMode) {
                    setTimeout(() => {
                        alert("✅ 太棒了！答對啦！分數已經即時更新！");
                        showSummary(); 
                    }, 1500);
                } else {
                    setTimeout(goNext, 1500);
                }
            } else {
                btnElement.style.backgroundColor = "#F44336";
                playWrongEffect();
                showHint(); 
                if (!isRetryMode) {
                    document.getElementById("skip-btn").classList.remove("hidden");
                }
            }
        }

        function goNext() {
            if (currentQIndex < selectedQuestions.length - 1) {
                currentQIndex++;
                showQuestion();
            } else {
                // 不再阻擋未作答，直接進入結算
                showSummary();
            }
        }

        function goPrev() {
            if (currentQIndex > 0) {
                currentQIndex--;
                showQuestion();
            }
        }

        function showSummary() {
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("summary-screen").classList.remove("hidden");
            isRetryMode = false;
            
            let correctCount = 0;
            let listHTML = "";
            
            userAnswers.forEach((ans, i) => {
                let isCorrect = (ans === selectedQuestions[i].ans);
                if (isCorrect) correctCount++;
                
                let icon = "";
                let itemClass = "";
                let actionBtn = "";

                if (ans === -1) {
                    icon = "⏭️ 未作答";
                    itemClass = "summary-item skipped";
                    actionBtn = `<button class="retry-btn" style="background:#FF9800; box-shadow:0 4px 0 #E65100;" onclick="retryQuestion(${i})">👆 點我補答加分</button>`;
                } else if (isCorrect) {
                    icon = "✅ 答對";
                    itemClass = "summary-item correct";
                } else {
                    icon = "❌ 答錯";
                    itemClass = "summary-item wrong";
                    actionBtn = `<button class="retry-btn" onclick="retryQuestion(${i})">🔄 重新做這題加分</button>`;
                }
                
                listHTML += `
                    <div class="${itemClass}">
                        <span>第 ${i+1} 題： ${icon}</span>
                        ${actionBtn}
                    </div>
                `;
            });
            
            document.getElementById("summary-list").innerHTML = listHTML;
            document.getElementById("score-text").innerText = `🎯 總成績： ${correctCount} / 20`;
            
            let oldMax = progressScores[currentLevel.id] || 0;
            if (correctCount > oldMax) {
                progressScores[currentLevel.id] = correctCount;
                localStorage.setItem('teacherCatScores', JSON.stringify(progressScores));
            }
        }

        function retryQuestion(index) {
            currentQIndex = index;
            isRetryMode = true;
            document.getElementById("summary-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            showQuestion();
            showHint(); 
        }

        function showHint() {
            document.getElementById("hint-box").classList.remove("hidden");
            document.getElementById("hint-text").innerHTML = `<b>【溫故知新】</b><br>${currentLevel.tutorial}<br><br><span style="color:#D32F2F;"><i>再仔細諗諗啦！Teacher Cat 相信你可以做到的！</i></span>`;
        }
        
        function playHintSound() {
            let text = currentLevel.tutorial.replace(/<[^>]*>?/gm, '');
            playText("Teacher Cat 提示： " + text + "。再仔細諗諗啦！");
        }

        function playCorrectEffect() {
            document.body.classList.add('shake-effect');
            let confetti = document.getElementById('confetti');
            confetti.innerText = ["🎉", "✨", "💯", "🚀", "😻"][Math.floor(Math.random()*5)];
            confetti.classList.remove('hidden');
            
            let u = new SpeechSynthesisUtterance(["太棒了！", "答啱啦！", "好叻呀！", "完美！"][Math.floor(Math.random()*4)]);
            u.lang = 'zh-HK'; u.rate = 1.2; u.pitch = 1.6;
            speechSynthesis.speak(u);
            
            setTimeout(() => {
                document.body.classList.remove('shake-effect');
                confetti.classList.add('hidden');
            }, 1000);
        }

        function playWrongEffect() {
            document.body.classList.add('shake-effect');
            let u = new SpeechSynthesisUtterance("哎呀，差少少！");
            u.lang = 'zh-HK'; u.pitch = 0.8;
            speechSynthesis.speak(u);
            setTimeout(() => document.body.classList.remove('shake-effect'), 500);
        }

        function playText(text) {
            speechSynthesis.cancel(); 
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.9; 
            speechSynthesis.speak(utterance);
        }

        function showHome() {
            document.getElementById("intro-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("summary-screen").classList.add("hidden");
            document.getElementById("home-screen").classList.remove("hidden");
            speechSynthesis.cancel();
            initHome(); 
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        window.onload = initHome;
    </script>
</body>
</html>
