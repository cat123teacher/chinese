    <style>
        /* 讓頁面內容自然垂下，不遮擋畫面的底部 */
        body { font-family: 'Comic Sans MS', '微軟正黑體', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); text-align: center; margin: 0; padding: 20px 0 0 0; color: #333; display: flex; flex-direction: column; min-height: 100vh; }

        #app { max-width: 950px; width: 90%; margin: 20px auto 40px; background: #ffffff; border-radius: 30px; padding: 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); min-height: 550px; border: 5px solid #fff; position: relative; flex: 1; }

        .btn { background-color: #1dd1a1; border: none; color: white; padding: 15px 25px; text-align: center; font-size: 22px; font-weight: bold; border-radius: 50px; cursor: pointer; margin: 10px; box-shadow: 0 6px 0 #10ac84; transition: all 0.2s ease; }
        .btn:active { transform: translateY(6px); box-shadow: none; }
        
        /* 養成系統 UI */
        .pet-container { background: #fff3e0; border: 4px dashed #ff9ff3; border-radius: 20px; padding: 20px; margin: 15px auto 25px; max-width: 650px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; gap: 10px; }

        @keyframes floatPet { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .pet-text { font-size: 24px; color: #d35400; font-weight: bold; margin: 0; line-height: 1.4; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }

        /* 關卡選單與星星 */
        .level-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .level-btn { font-size: 22px; padding: 15px; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); line-height: 1.4; display: flex; flex-direction: column; align-items: center; justify-content: center;}
        .level-btn:nth-child(4n+1) { background-color: #ff9f43; box-shadow: 0 6px 0 #ee5253; }
        .level-btn:nth-child(4n+2) { background-color: #54a0ff; box-shadow: 0 6px 0 #2e86de; }
        .level-btn:nth-child(4n+3) { background-color: #10ac84; box-shadow: 0 6px 0 #01a3a4; }
        .level-btn:nth-child(4n+4) { background-color: #feca57; box-shadow: 0 6px 0 #ff9f43; }
        
        .clear-record-btn { background-color: #747d8c; font-size: 18px; margin-top: 30px; box-shadow: 0 5px 0 #576574; }
        .return-main-btn { background-color: #9b59b6; box-shadow: 0 6px 0 #8e44ad; font-size: 20px; margin-top: 15px; }
        
        .hidden { display: none !important; }
        
        /* 調整了教學外框樣式 */
        .tutorial-box { background-color: #fff9c4; border: 5px dashed #ff9f43; border-radius: 20px; padding: 25px; font-size: 24px; text-align: left; line-height: 1.8; margin-bottom: 25px; }
        .example-text { color: #2e86de; font-weight: bold; font-size: 26px;}
        #question-text { font-size: 32px; font-weight: bold; margin: 25px 0; color: #341f97; line-height: 1.5; }
        
        /* 選項與語音按鈕排版 */
        .option-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 15px 0; width: 100%; }
        .option-btn { background-color: #48dbfb; color: #222; display: block; width: 75%; margin: 0 !important; font-size: 26px; box-shadow: 0 6px 0 #0abde3; }
        .audio-btn { background-color: #ff9ff3; border-radius: 50%; width: 70px; height: 70px; font-size: 35px; padding: 0; box-shadow: 0 6px 0 #f368e0; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .audio-btn-small { width: 55px; height: 55px; font-size: 26px; }

        #progress { font-size: 22px; color: #576574; font-weight: bold; margin-bottom: 10px; }
        #difficulty-badge { display: inline-block; color: white; padding: 8px 20px; border-radius: 30px; font-size: 18px; font-weight: bold; margin-bottom: 15px; }

        /* 導航按鈕區 */
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; border-top: 3px dashed #ddd; padding-top: 20px; }
        .nav-btn { background-color: #a4b0be; font-size: 18px; padding: 10px 20px; box-shadow: 0 5px 0 #747d8c; }
        .home-btn { background-color: #ff7f50; box-shadow: 0 5px 0 #ff6348; }

        /* 動畫特效區 */
        #correct-effect { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 120px; opacity: 0; pointer-events: none; z-index: 2000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-shadow: 0 0 30px #fff; }
        #correct-effect.show { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }

        /* 總結區 */
        .summary-list { text-align: left; max-height: 400px; overflow-y: auto; background: #f1f2f6; border-radius: 15px; padding: 20px; margin-bottom: 20px; font-size: 20px;}
        .summary-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 2px solid #ddd; }
        .summary-item:last-child { border-bottom: none; }
        .retry-btn { background-color: #ff4757; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 4px 0 #ff6b81; }
        .retry-btn:active { transform: translateY(4px); box-shadow: none; }

        /* 文法提示框 (Modal) */
        #hint-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 3000; display: flex; justify-content: center; align-items: center; }
        .hint-content { background: #fff9c4; border: 6px dashed #ff9f43; border-radius: 25px; padding: 35px; max-width: 85%; width: 550px; text-align: left; box-shadow: 0 15px 35px rgba(0,0,0,0.3); animation: popIn 0.3s ease-out; position: relative;}
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .hint-content h2 { color: #eb3b5a; margin-top: 0; text-align: center; font-size: 32px; text-shadow: 1px 1px #fff; display: flex; justify-content: center; align-items: center; gap: 15px;}
        .hint-text-box { font-size: 24px; color: #2d3436; line-height: 1.6; margin: 20px 0; background: rgba(255,255,255,0.6); padding: 15px; border-radius: 15px; white-space: pre-line; }

        /* 底部社群連結 (非 Fixed，自然排在頁面最底部) */
        .footer { width: 100%; background: #2f3542; color: white; padding: 20px 0; font-size: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); margin-top: auto; }
        .footer p { margin: 0; font-weight: bold; font-size: 20px; color: #ffa502; }
        .social-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 0 10px; }
        .social-links a, .social-links span { color: #7bed9f; text-decoration: none; font-weight: bold; }
        .social-links a:hover { color: #ff7f50; text-decoration: underline; }
    </style>
</head>

            <div id="question-text">題目載入中...</div>
        </div>
        
        <!-- 選項按鈕區 -->
        <div id="options-container" style="margin-top: 20px;"></div>
        
        <!-- 答錯時顯示的 Move to next question 容器 -->
        <div id="next-question-container" class="hidden" style="margin-top: 25px; text-align: center;">

        </div>
        
        <!-- 常駐導航按鈕區 -->
        <div class="nav-buttons" id="standard-nav">

    // --- 音效合成系統 ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    }
    
    function playSuccessSound() {
        initAudio(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.start(now);
        gain.gain.setValueAtTime(1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.stop(now + 0.5);
    }
    
    function playWrongSound() {
        initAudio(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(200, now + 0.3);
        osc.start(now);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.stop(now + 0.3);
    }

    // --- 星星進度系統 ---
    function loadProgress() {
        let data = localStorage.getItem('teacherCatProgress');
        return data ? JSON.parse(data) : {};
    }
    function saveProgress(level, score) {
        let data = loadProgress();
        if (!data[level] || score > data[level]) {
            data[level] = score;
            localStorage.setItem('teacherCatProgress', JSON.stringify(data));
        }
    }
    function clearProgress() {
        if(confirm("確定要清除所有的星星記錄嗎？這會重新開始喔！")) {
            localStorage.removeItem('teacherCatProgress');
            renderHome();
        }
    }

    function updatePetEvolution() {
        let progress = loadProgress();
        let completedCount = 0;
        
        for (let i = 1; i <= 12; i++) {
            if (progress[i] && progress[i] >= 10) completedCount++;
        }
        
        if (completedCount > 12) completedCount = 12;
        
        let petImg = document.getElementById('pet-img');
        let petText = document.getElementById('pet-text');
        
        petImg.src = petStages[completedCount].img;
        petText.innerText = petStages[completedCount].text;
    }

    // --- 遊戲邏輯 ---
    let currentLevel = 1;
    let questionList = [];
    let currentQIndex = 0;
    let isRetryMode = false;
    let hasSavedScoreForThisRun = false; 

    // 初始化首頁與星星渲染
    function renderHome() {
        const container = document.getElementById('level-container');
        container.innerHTML = '';
        let progress = loadProgress();

        for (let i = 1; i <= 12; i++) {
            let btn = document.createElement('button');
            btn.className = 'btn level-btn';
            
            let score = progress[i] || 0;
            let starHtml = '';
            if (score === 20) {
                starHtml = '<span style="font-size: 32px; text-shadow: 0 0 10px #f1c40f; margin-top: 5px;">🌟滿分🌟</span>'; 
            } else if (score >= 10) {
                starHtml = '<span style="font-size: 20px; text-shadow: 0 0 5px #f1c40f; margin-top: 5px;">⭐過關</span>'; 
            } else {
                starHtml = '<span style="font-size: 20px; opacity: 0.3; margin-top: 5px;">⭐未完成</span>';
            }
            
            let scoreText = `<div style="font-size: 16px; margin-top: 10px; color: #fff; background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 12px; display: inline-block;">最高分數: ${score} / 20</div>`;

            btn.innerHTML = levelData[i].title + "<br>" + starHtml + scoreText;
            btn.onclick = () => { initAudio(); initLevel(i); };
            container.appendChild(btn);
        }

        updatePetEvolution();
    }
    
    renderHome();

    function showScreen(id) {
        document.querySelectorAll('#app > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function getRandomQuestions(arr, num) {
        let shuffled = [...arr].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, num); 
    }

    function initLevel(level) {
        currentLevel = level;
        const data = levelData[level];
        
        // 渲染標題與重點文字
        document.getElementById('tut-title').innerText = data.title;
        document.getElementById('tut-desc').innerText = data.desc;
        
        // 綁定「學習重點」的專屬發音按鈕
        document.getElementById('tut-desc-audio').onclick = () => playTTS(data.desc);

        // 動態生成「每個例子」與它們專屬的小發音按鈕
        const exampleContainer = document.getElementById('tut-example-container');
        exampleContainer.innerHTML = '';
        
        let examples = data.example.split('\n');
        examples.forEach(ex => {
            if (ex.trim() === '') return;
            
            let row = document.createElement('div');
            row.style.display = 'flex';
            row.style.alignItems = 'center';
            row.style.gap = '15px';
            
            let audioBtn = document.createElement('button');
            audioBtn.className = 'btn audio-btn audio-btn-small';
            audioBtn.style.margin = '0';
            audioBtn.style.flexShrink = '0';
            audioBtn.innerText = '🔊';
            audioBtn.onclick = () => playTTS(ex);
            
            let textSpan = document.createElement('span');
            textSpan.innerText = ex;
            textSpan.style.fontSize = '24px';
            textSpan.style.color = '#2d3436';
            
            row.appendChild(audioBtn);
            row.appendChild(textSpan);
            exampleContainer.appendChild(row);
        });

        showScreen('tutorial-screen');
    }

    function startGame() {
        isRetryMode = false;
        hasSavedScoreForThisRun = false;
        currentQIndex = 0;
        const data = levelData[currentLevel];
        
        let easyQs = getRandomQuestions(data.easy, 10);
        easyQs.forEach(q => { q.isHard = false; q.userAns = null; }); 
        
        let hardQs = getRandomQuestions(data.hard, 10);
        hardQs.forEach(q => { q.isHard = true; q.userAns = null; });

        questionList = [...easyQs, ...hardQs];
        
        document.getElementById('standard-nav').classList.remove('hidden');
        document.getElementById('retry-nav').classList.add('hidden');
        
        showScreen('game-screen');
        renderQuestion();
    }

    function renderQuestion() {
        document.getElementById('next-question-container').classList.add('hidden');
        const qData = questionList[currentQIndex];
        
        document.getElementById('progress').innerText = `第 ${currentQIndex + 1} / 20 題`;
        const badge = document.getElementById('difficulty-badge');
        if(qData.isHard) {
            badge.innerText = "🔥 難度：深 (進階重組)";
            badge.style.background = "#eb3b5a";
        } else {
            badge.innerText = "⭐ 難度：淺 (基礎練習)";
            badge.style.background = "#20bf6b";
        }

        document.getElementById('question-text').innerText = qData.q;
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        
        qData.o.forEach((optText, index) => {
            let row = document.createElement('div');
            row.className = 'option-container';

            let optAudio = document.createElement('button');
            optAudio.className = 'btn audio-btn audio-btn-small';
            optAudio.innerText = '🔊';
            optAudio.onclick = () => playTTS(optText);

            let btn = document.createElement('button');
            btn.className = 'btn option-btn';
            btn.innerText = optText;
            
            if (qData.userAns !== null && !isRetryMode) {
                btn.disabled = true;
                if(index === qData.a) {
                    btn.style.backgroundColor = "#2ed573";
                } else if(index === qData.userAns && qData.userAns !== qData.a) {
                    btn.style.backgroundColor = "#ff4757";
                }
            } else {
                if (isRetryMode && btn.dataset.wrong === "true") {
                    btn.disabled = true;
                    btn.style.backgroundColor = "#ff4757";
                } else {
                    btn.onclick = () => checkAnswer(index, qData.a, btn);
                }
            }
            row.appendChild(optAudio);
            row.appendChild(btn);
            optsContainer.appendChild(row);
        });
    }

    // 檢查答案邏輯
    function checkAnswer(selectedIndex, correctIndex, btnElement) {
        const qData = questionList[currentQIndex];
        
        if (!isRetryMode) {
            // --- 正常模式 ---
            qData.userAns = selectedIndex; 
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (selectedIndex === correctIndex) {
                playSuccessSound();
                showCorrectEffect();
                playTTS("答對了！好棒！");
                btnElement.style.backgroundColor = "#2ed573";
                setTimeout(proceedNext, 2000); 
            } else {
                playWrongSound();
                playTTS("哎呀，答錯了，看看提示吧！");
                btnElement.style.backgroundColor = "#ff4757";
                buttons[correctIndex].style.backgroundColor = "#2ed573";
                
                let nextBtn = document.getElementById('skip-btn');
                if (currentQIndex === questionList.length - 1) {
                    nextBtn.innerText = "完成，查看成績 ➡️";
                } else {
                    nextBtn.innerText = "Move to next question ➡️";
                }
                
                document.getElementById('next-question-container').classList.remove('hidden');
                setTimeout(() => { showHintModal(false); }, 1500); 
            }
        } else {
            // --- 重做模式 (一直答到對為止) ---
            if (selectedIndex === correctIndex) {
                qData.userAns = selectedIndex; 
                playSuccessSound();
                showCorrectEffect();
                playTTS("答對了！好棒！");
                btnElement.style.backgroundColor = "#2ed573";
                
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(b => b.disabled = true);
                
                setTimeout(() => { showResultScreen(); }, 2000); 
            } else {
                playWrongSound();
                playTTS("哎呀，還是錯了，再試一次吧！");
                btnElement.style.backgroundColor = "#ff4757";
                btnElement.disabled = true; 
                btnElement.dataset.wrong = "true"; 
            }
        }
    }
    
    function forceNextQuestion() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        document.getElementById('next-question-container').classList.add('hidden');
        proceedNext();
    }

    function proceedNext() {
        if (currentQIndex < questionList.length - 1) {
            currentQIndex++;
            renderQuestion();
        } else {
            showResultScreen();
        }
    }

    function showHintModal(autoPlay = false) {
        const data = levelData[currentLevel];
        document.getElementById('hint-text').innerText = data.desc;
        document.getElementById('hint-example').innerText = data.example;
        document.getElementById('hint-modal').classList.remove('hidden');
        if (autoPlay) {
            playTTS("請看看提示，然後再選一次吧！" + data.desc + "例子：" + data.example);
        }
    }

    function closeHintModal() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        document.getElementById('hint-modal').classList.add('hidden');
    }

    function playHintAudio() {
        const data = levelData[currentLevel];
        playTTS(data.desc + "。 例子：" + data.example);
    }

    function showCorrectEffect() {
        const effect = document.getElementById('correct-effect');
        effect.classList.add('show');
        setTimeout(() => { effect.classList.remove('show'); }, 1500);
    }

    function prevQuestion() {
        if(currentQIndex > 0) { currentQIndex--; renderQuestion(); }
    }
    function nextQuestion() {
        if(currentQIndex < questionList.length - 1) { currentQIndex++; renderQuestion(); }
        else { showResultScreen(); } 
    }
    function confirmGoHome() {
        if(confirm("確定要回到主頁嗎？目前的進度會消失喔！")) { renderHome(); showScreen('home-screen'); }
    }

    // --- 完整補回的成績與結算系統 ---
    function showResultScreen() {
        let currentScore = 0;
        let html = '';
        
        questionList.forEach((q, idx) => {
            let isCorrect = q.userAns === q.a;
            if(isCorrect) currentScore++;
            
            let statusIcon = isCorrect ? '✅ 答對' : (q.userAns === null ? '⬜ 未答' : '❌ 答錯');
            let color = isCorrect ? '#2ed573' : (q.userAns === null ? '#a4b0be' : '#ff4757');
            let btnHtml = (!isCorrect) ? `<button class="retry-btn" onclick="retryQuestion(${idx})">重新挑戰</button>` : '';
            
            html += `<div class="summary-item">
                        <div style="flex: 1; padding-right: 15px;">
                            <strong>第 ${idx+1} 題：</strong> ${q.q}<br>
                            <span style="color: ${color}; font-size: 16px;">${statusIcon}</span>
                        </div>
                        <div>${btnHtml}</div>
                     </div>`;
        });

        if (!hasSavedScoreForThisRun && !isRetryMode) {
            saveProgress(currentLevel, currentScore);
            hasSavedScoreForThisRun = true;
        }

        document.getElementById('score').innerText = currentScore;
        document.getElementById('summary-container').innerHTML = html;
        
        let rewardDisplay = document.getElementById('star-reward-display');
        if (currentScore === 20) {
            rewardDisplay.innerHTML = '🌟 恭喜獲得大星星！ 🌟';
        } else if (currentScore >= 10) {
            rewardDisplay.innerHTML = '⭐ 獲得小星星！ ⭐';
        } else {
            rewardDisplay.innerHTML = '還要再加油喔！💪';
        }

        showScreen('result-screen');
        if(!isRetryMode && currentScore === 20) { playTTS(`太厲害了！滿分，獲得大星星！`); }
        else if (!isRetryMode && currentScore >= 10) { playTTS(`恭喜過關！獲得小星星，得分是 ${currentScore} 分`); }
        else if (!isRetryMode) { playTTS(`繼續加油，得分是 ${currentScore} 分`); }
    }

    // 重做錯題 (一直答到對為止)
    function retryQuestion(idx) {
        isRetryMode = true;
        currentQIndex = idx;
        questionList[idx].userAns = null; 
        
        document.getElementById('standard-nav').classList.add('hidden');
        document.getElementById('retry-nav').classList.remove('hidden');
        
        showScreen('game-screen');
        renderQuestion();
        
        showHintModal(true); 
    }

    // 發音 API
    function playTTS(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            let cleanText = text.replace(/_+/g, "甚麼"); 
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'zh-HK'; 
            utterance.rate = 0.9; 
            window.speechSynthesis.speak(utterance);
        }
    }

    function playCurrentQuestion() {
        if(questionList[currentQIndex]) {
            let qData = questionList[currentQIndex];
            playTTS("題目是：" + qData.q);
        }
    }
</script>
