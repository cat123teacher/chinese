<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>錦鯉池 3D · 互動禪意水池</title>
  <style>
    :root {
      --glass-bg: rgba(10, 26, 30, 0.62);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-active: rgba(114, 198, 232, 0.28);
      --accent: #7fd4f5;
      --accent-warm: #f6b36b;
      --text-main: #f3f9fb;
      --text-muted: rgba(235, 246, 249, 0.72);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07191d;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text-main);
      touch-action: none;
    }

    #pond-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      touch-action: none;
      cursor: pointer;
    }

    /* 頂部資訊列 */
    .hud-top {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff8a65, #e53935);
      box-shadow: 0 0 10px rgba(255, 110, 80, 0.8);
    }

    .stats-sep {
      color: rgba(255, 255, 255, 0.35);
      margin: 0 1px;
    }

    .stats-text {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 12px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      transition: transform 0.14s ease, background 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* 提示氣泡 */
    #toast {
      position: fixed;
      top: calc(max(12px, env(safe-area-inset-top)) + 52px);
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      padding: 7px 15px;
      border-radius: 999px;
      background: rgba(12, 32, 38, 0.78);
      border: 1px solid rgba(127, 212, 245, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 12.5px;
      color: #e9f8ff;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 25;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 底部操作區 */
    .hud-bottom {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 20;
    }

    .sub-bar {
      pointer-events: auto;
      display: none;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 18px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.32);
      max-width: min(96vw, 430px);
    }

    .sub-bar.open {
      display: flex;
      animation: popIn 0.18s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .sub-btn {
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border-radius: 12px;
      padding: 7px 11px;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
    }

    .sub-btn:active {
      transform: scale(0.94);
    }

    .sub-btn.active {
      background: var(--glass-active);
      border-color: rgba(127, 212, 245, 0.72);
      color: #ffffff;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.55);
      flex-shrink: 0;
    }

    .dock {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      width: 100%;
      max-width: 430px;
      padding: 6px;
      border-radius: 22px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.36);
    }

    .dock-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      border-radius: 16px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease, border-color 0.18s ease;
    }

    .dock-btn .ico {
      font-size: 18px;
      line-height: 1.1;
    }

    .dock-btn:active {
      transform: scale(0.93);
    }

    .dock-btn.active {
      background: var(--glass-active);
      border-color: rgba(127, 212, 245, 0.65);
      color: #ffffff;
    }

    #fallback-msg {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #07191d;
      color: #e6f5f8;
      z-index: 100;
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="pond-canvas"></canvas>

  <!-- 頂部狀態與快速按鈕 -->
  <div class="hud-top">
    <div class="pill">
      <span class="brand-dot"></span>
      <span>錦鯉池</span>
      <span class="stats-sep">|</span>
      <span class="stats-text" id="stats-label">9 鯉 · 1 鯊</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-sound" title="音效開關" aria-label="音效開關">🔊</button>
      <button class="icon-btn" id="btn-reset" title="重置水池" aria-label="重置水池">↺</button>
    </div>
  </div>

  <!-- 互動提示 -->
  <div id="toast">滑動水面泛起漣漪</div>

  <!-- 底部模式列與子選單 -->
  <div class="hud-bottom">
    <div class="sub-bar" id="sub-fish">
      <button class="sub-btn active" data-fish="kohaku">
        <span class="swatch" style="background:linear-gradient(135deg,#fff 45%,#e83622 45%);"></span>紅白
      </button>
      <button class="sub-btn" data-fish="sanke">
        <span class="swatch" style="background:linear-gradient(135deg,#fff 32%,#e83622 32% 68%,#1d2024 68%);"></span>大正三色
      </button>
      <button class="sub-btn" data-fish="yamabuki">
        <span class="swatch" style="background:linear-gradient(135deg,#fff3a1,#f2ae1c);"></span>黃金
      </button>
      <button class="sub-btn" data-fish="shark">
        <span class="swatch" style="background:linear-gradient(135deg,#72bde4 55%,#ffffff 55%);"></span>胖鯊魚
      </button>
    </div>

    <div class="sub-bar" id="sub-decor">
      <button class="sub-btn active" data-decor="lotus">🌸 睡蓮</button>
      <button class="sub-btn" data-decor="pad">🍃 荷葉</button>
      <button class="sub-btn" data-decor="rock">🪨 苔石</button>
      <button class="sub-btn" data-decor="pebble">⚪ 卵石</button>
    </div>

    <div class="dock">
      <button class="dock-btn active" data-mode="ripple">
        <span class="ico">🌊</span><span>撥水</span>
      </button>
      <button class="dock-btn" data-mode="feed">
        <span class="ico">🌾</span><span>投餵</span>
      </button>
      <button class="dock-btn" data-mode="fish">
        <span class="ico">🐟</span><span>放魚</span>
      </button>
      <button class="dock-btn" data-mode="decor">
        <span class="ico">🪷</span><span>造景</span>
      </button>
      <button class="dock-btn" data-mode="remove">
        <span class="ico">✕</span><span>移除</span>
      </button>
    </div>
  </div>

  <div id="fallback-msg">
    您的裝置或瀏覽器目前不支援 WebGL，無法顯示 3D 錦鯉池。<br />請嘗試更新瀏覽器或開啟硬體加速。
  </div>

  <script>
    (function () {
      'use strict';

      /* =========================================================================
       * 1. 內嵌輕量 Three.js 風格 WebGL 3D 引擎（完全離線、零外部網路請求）
       * ========================================================================= */
      const Mat4 = {
        create() {
          const m = new Float32Array(16);
          m[0] = m[5] = m[10] = m[15] = 1;
          return m;
        },
        multiply(out, a, b) {
          const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
          const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
          const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
          const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];

          for (let i = 0; i < 4; i++) {
            const bi0 = b[i * 4], bi1 = b[i * 4 + 1], bi2 = b[i * 4 + 2], bi3 = b[i * 4 + 3];
            out[i * 4]     = a00 * bi0 + a10 * bi1 + a20 * bi2 + a30 * bi3;
            out[i * 4 + 1] = a01 * bi0 + a11 * bi1 + a21 * bi2 + a31 * bi3;
            out[i * 4 + 2] = a02 * bi0 + a12 * bi1 + a22 * bi2 + a32 * bi3;
            out[i * 4 + 3] = a03 * bi0 + a13 * bi1 + a23 * bi2 + a33 * bi3;
          }
          return out;
        },
        perspective(out, fovyRad, aspect, near, far) {
          const f = 1.0 / Math.tan(fovyRad * 0.5);
          const nf = 1.0 / (near - far);
          out.fill(0);
          out[0] = f / aspect;
          out[5] = f;
          out[10] = (far + near) * nf;
          out[11] = -1;
          out[14] = 2 * far * near * nf;
          return out;
        },
        lookAt(out, eye, center, up) {
          let zx = eye[0] - center[0];
          let zy = eye[1] - center[1];
          let zz = eye[2] - center[2];
          let len = Math.hypot(zx, zy, zz) || 1;
          zx /= len; zy /= len; zz /= len;

          let xx = up[1] * zz - up[2] * zy;
          let xy = up[2] * zx - up[0] * zz;
          let xz = up[0] * zy - up[1] * zx;
          len = Math.hypot(xx, xy, xz) || 1;
          xx /= len; xy /= len; xz /= len;

          const yx = zy * xz - zz * xy;
          const yy = zz * xx - zx * xz;
          const yz = zx * xy - zy * xx;

          out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
          out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
          out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
          out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
          out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
          out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
          out[15] = 1;
          return out;
        },
        // 順序：M = T * Ry * Rx * Rz * S
        fromTRS(out, pos, rot, scale) {
          const cx = Math.cos(rot.x), sx = Math.sin(rot.x);
          const cy = Math.cos(rot.y), sy = Math.sin(rot.y);
          const cz = Math.cos(rot.z), sz = Math.sin(rot.z);

          const r00 = cy * cz + sy * sx * sz;
          const r01 = -cy * sz + sy * sx * cz;
          const r02 = sy * cx;

          const r10 = cx * sz;
          const r11 = cx * cz;
          const r12 = -sx;

          const r20 = -sy * cz + cy * sx * sz;
          const r21 = sy * sz + cy * sx * cz;
          const r22 = cy * cx;

          out[0] = r00 * scale.x; out[1] = r10 * scale.x; out[2] = r20 * scale.x; out[3] = 0;
          out[4] = r01 * scale.y; out[5] = r11 * scale.y; out[6] = r21 * scale.y; out[7] = 0;
          out[8] = r02 * scale.z; out[9] = r12 * scale.z; out[10] = r22 * scale.z; out[11] = 0;
          out[12] = pos.x; out[13] = pos.y; out[14] = pos.z; out[15] = 1;
          return out;
        },
        // 正確計算 column-major 3x3 逆轉置矩陣 (M^-1)^T
        normalFromMat4(out, m) {
          const m00 = m[0], m10 = m[1], m20 = m[2];
          const m01 = m[4], m11 = m[5], m21 = m[6];
          const m02 = m[8], m12 = m[9], m22 = m[10];

          const c00 = m11 * m22 - m12 * m21;
          const c01 = -(m10 * m22 - m12 * m20);
          const c02 = m10 * m21 - m11 * m20;

          const c10 = -(m01 * m22 - m02 * m21);
          const c11 = m00 * m22 - m02 * m20;
          const c12 = -(m00 * m21 - m01 * m20);

          const c20 = m01 * m12 - m02 * m11;
          const c21 = -(m00 * m12 - m02 * m10);
          const c22 = m00 * m11 - m01 * m10;

          const det = m00 * c00 + m01 * c01 + m02 * c02;
          if (Math.abs(det) < 1e-8) {
            out[0] = 1; out[1] = 0; out[2] = 0;
            out[3] = 0; out[4] = 1; out[5] = 0;
            out[6] = 0; out[7] = 0; out[8] = 1;
            return out;
          }
          const invDet = 1.0 / det;
          out[0] = c00 * invDet; out[1] = c10 * invDet; out[2] = c20 * invDet;
          out[3] = c01 * invDet; out[4] = c11 * invDet; out[5] = c21 * invDet;
          out[6] = c02 * invDet; out[7] = c12 * invDet; out[8] = c22 * invDet;
          return out;
        },
        invert(out, a) {
          const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
          const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
          const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
          const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];

          const b00 = a00 * a11 - a01 * a10;
          const b01 = a00 * a12 - a02 * a10;
          const b02 = a00 * a13 - a03 * a10;
          const b03 = a01 * a12 - a02 * a11;
          const b04 = a01 * a13 - a03 * a11;
          const b05 = a02 * a13 - a03 * a12;
          const b06 = a20 * a31 - a21 * a30;
          const b07 = a20 * a32 - a22 * a30;
          const b08 = a20 * a33 - a23 * a30;
          const b09 = a21 * a32 - a22 * a31;
          const b10 = a21 * a33 - a23 * a31;
          const b11 = a22 * a33 - a23 * a32;

          let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
          if (!det) return null;
          det = 1.0 / det;

          out[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det;
          out[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
          out[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det;
          out[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
          out[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det;
          out[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
          out[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det;
          out[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
          out[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det;
          out[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
          out[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
          out[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
          out[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
          out[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
          out[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
          out[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
          return out;
        },
        transformPoint(m, x, y, z) {
          const w = m[3] * x + m[7] * y + m[11] * z + m[15] || 1;
          return [
            (m[0] * x + m[4] * y + m[8] * z + m[12]) / w,
            (m[1] * x + m[5] * y + m[9] * z + m[13]) / w,
            (m[2] * x + m[6] * y + m[10] * z + m[14]) / w
          ];
        }
      };

      const THREE = {
        FrontSide: 0,
        DoubleSide: 2,

        BufferGeometry: class BufferGeometry {
          constructor() {
            this.attributes = {};
            this.index = null;
            this._uploaded = false;
            this._glBuffers = {};
            this._glIndex = null;
            this._count = 0;
          }
          setAttribute(name, array, itemSize) {
            this.attributes[name] = { array: array instanceof Float32Array ? array : new Float32Array(array), itemSize };
            return this;
          }
          setIndex(array) {
            this.index = array instanceof Uint16Array ? array : new Uint16Array(array);
            return this;
          }
        },

        CanvasTexture: class CanvasTexture {
          constructor(canvas, opts = {}) {
            this.image = canvas;
            this.flipY = opts.flipY !== undefined ? opts.flipY : true;
            this.repeat = !!opts.repeat;
            this.needsUpdate = true;
            this._glTex = null;
            this.isTexture = true;
          }
        },

        DataTexture: class DataTexture {
          constructor(data, width, height) {
            this.data = data;
            this.width = width;
            this.height = height;
            this.needsUpdate = true;
            this._glTex = null;
            this.isTexture = true;
            this.isDataTexture = true;
          }
        },

        RenderTarget: class RenderTarget {
          constructor(width, height) {
            this.width = Math.max(2, width | 0);
            this.height = Math.max(2, height | 0);
            this.texture = { isTexture: true, _glTex: null };
            this._fbo = null;
            this._depthRb = null;
          }
          resize(gl, width, height) {
            width = Math.max(2, width | 0);
            height = Math.max(2, height | 0);
            if (this._fbo && this.width === width && this.height === height) return;
            this.width = width;
            this.height = height;
            if (!this._fbo) {
              this._fbo = gl.createFramebuffer();
              this.texture._glTex = gl.createTexture();
              this._depthRb = gl.createRenderbuffer();
            }
            gl.bindTexture(gl.TEXTURE_2D, this.texture._glTex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

            gl.bindRenderbuffer(gl.RENDERBUFFER, this._depthRb);
            gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, width, height);

            gl.bindFramebuffer(gl.FRAMEBUFFER, this._fbo);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.texture._glTex, 0);
            gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, this._depthRb);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          }
        },

        ShaderMaterial: class ShaderMaterial {
          constructor(params) {
            this.vertexShader = params.vertexShader;
            this.fragmentShader = params.fragmentShader;
            this.uniforms = params.uniforms || {};
            this.transparent = !!params.transparent;
            this.depthTest = params.depthTest !== undefined ? params.depthTest : true;

        Object3D: class Object3D {

            this.visible = true;
            this.renderOrder = 0;
            this._localMat = Mat4.create();
            this._worldMat = Mat4.create();
            this._normalMat = new Float32Array(9);
          }
          add(child) {
            this.children.push(child);

          }
          remove(child) {
            const idx = this.children.indexOf(child);
            if (idx >= 0) this.children.splice(idx, 1);

          }
          updateMatrixWorld(parentMat) {
            Mat4.fromTRS(this._localMat, this.position, this.rotation, this.scale);
            if (parentMat) Mat4.multiply(this._worldMat, parentMat, this._localMat);
            else this._worldMat.set(this._localMat);
            Mat4.normalFromMat4(this._normalMat, this._worldMat);
            for (let i = 0; i < this.children.length; i++) {

            this.scale = { x: 1, y: 1, z: 1 };

            this.renderOrder = 0;
            this.isMesh = true;
            this._localMat = Mat4.create();
            this._worldMat = Mat4.create();
            this._normalMat = new Float32Array(9);
          }
          add(child) {

          remove(child) {
            const idx = this.children.indexOf(child);
            if (idx >= 0) this.children.splice(idx, 1);
            return this;
          }

            Mat4.fromTRS(this._localMat, this.position, this.rotation, this.scale);
            if (parentMat) Mat4.multiply(this._worldMat, parentMat, this._localMat);
            else this._worldMat.set(this._localMat);

        PerspectiveCamera: class PerspectiveCamera {
          constructor(fov, aspect, near, far) {
            this.fov = fov;
            this.aspect = aspect;
            this.near = near;
            this.far = far;
            this.eye = [0, 13.5, 1.3];
            this.target = [0, 0, 0];
            this.up = [0, 0, -1];
            this.projectionMatrix = Mat4.create();
            this.viewMatrix = Mat4.create();
            this.viewProjMatrix = Mat4.create();
            this.invViewProjMatrix = Mat4.create();
            this.updateMatrices();
          }
          updateMatrices() {
            Mat4.perspective(this.projectionMatrix, (this.fov * Math.PI) / 180, this.aspect, this.near, this.far);
            Mat4.lookAt(this.viewMatrix, this.eye, this.target, this.up);
            Mat4.multiply(this.viewProjMatrix, this.projectionMatrix, this.viewMatrix);
            Mat4.invert(this.invViewProjMatrix, this.viewProjMatrix);
          }
          screenToWaterPlane(ndcX, ndcY) {
            const p0 = Mat4.transformPoint(this.invViewProjMatrix, ndcX, ndcY, -1);
            const p1 = Mat4.transformPoint(this.invViewProjMatrix, ndcX, ndcY, 1);
            const dy = p1[1] - p0[1];
            if (Math.abs(dy) < 1e-6) return { x: 0, z: 0 };
            const t = -p0[1] / dy;
            return { x: p0[0] + t * (p1[0] - p0[0]), z: p0[2] + t * (p1[2] - p0[2]) };
          }
        },

        WebGLRenderer: class WebGLRenderer {
          constructor(canvas) {
            this.canvas = canvas;
            const gl = canvas.getContext('webgl', {
              alpha: false,
              antialias: true,
              premultipliedAlpha: false,
              powerPreference: 'high-performance'
            }) || canvas.getContext('experimental-webgl');
            if (!gl) throw new Error('WebGL unavailable');
            this.gl = gl;
            this._programCache = new Map();
            this._drawList = [];
            gl.enable(gl.DEPTH_TEST);
            gl.depthFunc(gl.LEQUAL);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
          }

          setSize(cssW, cssH, dpr) {
            const w = Math.max(2, Math.floor(cssW * dpr));
            const h = Math.max(2, Math.floor(cssH * dpr));
            if (this.canvas.width !== w || this.canvas.height !== h) {
              this.canvas.width = w;
              this.canvas.height = h;
            }
          }

          _getProgram(vsSrc, fsSrc) {
            const key = vsSrc + '###' + fsSrc;
            let prog = this._programCache.get(key);
            if (prog) return prog;

            const gl = this.gl;
            const compile = (type, src) => {
              const s = gl.createShader(type);
              gl.shaderSource(s, src);
              gl.compileShader(s);
              if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                console.error('Shader compile error:', gl.getShaderInfoLog(s));
                return null;
              }
              return s;
            };
            const vs = compile(gl.VERTEX_SHADER, vsSrc);
            const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
            if (!vs || !fs) return null;

            const p = gl.createProgram();
            gl.attachShader(p, vs);
            gl.attachShader(p, fs);
            gl.linkProgram(p);
            if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
              console.error('Program link error:', gl.getProgramInfoLog(p));
              return null;
            }

            const uniforms = {};
            const nUni = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
            for (let i = 0; i < nUni; i++) {
              const info = gl.getActiveUniform(p, i);
              if (info) uniforms[info.name] = { loc: gl.getUniformLocation(p, info.name), type: info.type };
            }
            const attribs = {};
            const nAtt = gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES);
            for (let i = 0; i < nAtt; i++) {
              const info = gl.getActiveAttrib(p, i);
              if (info) attribs[info.name] = gl.getAttribLocation(p, info.name);
            }
            prog = { program: p, uniforms, attribs };
            this._programCache.set(key, prog);
            return prog;
          }

          _uploadGeometry(geo) {
            if (geo._uploaded) return;
            const gl = this.gl;
            for (const name in geo.attributes) {
              const attr = geo.attributes[name];
              const buf = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, buf);
              gl.bufferData(gl.ARRAY_BUFFER, attr.array, gl.STATIC_DRAW);
              geo._glBuffers[name] = { buf, itemSize: attr.itemSize };
              if (name === 'position') geo._count = attr.array.length / attr.itemSize;
            }
            if (geo.index) {
              const ib = gl.createBuffer();
              gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
              gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, geo.index, gl.STATIC_DRAW);
              geo._glIndex = ib;
              geo._count = geo.index.length;
            }
            geo._uploaded = true;
          }

          _bindTexture(tex, unit) {
            const gl = this.gl;
            gl.activeTexture(gl.TEXTURE0 + unit);
            if (!tex._glTex) {
              tex._glTex = gl.createTexture();
              tex.needsUpdate = true;
            }
            gl.bindTexture(gl.TEXTURE_2D, tex._glTex);
            if (tex.needsUpdate) {
              if (tex.isDataTexture) {
                gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, tex.width, tex.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, tex.data);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
              } else if (tex.image) {
                gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, !!tex.flipY);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex.image);
                const wrap = tex.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
              }
              tex.needsUpdate = false;
            }
          }

          _collectMeshes(node, list) {
            if (!node.visible) return;
            if (node.isMesh && node.geometry && node.material) list.push(node);
            for (let i = 0; i < node.children.length; i++) {
              this._collectMeshes(node.children[i], list);
            }
          }

          render(root, camera, target, opts = {}) {
            const gl = this.gl;
            if (target) {
              gl.bindFramebuffer(gl.FRAMEBUFFER, target._fbo);
              gl.viewport(0, 0, target.width, target.height);
            } else {
              gl.bindFramebuffer(gl.FRAMEBUFFER, null);
              gl.viewport(0, 0, this.canvas.width, this.canvas.height);
            }

            const clearColor = opts.clearColor !== false;
            const clearDepth = opts.clearDepth !== false;
            let clearMask = 0;
            if (clearColor) {
              const cc = opts.bgColor || [0.04, 0.14, 0.16, 1.0];
              gl.clearColor(cc[0], cc[1], cc[2], cc[3]);
              clearMask |= gl.COLOR_BUFFER_BIT;
            }
            if (clearDepth) {
              gl.depthMask(true);
              clearMask |= gl.DEPTH_BUFFER_BIT;
            }
            if (clearMask) gl.clear(clearMask);

            root.updateMatrixWorld(null);

            const list = this._drawList;
            list.length = 0;
            this._collectMeshes(root, list);

            // 排序：不透明先畫，再依 renderOrder 畫透明物件
            list.sort((a, b) => {
              const ta = a.material.transparent ? 1 : 0;
              const tb = b.material.transparent ? 1 : 0;
              if (ta !== tb) return ta - tb;
              return a.renderOrder - b.renderOrder;
            });

            for (let i = 0; i < list.length; i++) {
              const mesh = list[i];
              const mat = mesh.material;
              const geo = mesh.geometry;
              const prog = this._getProgram(mat.vertexShader, mat.fragmentShader);
              if (!prog) continue;

              this._uploadGeometry(geo);
              gl.useProgram(prog.program);

              if (mat.depthTest) gl.enable(gl.DEPTH_TEST); else gl.disable(gl.DEPTH_TEST);
              gl.depthMask(!!mat.depthWrite);

              if (mat.transparent) gl.enable(gl.BLEND); else gl.disable(gl.BLEND);
              if (mat.side === THREE.DoubleSide) gl.disable(gl.CULL_FACE);
              else { gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK); }

              // 內建矩陣 Uniforms
              const u = prog.uniforms;
              if (u.uModelMatrix) gl.uniformMatrix4fv(u.uModelMatrix.loc, false, mesh._worldMat);
              if (u.uViewMatrix && camera) gl.uniformMatrix4fv(u.uViewMatrix.loc, false, camera.viewMatrix);
              if (u.uProjectionMatrix && camera) gl.uniformMatrix4fv(u.uProjectionMatrix.loc, false, camera.projectionMatrix);
              if (u.uNormalMatrix) gl.uniformMatrix3fv(u.uNormalMatrix.loc, false, mesh._normalMat);

              // 材質自訂 Uniforms
              let texUnit = 0;
              for (const name in mat.uniforms) {
                const uInfo = u[name];
                if (!uInfo) continue;
                const val = mat.uniforms[name].value;
                if (val === null || val === undefined) continue;
                if (val.isTexture) {
                  this._bindTexture(val, texUnit);
                  gl.uniform1i(uInfo.loc, texUnit++);
                } else if (typeof val === 'number') {
                  gl.uniform1f(uInfo.loc, val);
                } else if (val.length === 2) {
                  gl.uniform2f(uInfo.loc, val[0], val[1]);
                } else if (val.length === 3) {
                  gl.uniform3f(uInfo.loc, val[0], val[1], val[2]);
                } else if (val.length === 4) {
                  gl.uniform4f(uInfo.loc, val[0], val[1], val[2], val[3]);
                }
              }

              // 綁定頂點屬性
              for (const attName in prog.attribs) {
                const loc = prog.attribs[attName];
                if (loc < 0) continue;
                const gBuf = geo._glBuffers[attName];
                if (!gBuf) continue;
                gl.bindBuffer(gl.ARRAY_BUFFER, gBuf.buf);
                gl.enableVertexAttribArray(loc);
                gl.vertexAttribPointer(loc, gBuf.itemSize, gl.FLOAT, false, 0, 0);
              }

              if (geo._glIndex) {
                gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, geo._glIndex);
                gl.drawElements(gl.TRIANGLES, geo._count, gl.UNSIGNED_SHORT, 0);
              } else {
                gl.drawArrays(gl.TRIANGLES, 0, geo._count);
              }
            }
            gl.depthMask(true);
          }
        }
      };

      /* =========================================================================
       * 2. Web Audio API 純程式合成水聲與咬食音效（零外部音檔）
       * ========================================================================= */
      class PondAudio {
        constructor() {
          this.enabled = true;
          this.ctx = null;
          this._lastSwipe = 0;
        }
        _ensure() {
          if (!this.enabled) return null;
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            this.ctx = new AC();
          }
          if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
          return this.ctx;
        }
        playPlop(pitch = 1.0, vol = 0.14) {
          const ctx = this._ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320 * pitch, now);
          osc.frequency.exponentialRampToValueAtTime(760 * pitch, now + 0.09);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        }
        playSwipe() {
          const t = performance.now();
          if (t - this._lastSwipe < 140) return;
          this._lastSwipe = t;
          this.playPlop(0.85 + Math.random() * 0.45, 0.055);
        }
        playGulp() {
          const ctx = this._ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.exponentialRampToValueAtTime(210, now + 0.07);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.14);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.11, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        }
        playChomp() {
          const ctx = this._ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          // 低沉俏皮咬合 + 水花氣泡
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(88, now + 0.13);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);

          setTimeout(() => this.playPlop(1.35, 0.11), 65);
          setTimeout(() => this.playPlop(1.75, 0.08), 130);
        }
      }

      /* =========================================================================
       * 3. 2D 波動方程水波模擬器（支援苔石障礙反射與即時高度採樣）
       * ========================================================================= */
      class WaterRippleSim {
        constructor(w, h) {
          this.w = w;
          this.h = h;
          const n = w * h;
          this.curr = new Float32Array(n);
          this.prev = new Float32Array(n);
          this.next = new Float32Array(n);
          this.obstacle = new Uint8Array(n);
          this.texData = new Uint8Array(n * 4);
          this.texture = new THREE.DataTexture(this.texData, w, h);
          this.damping = 0.974;
        }

        clearObstacles() {
          this.obstacle.fill(0);
        }

        addObstacleCircle(u, v, radU, radV) {
          const cx = u * this.w;
          const cy = v * this.h;
          const rx = Math.max(1, radU * this.w);
          const ry = Math.max(1, radV * this.h);
          const x0 = Math.max(1, Math.floor(cx - rx - 1));
          const x1 = Math.min(this.w - 2, Math.ceil(cx + rx + 1));
          const y0 = Math.max(1, Math.floor(cy - ry - 1));
          const y1 = Math.min(this.h - 2, Math.ceil(cy + ry + 1));
          for (let y = y0; y <= y1; y++) {
            for (let x = x0; x <= x1; x++) {
              const dx = (x - cx) / rx;
              const dy = (y - cy) / ry;
              if (dx * dx + dy * dy <= 1.0) {
                const idx = y * this.w + x;
                this.obstacle[idx] = 1;
                this.curr[idx] = 0;
                this.prev[idx] = 0;
              }
            }
          }
        }

        drop(u, v, radiusCells, strength) {
          const cx = u * this.w;
          const cy = v * this.h;
          const r = Math.max(1.5, radiusCells);
          const x0 = Math.max(2, Math.floor(cx - r));
          const x1 = Math.min(this.w - 3, Math.ceil(cx + r));
          const y0 = Math.max(2, Math.floor(cy - r));
          const y1 = Math.min(this.h - 3, Math.ceil(cy + r));
          for (let y = y0; y <= y1; y++) {
            for (let x = x0; x <= x1; x++) {
              const idx = y * this.w + x;
              if (this.obstacle[idx]) continue;
              const d = Math.hypot(x - cx, y - cy) / r;
              if (d < 1.0) {
                const falloff = Math.cos(d * Math.PI * 0.5);
                this.curr[idx] = Math.max(-2.0, Math.min(2.0, this.curr[idx] + strength * falloff * falloff));
              }
            }
          }
        }

        step() {
          const w = this.w, h = this.h;
          const curr = this.curr, prev = this.prev, next = this.next, obs = this.obstacle;
          const damp = this.damping;

          for (let y = 1; y < h - 1; y++) {
            const row = y * w;
            for (let x = 1; x < w - 1; x++) {
              const i = row + x;
              if (obs[i]) {
                next[i] = 0;
                continue;
              }
              const l = obs[i - 1] ? curr[i] : curr[i - 1];
              const r = obs[i + 1] ? curr[i] : curr[i + 1];
              const u = obs[i - w] ? curr[i] : curr[i - w];
              const d = obs[i + w] ? curr[i] : curr[i + w];
              let val = ((l + r + u + d) * 0.5 - prev[i]) * damp;
              if (val > 2.2) val = 2.2;
              else if (val < -2.2) val = -2.2;
              next[i] = val;
            }
          }

          // 柔和吸收邊界
          for (let x = 0; x < w; x++) {
            next[x] = next[w + x] * 0.6;
            next[(h - 1) * w + x] = next[(h - 2) * w + x] * 0.6;
          }
          for (let y = 0; y < h; y++) {
            next[y * w] = next[y * w + 1] * 0.6;
            next[y * w + w - 1] = next[y * w + w - 2] * 0.6;
          }

          this.prev = curr;
          this.curr = next;
          this.next = prev;
        }

        sample(u, v) {
          const x = Math.max(1, Math.min(this.w - 2, Math.floor(u * this.w)));
          const y = Math.max(1, Math.min(this.h - 2, Math.floor(v * this.h)));
          const i = y * this.w + x;
          return {
            h: this.curr[i],
            dx: this.curr[i + 1] - this.curr[i - 1],
            dy: this.curr[i + this.w] - this.curr[i - this.w]
          };
        }

        updateTexture() {
          const w = this.w, h = this.h;
          const curr = this.curr, data = this.texData;
          for (let y = 0; y < h; y++) {
            const ym = y > 0 ? y - 1 : 0;
            const yp = y < h - 1 ? y + 1 : h - 1;
            for (let x = 0; x < w; x++) {
              const xm = x > 0 ? x - 1 : 0;
              const xp = x < w - 1 ? x + 1 : w - 1;
              const i = y * w + x;
              const hVal = curr[i];
              const dx = curr[y * w + xp] - curr[y * w + xm];
              const dy = curr[yp * w + x] - curr[ym * w + x];
              const p = i * 4;
              data[p]     = Math.max(0, Math.min(255, Math.round(128 + hVal * 90)));
              data[p + 1] = Math.max(0, Math.min(255, Math.round(128 + dx * 180)));
              data[p + 2] = Math.max(0, Math.min(255, Math.round(128 + dy * 180)));
              data[p + 3] = 255;
            }
          }
          this.texture.needsUpdate = true;
        }
      }

      /* =========================================================================
       * 4. 純程式化紋理工廠（池底、三種錦鯉、參考附圖 3D Pixar 胖鯊魚、造景）
       * ========================================================================= */
      const TextureFactory = {
        // 池底自然溪床（柔和深青灰細沙與圓潤暗色溪石）
        createPondBedTexture() {
          const c = document.createElement('canvas');
          c.width = 512; c.height = 512;
          const ctx = c.getContext('2d');

          const bg = ctx.createRadialGradient(256, 256, 40, 256, 256, 360);
          bg.addColorStop(0.0, '#184047');
          bg.addColorStop(0.55, '#123239');
          bg.addColorStop(1.0, '#0a1f24');
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, 512, 512);

          // 細沙微粒
          for (let i = 0; i < 3200; i++) {
            const x = Math.random() * 512;
            const y = Math.random() * 512;
            const r = 0.7 + Math.random() * 1.9;
            const l = 28 + Math.random() * 34;
            ctx.fillStyle = `rgba(${l + 8}, ${l + 32}, ${l + 34}, ${0.08 + Math.random() * 0.14})`;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          }

          // 池底平滑小卵石

      /* =========================================================================

       * ========================================================================= */
      const GeometryFactory = {
        _computeSmoothNormals(positions, indices) {
          const nAcc = new Float32Array(positions.length);
          for (let i = 0; i < indices.length; i += 3) {
            const ia = indices[i] * 3, ib = indices[i + 1] * 3, ic = indices[i + 2] * 3;
            const ax = positions[ia], ay = positions[ia + 1], az = positions[ia + 2];
            const bx = positions[ib], by = positions[ib + 1], bz = positions[ib + 2];
            const cx = positions[ic], cy = positions[ic + 1], cz = positions[ic + 2];
            const abx = bx - ax, aby = by - ay, abz = bz - az;
            const acx = cx - ax, acy = cy - ay, acz = cz - az;
            const nx = aby * acz - abz * acy;
            const ny = abz * acx - abx * acz;
            const nz = abx * acy - aby * acx;
            nAcc[ia] += nx; nAcc[ia + 1] += ny; nAcc[ia + 2] += nz;
            nAcc[ib] += nx; nAcc[ib + 1] += ny; nAcc[ib + 2] += nz;
            nAcc[ic] += nx; nAcc[ic + 1] += ny; nAcc[ic + 2] += nz;
          }
          const normals = new Float32Array(positions.length);
          for (let i = 0; i < normals.length; i += 3) {
            const l = Math.hypot(nAcc[i], nAcc[i + 1], nAcc[i + 2]);
            if (l > 1e-6) {
              normals[i] = nAcc[i] / l;
              normals[i + 1] = nAcc[i + 1] / l;
              normals[i + 2] = nAcc[i + 2] / l;
            } else {
              normals[i] = 0; normals[i + 1] = 1; normals[i + 2] = 0;

          }
          return normals;

        createPlane(w, h, segX = 1, segY = 1, horizontal = true) {
          const pos = [], norm = [], uvs = [], idx = [];
          for (let iy = 0; iy <= segY; iy++) {
            const v = iy / segY;
            for (let ix = 0; ix <= segX; ix++) {
              const u = ix / segX;
              const x = (u - 0.5) * w;
              const y = (v - 0.5) * h;
              if (horizontal) {
                pos.push(x, 0, y);
                norm.push(0, 1, 0);
              } else {
                pos.push(x, y, 0);
                norm.push(0, 0, 1);
              }
              uvs.push(u, v);
            }
          }
          const stride = segX + 1;
          for (let iy = 0; iy < segY; iy++) {
            for (let ix = 0; ix < segX; ix++) {
              const a = iy * stride + ix;
              const b = a + 1;
              const c = a + stride;
              const d = c + 1;
              if (horizontal) {
                idx.push(a, c, b, b, c, d);
              } else {
                idx.push(a, b, c, b, d, c);
              }
            }

            .setAttribute('position', pos, 3)
            .setAttribute('normal', norm, 3)
            .setAttribute('uv', uvs, 2)
            .setIndex(idx);

        createSphere(radius, segW = 14, segH = 10, scaleX = 1, scaleY = 1, scaleZ = 1, deformFn = null) {
          const pos = [], uvs = [], idx = [];
          for (let iy = 0; iy <= segH; iy++) {
            const v = iy / segH;
            const phi = v * Math.PI;

              if (deformFn) {

          }
          const stride = segW + 1;
          for (let iy = 0; iy < segH; iy++) {
            for (let ix = 0; ix < segW; ix++) {
              const a = iy * stride + ix;
              const b = a + 1;
              const c = a + stride;

        // 立體錦鯉軀幹（z ∈ [-0.88 尾柄, +0.92 吻端]）
        createKoiBodyGeometry() {
          const segZ = 28, segR = 18;
          const pos = [], uvs = [], idx = [];

          for (let iz = 0; iz <= segZ; iz++) {
            const t = iz / segZ; // 0 = 尾柄, 1 = 吻端
            const z = -0.88 + t * 1.80;

            // 飽滿流線錦鯉橫截面（肩部最寬）
            let rx, ry;
            if (t < 0.72) {
              const s = t / 0.72;
              rx = 0.025 + 0.215 * Math.pow(Math.sin(s * Math.PI * 0.52), 1.35);
              ry = 0.045 + 0.195 * Math.pow(Math.sin(s * Math.PI * 0.55), 1.2);
            } else {
              const s = (t - 0.72) / 0.28;
              const c = Math.cos(s * Math.PI * 0.5);
              rx = 0.24 * Math.pow(c, 0.72);
              ry = 0.24 * Math.pow(c, 0.78);

            for (let ir = 0; ir <= segR; ir++) {
              const v = ir / segR; // 0 = 肚底, 0.5 = 背脊, 1 = 肚底
              const a = v * Math.PI * 2;
              // a=0 -> (0, -ry), a=PI/2 -> (+rx, 0), a=PI -> (0, +ry), a=3PI/2 -> (-rx, 0)
              const x = Math.sin(a) * rx;
              const y = -Math.cos(a) * ry;
              pos.push(x, y, z);
              uvs.push(t, v);
            }
          }

          const stride = segR + 1;
          for (let iz = 0; iz < segZ; iz++) {
            for (let ir = 0; ir < segR; ir++) {
              const a = iz * stride + ir;
              const b = a + 1;
              const c = a + stride;
              const d = c + 1;
              // 確認朝外逆時針繞序
              idx.push(a, c, b, b, c, d);
            }
          }
          const normals = this._computeSmoothNormals(pos, idx);
          return new THREE.BufferGeometry()
            .setAttribute('position', pos, 3)
            .setAttribute('normal', normals, 3)
            .setAttribute('uv', uvs, 2)
            .setIndex(idx);

        // 錦鯉飄逸魚鰭（胸鰭、腹鰭、背鰭、優雅扇形尾鰭）
        createKoiFinsGeometry() {
          const pos = [], norm = [], uvs = [], idx = [];
          let base = 0;

          const addRibbonFin = (ptsRoot, ptsTip) => {
            const n = ptsRoot.length;
            for (let i = 0; i < n; i++) {
              const u = i / (n - 1);
              const r = ptsRoot[i], t = ptsTip[i];
              pos.push(r[0], r[1], r[2]);
              norm.push(0, 1, 0);
              uvs.push(0.0, u);
              pos.push(t[0], t[1], t[2]);
              norm.push(0, 1, 0);
              uvs.push(1.0, u);
            }
            for (let i = 0; i < n - 1; i++) {
              const a = base + i * 2;
              const b = a + 1;
              const c = a + 2;
              const d = a + 3;
              idx.push(a, b, c, b, d, c);
            }
            base += n * 2;
          };

          // 左右寬大圓潤胸鰭
          for (const side of [-1, 1]) {
            addRibbonFin(
              [[side * 0.17, -0.04, 0.44], [side * 0.21, -0.05, 0.28], [side * 0.19, -0.05, 0.12]],
              [[side * 0.50, -0.07, 0.28], [side * 0.56, -0.08, 0.04], [side * 0.36, -0.07, -0.14]]
            );
            // 腹鰭
            addRibbonFin(
              [[side * 0.13, -0.08, -0.04], [side * 0.11, -0.08, -0.22]],
              [[side * 0.31, -0.10, -0.20], [side * 0.24, -0.10, -0.36]]
            );
          }

          // 背鰭
          addRibbonFin(
            [[0, 0.18, 0.22], [0, 0.16, -0.05], [0, 0.11, -0.35]],
            [[0, 0.33, 0.08], [0, 0.30, -0.20], [0, 0.21, -0.48]]
          );

          // 優雅飄逸尾鰭（略微展開 V 字雙葉）
          addRibbonFin(
            [[0, 0.04, -0.84], [0, 0.0, -0.86], [0, -0.04, -0.84]],
            [[-0.08, 0.20, -1.36], [0.0, 0.0, -1.20], [0.08, -0.20, -1.36]]
          );
          addRibbonFin(
            [[0, 0.04, -0.84], [0, 0.0, -0.86], [0, -0.04, -0.84]],
            [[0.12, 0.18, -1.34], [0.0, 0.0, -1.18], [-0.12, -0.18, -1.34]]
          );

          return new THREE.BufferGeometry()
            .setAttribute('position', pos, 3)
            .setAttribute('normal', norm, 3)
            .setAttribute('uv', uvs, 2)
            .setIndex(idx);
        },

        // === 參考附圖：3D Pixar 可愛胖鯊魚軀幹（胖蛋水滴身 + 3道凹刻鰓裂 + 微笑口腔凹槽） ===
        createSharkBodyGeometry() {
          const segZ = 40, segR = 28;
          const pos = [], uvs = [], idx = [];

          for (let iz = 0; iz <= segZ; iz++) {
            const t = iz / segZ; // 0 = 尾柄(-0.68), 1 = 圓吻尖(+0.96)
            const z = -0.68 + t * 1.64;

            // 胖嘟嘟 Pixar 玩具鯊魚輪廓（附圖寬圓飽滿身型）
            let rx, ry, yOffset;
            if (t < 0.62) {
              const s = t / 0.62;
              const curve = Math.pow(Math.sin(s * Math.PI * 0.5), 0.78);
              rx = 0.065 + 0.395 * curve;
              ry = 0.085 + 0.355 * curve;
              yOffset = 0.02 * Math.sin(s * Math.PI);
            } else {
              const s = (t - 0.62) / 0.38;
              const c = Math.cos(s * Math.PI * 0.5);
              // 圓潤寬吻，不尖銳
              rx = 0.46 * Math.pow(Math.max(0, c), 0.62);
              ry = 0.44 * Math.pow(Math.max(0, c), 0.68);
              yOffset = 0.03 * s; // 吻端微上揚顯得俏皮
            }

            for (let ir = 0; ir <= segR; ir++) {
              const v = ir / segR; // 0 = 肚底(-Y), 0.25 = +X, 0.5 = 背脊(+Y), 0.75 = -X, 1 = 肚底
              const a = v * Math.PI * 2;
              let x = Math.sin(a) * rx;
              let y = -Math.cos(a) * ry + yOffset;
              let pz = z;

              // 1) 兩側三道凹刻鰓裂（t ∈ [0.50, 0.64], 側面高度）
              if (t > 0.49 && t < 0.65 && Math.abs(Math.sin(a)) > 0.76 && y > -0.14 && y < 0.16) {
                const gillPhase = (t - 0.505) / 0.042;
                const nearest = Math.round(gillPhase);
                if (nearest >= 0 && nearest <= 2) {
                  const dist = Math.abs(gillPhase - nearest);
                  if (dist < 0.36) {
                    const dent = Math.cos((dist / 0.36) * Math.PI * 0.5) * 0.022;
                    const vFade = Math.max(0, 1.0 - Math.abs((y - 0.01) / 0.15));
                    x -= Math.sign(x) * dent * vFade;

              }

              // 2) 下吻微笑口腔凹槽（讓紅色內腔與白色尖牙清楚嵌入）
              if (t > 0.74 && t < 0.96 && y < 0.01 && y > -0.24) {
                const mouthU = (t - 0.74) / 0.22;
                const smileArcY = -0.115 + 0.045 * Math.pow(1.0 - mouthU, 1.5);
                const dy = Math.abs(y - smileArcY);
                const mouthHalfOpen = 0.082 * Math.sin(mouthU * Math.PI);
                if (dy < mouthHalfOpen && Math.abs(x) < 0.32) {
                  const dFactor = Math.cos((dy / mouthHalfOpen) * Math.PI * 0.5);
                  const pushIn = 0.14 * dFactor * Math.sin(mouthU * Math.PI);
                  pz -= pushIn * 0.75;
                  x *= (1.0 - pushIn * 0.55);
                }
              }

              pos.push(x, y, pz);
              uvs.push(t, v);
            }
          }

          const stride = segR + 1;
          for (let iz = 0; iz < segZ; iz++) {
            for (let ir = 0; ir < segR; ir++) {
              const a = iz * stride + ir;
              const b = a + 1;
              const c = a + stride;
              const d = c + 1;
              // 朝外逆時針繞序
              idx.push(a, c, b, b, c, d);
            }
          }

          const normals = this._computeSmoothNormals(pos, idx);
          return new THREE.BufferGeometry()
            .setAttribute('position', pos, 3)
            .setAttribute('normal', normals, 3)
            .setAttribute('uv', uvs, 2)
            .setIndex(idx);
        },

        // === 參考附圖：3D Pixar 胖鯊魚四片圓厚立體魚鰭（背鰭 + 左右圓槳胸鰭 + 飽滿新月尾鰭） ===
        createSharkFinsGeometry() {
          const pos = [], uvs = [], idx = [];
          let base = 0;

          // 生成具有飽滿圓角厚度的 3D 鰭片（雙面鼓起像軟膠公仔）
          const addPlumpFin = (gridFn, segU, segV, thicknessFn, normalDir) => {
            const start = base;
            const ringVerts = (segU + 1) * (segV + 1);

            for (const side of [1, -1]) {
              for (let iv = 0; iv <= segV; iv++) {
                const v = iv / segV;
                for (let iu = 0; iu <= segU; iu++) {
                  const u = iu / segU;
                  const p = gridFn(u, v);
                  // 邊緣收斂成光滑圓角，中央飽滿鼓起
                  const edgeU = Math.sin(u * Math.PI);
                  const edgeV = Math.sin(v * Math.PI);
                  const bulge = Math.sqrt(Math.max(0, edgeU * edgeV)) * thicknessFn(u, v) * side;
                  pos.push(
                    p[0] + normalDir[0] * bulge,
                    p[1] + normalDir[1] * bulge,
                    p[2] + normalDir[2] * bulge
                  );
                  uvs.push(u, v);
                  base++;
                }
              }
            }

            const stride = segU + 1;
            // 正反兩面依實際法線方向決定繞序
            for (let sideIdx = 0; sideIdx < 2; sideIdx++) {
              const offset = start + sideIdx * ringVerts;
              for (let iv = 0; iv < segV; iv++) {
                for (let iu = 0; iu < segU; iu++) {
                  const a = offset + iv * stride + iu;
                  const b = a + 1;
                  const c = a + stride;
                  const d = c + 1;
                  if (sideIdx === 0) idx.push(a, b, c, b, d, c);
                  else idx.push(a, c, b, b, c, d);
                }
              }
            }
          };

          // 1) 高挺圓潤背鰭（附圖招牌圓角厚背鰭）
          addPlumpFin(
            (u, v) => {
              // v: 0=根部 -> 1=鰭尖, u: 0=後緣 -> 1=前緣
              const rootZ = -0.18 + u * 0.48;
              const tipZ = -0.24 + u * 0.14;
              const z = rootZ * (1 - v) + tipZ * v - 0.12 * Math.sin(v * Math.PI * 0.7);
              const widthFactor = Math.pow(1.0 - v * 0.82, 0.75);
              const zCentered = -0.02 - 0.24 * v + (u - 0.5) * 0.50 * widthFactor;
              const y = 0.34 + v * 0.46 * Math.sin(0.2 + u * 0.65 * Math.PI);
              return [0, y, zCentered];
            },
            10, 10,
            (u, v) => 0.068 * (1.0 - v * 0.65),
            [1, 0, 0]
          );

          // 2) 左右圓頭槳狀胸鰭（附圖微微向後下方伸展）
          for (const side of [-1, 1]) {
            addPlumpFin(
              (u, v) => {
                // v: 0=貼身根部 -> 1=鰭尖, u: 0=後緣 -> 1=前緣
                const span = v * 0.56;
                const chord = 0.36 * Math.sin(Math.min(1, 0.22 + (1 - v) * 0.78) * Math.PI * 0.5);
                const sweepZ = 0.22 - v * 0.42 + (u - 0.5) * chord;
                const x = side * (0.35 + span * Math.sin(0.18 + u * 0.68 * Math.PI));
                const y = -0.14 - v * 0.16;
                return [x, y, sweepZ];
              },
              10, 10,
              (u, v) => 0.052 * (1.0 - v * 0.62),
              [0, 1, 0]
            );
          }

          // 3) 飽滿圓角新月尾鰭（上下雙葉，上葉略高）
          for (const lobe of [1, -1]) {
            addPlumpFin(
              (u, v) => {
                // v: 0=尾柄根 -> 1=尾葉尖端
                const len = lobe > 0 ? 0.54 : 0.44;
                const chord = 0.22 * Math.pow(1.0 - v * 0.75, 0.6);
                const z = -0.62 - v * len + (u - 0.5) * chord - 0.08 * Math.sin(v * Math.PI);
                const y = lobe * (0.02 + v * (lobe > 0 ? 0.44 : 0.34) * Math.sin(0.25 + u * 0.6 * Math.PI));
                return [0, y, z];
              },
              8, 10,
              (u, v) => 0.048 * (1.0 - v * 0.65),
              [1, 0, 0]
            );
          }

          const normals = this._computeSmoothNormals(pos, idx);
          return new THREE.BufferGeometry()
            .setAttribute('position', pos, 3)
            .setAttribute('normal', normals, 3)
            .setAttribute('uv', uvs, 2)
            .setIndex(idx);
        },

        // 附圖同款大顆亮黑圓珠雙眼（置於頭部兩側略偏上，俯視極清楚可愛）
        createSharkEyesGeometry() {
          const pos = [], uvs = [], idx = [];
          let base = 0;
          const addEyeSphere = (cx, cy, cz, r) => {

            for (let iy = 0; iy <= segH; iy++) {

                const u = ix / segW;

                const sy = Math.cos(phi);
                const sz = Math.sin(theta) * Math.sin(phi);
                pos.push(cx + sx * r, cy + sy * r, cz + sz * r);

            for (let iy = 0; iy < segH; iy++) {
              for (let ix = 0; ix < segW; ix++) {
                const a = start + iy * stride + ix;
                const b = a + 1;
                const c = a + stride;
                const d = c + 1;
                idx.push(a, c, b, b, c, d);
              }
            }
          };

          addEyeSphere(0.325, 0.145, 0.565, 0.095);

        // 3D 深紅微笑口腔內壁
        createSharkMouthGeometry() {

        createSharkTeethGeometry() {

            const tipIdx = base++;
            const tl = Math.hypot(0, dirY, 0.5) || 1;
            pos.push(bx, by + dirY * h, bz + leanZ);
            norm.push(0, dirY / tl, 0.5 / tl);

            for (let s = 0; s <= segs; s++) {

              const ca = Math.cos(a), sa = Math.sin(a);
              pos.push(bx + ca * rad, by, bz + sa * rad);

            const x = Math.sin(ang) * 0.255;
            const z = 0.595 + Math.cos(ang) * 0.245;

          for (let i = 0; i < 6; i++) {
            const u = (i + 0.5) / 6;
            const ang = (u - 0.5) * Math.PI * 0.62;
            const x = Math.sin(ang) * 0.238;
            const z = 0.585 + Math.cos(ang) * 0.232;

            .setAttribute('position', pos, 3)
            .setAttribute('normal', norm, 3)
            .setAttribute('uv', uvs, 2)
            .setIndex(idx);
        },

        // 3D 多層盛開睡蓮花
        createLotusFlowerGeometry() {
          const pos = [], uvs = [], idx = [];
          let base = 0;
          const addPetal = (angle, tilt, len, width, yOff) => {
            const segL = 5, segW = 3;
            const start = base;
            const ca = Math.cos(angle), sa = Math.sin(angle);
            for (let il = 0; il <= segL; il++) {
