    // 初始化將提示語組合
    levelsData.forEach(lvl => {
        lvl.hintHTML = lvl.intro.points.map(p => p.html).join("<br><br>");
        lvl.hintSound = lvl.intro.points.map(p => p.sound).join(" ");
    });

    // ================= 狀態變數 =================
    let currentLevel = null;
    let currentQuestions = [];
    let currentQIndex = 0;
    let userAnswers = [];
    let score = 0;
    let retryIndex = 0;

    // ================= 星星系統 =================
    let totalStars = parseInt(localStorage.getItem('teacherCatStars')) || 0;
    document.getElementById('starCount').innerText = totalStars;

    function addStars(num) {
        totalStars += num;
        localStorage.setItem('teacherCatStars', totalStars);
        document.getElementById('starCount').innerText = totalStars;
    }

    // ================= Progress Record 整合 =================
    let levelScores = JSON.parse(localStorage.getItem('teacherCatLevelScores')) || {};

    function saveScore(levelId, newScore) {
        if (!levelScores[levelId] || newScore > levelScores[levelId]) {
            levelScores[levelId] = newScore;
            localStorage.setItem('teacherCatLevelScores', JSON.stringify(levelScores));
        }
        updateMenuButtons();
    }

    function clearRecord() {
        if(confirm("確定要清除所有學習記錄嗎？")) {
            levelScores = {};
            localStorage.removeItem('teacherCatLevelScores');
            localStorage.removeItem('teacherCatStars');
            totalStars = 0;
            document.getElementById('starCount').innerText = totalStars;
            updateMenuButtons();
        }
    }

    function updateMenuButtons() {
        const grid = document.getElementById("levelContainer");
        grid.innerHTML = "";
        
        levelsData.forEach(lvl => {
            let btn = document.createElement("button");
            btn.className = "level-btn";
            
            let s = levelScores[lvl.id];
            let recordHtml = "";
            if (s !== undefined) {
                // 最大題數固定每次抽取 20 題 (每題 5 分 = 滿分 100)
                let thisPlayCount = Math.min(lvl.questions.filter(q => q.d === 'easy').length, 10) + Math.min(lvl.questions.filter(q => q.d === 'hard').length, 10);
                let actualMax = thisPlayCount * 5;
                
                let starIcon = s === actualMax ? "🌟" : (s >= (actualMax/2) ? "⭐" : "🌱");
                recordHtml = `<span class="level-score-text">最高分: ${s} ${starIcon}</span>`;
            }
            
            btn.innerHTML = `${lvl.title}${recordHtml}`; 
            btn.onclick = () => showIntroScreen(lvl);
            grid.appendChild(btn);
        });
    }

    // ================= 頁面初始化 =================
    window.onload = () => {
        updateMenuButtons();
    };

    function showMenu() {
        updateMenuButtons();
        document.getElementById("mainMenu").classList.remove("hidden");
        document.getElementById("teachingScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.add("hidden");
        document.getElementById("resultScreen").classList.add("hidden");
        document.getElementById("retryModal").classList.add("hidden");
    }

    // ================= 課前預習頁面 =================
    function showIntroScreen(lvl) {
        currentLevel = lvl;
        document.getElementById("teachTitle").innerText = lvl.title;
        
        let html = `<div style="font-size:1.5em; color:#d81b60; border-bottom:3px solid #ffb300; padding-bottom:10px; margin-bottom:15px; text-align:left;"><b>📖 學習重點：</b></div>`;

        lvl.intro.points.forEach(p => {
            html += `
            <div style="display:flex; align-items:flex-start; margin-bottom:15px; text-align:left; background: #e3f2fd; padding: 15px; border-radius: 15px; box-shadow: 0 4px 0 #bbdefb;">
                <button class="btn-play-small" style="flex-shrink:0; margin-right:15px;" onclick="speakText('${p.sound}', 'zh-HK')">🔊</button>
                <div style="font-size:1.3em; line-height:1.5;">${p.html}</div>
            </div>`;
        });

        html += `<div style="font-size:1.5em; color:#d81b60; border-bottom:3px solid #ffb300; padding-bottom:10px; margin-bottom:15px; margin-top:30px; text-align:left;"><b>🌟 5 個魔法例子：</b></div>`;

        lvl.intro.examples.forEach((ex, idx) => {
            let safeEn = ex.en.replace(/'/g, "\\'");
            let safeZh = ex.zh.replace(/'/g, "\\'");
            html += `
            <div style="margin-bottom:15px; text-align:left; background: #fffde7; padding: 15px; border-radius: 15px; border: 3px dashed #ffb300;">
                <div style="display:flex; align-items:flex-start; margin-bottom:10px;">
                    <button class="btn-play-small" style="flex-shrink:0; margin-right:15px; background:#4caf50; box-shadow:0 3px 0 #2e7d32;" onclick="speakText('${safeEn}', 'en-GB')">🔊</button>
                    <div style="font-size:1.4em; font-weight:bold; color:#1b5e20;">${idx+1}️⃣ ${ex.html_en}</div>
                </div>
                <div style="display:flex; align-items:flex-start;">
                    <button class="btn-play-small" style="flex-shrink:0; margin-right:15px; width:35px; height:35px; font-size:1em;" onclick="speakText('${safeZh}', 'zh-HK')">🔊</button>
                    <div style="font-size:1.2em; color:#d84315; margin-top:2px;">${ex.html_zh}</div>
                </div>

        });

        document.getElementById("teachContent").innerHTML = html;
        document.getElementById("mainMenu").classList.add("hidden");
        document.getElementById("teachingScreen").classList.remove("hidden");
        window.scrollTo(0,0);

    // ================= 開始遊戲 =================
    function startGame() {
        // 從當前關卡題庫中隨機抽出 10 題淺、10 題深
        let easys = currentLevel.questions.filter(q => q.d === 'easy').sort(() => 0.5 - Math.random()).slice(0, 10);
        let hards = currentLevel.questions.filter(q => q.d === 'hard').sort(() => 0.5 - Math.random()).slice(0, 10);
        
        currentQuestions = [...easys, ...hards];
        userAnswers = new Array(currentQuestions.length).fill(null);
        currentQIndex = 0;
        score = 0;
        document.getElementById("score").innerText = score;

        document.getElementById("teachingScreen").classList.add("hidden");
        document.getElementById("resultScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");
        window.scrollTo(0,0);
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById("hintContainer").classList.add("hidden");
        
        let qData = currentQuestions[currentQIndex];
        let diffLabel = currentQIndex < (currentQuestions.length/2) ? "🌱 淺程度" : "🔥 深程度";
        document.getElementById("gameProgress").innerText = `第 ${currentQIndex + 1} / ${currentQuestions.length} 題 (${diffLabel})`;
        document.getElementById("questionText").innerText = qData.q;
        
        let optContainer = document.getElementById("optionsContainer");
        optContainer.innerHTML = "";
        
        qData.o.forEach((opt, index) => {
            let row = document.createElement("div");
            row.className = "option-row";
            
            let soundBtn = document.createElement("button");
            soundBtn.className = "btn-play-small";
            soundBtn.innerText = "🔊";
            soundBtn.onclick = () => speakText(opt, 'en-GB');
            
            let btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            
            if (userAnswers[currentQIndex] !== null) {
                btn.disabled = true;
                if (index === qData.a) btn.classList.add("correct");
                else if (index === userAnswers[currentQIndex]) btn.classList.add("wrong");
            } else {
                btn.onclick = () => checkAnswer(index, qData.a, btn);
            }
            
            row.appendChild(soundBtn);
            row.appendChild(btn);
            optContainer.appendChild(row);
        });

        let btnNext = document.getElementById("btnNext");
        if (currentQIndex === currentQuestions.length - 1) {
            btnNext.innerText = "完成交卷 📝";
        } else {
            if(userAnswers[currentQIndex] !== null) {
                btnNext.innerText = "下一頁 ➡️";
            } else {
                btnNext.innerText = "下一頁 (可跳過) ➡️";
            }
        }
    }

    function checkAnswer(selectedIndex, correctIndex, btnElement) {
        if (userAnswers[currentQIndex] !== null) return; 
        
        userAnswers[currentQIndex] = selectedIndex;
        let allBtns = document.getElementById("optionsContainer").querySelectorAll(".option-btn");
        allBtns.forEach(b => b.disabled = true);
        
        if (selectedIndex === correctIndex) {
            btnElement.classList.add("correct");
            score += 5;
            document.getElementById("score").innerText = score;
            playExaggeratedEffect(true);
            setTimeout(() => nextQ(), 1500); 
        } else {
            btnElement.classList.add("wrong");
            allBtns[correctIndex].classList.add("correct"); 
            playExaggeratedEffect(false);
            
            document.getElementById("hintText").innerHTML = currentLevel.hintHTML;
            document.getElementById("hintAudioBtn").onclick = () => speakText(currentLevel.hintSound, 'zh-HK');
            document.getElementById("hintContainer").classList.remove("hidden");
            
            // 答錯後更新按鈕文字
            if (currentQIndex === currentQuestions.length - 1) {
                document.getElementById("btnNext").innerText = "完成交卷 📝";
            } else {
                document.getElementById("btnNext").innerText = "下一頁 ➡️";
            }
            window.scrollTo(0, document.body.scrollHeight);
        }
    }

    function prevQ() { if (currentQIndex > 0) { currentQIndex--; loadQuestion(); } }

    function nextQ() {
        if (currentQIndex < currentQuestions.length - 1) {
            currentQIndex++;
            loadQuestion();
        } else {
            showResult();
        }
    }

    function playExaggeratedEffect(isCorrect) {
        let fx = document.getElementById("fxLayer");
        fx.innerText = isCorrect ? "🎉" : "💦";
        fx.classList.add("show-fx");
        speakText(isCorrect ? "Excellent!" : "Oops! Try again.", 'en-GB', isCorrect ? 1.2 : 0.8, isCorrect ? 1.5 : 0.5);
        setTimeout(() => fx.classList.remove("show-fx"), 1000);
    }

    // ================= 結算頁面 =================
    function showResult() {
        document.getElementById("gameScreen").classList.add("hidden");
        document.getElementById("resultScreen").classList.remove("hidden");
        window.scrollTo(0,0);
        
        let maxScore = currentQuestions.length * 5;
        document.getElementById("finalScoreText").innerText = `你的最終分數是: ${score} / ${maxScore} 分！`;
        
        saveScore(currentLevel.id, score);
        
        let starText = "";
        if (score === maxScore) starText = "🌟 滿分大星星！太厲害了！🌟";
        else if (score >= (maxScore/2)) starText = "⭐ 獲得合格小星星！繼續加油！⭐";
        else starText = "再接再厲，下次一定可以拿到星星！";
        
        document.getElementById("starRewardText").innerText = starText;
        
        let list = document.getElementById("summaryList");
        list.innerHTML = "";
        
        currentQuestions.forEach((q, i) => {
            let isCorrect = userAnswers[i] === q.a;
            let item = document.createElement("div");
            item.className = `summary-item ${isCorrect ? 'correct-item' : 'wrong-item'}`;
            
            let statusText = "";
            if(isCorrect) {
                statusText = "✅ 答對";
            } else if (userAnswers[i] === null) {
                statusText = `⚠️ 未作答 (跳過)`;
            } else {
                statusText = `❌ 答錯 (你選: ${q.o[userAnswers[i]]})`;
            }
            
            let html = `<div style="font-size:1.2em;"><b>Q${i+1}:</b> ${q.q} <br><span style="font-size:0.9em;">${statusText}</span></div>`;
            if (!isCorrect) {
                html += `<button class="btn-retry" onclick="openRetry(${i})">重新再做 🔄</button>`;
            }
            item.innerHTML = html;
            list.appendChild(item);
        });
    }

    // ================= 重做模式 =================
    function openRetry(index) {
        retryIndex = index;
        let qData = currentQuestions[index];
        
        document.getElementById("retryQuestionText").innerText = qData.q;
        let optContainer = document.getElementById("retryOptionsContainer");
        optContainer.innerHTML = "";
        
        qData.o.forEach((opt, idx) => {
            let row = document.createElement("div");
            row.className = "option-row";
            
            let soundBtn = document.createElement("button");
            soundBtn.className = "btn-play-small";
            soundBtn.innerText = "🔊";
            soundBtn.onclick = () => speakText(opt, 'en-GB');
            
            let btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkRetry(idx, qData.a, btn);
            
            row.appendChild(soundBtn);
            row.appendChild(btn);
            optContainer.appendChild(row);
        });
        
        document.getElementById("retryHintText").innerHTML = currentLevel.hintHTML;
        document.getElementById("retryAudioBtn").onclick = () => speakText(currentLevel.hintSound, 'zh-HK');
        
        document.getElementById("retryModal").classList.remove("hidden");
    }

    function checkRetry(selectedIndex, correctIndex, btnElement) {
        if (selectedIndex === correctIndex) {
            btnElement.classList.add("correct");
            playExaggeratedEffect(true);
            
            if (userAnswers[retryIndex] !== correctIndex) {
                userAnswers[retryIndex] = selectedIndex; 
                score += 5; 
                addStars(1); 
            }
            
            setTimeout(() => {
                closeRetry();
                showResult(); 
            }, 1000);
        } else {
            btnElement.classList.add("wrong");
            playExaggeratedEffect(false);
        }
    }

    function closeRetry() { document.getElementById("retryModal").classList.add("hidden"); }

    // ================= 萬用語音朗讀 API =================
    function speakText(text, lang='en-GB', rate=0.85, pitch=1) {
        if(!text) return;
        let cleaned = text.replace(/___/g, "blank").replace(/<[^>]*>?/gm, ''); 
        const utterance = new SpeechSynthesisUtterance(cleaned);
        utterance.lang = lang; 
        utterance.rate = rate; 
        utterance.pitch = pitch;
        window.speechSynthesis.speak(utterance);
    }
</script>
</body>
</html>
