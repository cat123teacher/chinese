        }
        while(levelData[i].hardPool.length < 10) {

    window.onload = function() {
        updateHomeGrid();
    }

    function updateHomeGrid() {
        const grid = document.getElementById("level-grid");
        grid.innerHTML = "";
        
        for(let i = 1; i <= 10; i++) {
            let score = highScores[i];
            let starHtml = "";
            let scoreText = "Progress Record:<br>未挑戰";
            
            if (score !== undefined) {
                scoreText = `Progress Record:<br>${score} 分`;
                if (score === 20) {
                    starHtml = '<span style="font-size:1.4em; text-shadow:0 0 8px gold;">🌟</span>';
                } else if (score >= 10) {
                    starHtml = '<span style="font-size:1.2em;">⭐</span>';
                }
            }

            let titleParts = levelData[i].title.split("：");
            let btn = document.createElement("button");
            btn.className = "level-btn";
            btn.style.background = btnColors[(i - 1) % 5];
            btn.innerHTML = `
                <div class="level-num">${titleParts}</div>
                <div class="level-name">${titleParts[1] || ""}</div>
                <div class="level-score">${scoreText} ${starHtml}</div>
            `;
            btn.onclick = () => openIntro(i);
            grid.appendChild(btn);
        }
    }

    function clearRecords() {
        if(confirm("確定要清除所有小朋友的最高分和星星記錄嗎？")) {
            localStorage.removeItem('teacherCatScores');
            highScores = {};
            updateHomeGrid();
            alert("記錄已完全清除！");
        }
    }

    function goHome() {
        document.getElementById("home-screen").classList.remove("hidden");
        document.getElementById("intro-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("summary-screen").classList.add("hidden");
        window.speechSynthesis.cancel();
        updateHomeGrid();
    }

    function openIntro(level) {
        currentLevel = level;
        document.getElementById("home-screen").classList.add("hidden");
        document.getElementById("intro-screen").classList.remove("hidden");
        document.getElementById("intro-title").innerText = levelData[level].title;
        
        // 核心修改 1：切割每一句話並加上發音按鈕
        let sentences = levelData[level].teaching.split('<br>');
        let introHtml = "";
        sentences.forEach(s => {
            if(s.trim() !== "") {
                let plainText = s.replace(/<[^>]*>?/gm, '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                introHtml += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; background:white; padding:10px 15px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
                        <div style="flex:1; text-align:left;">${s}</div>
                        <button class="speak-btn opt-speak" style="width:40px;height:40px;font-size:1em; flex-shrink:0;" onclick="speakText('${plainText}')">🔊</button>
                    </div>`;
            }
        });
        document.getElementById("intro-content").innerHTML = introHtml;
    }

    function startGameplay() {
        currentQIndex = 0;
        userAnswers = new Array(20).fill(null);
        isRetryMode = false;
        
        let easyQs = [...levelData[currentLevel].easyPool].sort(() => 0.5 - Math.random()).slice(0, 10);
        let hardQs = [...levelData[currentLevel].hardPool].sort(() => 0.5 - Math.random()).slice(0, 10);
        
        easyQs = easyQs.map(q => ({...q, difficulty: "淺"}));
        hardQs = hardQs.map(q => ({...q, difficulty: "深"}));
        
        currentQuestions = easyQs.concat(hardQs);
        
        currentQuestions.forEach(q => {
            q.shuffledOptions = q.options.map((text, i) => ({ text, originalIndex: i })).sort(() => 0.5 - Math.random());
        });

        document.getElementById("intro-screen").classList.add("hidden");
        document.getElementById("summary-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        document.getElementById("level-indicator").innerText = levelData[currentLevel].title;
        loadQuestion();
    }

    function retryWholeLevel() {
        startGameplay();
    }

    function loadQuestion() {
        let qData = currentQuestions[currentQIndex];
        let qNum = currentQIndex + 1;
        let diffColor = qData.difficulty === "淺" ? "#4CAF50" : "#F44336";
        
        document.getElementById("question-text").innerHTML = `<span class="diff-tag" style="background:${diffColor}">${qData.difficulty}難度</span> 第 ${qNum} 題：<br><br>${qData.q}`;
        document.getElementById("progress-text").innerText = `當前進度：${qNum} / 20 題`;

        // 控制上一頁和下一頁的按鈕顯示
        document.getElementById("prev-btn").style.visibility = (currentQIndex === 0) ? "hidden" : "visible";
        
        let nextBtn = document.getElementById("next-btn");
        if (currentQIndex === 19) {
            nextBtn.innerText = "完成並看分數 ➡️";
            nextBtn.style.backgroundColor = "#E91E63";
            nextBtn.style.boxShadow = "0 5px #C2185B";
        } else {
            nextBtn.innerText = "下一頁 ➡️";
            nextBtn.style.backgroundColor = "#81C784";
            nextBtn.style.boxShadow = "0 5px #388E3C";
        }

        let optionsGrid = document.getElementById("options-grid");
        optionsGrid.innerHTML = "";
        
        qData.shuffledOptions.forEach((optObj) => {
            let container = document.createElement("div");
            container.className = "opt-container";
            
            let btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = optObj.text;
            btn.onclick = () => submitAnswer(optObj.originalIndex, qData.ans);
            
            let speakBtn = document.createElement("button");
            speakBtn.className = "speak-btn opt-speak";
            speakBtn.innerText = "🔊";
            speakBtn.onclick = (e) => { e.stopPropagation(); speakText(optObj.text); };
            
            container.appendChild(btn);
            container.appendChild(speakBtn);
            optionsGrid.appendChild(container);
        });
    }

    // 核心修改 2 & 3：處理自由上下頁跳轉與得分機制
    function nextQuestion(isManualSkip = false) {
        // 若手動按下一頁，且該題沒有作答正確紀錄，則視為未作答/答錯
        if (isManualSkip && (!userAnswers[currentQIndex] || !userAnswers[currentQIndex].isCorrect)) {
            userAnswers[currentQIndex] = { selectedOriginal: null, isCorrect: false };
        }
        
        if (currentQIndex < 19) {
            currentQIndex++;
            loadQuestion();
        } else {
            // 完成第 20 題後，若沒答對就按完成，視為錯
            if (!userAnswers[currentQIndex] || !userAnswers[currentQIndex].isCorrect) {
                userAnswers[currentQIndex] = { selectedOriginal: null, isCorrect: false };
            }
            showSummary(); 
        }
    }

    function prevQuestion() {
        if (currentQIndex > 0) {
            currentQIndex--;
            loadQuestion();
        }
    }

    function submitAnswer(selectedIndex, correctIndex) {
        let isCorrect = (selectedIndex === correctIndex);
        
        if(isRetryMode) {
            if(isCorrect) {
                playExaggeratedEffect();
                userAnswers[retryQIndex] = { selectedOriginal: selectedIndex, isCorrect: true };
                setTimeout(() => finishRetry(), 1500); 
            } else {
                showTeacherCatHint(true); 
            }
        } else {
            if(isCorrect) {
                userAnswers[currentQIndex] = { selectedOriginal: selectedIndex, isCorrect: true };
                playExaggeratedEffect();
                
                // 答對後等待 1.5 秒自動跳下一題 (檢查是否還停留在本題，避免連按衝突)
                setTimeout(() => {
                    if (document.getElementById("game-screen").classList.contains("hidden") === false) {
                        nextQuestion(false);
                    }
                }, 1500);
            } else {
                // 答錯只顯示提示，不會鎖死，可重答或手動按下一頁跳過
                showTeacherCatHint(false); 
            }
        }
    }

    function finishRetry() {
        isRetryMode = false;
        document.getElementById("game-nav-bar").classList.remove("hidden");
        showSummary(); 
    }

    function showTeacherCatHint(isRetry) {
        document.getElementById("hint-text").innerHTML = "<b>哎呀，不小心答錯了！</b><br><br>📝 <b>Teacher Cat 提示：</b><br>" + levelData[currentLevel].teaching.replace(/<br>/g, " ");
        document.getElementById("hint-modal").style.display = "flex";
        
        let btn = document.getElementById("hint-action-btn");
        if(isRetry) {
            btn.innerText = "再試一次！我可以的！";
            btn.onclick = () => { document.getElementById("hint-modal").style.display = "none"; };
        } else {
            btn.innerText = "明白了，關閉提示 (可重新嘗試或按下一頁跳過)";
            btn.onclick = () => { document.getElementById("hint-modal").style.display = "none"; };
        }
    }

    function speakText(target) {
        window.speechSynthesis.cancel();
        let textToRead = "";
        
        if(target === 'q') {
            let tempDiv = document.createElement("div");
            tempDiv.innerHTML = document.getElementById("question-text").innerHTML;
            textToRead = tempDiv.innerText.replace(/淺難度|深難度/, "").replace(/第 \d+ 題：/, "");
        } else if (target === 'hint') {
            let tempDiv = document.createElement("div");
            tempDiv.innerHTML = levelData[currentLevel].teaching;
            textToRead = tempDiv.innerText;
        } else {
            textToRead = target; 
        }
        
        let utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'zh-HK'; 
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
    }

    function playExaggeratedEffect() {
        document.body.classList.add('anim-shake');
        setTimeout(() => document.body.classList.remove('anim-shake'), 600);
        
        const emojis = ['🌟','🎉','✨','🎊','😻','💯'];
        for(let i=0; i<30; i++) {
            let em = document.createElement('div');
            em.innerText = emojis[Math.floor(Math.random()*emojis.length)];
            em.className = 'confetti';
            em.style.left = Math.random() * 100 + 'vw';
            em.style.animationDuration = (Math.random() * 2 + 1) + 's';
            document.body.appendChild(em);
            setTimeout(() => em.remove(), 3000);
        }
        
        window.speechSynthesis.cancel();
        let u = new SpeechSynthesisUtterance("答對啦！你好叻呀！太棒了！");
        u.lang = 'zh-HK'; u.pitch = 1.5; u.rate = 1.2;
        window.speechSynthesis.speak(u);
    }

    function showSummary() {
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("summary-screen").classList.remove("hidden");
        document.getElementById("new-record-msg").classList.add("hidden");
        
        let score = userAnswers.filter(a => a && a.isCorrect).length; 
        document.getElementById("score-text").innerText = `你的得分是：${score} / 20 分！`;
        
        let awardHtml = "加油！再試一次爭取合格拿星星！";
        if (score === 20) {
            awardHtml = '太厲害了！滿分！獲得一顆點亮的大星星！ <br><span style="font-size:2.5em; text-shadow:0 0 15px gold;">🌟</span>';
        } else if (score >= 10) {
            awardHtml = '恭喜合格！獲得一顆點亮的小星星！ <br><span style="font-size:1.8em;">⭐</span>';
        }
        document.getElementById("star-award").innerHTML = awardHtml;

        let oldScore = highScores[currentLevel] || 0;
        if (score > oldScore) {
            highScores[currentLevel] = score;
            localStorage.setItem('teacherCatScores', JSON.stringify(highScores));
            document.getElementById("new-record-msg").classList.remove("hidden"); 
        }
        
        let listHtml = document.getElementById("summary-list");
        listHtml.innerHTML = "";
        
        currentQuestions.forEach((q, index) => {
            let ansData = userAnswers[index];
            let item = document.createElement("div");
            item.className = "summary-item";
            
            let statusHtml = "";
            let actionHtml = "";
            
            if(!ansData || !ansData.isCorrect) {
                statusHtml = `<span class="status-wrong">❌ 答錯 / 未答</span>`;
                actionHtml = `<button class="retry-btn" onclick="startRetry(${index})">重新再做這題</button>`;
            } else {
                statusHtml = `<span class="status-correct">✅ 答對</span>`;
            }
            
            item.innerHTML = `<div style="width:75%;">${index + 1}. ${q.q.substring(0,25)}... ${statusHtml}</div> ${actionHtml}`;
            listHtml.appendChild(item);
        });
    }

    function startRetry(index) {
        isRetryMode = true;
        retryQIndex = index;
        currentQIndex = index;
        
        document.getElementById("summary-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        document.getElementById("game-nav-bar").classList.add("hidden");
        
        loadQuestion();
    }
</script>
