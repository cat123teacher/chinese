                        { q: "walk + ed = ( ___ )", options: ["walked", "walkd"], answer: 0 },
                        { q: "need + ed = ( ___ )", options: ["needed", "needd"], answer: 0 },
                        { q: "print + ed = ( ___ )", options: ["printed", "printd"], answer: 0 }
                    ],
                    hard: [
                        { q: "Tony did not ( ___ ) the windows.", options: ["open", "opened"], answer: 0 },
                        { q: "He did not ( ___ ) the questions.", options: ["answer", "answered"], answer: 0 },
                        { q: "Janice ( ___ ) for a cup of tea yesterday.", options: ["asked", "ask"], answer: 0 },
                        { q: "My brother and I did not ( ___ ) any books.", options: ["borrow", "borrowed"], answer: 0 },
                        { q: "We ( ___ ) the field trip yesterday.", options: ["enjoyed", "enjoy"], answer: 0 },
                        { q: "She ( ___ ) in Canada last year.", options: ["lived", "live"], answer: 0 },
                        { q: "Our dog did not ( ___ ) vegetables.", options: ["need", "needed"], answer: 0 },
                        { q: "You did not ( ___ ) your clothes.", options: ["collect", "collected"], answer: 0 },
                        { q: "My mother ( ___ ) the housework just now.", options: ["finished", "finish"], answer: 0 },
                        { q: "A worker ( ___ ) the chair last week.", options: ["fixed", "fix"], answer: 0 },
                        { q: "The magician ( ___ ) me a black hat last night.", options: ["showed", "show"], answer: 0 },
                        { q: "Her dog did not ( ___ ) at the postman.", options: ["bark", "barked"], answer: 0 },
                        { q: "Noah did not ( ___ ) to Singapore in 2015.", options: ["move", "moved"], answer: 0 },
                        { q: "The old lady did not ( ___ ) the road.", options: ["cross", "crossed"], answer: 0 },
                        { q: "The students ( ___ ) not afraid of the tiger.", options: ["were", "did"], answer: 0 },
                        { q: "We did not ( ___ ) with the toy gun.", options: ["play", "played"], answer: 0 },
                        { q: "I did not ( ___ ) Gary last night.", options: ["invite", "invited"], answer: 0 },
                        { q: "Uncle Tim ( ___ ) around the world in the 1990s.", options: ["travelled", "travel"], answer: 0 },
                        { q: "I did not ( ___ ) on the door.", options: ["knock", "knocked"], answer: 0 },
                        { q: "They did not ( ___ ) into the room.", options: ["enter", "entered"], answer: 0 }
                    ]
                }
            }
        };

        // 自動將英文標題轉換為中文標題的字典
        const themeTranslations = {
            "Simple Present Tense I": "現在簡單式 I",
            "Simple Present Tense II": "現在簡單式 II",
            "Simple Present Tense III": "現在簡單式 III",
            "Simple Present Tense IV": "現在簡單式 IV",
            "Present Continuous Tense I": "現在進行式 I",
            "Present Continuous Tense II": "現在進行式 II",
            "Present Continuous Tense III": "現在進行式 III",
            "Present Continuous Tense IV": "現在進行式 IV",
            "Have got I": "擁有 (Have got) I",
            "Have got II": "擁有 (Have got) II",
            "Modal Verbs": "情態動詞 (can / must)",
            "Imperatives": "祈使句",
            "There is/are I": "存在句 (There is/are) I",
            "There is/are II": "存在句 (There is/are) II",
            "Simple Past Tense I": "過去簡單式 I",
            "Simple Past Tense II": "過去簡單式 II"
        };

        let currentLevel = 1;
        let playQuestions = []; 
        let userAnswers = [];   
        let currentIndex = 0;

        /* 動態渲染首頁關卡按鈕 */
        window.onload = () => {
            renderHomeButtons();
        };

        const candyColors = [
            { bg: '#ff5252', shadow: '#c62828', text: '#fff' },
            { bg: '#ff4081', shadow: '#c2185b', text: '#fff' },
            { bg: '#7c4dff', shadow: '#512da8', text: '#fff' },
            { bg: '#00b0ff', shadow: '#01579b', text: '#fff' },
            { bg: '#00e676', shadow: '#1b5e20', text: '#fff' },
            { bg: '#ff9100', shadow: '#e65100', text: '#fff' } 
        ];

        function renderHomeButtons() {
            const container = document.getElementById("level-container");
            container.innerHTML = ""; 

            for(let key in gameData) {
                let i = parseInt(key);
                let highestScore = levelScores[i] !== undefined ? levelScores[i] : 0;
                
                let starDisplay = "";
                if (highestScore === 20) {
                    starDisplay = "<span style='font-size:2em; filter: drop-shadow(0 0 5px #ffeb3b);'>🌟</span>"; 
                } else if (highestScore >= 10) {
                    starDisplay = "<span style='font-size:1.5em; filter: drop-shadow(0 0 3px #ffeb3b);'>⭐</span>"; 
                } else {
                    starDisplay = "<span style='font-size:1.5em; opacity:0.4;'>⭐</span>"; 
                }

                // 完美分離標題邏輯，並套用中文翻譯
                let fullTitle = gameData[i].title;
                let titleParts = fullTitle.split(": ");
                let levelText = titleParts; // 例如 "Level 1"
                let englishTheme = titleParts[1] ? titleParts[1].trim() : ""; // 例如 "Simple Present Tense I"
                
                // 將英文主題轉換為中文，如果字典裡沒有就保留原本的英文
                let themeText = themeTranslations[englishTheme] || englishTheme;

                let colorInfo = candyColors[(i-1) % candyColors.length];

                let btn = document.createElement("button");
                btn.className = "level-btn";
                btn.style.backgroundColor = colorInfo.bg;
                btn.style.boxShadow = `0 8px 0 ${colorInfo.shadow}, 0 10px 20px rgba(0,0,0,0.2)`;
                btn.style.color = colorInfo.text;
                
                btn.innerHTML = `
                    <div style="font-size: 1.1em;">${levelText}</div>
                    <div class="level-title-text" style="color: ${colorInfo.shadow};">${themeText}</div>
                    <div style="margin-top: 5px;">${starDisplay}</div>
                    <div class="level-score" style="color: ${colorInfo.text};">最高分: ${highestScore}/20</div>
                `;
                btn.onclick = () => loadLevelIntro(i);
                container.appendChild(btn);
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0,0);
        }

        function loadLevelIntro(level) {
            currentLevel = level;
            const data = gameData[level];
            document.getElementById("intro-title").innerText = data.title;
            document.getElementById("intro-content").innerHTML = data.intro;
            showScreen("intro-screen");
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            const data = gameData[currentLevel];
            let easySelected = shuffle([...data.questions.easy]).slice(0, 10);
            let hardSelected = shuffle([...data.questions.hard]).slice(0, 10);
            
            playQuestions = [...easySelected, ...hardSelected];
            userAnswers = playQuestions.map(q => ({ qObj: q, selectedOption: null, isCorrect: false, answered: false }));
            currentIndex = 0;
            
            loadQuestion();
            showScreen("quiz-screen");
        }

        function loadQuestion() {
            updateHeader();
            const qData = userAnswers[currentIndex];
            document.getElementById("question-text").innerText = qData.qObj.q;
            document.getElementById("skip-btn").style.display = "none"; 
            
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";
            
            qData.qObj.options.forEach((opt, index) => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerHTML = `<span class="intro-speak-btn" style="border-color:#fff; color:#1976d2; box-shadow:none;" onclick="event.stopPropagation(); speak('${opt.replace(/'/g, "\\'")}')">🔊</span> ${opt}`;
                
                if (qData.answered) {
                    btn.disabled = true;
                    if (index === qData.qObj.answer) btn.style.backgroundColor = "var(--correct)";
                    else if (index === qData.selectedOption) btn.style.backgroundColor = "var(--wrong)";
                } else {
                    btn.onclick = () => handleAnswer(index, btn);
                }
                optionsContainer.appendChild(btn);
            });
            
            if (qData.answered && !qData.isCorrect) {
                document.getElementById("skip-btn").style.display = "inline-block";
            }
        }

        function updateHeader() {
            let difficulty = currentIndex < 10 ? "淺" : "深";
            document.getElementById("level-indicator").innerText = `${gameData[currentLevel].title}`;
            document.getElementById("progress-indicator").innerText = `題數: ${currentIndex + 1} / ${playQuestions.length} (${difficulty})`;

            let nextBtn = document.getElementById("next-btn");
            if (currentIndex === playQuestions.length - 1) {
                nextBtn.innerText = "完成並查看成績 📊";
                nextBtn.style.backgroundColor = "#E91E63";
                nextBtn.style.boxShadow = "0 4px 0 #AD1457";
            } else {
                nextBtn.innerText = "下一頁 ➡️";
                nextBtn.style.backgroundColor = "#ff9800";
                nextBtn.style.boxShadow = "0 4px 0 #e65100";
            }
        }

        function speakQuestion() {
            let q = userAnswers[currentIndex].qObj;
            speak(q.q.replace("( ___ )", "blank") + " . Options are: " + q.options.join(", "));
        }

        function handleAnswer(selectedIndex, btnElement) {
            let allBtns = document.querySelectorAll('#options-container .option-btn');
            allBtns.forEach(b => b.disabled = true); 

            let qData = userAnswers[currentIndex];
            qData.answered = true;
            qData.selectedOption = selectedIndex;
            qData.isCorrect = (selectedIndex === qData.qObj.answer);

            if (qData.isCorrect) {
                btnElement.style.backgroundColor = "var(--correct)";
                triggerExaggeratedEffect();
                setTimeout(() => nextQuestion(), 1500); 
            } else {
                btnElement.style.backgroundColor = "var(--wrong)";
                allBtns[qData.qObj.answer].style.backgroundColor = "var(--correct)";
                speak("Oops, try again next time.");
                document.getElementById("skip-btn").style.display = "inline-block";
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) { currentIndex--; loadQuestion(); }
        }
        
        function nextQuestion() {
            if (currentIndex < playQuestions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function triggerExaggeratedEffect() {
            speak("Excellent! Boom!");
            let effect = document.createElement('div');
            effect.className = 'exaggerated-effect';
            effect.innerText = "🌟 BINGO! 🎉";
            document.body.appendChild(effect);
            setTimeout(() => { effect.remove(); }, 1200);
        }

        function showSummary() {
            let correctCount = userAnswers.filter(ans => ans.isCorrect).length;
            let oldScore = levelScores[currentLevel] || 0;
            
            if (correctCount > oldScore) {
                levelScores[currentLevel] = correctCount;
                localStorage.setItem('teacherCatScores', JSON.stringify(levelScores));
                renderHomeButtons(); 
            }

            document.getElementById("final-score").innerText = `${correctCount} / ${playQuestions.length}`;
            
            let starEl = document.getElementById("result-star");
            if(correctCount === 20) {
                starEl.innerHTML = "🌟 滿分大星星！";
                document.getElementById("result-message").innerText = "太完美了！你是文法大師！";
            } else if (correctCount >= 10) {
                starEl.innerHTML = "⭐ 合格小星星！";
                document.getElementById("result-message").innerText = "做得好！繼續努力邁向滿分！";
            } else {
                starEl.innerHTML = "💪";
                document.getElementById("result-message").innerText = "別灰心，去重做錯題加分吧！";
            }

            let listHTML = "";
            userAnswers.forEach((ans, idx) => {
                let status = "";
                let bgStyle = "";
                
                if (ans.isCorrect) {
                    status = "✅ 答對";
                } else if (ans.answered) {
                    status = "❌ 答錯";
                    bgStyle = "background: #fff3e0;";
                } else {
                    status = "⚠️ 未作答";
                    bgStyle = "background: #f3e5f5;";
                }
                
                let btnHTML = ans.isCorrect ? "" : `<button class="retry-btn" onclick="openRetryMode(${idx})">重做這題加分!</button>`;
                
                listHTML += `
                    <div class="summary-item" style="${bgStyle}">
                        <div style="flex:1;"><b>Q${idx+1}:</b> ${ans.qObj.q} <br><span style="font-size:0.9em; color:#1976d2; font-weight:bold;">正確答案: ${ans.qObj.options[ans.qObj.answer]}</span></div>
                        <div style="width: 140px; text-align:right;">${status} <br> ${btnHTML}</div>
                    </div>`;
            });
            document.getElementById("summary-container").innerHTML = listHTML;
            showScreen("result-screen");
        }

        let retryTargetIndex = 0;

        function getTeacherCatHintText(level) {
            if (level <= 4) return "Teacher Cat 提示：留意主語是單數 (He, She, It) 還是眾數！Do 或 Does 後面的動詞要轉回原形哦！";
            if (level <= 8) return "Teacher Cat 提示：現在進行式，必須要有 is, am 或 are 加上 verb-ing 哦！";
            if (level <= 10) return "Teacher Cat 提示：He, She, It 用 has got，其他則用 have got！";
            if (level == 11) return "Teacher Cat 提示：Modal Verbs (can/must) 後面的動詞絕對不可以改變，要用原形！";
            if (level == 12) return "Teacher Cat 提示：祈使句直接用動詞原形開頭，不用加 you。否定就加 Do not！";
            if (level <= 14) return "Teacher Cat 提示：單一物件或不可數(如水、麵包)用 There is，多於一個用 There are！";
            return "Teacher Cat 提示：過去式 am/is 變 was，are 變 were。如果有 did not，後面的動詞要變回原形哦！";
        }

        function openRetryMode(index) {
            retryTargetIndex = index;
            
            let hintBox = document.getElementById("teacher-cat-hint");
            let hintMsg = getTeacherCatHintText(currentLevel);
            document.getElementById("hint-text").innerText = hintMsg;
            hintBox.style.display = "block";
            speakChinese("請聽 Teacher Cat 的提示再試一次吧！ " + hintMsg);
            
            const qData = userAnswers[index];
            document.getElementById("retry-question-text").innerText = qData.qObj.q;
            
            const optionsContainer = document.getElementById("retry-options-container");
            optionsContainer.innerHTML = "";
            
            qData.qObj.options.forEach((opt, optIndex) => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerHTML = `<span class="intro-speak-btn" style="border-color:#fff; color:#1976d2; box-shadow:none;" onclick="event.stopPropagation(); speak('${opt.replace(/'/g, "\\'")}')">🔊</span> ${opt}`;
                btn.onclick = () => handleRetryAnswer(optIndex, btn, qData.qObj.answer);
                optionsContainer.appendChild(btn);
            });
            
            showScreen("retry-screen");
        }

        function speakRetryQuestion() {
            let q = userAnswers[retryTargetIndex].qObj;
            speak(q.q.replace("( ___ )", "blank") + " . Options are: " + q.options.join(", "));
        }
        function speakHint() { speakChinese(getTeacherCatHintText(currentLevel)); }

        function handleRetryAnswer(selectedIndex, btnElement, correctIndex) {
            if (selectedIndex === correctIndex) {
                btnElement.style.backgroundColor = "var(--correct)";
                document.getElementById("teacher-cat-hint").style.display = "none";
                triggerExaggeratedEffect();
                
                userAnswers[retryTargetIndex].isCorrect = true; 
                userAnswers[retryTargetIndex].answered = true; 
                
                setTimeout(() => { showSummary(); }, 1500);
            } else {
                btnElement.style.backgroundColor = "var(--wrong)";
                btnElement.disabled = true; 
                speakChinese("還是錯了喔，請再仔細看看 Teacher Cat 提示！");
            }
        }
    </script>
</body>
</html>
