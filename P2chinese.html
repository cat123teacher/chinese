    function hideAll() {

    function showHome() { location.reload(); }

    function showIntro(level) {
        if (!levelData[level]) { alert("此關卡題目請補上資料！"); return; }
        currentLevel = level;
        hideAll();
        document.getElementById("intro-screen").classList.remove("hidden");

        document.getElementById("intro-teaching").innerHTML = levelData[level].teaching;

    function speakIntro(elementId) {
        let text = document.getElementById(elementId).innerText;
        speakText(text);
    }

    function getRandomItems(arr, count) {
        let shuffled = arr.slice(0), i = arr.length, min = i - count, temp, index;
        while (i-- > min) {
            index = Math.floor((i + 1) * Math.random());
            temp = shuffled[index]; shuffled[index] = shuffled[i]; shuffled[i] = temp;
        }
        return shuffled.slice(min);
    }

    function startGame() {
        retryMode = false;
        const data = levelData[currentLevel];
        let easyCount = data.easyPool ? data.easyPool.length : 0;
        let hardCount = data.hardPool ? data.hardPool.length : 0;
        
        let easyQ = easyCount > 0 ? getRandomItems(data.easyPool, Math.min(10, easyCount)) : [];
        let hardQ = hardCount > 0 ? getRandomItems(data.hardPool, Math.min(10, hardCount)) : [];
        
        currentQuestions = easyQ.concat(hardQ);
        userAnswers = new Array(currentQuestions.length).fill(null);
        currentQIndex = 0;
        
        hideAll();
        document.getElementById("game-screen").classList.remove("hidden");
        document.getElementById("game-level-title").innerText = data.title;
        loadQuestion();
    }

    function prevQuestion() { if (currentQIndex > 0) { currentQIndex--; loadQuestion(); } }
    function nextQuestion() {
        if (currentQIndex < currentQuestions.length - 1) { currentQIndex++; loadQuestion(); }
        else { showResult(); }
    }

    function skipQuestion() {
        if(!retryMode && userAnswers[currentQIndex] === null) {
            userAnswers[currentQIndex] = false; 
        }
        document.getElementById('skip-btn').classList.add('hidden');
        document.getElementById("hint-box").style.display = "none";
        
        if (retryMode) {
            showResult(); 
        } else {
            nextQuestion(); 
        }
    }

    function loadQuestion() {
        document.getElementById("hint-box").style.display = "none";
        document.getElementById("skip-btn").classList.add("hidden");
        
        let qData = currentQuestions[currentQIndex];
        
        if(retryMode) {
            document.getElementById("progress-text").innerText = `🔄 錯題重答挑戰`;
            showTeacherCatHint();
        } else {
            let difficulty = currentQIndex < 10 ? " (淺)" : " (深)";
            document.getElementById("progress-text").innerText = `題數: ${currentQIndex + 1} / ${currentQuestions.length} ${difficulty}`;
        }
        
        document.getElementById("question-text").innerText = qData.q;
        let optContainer = document.getElementById("options-container");
        optContainer.innerHTML = "";
        
        qData.options.forEach((opt, index) => {
            let row = document.createElement("div");
            row.className = "option-row";
            
            let btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, qData.a);
            
            let speakBtn = document.createElement("button");
            speakBtn.className = "speak-btn";
            speakBtn.innerText = "🔊";
            speakBtn.onclick = () => speakText(opt);
            
            row.appendChild(btn); row.appendChild(speakBtn);
            optContainer.appendChild(row);
        });
        
        // 已經移除 speakText(qData.q); 現在不會自動讀出題目
    }

    function showTeacherCatHint() {
        let hintBox = document.getElementById("hint-box");
        let hintText = document.getElementById("hint-text");
        let levelHint = levelData[currentLevel].teaching.replace(/<[^>]*>?/gm, ''); 
        hintText.innerText = levelHint + " 試著再選一次吧！";
        hintBox.style.display = "block";
        
        hintBox.classList.remove("shake");
        void hintBox.offsetWidth; 
        hintBox.classList.add("shake");
    }

    function checkAnswer(selectedIndex, correctIndex) {
        if (selectedIndex === correctIndex) {
            userAnswers[currentQIndex] = true; 
            
            document.getElementById('skip-btn').classList.add('hidden');
            document.getElementById("hint-box").style.display = "none";
            
            let currentScore = userAnswers.filter(a => a === true).length;
            let currentMax = maxScores[currentLevel] || 0;
            let isNewRecord = false;
            
            if (currentScore > currentMax) {
                maxScores[currentLevel] = currentScore;
                localStorage.setItem('teacherCatScores', JSON.stringify(maxScores));
                isNewRecord = true;
            }

            if (isNewRecord) {
                showSuccessEffect("🎊 答對了！<br>🏆 破最高分紀錄了！ 🎊");
                speakText("太棒了！答對了！破紀錄了！");
            } else {
                showSuccessEffect("🎊 答對了！太棒了！ 🎊");
                speakText("太棒了！答對了！");
            }
            
            setTimeout(() => {
                if (retryMode) {
                    showResult(); 
                } else {
                    nextQuestion();
                }
            }, 1800);

        } else {
            if(!retryMode && userAnswers[currentQIndex] === null) { userAnswers[currentQIndex] = false; }
            
            showTeacherCatHint();
            speakText("哎呀，答錯了。" + document.getElementById('hint-text').innerText);
            
            document.getElementById('skip-btn').classList.remove('hidden');
        }
    }

    function showSuccessEffect(htmlText) {
        let fx = document.getElementById("success-fx");

    }

        if (!retryMode) {

                speakText(`太厲害了！滿分 20 分！獲得大星星！`);
            } else if (correctCount >= 10) {
                speakText(`恭喜合格！獲得小星星！分數是 ${correctCount} 分。`);
            } else {
                speakText(`關卡完成，你的分數是 ${correctCount} 分。快來重答錯題吧！`);
            }
        }

        let summaryContainer = document.getElementById("summary-container");
        summaryContainer.innerHTML = "<h3>📝 答題總結：</h3>";
        
        currentQuestions.forEach((q, index) => {
            let item = document.createElement("div");
            item.className = "summary-item";
            
            let qText = document.createElement("span");
            qText.innerText = `第 ${index + 1} 題：${q.q}`;
            qText.style.flex = "1";
            
            let rightSide = document.createElement("div");
            rightSide.style.display = "flex";
            rightSide.style.alignItems = "center";
            rightSide.style.gap = "10px";
            
            let status = document.createElement("span");
            if (userAnswers[index] === true) {
                status.className = "correct-tag"; status.innerText = "✅ 答對";
                rightSide.appendChild(status);
            } else {
                status.className = "wrong-tag"; status.innerText = "❌ 答錯";
                
                let retryBtn = document.createElement("button");
                retryBtn.className = "btn";
                retryBtn.style.backgroundColor = "#ff5722";
                retryBtn.style.margin = "0";
                retryBtn.innerText = "🔄 重做";
                retryBtn.onclick = () => startRetry(index);
                
                rightSide.appendChild(status); 
                rightSide.appendChild(retryBtn);
            }
            
            item.appendChild(qText); 
            item.appendChild(rightSide);
            summaryContainer.appendChild(item);
        });
    }

    function startRetry(index) {
        retryMode = true;
        currentQIndex = index;
        hideAll();
        document.getElementById("game-screen").classList.remove("hidden");
        document.getElementById("game-level-title").innerText = "🔄 錯題重答挑戰";
        loadQuestion();
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance();
            msg.text = text; msg.lang = 'zh-HK'; msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }
    }
</script>
