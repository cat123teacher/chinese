<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>影輝10室・1室設計平面</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- Three.js r128 & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --app-height: 100dvh;
      --safari-bottom-pad: 68px;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    #app-shell {
      position: relative;
      width: 100vw;
      height: var(--app-height, 100dvh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #viewport-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 180px;
      min-width: 200px;
      overflow: hidden;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      z-index: 1;
    }
    #design-drawer {
      position: relative;
      z-index: 25;
      width: 100%;
      height: 44%;
      max-height: 480px;
      background: rgba(15, 23, 42, 0.97);
      backdrop-filter: blur(16px);
      border-top: 2px solid rgba(245, 158, 11, 0.55);
      display: flex;
      flex-direction: column;
      transition: height 0.25s ease, width 0.25s ease;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
    }
    #design-drawer.drawer-collapsed-portrait {
      height: 62px !important;
    }
    /* Safe bottom padding inside scrollable panels so iOS Safari floating URL bar never blocks last items */
    .safari-safe-scroll {
      padding-bottom: calc(env(safe-area-inset-bottom, 16px) + var(--safari-bottom-pad, 68px)) !important;
    }
    /* Dedicated Mobile Landscape Left-Right Split Layout */
    @media (orientation: landscape) and (max-height: 640px) {
      #app-shell {
        flex-direction: row !important;
      }
      #viewport-stage {
        flex: 1 1 56%;
        height: 100% !important;
      }
      #design-drawer {
        width: 44%;
        max-width: 460px;
        height: 100% !important;
        max-height: none !important;
        border-top: none;
        border-left: 2px solid rgba(245, 158, 11, 0.55);
      }
      #design-drawer.drawer-collapsed-landscape {
        width: 58px !important;
      }
      #design-drawer.drawer-collapsed-landscape .drawer-body-area,
      #design-drawer.drawer-collapsed-landscape .drawer-subbar {
        display: none !important;
      }
      #design-drawer.drawer-collapsed-landscape #primary-dock-nav {
        flex-direction: column !important;
        display: flex !important;
        height: 100%;
        overflow-y: auto;
      }
      .safari-safe-scroll {
        padding-bottom: calc(env(safe-area-inset-bottom, 12px) + 28px) !important;
      }
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input[type="range"] {
      accent-color: #f59e0b;
    }
    .dock-btn-active {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      color: #0f172a !important;
      font-weight: 900;
      box-shadow: 0 3px 12px rgba(245, 158, 11, 0.45);
      border-color: #fbbf24 !important;
    }
  </style>
</head>
<body class="select-none">

  <!-- Responsive Split Shell: Top/Bottom in Portrait, Left/Right in Mobile Landscape -->
  <div id="app-shell">

    <!-- A. 3D / 2D Interactive Stage Area -->
    <div id="viewport-stage">
      <div id="canvas-container"></div>

      <!-- Compact Top Floating Header inside 3D Stage -->
      <header class="absolute top-0 left-0 right-0 z-20 p-1.5 md:px-3 md:py-2 pointer-events-none flex items-center justify-between gap-1.5 flex-wrap">
        <!-- Brand Title & Unit Switcher (10室 vs 1室) -->
        <div class="pointer-events-auto bg-slate-900/95 backdrop-blur-md border border-slate-700/80 rounded-2xl px-2 py-1 shadow-xl flex items-center gap-2 flex-wrap">
          <div class="w-7 h-7 rounded-xl bg-amber-500 text-slate-950 flex flex-col items-center justify-center shrink-0 font-black shadow">
            <span class="text-[6px] tracking-widest leading-none">UNIT</span>
            <span id="unit-badge-num" class="text-xs mono leading-none">10</span>
          </div>
          <div class="flex items-center gap-1.5">
            <h1 id="main-app-title" class="text-xs md:text-sm font-black tracking-tight text-white">影輝10室設計平面</h1>
            <!-- Unit Switcher Pill Buttons -->
            <div class="flex items-center bg-slate-950 p-0.5 rounded-xl border border-slate-700">
              <button onclick="switchUnitLayout('10')" id="btn-unit-10" class="px-2 py-0.5 rounded-lg text-[10px] font-black bg-amber-500 text-slate-950 shadow transition">
                🏠 10室
              </button>
              <button onclick="switchUnitLayout('1')" id="btn-unit-1" class="px-2 py-0.5 rounded-lg text-[10px] font-bold text-slate-300 hover:text-white transition">
                🏠 1室
              </button>
            </div>
            <span id="active-template-badge" class="hidden sm:inline-block px-1.5 py-0.5 text-[9px] font-bold rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/30 truncate max-w-[110px] sm:max-w-none">
              01. 原裝清水房
            </span>
          </div>
        </div>

        <!-- Camera & Environment Quick Controls -->
        <div class="pointer-events-auto bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-2xl p-1 shadow-xl flex items-center gap-1 overflow-x-auto no-scrollbar max-w-full">
          <button onclick="setCameraView('2d')" id="btn-view-2d" class="px-2 py-1 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 transition shrink-0">
            📐 平面
          </button>
          <button onclick="setCameraView('3d')" id="btn-view-3d" class="px-2 py-1 rounded-xl text-[11px] font-bold bg-amber-500 text-slate-950 shadow transition shrink-0">
            🧊 3D立體
          </button>
          <button onclick="setCameraView('sea')" id="btn-view-sea" class="px-2 py-1 rounded-xl text-[11px] font-bold bg-slate-800 text-sky-300 hover:bg-slate-700 transition shrink-0">
            🌊 望海景
          </button>
          <button onclick="cycleWallHeight()" id="btn-wall-height" class="px-2 py-1 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 transition shrink-0">
            🧱 半高牆
          </button>
          <button onclick="toggleLightingMode()" id="btn-light-mode" class="px-2 py-1 rounded-xl text-[11px] font-bold bg-slate-800 text-amber-300 hover:bg-slate-700 transition shrink-0">
            ☀️ 日間
          </button>
          <button onclick="toggleDimensions()" id="btn-dims" class="px-2 py-1 rounded-xl text-[11px] font-bold bg-red-500/20 text-red-300 border border-red-400/30 transition shrink-0">
            📏 尺寸
          </button>
          <button onclick="takeSnapshot()" class="px-2 py-1 rounded-xl text-[11px] font-bold bg-emerald-500 text-slate-950 hover:bg-emerald-400 transition shrink-0">
            📸 截圖
          </button>
        </div>
      </header>

      <!-- Mobile-Friendly Floating Quick Action Bar (Appears when any furniture/appliance/lamp is selected) -->
      <div id="floating-action-bar" class="hidden absolute top-12 left-1/2 -translate-x-1/2 z-30 w-[95%] max-w-lg pointer-events-auto">
        <div class="bg-slate-900/95 backdrop-blur-md border-2 border-amber-500 rounded-2xl p-2 shadow-2xl flex flex-col gap-1.5">
          <div class="flex items-center justify-between gap-1.5 flex-wrap">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="px-1.5 py-0.5 text-[10px] font-black rounded bg-amber-500 text-slate-950 shrink-0">已選取</span>
              <span id="fab-item-name" class="text-xs font-black text-white truncate">傢俬名稱</span>
              <span id="fab-item-dims" class="text-[10px] mono text-amber-300 shrink-0">1200×600mm</span>
            </div>
            <div class="flex items-center gap-1 ml-auto">
              <button onclick="openInspectorModal()" class="px-2 py-1 rounded-xl bg-amber-500/20 border border-amber-400 text-amber-300 text-[11px] font-black">
                📏 改尺寸/色
              </button>
              <button onclick="deselectItem()" class="px-2 py-1 rounded-xl bg-slate-800 text-slate-300 hover:text-white text-xs font-bold">
                ✕
              </button>
            </div>
          </div>

          <div class="grid grid-cols-8 gap-1 text-center">
            <button onclick="rotateSelected(90)" class="col-span-2 py-1 rounded-xl bg-amber-500 text-slate-950 font-black text-xs shadow active:scale-95 transition">
              ↻ 轉90°
            </button>
            <button onclick="rotateSelected(45)" class="py-1 rounded-xl bg-slate-800 text-slate-200 font-bold text-xs active:scale-95">
              45°
            </button>
            <button onclick="nudgeSelected(-50, 0)" class="py-1 rounded-xl bg-slate-800 text-white font-bold text-xs active:scale-95">
              ◀
            </button>
            <button onclick="nudgeSelected(0, -50)" class="py-1 rounded-xl bg-slate-800 text-white font-bold text-xs active:scale-95">
              ▲
            </button>
            <button onclick="nudgeSelected(0, 50)" class="py-1 rounded-xl bg-slate-800 text-white font-bold text-xs active:scale-95">
              ▼
            </button>
            <button onclick="nudgeSelected(50, 0)" class="py-1 rounded-xl bg-slate-800 text-white font-bold text-xs active:scale-95">
              ▶
            </button>
            <button onclick="deleteSelected()" class="py-1 rounded-xl bg-red-500/30 border border-red-400/50 text-red-200 font-bold text-xs active:scale-95">
              🗑️
            </button>
          </div>
        </div>
      </div>

      <!-- Toast Status Pill (Floating cleanly at bottom of 3D stage, above menu bar) -->
      <div class="absolute bottom-2 left-1/2 -translate-x-1/2 z-20 pointer-events-none w-[94%] max-w-xl flex justify-center">
        <div id="status-toast" class="pointer-events-auto bg-slate-950/90 backdrop-blur-md border border-slate-700 px-3 py-1 rounded-full text-[11px] text-amber-300 font-bold shadow-lg truncate">
          ✨ 點選下方「20款範本」、「地板(24)」或「牆身(24)」即可開始設計
        </div>
      </div>
    </div>

    <!-- B. Ergonomic Design Drawer (Bottom in Portrait with TOP-PINNED Menu Bar, Right Side in Landscape) -->
    <section id="design-drawer">
      
      <!-- 1. PRIMARY 7-TAB MENU BAR PINNED AT THE TOP OF THE DRAWER (Never blocked by bottom Safari URL bar & always visible in Landscape!) -->
      <nav id="primary-dock-nav" class="bg-slate-950 px-1.5 py-1.5 border-b border-slate-800 grid grid-cols-7 gap-1 shrink-0">
        <button onclick="activateMainDock('templates')" id="dock-templates" class="py-1.5 px-0.5 rounded-xl bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex flex-col items-center justify-center gap-0.5">
          <span class="text-sm md:text-base leading-none">📋</span>
          <span class="text-[10px] font-bold leading-tight truncate max-w-full">20款範本</span>
        </button>
        <button onclick="activateMainDock('floors')" id="dock-floors" class="dock-btn-active py-1.5 px-0.5 rounded-xl bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex flex-col items-center justify-center gap-0.5">
          <span class="text-sm md:text-base leading-none">🪵</span>
          <span class="text-[10px] font-bold leading-tight truncate max-w-full">地板(24)</span>
        </button>
        <button onclick="activateMainDock('walls')" id="dock-walls" class="py-1.5 px-0.5 rounded-xl bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex flex-col items-center justify-center gap-0.5">
          <span class="text-sm md:text-base leading-none">🎨</span>
          <span class="text-[10px] font-bold leading-tight truncate max-w-full">牆身(24)</span>
        </button>
        <button onclick="activateMainDock('furniture')" id="dock-furniture" class="py-1.5 px-0.5 rounded-xl bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex flex-col items-center justify-center gap-0.5">
          <span class="text-sm md:text-base leading-none">🛋️</span>
          <span class="text-[10px] font-bold leading-tight truncate max-w-full">間牆/傢俬</span>
        </button>
        <button onclick="activateMainDock('appliances')" id="dock-appliances" class="py-1.5 px-0.5 rounded-xl bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex flex-col items-center justify-center gap-0.5">
          <span class="text-sm md:text-base leading-none">⚡</span>
          <span class="text-[10px] font-bold leading-tight truncate max-w-full">家電/浴缸</span>
        </button>
        <button onclick="activateMainDock('lighting')" id="dock-lighting" class="py-1.5 px-0.5 rounded-xl bg-slate-900 border border-slate-700/80 text-slate-200 hover:bg-slate-800 transition flex flex-col items-center justify-center gap-0.5">
          <span class="text-sm md:text-base leading-none">💡</span>
          <span class="text-[10px] font-bold leading-tight truncate max-w-full">燈具(20)</span>
        </button>
        <button onclick="openBomModal()" id="dock-bom" class="py-1.5 px-0.5 rounded-xl bg-sky-500/20 border border-sky-400/50 text-sky-300 hover:bg-sky-500/30 transition flex flex-col items-center justify-center gap-0.5">
          <span class="text-sm md:text-base leading-none">📦</span>
          <span class="text-[10px] font-bold leading-tight truncate max-w-full">清單(<span id="item-count-badge">0</span>)</span>
        </button>
      </nav>

      <!-- 2. Sub-Header with Current Section Title + Expand/Collapse Toggle -->
      <div class="drawer-subbar px-3 py-1.5 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <span id="sheet-title" class="text-xs font-black text-amber-400 truncate">🪵 分區地板設計 (24款私樓高清材質)</span>
          <span id="sheet-subtitle" class="text-[10px] text-slate-400 hidden xl:inline truncate">點擊3D地面或下方按鈕先選區域，再點選材質縮圖</span>
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <button onclick="cycleSafariSafePad()" id="btn-safari-pad" class="px-2 py-0.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-bold" title="調整底部預留高度，避開手機瀏覽器網址欄">
            ⬆️ 避開底欄: 高
          </button>
          <button onclick="toggleBottomSheet()" id="btn-sheet-toggle" class="px-2.5 py-0.5 rounded-lg bg-amber-500/20 border border-amber-400/40 text-amber-300 text-[11px] font-black">
            ▼ 收起面板
          </button>
        </div>
      </div>

      <!-- 3. Scrollable Drawer Body Area (With generous bottom safe clearance so last items scroll cleanly above Safari URL bar) -->
      <div class="drawer-body-area flex-1 flex flex-col min-h-0 overflow-hidden">

        <!-- TAB PANEL 1: 20 TEMPLATES -->
        <div id="tab-panel-templates" class="hidden flex-1 overflow-y-auto custom-scroll safari-safe-scroll p-2.5">
          <div id="templates-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- TAB PANEL 2: 24 ZONED FLOOR MATERIALS -->
        <div id="tab-panel-floors" class="flex-1 flex flex-col min-h-0">
          <div class="px-2.5 py-1.5 bg-slate-950/60 border-b border-slate-800/80 flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0">
            <span class="text-[10px] font-bold text-amber-300 shrink-0">📍 區域：</span>
            <div id="floor-zones-bar" class="flex items-center gap-1"></div>
          </div>
          <div id="floor-swatches-grid" class="flex-1 overflow-y-auto custom-scroll safari-safe-scroll p-2.5 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 content-start">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- TAB PANEL 3: 24 ZONED WALL MATERIALS -->
        <div id="tab-panel-walls" class="hidden flex-1 flex flex-col min-h-0">
          <div class="px-2.5 py-1.5 bg-slate-950/60 border-b border-slate-800/80 flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0">
            <span class="text-[10px] font-bold text-sky-300 shrink-0">📍 牆區：</span>
            <div id="wall-zones-bar" class="flex items-center gap-1"></div>
          </div>
          <div id="wall-swatches-grid" class="flex-1 overflow-y-auto custom-scroll safari-safe-scroll p-2.5 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 content-start">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- TAB PANEL 4: PARTITIONS & FURNITURE -->
        <div id="tab-panel-furniture" class="hidden flex-1 flex flex-col min-h-0">
          <div class="px-2.5 py-1.5 bg-slate-950/60 border-b border-slate-800 flex items-center gap-1 overflow-x-auto no-scrollbar shrink-0">
            <button onclick="filterFurnitureSubcat('partition')" id="subcat-partition" class="subcat-pill px-2.5 py-1 rounded-lg text-[11px] font-black bg-amber-500 text-slate-950 shrink-0">🧱 間牆及趟門</button>
            <button onclick="filterFurnitureSubcat('bed')" id="subcat-bed" class="subcat-pill px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 shrink-0">🛏️ 床及地台</button>
            <button onclick="filterFurnitureSubcat('storage')" id="subcat-storage" class="subcat-pill px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 shrink-0">🚪 衣櫃及鞋櫃</button>
            <button onclick="filterFurnitureSubcat('living')" id="subcat-living" class="subcat-pill px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 shrink-0">🛋️ 梳化/餐枱/書枱</button>
          </div>
          <div id="furniture-catalog-grid" class="flex-1 overflow-y-auto custom-scroll safari-safe-scroll p-2.5 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 content-start"></div>
        </div>

        <!-- TAB PANEL 5: 18 HOME APPLIANCES & SANITARYWARE -->
        <div id="tab-panel-appliances" class="hidden flex-1 overflow-y-auto custom-scroll safari-safe-scroll p-2.5 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 content-start"></div>

        <!-- TAB PANEL 6: 20 PRIVATE HOUSING LIGHTING FIXTURES -->
        <div id="tab-panel-lighting" class="hidden flex-1 overflow-y-auto custom-scroll safari-safe-scroll p-2.5 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 content-start"></div>

      </div>
    </section>

  </div>

  <!-- 4. Detailed Size & Color Modal (Opened when clicking "改尺寸/色" on mobile or desktop) -->
  <div id="inspector-modal" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-3 pointer-events-auto">
    <div class="bg-slate-900 border-2 border-amber-500/80 rounded-2xl w-full max-w-md p-4 shadow-2xl space-y-3 max-h-[85vh] overflow-y-auto custom-scroll">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <div>
          <span class="text-[10px] font-bold uppercase text-amber-400">精準毫米調整 & 材質顏色</span>
          <h3 id="modal-item-name" class="text-base font-black text-white">傢俬名稱</h3>
        </div>
        <button onclick="closeInspectorModal()" class="px-3 py-1 rounded-xl bg-slate-800 text-slate-200 text-xs font-bold">完成 ✓</button>
      </div>

      <!-- Sliders for W, D, H, Y -->
      <div class="space-y-2.5 bg-slate-950/70 p-3 rounded-xl border border-slate-800">
        <div class="flex justify-between text-xs">
          <span class="text-slate-400">闊度 (W): <strong id="lbl-ft-w" class="text-amber-400"></strong></span>
          <div class="flex items-center gap-1">
            <input type="number" id="inp-w" step="50" min="100" max="4500" onchange="updateSelectedDimsFromInput()" class="w-20 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-right text-amber-300 mono text-xs font-bold">
            <span class="text-[10px] text-slate-400 mono">mm</span>
          </div>
        </div>
        <input type="range" id="rng-w" min="150" max="4200" step="50" oninput="updateSelectedDimsFromSlider('w', this.value)" class="w-full h-2 bg-slate-800 rounded-lg cursor-pointer">

        <div class="flex justify-between text-xs pt-1">
          <span class="text-slate-400">深度/厚 (D): <strong id="lbl-ft-d" class="text-amber-400"></strong></span>
          <div class="flex items-center gap-1">
            <input type="number" id="inp-d" step="25" min="50" max="4000" onchange="updateSelectedDimsFromInput()" class="w-20 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-right text-amber-300 mono text-xs font-bold">
            <span class="text-[10px] text-slate-400 mono">mm</span>
          </div>
        </div>
        <input type="range" id="rng-d" min="50" max="3200" step="25" oninput="updateSelectedDimsFromSlider('d', this.value)" class="w-full h-2 bg-slate-800 rounded-lg cursor-pointer">

        <div class="flex justify-between text-xs pt-1">
          <span class="text-slate-400">高度 (H):</span>
          <div class="flex items-center gap-1">

    // ============================================================================
    // 1. REALISTIC 1024x1024 PROCEDURAL TEXTURE & BUMP MAP GENERATOR
    // ============================================================================
    const textureCache = {};

    function generateSurfaceCanvas(style, size = 512) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');

      ctx.fillStyle = style.base || '#d4b895';
      ctx.fillRect(0, 0, size, size);

      const type = style.pattern || 'wood_straight';

      if (type === 'wood_straight' || type === 'wood_wide') {
        const planks = type === 'wood_wide' ? 3 : 5;
        const pW = size / planks;
        for (let i = 0; i < planks; i++) {
          const x0 = i * pW;
          ctx.fillStyle = i % 2 === 0 ? style.base : (style.sec || style.base);
          ctx.fillRect(x0, 0, pW, size);

          ctx.strokeStyle = style.grain || 'rgba(60,35,15,0.22)';
          ctx.lineWidth = 1.5;
          for (let g = 0; g < 26; g++) {
            const gx = x0 + (g / 26) * pW;
            ctx.beginPath();
            ctx.moveTo(gx, 0);
            ctx.bezierCurveTo(
              gx + Math.sin(g + i) * 10, size * 0.33,
              gx - Math.cos(g + i) * 10, size * 0.66,
              gx, size
            );
            ctx.stroke();
          }

          const kx = x0 + pW * (0.3 + ((i * 37) % 40) / 100);
          const ky = size * (0.2 + ((i * 53) % 60) / 100);
          for (let r = 3; r <= 16; r += 4) {
            ctx.beginPath();
            ctx.ellipse(kx, ky, r * 0.55, r * 1.45, 0, 0, Math.PI * 2);
            ctx.stroke();
          }

          ctx.strokeStyle = 'rgba(20,12,6,0.45)';
          ctx.lineWidth = 2.5;
          ctx.strokeRect(x0, 0, pW, size);
          const jointY = ((i * 173) % (size - 80)) + 40;
          ctx.beginPath();
          ctx.moveTo(x0, jointY);
          ctx.lineTo(x0 + pW, jointY);
          ctx.stroke();
        }
      } else if (type === 'wood_diag45') {
        ctx.save();
        ctx.translate(size / 2, size / 2);
        ctx.rotate(Math.PI / 4);
        const span = size * 1.5;
        const pW = size / 5;
        for (let x = -span; x < span; x += pW) {
          ctx.fillStyle = Math.abs(Math.round(x / pW)) % 2 === 0 ? style.base : (style.sec || style.base);
          ctx.fillRect(x, -span, pW, span * 2);
          ctx.strokeStyle = style.grain || 'rgba(55,30,12,0.25)';
          ctx.lineWidth = 1.4;
          for (let g = 4; g < pW; g += 6) {
            ctx.beginPath();
            ctx.moveTo(x + g, -span);
            ctx.lineTo(x + g + Math.sin(g) * 8, span);
            ctx.stroke();
          }
          ctx.strokeStyle = 'rgba(20,10,5,0.45)';
          ctx.lineWidth = 2.2;
          ctx.strokeRect(x, -span, pW, span * 2);
        }
        ctx.restore();
      } else if (type === 'chevron' || type === 'herringbone') {
        const cols = 4;
        const rows = 8;
        const cw = size / cols;
        const rh = size / rows;
        for (let col = 0; col < cols; col++) {
          for (let row = -2; row < rows + 2; row++) {
            const x0 = col * cw;
            const y0 = row * rh;
            const dir = col % 2 === 0 ? 1 : -1;
            ctx.fillStyle = (col + row) % 2 === 0 ? style.base : (style.sec || style.base);
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x0 + cw, y0 + dir * (rh * 0.65));
            ctx.lineTo(x0 + cw, y0 + rh + dir * (rh * 0.65));
            ctx.lineTo(x0, y0 + rh);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = style.grain || 'rgba(40,22,8,0.35)';
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        }
      } else if (type === 'marble') {
        for (let c = 0; c < 6; c++) {
          const grd = ctx.createRadialGradient(
            (c * 97) % size, (c * 151) % size, 10,
            (c * 97) % size, (c * 151) % size, size * 0.6
          );
          grd.addColorStop(0, style.sec || 'rgba(180,180,180,0.18)');
          grd.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = grd;
          ctx.fillRect(0, 0, size, size);
        }
        ctx.strokeStyle = style.grain || 'rgba(100,110,125,0.42)';
        for (let v = 0; v < 7; v++) {
          ctx.lineWidth = (v % 3 === 0) ? 2.8 : 1.2;
          ctx.beginPath();
          let vx = (v * 83) % size;
          let vy = 0;
          ctx.moveTo(vx, vy);
          while (vy < size) {
            vy += 32;
            vx += Math.sin(vy * 0.04 + v) * 22;
            ctx.lineTo(vx, vy);
          }
          ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(120,120,120,0.28)';
        ctx.lineWidth = 2;
        ctx.strokeRect(2, 2, size - 4, size - 4);
      } else if (type === 'terrazzo') {
        const colors = [style.sec || '#94a3b8', style.grain || '#d97706', '#475569', '#f8fafc', '#cbd5e1'];
        for (let i = 0; i < 140; i++) {
          ctx.fillStyle = colors[i % colors.length];
          const rx = (i * 73) % size;
          const ry = (i * 139) % size;
          const rad = 4 + (i % 12);
          ctx.beginPath();
          ctx.moveTo(rx, ry);
          ctx.lineTo(rx + rad, ry + 3);
          ctx.lineTo(rx + rad * 0.6, ry + rad);
          ctx.lineTo(rx - 3, ry + rad * 0.7);
          ctx.closePath();
          ctx.fill();
        }
      } else if (type === 'slat') {
        const slats = 16;
        const sw = size / slats;
        for (let i = 0; i < slats; i++) {
          ctx.fillStyle = style.base;
          ctx.fillRect(i * sw, 0, sw * 0.72, size);
          ctx.fillStyle = style.grain || '#1e1b18';
          ctx.fillRect(i * sw + sw * 0.72, 0, sw * 0.28, size);
        }
      } else if (type === 'stucco' || type === 'microcement') {
        for (let i = 0; i < 45; i++) {
          ctx.fillStyle = i % 2 === 0 ? (style.sec || 'rgba(255,255,255,0.08)') : (style.grain || 'rgba(0,0,0,0.06)');
          ctx.beginPath();
          ctx.arc((i * 89) % size, (i * 131) % size, 30 + (i % 50), 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'tile_grid') {
        const cells = 4;
        const step = size / cells;
        ctx.strokeStyle = style.grain || 'rgba(100,116,139,0.45)';
        ctx.lineWidth = 3;
        for (let i = 0; i <= cells; i++) {
          ctx.beginPath();
          ctx.moveTo(i * step, 0); ctx.lineTo(i * step, size);
          ctx.moveTo(0, i * step); ctx.lineTo(size, i * step);
          ctx.stroke();
        }
      }
      return c;
    }

    function getThreeMaterialTexture(style, repeatCount = 3) {
      const key = `${style.id}_${repeatCount}`;
      if (textureCache[key]) return textureCache[key];
      const canvas = generateSurfaceCanvas(style, 512);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatCount, repeatCount);
      textureCache[key] = tex;
      return tex;
    }

    function getThumbnailDataUrl(style) {

      const canvas = generateSurfaceCanvas(style, 160);
      const url = canvas.toDataURL('image/jpeg', 0.86);
      thumbCache[style.id] = url;
      return url;
    }

    function createDimensionSprite(text, bgColor = '#dc2626') {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 104;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = bgColor;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.roundRect(14, 10, 484, 84, 22);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = bgColor;
      ctx.font = '900 36px "JetBrains Mono", "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 52);

      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(920, 190, 1);
      sprite.renderOrder = 999;
      return sprite;
    }

    function createBoxWithEdges(w, h, d, x, y, z, material, edgeColor = 0x1e293b, parent = structureRootGroup) {
      const geom = new THREE.BoxGeometry(w, h, d);
      geom.translate(w / 2, h / 2, d / 2);
      const mesh = new THREE.Mesh(geom, material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      const edges = new THREE.EdgesGeometry(geom);
      const lineMat = new THREE.LineBasicMaterial({ color: edgeColor, transparent: true, opacity: 0.35 });
      mesh.add(new THREE.LineSegments(edges, lineMat));
      parent.add(mesh);
      return mesh;
    }

    function initApp() {

      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(1700, 0, 4200);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2 - 0.02;
      controls.minDistance = 1800;
      controls.maxDistance = 26000;
      controls.touches = {

      hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.92);

      dirLight = new THREE.DirectionalLight(0xfffbeb, 0.78);

      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;

      dirLight.shadow.camera.bottom = -d;
      dirLight.shadow.camera.near = 1000;
      dirLight.shadow.camera.far = 26000;

      const grid = new THREE.GridHelper(18000, 36, 0x334155, 0x1e293b);

    function clearUnitStructureMeshes() {
      while (structureRootGroup.children.length > 0) {
        structureRootGroup.remove(structureRootGroup.children[0]);
      }
      while (dimensionGroup.children.length > 0) {
        dimensionGroup.remove(dimensionGroup.children[0]);
      }
      Object.keys(floorZoneMeshes).forEach(k => delete floorZoneMeshes[k]);
      Object.keys(wallZoneMeshes).forEach(k => delete wallZoneMeshes[k]);
      structuralWalls.length = 0;
      glassMeshes.length = 0;
      fixedDoors.length = 0;
    }

    function rebuildActiveUnitStructure() {
      clearUnitStructureMeshes();
      if (currentUnit === '1') {
        buildFlat1ZonedStructure();
        buildFlat1DimensionLabels();
      } else {
        buildFlat10ZonedStructure();
        buildOriginalDimensionLabels();
      }
      applyCurrentWallHeightToStructure();
    }

    function applyCurrentWallHeightToStructure() {
      const targetH = wallHeightMode === 'low' ? 450 : (wallHeightMode === 'half' ? 1300 : 2550);
      structuralWalls.forEach(w => { w.mesh.scale.y = Math.min(targetH, w.maxH); });
      fixedDoors.forEach(d => { d.scale.y = Math.min(targetH - 80, 2100); });
      glassMeshes.forEach(g => {
        if (wallHeightMode === 'low') {
          g.mesh.visible = false;
        } else {
          g.mesh.visible = true;
          g.mesh.position.y = Math.min(g.sillH, targetH);
          g.mesh.scale.y = wallHeightMode === 'half' ? 450 : g.fullWinH;
        }
      });
    }

    // ============================================================================

    // ============================================================================
    function addFloorZoneSlabCommon(zoneId, w, d, x, z, repeatCount = 3) {
      const st = FLOOR_STYLES.find(s => s.id === zoneFloorAssignment[zoneId]) || FLOOR_STYLES[0];
      const tex = getThreeMaterialTexture(st, repeatCount);
      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        bumpMap: tex,
        bumpScale: 3.5,
        roughness: st.rough || 0.4,
        metalness: 0.05
      });
      const mesh = createBoxWithEdges(w, 150, d, x, -150, z, mat, 0x475569);
      mesh.userData = { isFloorZone: true, zoneId };
      if (!floorZoneMeshes[zoneId]) floorZoneMeshes[zoneId] = [];
      floorZoneMeshes[zoneId].push({ mesh, repeatCount });
      return mesh;
    }

    function addZonedStructWallCommon(wallZoneId, x, z, w, d, normalVec = null, maxH = 2600) {
      const st = WALL_STYLES.find(s => s.id === zoneWallAssignment[wallZoneId]) || WALL_STYLES[0];
      const tex = getThreeMaterialTexture(st, 2);
      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        bumpMap: tex,
        bumpScale: 2.2,
        roughness: 0.5,
        transparent: true,
        opacity: 1.0
      });
      const mesh = createBoxWithEdges(w, 1, d, x, 0, z, mat, 0x334155);
      mesh.scale.y = 1300;
      mesh.userData = { isWallZone: true, wallZoneId };
      structuralWalls.push({ mesh, normal: normalVec, maxH });
      if (!wallZoneMeshes[wallZoneId]) wallZoneMeshes[wallZoneId] = [];
      wallZoneMeshes[wallZoneId].push(mesh);
      return mesh;
    }

    function addWinSegCommon(wallZoneId, x, z, w, d, sillH = 850, winH = 1400) {
      addZonedStructWallCommon(wallZoneId, x, z, w, d, null, sillH);
      const gMat = new THREE.MeshPhysicalMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.38,
        roughness: 0.1
      });
      const gMesh = createBoxWithEdges(w, 1, d, x, sillH, z, gMat, 0x0284c7);
      gMesh.scale.y = 450;
      glassMeshes.push({ mesh: gMesh, sillH, fullWinH: winH });
    }

    // Coordinate transformer so all 20 Templates automatically fit Unit 1 (1室) as well as Unit 10 (10室)
    function transformTemplateItemForUnit1(item) {
      const copy = { ...item };
      // Unit 1 is vertically mirrored around the bathroom/wing axis (~Z = 3980 in Unit 10 -> ~Z = 2185 in Unit 1)
      // 1. Left middle wing items (X < 0): shift Z from [3150..5300] to [2515..4665]
      if (copy.x < 0) {
        copy.z = Math.max(2580, Math.min(4550, copy.z - 635));
        return copy;
      }
      // 2. Items that were in Unit 10's bottom 4525mm LIV/DIN & Master Bedroom (Z >= 5000) -> Move to Unit 1's top 4525mm zone (Z: 0..2885)
      if (copy.z >= 5000) {
        copy.z = Math.max(120, Math.min(2720, 7965 - copy.z));
        return copy;
      }
      // 3. Items that were in Unit 10's top-left room / foyer (Z < 3000) -> Move to Unit 1's bottom-left 2400mm zone / foyer (Z: 3850..6050)
      if (copy.z < 3000) {
        if (copy.id === 'foyer_cabinet') {
          copy.x = 2950;
          copy.z = 5950;
          return copy;
        }
        if (copy.id === 'app_fridge_2d') {
          copy.x = 3400;
          copy.z = 4850;
          return copy;
        }
        // Adapt partition walls & furniture for Unit 1's bottom-left room (X: 0..2350, Z: 3800..6100)
        copy.x = Math.min(2350, copy.x);
        copy.z = Math.max(3820, Math.min(5950, 6165 - copy.z * 0.72));
        return copy;
      }
      // 4. Middle corridor / dining / bathroom items (3000 <= Z < 5000)
      if (copy.id === 'app_bathtub_long' || copy.id === 'app_bathtub_jp') {
        copy.z = 3950;
        return copy;
      }
      if (copy.id === 'app_wash_tower') {
        copy.x = 4150;
        copy.z = 4800;
        return copy;
      }
      copy.z = Math.max(2800, Math.min(4400, 6900 - copy.z));
      return copy;
    }

    // ============================================================================
    function applyFloorMaterialToZone(styleId, targetZone = selectedFloorZone) {
      const st = FLOOR_STYLES.find(s => s.id === styleId);
      if (!st) return;

      const zonesToUpdate = targetZone === 'ALL'
        ? ['liv', 'foyer', 'rm_left', 'rm_top', 'rm_bot']
        : [targetZone];

      zonesToUpdate.forEach(zId => {
        zoneFloorAssignment[zId] = styleId;
        const list = floorZoneMeshes[zId] || [];
        list.forEach(entry => {
          const tex = getThreeMaterialTexture(st, entry.repeatCount);
          entry.mesh.material.map = tex;
          entry.mesh.material.bumpMap = tex;
          entry.mesh.material.bumpScale = 3.5;
          entry.mesh.material.roughness = st.rough || 0.4;
          entry.mesh.material.needsUpdate = true;
        });
      });

      renderFloorZonesAndSwatches();
      const zName = FLOOR_ZONES.find(z => z.id === targetZone)?.name || '選取區域';
      showToast(`已將「${zName}」地板更換為：${st.name}`);
    }

    // ============================================================================
    // 9. PROCEDURAL 3D MESH BUILDER FOR FURNITURE, APPLIANCES & 20 LAMPS
    // ============================================================================
    function createFurnitureGroup(itemData) {
      const group = new THREE.Group();
      const { w, d, h, color, type } = itemData;

      const isGlass = type === 'glass_slider' || color === '#7dd3fc';
      const isLamp = itemData.cat === 'lighting';
      const mainMat = isGlass
        ? new THREE.MeshPhysicalMaterial({ color, transparent: true, opacity: 0.48, roughness: 0.15 })
        : new THREE.MeshStandardMaterial({
            color,
            roughness: 0.45,
            emissive: isLamp ? new THREE.Color(color) : new THREE.Color(0x000000),
            emissiveIntensity: isLamp ? (isNightMode ? 0.85 : 0.35) : 0
          });
      const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.35 });
      const glowMat = new THREE.MeshStandardMaterial({
        color: 0xfef08a,
        emissive: 0xfde047,
        emissiveIntensity: isNightMode ? 1.2 : 0.6
      });

      function part(pw, ph, pd, px, py, pz, mat = mainMat) {
        const g = new THREE.BoxGeometry(pw, ph, pd);
        const m = new THREE.Mesh(g, mat);
        m.position.set(px, py + ph / 2, pz);
        m.castShadow = !isLamp;
        m.receiveShadow = true;
        const edges = new THREE.EdgesGeometry(g);
        m.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.35 })));
        group.add(m);
        return m;
      }

      if (type === 'bed_single' || type === 'bed_double') {
        part(w, h * 0.55, d, 0, 0, 0, mainMat);
        part(w * 0.94, h * 0.32, d * 0.92, 0, h * 0.55, d * 0.02, whiteMat);
        part(w, h * 1.35, Math.min(110, d * 0.08), 0, 0, -d / 2 + 55, mainMat);
        if (type === 'bed_double') {
          part(w * 0.36, 90, 280, -w * 0.22, h * 0.87, -d * 0.34, mainMat);
          part(w * 0.36, 90, 280, w * 0.22, h * 0.87, -d * 0.34, mainMat);
        } else {
          part(w * 0.62, 90, 280, 0, h * 0.87, -d * 0.34, mainMat);
        }
      } else if (type === 'bunk_bed') {
        const bedW = w * 0.8;
        const stairW = w * 0.2;
        part(bedW, 300, d, -stairW / 2, 0, 0, mainMat);
        part(bedW * 0.94, 120, d * 0.9, -stairW / 2, 300, 0, whiteMat);
        part(bedW, 140, d, -stairW / 2, h * 0.56, 0, mainMat);
        part(bedW * 0.94, 120, d * 0.9, -stairW / 2, h * 0.56 + 140, 0, whiteMat);
        part(stairW, h * 0.22, d, bedW / 2, 0, 0, mainMat);
        part(stairW, h * 0.22, d * 0.68, bedW / 2, h * 0.22, -d * 0.16, mainMat);
        part(stairW, h * 0.22, d * 0.36, bedW / 2, h * 0.44, -d * 0.32, mainMat);
      } else if (type === 'sofa') {
        part(w, h * 0.48, d, 0, 0, 0, mainMat);
        part(w * 0.24, h * 0.52, d, -w * 0.38, h * 0.48, 0, mainMat);
        part(w, h * 0.32, Math.min(160, d * 0.12), 0, h * 0.48, -d / 2 + 80, mainMat);
        part(w, h * 0.32, Math.min(160, d * 0.12), 0, h * 0.48, d / 2 - 80, mainMat);
      } else if (type === 'sofa_l') {
        part(w * 0.6, h * 0.48, d, -w * 0.2, 0, 0, mainMat);
        part(w * 0.4, h * 0.48, d * 0.42, w * 0.3, 0, d * 0.29, mainMat);
        part(w * 0.2, h * 0.52, d, -w * 0.4, h * 0.48, 0, mainMat);
      } else if (type === 'dining_set' || type === 'table_simple' || type === 'desk' || type === 'desk_double') {
        part(w, 60, d, 0, h - 60, 0, mainMat);
        const legT = 65;
        part(legT, h - 60, legT, -w / 2 + 50, 0, -d / 2 + 50, darkMat);
        part(legT, h - 60, legT, w / 2 - 50, 0, -d / 2 + 50, darkMat);
        part(legT, h - 60, legT, -w / 2 + 50, 0, d / 2 - 50, darkMat);
        part(legT, h - 60, legT, w / 2 - 50, 0, d / 2 - 50, darkMat);
      } else if (type === 'bathtub') {
        part(w, h, d, 0, 0, 0, whiteMat);
        const waterMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.65, roughness: 0.1 });
        part(w * 0.84, 40, d * 0.78, 0, h - 55, 0, waterMat);
      } else if (type === 'appliance_washer' || type === 'appliance_tower') {
        part(w, h, d, 0, 0, 0, mainMat);
        // Drum window
        part(w * 0.55, w * 0.55, 35, 0, h * 0.25, d / 2, darkMat);
        if (type === 'appliance_tower') {
          part(w * 0.55, w * 0.55, 35, 0, h * 0.68, d / 2, darkMat);
        }
      } else if (type === 'lamp_ring' || type === 'lamp_pendant') {
        const cylG = new THREE.CylinderGeometry(w / 2, w / 2, Math.min(120, h), 24);
        const cylM = new THREE.Mesh(cylG, glowMat);
        cylM.position.set(0, Math.min(60, h / 2), 0);
        group.add(cylM);
      } else if (type === 'lamp_track' || type === 'lamp_linear' || type === 'lamp_cove') {
        part(w, h, d, 0, 0, 0, mainMat);
        part(w * 0.92, 18, d * 0.6, 0, -8, 0, glowMat);
      } else {
        part(w, h, d, 0, 0, 0, mainMat);
      }

      // Add warm point light for lamps when in night mode
      if (isLamp && isNightMode) {
        const pt = new THREE.PointLight(0xffedd5, 0.7, 3800);
        pt.position.set(0, -80, 0);
        group.add(pt);
      }

      // Selection Highlight Box
      const ringGeom = new THREE.EdgesGeometry(new THREE.BoxGeometry(w + 60, h + 40, d + 60));
      ringGeom.translate(0, (h + 40) / 2, 0);
      const ringMat = new THREE.LineBasicMaterial({ color: 0xf59e0b, linewidth: 2 });
      const selectionBox = new THREE.LineSegments(ringGeom, ringMat);
      selectionBox.name = 'selectionHighlight';
      selectionBox.visible = (selectedItem && selectedItem.uid === itemData.uid);
      group.add(selectionBox);

      const maxVisualH = wallHeightMode === 'low' ? 500 : (wallHeightMode === 'half' ? 1350 : 2600);
      if (itemData.cat === 'partition' || (!isLamp && itemData.h > 1600)) {
        group.scale.y = Math.min(1, maxVisualH / itemData.h);
      }

      group.position.set(itemData.x, itemData.y || 0, itemData.z);
      group.rotation.y = THREE.MathUtils.degToRad(itemData.rot || 0);
      group.userData = { itemUid: itemData.uid };

      return group;
    }

    function addFurnitureFromCatalog(catId, customCoords = null) {
      const tpl = CATALOG_ITEMS.find(c => c.id === catId);
      if (!tpl) return null;

      const spawnX = customCoords ? customCoords.x : Math.round((controls.target.x + (Math.random() * 200 - 100)) / 50) * 50;
      const spawnZ = customCoords ? customCoords.z : Math.round((controls.target.z + (Math.random() * 200 - 100)) / 50) * 50;

      const newItem = {
        uid: nextUid++,
        id: tpl.id,
        cat: tpl.cat,
        name: tpl.name,
        type: tpl.type,
        w: customCoords?.w || tpl.w,
        d: customCoords?.d || tpl.d,
        h: customCoords?.h || tpl.h,
        y: customCoords?.y !== undefined ? customCoords.y : (tpl.y || 0),
        x: spawnX,
        z: spawnZ,
        rot: customCoords?.rot || 0,
        color: customCoords?.color || tpl.color,
        mesh: null
      };

      const meshGroup = createFurnitureGroup(newItem);
      scene.add(meshGroup);
      newItem.mesh = meshGroup;
      placedItems.push(newItem);

      updateItemCountBadge();
      if (!customCoords) {
        selectItem(newItem);
        showToast(`已加入「${newItem.name}」，可用單指拖拉擺位或用上方快捷列轉向`);
      }
      return newItem;
    }

    function rebuildItemMesh(item) {
      if (item.mesh) scene.remove(item.mesh);
      item.mesh = createFurnitureGroup(item);
      scene.add(item.mesh);
    }

    // ============================================================================
    // 10. TOUCH / MOUSE INTERACTION (DRAG FURNITURE OR TAP 3D FLOOR/WALL ZONE)
    // ============================================================================
    function getNormalizedPointer(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function findClickedFurniture(e) {
      getNormalizedPointer(e);
      raycaster.setFromCamera(pointer, camera);

      const meshes = [];
      placedItems.forEach(item => {
        if (item.mesh) {
          item.mesh.traverse(child => {
            if (child.isMesh) meshes.push(child);
          });
        }
      });

      const hits = raycaster.intersectObjects(meshes, false);
      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj && (!obj.userData || !obj.userData.itemUid)) {
          obj = obj.parent;
        }
        if (obj && obj.userData.itemUid) {
          return placedItems.find(it => it.uid === obj.userData.itemUid);
        }
      }
      return null;
    }

    function findClickedZoneSurface(e) {
      getNormalizedPointer(e);
      raycaster.setFromCamera(pointer, camera);

      const zoneMeshes = [];
      Object.values(floorZoneMeshes).forEach(list => list.forEach(entry => zoneMeshes.push(entry.mesh)));
      Object.values(wallZoneMeshes).forEach(list => list.forEach(m => zoneMeshes.push(m)));

      const hits = raycaster.intersectObjects(zoneMeshes, false);
      if (hits.length > 0) {
        return hits[0].object.userData;
      }
      return null;
    }

    function onPointerDown(e) {
      pointerDownPos = { x: e.clientX, y: e.clientY };
      const hitItem = findClickedFurniture(e);

      if (hitItem) {
        selectItem(hitItem);
        isDraggingItem = true;
        controls.enabled = false;

        floorDragPlane.constant = -(hitItem.y || 0);
        raycaster.setFromCamera(pointer, camera);
        if (raycaster.ray.intersectPlane(floorDragPlane, dragIntersectPoint)) {
          dragOffset.subVectors(hitItem.mesh.position, dragIntersectPoint);
        }
      }
    }

    function onPointerMove(e) {
      if (!isDraggingItem || !selectedItem) return;

      getNormalizedPointer(e);
      raycaster.setFromCamera(pointer, camera);

      if (raycaster.ray.intersectPlane(floorDragPlane, dragIntersectPoint)) {
        let nx = Math.round((dragIntersectPoint.x + dragOffset.x) / 50) * 50;
        let nz = Math.round((dragIntersectPoint.z + dragOffset.z) / 50) * 50;

        nx = Math.max(-2200, Math.min(6200, nx));
        nz = Math.max(-100, Math.min(8100, nz));

        selectedItem.x = nx;
        selectedItem.z = nz;
        selectedItem.mesh.position.x = nx;
        selectedItem.mesh.position.z = nz;
      }
    }

    function onPointerUp(e) {
      if (isDraggingItem) {
        isDraggingItem = false;
        controls.enabled = true;
      } else {
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (dist < 6) {
          const hitItem = findClickedFurniture(e);
          if (!hitItem) {
            deselectItem();
            // Check if user tapped a 3D Floor or Wall Zone directly
            const surf = findClickedZoneSurface(e);
            if (surf && surf.isFloorZone) {
              selectedFloorZone = surf.zoneId;
              renderFloorZonesAndSwatches();
              const zName = FLOOR_ZONES.find(z => z.id === surf.zoneId)?.name || '';
              showToast(`📍 已點選「${zName}」地面，請於下方點選 24 款地板材質即時鋪設`);
            } else if (surf && surf.isWallZone) {
              selectedWallZone = surf.wallZoneId;
              renderWallZonesAndSwatches();
              const zName = WALL_ZONES.find(z => z.id === surf.wallZoneId)?.name || '';
              showToast(`📍 已點選「${zName}」，可切換至「牆身(24)」分頁換色`);
            }
          }
        }
      }
    }

    function selectItem(item) {
      selectedItem = item;
      placedItems.forEach(it => {
        if (!it.mesh) return;
        const ring = it.mesh.getObjectByName('selectionHighlight');
        if (ring) ring.visible = (it.uid === item.uid);
      });

      const fab = document.getElementById('floating-action-bar');
      fab.classList.remove('hidden');
      document.getElementById('fab-item-name').textContent = item.name;
      document.getElementById('fab-item-dims').textContent = `${item.w}×${item.d}×${item.h}mm`;
    }

    function deselectItem() {
      selectedItem = null;
      placedItems.forEach(it => {
        if (!it.mesh) return;
        const ring = it.mesh.getObjectByName('selectionHighlight');
        if (ring) ring.visible = false;
      });
      document.getElementById('floating-action-bar').classList.add('hidden');
    }

    function rotateSelected(deltaDeg) {
      if (!selectedItem) return;
      selectedItem.rot = ((selectedItem.rot || 0) + deltaDeg) % 360;
      selectedItem.mesh.rotation.y = THREE.MathUtils.degToRad(selectedItem.rot);
    }

    function duplicateSelected() {
      if (!selectedItem) return;
      const copy = addFurnitureFromCatalog(selectedItem.id, {
        x: selectedItem.x + 250,
        z: selectedItem.z + 250,
        w: selectedItem.w,
        d: selectedItem.d,
        h: selectedItem.h,

    function deleteSelected() {
      if (!selectedItem) return;
      scene.remove(selectedItem.mesh);
      placedItems = placedItems.filter(it => it.uid !== selectedItem.uid);
      deselectItem();
      updateItemCountBadge();
    }

    function nudgeSelected(dx, dz) {
      if (!selectedItem) return;
      selectedItem.x += dx;
      selectedItem.z += dz;
      selectedItem.mesh.position.x = selectedItem.x;
      selectedItem.mesh.position.z = selectedItem.z;

    function toggleBottomSheet() {
      const drawer = document.getElementById('design-drawer');
      const btn = document.getElementById('btn-sheet-toggle');
      const isLandscape = window.innerWidth > window.innerHeight && window.innerHeight <= 640;

      sheetCollapsed = !sheetCollapsed;
      if (sheetCollapsed) {
        if (isLandscape) {
          drawer.classList.add('drawer-collapsed-landscape');
          btn.textContent = '◀ 展開';
        } else {
          drawer.classList.add('drawer-collapsed-portrait');
          btn.textContent = '▲ 展開選單';
        }
      } else {
        drawer.classList.remove('drawer-collapsed-landscape', 'drawer-collapsed-portrait');
        btn.textContent = isLandscape ? '▶ 收起面板' : '▼ 收起面板';
      }
      setTimeout(onWindowResize, 260);
    }

    function applyTemplateById(tplId) {
      const tpl = TWENTY_TEMPLATES.find(t => t.id === tplId);
      if (!tpl) return;
      currentTemplateId = tplId;

      // Clear existing items
      placedItems.forEach(it => { if (it.mesh) scene.remove(it.mesh); });
      placedItems = [];
      deselectItem();

      // Apply Zoned Floors
      if (tpl.floors) {
        Object.entries(tpl.floors).forEach(([zId, stId]) => {
          applyFloorMaterialToZone(stId, zId);
        });
      }

      // Apply Zoned Walls
      if (tpl.walls) {
        Object.entries(tpl.walls).forEach(([wId, stId]) => {
          applyWallMaterialToZone(stId, wId);
        });
      }

      // Spawn Furniture, Appliances & Lighting (Automatically adapted for Unit 10 or Unit 1)
      if (Array.isArray(tpl.items)) {
        tpl.items.forEach(d => {
          const itemCoords = currentUnit === '1' ? transformTemplateItemForUnit1(d) : d;
          addFurnitureFromCatalog(d.id, itemCoords);
        });
      }

      updateItemCountBadge();
      const badge = document.getElementById('active-template-badge');
      if (badge) badge.textContent = tpl.name.split('：')[0];
      showToast(`✅ 已於「${currentUnit}室」載入範本：「${tpl.name}」`);
    }

        <div class="mt-2 pt-1 border-t border-slate-700/60 flex items-center justify-between text-[10px] text-sky-300 font-bold">
          <span>高 ${item.h}mm</span>
          <span>＋ 加入平面</span>
        </div>
      `;
      return card;
    }

    function renderFurnitureSubcat(subcat) {
      const grid = document.getElementById('furniture-catalog-grid');
      grid.innerHTML = '';
      CATALOG_ITEMS.filter(it => it.cat === subcat).forEach(it => {
        grid.appendChild(createCatalogCardElement(it));
      });
    }

    function renderAppliancesPanel() {
      const grid = document.getElementById('tab-panel-appliances');
      grid.innerHTML = '';
      CATALOG_ITEMS.filter(it => it.cat === 'appliances').forEach(it => {
        grid.appendChild(createCatalogCardElement(it));
      });
    }

    function renderLightingPanel() {
      const grid = document.getElementById('tab-panel-lighting');
      grid.innerHTML = '';
      CATALOG_ITEMS.filter(it => it.cat === 'lighting').forEach(it => {
        grid.appendChild(createCatalogCardElement(it));
      });
    }

    function renderInspectorSwatches() {
      const container = document.getElementById('furniture-swatches');
      container.innerHTML = '';
      FURNITURE_SWATCHES.forEach(sw => {
        const btn = document.createElement('button');
        btn.className = 'w-9 h-9 rounded-xl border border-white/30 hover:scale-110 transition shadow';
        btn.style.backgroundColor = sw.hex;
        btn.title = sw.name;
        btn.onclick = () => {
          if (!selectedItem) return;
          selectedItem.color = sw.hex;
          rebuildItemMesh(selectedItem);
        };
        container.appendChild(btn);
      });
    }

    // ============================================================================
    // 13. CAMERA VIEWS, DAY/NIGHT LIGHTING MODE, BOM & SNAPSHOT
    // ============================================================================
    function setCameraView(mode) {
      if (!camera || !controls) return;
      if (mode === '2d') {
        camAnim = {
          startPos: camera.position.clone(),
          endPos: new THREE.Vector3(1700, 14500, currentUnit === '1' ? 3100 : 4210),
          startTarget: controls.target.clone(),
          endTarget: new THREE.Vector3(1700, 0, currentUnit === '1' ? 3090 : 4200),
          progress: 0
        };
      } else if (mode === '3d') {
        camAnim = {
          startPos: camera.position.clone(),
          endPos: new THREE.Vector3(-4800, 9200, currentUnit === '1' ? 11200 : 13200),
          startTarget: controls.target.clone(),
          endTarget: new THREE.Vector3(1700, 0, currentUnit === '1' ? 3200 : 4500),
          progress: 0
        };
      } else if (mode === 'sea') {
        camAnim = {
          startPos: camera.position.clone(),
          endPos: currentUnit === '1'
            ? new THREE.Vector3(1500, 3200, -4200)
            : new THREE.Vector3(1500, 3200, 11800),
          startTarget: controls.target.clone(),
          endTarget: currentUnit === '1'
            ? new THREE.Vector3(1800, 300, 1500)
            : new THREE.Vector3(1800, 300, 5200),
          progress: 0
        };
      }

      ['2d', '3d', 'sea'].forEach(m => {
        const b = document.getElementById(`btn-view-${m}`);
        if (!b) return;
        b.className = m === mode
          ? 'px-2 py-1 rounded-xl text-[11px] font-bold bg-amber-500 text-slate-950 shadow transition shrink-0'
          : 'px-2 py-1 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 transition shrink-0';
      });
    }

    function cycleWallHeight() {
      const order = ['half', 'low', 'full'];
      wallHeightMode = order[(order.indexOf(wallHeightMode) + 1) % order.length];

      applyCurrentWallHeightToStructure();
      placedItems.forEach(it => rebuildItemMesh(it));
      const labels = { low: '🧱 矮牆', half: '🧱 半高牆', full: '🧱 全高牆' };
      document.getElementById('btn-wall-height').textContent = labels[wallHeightMode];
    }

    function toggleLightingMode() {
      isNightMode = !isNightMode;
      hemiLight.intensity = isNightMode ? 0.35 : 0.92;
      dirLight.intensity = isNightMode ? 0.28 : 0.78;
      scene.background.setHex(isNightMode ? 0x050811 : 0x0b1120);

      placedItems.forEach(it => {
        if (it.cat === 'lighting') rebuildItemMesh(it);
      });

      const btn = document.getElementById('btn-light-mode');
      btn.textContent = isNightMode ? '🌙 夜間開燈' : '☀️ 日間';
      showToast(isNightMode ? '已切換至「🌙 夜間開燈氣氛模式」，全屋燈具已亮起暖光' : '已切換至「☀️ 日間明亮自然光模式」');
    }

    function toggleDimensions() {
      dimsVisible = !dimsVisible;
      dimensionGroup.visible = dimsVisible;
    }

    function updateItemCountBadge() {
      document.getElementById('item-count-badge').textContent = placedItems.length;
    }

    function showToast(msg) {
      const el = document.getElementById('status-toast');
      if (el) el.textContent = `✨ ${msg}`;
    }

    function openBomModal() {
      const modal = document.getElementById('bom-modal');
      const content = document.getElementById('bom-content');
      modal.classList.remove('hidden');

      let html = `
        <div class="p-3 rounded-xl bg-slate-800/80 border border-slate-700 space-y-1.5">
          <div class="font-black text-amber-400">🪵 7大區域地板配置：</div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-[11px]">
            ${FLOOR_ZONES.filter(z => z.id !== 'ALL').map(z => {
              const st = FLOOR_STYLES.find(s => s.id === zoneFloorAssignment[z.id]);
              return `<div><span class="text-slate-400">${z.name}：</span><strong class="text-white">${st ? st.name : ''}</strong></div>`;
            }).join('')}
          </div>
          <div class="font-black text-sky-400 pt-2 border-t border-slate-700">🎨 分區牆身配置：</div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-[11px]">
            ${WALL_ZONES.filter(z => z.id !== 'ALL').map(z => {
              const st = WALL_STYLES.find(s => s.id === zoneWallAssignment[z.id]);
              return `<div><span class="text-slate-400">${z.name}：</span><strong class="text-white">${st ? st.name : ''}</strong></div>`;
            }).join('')}
          </div>
        </div>
      `;

      if (placedItems.length === 0) {
        html += `<div class="p-6 text-center text-slate-400">目前為原裝清水房狀態，尚未加入任何間牆、傢俬或電器。</div>`;
      } else {
        html += `<table class="w-full text-left border-collapse mt-2">
          <thead>
            <tr class="border-b border-slate-700 text-slate-400">
              <th class="py-1.5 px-2">#</th>
              <th class="py-1.5 px-2">項目名稱</th>
              <th class="py-1.5 px-2">尺寸 (闊W × 深D × 高H)</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800">
            ${placedItems.map((it, idx) => `
              <tr>
                <td class="py-1.5 px-2 mono text-slate-400">${idx + 1}</td>
                <td class="py-1.5 px-2 font-bold text-white">${it.name}</td>
                <td class="py-1.5 px-2 mono text-amber-300 font-bold">${it.w} × ${it.d} × ${it.h} mm</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
      }
      content.innerHTML = html;
    }

    function closeBomModal() {
      document.getElementById('bom-modal').classList.add('hidden');
    }

    function copyBomText() {
      let txt = `【影輝10室設計平面 — 分區建材及傢俬家電清單】\n`;
      FLOOR_ZONES.filter(z => z.id !== 'ALL').forEach(z => {
        const st = FLOOR_STYLES.find(s => s.id === zoneFloorAssignment[z.id]);
        txt += `• ${z.name}地板：${st ? st.name : ''}\n`;
      });
      WALL_ZONES.filter(z => z.id !== 'ALL').forEach(z => {
        const st = WALL_STYLES.find(s => s.id === zoneWallAssignment[z.id]);
        txt += `• ${z.name}：${st ? st.name : ''}\n`;
      });
      txt += `\n【全屋間牆、傢俬、家電及燈具 (${placedItems.length}件)】\n`;
      placedItems.forEach((it, idx) => {
        txt += `${idx + 1}. ${it.name}：${it.w} × ${it.d} × ${it.h} mm\n`;
      });

      const ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);

      const btn = document.getElementById('btn-copy-bom');
      btn.textContent = '✅ 已複製！';
      setTimeout(() => { btn.textContent = '📄 複製報價清單'; }, 2000);
    }

    function saveDesignToLocal() {
      const payload = {
        floors: zoneFloorAssignment,
        walls: zoneWallAssignment,
        items: placedItems.map(it => ({
          id: it.id, x: it.x, z: it.z, w: it.w, d: it.d, h: it.h, y: it.y, rot: it.rot, color: it.color
        }))
      };
      try {
        localStorage.setItem('yingfai_flat10_v3', JSON.stringify(payload));
        showToast('已儲存你的分區地板、牆身及全屋設計進度！');
      } catch (e) {}
    }

    function loadDesignFromLocal() {
      try {
        const raw = localStorage.getItem('yingfai_flat10_v3');
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.floors) {
          Object.entries(data.floors).forEach(([zId, stId]) => applyFloorMaterialToZone(stId, zId));
        }
        if (data.walls) {
          Object.entries(data.walls).forEach(([wId, stId]) => applyWallMaterialToZone(stId, wId));
        }
        if (Array.isArray(data.items) && data.items.length > 0) {
          data.items.forEach(d => addFurnitureFromCatalog(d.id, d));
        }
      } catch (e) {}
    }

    function takeSnapshot() {
      renderer.render(scene, camera);
      const dataUrl = renderer.domElement.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = '影輝10室設計平面.png';
      link.href = dataUrl;
      link.click();
      showToast('已匯出高清 3D 設計圖 PNG！');
    }

    function updateSmartWallTransparency() {
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      structuralWalls.forEach(w => {
        if (!w.normal) return;
        const dot = w.normal.dot(camDir);
        w.mesh.material.opacity = dot < -0.25 ? 0.22 : 0.96;
      });
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      if (!container || !renderer || !camera) return;
      const w = Math.max(100, container.clientWidth);
      const h = Math.max(100, container.clientHeight);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (camAnim) {
        camAnim.progress += 0.08;
        if (camAnim.progress >= 1) {
          camera.position.copy(camAnim.endPos);
          controls.target.copy(camAnim.endTarget);
          camAnim = null;
        } else {
          const t = 1 - Math.pow(1 - camAnim.progress, 3);
          camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, t);
          controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, t);
        }
      }

      controls.update();
      updateSmartWallTransparency();
      renderer.render(scene, camera);
    }

    window.onload = initApp;
  </script>
</body>
</html>
