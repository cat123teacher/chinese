<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1B默書三(趣味默書)練習</title>
    <style>
        /* ================= 基礎設定 ================= */
        body {
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation; /* 適合平板與手機觸控 */
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 600px;
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }
        .active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= 漸層立體 3D 大按鈕 ================= */
        .btn-3d {
            background: linear-gradient(to bottom, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 16px;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 8px 0 #d2536b, 0 15px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            text-align: center;
            width: 100%;
            margin-bottom: 15px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-3d:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 transparent;
        }
        .btn-3d.green {
            background: linear-gradient(to bottom, #43e97b 0%, #38f9d7 100%);
            box-shadow: 0 8px 0 #28a745, 0 15px 15px rgba(0,0,0,0.1);
        }

        /* ================= 田字格答題紙與題目 ================= */
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .badge {
            background: #ffeaa7;
            color: #d63031;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #fdcb6e;
        }
        .q-box {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2d3436;
        }
        .tian-zi-ge {
            width: 100%;
            height: 90px;
            margin: 0 auto 25px auto;
            border: 4px solid #ff7675;
            border-radius: 10px;
            background-color: #fff;
            /* 模擬田字格的十字虛線與實線 */
            background-image: 
                linear-gradient(to right, rgba(255,118,117,0.6) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(255,118,117,0.6) 2px, transparent 2px),
                linear-gradient(to right, rgba(255,118,117,0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,118,117,0.2) 1px, transparent 1px);
            background-size: 90px 90px, 90px 90px, 45px 45px, 45px 45px;
            background-position: center top;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            letter-spacing: 15px;
            font-family: 'Kaiti', 'STKaiti', 'BiauKai', serif;
            color: #0984e3;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        /* ================= 4 個選項按鈕 ================= */
        .grid-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .opt-btn {
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 18px;
            padding: 20px 10px;
            font-size: 1.6rem;
            font-weight: bold;
            box-shadow: 0 8px 0 #00a4b3;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .opt-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 transparent;
        }
        .opt-btn.selected {
            background: linear-gradient(to bottom, #f6d365 0%, #fda085 100%);
            box-shadow: 0 8px 0 #d97d62;
        }

        /* ================= 底部導航 ================= */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            gap: 10px;
        }
        .nav-btn {
            flex: 1;
            padding: 15px 5px;
            border-radius: 15px;
            border: none;
            background: #dfe6e9;
            color: #2d3436;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 6px 0 #b2bec3;
            cursor: pointer;
        }
        .nav-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 transparent;
        }

        /* ================= 結算頁溫習清單與龍虎榜 ================= */
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            margin-bottom: 15px;
            border: 3px solid #ffeaa7;
            text-align: center;
        }
        .review-list {
            text-align: left;
            margin-top: 15px;
        }
        .review-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #ccc;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .speak-btn {
            background: #ffeaa7;
            border: 2px solid #fdcb6e;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.2rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 #e1b12c;
        }
        .speak-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        input[type="text"] {
            padding: 15px;
            font-size: 1.3rem;
            border-radius: 15px;
            border: 2px solid #74b9ff;
            width: 90%;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        /* 龍虎榜樣式 */
        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 5px;
            border-bottom: 1px solid #eee;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- 主頁 -->
<div id="home" class="container active">
    <h1 style="text-align: center; color: #ff7675; margin-bottom: 5px; font-size: 1.8rem;">📝 1B默書三(趣味默書)</h1>
    <p style="text-align: center; color: #636e72; font-weight: bold; margin-top: 0;">點擊下方按鈕開始挑戰 12 題</p>
    
    <button class="btn-3d" onclick="startGame()">🚀 開始默書挑戰！</button>
    
    <div class="card" style="border-color: #74b9ff;">
        <h2 style="margin-top: 0; color: #0984e3; font-size: 1.4rem;">🏆 雲端即時龍虎榜</h2>
        <div style="font-size: 0.9rem; color: #00b894; margin-bottom: 10px; font-weight: bold;" id="syncStatus">🟢 雲端同步中...</div>
        <div id="leaderboardList">
            <div style="color: #999;">載入排名中...</div>
        </div>
    </div>
</div>

<!-- 遊戲作答頁 -->
<div id="game" class="container">
    <div class="q-header">
        <div class="badge" id="progressText">第 1 / 12 題</div>
        <div class="badge" id="timerText" style="background:#81ecec; border-color:#00cec9; color:#00b894;">⏱️ 00:00</div>
    </div>

    <!-- 老師題目 -->
    <div style="color: #636e72; font-weight: bold; font-size: 1rem; margin-bottom: 5px;">聽普通話，看題目：</div>
    <div class="q-box">
        <span id="questionText">🌙 ＿＿的月亮</span>
        <button class="speak-btn" onclick="speakCurrentQuestion()" style="margin-left: 10px;">🔊</button>
    </div>

    <!-- 田字格答題紙 -->
    <div style="color: #636e72; font-weight: bold; font-size: 1rem; margin-bottom: 5px;">✍️ 你的答題紙：</div>
    <div class="tian-zi-ge" id="writingPaper">＿＿的月亮</div>

    <!-- 4 個選項 -->
    <div class="grid-options" id="optionsGrid"></div>

    <!-- 底部導航 -->
    <div class="nav-bar">
        <button class="nav-btn" onclick="prevQuestion()" id="prevBtn" style="visibility: hidden;">⬅️ 上一頁</button>
        <button class="nav-btn" onclick="goHome()">🏠 回主頁</button>
        <button class="nav-btn" onclick="nextQuestion()" id="nextBtn">下一頁 ➡️</button>
    </div>
</div>

<!-- 結算頁 -->
<div id="result" class="container">
    <h1 style="text-align: center; color: #ff7675; margin-bottom: 10px;">🎉 挑戰完成！</h1>
    
    <div class="card">
        <div id="starsDisplay" style="font-size: 2rem; margin-bottom: 10px;">⭐⭐⭐</div>
        <div style="font-size: 1.5rem; font-weight: bold;">答對題數：<span id="scoreText" style="color: #d63031; font-size: 2rem;">0</span> / 12</div>
        <div style="font-size: 1.2rem; color: #0984e3; margin-top: 10px; font-weight: bold;">所需時間：<span id="timeText">00:00</span></div>
    </div>

    <div class="card" id="submitBox" style="border-color: #00b894; background: #f3fff9;">
        <h3 style="margin-top: 0; color: #00b894;">📝 登錄排名</h3>
        <input type="text" id="playerName" placeholder="輸入名字 (如: 林煒晴)" maxlength="12">
        <button class="btn-3d green" id="submitBtn" onclick="submitScore()">🚀 提交成績看排名</button>
    </div>

    <button class="btn-3d" onclick="startGame()">🔄 再玩一次</button>
    <button class="btn-3d" style="background: linear-gradient(to bottom, #74b9ff 0%, #0984e3 100%); box-shadow: 0 8px 0 #005f9e;" onclick="goHome()">🏠 看龍虎榜</button>

    <div class="card">
        <h3 style="margin-top: 0; color: #6c5ce7;">📖 全卷 12 題溫習清單</h3>
        <div class="review-list" id="reviewList"></div>
    </div>
</div>

<!-- ================= 遊戲邏輯與 Firebase 整合 ================= -->
<script type="module">
    // --- 題庫資料 (保留了您擴充的 120 個豐富例子，確保每次玩都不一樣) ---
    const dictationData = {
        "香甜": [{n:"的蘋果",e:"🍎"},{n:"的芒果",e:"🥭"},{n:"的草莓",e:"🍓"},{n:"的果汁",e:"🧃"},{n:"的西瓜",e:"🍉"},{n:"的蜜糖",e:"🍯"},{n:"的雪糕",e:"🍦"},{n:"的蛋糕",e:"🍰"},{n:"的菠蘿",e:"🍍"},{n:"的水蜜桃",e:"🍑"}],
        "尖尖": [{n:"的鉛筆",e:"✏️"},{n:"的牙齒",e:"🦷"},{n:"的指甲",e:"💅"},{n:"的刀子",e:"🔪"},{n:"的樹枝",e:"🌿"},{n:"的針",e:"🪡"},{n:"的屋頂",e:"🏠"},{n:"的山峰",e:"⛰️"},{n:"的剪刀",e:"✂️"},{n:"的角",e:"🦄"}],
        "閃亮": [{n:"的星星",e:"🌟"},{n:"的鑽石",e:"💎"},{n:"的眼睛",e:"👀"},{n:"的燈光",e:"💡"},{n:"的寶石",e:"💍"},{n:"的皇冠",e:"👑"},{n:"的鏡子",e:"🪞"},{n:"的戒指",e:"💍"},{n:"的項鍊",e:"📿"},{n:"的陽光",e:"☀️"}],
        "高高": [{n:"的大廈",e:"🏢"},{n:"的山",e:"🏔️"},{n:"的樹木",e:"🌳"},{n:"的長頸鹿",e:"🦒"},{n:"的塔",e:"🗼"},{n:"的圍牆",e:"🧱"},{n:"的雲",e:"☁️"},{n:"的梯子",e:"🪜"},{n:"的摩天輪",e:"🎡"},{n:"的橋",e:"🌉"}],
        "潔白": [{n:"的牙齒",e:"😁"},{n:"的雪",e:"❄️"},{n:"的雲",e:"☁️"},{n:"的紙",e:"📄"},{n:"的羽毛",e:"🪶"},{n:"的天鵝",e:"🦢"},{n:"的牆壁",e:"⬜"},{n:"的裙子",e:"👗"},{n:"的襯衫",e:"👔"},{n:"的花朵",e:"🌼"}],
        "彎彎": [{n:"的月亮",e:"🌙"},{n:"的小河",e:"🏞️"},{n:"的香蕉",e:"🍌"},{n:"的小路",e:"🛣️"},{n:"的眉毛",e:"🤨"},{n:"的橋",e:"🌉"},{n:"的彩虹",e:"🌈"},{n:"的梳子",e:"🪮"},{n:"的微笑",e:"😊"},{n:"的弓",e:"🏹"}],
        "明亮": [{n:"的教室",e:"🏫"},{n:"的眼睛",e:"👁️"},{n:"的房間",e:"🛋️"},{n:"的月光",e:"🌕"},{n:"的燈泡",e:"💡"},{n:"的星空",e:"🌌"},{n:"的早上",e:"🌅"},{n:"的窗戶",e:"🪟"},{n:"的火光",e:"🔥"},{n:"的太陽",e:"☀️"}],
        "美麗": [{n:"的花朵",e:"🌸"},{n:"的公主",e:"👸"},{n:"的風景",e:"🏞️"},{n:"的蝴蝶",e:"🦋"},{n:"的衣服",e:"👚"},{n:"的彩虹",e:"🌈"},{n:"的天空",e:"🌤️"},{n:"的圖畫",e:"🖼️"},{n:"的故事",e:"📖"},{n:"的香港",e:"🇭🇰"}],
        "好看": [{n:"的圖書",e:"📚"},{n:"的電影",e:"🎬"},{n:"的電視",e:"📺"},{n:"的表演",e:"🎪"},{n:"的衣服",e:"👕"},{n:"的裙子",e:"👗"},{n:"的鞋子",e:"👟"},{n:"的卡通",e:"🧸"},{n:"的漫畫",e:"📙"},{n:"的顏色",e:"🎨"}],
        "圓圓": [{n:"的皮球",e:"⚽"},{n:"的西瓜",e:"🍉"},{n:"的臉蛋",e:"👶"},{n:"的月亮",e:"🌕"},{n:"的太陽",e:"☀️"},{n:"的車輪",e:"🛞"},{n:"的眼睛",e:"👀"},{n:"的餅乾",e:"🍪"},{n:"的雞蛋",e:"🥚"},{n:"的硬幣",e:"🪙"}],
        "甜甜": [{n:"的糖果",e:"🍬"},{n:"的笑容",e:"😄"},{n:"的巧克力",e:"🍫"},{n:"的草莓",e:"🍓"},{n:"的果汁",e:"🍹"},{n:"的雪糕",e:"🍨"},{n:"的蛋糕",e:"🎂"},{n:"的夢",e:"💭"},{n:"的聲音",e:"🎵"},{n:"的蜜糖",e:"🍯"}],
        "香香": [{n:"的花朵",e:"🌺"},{n:"的飯菜",e:"🍱"},{n:"的麵包",e:"🍞"},{n:"的香水",e:"🧴"},{n:"的洗頭水",e:"🫧"},{n:"的番皂",e:"🧼"},{n:"的餅乾",e:"🍪"},{n:"的烤肉",e:"🍖"},{n:"的茶",e:"🍵"},{n:"的草地",e:"🌱"}]
    };
    const adjectives = Object.keys(dictationData);

    // --- 遊戲狀態變數 ---
    let questions = [], currentQ = 0, answers = [], timer, startTime, totalSec = 0, score = 0;

    // --- 普通話語音設定 ---
    window.speak = function(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        const mandarin = voices.find(v => (v.lang.includes('zh-CN') || v.lang.includes('cmn') || v.lang.includes('zh-TW')) && !v.lang.includes('HK') && !v.name.includes('Cantonese') && !v.name.includes('粵'));
        if (mandarin) u.voice = mandarin;
        u.lang = 'zh-CN';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
    };

    // --- 遊戲流程 ---
    window.showPage = id => {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0, 0);
    };
    window.goHome = () => { clearInterval(timer); showPage('home'); };

    function formatTime(s) {
        return String(Math.floor(s/60)).padStart(2,'0') + ":" + String(s%60).padStart(2,'0');
    }

    window.startGame = () => {
        // 隨機抽 12 題 (每次組合不同)
        let shuffled = [...adjectives].sort(() => 0.5 - Math.random());
        questions = shuffled.map(adj => {
            let item = dictationData[adj][Math.floor(Math.random() * dictationData[adj].length)];
            let otherAdjs = adjectives.filter(a => a !== adj).sort(() => 0.5 - Math.random());
            let options = [adj, otherAdjs[0], otherAdjs[1], otherAdjs[2]].sort(() => 0.5 - Math.random());
            return { adj, noun: item.n, emoji: item.e, options, qText: "＿＿" + item.n };
        });

        currentQ = 0; answers = new Array(12).fill(null); totalSec = 0;
        
        // 重設結算頁 UI
        document.getElementById('submitBox').style.display = 'block';
        if(document.getElementById('submitBtn')) document.getElementById('submitBtn').disabled = false;

        clearInterval(timer);
        startTime = Date.now();
        document.getElementById('timerText').innerText = `⏱️ 00:00`;
        timer = setInterval(() => {
            totalSec = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('timerText').innerText = `⏱️ ${formatTime(totalSec)}`;
        }, 500);

        renderQuestion();
        showPage('game');
    };

    window.speakCurrentQuestion = () => {
        let q = questions[currentQ];
        speak(answers[currentQ] ? answers[currentQ] + q.noun : "甚麼" + q.noun);
    };

    function renderQuestion() {
        let q = questions[currentQ];
        document.getElementById('progressText').innerText = `第 ${currentQ + 1} / 12 題`;
        document.getElementById('questionText').innerText = `${q.emoji} ${q.qText}`;
        speak("甚麼" + q.noun);
        
        let paper = document.getElementById('writingPaper');
        paper.innerText = answers[currentQ] ? answers[currentQ] + q.noun : "＿＿" + q.noun;
        paper.style.color = answers[currentQ] ? '#0984e3' : '#b2bec3'; // 填入後變色

        let grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';
        q.options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'opt-btn' + (answers[currentQ] === opt ? ' selected' : '');
            btn.innerText = opt;
            btn.onclick = () => {
                answers[currentQ] = opt;
                speak(opt + q.noun);
                paper.innerText = opt + q.noun;
                paper.style.color = '#0984e3';
                Array.from(grid.children).forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                setTimeout(() => { if(currentQ < 11) { currentQ++; renderQuestion(); } else { finishGame(); } }, 400);
            };
            grid.appendChild(btn);
        });

        document.getElementById('prevBtn').style.visibility = currentQ > 0 ? 'visible' : 'hidden';
        let nextBtn = document.getElementById('nextBtn');
        if (currentQ === 11) {
            nextBtn.innerText = "交卷 🏁";
            nextBtn.style.background = "#55efc4"; nextBtn.style.boxShadow = "0 6px 0 #00b894";
        } else {
            nextBtn.innerText = "下一頁 ➡️";
            nextBtn.style.background = "#dfe6e9"; nextBtn.style.boxShadow = "0 6px 0 #b2bec3";
        }
    }

    window.prevQuestion = () => { if(currentQ > 0){ currentQ--; renderQuestion(); } };
    window.nextQuestion = () => { if(currentQ < 11){ currentQ++; renderQuestion(); } else { finishGame(); } };

    function finishGame() {
        clearInterval(timer);
        score = 0;
        let listHtml = '';
        questions.forEach((q, i) => {
            let isCorrect = answers[i] === q.adj;
            if(isCorrect) score++;
            let fullAns = q.adj + q.noun;
            listHtml += `
                <div class="review-item">
                    <span>${i+1}. ${q.emoji} ${fullAns} ${isCorrect ? '✅' : `❌(選:${answers[i]||'無'})`}</span>
                    <button class="speak-btn" onclick="speak('${fullAns}')">🔊</button>
                </div>
            `;
        });
        
        document.getElementById('reviewList').innerHTML = listHtml;
        document.getElementById('scoreText').innerText = score;
        document.getElementById('timeText').innerText = formatTime(totalSec);
        document.getElementById('starsDisplay').innerText = score === 12 ? "🏆🌟🌟🌟🏆" : score >= 9 ? "⭐⭐⭐" : score >= 6 ? "⭐⭐" : "⭐";
        
        speak(`挑戰完成，你答對了${score}題，用了${Math.floor(totalSec/60)}分${totalSec%60}秒`);
        showPage('result');
    }

    // --- Firebase 雲端龍虎榜整合 ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { initializeFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp({
        apiKey: "AIzaSyBdzlMQ57R0M-JYUlhA3hsSPP5k_-Ictq4",
        authDomain: "hkbuas-1b-games.firebaseapp.com",
        projectId: "hkbuas-1b-games",
        storageBucket: "hkbuas-1b-games.firebasestorage.app",
        messagingSenderId: "667373437790",
        appId: "1:667373437790:web:8117960182c15969a585cf"
    });
    
    // 開啟強制長輪詢，防止香港地區學校或手機網路卡死
    const db = initializeFirestore(app, { experimentalForceLongPolling: true });
    const colRef = collection(db, "leaderboard");
    let rankData = [];

    // 即時自動拉取雲端成績
    onSnapshot(colRef, snap => {
        let arr = [];
        snap.forEach(doc => {
            let d = doc.data();
            if(d && d.name) arr.push({ name: d.name, score: Number(d.score), time: Number(d.time) });
        });
        // 排序：先比分數(高至低)，同分比時間(快至慢)
        arr.sort((a,b) => b.score !== a.score ? b.score - a.score : a.time - b.time);
        rankData = arr;
        
        let html = '';
        if(arr.length === 0) { html = '<div style="color:#666;">快來成為第一名吧！</div>'; }
        else {
            arr.slice(0, 15).forEach((d, i) => {
                let medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
                html += `<div class="leaderboard-row"><span>${medal} ${d.name}</span> <span>✅ ${d.score}題 ⏱️ ${formatTime(d.time)}</span></div>`;
            });
        }
        document.getElementById('leaderboardList').innerHTML = html;
    });

    // 提交成績上雲端
    window.submitScore = async () => {
        let name = document.getElementById('playerName').value.trim();
        if(!name) return alert("請輸入名字喔！");
        
        let btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "⏳ 上傳中...";

        try {
            await addDoc(colRef, { name: name, score: score, time: totalSec, timestamp: Date.now() });
            
            // 找出最新名次
            let rank = rankData.findIndex(x => x.name===name && x.score===score && x.time===totalSec) + 1 || 1;
            
            document.getElementById('submitBox').innerHTML = `
                <h3 style="color:#00b894; margin-top:0;">✅ 成功上傳雲端！</h3>
                <div style="font-size:1.4rem; font-weight:bold;">🎉 恭喜 ${name}！</div>
                <div style="font-size:1.2rem; margin-top:10px;">目前排名：第 <span style="color:#d63031; font-size:1.8rem;">${rank}</span> 名</div>
            `;
            speak(`成績已上傳！恭喜${name}排第${rank}名！`);
        } catch(e) {
            alert("上傳失敗，請重試！");
            btn.disabled = false; btn.innerText = "🚀 提交成績看排名";
        }
    };
</script>
</body>
</html>
