<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2 English Reading Fun - Teacher Cat</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        
        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background-color: #f0f8ff;
            background-image: radial-gradient(#add8e6 15%, transparent 15%), radial-gradient(#add8e6 15%, transparent 15%);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
            text-align: center;
            color: #333;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }
        
        #main-content-wrapper {
            flex: 1 0 auto; 
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            border: 2px solid #e6e6fa;
        }
        
        .logo-img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.15);
            background-color: white;
            object-fit: cover;
            border: 3px solid #ff69b4;
        }

        #star-hud {
            background: #fff;
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 8px 15px;
            font-weight: bold;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }
        .hud-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.2em;
            color: #ff8c00;
        }
        .hud-best {
            font-size: 0.9em;
            color: #32cd32;
        }
        @keyframes starPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        .star-animate { animation: starPop 0.5s ease; }

        .main-title-box {
            background: rgba(255,255,255,0.85);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff69b4;
            font-size: 2.2em;
            text-shadow: 2px 2px #fff;
            margin: 5px 0;
        }
        p.subtitle {
            font-size: 1.1em;
            color: #555;
            margin: 5px 0;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 10px;
        }
        
        .book-btn {
            background: linear-gradient(to right, #ffffff, #f4f4f4);
            border: 1px solid #dcdcdc;
            border-left: 14px solid #ff8c00; 
            border-radius: 4px 12px 12px 4px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 6px 6px 12px rgba(0,0,0,0.12), inset -4px 0 5px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .book-btn::after {
            content: '';
            position: absolute;
            top: 4px; bottom: 4px; right: 4px;
            width: 3px;
            border-right: 1px solid #eaeaea;
            border-radius: 50%;
        }

        .book-btn:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 8px 12px 20px rgba(0,0,0,0.18), inset -4px 0 5px rgba(0,0,0,0.03);
            background: linear-gradient(to right, #ffffff, #ffffe0);
        }
        
        .btn-img {
            width: 100%;
            height: 180px; 
            object-fit: contain; 
            object-position: center;
            background-color: #fff; 
            border-radius: 3px 8px 8px 3px;
            margin-bottom: 12px;
            border: 1px solid #eee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .btn-title {
            font-size: 1em;
            font-weight: bold;
            color: #333;
            line-height: 1.3;
            z-index: 1;
            width: 100%;
        }

        .perfect-stamp {
            position: absolute;
            top: -12px;
            right: -12px;
            background: #ffd700;
            color: #d2691e;
            border: 3px solid #fff;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85em;
            font-weight: bold;
            transform: rotate(15deg);
            box-shadow: 2px 2px 10px rgba(0,0,0,0.25);
            z-index: 10;
            line-height: 1.2;
            text-align: center;
            animation: stampPop 0.5s ease-out;
        }
        @keyframes stampPop {
            0% { transform: scale(3) rotate(0deg); opacity: 0; }
            100% { transform: scale(1) rotate(15deg); opacity: 1; }
        }
        
        .hidden { display: none !important; }
        
        #game-screen {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            max-width: 850px;
            margin: 0 auto;
            position: relative;
            border: 3px solid #add8e6;
        }
        
        .image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #b0c4de;
        }

        img.story-img {
            width: auto;
            max-width: 100%;
            max-height: 35vh;
            border-radius: 12px;
            border: 4px solid #ffb6c1;
            margin-bottom: 15px;
            object-fit: contain;
            background: #fff;
            cursor: zoom-in;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        img.story-img:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        #image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }
        #modal-img {
            max-width: 95vw;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(255,255,255,0.2);
            object-fit: contain;
        }
        .modal-close-btn {
            margin-top: 15px;
            background: #ff6347;
            color: white;
            border: 2px solid white;
            padding: 10px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .modal-close-btn:hover { background: #dc143c; }

        .story-text-box {
            padding: 15px;
            margin-bottom: 25px;
            font-size: 1.25em;
            line-height: 2.2; 
            text-align: left;
            color: #444;
            background: #fffafa;
            border-radius: 15px;
            border: 2px dashed #ffb6c1;
        }
        
        .sentence-item { display: inline; margin-right: 6px; }
        .small-speak-btn {
            width: 32px;
            height: 32px;
            min-width: 32px;
            font-size: 1.1em;
            margin: 0 6px 0 0;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #e0ffff;
            border: 2px solid #87ceeb;
            border-radius: 50%;
            vertical-align: middle;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }
        .small-speak-btn:hover { background: #b0e0e6; transform: translateY(-2px) scale(1.1); }
        .small-speak-btn:active { transform: translateY(0) scale(0.95); }
        
        /* === 互動字典：生字按鈕樣式 === */
        .vocab-word {
            background-color: #fffacd; 
            border-bottom: 2px dashed #ff8c00;
            color: #d2691e;
            cursor: pointer;
            padding: 0 4px;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.2s;
            display: inline-block;
        }
        .vocab-word:hover {
            background-color: #ffe4b5;
            transform: scale(1.05);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* === 互動字典：彈出解說小卡樣式 === */
        #vocab-tooltip {
            position: absolute;
            background: #fff;
            border: 3px solid #ff69b4;
            border-radius: 15px;
            padding: 10px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            z-index: 1000;
            display: none;
            pointer-events: none; 
            transform: translate(-50%, -100%);
            margin-top: -12px;
            text-align: center;
            min-width: 100px;
        }
        #vocab-tooltip::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            margin-left: -10px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #ff69b4 transparent transparent transparent;
        }

        .quiz-section { padding-top: 15px; }
        .quiz-title {
            color: #483d8b;
            font-size: 1.6em;
            margin-bottom: 10px;
            text-shadow: 1px 1px #fff;
        }
        
        #progress { font-size: 1.2em; color: #ff8c00; margin-bottom: 15px; font-weight: bold; }
        
        .question-box {
            background: #f0f8ff;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 1.25em;
            border: 2px solid #b0c4de;
        }
        
        .q-text-wrap {
            display: flex; align-items: flex-start; margin-bottom: 25px;
            font-weight: bold; color: #483d8b; font-size: 1.1em;
        }
        
        .option-wrap { display: flex; align-items: center; margin: 12px 0; }
        
        .speak-btn {
            background: #ffdab9; border: 2px solid #ff8c00; border-radius: 50%;
            min-width: 45px; height: 45px; font-size: 1.4em;
            cursor: pointer; margin-right: 15px; display: flex;
            align-items: center; justify-content: center;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s, background 0.2s; flex-shrink: 0;
        }
        .speak-btn:hover { transform: scale(1.1); background: #ffdead; }
        .speak-btn:active { transform: scale(0.9); }
        
        .option-btn {
            flex-grow: 1; background: #fff; border: 3px solid #3cb371;
            border-radius: 12px; padding: 15px; font-size: 1em;
            font-family: inherit; cursor: pointer; text-align: left;
            transition: all 0.2s; color: #333; min-height: 55px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }
        .option-btn:hover:not(:disabled) { background: #e0ffe0; transform: translateX(5px); }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.9;}
        
        #feedback { font-size: 1.3em; font-weight: bold; min-height: 40px; margin: 15px 0; }
        .correct-text { color: #32cd32; }
        .wrong-text { color: #dc143c; }
        .earn-star-text { color: #ff8c00; font-size: 0.9em; display: block; margin-top: 5px; }
        
        .game-nav-bar, .utility-nav-bar {
            display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap;
        }
        .utility-nav-bar { margin-top: 5px; margin-bottom: 10px; }
        
        .nav-btn {
            background: #ff6347; color: white; border: none;
            padding: 15px 25px; font-size: 1.15em; font-family: inherit;
            border-radius: 12px; cursor: pointer; box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
        }
        .nav-btn:hover { background: #ff4500; transform: translateY(-2px); }
        .nav-btn:active { transform: translateY(1px); }
        
        .blue-btn { background: #1e90ff; }
        .blue-btn:hover { background: #0000cd; }
        .green-btn { background: #32cd32; }
        .green-btn:hover { background: #228b22; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; transform: none;}
        
        .site-footer {
            flex-shrink: 0; background: rgba(255, 255, 255, 0.95);
            border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 30px 20px; margin-top: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            text-align: center; width: 100%; box-sizing: border-box; border-top: 3px solid #ffb6c1;
        }
        .site-footer h3 { color: #ff69b4; margin-top: 0; margin-bottom: 20px; font-size: 1.8em; text-shadow: 1px 1px #eee; }
        .social-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 1000px; margin: 0 auto; }
        .social-links a, .social-text {
            text-decoration: none; color: #fff; padding: 12px 20px; border-radius: 12px;
            font-weight: bold; font-size: 1.05em; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.15);
        }
        .social-links a:hover { transform: scale(1.05); box-shadow: 3px 3px 12px rgba(0,0,0,0.25);}
        .bg-yt { background: #ff0000; } .bg-yt:hover { background: #cc0000; }
        .bg-ig { background: #e1306c; } .bg-ig:hover { background: #c13584; }
        .bg-fb { background: #1877f2; } .bg-fb:hover { background: #165eab; }
        .bg-th { background: #000000; } .bg-th:hover { background: #333333; }
        .bg-xh { background: #ff2442; } .bg-xh:hover { background: #d01d36; }
        .bg-wa { background: #25d366; } .bg-wa:hover { background: #128c7e; }
        .bg-dy { background: #000000; border: 2px solid #25f4ee; color: #fff;}
        
        .confetti {
            position: fixed; top: -20px; width: 10px; height: 10px;
            z-index: 9999; opacity: 0.9; border-radius: 2px;
            animation: fall linear forwards; pointer-events: none;
        }
        @keyframes fall {
            0% { top: -20px; transform: rotate(0deg); }
            100% { top: 100vh; transform: rotate(720deg); }
        }

        @media (max-width: 600px) {
            .app-header { padding: 10px; border-radius: 15px;}
            .logo-img { width: 60px; height: 60px; }
            #star-hud { padding: 5px 10px; }
            .hud-row { font-size: 1em; }
            h1 { font-size: 1.8em; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 15px;}
            .btn-img { height: 140px; }
            .book-btn { padding: 8px; border-left-width: 10px;}
            .btn-title { font-size: 0.9em; }
            .perfect-stamp { width: 45px; height: 45px; font-size: 0.75em; top: -8px; right: -8px; }
            #game-screen { padding: 15px; }
            .story-text-box { font-size: 1.15em; padding: 10px;}
            .speak-btn { min-width: 38px; height: 38px; font-size: 1.2em; }
            .option-btn { padding: 12px; font-size: 0.95em; }
            .nav-btn { padding: 10px 15px; font-size: 1em; }
            #vocab-tooltip { font-size: 1em; padding: 8px 15px; }
        }
    </style>
</head>
<body>

    <div id="main-content-wrapper">
        <header class="app-header">
            <img src="cat.jpeg" class="logo-img" alt="Teacher Cat Logo">
            <div id="star-hud">
                <div class="hud-row">🏆 滿分關卡: <span id="star-count">0</span>/26</div>
                <div id="level-best-hud" class="hud-best hidden">🏆 Level Best: <span id="level-best-count">0</span>/3</div>
            </div>
        </header>

        <div id="home-screen">
            <div class="main-title-box">
                <h1>📚 P2 English Reading Fun! 📚</h1>
                <p class="subtitle">聽一聽，讀一讀，選出正確的完整句子！<br>(點擊書本開始，故事中有<span class="vocab-word">黃色生字</span>可以點擊查看解釋喔！)</p>
            </div>
            
            <div class="grid" id="book-grid"></div>
            
            <div style="margin: 35px auto 10px; text-align: center;">
                <a href="https://cat123teacher.github.io/chinese/main.html" class="nav-btn green-btn" style="text-decoration: none; display: inline-block; font-size: 1.2em; padding: 15px 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                    🚀 返回小朋友學習大冒險
                </a>
            </div>
        </div>

        <div id="game-screen" class="hidden">
            <h2 id="story-title" style="color: #ff4500; margin-top: 0; font-size: 1.6em;"></h2>
            
            <div class="image-container">
                <img id="story-image" class="story-img" src="" alt="Story Image" onclick="openModal()" title="點擊放大圖片">
                <div class="utility-nav-bar">
                    <button class="nav-btn blue-btn" style="padding: 10px 20px; font-size: 1em;" onclick="openModal()">🔍 放大圖片</button>
                    <button class="nav-btn green-btn" style="padding: 10px 20px; font-size: 1em;" onclick="printStory()">🖨️ 列印文章</button>
                </div>
            </div>
            
            <div id="story-text-container" class="story-text-box"></div>
            
            <div class="quiz-section">
                <h3 id="quiz-title-display" class="quiz-title">📝 Reading Quiz</h3>
                <div id="progress">Question 1 / 3</div>
                <div id="question-area" class="question-box"></div>
                <div id="feedback"></div>
                <div class="game-nav-bar">
                    <button id="prev-btn" class="nav-btn blue-btn" onclick="prevQuestion()">⬅️ 上一頁</button>
                    <button id="home-btn" class="nav-btn" onclick="goHome()">🏠 回到書櫃</button>
                    <button id="next-btn" class="nav-btn blue-btn" onclick="nextQuestion()">下一題 ➡️</button>
                </div>
            </div>
        </div>
        
    </div>

    <div id="image-modal">
        <img id="modal-img" src="">
        <button class="modal-close-btn" onclick="closeModal()">關閉 ❌</button>
    </div>

    <!-- 互動字典：生字解說彈出框 -->
    <div id="vocab-tooltip"></div>

    <div class="site-footer">
        <h3>✨ Teacher Cat 的快樂AI教室 ✨</h3>
        <div class="social-links">
            <a href="https://www.youtube.com/@TeacherCat123" target="_blank" class="bg-yt">▶️ YouTube</a>
            <a href="https://www.instagram.com/teachercat123?igsh=d2NjcXVsenVhNjkz&utm_source=qr" target="_blank" class="bg-ig">📸 Instagram</a>
            <a href="https://www.facebook.com/share/1Gp2hwWUFP/?mibextid=wwXIfr" target="_blank" class="bg-fb">📘 Facebook</a>
            <a href="https://www.threads.com/@teachercat123?igshid=NTc4MTIwNjQ2YQ==" target="_blank" class="bg-th">🧵 Threads</a>
            <a href="https://xhslink.com/m/5UQtqPpcsWK" target="_blank" class="bg-xh">📕 小紅書</a>
            <a href="https://chat.whatsapp.com/Jj4ny1yzFz1D2Ljzccw6ni" target="_blank" class="bg-wa">💬 WhatsApp 群組</a>
            <span class="social-text bg-dy">🎵 抖音: 74254902683</span>
        </div>
    </div>

        var storyTexts = {
            "p2001": "<p><strong>WOW! Amazing Animal Friends!</strong></p><p>Have you ever heard of a cat who loves to ride the bus? Meet 'Cassie,' a brave ginger cat who lives in a small town in England. Cassie loves to go for rides on the red 'Number 44' bus. She jumps on every morning, sits on her favorite seat near the back, and enjoys the view as the bus travels around the countryside.</p><p>The friendly bus drivers and passengers all know Cassie very well and make sure she gets off safely near her favorite fish and chip shop. She has her very own 'Bus Pass' on a tiny collar! She is the town's favorite little traveler and has become a famous local celebrity. Now, her owner is writing a book all about her incredible adventures.</p>",
            "p2002": "<p><strong>WACKY WORLD NEWS: THE SQUIRREL WHO JOINED A BAKERY!</strong></p><p>Have you ever heard of a squirrel with a sweet tooth? This week, in a little town in England, a cheeky squirrel named 'Nutty' became the star assistant at a local bakery! Nutty the squirrel didn't just visit for nuts. One morning, he sneaked past the baker, Mr. Puggins, and hopped right onto the counter.</p><p>Instead of causing chaos, Nutty stood on his back legs and carefully used his little paws to help 'knead' the dough for blueberry muffins! Mr. Puggins was so surprised, he decided to give Nutty a tiny baker's hat. He helps roll out pie crusts (with his nose!) and even 'decorates' cupcakes by sprinkling sugar. His favorite is taste-testing the frosting.</p>",
            "p2003": "<p><strong>SUPER SQUIRREL LIBRARIAN OPENS TINY PARK LIBRARY!</strong></p><p>Meet Nutty! Nutty isn't just any squirrel in a lovely English park; he's a genius squirrel librarian! Last week, he started a very special project. Nutty noticed children dropping their tiny, waterproof picture books and comics. He decided to 'borrow' them!</p><p>Nutty used his sharp teeth to carefully carry the books to a hollow tree. He made a little sign from bark and berries that says 'NUTTY'S LIBRARY'. Now, every day, children come to the tree. They look at the books, share them, and even leave Nutty a special acorn treat!</p>",
            "p2004": "<p><strong>Wacky News: Supermarket Surprise! A Penguin Goes Shopping.</strong></p><p>This week, a little penguin named 'Pip' caused a big stir at a London aquarium. During the night, Pip used his flippers to carefully unlock his enclosure, then he waddled right out of the aquarium door and into the busy city streets!</p><p>Just after dawn, shoppers at the local 'Super-Fresh' supermarket were shocked to see Pip waddling down the 'Frozen Foods' aisle. Pip used his beak to pick out a shiny, silver fish from the freezer, then he pushed a miniature shopping cart toward the checkout counter. Police arrived and finally caught him with a soft net.</p>",
            "p2005": "<p><strong>WORLD'S SMALLEST PENGUIN WINS EGG-CELLENT ART PRIZE!</strong></p><p>Meet Pip! Pip is the world's smallest penguin, living in a sunny zoo in Australia. Last week, a special art contest was held for all the zoo animals. Pip wanted to join! But Pip's feet are too small to hold big paintbrushes, and his flippers are too round.</p><p>Then, Pip had a GREAT idea! He waddled over to a patch of colourful, safe, non-toxic berry juice and stepped right into it! Pip did a happy dance on a giant piece of paper. He danced and spun, creating a beautiful splashy rainbow. The judges gave Pip the First Place Prize!</p>",
            "p2006": "<p><strong>WACKY WORLD NEWS: THE OCTOPUS WHO STOLE A SHINY CAMERA!</strong></p><p>This week, in a beautiful coral reef in faraway Australia, a very cheeky octopus named 'Inky' became a worldwide superstar! One morning, she saw a scuba diver taking pictures of the colorful fish.</p><p>While the diver was busy looking at a turtle, Inky, with her eight arms, gently reached out and... She took the diver's bright yellow underwater camera! Inky tried to 'take a selfie' by pointing the camera at her own funny, many-armed face! The diver had to offer her favorite tasty crab snack to get the camera back.</p>",
            "p2007": "<p><strong>Wacky News: A Bear-y Big Ice Cream Thief!</strong></p><p>This week, a very clever brown bear cub named 'Barnaby' caused a big stir! He loves sweet treats. He managed to open the back door of Barnaby's Ice Cream Shop while the owner was busy. Sneaking in, he went straight for the freezer, which was full of yummy 'Salmon Surprise' flavor (his favorite!) and 'Honey Berry' flavor.</p><p>People walking past were shocked to see a big, fluffy bear waddling down the street with a giant pint of ice cream in his paws! Police arrived, but they had to be very gentle. They used a trail of honey to guide him back to the edge of town.</p>",
            "p2008": "<p><strong>WACKY WORLD NEWS: THE PUPPY WHO OPENED HIS OWN LIBRARY!</strong></p><p>This week, in a sunny park in California, a clever Golden Retriever named 'Barnaby' became the star librarian! Barnaby's owner, Maya, noticed her fluffy friend loved to carry books in his mouth.</p><p>One day, Barnaby trotted over to a park bench and gently placed it next to an elderly man reading a newspaper. Maya set up a tiny, decorated book cart for Barnaby. Now, Barnaby waits for people coming into the park, picks a colorful picture book from his cart, and offers it to them. He even 'reads' (howls softly) to the children.</p>",
            "p2009": "<p><strong>WACKY WORLD NEWS: THE LIZARD WHO BECAME A ROCKSTAR!</strong></p><p>In a small, sunny town in faraway Australia, a very cheeky blue-tongued lizard named 'Ziggy' became an international music sensation! Ziggy loves to listen to his owner, Mia, practice her electric guitar.</p><p>One afternoon, Ziggy waddled onto the patio, grabbed a small, felt guitar pick with his mouth, and started to tap-tap-tap it on the guitar strings. <i>Strum! Strum!</i> Now, Ziggy is a pro! He holds the guitar pick with his front foot and strums with his nose. His favorite song is a fast, happy tune, and he even bobs his little head to the beat.</p>",
            "p2010": "<p><strong>WACKY WORLD NEWS: THE GOAT WHO LOVED TO SKATEBOARD!</strong></p><p>This week, in a small, sunny town in California, a very clever goat named 'Billy' became a viral superstar! One morning, Billy wandered into the farmer's garage and saw an old, brightly colored skateboard.</p><p>Instead of being scared, Billy nudged it with his nose. Then, to everyone's amazement, he hopped onto the board with all four hooves and pushed off! Now, Billy is a pro. He loves to go skateboarding down the gentle slope of the farm driveway. His favorite trick is jumping over a tiny ramp onto a soft haystack.</p>",
            "p2011": "<p><strong>WACKY WORLD NEWS: THE PIG WHO BECAME A PAINTER!</strong></p><p>In a small, sunny town in faraway New Zealand, a very clever pig named 'Picasso' became an international art sensation! Picasso the pig loved to watch her owner, Mrs. Jones, paint beautiful pictures.</p><p>One day, Picasso waddled over, grabbed a paint-filled brush with her mouth, and made a big, colorful swirl on a canvas. Mrs. Jones was so surprised, she gave Picasso more non-toxic paints and brushes. Now, Picasso is a pro! She holds the brush with her snout and paints amazing, happy blobs of color. She even signs her paintings with a special hoof print.</p>",
            "p2012": "<p><strong>TINY DOG DETECTIVE SNIFFS OUT MISSING SOCK MYSTERY!</strong></p><p>Meet 'Peanut'! Peanut is a tiny, fluffy Chihuahua living in a big apartment in New York City. He is a super-sleuth! Last week, a little girl named Lily was very sad. Her favorite cozy rainbow sock had disappeared!</p><p>Lily's mom called Peanut for help. Peanut wagged his tail and got to work. He sniffed Lily's shoe. Sniff, sniff, sniff! He marched into the kitchen, pushed open a cabinet door, and started barking. There, hidden in a dark corner behind a bag of potatoes, was her rainbow sock!</p>",
            "p2013": "<p><strong>WACKY WORLD NEWS: THE PENGUIN WHO BECAME A SNEAKER STAR!</strong></p><p>This week, in a world-famous zoo in Japan, a clever Adélie penguin named 'Penny' became an internet sensation! She loves to watch the zookeepers wear their colorful sneakers.</p><p>One morning, she sneaked into the zookeeper's office and grabbed a tiny, bright red sneaker with her beak. Instead of hiding it, she tried it on! The zookeepers were so surprised, they made her a special, teeny-tiny pair of soft red shoes. Penny now wears them every day. She loves to show off her 'sneakers' by high-stepping for the crowd.</p>",
            "p2014": "<p><strong>Wacky News: Escape Artist Hamster! A Very Tiny Jailbreak!</strong></p><p>This week, a tiny hamster named 'Houdini' caused a big stir in Tokyo, Japan. Houdini's owner, Kenji, was very surprised to find his hamster's cage empty every morning, even though the door was locked tight!</p><p>The clever hamster learned to use his little nose and paws to carefully unlock the cage door from the inside! One night, Houdini waddled into the kitchen and found a bag of yummy cheese crackers. The next morning, Kenji found Houdini fast asleep in a shoe box.</p>",
            "p2015": "<p><strong>Wacky News: Monkey Driver Causes Traffic Jam in London!</strong></p><p>A very cheeky monkey caused a big surprise in London this week! The monkey, who is famous at the local zoo for being clever, somehow unlocked the zookeeper's golf buggy. Not just that, but it started the engine and drove it right out of the zoo!</p><p>People driving their cars could not believe their eyes. 'I saw a monkey driving a car, and it was using the turn signal!' laughed Mr. Brown, a surprised taxi driver. In the end, the monkey parked the buggy perfectly outside a banana shop.</p>",
            "p2016": "<p><strong>WACKY WORLD NEWS: THE COW WHO THOUGHT SHE WAS A HORSE!</strong></p><p>In a small town in New Zealand, a very funny cow named 'Moo-ana' became a world-famous superstar! She loves to watch the neighbor's beautiful horses run and jump over tall fences.</p><p>One day, Moo-ana saw an old, dusty obstacle course. Instead of being scared, she waddled over, tucked her legs, and... hop! She tried to jump over the first hurdle! The farmer was so surprised, he built her a special, low cow-sized jumping course. Now, Moo-ana is a pro!</p>",
            "p2017": "<p><strong>WACKY WORLD NEWS: THE SHEEP WHO BECAME A DOGGY HERO!</strong></p><p>This week, in a small green town in Wales, a cheeky sheep named 'Baa-bara' did something amazing! Baa-bara was raised on a farm with a family of Golden Retriever puppies.</p><p>One morning, when the farmer took the dogs for a walk, Baa-bara decided to join the pack! When the farmer threw a tennis ball, Baa-bara didn't eat the grass; she grabbed the ball with her teeth and brought it right back! Now, Baa-bara plays a perfect game of fetch, and even gives a little 'Baa!' instead of a bark.</p>",
            "p2018": "<p><strong>Wacky News: A Bear-y Big Ice Cream Thief!</strong></p><p>This week in a quiet town in Canada, a very clever brown bear cub named 'Barnaby' caused a big stir! He loves sweet treats. He managed to open the back door of Barnaby's Ice Cream Shop while the owner was busy. Sneaking in, he went straight for the freezer, which was full of yummy 'Salmon Surprise' flavor and 'Honey Berry' flavor.</p><p>People walking past were shocked to see a big bear waddling down the street with a giant pint of ice cream in his paws! Police used a trail of honey to guide him back to the forest.</p>",
            "p2019": "<p><strong>ELEPHANT PAINTER STAMPS HIS WAY TO ART FAME!</strong></p><p>Meet 'Jumbo', the world's most colourful elephant artist! Jumbo lives in a sunny animal sanctuary in Thailand. He loves to paint, but he doesn't use small brushes. No, Jumbo uses his BIG, round feet!</p><p>His human friends set up a HUGE canvas. They gave Jumbo giant foot-pads dipped in safe, non-toxic paints. Jumbo stepped onto the canvas. He stomped, he danced, and he wiggled his toes! Splat! Squish! The art judges were so impressed! Jumbo won the 'Trunk-tastic Art Prize.'</p>",
            "p2020": "<p><strong>SURF'S UP, GOAT! MOUNTAIN GOAT CATCHES WAVES IN SCOTLAND!</strong></p><p>Meet 'Barnaby', the most adventurous goat in all of Scotland! Last week, Barnaby was taking a walk near the ocean when he saw something new. A group of people were learning to surf!</p><p>When no one was looking, Barnaby trotted over to an extra surfboard left on the sand. He stepped onto it with his sturdy little hooves. A friendly wave rolled in, and just like that - Barnaby was surfing! He balanced perfectly! Up and down, side to side. He even got his very own tiny, goat-sized wetsuit!</p>",
            "p2021": "<p><strong>Wacky News: Super-Sniffer! A Very Clever Cow Becomes a Police Officer!</strong></p><p>This week, a very unusual new police officer started work in Chur, Switzerland. The police chief swore in a very clever cow named 'Daisy'! Daisy has a super-sniffer nose, just like a police dog.</p><p>One day, a little boy lost his favorite toy bear in the big forest. Daisy nodded, put her nose to the ground, and walked right into the forest. After sniffing around some trees, she pulled a shiny red toy bear from some bushes with her mouth! She is now the official 'Lost Toy Detective'!</p>",
            "p2022": "<p><strong>WEIRD NEWS: THE DANCING PENGUIN!</strong></p><p>Last Monday, in a sunny park in London, a very silly thing happened! A chubby Emperor penguin named Waddles walked right out of a delivery truck.</p><p>He jumped into a puddle and started dancing! He did the twist and the moonwalk. A big crowd of people took videos. The zookeepers were so surprised! Finally, a little girl named Lily gave him a red balloon. Waddles grabbed the string and slid down a grassy hill into his new pool at the zoo.</p>",
            "p2023": "<p><strong>BABY ELEPHANT STEALS SCHOOL BUS!</strong></p><p>Last Monday, in a sunny jungle town, a funny thing happened! A cute baby elephant named Ellie walked into a schoolyard. She thought the big yellow school bus was a new toy!</p><p>Ellie picked up the bus with her long trunk. All the children laughed and laughed. Tommy, a boy in second grade, gave Ellie some sweet bananas. Ellie put the bus down gently and ate the bananas. The zookeeper came and took Ellie home to the animal park. The bus was not broken, just a little sticky!</p>",
            "p2024": "<p><strong>THE TALKING DOLPHIN!</strong></p><p>Last week in sunny Australia, a very smart dolphin swam right up to a yellow boat! His name is Luna. Luna can talk! He popped his head out of the water and said 'Hello friends!' to the surprised fishermen.</p><p>The fishermen gave Luna a big blue ball to play with. Luna laughed and jumped high in the air, splashing water everywhere! Now, every morning, Luna waits by the dock to say good morning to all the children going to school.</p>",
            "p2025": "<p><strong>DANCING PENGUIN STEALS THE SHOW!</strong></p><p>A very silly and funny thing happened at the zoo this week! A big penguin named Bouncy found a shiny red button. When he tapped it with his beak, loud disco music started playing!</p><p>Bouncy could not stop dancing! He waved his flippers and slid on his belly across the ice. All the zookeepers and visitors laughed and clapped for him. Bouncy is now the most famous dancing penguin in the world!</p>",
            "p2026": "<p><strong>WEIRD NEWS! A Monkey Stole a Police Hat!</strong></p><p>Last Monday in India, a funny monkey took a police officer's hat! The officer was resting on a park bench. The monkey jumped down from a tall tree and grabbed the brown hat.</p><p>Then, the monkey sat on a stone wall and wore the hat! All the people in the park laughed. The police officer smiled and gave the monkey a yellow banana. The monkey gave the hat back and ate the banana happily.</p>"

                if(!e.target.classList.contains('vocab-word')) {
                    document.getElementById('vocab-tooltip').style.display = 'none';
                }
            });
        };
        
        function renderHomeGrid() {
            var grid = document.getElementById('book-grid');
            grid.innerHTML = '';
            for (var i = 1; i <= 26; i++) {
                var numStr = i < 10 ? '0' + i : i;
                var id = 'p20' + numStr;
                var best = parseInt(levelScores[id], 10) || 0;
                
                var btn = document.createElement('div');
                btn.className = 'book-btn';
                btn.style.borderLeftColor = spineColors[(i - 1) % spineColors.length];
                
                (function(idCopy, numCopy) {
                    btn.onclick = function() { startGame(idCopy, numCopy); };
                })(id, i);
                
                var img = document.createElement('img');
                img.src = id + '.jpg';
                img.className = 'btn-img';
                img.alt = 'Story ' + i;
                
                var titleObj = storyTitles[id] || { en: 'Story ' + i, zh: '故事 ' + i };
                var safeEnTitle = titleObj.en.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                var safeZhTitle = titleObj.zh.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                
                var title = document.createElement('div');
                title.className = 'btn-title';
                
                title.innerHTML = 
                    '<div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 5px;">' +
                        '<button class="small-speak-btn" style="margin:0; width:30px; height:30px; min-width:30px; font-size:1em;" onclick="speakBilingual(\'' + safeEnTitle + '\', \'' + safeZhTitle + '\', event)">🔊</button>' +
                        '<span style="font-size:1em; color:#000; text-align: left; line-height: 1.2;">' + titleObj.en + '</span>' +
                    '</div>' +
                    '<span style="font-size:0.95em; color:#666; font-weight:normal;">' + titleObj.zh + '</span><br>' +
                    '<span style="color:#ff8c00; font-size:0.9em; margin-top:5px; display:inline-block;">最高分: ' + best + '/3 ⭐</span>';
                
                btn.appendChild(img);
                btn.appendChild(title);
                
                if (best === 3) {
                    var stamp = document.createElement('div');
                    stamp.className = 'perfect-stamp';
                    stamp.innerHTML = '⭐⭐⭐<br>滿分';
                    btn.appendChild(stamp);
                }

                grid.appendChild(btn);
            }
        }
        
        function updateTotalStarsDisplay() {
            var perfectCount = 0;
            for (var key in levelScores) {
                if (levelScores.hasOwnProperty(key)) {
                    if (parseInt(levelScores[key], 10) === 3) {
                        perfectCount++;
                    }
                }
            }
            document.getElementById('star-count').innerText = perfectCount;
        }

        function shuffleArray(array) {
            var arr = array.slice();
            for (var i = arr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = arr[i];
                arr[i] = arr[j];
                arr[j] = temp;
            }
            return arr;
        }

        function speakText(text, event) {
            if (event) {
                event.stopPropagation();
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            }
        }
        
        function speakBilingual(enText, zhText, event) {
            if (event) {
                event.stopPropagation();
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                
                var utteranceEn = new SpeechSynthesisUtterance(enText);
                utteranceEn.lang = 'en-US';
                utteranceEn.rate = 0.85; 
                window.speechSynthesis.speak(utteranceEn);
                
                var utteranceZh = new SpeechSynthesisUtterance(zhText);
                utteranceZh.lang = 'zh-HK'; 
                utteranceZh.rate = 0.85; 
                window.speechSynthesis.speak(utteranceZh);
            }
        }

        // === 互動字典：比對生字並自動加上點擊標記 ===
        function highlightVocab(text) {
            var parts = text.split(/([a-zA-Z]+)/);
            var html = "";
            for (var i = 0; i < parts.length; i++) {
                var w = parts[i];
                var lowerW = w.toLowerCase();
                if (vocabDict[lowerW]) {
                    html += '<span class="vocab-word" onclick="showVocab(event, \'' + lowerW + '\')">' + w + '</span>';
                } else {
                    html += w;
                }
            }
            return html;
        }

        // === 互動字典：顯示解說小卡與雙語發音 ===
        function showVocab(event, wordKey) {
            event.stopPropagation(); 
            var tooltip = document.getElementById('vocab-tooltip');
            var meaning = vocabDict[wordKey];
            
            if (meaning) {
                tooltip.innerHTML = "<span style='color:#ff69b4'>" + wordKey + "</span><br><span style='color:#ff8c00; font-size:1.1em'>" + meaning + "</span>";
                tooltip.style.display = 'block';
                
                var rect = event.target.getBoundingClientRect();
                var scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
                var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                tooltip.style.left = (rect.left + scrollLeft + (rect.width / 2)) + 'px';
                tooltip.style.top = (rect.top + scrollTop - 8) + 'px';
                
                // 【修改這裡】呼叫雙語發音，同時讀出英文生字與中文解釋
                speakBilingual(wordKey, meaning, event);
            }
        }

        function formatStoryWithAudio(htmlString) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlString;
            
            function processNode(node) {
                if (node.nodeType === 3) {
                    var text = node.nodeValue;
                    if (!text.trim()) return; 

                    var safeText = text.replace(/Mr\./g, 'Mr@@').replace(/Mrs\./g, 'Mrs@@').replace(/Ms\./g, 'Ms@@').replace(/Dr\./g, 'Dr@@');
                    var matchRegex = /([^.!?]+[.!?]+)(\s*)/g;
                    var match;
                    var lastIndex = 0;
                    var fragment = document.createDocumentFragment();
                    var hasSentences = false;

                    while ((match = matchRegex.exec(safeText)) !== null) {
                        hasSentences = true;
                        
                        if (match.index > lastIndex) {
                            var uncaptured = safeText.substring(lastIndex, match.index).replace(/@@/g, '.');
                            var spanUncaptured = document.createElement('span');
                            spanUncaptured.innerHTML = highlightVocab(uncaptured);
                            fragment.appendChild(spanUncaptured);
                        }
                        
                        var sentence = match[1].replace(/@@/g, '.');
                        var trailingSpace = match[2] || "";
                        
                        var span = document.createElement('span');
                        span.className = 'sentence-item';
                        
                        var btn = document.createElement('button');
                        btn.className = 'small-speak-btn';
                        btn.innerHTML = '🔊';
                        
                        var safeClickText = sentence.replace(/'/g, "\\'").replace(/"/g, "&quot;").replace(/\n/g, " ");
                        btn.setAttribute('onclick', "speakText('" + safeClickText + "', event)");
                        
                        span.appendChild(btn);
                        
                        var sentenceContent = document.createElement('span');
                        sentenceContent.innerHTML = highlightVocab(sentence);
                        span.appendChild(sentenceContent);
                        
                        fragment.appendChild(span);
                        if (trailingSpace) {
                            fragment.appendChild(document.createTextNode(trailingSpace));
                        }
                        
                        lastIndex = matchRegex.lastIndex;
                    }
                    
                    if (hasSentences) {
                        if (lastIndex < safeText.length) {
                            var leftover = safeText.substring(lastIndex).replace(/@@/g, '.');
                            var spanLeftover = document.createElement('span');
                            spanLeftover.innerHTML = highlightVocab(leftover);
                            fragment.appendChild(spanLeftover);
                        }
                        node.parentNode.replaceChild(fragment, node);
                    } else {
                        var spanAll = document.createElement('span');
                        spanAll.innerHTML = highlightVocab(text);
                        node.parentNode.replaceChild(spanAll, node);
                    }
                } else if (node.nodeType === 1) {
                    if (node.nodeName !== 'BUTTON' && !node.classList.contains('vocab-word')) {
                        var children = Array.prototype.slice.call(node.childNodes);
                        for (var i = 0; i < children.length; i++) {
                            processNode(children[i]);
                        }
                    }
                }
            }
            
            var childNodes = Array.prototype.slice.call(tempDiv.childNodes);
            for (var j = 0; j < childNodes.length; j++) {
                processNode(childNodes[j]);
            }
            return tempDiv.innerHTML;
        }

        function openModal() {
            var modal = document.getElementById('image-modal');
            var img = document.getElementById('modal-img');
            img.src = document.getElementById('story-image').src;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('image-modal').style.display = 'none';
        }
        
        document.getElementById('image-modal').addEventListener('click', function(e) {
            if(e.target === this) { closeModal(); }
        });

        function printStory() {
            var imgUrl = document.getElementById('story-image').src;
            var currentTitle = document.getElementById('story-title').innerText;
            var newWin = window.open("", "_blank");
            newWin.document.write(
                '<html lang="zh-HK">' +
                '<head><title>Print - ' + currentTitle + '</title><style>body { margin: 0; padding: 20px; text-align: center; background: #fff; } img { max-width: 100%; height: auto; border: 2px solid #ccc; }</style></head>' +
                '<body><img src="' + imgUrl + '" onload="window.print();"></body></html>'
            );
            newWin.document.close();
        }

        function startGame(imgId, storyNum) {
            clearTimeout(autoAdvanceTimer); 
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            var titleObj = storyTitles[imgId] || { en: "Story " + storyNum, zh: "" };
            document.getElementById('story-title').innerText = "📖 " + titleObj.en + " \n (" + titleObj.zh + ")";
            document.getElementById('story-image').src = imgId + ".jpg";
            
            var extractedText = storyTexts[imgId] || "<p>Story text not found.</p>";
            document.getElementById('story-text-container').innerHTML = formatStoryWithAudio(extractedText);
            
            var allQ = db[imgId];
            if (!allQ) {
                document.getElementById('question-area').innerHTML = "<p style='color:red;'>找不到題目資料，請返回首頁。</p>";
                return; 
            }
            
            currentQuestions = shuffleArray(allQ).slice(0, 3);
            currentQIndex = 0;
            currentLevelId = imgId;
            currentRoundStars = 0;
            
            qScored = {}; 
            
            document.getElementById('level-best-hud').classList.remove('hidden');
            document.getElementById('level-best-count').innerText = levelScores[imgId] || 0;
            
            renderQuestion();
            window.scrollTo(0, 0);
        }

        function renderQuestion() {
            try {
                document.getElementById('feedback').innerHTML = '';
                
                var nextBtn = document.getElementById('next-btn');
                nextBtn.classList.remove('hidden'); 
                
                var qData = currentQuestions[currentQIndex];
                if (!qData) return;
                
                document.getElementById('progress').innerText = "Question " + (currentQIndex + 1) + " / 3";
                document.getElementById('prev-btn').disabled = (currentQIndex === 0);
                
                if (currentQIndex === 2) {
                    nextBtn.innerText = "完成！🏠";
                } else {
                    nextBtn.innerText = "下一題 ➡️";
                }

                // 確保選項可以正確讀取
                var qText = qData;
                var correctAns = qData[1];
                var wrong1 = qData[2];
                var wrong2 = qData[3];
                
                var options = shuffleArray([
                    { text: correctAns, isCorrect: true },
                    { text: wrong1, isCorrect: false },
                    { text: wrong2, isCorrect: false }
                ]);
                
                function escapeStr(str) {
                    if (typeof str !== 'string') return '';
                    return str.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                }

                var safeQText = escapeStr(qText);
                var html = 
                    '<div class="q-text-wrap">' +
                        '<button class="speak-btn" onclick="speakText(\'' + safeQText + '\', event)">🔊</button>' +
                        '<div>' + qText + '</div>' +
                    '</div>';
                
                for (var i = 0; i < options.length; i++) {
                    var opt = options[i];
                    var safeText = escapeStr(opt.text);
                    html += 
                        '<div class="option-wrap">' +
                            '<button class="speak-btn" style="min-width:40px;height:40px;font-size:1.1em;" onclick="speakText(\'' + safeText + '\', event)">🔊</button>' +
                            '<button class="option-btn" onclick="checkAnswer(this, ' + opt.isCorrect + ', \'' + safeText + '\')">' + opt.text + '</button>' +
                        '</div>';
                }
                
                document.getElementById('question-area').innerHTML = html;
            } catch (error) {
                console.error(error);
                document.getElementById('question-area').innerHTML = "<p style='color:red;font-size:1.2em;font-weight:bold;'>載入發生錯誤，請按「🏠 回到書櫃」重試。</p>";
            }
        }

        function playSuccessEffects() {
            try {
                var AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    var ctx = new AudioContext();
                    var osc = ctx.createOscillator();
                    var gainNode = ctx.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    osc.type = 'triangle';
                    
                    var now = ctx.currentTime;
                    osc.frequency.setValueAtTime(523.25, now);       
                    osc.frequency.setValueAtTime(659.25, now + 0.1); 
                    osc.frequency.setValueAtTime(783.99, now + 0.2); 
                    osc.frequency.setValueAtTime(1046.50, now + 0.3); 
                    
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) { }

            var colors = ['#FFD700', '#FF6347', '#32CD32', '#1E90FF', '#FF69B4'];
            for (var i = 0; i < 50; i++) {
                var conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                conf.style.transform = 'translateX(' + (Math.random() * 100 - 50) + 'px)';
                document.body.appendChild(conf);
                
                (function(element) {
                    setTimeout(function() { element.remove(); }, 3500);
                })(conf);
            }
        }

        function checkAnswer(btn, isCorrect, textStr) {
            var feedback = document.getElementById('feedback');
            
            if (isCorrect) {
                feedback.innerHTML = "Correct! 🌟 答對了！";
                feedback.className = "correct-text";
                
                if (!qScored[currentQIndex]) {
                    qScored[currentQIndex] = true; 
                    currentRoundStars++;
                    feedback.innerHTML += "<br><span class='earn-star-text'>⭐ You earned a star!</span>";
                }

                playSuccessEffects();
                
                var speakStr = textStr.replace(/&quot;/g, '"').replace(/\\'/g, "'");
                speakText("Correct! " + speakStr);
                
                btn.style.background = "#32cd32";
                btn.style.color = "#fff";
                btn.style.borderColor = "#228b22";
                
                var allBtns = document.querySelectorAll('.option-btn');
                for (var j = 0; j < allBtns.length; j++) {
                    allBtns[j].disabled = true;
                }
                
                var nextBtn = document.getElementById('next-btn');
                var isFinished = (currentQIndex === 2);

                if (isFinished) {
                    nextBtn.innerText = "完成！🏠 (自動跳轉)";
                    feedback.innerHTML += "<br>Amazing! 恭喜完成所有題目！ 🎉";
                } else {
                    nextBtn.innerText = "下一題 ➡️ (自動跳轉)";
                }

                clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = setTimeout(function() {
                    if (isFinished) {
                        finishGame(); 
                    } else {
                        nextQuestion();
                    }
                }, 2500); 

            } else {
                feedback.innerHTML = "Try again! ❌ 再試一次！";
                feedback.className = "wrong-text";
                speakText("Try again.");
                
                btn.style.background = "#ffb6c1";
                btn.disabled = true; 
            }
        }

        function finishGame() {
            clearTimeout(autoAdvanceTimer);
            
            var best = parseInt(levelScores[currentLevelId], 10) || 0;
            if (currentRoundStars > best) {
                levelScores[currentLevelId] = currentRoundStars;
                localStorage.setItem('teacherCatLevelScores', JSON.stringify(levelScores));
                
                var starHud = document.getElementById('star-hud');
                starHud.classList.add('star-animate');
                setTimeout(function() { starHud.classList.remove('star-animate'); }, 500);
            }
            
            updateTotalStarsDisplay();
            goHome();
        }

        function nextQuestion() {
            clearTimeout(autoAdvanceTimer); 
            if (currentQIndex < 2) {
                currentQIndex++;
                renderQuestion();
            } else {
                finishGame();
            }
        }

        function prevQuestion() {
            clearTimeout(autoAdvanceTimer);
            if (currentQIndex > 0) {
                currentQIndex--;
                renderQuestion();
            }
        }

        function goHome() {
            clearTimeout(autoAdvanceTimer);
            window.speechSynthesis.cancel();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('level-best-hud').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
            
            renderHomeGrid(); 
            window.scrollTo(0, 0);
        }
    </script>
