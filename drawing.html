<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小魚填色與畫畫遊戲</title>
    <!-- 引入 DragDropTouch Polyfill 輔助工具 -->
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>
    <style>
        /* 基礎樣式 */
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: 'Comic Sans MS', '微軟正黑體', sans-serif; 
            background-color: #e0f7fa; 
            user-select: none;
        }

        /* 首頁樣式 */
        #home-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        #home-screen h1 { 
            color: #ff5252; 
            font-size: 2.5rem; 
            text-shadow: 3px 3px #fff; 
            margin-bottom: 20px;
            text-align: center;
        }
        #start-btn { 
            border: none; 
            background: none; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        #start-btn:active { transform: scale(0.9); }
        #start-btn img { 
            max-width: 80vw; 
            width: 300px; 
            border-radius: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); 
            border: 8px solid white; 
            background-color: white;
        }

        /* 遊戲主頁面 - 改為直向排版 */
        #game-screen { 
            display: none; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw;
        }
        
        /* 工具列固定在最上方 */
        #toolbar { 
            display: flex; 
            flex-wrap: wrap; 
            align-items: center;
            justify-content: center; 
            gap: 10px; 
            padding: 12px; 
            background-color: #ffffff; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            z-index: 10; 
            flex-shrink: 0;
        }
        
        .color-btn { 
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            border: 3px solid #eee; 
            cursor: pointer; 
            transition: transform 0.1s;
        }
        .color-btn.active { 
            border-color: #333; 
            transform: scale(1.15); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .size-btn, .tool-btn { 
            padding: 8px 12px; 
            font-size: 1rem; 
            font-weight: bold;
            border-radius: 12px; 
            border: 2px solid #ccc; 
            background: #f9f9f9; 
            cursor: pointer; 
            color: #333;
        }
        .size-btn.active, .tool-btn.active { 
            background: #ffeb3b; 
            border-color: #ff9800; 
            color: #d84315;
        }
        
        .divider { width: 2px; height: 30px; background: #ddd; margin: 0 5px; border-radius: 2px; }

        /* 中間滾動區域：包含填色區與自畫區 */
        #workspaces {
            flex-grow: 1;
            overflow-y: auto;          /* 允許上下滑動 */
            touch-action: pan-y;       /* 允許手機觸控上下滑動網頁 */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 40px 0;
            gap: 25px;
            background-color: #b2ebf2;
        }

        .section-title {
            font-size: 1.5rem;
            color: #00796b;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 1px 1px #fff;
        }

        /* 畫布的容器 */
        .canvas-wrapper {
            position: relative;
            background-color: #ffffff;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 10px;
            /* 防止在畫畫時不小心滑動了網頁 */
            touch-action: none;
        }

        /* 實際被畫畫的 Canvas (共用樣式) */
        .draw-canvas {
            display: block;
            border-radius: 10px;
            z-index: 1;
        }

        /* 填色區專用的黑線覆蓋圖 */
        #fish-overlay {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none; /* 點擊穿透到畫布 */
            mix-blend-mode: multiply; /* 白色透明，黑線保留 */
            border-radius: 10px;
        }

    </style>
</head>
<body>

    <!-- 首頁 -->
    <div id="home-screen">
        <h1>🎨 小魚填色與畫畫 🖌️</h1>
        <button id="start-btn">
            <img src="Nfish.jpg" alt="按我開始填色！">
        </button>
    </div>

    <!-- 遊戲頁面 -->
    <div id="game-screen">
        <!-- 上方工具列 (共同控制兩個區域) -->
        <div id="toolbar">
            <button class="tool-btn active" id="btn-brush">🖌️ 畫筆</button>
            <button class="tool-btn" id="btn-eraser">🧽 橡皮擦</button>

            <div class="divider"></div>

            <button class="size-btn" data-size="10">細</button>
            <button class="size-btn active" data-size="25">中</button>
            <button class="size-btn" data-size="45">粗</button>

            <div class="divider"></div>

            <div class="color-btn active" style="background-color: #f44336;" data-color="#f44336"></div>
            <div class="color-btn" style="background-color: #ff9800;" data-color="#ff9800"></div>
            <div class="color-btn" style="background-color: #ffeb3b;" data-color="#ffeb3b"></div>
            <div class="color-btn" style="background-color: #4caf50;" data-color="#4caf50"></div>
            <div class="color-btn" style="background-color: #2196f3;" data-color="#2196f3"></div>
            <div class="color-btn" style="background-color: #9c27b0;" data-color="#9c27b0"></div>
            <div class="color-btn" style="background-color: #000000;" data-color="#000000"></div>

            <div class="divider"></div>
            
            <button class="tool-btn" id="btn-clear">🗑️ 重新開始</button>
            <button class="tool-btn" id="btn-home">🏠 首頁</button>
        </div>
        
        <!-- 滾動工作區 -->
        <div id="workspaces">
            <!-- 上半部：填色區 -->
            <div>
                <div class="section-title">✨ 小魚填色區 ✨</div>
                <div class="canvas-wrapper">
                    <!-- 填色畫布 -->
                    <canvas id="coloring-canvas" class="draw-canvas"></canvas>
                    <!-- 黑色線條底圖 -->
                    <img src="Nfish.jpg" id="fish-overlay" alt="fish outline">
                </div>
            </div>

            <!-- 下半部：自畫區 (沒有小魚圖片覆蓋) -->
            <div>
                <div class="section-title">✨ 創意自畫區 ✨</div>
                <div class="canvas-wrapper">
                    <!-- 自由畫布 -->
                    <canvas id="drawing-canvas" class="draw-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 介面與狀態變數
        const homeScreen = document.getElementById('home-screen');
        const gameScreen = document.getElementById('game-screen');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('fish-overlay');
        const workspaces = document.getElementById('workspaces');
        const canvases = document.querySelectorAll('.draw-canvas'); // 取得兩個畫布

        let isDrawing = false;
        let currentColor = '#f44336';
        let currentSize = 25;
        let isEraser = false;
        
        let activeCanvas = null;
        let activeCtx = null;
        let lastX = 0;
        let lastY = 0;

        // 計算並初始化兩個畫布的大小
        function initCanvas() {
            let imgAspect = overlay.naturalWidth / overlay.naturalHeight;
            if (!imgAspect || isNaN(imgAspect)) {
                imgAspect = 1; 
            }

            // 設定畫布寬度為螢幕的 90%，最大不超過 500px
            let newWidth = workspaces.clientWidth * 0.9;
            if (newWidth > 500) newWidth = 500;
            let newHeight = newWidth / imgAspect;

            // 一次設定兩個畫布與它們的容器
            canvases.forEach(canvas => {
                canvas.width = newWidth;
                canvas.height = newHeight;
                canvas.parentElement.style.width = newWidth + 'px';
                canvas.parentElement.style.height = newHeight + 'px';
            });

            // 設定小魚圖片層的大小
            overlay.style.width = newWidth + 'px';
            overlay.style.height = newHeight + 'px';

            clearCanvas();
        }

        // 清空兩個畫布
        function clearCanvas() {
            canvases.forEach(canvas => {
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            });
        }

        // 事件：進入遊戲
        startBtn.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            setTimeout(initCanvas, 150); 
        });

        // 事件：回首頁
        document.getElementById('btn-home').addEventListener('click', () => {
            gameScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });

        document.getElementById('btn-clear').addEventListener('click', clearCanvas);

        // 工具列事件綁定
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentColor = e.target.getAttribute('data-color');
                isEraser = false;
                updateToolUI();
            });
        });

        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentSize = parseInt(e.target.getAttribute('data-size'));
            });
        });

        document.getElementById('btn-brush').addEventListener('click', () => {
            isEraser = false;
            updateToolUI();
        });

        document.getElementById('btn-eraser').addEventListener('click', () => {
            isEraser = true;
            updateToolUI();
        });

        function updateToolUI() {
            document.getElementById('btn-brush').classList.toggle('active', !isEraser);
            document.getElementById('btn-eraser').classList.toggle('active', isEraser);
        }

        // --- 核心繪圖邏輯 (完美避開 AI 吞字 Bug 的終極修正版) ---
        
        function getPos(e, targetCanvas) {
            const rect = targetCanvas.getBoundingClientRect();
            let clientX, clientY;
            
            // 【終極解決方案】：使用 .item(0) 取代中括號，解決程式碼被系統破壞的問題！
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches.item(0).clientX;
                clientY = e.touches.item(0).clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches.item(0).clientX;
                clientY = e.changedTouches.item(0).clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            e.preventDefault(); // 防止滾動網頁
            isDrawing = true;
            activeCanvas = e.target; // 偵測目前點擊的是填色區還是自畫區
            activeCtx = activeCanvas.getContext('2d');
            
            const pos = getPos(e, activeCanvas);
            lastX = pos.x;
            lastY = pos.y;

            activeCtx.beginPath();
            activeCtx.arc(lastX, lastY, currentSize / 2, 0, Math.PI * 2);
            activeCtx.fillStyle = isEraser ? '#ffffff' : currentColor;
            activeCtx.fill();
            activeCtx.closePath();
        }

        function draw(e) {
            e.preventDefault();
            // 確認有在畫畫，並且畫筆沒有跨越到另一個畫布
            if (!isDrawing || e.target !== activeCanvas) return; 
            
            const pos = getPos(e, activeCanvas);

            activeCtx.beginPath();
            activeCtx.moveTo(lastX, lastY);
            activeCtx.lineTo(pos.x, pos.y);
            activeCtx.strokeStyle = isEraser ? '#ffffff' : currentColor;
            activeCtx.lineWidth = currentSize;
            activeCtx.lineCap = 'round'; 
            activeCtx.lineJoin = 'round';
            activeCtx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing(e) {
            if (e) e.preventDefault();
            isDrawing = false;
            activeCanvas = null;
            activeCtx = null;
        }

        // 分別為「填色區」和「自畫區」綁定相同的事件
        canvases.forEach(canvas => {
            // 滑鼠事件
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            // 手機觸控事件 (設定 passive: false 防止畫面滑動)
            canvas.addEventListener('touchstart', startDrawing, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', stopDrawing, {passive: false});
            canvas.addEventListener('touchcancel', stopDrawing, {passive: false});
        });

        // 旋轉螢幕重置畫布
        window.addEventListener('resize', () => {
            if (gameScreen.style.display === 'flex') {
                initCanvas();
            }
        });
    </script>
</body>
</html>
