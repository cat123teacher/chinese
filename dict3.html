<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1B默書三(趣味默書)練習</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F7FFF7;
            --text: #2D3047;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(#4ECDC4 1.5px, transparent 1.5px), radial-gradient(#FF6B6B 1.5px, var(--bg) 1.5px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 620px;
            padding: 20px;
            box-sizing: border-box;
            display: none;
        }
        .active {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1, h2 {
            text-align: center;
            color: var(--primary);
            text-shadow: 2px 2px 0px var(--accent);
            margin-top: 5px;
            margin-bottom: 12px;
        }
        .top-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
        }
        .progress-pill {
            font-size: 1.25em;
            font-weight: bold;
            color: white;
            background: #FF6B6B;
            padding: 6px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 0 #D93838;
        }
        .timer {
            font-size: 1.4em;
            font-weight: bold;
            color: #FF9F1C;
            background: white;
            padding: 5px 15px;
            border-radius: 20px;
            border: 3px solid #FF9F1C;
            box-shadow: 0 4px 0 #FFE66D;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 18px;
            padding: 15px 30px;
            font-size: 1.3em;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
            box-shadow: 0 6px 0 #D93838;
            transition: all 0.1s;
            width: 85%;
            max-width: 340px;
            text-align: center;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }
        .btn:disabled {
            background-color: #ccc;
            box-shadow: 0 4px 0 #999;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: var(--secondary);
            box-shadow: 0 6px 0 #2B938B;
        }
        .btn-secondary:active {
            transform: translateY(6px);
            box-shadow: none;
        }
        .question-box {
            background: white;
            border-radius: 22px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 18px;
            font-size: 1.6em;
            font-weight: bold;
            border: 4px solid var(--secondary);
            position: relative;
        }
        .speak-icon-btn {
            background: var(--accent);
            border: 3px solid #FF9F1C;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 0.75em;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 8px;
            box-shadow: 0 3px 0 #FF9F1C;
        }
        .speak-icon-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        /* 田字格答題紙 */
        .writing-paper-label {
            font-size: 1em;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
            align-self: flex-start;
            padding-left: 5px;
        }
        .writing-paper {
            background: white;
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            border: 3px solid #FF9F1C;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.1em;
            font-weight: bold;
            letter-spacing: 5px;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(#ffe8cc 1px, transparent 1px), linear-gradient(90deg, #ffe8cc 1px, transparent 1px);
            background-size: 36px 36px;
            background-position: center top;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
        }
        .answer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-bottom: 22px;
        }
        .option-btn {
            background: white;
            color: var(--text);
            border: 3px solid var(--secondary);
            border-radius: 18px;
            padding: 20px 10px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--secondary);
            transition: all 0.1s;
        }
        .option-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        .option-btn.selected {
            background-color: var(--accent);
            border-color: #FF9F1C;
            box-shadow: 0 6px 0 #FF9F1C;
            color: #D93838;
        }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
            margin-top: auto;
        }
        .nav-btn {
            flex: 1;
            background: white;
            border: 3px solid #ccc;
            padding: 12px 15px;
            border-radius: 14px;
            font-size: 1.1em;
            font-weight: bold;
            color: var(--text);
            cursor: pointer;
            box-shadow: 0 4px 0 #ccc;
        }
        .nav-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        /* 龍虎榜與溫習卡 */
        .leaderboard {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            margin-top: 15px;
            border: 4px solid #FFD166;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 2px dashed #eee;
            font-size: 1.15em;
            font-weight: bold;
        }
        .leaderboard-item:last-child {
            border-bottom: none;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #06D6A0;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(6, 214, 160, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(6, 214, 160, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 214, 160, 0); }
        }
        .vocab-card {
            background: white;
            border-radius: 20px;
            padding: 18px;
            width: 100%;
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
            margin-top: 18px;
            border: 4px solid var(--secondary);
            text-align: center;
        }
        .vocab-tags {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 12px;
        }
        .vocab-tag {
            background: #F7FFF7;
            border: 2px solid var(--secondary);
            border-radius: 12px;
            padding: 10px 5px;
            font-size: 1.15em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--secondary);
        }
        .vocab-tag:active {
            transform: translateY(3px);
            box-shadow: none;
            background: var(--accent);
        }
        input[type="text"] {
            padding: 12px;
            font-size: 1.3em;
            border-radius: 12px;
            border: 3px solid var(--secondary);
            width: 85%;
            max-width: 300px;
            text-align: center;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .review-box {
            background: white;
            border-radius: 20px;
            padding: 18px;
            width: 100%;
            margin-top: 15px;
            border: 4px solid var(--accent);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }
        .review-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 5px;
            border-bottom: 1px dashed #ddd;
            font-size: 1.1em;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- 主頁 -->
<div id="home" class="container active">
    <h1>📝 1B默書三(趣味默書)練習</h1>
    <button class="btn" onclick="startGame()">🚀 開始默書挑戰！(12題)</button>
    
    <!-- 首頁龍虎榜 -->
    <div class="leaderboard">
        <h2>🏆 1B 雲端即時龍虎榜</h2>
        <div style="text-align: center; margin-bottom: 10px; font-size: 0.95em; color: #555; font-weight: bold;">
            <span class="status-dot" id="statusDot"></span>
            <span id="syncStatusText">雲端即時同步中</span>
        </div>
        <div id="leaderboard-list">
            <div style="text-align:center; padding: 15px;">載入中...</div>
        </div>
    </div>

    <!-- 12個溫習形容詞點讀區 -->
    <div class="vocab-card">
        <h2 style="font-size: 1.3em; margin-top: 0;">🔊 溫習範圍 (點擊聽普通話及例子)</h2>
        <div class="vocab-tags" id="vocabTags"></div>
        <div id="examplePreview" style="margin-top: 12px; font-size: 1.05em; color: #D93838; font-weight: bold; min-height: 26px;"></div>
    </div>
</div>

<!-- 遊戲答題頁 -->
<div id="game" class="container">
    <div class="top-status-bar">
        <div class="progress-pill" id="progressDisplay">第 1 / 12 題</div>
        <div class="timer" id="timerDisplay">⏱️ 00:00</div>
    </div>

    <div class="question-box">
        <span id="questionBox">載入中...</span>
        <button class="speak-icon-btn" onclick="speakCurrentQuestion()" title="再聽一次">🔊</button>
    </div>

    <div class="writing-paper-label">✏️ 小朋友答題紙：</div>
    <div class="writing-paper" id="writingPaper"></div>

    <div class="answer-grid" id="answerGrid"></div>
    
    <div class="nav-bar">
        <button class="nav-btn" onclick="prevQuestion()" id="prevBtn" style="visibility: hidden;">⬅️ 上一頁</button>
        <button class="nav-btn" onclick="goHome()">🏠 回主頁</button>
        <button class="nav-btn" onclick="nextQuestion()" id="nextBtn">下一頁 ➡️</button>
    </div>
</div>

<!-- 成績與結算頁 -->
<div id="result" class="container">
    <h1>🎉 挑戰完成！</h1>
    <div class="question-box">
        <div id="starDisplay" style="font-size: 1.3em; margin-bottom: 5px;">⭐⭐⭐</div>
        <p style="margin: 8px 0;">答對題數：<span id="scoreText" style="color: var(--primary); font-size: 1.3em;"></span> / 12</p>
        <p style="margin: 8px 0; font-size: 0.85em; color: #FF9F1C;">所需時間：<span id="finalTimeText"></span></p>
    </div>
    
    <div id="submitRecordDiv" class="leaderboard" style="text-align: center; margin-top: 0; margin-bottom: 15px;">
        <h2 style="margin-top: 0;">📝 登錄龍虎榜</h2>
        <input type="text" id="playerName" placeholder="請輸入你的名字 (例如: 林煒晴)" maxlength="10">
        <br>
        <button class="btn btn-secondary" id="submitBtn" onclick="submitScore()">🚀 提交成績</button>
    </div>

    <button class="btn" onclick="startGame()">🔄 再玩一次</button>
    <button class="btn btn-secondary" onclick="goHome()">🏠 回主頁</button>

    <!-- 全卷12題重溫清單 -->
    <div class="review-box">
        <h2>📖 題目溫習清單 (點擊 🔊 聽普通話)</h2>
        <div id="reviewList"></div>
    </div>
</div>

<script>
    // 題庫資料 (12 個形容詞 x 10 個例子 = 120 題，附 Emoji)
    const dictationData = {
        "香甜": [
            { n: "的蘋果", e: "🍎" }, { n: "的芒果", e: "🥭" }, { n: "的草莓", e: "🍓" }, { n: "的果汁", e: "🧃" }, { n: "的西瓜", e: "🍉" },
            { n: "的蜜糖", e: "🍯" }, { n: "的雪糕", e: "🍦" }, { n: "的蛋糕", e: "🍰" }, { n: "的菠蘿", e: "🍍" }, { n: "的水蜜桃", e: "🍑" }
        ],
        "尖尖": [
            { n: "的鉛筆", e: "✏️" }, { n: "的牙齒", e: "🦷" }, { n: "的指甲", e: "💅" }, { n: "的刀子", e: "🔪" }, { n: "的樹枝", e: "🌿" },
            { n: "的針", e: "🪡" }, { n: "的屋頂", e: "🏠" }, { n: "的山峰", e: "⛰️" }, { n: "的剪刀", e: "✂️" }, { n: "的角", e: "🦄" }
        ],
        "閃亮": [
            { n: "的星星", e: "🌟" }, { n: "的鑽石", e: "💎" }, { n: "的眼睛", e: "👀" }, { n: "的燈光", e: "💡" }, { n: "的寶石", e: "💍" },
            { n: "的皇冠", e: "👑" }, { n: "的鏡子", e: "🪞" }, { n: "的戒指", e: "💍" }, { n: "的項鍊", e: "📿" }, { n: "的陽光", e: "☀️" }
        ],
        "高高": [
            { n: "的大廈", e: "🏢" }, { n: "的山", e: "🏔️" }, { n: "的樹木", e: "🌳" }, { n: "的長頸鹿", e: "🦒" }, { n: "的塔", e: "🗼" },
            { n: "的圍牆", e: "🧱" }, { n: "的雲", e: "☁️" }, { n: "的梯子", e: "🪜" }, { n: "的摩天輪", e: "🎡" }, { n: "的橋", e: "🌉" }
        ],
        "潔白": [
            { n: "的牙齒", e: "😁" }, { n: "的雪", e: "❄️" }, { n: "的雲", e: "☁️" }, { n: "的紙", e: "📄" }, { n: "的羽毛", e: "🪶" },
            { n: "的天鵝", e: "🦢" }, { n: "的牆壁", e: "⬜" }, { n: "的裙子", e: "👗" }, { n: "的襯衫", e: "👔" }, { n: "的花朵", e: "🌼" }
        ],
        "彎彎": [
            { n: "的月亮", e: "🌙" }, { n: "的小河", e: "🏞️" }, { n: "的香蕉", e: "🍌" }, { n: "的小路", e: "🛣️" }, { n: "的眉毛", e: "🤨" },
            { n: "的橋", e: "🌉" }, { n: "的彩虹", e: "🌈" }, { n: "的梳子", e: "🪮" }, { n: "的微笑", e: "😊" }, { n: "的弓", e: "🏹" }
        ],
        "明亮": [
            { n: "的教室", e: "🏫" }, { n: "的眼睛", e: "👁️" }, { n: "的房間", e: "🛋️" }, { n: "的月光", e: "🌕" }, { n: "的燈泡", e: "💡" },
            { n: "的星空", e: "🌌" }, { n: "的早上", e: "🌅" }, { n: "的窗戶", e: "🪟" }, { n: "的火光", e: "🔥" }, { n: "的太陽", e: "☀️" }
        ],
        "美麗": [
            { n: "的花朵", e: "🌸" }, { n: "的公主", e: "👸" }, { n: "的風景", e: "🏞️" }, { n: "的蝴蝶", e: "🦋" }, { n: "的衣服", e: "👚" },
            { n: "的彩虹", e: "🌈" }, { n: "的天空", e: "🌤️" }, { n: "的圖畫", e: "🖼️" }, { n: "的故事", e: "📖" }, { n: "的香港", e: "🇭🇰" }
        ],
        "好看": [
            { n: "的圖書", e: "📚" }, { n: "的電影", e: "🎬" }, { n: "的電視", e: "📺" }, { n: "的表演", e: "🎪" }, { n: "的衣服", e: "👕" },
            { n: "的裙子", e: "👗" }, { n: "的鞋子", e: "👟" }, { n: "的卡通", e: "🧸" }, { n: "的漫畫", e: "📙" }, { n: "的顏色", e: "🎨" }
        ],
        "圓圓": [
            { n: "的皮球", e: "⚽" }, { n: "的西瓜", e: "🍉" }, { n: "的臉蛋", e: "👶" }, { n: "的月亮", e: "🌕" }, { n: "的太陽", e: "☀️" },
            { n: "的車輪", e: "🛞" }, { n: "的眼睛", e: "👀" }, { n: "的餅乾", e: "🍪" }, { n: "的雞蛋", e: "🥚" }, { n: "的硬幣", e: "🪙" }
        ],
        "甜甜": [
            { n: "的糖果", e: "🍬" }, { n: "的笑容", e: "😄" }, { n: "的巧克力", e: "🍫" }, { n: "的草莓", e: "🍓" }, { n: "的果汁", e: "🍹" },
            { n: "的雪糕", e: "🍨" }, { n: "的蛋糕", e: "🎂" }, { n: "的夢", e: "💭" }, { n: "的聲音", e: "🎵" }, { n: "的蜜糖", e: "🍯" }
        ],
        "香香": [
            { n: "的花朵", e: "🌺" }, { n: "的飯菜", e: "🍱" }, { n: "的麵包", e: "🍞" }, { n: "的香水", e: "🧴" }, { n: "的洗頭水", e: "🫧" },
            { n: "的番皂", e: "🧼" }, { n: "的餅乾", e: "🍪" }, { n: "的烤肉", e: "🍖" }, { n: "的茶", e: "🍵" }, { n: "的草地", e: "🌱" }
        ]
    };

    const adjectives = Object.keys(dictationData);
    let currentQuestions = [];
    let currentQIndex = 0;
    let userAnswers = [];
    let timerInterval;
    let startTime;
    let totalSeconds = 0;
    let currentScore = 0;

    // 語音功能 (強制普通話發音)
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const mandarinVoice = voices.find(v =>
                (v.lang.includes('zh-CN') || v.lang.includes('cmn') || v.lang.includes('zh-TW')) &&
                !v.lang.includes('HK') && !v.name.includes('Cantonese') && !v.name.includes('粵')
            );
            if (mandarinVoice) utterance.voice = mandarinVoice;
            utterance.lang = 'zh-CN';
            utterance.rate = 0.92;
            window.speechSynthesis.speak(utterance);
        }
    }

    // 建立首頁溫習詞語按鈕
    function initVocabTags() {
        const container = document.getElementById('vocabTags');
        const preview = document.getElementById('examplePreview');
        container.innerHTML = '';
        adjectives.forEach(adj => {
            const btn = document.createElement('div');
            btn.className = 'vocab-tag';
            btn.innerText = adj;
            btn.onclick = () => {
                const arr = dictationData[adj];
                const item = arr[Math.floor(Math.random() * arr.length)];
                speak(adj + "，" + adj + item.n);
                preview.innerText = `${item.e} 例子：${arr.slice(0, 4).map(x => adj + x.n).join('、')}...`;
            };
            container.appendChild(btn);
        });
    }
    initVocabTags();

    function generateQuestions() {
        let shuffledAdjs = [...adjectives].sort(() => 0.5 - Math.random());
        currentQuestions = shuffledAdjs.map(adj => {
            let item = dictationData[adj][Math.floor(Math.random() * dictationData[adj].length)];
            let noun = item.n;
            let emoji = item.e;
            
            let options = [adj];
            let otherAdjs = adjectives.filter(a => a !== adj).sort(() => 0.5 - Math.random());
            options.push(otherAdjs[0], otherAdjs[1], otherAdjs[2]);
            options.sort(() => 0.5 - Math.random());

            return { adj, noun, emoji, options, answer: adj + noun, qText: "＿＿" + noun };
        });
    }

    function showPage(pageId) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        window.scrollTo(0, 0);
    }

    function goHome() {
        clearInterval(timerInterval);
        showPage('home');
    }

    function startTimer() {
        clearInterval(timerInterval);
        startTime = Date.now();
        document.getElementById('timerDisplay').innerText = `⏱️ 00:00`;
        timerInterval = setInterval(() => {
            totalSeconds = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('timerDisplay').innerText = `⏱️ ${formatTime(totalSeconds)}`;
        }, 500);
    }

    function formatTime(seconds) {
        let m = String(Math.floor(seconds / 60)).padStart(2, '0');
        let s = String(seconds % 60).padStart(2, '0');
        return `${m}:${s}`;
    }

    function startGame() {
        generateQuestions();
        currentQIndex = 0;
        userAnswers = new Array(12).fill(null);
        totalSeconds = 0;
        
        // 重置龍虎榜輸入框
        document.getElementById('submitRecordDiv').innerHTML = `
            <h2 style="margin-top: 0;">📝 登錄龍虎榜</h2>
            <input type="text" id="playerName" placeholder="請輸入你的名字 (例如: 林煒晴)" maxlength="10">
            <br>
            <button class="btn btn-secondary" id="submitBtn" onclick="submitScore()">🚀 提交成績</button>
        `;
        
        startTimer();
        renderQuestion();
        showPage('game');
    }

    function speakCurrentQuestion() {
        let q = currentQuestions[currentQIndex];
        if (userAnswers[currentQIndex]) {
            speak(userAnswers[currentQIndex] + q.noun);
        } else {
            speak(q.qText.replace("＿＿", "甚麼"));
        }
    }

    function renderQuestion() {
        let q = currentQuestions[currentQIndex];
        document.getElementById('progressDisplay').innerText = `第 ${currentQIndex + 1} / 12 題`;
        document.getElementById('questionBox').innerText = `${q.emoji} ${q.qText}`;
        speak(q.qText.replace("＿＿", "甚麼"));
        
        let paper = document.getElementById('writingPaper');
        if (userAnswers[currentQIndex]) {
            paper.innerText = userAnswers[currentQIndex] + q.noun;
            paper.style.color = 'var(--primary)';
        } else {
            paper.innerText = "＿＿" + q.noun;
            paper.style.color = '#ccc';
        }

        let grid = document.getElementById('answerGrid');
        grid.innerHTML = '';
        q.options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn' + (userAnswers[currentQIndex] === opt ? ' selected' : '');
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(opt, q.noun);
            grid.appendChild(btn);
        });

        document.getElementById('prevBtn').style.visibility = currentQIndex > 0 ? 'visible' : 'hidden';
        
        let nextBtn = document.getElementById('nextBtn');
        if (currentQIndex === 11) {
            nextBtn.innerText = "交卷 🏁";
            nextBtn.style.backgroundColor = "#06D6A0";
            nextBtn.style.color = "white";
            nextBtn.style.borderColor = "#059669";
        } else {
            nextBtn.innerText = "下一頁 ➡️";
            nextBtn.style.backgroundColor = "white";
            nextBtn.style.color = "var(--text)";
            nextBtn.style.borderColor = "#ccc";
        }
    }

    function selectAnswer(adj, noun) {
        speak(adj + noun);
        userAnswers[currentQIndex] = adj;
        
        let paper = document.getElementById('writingPaper');
        paper.innerText = adj + noun;
        paper.style.color = 'var(--primary)';

        let btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => {
            b.classList.toggle('selected', b.innerText === adj);
        });
        
        setTimeout(() => {
            if(currentQIndex < 11) {
                nextQuestion();
            }
        }, 550);
    }

    function prevQuestion() {
        if (currentQIndex > 0) {
            currentQIndex--;
            renderQuestion();
        }
    }

    function nextQuestion() {
        if (currentQIndex < 11) {
            currentQIndex++;
            renderQuestion();
        } else {
            finishGame();
        }
    }

    function finishGame() {
        clearInterval(timerInterval);
        currentScore = 0;
        const reviewList = document.getElementById('reviewList');
        reviewList.innerHTML = '';

        for(let i = 0; i < 12; i++) {
            const q = currentQuestions[i];
            const isCorrect = userAnswers[i] === q.adj;
            if(isCorrect) currentScore++;

            const row = document.createElement('div');
            row.className = 'review-row';
            const fullAnswer = q.adj + q.noun;
            row.innerHTML = `
                <span>${i+1}. ${q.emoji} ${fullAnswer} ${isCorrect ? '✅' : `❌(選了:${userAnswers[i] || '未答'})`}</span>
                <button class="speak-icon-btn" style="width:36px;height:36px;font-size:0.9em;" onclick="speak('${fullAnswer}')">🔊</button>
            `;
            reviewList.appendChild(row);
        }

        document.getElementById('scoreText').innerText = currentScore;
        document.getElementById('finalTimeText').innerText = formatTime(totalSeconds);
        document.getElementById('starDisplay').innerText =
            currentScore === 12 ? "🏆🌟🌟🌟🏆" :
            currentScore >= 9 ? "⭐⭐⭐" :
            currentScore >= 6 ? "⭐⭐" : "⭐";

        speak(`挑戰完成，你答對了${currentScore}題，用了${Math.floor(totalSeconds/60)}分${totalSeconds%60}秒`);
        showPage('result');
    }
</script>

<!-- Firebase 雲端即時同步模組 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
        initializeFirestore,
        collection,
        addDoc,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBdzlMQ57R0M-JYUlhA3hsSPP5k_-Ictq4",
        authDomain: "hkbuas-1b-games.firebaseapp.com",
        projectId: "hkbuas-1b-games",
        storageBucket: "hkbuas-1b-games.firebasestorage.app",
        messagingSenderId: "667373437790",
        appId: "1:667373437790:web:8117960182c15969a585cf"
    };

    const app = initializeApp(firebaseConfig);
    // 防卡死長輪詢設定，確保手機、iPad 與電腦秒速上傳
    const db = initializeFirestore(app, {
        experimentalForceLongPolling: true
    });

    const colRef = collection(db, "leaderboard");
    let cachedList = [];

    function renderLeaderboard(list) {
        const listDiv = document.getElementById('leaderboard-list');
        if (!listDiv) return;

        if (list.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center; padding: 20px;">快來成為第一個挑戰者吧！🚀</div>';
            return;
        }

        listDiv.innerHTML = '';
        list.slice(0, 15).forEach((data, idx) => {
            const rank = idx + 1;
            const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : ` ${rank}. `;
            const item = document.createElement('div');
            item.className = 'leaderboard-item';
            if (rank === 1) item.style.backgroundColor = '#FFF9DB';
            item.innerHTML = `
                <span>${medal} ${data.name}</span>
                <span>✅ ${data.score}題 ⏱️ ${formatTime(data.time)}</span>
            `;
            listDiv.appendChild(item);
        });
    }

    // 即時監聽雲端排行榜，電腦與手機同步自動更新
    onSnapshot(colRef, (snapshot) => {
        const statusText = document.getElementById('syncStatusText');
        if (statusText) statusText.innerText = "雲端即時同步中 (電腦/手機/iPad)";

        const arr = [];
        snapshot.forEach(doc => {
            const d = doc.data();
            if (d && d.name) {
                arr.push({
                    name: String(d.name),
                    score: Number(d.score || 0),
                    time: Number(d.time || 999)
                });
            }
        });

        // 先按答對題數由高至低，再按時間由快至慢排序
        arr.sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            return a.time - b.time;
        });

        cachedList = arr;
        renderLeaderboard(cachedList);
    }, (error) => {
        console.error("讀取失敗:", error);
        const listDiv = document.getElementById('leaderboard-list');
        if (listDiv) listDiv.innerHTML = '<div style="color:red; text-align:center;">讀取失敗，請確認網路連線。</div>';
    });

    // 提交成績
    window.submitScore = async function() {
        const nameInput = document.getElementById('playerName');
        const submitBtn = document.getElementById('submitBtn');
        const name = nameInput ? nameInput.value.trim() : "";

        if (!name) {
            alert("請輸入名字喔！");
            return;
        }

        submitBtn.innerText = "上傳中...";
        submitBtn.disabled = true;

        try {
            await addDoc(colRef, {
                name: name,
                score: currentScore,
                time: totalSeconds,
                timestamp: Date.now()
            });

            const rankIdx = cachedList.findIndex(
                x => x.name === name && x.score === currentScore && x.time === totalSeconds
            );
            const myRank = rankIdx !== -1 ? rankIdx + 1 : 1;

            document.getElementById('submitRecordDiv').innerHTML = `
                <h2 style="color:#06D6A0; margin: 10px 0;">✅ 成績已上傳到雲端！</h2>
                <div style="font-size: 1.3em; font-weight: bold;">🎉 恭喜 ${name}，目前排第 <span style="color:var(--primary); font-size:1.4em;">${myRank}</span> 名！</div>
            `;
            speak(`恭喜${name}，你目前排第${myRank}名`);
        } catch (e) {
            console.error("Error adding document: ", e);
            alert("上傳失敗，請稍後再試。");
            submitBtn.innerText = "🚀 提交成績";
            submitBtn.disabled = false;
        }
    };
</script>
</body>
