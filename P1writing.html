<style>

    .progress-btn:active { transform: translateY(4px); box-shadow: 0 0 #BF360C; }
    
    #game-container { max-width: 950px; margin: 20px auto; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); padding: 25px; border: 8px solid #FFB74D; position: relative;}

    .level-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 25px;}
    .level-btn { background-color: #81C784; border: none; border-radius: 18px; padding: 15px 10px; font-size: 20px; font-weight: bold; color: #fff; cursor: pointer; width: 45%; box-shadow: 0 6px #4CAF50; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px; }

    .level-btn:nth-child(2n) { background-color: #64B5F6; box-shadow: 0 6px #2196F3; }
    .level-btn:nth-child(3n) { background-color: #FFB74D; box-shadow: 0 6px #FF9800; }
    .level-btn:nth-child(4n) { background-color: #BA68C8; box-shadow: 0 6px #9C27B0; }

    .active-screen { display: block; }

        text-shadow: 2px 2px 4px rgba(0,0,0,0.4); transition: all 0.15s ease; animation: floatPulse 2s infinite; 
    }
    .start-btn:hover { background: linear-gradient(to bottom, #FF8A65, #E53935); transform: scale(1.05) translateY(-2px); }
    .start-btn:active { transform: translateY(10px) scale(0.98); box-shadow: 0 0 0 #BF360C, 0 5px 10px rgba(0,0,0,0.2); animation: none; }
    @keyframes floatPulse { 0% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-6px) scale(1.03); box-shadow: 0 16px 0 #BF360C, 0 25px 25px rgba(0,0,0,0.25); } 100% { transform: translateY(0px) scale(1); } }

<script>
// 音效與 Web Audio API
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if(!audioCtx) audioCtx = new AudioContext(); }

function playSound(isCorrect) {
    initAudio();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    if (isCorrect) {
        osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15); 
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3); 
        gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.start(); osc.stop(audioCtx.currentTime + 0.6);
    } else {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.4);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }
}

// 語音朗讀
function playAudioText(text, e) {
    if(e) e.stopPropagation(); 
    if(!text) return;
    const utterance = new SpeechSynthesisUtterance(text.replace(/____/g, "空格").replace(/❌/g, ""));
    utterance.lang = "zh-HK"; utterance.rate = 0.85; 
    speechSynthesis.speak(utterance);
}

}

// 渲染關卡按鈕
function renderLevelButtons() {
    const grid = document.getElementById("level-grid");
    grid.innerHTML = ""; 
    
    let storedScores = JSON.parse(localStorage.getItem('tc_level_scores')) || {};

    levelData.forEach(level => {
        let score = storedScores[level.id] || 0;
        let starHTML = "";
        
        if (score === 20) {
            starHTML = `<div style="font-size:24px; margin-top:5px;">🌟</div>`;
        } else if (score >= 10) {
            starHTML = `<div style="font-size:24px; margin-top:5px;">⭐</div>`;
        } else {
            starHTML = `<div style="font-size:24px; margin-top:5px; visibility:hidden;">⭐</div>`; 
        }

        const btn = document.createElement("button");
        btn.className = "level-btn";
        btn.innerHTML = `<span>${level.title}</span>${starHTML}`;
        btn.onclick = () => { 
            currentLevelObj = level; 
            document.getElementById("tut-title").innerText = level.title; 
            document.getElementById("tutorial-box").innerHTML = level.tutorial;
            showScreen('tutorial-screen');
        };
        grid.appendChild(btn);
    });
}

function showScreen(id) { 
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); 
    document.getElementById(id).classList.add('active-screen'); 
    document.getElementById('tc-hint-box').style.display = 'none'; 
    document.getElementById('skip-btn-container').style.display = 'none';
    isRetryMode = false;
    
    if (id === 'home-screen') {
        renderLevelButtons();
    }
}

function startGame() {
    initAudio(); currentQIndex = 0; answersRecord = new Array(20).fill(false);

    selectedQuestions = [...finalEasy, ...finalHard]; 
    
    showScreen('game-screen'); renderQuestion();
}

    currentAnswers = {}; 
    
    document.getElementById("btn-prev").style.display = isRetryMode ? "none" : "inline-block";
    document.getElementById("btn-next").style.display = isRetryMode ? "none" : "inline-block";
    document.getElementById("tc-hint-box").style.display = "none"; 
    document.getElementById("skip-btn-container").style.display = "none";
    document.getElementById("feedback-text").innerText = "";

    if(isRetryMode) {
        document.getElementById("tc-hint-box").style.display = "flex";
        document.getElementById("tc-hint-text").innerText = currentLevelObj.hint[currentLevelObj.id - 1];
        document.getElementById("feedback-text").style.color = "#D84315";
        document.getElementById("feedback-text").innerText = "💡 現在是重做模式，一直答到對為止喔！";
    }

    document.getElementById("progress-text").innerText = isRetryMode ? `【錯誤重做】第 ${qIndexToRender + 1} 題` : `第 ${currentLevelObj.id} 關 | 題： ${qIndexToRender + 1}/20`;
    document.getElementById("question-text").innerHTML = "✏️ " + qData.q.replace(/\n/g, "<br>");

    const dzContainer = document.getElementById("dropzones"); dzContainer.innerHTML = "";
    qData.dropzones.forEach(dz => {
        const box = document.createElement("div"); box.className = "drop-box"; box.id = dz.id; box.innerHTML = `<span style="font-size:18px;">${dz.label}</span>`;
        box.ondragover = (e) => { e.preventDefault(); box.style.borderColor="#42A5F5"; };
        box.ondragleave = () => box.style.borderColor="#BDBDBD";
        box.ondrop = (e) => handleDrop(e, box, dz.id, qData.answers[dz.id]);
        box.onclick = () => handleTapDrop(box, dz.id, qData.answers[dz.id]);
        dzContainer.appendChild(box);
    });

    const dragContainer = document.getElementById("draggables"); dragContainer.innerHTML = "";
    
    [...qData.options].sort(() => Math.random() - 0.5).forEach((opt, index) => {
        const item = document.createElement("div"); item.className = "drag-item"; item.draggable = true; item.id = "drag-" + index; item.dataset.value = opt.text;
        item.innerHTML = `
            <span class="text-val">${opt.text}</span>
            <button class="audio-btn" style="width:35px; height:35px; font-size:16px; margin-left:10px;" onclick="playAudioText('${opt.text}', event)">🔊</button>
        `;
        item.ondragstart = (e) => { draggedItem = item; e.dataTransfer.setData("text/plain", item.id); };
        item.onclick = (e) => { if(e.target.tagName==='BUTTON')return; draggedItem = item; document.getElementById("feedback-text").style.color="#F57C00"; document.getElementById("feedback-text").innerText = `💡 已選取「${opt.text}」，請點擊虛線空格！`; };
        dragContainer.appendChild(item);
    });
}

function prevQuestion() { if(currentQIndex > 0) { currentQIndex--; renderQuestion(); } }
function nextQuestion() { if(currentQIndex < 19) { currentQIndex++; renderQuestion(); } else { generateSummary(); } }

function skipQuestion() {
    document.getElementById("skip-btn-container").style.display = 'none';
    draggedItem = null;
    if (isRetryMode) { generateSummary(); } 
    else { answersRecord[currentQIndex] = false; nextQuestion(); }
}

function handleDrop(e, box, boxId, correct) { e.preventDefault(); box.style.borderColor="#BDBDBD"; if(draggedItem) checkAnswer(box, boxId, correct); }
function handleTapDrop(box, boxId, correct) { if(!draggedItem) { document.getElementById("feedback-text").style.color="#EF5350"; document.getElementById("feedback-text").innerText = "👇 請先點擊下方字卡！"; return; } checkAnswer(box, boxId, correct); }

function checkAnswer(box, boxId, correct) {
    let qIndex = isRetryMode ? retryQIndex : currentQIndex;
    
    if (draggedItem.dataset.value === correct) {
        let textHtml = draggedItem.querySelector('.text-val').outerHTML;
        box.innerHTML = textHtml; 
        box.classList.add("filled"); draggedItem.style.visibility = "hidden"; draggedItem = null; 
        currentAnswers[boxId] = true;
        document.getElementById("skip-btn-container").style.display = "none"; 
        
        if (Object.keys(currentAnswers).length === selectedQuestions[qIndex].dropzones.length) {
            playSound(true); showCelebration(); 
            document.getElementById("feedback-text").style.color = "#4CAF50"; 
            document.getElementById("feedback-text").innerText = "🎉 完美過關！";
            
            if(!isRetryMode) {
                answersRecord[qIndex] = true; setTimeout(() => { nextQuestion(); }, 1800);
            } else {
                answersRecord[retryQIndex] = true; setTimeout(() => { generateSummary(); }, 1800);
            }
        }
    } else {
        playSound(false); 
        document.getElementById("feedback-text").style.color = "#EF5350"; 
        document.getElementById("feedback-text").innerText = "❌ 好像不對喔，請再試一次！"; 
        draggedItem = null;
        
        document.getElementById("tc-hint-box").style.display = "flex";
        document.getElementById("tc-hint-text").innerText = currentLevelObj.hint[currentLevelObj.id - 1];
        document.getElementById("skip-btn-container").style.display = "block";
        
        if(!isRetryMode) { answersRecord[qIndex] = false; }
    }
}

function showCelebration() {
    const celeb = document.getElementById('celebration'); celeb.style.display = 'flex'; celeb.classList.add('pop-anim');
    setTimeout(() => { celeb.style.display = 'none'; celeb.classList.remove('pop-anim'); }, 1500);
}

function generateSummary() {
    showScreen('result-screen');
    let correctNum = answersRecord.filter(Boolean).length;
    let finalScore = correctNum; 
    
    document.getElementById("score-text").innerText = `你的成績：${finalScore} / 20 分！`;
    
    let starText = "";
    if(finalScore === 20) starText = "太強了！你獲得了點亮的大星星 🌟";
    else if(finalScore >= 10) starText = "恭喜合格！你獲得了點亮的小星星 ⭐";
    else starText = "加油喔！再試一次爭取星星吧！";
    document.getElementById("star-award-text").innerText = starText;
    
    let storedScores = JSON.parse(localStorage.getItem('tc_level_scores')) || {};
    let oldScore = storedScores[currentLevelObj.id] || 0;
    
    if (finalScore > oldScore) { 
        storedScores[currentLevelObj.id] = finalScore; 
        localStorage.setItem('tc_level_scores', JSON.stringify(storedScores)); 
    }
    
    let listHTML = "";
    for(let i=0; i<20; i++) {
        let isRight = answersRecord[i];
        let symbol = isRight ? "<span style='color:#4CAF50;'>✅ 答對</span>" : "<span style='color:#EF5350;'>❌ 答錯</span>";
        let retryBtn = isRight ? "" : `<button class="retry-btn" onclick="startRetry(${i})">🔄 重新做這題</button>`;
        listHTML += `<div class="summary-item"><span>第 ${i+1} 題：${symbol}</span> ${retryBtn}</div>`;
    }
    document.getElementById("summary-list").innerHTML = listHTML;
}

function startRetry(index) { isRetryMode = true; retryQIndex = index; showScreen('game-screen'); renderQuestion(); }

function openProgressRecord() {
    let storedScores = JSON.parse(localStorage.getItem('tc_level_scores')) || {}; let html = '';
    for (let i = 1; i <= 10; i++) {
        let score = storedScores[i], starIcon = '❌', scoreText = '未挑戰', starSize = '24px';
        if (score !== undefined) {
            scoreText = `最高分數: ${score} / 20`;
            if (score === 20) { starIcon = '🌟'; starSize = '36px'; } else if (score >= 10) { starIcon = '⭐'; starSize = '24px'; }
        }
        html += `<div class="record-item"><span style="font-weight:bold; color:#3F51B5;">第 ${i} 關</span><span style="color:#555;">${scoreText}</span><span style="font-size: ${starSize}">${starIcon}</span></div>`;
    }
    document.getElementById('progress-list').innerHTML = html; showScreen('progress-screen');
}

function clearRecord() {
    if(confirm("確定要清除所有辛苦獲得的成績與星星記錄嗎？")) { 
        localStorage.removeItem('tc_level_scores'); 
        openProgressRecord(); 
        renderLevelButtons(); 
    }
}
</script>
