<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>影輝苑A,B座設計DIY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0f172a;
      font-family: 'Noto Sans TC', sans-serif;
      color: #f8fafc;
    }
    #app-shell {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }
    /* 3D Layout occupies 80% of screen height on mobile/portrait */
    #viewport-stage {
      position: relative;
      width: 100%;
      height: 80dvh;
      flex: 1 1 80%;
      min-height: 55%;
      background: radial-gradient(circle at 50% 42%, #1e293b 0%, #0f172a 100%);
      overflow: hidden;
    }
    /* Bottom Design Menu occupies 20% of screen height */
    #design-drawer {
      width: 100%;
      height: 20dvh;
      flex: 0 0 20dvh;
      background: rgba(15, 23, 42, 0.98);
      border-top: 1px solid rgba(245, 158, 11, 0.4);
      display: flex;
      flex-direction: column;
      z-index: 40;
      transition: height 0.22s ease, flex-basis 0.22s ease;
    }
    #design-drawer.drawer-collapsed {
      height: 40px !important;
      flex: 0 0 40px !important;
    }
    #design-drawer.drawer-collapsed #drawer-body {
      display: none !important;
    }
    /* Landscape split view for mobile rotation */
    @media (orientation: landscape) and (max-height: 540px) {
      #app-shell {
        flex-direction: row;
      }
      #viewport-stage {
        width: 74vw;
        height: 100dvh !important;
        flex: 1 1 74%;
      }
      #design-drawer {
        width: 26vw;
        height: 100dvh !important;
        flex: 0 0 26vw;
        border-top: none;
        border-left: 1px solid rgba(245, 158, 11, 0.4);
      }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-pill {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .nav-tab-active {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%) !important;
      color: #0f172a !important;
      font-weight: 900 !important;
    }
    .zone-btn-active {
      background: #f59e0b !important;
      color: #0f172a !important;
      font-weight: 900 !important;
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <!-- ==================== 80% 3D LAYOUT STAGE ==================== -->
    <div id="viewport-stage">
      <div id="canvas-container" class="w-full h-full"></div>

      <!-- Compact Top Overlay Bar (Unit Picker + View Icons + 6 Focus Zones) -->
      <div class="absolute top-1.5 left-1.5 right-1.5 z-20 flex flex-col gap-1 pointer-events-none">
        <div class="flex items-center justify-between gap-1">
          <!-- Title & Unit Selector Button -->
          <div class="glass-pill px-2 py-1 rounded-xl flex items-center gap-1.5 pointer-events-auto shadow-lg">
            <span class="text-[11px] font-black text-white tracking-tight hidden sm:inline">影輝苑A,B座設計DIY</span>
            <button onclick="openUnitModal()" class="px-2 py-0.5 rounded-lg bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black text-[11px] flex items-center gap-1 shadow active:scale-95">
              <span>🏢</span>
              <span id="current-unit-label">B10室</span>
              <span class="text-[9px]">▼</span>
            </button>
            <span id="current-unit-type-badge" class="text-[9px] text-amber-300 font-bold hidden md:inline">三房大則</span>
          </div>

          <!-- Simple Icon + Short Text Toolbar (Removed 2D & SeaView buttons as requested) -->
          <div class="glass-pill px-1 py-0.5 rounded-xl flex items-center gap-0.5 pointer-events-auto overflow-x-auto no-scrollbar shadow-lg">
            <button onclick="fitFullLayoutTopView()" id="cam-fitall" class="px-2 py-0.5 rounded-lg bg-gradient-to-r from-cyan-500 to-sky-500 text-slate-950 text-[10px] font-black shrink-0 shadow">🗺️全景俯視</button>
            <button onclick="setCameraView('iso3d')" id="cam-iso3d" class="px-1.5 py-0.5 rounded-lg bg-amber-500 text-slate-950 text-[10px] font-black shrink-0">🧊3D</button>
            <button onclick="cycleWallHeight()" id="btn-wall-h" class="px-1.5 py-0.5 rounded-lg bg-slate-800/90 text-amber-300 text-[10px] font-bold shrink-0">🧱半牆</button>
            <button onclick="toggleDimensions()" id="btn-dim" class="px-1.5 py-0.5 rounded-lg bg-rose-950/80 text-rose-200 text-[10px] font-bold shrink-0">📏尺</button>
            <button onclick="takeScreenshot()" class="px-1.5 py-0.5 rounded-lg bg-emerald-600 text-white text-[10px] font-bold shrink-0">📷圖</button>
          </div>
        </div>

        <!-- 6 Focus Zones Bar (Icon + 1-2 Char) -->
        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pointer-events-auto">
          <div class="glass-pill px-1 py-0.5 rounded-xl flex items-center gap-0.5 shadow">
            <button onclick="focusZone('all')" id="zbtn-all" class="zone-btn-active px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🏠全屋</button>
            <button onclick="focusZone('main_hall')" id="zbtn-main_hall" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🚪主廳</button>
            <button onclick="focusZone('hall_1')" id="zbtn-hall_1" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🪟廳1</button>
            <button onclick="focusZone('hall_2')" id="zbtn-hall_2" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🌅廳2</button>
            <button onclick="focusZone('side_room')" id="zbtn-side_room" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🛏️側房</button>
            <button onclick="focusZone('kitchen')" id="zbtn-kitchen" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🍳廚房</button>
            <button onclick="focusZone('bathroom')" id="zbtn-bathroom" class="px-1.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-200 shrink-0">🚿廁所</button>
            <button onclick="toggleIsolateZone()" id="btn-isolate" class="px-1.5 py-0.5 rounded-lg text-[9px] font-bold bg-indigo-950/90 text-indigo-200 border border-indigo-500/40 shrink-0">🔍專注:開</button>
          </div>
        </div>
      </div>

      <!-- 3D Floating Zone Zoom-In Badges Container -->
      <div id="zone-3d-pins-container" class="absolute inset-0 pointer-events-none overflow-hidden z-10"></div>

      <!-- On-Screen Zoom In / Zoom Out / Orbit Direction Controls -->
      <div class="absolute right-2 top-1/2 -translate-y-1/2 z-20 glass-pill p-1 rounded-2xl flex flex-col gap-1 shadow-xl pointer-events-auto border border-slate-700/70">
        <button onclick="zoomCameraStep(-1400)" title="放大 Zoom In" class="w-8 h-8 rounded-xl bg-slate-800/95 hover:bg-amber-500 hover:text-slate-950 text-white font-black text-sm flex items-center justify-center shadow active:scale-90 transition">➕</button>
        <button onclick="zoomCameraStep(1400)" title="縮小 Zoom Out" class="w-8 h-8 rounded-xl bg-slate-800/95 hover:bg-amber-500 hover:text-slate-950 text-white font-black text-sm flex items-center justify-center shadow active:scale-90 transition">➖</button>
        <div class="h-px bg-slate-700 my-0.5"></div>
        <button onclick="orbitCameraAngle(-Math.PI/4)" title="向左轉視角" class="w-8 h-8 rounded-xl bg-slate-800/95 hover:bg-sky-500 hover:text-slate-950 text-sky-300 font-black text-xs flex items-center justify-center shadow active:scale-90 transition">⟲</button>
        <button onclick="orbitCameraAngle(Math.PI/4)" title="向右轉視角" class="w-8 h-8 rounded-xl bg-slate-800/95 hover:bg-sky-500 hover:text-slate-950 text-sky-300 font-black text-xs flex items-center justify-center shadow active:scale-90 transition">⟳</button>
        <button onclick="fitFullLayoutTopView()" title="俯視全屋" class="w-8 h-8 rounded-xl bg-cyan-950/90 hover:bg-cyan-400 hover:text-slate-950 text-cyan-300 font-black text-[10px] flex items-center justify-center shadow active:scale-90 transition">俯視</button>
      </div>

      <!-- Selected Item Floating Quick Action Bar (With Move Lock Toggle to prevent accidental dragging) -->
      <div id="selected-floating-bar" class="hidden absolute bottom-2 left-1/2 -translate-x-1/2 z-30 glass-pill px-2 py-1 rounded-xl flex items-center gap-1 shadow-2xl border border-amber-400/60 max-w-[96vw] overflow-x-auto no-scrollbar">
        <span id="sel-bar-name" class="text-[10px] font-extrabold text-amber-300 truncate max-w-[80px]">物件</span>
        <button onclick="toggleMoveSelectedMode()" id="btn-move-toggle" class="px-2 py-0.5 rounded bg-slate-700 text-slate-200 text-[10px] font-black shrink-0 border border-slate-500">✥移動:關</button>
        <button onclick="rotateSelected(90)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">↻90°</button>
        <button onclick="rotateSelected(45)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">↺45°</button>
        <button onclick="nudgeSelected(-50,0)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">◀</button>
        <button onclick="nudgeSelected(50,0)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">▶</button>
        <button onclick="nudgeSelected(0,-50)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">▲</button>
        <button onclick="nudgeSelected(0,50)" class="px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-bold shrink-0">▼</button>
        <button onclick="elevateSelected(100)" class="px-1.5 py-0.5 rounded bg-sky-900/80 text-sky-200 text-[10px] font-bold shrink-0">⬆️升</button>
        <button onclick="elevateSelected(-100)" class="px-1.5 py-0.5 rounded bg-sky-900/80 text-sky-200 text-[10px] font-bold shrink-0">⬇️降</button>
        <button onclick="openInspectorModal()" class="px-1.5 py-0.5 rounded bg-amber-500 text-slate-950 text-[10px] font-black shrink-0">📏尺寸/色</button>
        <button onclick="duplicateSelected()" class="px-1.5 py-0.5 rounded bg-emerald-700 text-white text-[10px] font-bold shrink-0">＋</button>
        <button onclick="deleteSelected()" class="px-1.5 py-0.5 rounded bg-rose-600 text-white text-[10px] font-bold shrink-0">🗑️</button>
        <button onclick="deselectItem()" class="px-1 py-0.5 text-slate-400 text-[10px] font-bold shrink-0">✕</button>
      </div>

      <!-- Toast Message -->
      <div id="toast-banner" class="hidden absolute top-14 left-1/2 -translate-x-1/2 z-30 glass-pill px-3 py-1 rounded-full text-[11px] font-bold text-emerald-300 border border-emerald-500/40 shadow-lg pointer-events-none"></div>
    </div>

    <!-- ==================== 20% ULTRA-COMPACT ICON MENU ==================== -->
    <div id="design-drawer">
      <!-- Top Icon + 2-Char Tab Strip -->
      <div class="flex items-center justify-between px-1.5 py-1 bg-slate-900 border-b border-slate-800 shrink-0 gap-1 overflow-x-auto no-scrollbar">
        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
          <button onclick="switchMainTab('templates')" id="tab-btn-templates" class="nav-tab-active px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>📋</span><span>範本</span>
          </button>
          <button onclick="switchMainTab('floors')" id="tab-btn-floors" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>🪵</span><span>地板</span>
          </button>
          <button onclick="switchMainTab('walls')" id="tab-btn-walls" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>🎨</span><span>牆身</span>
          </button>
          <button onclick="switchMainTab('furniture')" id="tab-btn-furniture" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>🛋️</span><span>家具</span>
          </button>
          <button onclick="switchMainTab('appliances')" id="tab-btn-appliances" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>⚡</span><span>家電</span>
          </button>
          <button onclick="switchMainTab('lighting')" id="tab-btn-lighting" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>💡</span><span>燈具</span>
          </button>
          <button onclick="switchMainTab('bom')" id="tab-btn-bom" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold flex items-center gap-0.5 shrink-0">
            <span>📦</span><span id="bom-count-label">清單</span>
          </button>
        </div>
        <button onclick="toggleDrawerCollapse()" id="btn-collapse-drawer" class="px-2 py-0.5 rounded-lg bg-slate-800 text-amber-300 text-[10px] font-bold shrink-0">▼</button>
      </div>

      <!-- Compact Horizontal Scrollable Drawer Body -->
      <div id="drawer-body" class="flex-1 overflow-y-auto overflow-x-hidden px-2 py-1 no-scrollbar">
        <!-- TAB 1: 4 INDEPENDENT COMPACT ROWS TEMPLATE SELECTION (ALL 4 ROWS VISIBLE AT ONCE) -->
        <div id="panel-templates" class="h-full flex flex-col justify-between gap-0.5 overflow-y-auto no-scrollbar">
          <!-- Row 1: ① 人數選行 (People Filter & Bare Shell) -->
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar shrink-0">
            <span class="text-[9px] font-black text-amber-400 shrink-0 w-11">①人數:</span>
            <button onclick="applyBareShellTemplate()" id="btn-bare-shell" class="px-1.5 py-0.5 rounded bg-slate-800 text-amber-300 text-[10px] font-bold border border-amber-500/40 shrink-0">🏠清水房</button>
            <button onclick="filterTemplatesByPeople('2p')" id="pfilt-2p" class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-[10px] font-bold shrink-0">👫2人</button>
            <button onclick="filterTemplatesByPeople('3p')" id="pfilt-3p" class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-[10px] font-bold shrink-0">👨‍👩‍👧3人</button>
            <button onclick="filterTemplatesByPeople('4p')" id="pfilt-4p" class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-[10px] font-bold shrink-0">👨‍👩‍👧‍👦4人</button>
            <button onclick="filterTemplatesByPeople('5p')" id="pfilt-5p" class="px-2 py-0.5 rounded bg-amber-500 text-slate-950 text-[10px] font-black shrink-0 shadow">👨‍👩‍👧‍👦5人</button>
            <button onclick="filterTemplatesByPeople('6p')" id="pfilt-6p" class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-[10px] font-bold shrink-0">🏠6人</button>
          </div>
          
          <!-- Row 2: ② 居屋/私樓選行 (HOS / Private Filter + Active Layout Summary) -->
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar shrink-0">
            <span class="text-[9px] font-black text-emerald-400 shrink-0 w-11">②類別:</span>
            <button onclick="filterTemplatesByStyle('hos')" id="sfilt-hos" class="px-2 py-0.5 rounded bg-emerald-500 text-slate-950 text-[10px] font-black shrink-0 shadow">🏘️居屋實用</button>
            <button onclick="filterTemplatesByStyle('priv')" id="sfilt-priv" class="px-2 py-0.5 rounded bg-slate-800 text-sky-300 text-[10px] font-bold shrink-0 border border-sky-500/30">🏙️私樓燈帶</button>
            <span id="active-layout-summary" class="text-[9px] text-amber-200 font-bold truncate ml-1"></span>
          </div>

          <!-- Row 3: ③ 10款空間擺設間隔選行 (10 Spatial Layouts) -->
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar shrink-0">
            <span class="text-[9px] font-black text-amber-300 shrink-0 w-11">③擺設:</span>
            <div id="templates-layouts-row" class="flex items-center gap-1 overflow-x-auto no-scrollbar"></div>
          </div>

          <!-- Row 4: ④ 10款室內設計風格選行 (10 Design Styles) -->
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar shrink-0">
            <span class="text-[9px] font-black text-sky-400 shrink-0 w-11">④風格:</span>
            <div id="templates-styles-row" class="flex items-center gap-1 overflow-x-auto no-scrollbar"></div>
          </div>
        </div>

        <!-- TAB 2: 24 FLOORS -->
        <div id="panel-floors" class="hidden h-full flex flex-col justify-between">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-0.5">
            <span class="text-[9px] text-amber-400 font-bold shrink-0">分區:</span>
            <div id="floor-zone-pills" class="flex items-center gap-1"></div>
          </div>
          <div id="floor-styles-grid" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 3: 24 WALLS -->
        <div id="panel-walls" class="hidden h-full flex flex-col justify-between">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-0.5">
            <span class="text-[9px] text-amber-400 font-bold shrink-0">分區:</span>
            <div id="wall-zone-pills" class="flex items-center gap-1"></div>
          </div>
          <div id="wall-styles-grid" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 4: FURNITURE -->
        <div id="panel-furniture" class="hidden h-full flex flex-col justify-between">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-0.5">
            <button onclick="filterCatalog('furniture','all')" class="px-1.5 py-0.5 rounded bg-amber-500 text-slate-950 text-[9px] font-black shrink-0">全部</button>
            <button onclick="filterCatalog('furniture','storage')" class="px-1.5 py-0.5 rounded bg-sky-600 text-white text-[9px] font-bold shrink-0">✨私樓燈帶櫃/C字櫃</button>
            <button onclick="filterCatalog('furniture','bed')" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🛏️燈帶地台/子母床</button>
            <button onclick="filterCatalog('furniture','living')" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🛋️梳化/延伸餐枱</button>
            <button onclick="filterCatalog('furniture','electrical')" class="px-1.5 py-0.5 rounded bg-emerald-600 text-white text-[9px] font-bold shrink-0">🔌電掣/插座/Data</button>
            <button onclick="filterCatalog('furniture','decor')" class="px-1.5 py-0.5 rounded bg-pink-600 text-white text-[9px] font-bold shrink-0">🧸毛公仔/掛畫/地氈</button>
            <button onclick="filterCatalog('furniture','partition')" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🧱間牆/門</button>
            <button onclick="filterCatalog('furniture','kitbath')" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] font-bold shrink-0">🍳L廚櫃/浴缸</button>
          </div>
          <div id="furniture-catalog-grid" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 5: APPLIANCES -->
        <div id="panel-appliances" class="hidden h-full flex flex-col justify-center">
          <div id="appliances-catalog-grid" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 6: LIGHTING -->
        <div id="panel-lighting" class="hidden h-full flex flex-col justify-center">
          <div id="lighting-catalog-grid" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>

        <!-- TAB 7: BOM LIST -->
        <div id="panel-bom" class="hidden h-full flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span id="bom-title-unit" class="text-[10px] font-black text-amber-400">全屋傢俬家電尺寸清單</span>
            <div class="flex gap-1">
              <button onclick="copyBomText()" class="px-2 py-0.5 rounded bg-amber-500 text-slate-950 text-[10px] font-black">📋複製報價單</button>
              <button onclick="clearAllFurniture()" class="px-2 py-0.5 rounded bg-rose-700 text-white text-[10px] font-bold">🗑️清空</button>
            </div>
          </div>
          <div id="bom-list-container" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 36-UNIT PICKER MODAL (MOBILE / IPAD OPTIMIZED) ==================== -->
  <div id="unit-modal" class="hidden fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-amber-500/40 rounded-2xl w-full max-w-2xl max-h-[86dvh] flex flex-col shadow-2xl overflow-hidden">

          ctx.fillStyle = knot || '#1e1005';
          ctx.fillRect(i * sw + sw * 0.72, 0, sw * 0.28, size);
        }
      } else {
        // Paint / Wabi-sabi cement
        const g = ctx.createRadialGradient(size * 0.4, size * 0.4, 15, size * 0.5, size * 0.5, size * 0.75);
        g.addColorStop(0, c1);
        g.addColorStop(1, c2);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
      }
      return cvs;
    }

    function getThreeTextureForStyle(styleId, isFloor = true) {
      const key = styleId + (isFloor ? '_F' : '_W');
      if (textureCache[key]) return textureCache[key];
      const list = isFloor ? FLOOR_STYLES : WALL_STYLES;
      const styleObj = list.find(s => s.id === styleId) || list[0];
      const cvs = generateStyleCanvas(styleObj, 256);
      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(isFloor ? 3.5 : 2.5, isFloor ? 3.5 : 1.5);
      textureCache[key] = tex;
      return tex;
    }

    function getThumbDataUrl(styleObj) {
      if (thumbDataUrlCache[styleObj.id]) return thumbDataUrlCache[styleObj.id];
      const cvs = generateStyleCanvas(styleObj, 72);
      const url = cvs.toDataURL('image/png');
      thumbDataUrlCache[styleObj.id] = url;
      return url;
    }

    // =========================================================================
    // 5. ACCURATE 36-UNIT GEOMETRY PROFILE & COORDINATE TRANSFORM ENGINE
    //    Fixes B11/B13/B14 (4900mm Bay Window), B3 (Top Window 6165mm),
    //    B15 (Bottom-Left Side Room), and Horizontal Units (B21,B22,A2,A3,A7,A8,A9,A10,A19,A20,A21,A22)
    // =========================================================================
    function getUnitGeometryProfile(unitId) {
      const is1BR = ['B2', 'B5', 'B12', 'B17', 'A12', 'A15'].includes(unitId);
      const is3BR = ['B1', 'B9', 'B10', 'B15', 'A2', 'A3', 'A7', 'A8', 'A9', 'A22'].includes(unitId);
      const is2BR = !is1BR && !is3BR;
      const isBay4900 = ['B11', 'B13', 'B14'].includes(unitId);
      const isHoriz2BR = ['B21', 'B22', 'A10', 'A19', 'A20', 'A21'].includes(unitId);
      const isHoriz3BR = ['A2', 'A3', 'A7', 'A8', 'A9', 'A22'].includes(unitId);
      const isHoriz = isHoriz2BR || isHoriz3BR;

      // Canonical coordinate extents BEFORE unit-specific mirror/rotation:
      // - 1BR canonical (B5): W=2350, Z=6165 (Kitchen/Bath on Left X<0, Window at Bottom Z=6165)
      // - Bay4900 canonical (B11/B13): W=4900, Z=5325 (Kitchen/Bath on Left, Bay Window at Bottom-Left X=0..2000, Z=4425..5325)
      // - Standard 2BR canonical (B4/B6): W=4525, Z=6165 (Kitchen/Bath on Right, Window at Bottom Z=6165)
      // - Standard 3BR canonical (B10): W=4525, Z=6815 (Side room on Left X=-2000..0, Kitchen/Bath on Right, Window at Bottom Z=6815)
      const baseW = is1BR ? 2350 : (isBay4900 ? 4900 : 4525);
      const baseZ = is1BR ? 6165 : (isBay4900 ? 5325 : (is3BR ? 6815 : 6165));

      let mirrorX = false;
      let mirrorZ = false;

      if (is1BR) {
        // Canonical B5: Left Kit/Bath, Bottom Window
        mirrorX = ['B12', 'B17', 'A12', 'A15'].includes(unitId); // Right Kit/Bath
        mirrorZ = ['B2', 'B17', 'A15'].includes(unitId);         // Top Window
      } else if (isBay4900) {
        // Canonical B11/B13: Left Kit/Bath, Right 5325mm wall, Bottom-Left 2000x900 bay window
        // B14 is the exact left-right mirror of B13 (Right Kit/Bath, Left 5325mm wall, Bottom-Right 2000x900 bay window)
        mirrorX = (unitId === 'B14');
        mirrorZ = false;
      } else if (isHoriz2BR) {
        // Canonical 2BR rotated 90 deg so Window is on Left (X=0) or Right (X=6165)
        // After 90-deg swap: X_world = Z_canon (0..6165), Z_world = X_canon (0..4525)
        mirrorX = ['B22', 'A21'].includes(unitId);               // Window on Right (B22, A21) vs Window on Left (B21, A10, A19, A20)
        mirrorZ = ['B21', 'B22', 'A19'].includes(unitId);        // Kitchen/Bath on Top vs Bottom (A10, A20, A21)
      } else if (is2BR) {
        // Canonical B4/B6: Right Kit/Bath, Bottom 4525mm Window, Z=6165
        mirrorX = ['B16', 'B18', 'A1', 'A4', 'A11', 'A13', 'A14', 'A16'].includes(unitId); // Left Kit/Bath
        mirrorZ = ['B3', 'B16', 'B18', 'A1', 'A14', 'A16'].includes(unitId);               // Top 4525mm Window (Fixes B3!)
      } else if (isHoriz3BR) {
        // Canonical 3BR rotated 90 deg: Window on Right (A2,A3,A7,A8,A22) or Left (A9)
        mirrorX = ['A2', 'A3', 'A7', 'A8', 'A22'].includes(unitId);
        mirrorZ = ['A3', 'A8', 'A9', 'A22'].includes(unitId);    // Side room on Bottom vs Top (A2, A7)
      } else {
        // Vertical 3BR: Canonical B10 (Left Side Room, Right Kit/Bath, Bottom 4525mm Window)
        mirrorX = (unitId === 'B9');                             // B9 has Right Side Room, Left Kit/Bath
        mirrorZ = ['B1', 'B15'].includes(unitId);                // B1 & B15 have Top 4525mm Window
      }

      // Transform canonical (x, z) -> unit world (wx, wz)
      const toWorldXZ = (x, z) => {
        if (!isHoriz) {
          const wx = mirrorX ? (baseW - x) : x;
          const wz = mirrorZ ? (baseZ - z) : z;
          return [wx, wz];
        } else {
          // Horizontal units: canonical Z (length 6165/6815) maps to World X, canonical X (width 4525) maps to World Z
          const wx = mirrorX ? z : (baseZ - z);
          const wz = mirrorZ ? (baseW - x) : x;
          return [wx, wz];
        }
      };

      const toWorldRot = (rotDeg) => {
        let ang = rotDeg;
        if (!isHoriz) {
          if (mirrorX) ang = (360 - ang) % 360;
          if (mirrorZ) ang = (180 - ang + 360) % 360;
        } else {
          ang = (ang + 90) % 360;
          if (!mirrorX) ang = (360 - ang) % 360;
          if (mirrorZ) ang = (180 - ang + 360) % 360;
        }
        return ang;
      };

      return { is1BR, is2BR, is3BR, isBay4900, isHoriz, isHoriz2BR, isHoriz3BR, baseW, baseZ, mirrorX, mirrorZ, toWorldXZ, toWorldRot };
    }

    function addOutlinedBox(parent, w, h, d, mat, x, y, z, edgeColor = 0x1e293b) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: edgeColor, transparent: true, opacity: 0.42 }));
      mesh.add(line);
      parent.add(mesh);
      return mesh;
    }

    function addDoorSwingArc(zoneId, hingeX, hingeZ, radius, startAngleDeg, endAngleDeg) {
      const group = new THREE.Group();
      group.userData = { zoneId };
      const startRad = THREE.MathUtils.degToRad(startAngleDeg);
      const endRad = THREE.MathUtils.degToRad(endAngleDeg);
      const sweep = endRad - startRad;

      const sectorGeo = new THREE.CircleGeometry(radius, 24, startRad, sweep);
      sectorGeo.rotateX(-Math.PI / 2);
      const sectorMat = new THREE.MeshBasicMaterial({
        color: 0xf59e0b,
        transparent: true,
        opacity: 0.16,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const sectorMesh = new THREE.Mesh(sectorGeo, sectorMat);
      sectorMesh.position.set(hingeX, 16, hingeZ);
      group.add(sectorMesh);

      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const a = startRad + (sweep * i) / 24;
        pts.push(new THREE.Vector3(hingeX + Math.cos(a) * radius, 18, hingeZ - Math.sin(a) * radius));
      }
      pts.push(new THREE.Vector3(hingeX, 18, hingeZ));
      const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.7 });
      group.add(new THREE.Line(lineGeo, lineMat));
      structureGroup.add(group);
    }

    function makeTextSprite(text, bgColor = 'rgba(15,23,42,0.88)', textColor = '#fbbf24') {
      const cvs = document.createElement('canvas');
      cvs.width = 256;
      cvs.height = 64;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect(6, 6, 244, 52, 12);
      ctx.fill();
      ctx.strokeStyle = textColor;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = textColor;
      ctx.font = 'bold 24px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 33);
      const tex = new THREE.CanvasTexture(cvs);
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(950, 240, 1);
      return sp;
    }

    }

    function spawnFurnitureMesh(itemData) {
      const mesh = buildDetailedItemMesh(itemData);
      mesh.position.set(itemData.x, itemData.y || 0, itemData.z);
      mesh.rotation.y = THREE.MathUtils.degToRad(itemData.rot || 0);
      mesh.userData = { isFurnitureRoot: true, uid: itemData.uid };
      furnitureGroup.add(mesh);
      const entry = { uid: itemData.uid, data: itemData, mesh };
      placedFurniture.push(entry);
      return entry;
    }

    function addCatalogItemToScene(catId) {
      const base = CATALOG_ITEMS.find(c => c.id === catId);
      if (!base) return;
      const b = getZoneBounds(currentFocusZone === 'all' ? 'main_hall' : currentFocusZone);
      const newItem = {
        uid: 'it_' + Date.now() + '_' + Math.floor(Math.random() * 999),
        id: base.id,
        name: base.name,
        cat: base.cat,
        w: base.w,
        d: base.d,
        h: base.h,
        x: Math.round(b.cx / 50) * 50,
        y: base.defaultY || 0,
        z: Math.round(b.cz / 50) * 50,
        rot: 0,
        color: base.color
      };
      const entry = spawnFurnitureMesh(newItem);
      applyCurrentWallHeightToStructure();
      applyZoneIsolationVisuals();
      selectItem(entry, true); // Newly added item comes with move mode armed for convenience
      updateBomList();
      showToast(`✅ 已新增「${base.name.replace(/^\d+\.\s*/, '')}」(可直接拖動擺位)`);

    function applyTemplate(tplId) {

    function applyZoneIsolationVisuals() {
      const isFocusing = (currentFocusZone !== 'all' && isolateZoneMode);
      const b = isFocusing ? getZoneBounds(currentFocusZone) : null;

      floorZoneMeshes.forEach(m => {
        const match = !isFocusing || m.userData.zoneId === currentFocusZone;
        m.material.transparent = !match;
        m.material.opacity = match ? 1.0 : 0.14;
        m.material.needsUpdate = true;
      });

      wallZoneMeshes.forEach(w => {
        const match = !isFocusing || w.userData.zoneId === currentFocusZone;
        w.material.transparent = !match;
        w.material.opacity = match ? 1.0 : 0.12;
        w.material.needsUpdate = true;
      });

      structureGroup.children.forEach(ch => {
        if (ch.userData && ch.userData.zoneId && !ch.userData.isFloorZone && !wallZoneMeshes.includes(ch)) {
          const match = !isFocusing || ch.userData.zoneId === currentFocusZone;
          ch.visible = match;
        }
      });

      placedFurniture.forEach(entry => {
        if (!isFocusing) {
          entry.mesh.visible = true;
          return;
        }
        const x = entry.data.x, z = entry.data.z;
        const inZone = (x >= b.minX && x <= b.maxX && z >= b.minZ && z <= b.maxZ);
        entry.mesh.visible = inZone;
      });
    }

    // =========================================================================
    // 12. 6-ZONE FOCUS, 3D FLOATING ZOOM BADGES & ISOLATION SYSTEM
    // =========================================================================
    function getZoneBounds(zoneId) {
      const prof = getUnitGeometryProfile(currentUnitId);
      const { toWorldXZ } = prof;
      const box = (x1, z1, x2, z2) => {
        const [wx1, wz1] = toWorldXZ(x1, z1);
        const [wx2, wz2] = toWorldXZ(x2, z2);
        return {
          minX: Math.min(wx1, wx2) - 200,
          maxX: Math.max(wx1, wx2) + 200,
          minZ: Math.min(wz1, wz2) - 200,
          maxZ: Math.max(wz1, wz2) + 200,
          cx: (wx1 + wx2) / 2,
          cz: (wz1 + wz2) / 2
        };
      };

      if (prof.is1BR) {
        if (zoneId === 'main_hall') return box(0, 0, 2350, 3415);
        if (zoneId === 'hall_1' || zoneId === 'hall_2' || zoneId === 'side_room') return box(0, 3415, 2350, 6165);
        if (zoneId === 'kitchen') return box(-1415, 1650, 0, 3415);
        if (zoneId === 'bathroom') return box(-1580, 0, 0, 1650);
      } else if (prof.isBay4900) {
        if (zoneId === 'main_hall' || zoneId === 'side_room') return box(1680, 0, 4900, 3120);
        if (zoneId === 'hall_1') return box(2000, 3120, 4900, 4425);
        if (zoneId === 'hall_2') return box(0, 3120, 2000, 5325);
        if (zoneId === 'kitchen') return box(-385, 0, 1680, 1650);
        if (zoneId === 'bathroom') return box(0, 1650, 2000, 3120);
      } else if (prof.is2BR) {
        if (zoneId === 'main_hall' || zoneId === 'side_room') return box(0, 0, 2525, 3120);
        if (zoneId === 'hall_1') return box(0, 3120, 2440, 6165);
        if (zoneId === 'hall_2') return box(2440, 3120, 4525, 6165);
        if (zoneId === 'kitchen') return box(2860, 0, 4925, 1650);
        if (zoneId === 'bathroom') return box(2525, 1650, 4525, 3120);
      } else {
        const sideZ1 = (currentUnitId === 'B15' || currentUnitId === 'A8' || currentUnitId === 'A9') ? 650 : 2500;
        if (zoneId === 'main_hall') return box(0, 0, 3135, 3250);
        if (zoneId === 'side_room') return box(-2000, sideZ1, 0, sideZ1 + 2150);
        if (zoneId === 'hall_1') return box(0, 3650, 2440, 6815);
        if (zoneId === 'hall_2') return box(2440, 4720, 4525, 6815);
        if (zoneId === 'kitchen') return box(3135, 1600, 5200, 3250);
        if (zoneId === 'bathroom') return box(2525, 3250, 4525, 4720);
      }
      return { minX: -3000, maxX: 6000, minZ: -500, maxZ: 7500, cx: 1800, cz: 3200 };
    }

    // Create clickable 3D floating "🔍 Zoom In" badges directly above each zone in the layout
    function createZone3DPins() {
      const container = document.getElementById('zone-3d-pins-container');
      if (!container) return;
      container.innerHTML = '';
      zonePinElements = [];

      const prof = getUnitGeometryProfile(currentUnitId);
      const zonesToShow = prof.is1BR
        ? [
            { id: 'main_hall', label: '🔍主廳' },
            { id: 'hall_1',    label: '🔍廳1' },
            { id: 'kitchen',   label: '🔍廚房' },
            { id: 'bathroom',  label: '🔍廁所' }
          ]
        : (prof.is2BR
          ? [
              { id: 'main_hall', label: '🔍主廳' },
              { id: 'hall_1',    label: '🔍廳1' },
              { id: 'hall_2',    label: '🔍廳2' },
              { id: 'kitchen',   label: '🔍廚房' },
              { id: 'bathroom',  label: '🔍廁所' }
            ]
          : [
              { id: 'main_hall', label: '🔍主廳' },
              { id: 'hall_1',    label: '🔍廳1' },
              { id: 'hall_2',    label: '🔍廳2' },
              { id: 'side_room', label: '🔍側房' },
              { id: 'kitchen',   label: '🔍廚房' },
              { id: 'bathroom',  label: '🔍廁所' }
            ]);

      zonesToShow.forEach(z => {
        const b = getZoneBounds(z.id);
        const btn = document.createElement('button');
        btn.className = 'pointer-events-auto absolute -translate-x-1/2 -translate-y-1/2 px-2 py-0.5 rounded-full text-[10px] font-black shadow-lg border transition active:scale-90 flex items-center gap-0.5 ' +
          (currentFocusZone === z.id
            ? 'bg-amber-500 text-slate-950 border-white ring-2 ring-amber-300'
            : 'bg-slate-900/85 text-amber-300 border-amber-400/50 hover:bg-amber-500 hover:text-slate-950');
        btn.innerHTML = `<span>${z.label}</span>`;
        btn.onclick = (ev) => {
          ev.stopPropagation();
          if (currentFocusZone === z.id) {
            focusZone('all');
          } else {
            isolateZoneMode = true;
            document.getElementById('btn-isolate').textContent = '🔍專注:開';
            focusZone(z.id);
          }
        };
        container.appendChild(btn);
        zonePinElements.push({ id: z.id, el: btn, worldPos: new THREE.Vector3(b.cx, 1650, b.cz) });
      });
    }

    function updateZone3DPinsPosition() {
      if (!camera || !renderer || !zonePinElements.length) return;
      const stage = document.getElementById('viewport-stage');
      const w = stage.clientWidth;
      const h = stage.clientHeight;

      zonePinElements.forEach(pin => {
        const v = pin.worldPos.clone().project(camera);
        if (v.z > 1) {
          pin.el.style.display = 'none';
          return;
        }
        const x = (v.x * 0.5 + 0.5) * w;
        const y = (-(v.y * 0.5) + 0.5) * h;
        if (x < 30 || x > w - 30 || y < 55 || y > h - 30) {
          pin.el.style.display = 'none';
        } else {
          pin.el.style.display = 'flex';
          pin.el.style.left = `${x}px`;
          pin.el.style.top = `${y}px`;
        }
      });
    }

    function focusZone(zoneId) {
      currentFocusZone = zoneId;
      ['all', 'main_hall', 'hall_1', 'hall_2', 'side_room', 'kitchen', 'bathroom'].forEach(id => {
        const btn = document.getElementById('zbtn-' + id);
        if (btn) btn.classList.toggle('zone-btn-active', id === zoneId);
      });

      if (zoneId !== 'all') {
        selectedFloorZone = zoneId;
        selectedWallZone = zoneId;
        renderFloorZonePills();
        renderWallZonePills();
      }

      const b = getZoneBounds(zoneId);
      if (zoneId === 'all') {
        controls.target.set(1800, 300, 3300);
        camera.position.set(1800, 7800, 8200);
      } else {
        controls.target.set(b.cx, 350, b.cz);
        camera.position.set(b.cx + 350, 3200, b.cz + 2300);
      }
      controls.update();
      applyZoneIsolationVisuals();
      createZone3DPins();
    }

    function applyCurrentWallHeightToStructure() {
      const targetH = getTargetWallHeightMM();
      structuralWalls.forEach(w => {
        const maxH = w.userData.maxH || 2550;
        const h = Math.min(targetH, maxH);
        w.scale.y = h / maxH;
        w.position.y = h / 2;
      });
      structureGroup.children.forEach(ch => {
        if (ch.userData && ch.userData.isGlass) {
          ch.visible = (wallHeightMode === 'full');
        }
      });
      placedFurniture.forEach(entry => {
        if (entry.data.cat === 'partition') {
          const maxH = entry.data.h || 2500;
          const h = Math.min(targetH, maxH);
          entry.mesh.scale.y = h / maxH;
        }
      });
    }

    function cycleWallHeight() {
      const order = ['mid', 'full', 'low'];
      wallHeightMode = order[(order.indexOf(wallHeightMode) + 1) % order.length];
      const labels = { mid: '🧱半牆', full: '🧱全牆', low: '🧱底座' };
      document.getElementById('btn-wall-h').textContent = labels[wallHeightMode];
      applyCurrentWallHeightToStructure();
    }

    function toggleDimensions() {
      showDimensions = !showDimensions;
      dimensionGroup.visible = showDimensions;
    }

    // =========================================================================
    // 14. SAFE TOUCH / MOUSE SELECTION & LOCKED MOVE MODE (NO ACCIDENTAL DRAGGING)
    // =========================================================================
    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function onPointerDown(e) {
      if (e.button !== undefined && e.button !== 0) return;
      updatePointerNDC(e);
      raycaster.setFromCamera(pointerNDC, camera);

      const roots = placedFurniture.filter(f => f.mesh.visible).map(f => f.mesh);
      const hits = raycaster.intersectObjects(roots, true);
      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj && (!obj.userData || !obj.userData.isFurnitureRoot)) obj = obj.parent;
        if (obj) {
          const entry = placedFurniture.find(f => f.uid === obj.userData.uid);
          if (entry) {
            const wasSameItem = (selectedItem && selectedItem.uid === entry.uid);
            selectItem(entry, wasSameItem ? isMoveModeArmed : false);

            // Only start dragging if user explicitly enabled "✥移動:開" for this selected item!
            if (wasSameItem && isMoveModeArmed) {
              isDraggingItem = true;
              controls.enabled = false;
              dragPlane.constant = -(entry.data.y || 0);
              const pt = new THREE.Vector3();
              raycaster.ray.intersectPlane(dragPlane, pt);
              dragOffset.set(entry.data.x - pt.x, 0, entry.data.z - pt.z);
            } else {
              showToast('💡 已選中物件！如需拖動位置，請按下方「✥移動」按鈕');
            }
            return;
          }
        }
      }
    }

    function onPointerMove(e) {
      if (!isDraggingItem || !selectedItem || !isMoveModeArmed) return;
      updatePointerNDC(e);
      raycaster.setFromCamera(pointerNDC, camera);
      const pt = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(dragPlane, pt)) {
        const nx = Math.round((pt.x + dragOffset.x) / 50) * 50;
        const nz = Math.round((pt.z + dragOffset.z) / 50) * 50;
        selectedItem.data.x = nx;
        selectedItem.data.z = nz;

        if (!selectedItem.data.id.startsWith('plat_') && selectedItem.data.cat !== 'partition' && selectedItem.data.cat !== 'lighting') {
          let stackY = 0;
          placedFurniture.forEach(other => {
            if (other.uid !== selectedItem.uid && other.data.id.startsWith('plat_')) {
              const dx = Math.abs(nx - other.data.x);
              const dz = Math.abs(nz - other.data.z);
              if (dx < other.data.w / 2 && dz < other.data.d / 2) {
                stackY = Math.max(stackY, other.data.h);
              }
            }
          });
          if (stackY > 0) selectedItem.data.y = stackY;
        }

        selectedItem.mesh.position.set(selectedItem.data.x, selectedItem.data.y || 0, selectedItem.data.z);
      }
    }

    function onPointerUp() {
      if (isDraggingItem) {
        isDraggingItem = false;
        controls.enabled = true;
        updateBomList();
      }
    }

    function updateMoveButtonUI() {
      const btn = document.getElementById('btn-move-toggle');
      if (!btn) return;
      if (isMoveModeArmed) {
        btn.textContent = '✥移動:開(可拖拉)';
        btn.className = 'px-2 py-0.5 rounded bg-emerald-500 text-slate-950 text-[10px] font-black shrink-0 border border-emerald-300 shadow';
      } else {
        btn.textContent = '✥移動:關';
        btn.className = 'px-2 py-0.5 rounded bg-slate-700 text-slate-200 text-[10px] font-black shrink-0 border border-slate-500';
      }
    }

    function toggleMoveSelectedMode() {
      if (!selectedItem) return;
      isMoveModeArmed = !isMoveModeArmed;
      updateMoveButtonUI();
      if (isMoveModeArmed) {
        showToast('✥ 移動模式已開啟：現在可直接用手指拖動此物件！');
      } else {
        showToast('🔒 移動模式已鎖定：防止誤觸移動');
      }
    }

    function selectItem(entry, keepMoveArmed = false) {
      selectedItem = entry;
      isMoveModeArmed = keepMoveArmed;
      updateMoveButtonUI();
      document.getElementById('selected-floating-bar').classList.remove('hidden');
      document.getElementById('sel-bar-name').textContent = entry.data.name.replace(/^\d+\.\s*/, '');
    }

    function deselectItem() {
      selectedItem = null;
      isMoveModeArmed = false;
      isDraggingItem = false;
      if (controls) controls.enabled = true;
      document.getElementById('selected-floating-bar').classList.add('hidden');
    }

    function rotateSelected(deg) {
      if (!selectedItem) return;
      selectedItem.data.rot = ((selectedItem.data.rot || 0) + deg) % 360;
      selectedItem.mesh.rotation.y = THREE.MathUtils.degToRad(selectedItem.data.rot);
    }

    function nudgeSelected(dx, dz) {
      if (!selectedItem) return;
      selectedItem.data.x += dx;
      selectedItem.data.z += dz;
      selectedItem.mesh.position.set(selectedItem.data.x, selectedItem.data.y || 0, selectedItem.data.z);
    }

    function elevateSelected(dy) {
      if (!selectedItem) return;
      selectedItem.data.y = Math.max(0, (selectedItem.data.y || 0) + dy);
      selectedItem.mesh.position.y = selectedItem.data.y;
    }

    function duplicateSelected() {
      if (!selectedItem) return;
      const copy = JSON.parse(JSON.stringify(selectedItem.data));
      copy.uid = 'it_' + Date.now();
      copy.x += 250;
      copy.z += 250;
      const entry = spawnFurnitureMesh(copy);
      selectItem(entry);
      updateBomList();
    }

    function deleteSelected() {
      if (!selectedItem) return;
      furnitureGroup.remove(selectedItem.mesh);
      placedFurniture = placedFurniture.filter(f => f.uid !== selectedItem.uid);
      deselectItem();
      updateBomList();
    }

    function clearAllFurniture() {
      deselectItem();
      while (furnitureGroup.children.length) furnitureGroup.remove(furnitureGroup.children[0]);
      placedFurniture = [];
      updateBomList();
    }

        summaryEl.textContent = isBareShellActive
          ? '當前：交樓標準清水房'
          : `當前：${currentLay.title}`;
      }

      // Render Row 3: 10 Spatial Layouts (Compact 1-Line Pills)
      if (layContainer) {
        layContainer.innerHTML = layouts.map(lay => {
          const isSelected = (!isBareShellActive && selectedLayoutIdx === lay.idx);
          const shortTitle = (lay.title.split(':')[1] || lay.title).trim();
          return `
            <button onclick="selectSpatialLayout(${lay.idx})" title="${lay.title} (${lay.desc})" class="shrink-0 px-2 py-0.5 rounded border text-left transition flex items-center gap-1 ${isSelected ? 'bg-amber-500 text-slate-950 border-white font-black shadow' : 'bg-slate-900 border-slate-700 text-slate-200 hover:border-amber-400 font-bold'}">
              <span class="text-[10px]">#${String(lay.idx).padStart(2,'0')}</span>
              <span class="text-[10px] max-w-[135px] truncate">${shortTitle}</span>
            </button>
          `;
        }).join('');
      }

      // Render Row 4: 10 Design Styles (Compact 1-Line Pills with Color Dot)
      if (styContainer) {
        styContainer.innerHTML = TEN_DESIGN_STYLES.map((st, idx) => {
          const sNum = idx + 1;
          const isSelected = (!isBareShellActive && selectedStyleIdx === sNum);
          return `
            <button onclick="selectInteriorStyle(${sNum})" title="${st.name}" class="shrink-0 px-2 py-0.5 rounded border text-left transition flex items-center gap-1 ${isSelected ? 'bg-sky-400 text-slate-950 border-white font-black shadow' : 'bg-slate-900 border-slate-700 text-slate-200 hover:border-sky-400 font-bold'}">
              <span class="w-2.5 h-2.5 rounded-full border border-white/50 shrink-0" style="background:${st.cabHex}"></span>
              <span class="text-[10px]">${st.num}.${st.badge}</span>
            </button>
          `;
        }).join('');
      }
    }

    function renderFloorZonePills() {
      const c = document.getElementById('floor-zone-pills');
      c.innerHTML = FLOOR_ZONES.map(z => `
        <button onclick="selectedFloorZone='${z.id}';renderFloorZonePills()" class="px-1.5 py-0.5 rounded text-[9px] font-bold shrink-0 ${selectedFloorZone === z.id ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-300'}">${z.name}</button>
      `).join('');
    }

    function renderFloorStylesGrid() {
      const c = document.getElementById('floor-styles-grid');
      c.innerHTML = FLOOR_STYLES.map(s => {
        const thumb = getThumbDataUrl(s);
        return `
          <button onclick="applyFloorStyle('${s.id}')" class="shrink-0 w-24 p-1 rounded-xl bg-slate-900 border border-slate-800 hover:border-amber-400 flex items-center gap-1.5 text-left">
            <img src="${thumb}" class="w-7 h-7 rounded-lg object-cover border border-slate-600 shrink-0" />
            <span class="text-[10px] font-bold text-slate-200 leading-tight line-clamp-2">${s.name}</span>
          </button>
        `;
      }).join('');
    }

    function applyFloorStyle(styleId) {
      if (selectedFloorZone === 'all') {
        Object.keys(zoneFloorAssignment).forEach(k => zoneFloorAssignment[k] = styleId);
      } else {
        zoneFloorAssignment[selectedFloorZone] = styleId;
      }
      floorZoneMeshes.forEach(m => {
        const zId = m.userData.zoneId;
        if (selectedFloorZone === 'all' || zId === selectedFloorZone) {
          m.material.map = getThreeTextureForStyle(styleId, true);
          m.material.needsUpdate = true;
        }
      });
    }

    function renderWallZonePills() {
      const c = document.getElementById('wall-zone-pills');
      c.innerHTML = WALL_ZONES.map(z => `
        <button onclick="selectedWallZone='${z.id}';renderWallZonePills()" class="px-1.5 py-0.5 rounded text-[9px] font-bold shrink-0 ${selectedWallZone === z.id ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-300'}">${z.name}</button>
      `).join('');
    }

    function renderWallStylesGrid() {
      const c = document.getElementById('wall-styles-grid');
      c.innerHTML = WALL_STYLES.map(s => {
        const thumb = getThumbDataUrl(s);
        return `
          <button onclick="applyWallStyle('${s.id}')" class="shrink-0 w-24 p-1 rounded-xl bg-slate-900 border border-slate-800 hover:border-amber-400 flex items-center gap-1.5 text-left">
            <img src="${thumb}" class="w-7 h-7 rounded-lg object-cover border border-slate-600 shrink-0" />
            <span class="text-[10px] font-bold text-slate-200 leading-tight line-clamp-2">${s.name}</span>
          </button>
        `;
      }).join('');
    }

    function applyWallStyle(styleId) {
      if (selectedWallZone === 'all') {
        Object.keys(zoneWallAssignment).forEach(k => zoneWallAssignment[k] = styleId);
      } else {
        zoneWallAssignment[selectedWallZone] = styleId;
      }
      wallZoneMeshes.forEach(m => {
        const zId = m.userData.zoneId;
        if (selectedWallZone === 'all' || zId === selectedWallZone) {
          m.material.map = getThreeTextureForStyle(styleId, false);
          m.material.needsUpdate = true;
        }

    }

    function filterCatalog(panel, subCat) {
      const c = document.getElementById('furniture-catalog-grid');
      const list = CATALOG_ITEMS.filter(i => {
        if (i.cat === 'appliance' || i.cat === 'lighting') return false;
        return subCat === 'all' || i.cat === subCat;
      });
      c.innerHTML = list.map(item => `
        <button onclick="addCatalogItemToScene('${item.id}')" class="shrink-0 w-36 p-1.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-amber-400 text-left">
          <div class="text-[10px] font-extrabold text-white truncate">${item.name}</div>
          <div class="text-[9px] text-slate-400 mt-0.5">${item.w}×${item.d}×${item.h}mm</div>
        </button>
      `).join('');
    }

    function renderAppliancesCatalog() {
      const c = document.getElementById('appliances-catalog-grid');
      const list = CATALOG_ITEMS.filter(i => i.cat === 'appliance' || i.cat === 'kitbath');
      c.innerHTML = list.map(item => `
        <button onclick="addCatalogItemToScene('${item.id}')" class="shrink-0 w-36 p-1.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-amber-400 text-left">
          <div class="text-[10px] font-extrabold text-amber-300 truncate">${item.name}</div>
          <div class="text-[9px] text-slate-400 mt-0.5">${item.w}×${item.d}×${item.h}mm</div>
        </button>
      `).join('');
    }

    function renderLightingCatalog() {
      const c = document.getElementById('lighting-catalog-grid');
      const list = CATALOG_ITEMS.filter(i => i.cat === 'lighting');
      c.innerHTML = list.map(item => `
        <button onclick="addCatalogItemToScene('${item.id}')" class="shrink-0 w-36 p-1.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-amber-400 text-left">
          <div class="text-[10px] font-extrabold text-sky-300 truncate">${item.name}</div>
          <div class="text-[9px] text-slate-400 mt-0.5">${item.w}×${item.d}mm</div>
        </button>
      `).join('');
    }

    function updateBomList() {
      document.getElementById('bom-count-label').textContent = `清單(${placedFurniture.length})`;
      document.getElementById('bom-title-unit').textContent = `影輝苑 ${UNIT_META[currentUnitId].name} 報價清單 (${placedFurniture.length}項)`;
      const c = document.getElementById('bom-list-container');
      c.innerHTML = placedFurniture.map((entry, idx) => `
        <div onclick="selectItem(placedFurniture[${idx}])" class="shrink-0 w-40 p-1.5 rounded-xl bg-slate-900 border border-slate-800 cursor-pointer">
          <div class="text-[10px] font-bold text-white truncate">${idx + 1}. ${entry.data.name.replace(/^\d+\.\s*/, '')}</div>
          <div class="text-[9px] text-amber-300">${entry.data.w}×${entry.data.d}×${entry.data.h}mm</div>
        </div>
      `).join('');
    }

    function copyBomText() {
      const lines = [`【影輝苑A,B座設計DIY - ${UNIT_META[currentUnitId].name} 傢俬及家電尺寸清單】`];
      placedFurniture.forEach((f, idx) => {
        lines.push(`${idx + 1}. ${f.data.name}: ${f.data.w}W x ${f.data.d}D x ${f.data.h}H mm`);
      });
      const ta = document.createElement('textarea');
      ta.value = lines.join('\n');
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('✅ 已複製報價尺寸清單到剪貼簿！');
    }

    // =========================================================================
    // 16. UNIT MODAL, INSPECTOR MODAL & CAMERA VIEWS
    // =========================================================================
    function openUnitModal() {
      document.getElementById('unit-modal').classList.remove('hidden');
      filterUnitModalBlock('ALL');
    }

    function closeUnitModal() {
      document.getElementById('unit-modal').classList.add('hidden');
    }

    function filterUnitModalBlock(block) {
      ['ALL', 'A', 'B'].forEach(b => {
        const btn = document.getElementById('ublock-' + b);
        btn.className = b === block
          ? 'px-3 py-1 rounded-lg bg-amber-500 text-slate-950 font-black text-xs'
          : 'px-3 py-1 rounded-lg bg-slate-800 text-slate-200 font-bold text-xs';
      });
      const grid = document.getElementById('unit-modal-grid');
      const list = Object.values(UNIT_META).filter(u => block === 'ALL' || u.block === block);
      grid.innerHTML = list.map(u => `
        <button onclick="switchUnit('${u.id}');closeUnitModal()" class="p-2.5 rounded-xl border text-left transition ${u.id === currentUnitId ? 'bg-amber-500 text-slate-950 border-amber-300 font-black' : 'bg-slate-950 border-slate-800 text-white hover:border-amber-400'}">
          <div class="text-xs font-black">${u.name}</div>
          <div class="text-[9px] ${u.id === currentUnitId ? 'text-slate-900' : 'text-amber-400'} truncate mt-0.5">${u.badge}</div>
        </button>
      `).join('');
    }

    function openInspectorModal() {
      if (!selectedItem) return;
      document.getElementById('insp-w').value = selectedItem.data.w;
      document.getElementById('insp-d').value = selectedItem.data.d;
      document.getElementById('insp-h').value = selectedItem.data.h;
      document.getElementById('inspector-modal').classList.remove('hidden');
    }

    function closeInspectorModal() {
      document.getElementById('inspector-modal').classList.add('hidden');
    }

    function renderColorSwatches() {
      const c = document.getElementById('insp-color-swatches');
      c.innerHTML = FURNITURE_COLORS.map(col => `
        <button onclick="applyInspectorColor('${col.hex}')" class="p-1 rounded-lg bg-slate-950 border border-slate-700 flex flex-col items-center gap-0.5">
          <span class="w-6 h-6 rounded-full border border-white/30" style="background:${col.hex}"></span>
          <span class="text-[8px] text-slate-300 truncate w-full text-center">${col.name}</span>
        </button>
      `).join('');
    }

    function rebuildSelectedItemMesh() {
      if (!selectedItem) return;
      furnitureGroup.remove(selectedItem.mesh);
      const newMesh = buildDetailedItemMesh(selectedItem.data);
      newMesh.position.set(selectedItem.data.x, selectedItem.data.y || 0, selectedItem.data.z);
      newMesh.rotation.y = THREE.MathUtils.degToRad(selectedItem.data.rot || 0);
      newMesh.userData = { isFurnitureRoot: true, uid: selectedItem.uid };
      furnitureGroup.add(newMesh);
      selectedItem.mesh = newMesh;
      applyCurrentWallHeightToStructure();
      updateBomList();
    }

    function applyInspectorDimensions() {
      if (!selectedItem) return;
      selectedItem.data.w = Math.max(100, parseInt(document.getElementById('insp-w').value, 10) || 600);
      selectedItem.data.d = Math.max(100, parseInt(document.getElementById('insp-d').value, 10) || 600);
      selectedItem.data.h = Math.max(100, parseInt(document.getElementById('insp-h').value, 10) || 800);
      rebuildSelectedItemMesh();
    }

    function applyInspectorColor(hex) {
      if (!selectedItem) return;
      selectedItem.data.color = hex;
      rebuildSelectedItemMesh();
    }

    // One-click Zoom Out & Top-Down Full Layout Overview
    function fitFullLayoutTopView() {
      if (!camera || !controls) return;
      currentFocusZone = 'all';
      ['all', 'main_hall', 'hall_1', 'hall_2', 'side_room', 'kitchen', 'bathroom'].forEach(id => {
        const btn = document.getElementById('zbtn-' + id);
        if (btn) btn.classList.toggle('zone-btn-active', id === 'all');
      });
      applyZoneIsolationVisuals();
      createZone3DPins();

      const box = new THREE.Box3().setFromObject(structureGroup);
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      box.getCenter(center);
      box.getSize(size);

      const maxDim = Math.max(size.x, size.z, 6800);
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const aspect = camera.aspect || 1;
      const fitDist = (maxDim / 2) / Math.tan(fovRad / 2) / Math.min(1, aspect) * 1.18;

      controls.target.set(center.x, 0, center.z);
      camera.position.set(center.x, Math.max(9600, fitDist), center.z + 10);
      controls.update();
      showToast('🗺️ 已縮細並俯視全屋完整 Layout');
    }

    // Zoom In / Zoom Out & Rotate Camera View Direction Buttons
    function zoomCameraStep(deltaDist) {
      if (!camera || !controls) return;
      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      const curLen = offset.length();
      const newLen = THREE.MathUtils.clamp(curLen + deltaDist, 1100, 20000);
      offset.setLength(newLen);
      camera.position.copy(controls.target).add(offset);
      controls.update();
    }

    function orbitCameraAngle(deltaAngleRad) {
      if (!camera || !controls) return;
      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      const cosA = Math.cos(deltaAngleRad);
      const sinA = Math.sin(deltaAngleRad);
      const nx = offset.x * cosA - offset.z * sinA;
      const nz = offset.x * sinA + offset.z * cosA;
      offset.x = nx;
      offset.z = nz;
      camera.position.copy(controls.target).add(offset);
      controls.update();
    }

    function setCameraView(mode) {
      if (!camera || !controls) return;
      const box = new THREE.Box3().setFromObject(structureGroup);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const cx = isFinite(center.x) ? center.x : 1800;
      const cz = isFinite(center.z) ? center.z : 3300;

      if (mode === 'top2d') {
        fitFullLayoutTopView();
      } else if (mode === 'seaview') {
        controls.target.set(cx, 800, cz + 2800);
        camera.position.set(cx, 1500, cz - 1800);
        controls.update();
      } else {
        controls.target.set(cx, 300, cz);
        camera.position.set(cx + 600, 7600, cz + 4600);
        controls.update();
      }
    }

    function takeScreenshot() {
      renderer.render(scene, camera);
      const link = document.createElement('a');
      link.download = `影輝苑_${currentUnitId}_設計圖.png`;
      link.href = renderer.domElement.toDataURL('image/png');
      link.click();
      showToast('📷 已保存高清設計圖！');
    }

    function showToast(msg) {
      const b = document.getElementById('toast-banner');
      b.textContent = msg;
      b.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => b.classList.add('hidden'), 2600);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || Math.floor(window.innerHeight * 0.8);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      updateZone3DPinsPosition();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
