              for (let iw = 0; iw <= segW; iw++) {
                const u = iw / segW;
                const lat = (u - 0.5) * 2.0 * w;
                const cup = (1.0 - Math.pow((u - 0.5) * 2.0, 2)) * -0.025 * Math.sin(v * Math.PI);
                const px = ca * r - sa * lat;
                const pz = sa * r + ca * lat;
                pos.push(px, h + cup, pz);
                uvs.push(u, v);
                base++;
              }
            }
            const stride = segW + 1;
            for (let il = 0; il < segL; il++) {
              for (let iw = 0; iw < segW; iw++) {
                const a = start + il * stride + iw;
                const b = a + 1, c = a + stride, d = c + 1;
                idx.push(a, c, b, b, c, d);
              }
            }
          };

          // 外圈 8 瓣
          for (let i = 0; i < 8; i++) addPetal((i / 8) * Math.PI * 2, 0.30, 0.36, 0.115, 0.02);
          // 中圈 8 瓣
          for (let i = 0; i < 8; i++) addPetal(((i + 0.5) / 8) * Math.PI * 2, 0.56, 0.29, 0.092, 0.04);
          // 內圈 6 瓣
          for (let i = 0; i < 6; i++) addPetal((i / 6) * Math.PI * 2 + 0.2, 0.82, 0.20, 0.068, 0.06);

          const normals = this._computeSmoothNormals(pos, idx);
          return new THREE.BufferGeometry()
            .setAttribute('position', pos, 3)
            .setAttribute('normal', normals, 3)
            .setAttribute('uv', uvs, 2)
            .setIndex(idx);
        },

        // 不規則自然立體苔石
        createMossRockGeometry() {
          return this.createSphere(0.55, 16, 12, 1.15, 0.72, 1.0, (x, y, z) => {
            const n = Math.sin(x * 5.2 + z * 3.7) * 0.075 + Math.cos(z * 6.1 - y * 4.2) * 0.06;
            const flatTop = y > 0.22 ? 0.22 + (y - 0.22) * 0.45 : y;
            return [x * (1 + n), flatTop * (1 + n * 0.5), z * (1 - n * 0.7)];
          });
        }
      };

      /* =========================================================================
       * 6. GLSL 著色器集合（WebGL1/2 跨行動裝置安全精準度與防 NaN）
       * ========================================================================= */
      const PREC = `
        #ifdef GL_FRAGMENT_PRECISION_HIGH
          precision highp float;
        #else
          precision mediump float;
        #endif
      `;

      const Shaders = {
        // 1) 池底著色器（含動態陽光水下焦散）
        pondBedVert: `
          attribute vec3 position;
          attribute vec2 uv;
          uniform mat4 uModelMatrix;
          uniform mat4 uViewMatrix;
          uniform mat4 uProjectionMatrix;
          varying vec2 vUv;
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = uModelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            vUv = uv;
            gl_Position = uProjectionMatrix * uViewMatrix * wp;
          }
        `,
        pondBedFrag: PREC + `
          uniform sampler2D uMap;
          uniform float uTime;
          varying vec2 vUv;
          varying vec3 vWorldPos;

          float causticPattern(vec2 p, float t) {
            float c1 = sin(p.x * 2.1 + t * 1.1 + sin(p.y * 1.8 - t * 0.8));
            float c2 = cos(p.y * 2.4 - t * 0.95 + cos(p.x * 1.9 + t * 0.7));
            float c3 = sin((p.x + p.y) * 1.6 - t * 1.25);
            float v = abs(c1 + c2 + c3 * 0.5) / 2.5;
            return pow(clamp(1.0 - v, 0.0001, 1.0), 3.2);
          }

          void main() {
            vec3 base = texture2D(uMap, vUv * 2.6).rgb;
            float caust = causticPattern(vWorldPos.xz * 0.92, uTime);
            vec3 col = base + vec3(0.18, 0.42, 0.40) * caust * 0.55;
            // 周圍柔和暗角營造深池層次
            float dist = length(vWorldPos.xz) * 0.11;
            col *= (1.0 - clamp(dist * dist, 0.0, 0.42));
            gl_FragColor = vec4(col, 1.0);
          }
        `,

        // 2) 錦鯉與鯊魚共用游動變形頂點著色器（S 形擺尾 + 轉向彎曲 + 鯊魚撲咬擠壓拉伸）
        fishVert: `
          attribute vec3 position;
          attribute vec3 normal;
          attribute vec2 uv;
          uniform mat4 uModelMatrix;
          uniform mat4 uViewMatrix;
          uniform mat4 uProjectionMatrix;
          uniform mat3 uNormalMatrix;
          uniform float uSwimPhase;
          uniform float uSwimAmp;
          uniform float uTurnBend;
          uniform float uIsFin;
          uniform float uChomp;

          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vWorldPos;

          void main() {
            vec3 p = position;
            vec3 n = normal;

            // 撲咬瞬間 Pixar Squash & Stretch 彈性動畫
            if (uChomp > 0.001) {
              float s = sin(uChomp * 3.14159);
              p.z *= (1.0 + s * 0.14);
              p.x *= (1.0 - s * 0.06);
              p.y *= (1.0 + s * 0.08);
            }

            // 沿魚身（+Z 頭 -> -Z 尾）自然 S 型擺尾
            float tailWeight = clamp((0.65 - p.z) / 1.75, 0.0, 1.35);
            float w2 = tailWeight * tailWeight;
            float wave = sin(uSwimPhase - p.z * 3.4) * uSwimAmp * w2;
            float finFlutter = uIsFin * sin(uSwimPhase * 1.35 - p.z * 4.0) * 0.045 * clamp(abs(p.x) + tailWeight * 0.4, 0.0, 1.2);
            float bend = uTurnBend * w2 * 0.55;

            p.x += wave + bend;
            p.y += finFlutter;

            // 輕微調整法線隨擺尾方向偏轉
            float dWave = -cos(uSwimPhase - p.z * 3.4) * 3.4 * uSwimAmp * w2 * 0.25;
            n = normalize(vec3(n.x, n.y, n.z - dWave * n.x));

            vec4 wp = uModelMatrix * vec4(p, 1.0);
            vWorldPos = wp.xyz;
            vNormal = normalize(uNormalMatrix * n);
            vUv = uv;
            gl_Position = uProjectionMatrix * uViewMatrix * wp;
          }
        `,

        // 3) 錦鯉溫潤光澤著色器
        koiFrag: PREC + `
          uniform sampler2D uMap;
          uniform float uTime;
          uniform float uAlpha;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vWorldPos;

          void main() {
            vec4 tex = texture2D(uMap, vUv);
            float a = tex.a * uAlpha;
            if (a < 0.02) discard;

            vec3 N = length(vNormal) > 0.0001 ? normalize(vNormal) : vec3(0.0, 1.0, 0.0);
            vec3 L = normalize(vec3(0.30, 0.92, -0.25));
            vec3 V = normalize(vec3(0.0, 1.0, 0.14));
            vec3 H = normalize(L + V);

            float diff = clamp((dot(N, L) + 0.45) / 1.45, 0.0, 1.0);
            float spec = pow(clamp(dot(N, H), 0.0001, 1.0), 36.0) * 0.42;
            float caust = max(0.0, sin(vWorldPos.x * 3.1 + uTime * 2.1) * cos(vWorldPos.z * 2.9 - uTime * 1.7)) * 0.10;

            vec3 col = tex.rgb * (0.46 + 0.62 * diff) + vec3(0.95, 1.0, 1.0) * spec + vec3(0.42, 0.78, 0.78) * caust;
            float depth = clamp(-vWorldPos.y / 2.6, 0.0, 1.0);
            col = mix(col, vec3(0.07, 0.22, 0.24), depth * 0.22);
            gl_FragColor = vec4(col, a);
          }
        `,

        // 4) 參考附圖：3D Pixar 光澤公仔胖鯊魚著色器（柔化三點攝影棚光 + 清漆高光 + 冰藍輪廓光）
        sharkFrag: PREC + `
          uniform sampler2D uMap;
          uniform float uTime;
          uniform float uGloss;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vWorldPos;

          void main() {
            vec4 tex = texture2D(uMap, vUv);

            vec3 N = length(vNormal) > 0.0001 ? normalize(vNormal) : vec3(0.0, 1.0, 0.0);
            vec3 L = normalize(vec3(0.32, 0.90, -0.28));
            vec3 L2 = normalize(vec3(-0.55, 0.58, 0.48));
            vec3 V = normalize(vec3(0.0, 1.0, 0.15));
            vec3 H = normalize(L + V);

            float wrapDiff = clamp((dot(N, L) + 0.54) / 1.54, 0.0, 1.0);
            float fillDiff = max(dot(N, L2), 0.0) * 0.22;

            float ndh = clamp(dot(N, H), 0.0001, 1.0);
            float clearcoat = pow(ndh, mix(26.0, 92.0, uGloss)) * mix(0.38, 0.92, uGloss);
            float softSheen = pow(ndh, 8.0) * mix(0.16, 0.08, uGloss);

            float rimBase = clamp(1.0 - max(dot(N, V), 0.0), 0.0001, 1.0);
            float rim = pow(rimBase, 2.4);
            vec3 rimCol = vec3(0.78, 0.95, 1.0) * rim * mix(0.36, 0.20, uGloss);

            float caust = max(0.0, sin(vWorldPos.x * 2.8 + uTime * 2.0) * cos(vWorldPos.z * 2.6 - uTime * 1.6)) * 0.06 * max(N.y, 0.0);

            vec3 col = tex.rgb * (0.52 + 0.56 * wrapDiff + fillDiff)
                     + vec3(1.0, 1.0, 1.0) * (clearcoat + softSheen)
                     + rimCol
                     + vec3(0.68, 0.92, 0.98) * caust;

            float depth = clamp(-vWorldPos.y / 2.6, 0.0, 1.0);
            col = mix(col, vec3(0.08, 0.25, 0.27), depth * 0.14);
            gl_FragColor = vec4(col, 1.0);
          }
        `,

        // 5) 通用 3D 立體物件著色器（睡蓮、荷葉、苔石、卵石、飼料）
        litVert: `
          attribute vec3 position;
          attribute vec3 normal;
          attribute vec2 uv;
          uniform mat4 uModelMatrix;
          uniform mat4 uViewMatrix;
          uniform mat4 uProjectionMatrix;
          uniform mat3 uNormalMatrix;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = uModelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            vNormal = normalize(uNormalMatrix * normal);
            vUv = uv;
            gl_Position = uProjectionMatrix * uViewMatrix * wp;
          }
        `,
        litFrag: PREC + `
          uniform sampler2D uMap;
          uniform float uAlpha;
          uniform float uUnderwater;
          uniform float uSpec;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vWorldPos;
          void main() {
            vec4 tex = texture2D(uMap, vUv);
            float a = tex.a * uAlpha;
            if (a < 0.08) discard;

            vec3 N = length(vNormal) > 0.0001 ? normalize(vNormal) : vec3(0.0, 1.0, 0.0);
            vec3 L = normalize(vec3(0.32, 0.90, -0.30));
            vec3 V = normalize(vec3(0.0, 1.0, 0.16));
            vec3 H = normalize(L + V);

            float diff = clamp((dot(N, L) + 0.42) / 1.42, 0.0, 1.0);
            float spec = pow(clamp(dot(N, H), 0.0001, 1.0), 28.0) * uSpec;
            vec3 col = tex.rgb * (0.44 + 0.64 * diff) + vec3(1.0, 0.99, 0.96) * spec;

            if (uUnderwater > 0.5) {
              float d = clamp(-vWorldPos.y / 2.4, 0.0, 1.0);
              col = mix(col, vec3(0.06, 0.20, 0.22), d * 0.36);
            }
            gl_FragColor = vec4(col, a);
          }
        `,

        // 6) 晶瑩 3D 氣泡著色器（鯊魚咬食瞬間冒出）
        bubbleFrag: PREC + `
          uniform float uAlpha;
          varying vec3 vNormal;
          void main() {
            vec3 N = length(vNormal) > 0.0001 ? normalize(vNormal) : vec3(0.0, 1.0, 0.0);
            vec3 V = normalize(vec3(0.0, 1.0, 0.15));
            vec3 L = normalize(vec3(0.35, 0.90, -0.25));
            vec3 H = normalize(L + V);
            float fresnel = pow(clamp(1.0 - max(dot(N, V), 0.0), 0.0001, 1.0), 2.1);
            float spec = pow(clamp(dot(N, H), 0.0001, 1.0), 42.0);
            vec3 col = mix(vec3(0.70, 0.94, 1.0), vec3(1.0, 1.0, 1.0), clamp(fresnel + spec, 0.0, 1.0));
            float a = clamp(0.18 + fresnel * 0.68 + spec * 0.85, 0.0, 0.92) * uAlpha;
            gl_FragColor = vec4(col, a);
          }
        `,

        // 7) 池底投影著色器
        shadowVert: `
          attribute vec3 position;
          attribute vec2 uv;
          uniform mat4 uModelMatrix;
          uniform mat4 uViewMatrix;
          uniform mat4 uProjectionMatrix;
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = uProjectionMatrix * uViewMatrix * uModelMatrix * vec4(position, 1.0);
          }
        `,
        shadowFrag: PREC + `
          uniform sampler2D uMap;
          uniform float uOpacity;
          varying vec2 vUv;
          void main() {
            vec4 tex = texture2D(uMap, vUv);
            gl_FragColor = vec4(tex.rgb, tex.a * uOpacity);
          }
        `,

        // 8) 全螢幕水面折射與波紋高光合成著色器（將水下 FBO 即時扭曲折射）
        waterVert: `
          attribute vec3 position;
          attribute vec2 uv;
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        waterFrag: PREC + `
          uniform sampler2D uUnderwater;
          uniform sampler2D uRipples;
          uniform float uTime;
          varying vec2 vUv;

          void main() {
            // uRipples: R=高度, G=dx, B=dy（以 0.5 為 0）
            vec2 ripUv = vec2(vUv.x, 1.0 - vUv.y);
            vec3 rip = texture2D(uRipples, ripUv).rgb;
            vec2 grad = (rip.gb - 0.5) * 2.0;

            // 微弱自然微風細波
            float breezeX = sin(vUv.x * 22.0 + uTime * 1.4) * cos(vUv.y * 19.0 - uTime * 1.1) * 0.0014;
            float breezeY = cos(vUv.x * 18.0 - uTime * 1.2) * sin(vUv.y * 24.0 + uTime * 1.5) * 0.0014;

            vec2 offset = grad * 0.032 + vec2(breezeX, breezeY);
            vec2 refractUv = clamp(vUv + offset, 0.002, 0.998);

            // 輕微色散增加清澈泉水質感
            float r = texture2D(uUnderwater, clamp(refractUv + offset * 0.14, 0.002, 0.998)).r;
            float g = texture2D(uUnderwater, refractUv).g;
            float b = texture2D(uUnderwater, clamp(refractUv - offset * 0.14, 0.002, 0.998)).b;
            vec3 waterCol = vec3(r, g, b);

            // 水面法線與清亮陽光波紋反光
            vec3 N = normalize(vec3(-grad.x * 2.6 - breezeX * 18.0, 1.0, -grad.y * 2.6 - breezeY * 18.0));
            vec3 L = normalize(vec3(0.32, 0.90, -0.35));
            vec3 V = vec3(0.0, 1.0, 0.0);
            vec3 H = normalize(L + V);

            float spec = pow(clamp(dot(N, H), 0.0001, 1.0), 46.0) * 0.72;
            float glint = smoothstep(0.18, 0.75, length(grad)) * 0.16;

            // 極清透天光微反射，絕不遮擋下方錦鯉與胖鯊魚
            vec3 skyTint = vec3(0.45, 0.78, 0.86);
            waterCol = mix(waterCol, skyTint, 0.045 + glint * 0.35);
            waterCol += vec3(0.88, 0.98, 1.0) * (spec + glint * 0.45);

            gl_FragColor = vec4(waterCol, 1.0);
          }
        `
      };

      /* =========================================================================
       * 7. 錦鯉池主應用程式（物理邊界、三種錦鯉追逐 AI、3D Pixar 胖鯊魚掠食 AI、造景互動）
       * ========================================================================= */
      class KoiPondApp {
        constructor(canvas) {
          this.canvas = canvas;
          this.renderer = new THREE.WebGLRenderer(canvas);
          this.audio = new PondAudio();
          this.camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 40);
          this.camera.eye = [0, 13.8, 1.45];
          this.camera.target = [0, -0.25, 0];
          this.camera.up = [0, 0, -1];
          this.camera.updateMatrices();

          this.underwaterScene = new THREE.Object3D();
          this.waterPassScene = new THREE.Object3D();
          this.aboveWaterScene = new THREE.Object3D();

          this.underwaterRT = new THREE.RenderTarget(512, 512);
          this.rippleSim = new WaterRippleSim(140, 210);

          this.bounds = { minX: -4, maxX: 4, minZ: -6, maxZ: 6 };
          this.time = 0;
          this.mode = 'ripple';
          this.selectedFish = 'kohaku';
          this.selectedDecor = 'lotus';

          this.kois = [];
          this.sharks = [];
          this.pellets = [];
          this.decors = [];
          this.bubbles = [];

          this._pointerDown = false;
          this._lastWaterPos = null;
          this._toastTimer = null;

          this._initAssets();
          this._initScenes();
          this._handleResize();
          this._initUI();
          this._initInput();
          this.resetPond();
        }

        _initAssets() {
          this.assets = {
            texBed: TextureFactory.createPondBedTexture(),
            texKoi: {
              kohaku: TextureFactory.createKoiTexture('kohaku'),
              sanke: TextureFactory.createKoiTexture('sanke'),
              yamabuki: TextureFactory.createKoiTexture('yamabuki')
            },
            texKoiFin: {
              kohaku: TextureFactory.createKoiFinTexture('kohaku'),
              sanke: TextureFactory.createKoiFinTexture('sanke'),
              yamabuki: TextureFactory.createKoiFinTexture('yamabuki')
            },
            texSharkBody: TextureFactory.createSharkBodyTexture(),
            texSharkFin: TextureFactory.createSharkFinTexture(),
            texSharkEye: TextureFactory.createSharkEyeTexture(),
            texSharkMouth: TextureFactory.createSharkMouthTexture(),
            texSharkTeeth: TextureFactory.createSharkTeethTexture(),
            texSharkNostril: TextureFactory.createSharkNostrilTexture(),
            texLilyPad: TextureFactory.createLilyPadTexture(),
            texLotusPetal: TextureFactory.createLotusPetalTexture(),
            texMossRock: TextureFactory.createMossRockTexture(),
            texPebble: TextureFactory.createPebbleTexture(),
            texSoftShadow: TextureFactory.createSoftShadowTexture(),
            texFishShadow: TextureFactory.createFishShadowTexture(),
            texPellet: TextureFactory.createPelletTexture(),

            geoQuad: GeometryFactory.createPlane(2, 2, 1, 1, false),
            geoPlane: GeometryFactory.createPlane(1, 1, 1, 1, true),
            geoKoiBody: GeometryFactory.createKoiBodyGeometry(),
            geoKoiFins: GeometryFactory.createKoiFinsGeometry(),
            geoSharkBody: GeometryFactory.createSharkBodyGeometry(),
            geoSharkFins: GeometryFactory.createSharkFinsGeometry(),
            geoSharkEyes: GeometryFactory.createSharkEyesGeometry(),
            geoSharkMouth: GeometryFactory.createSharkMouthGeometry(),
            geoSharkTeeth: GeometryFactory.createSharkTeethGeometry(),
            geoSharkNostrils: GeometryFactory.createSharkNostrilsGeometry(),
            geoLotusFlower: GeometryFactory.createLotusFlowerGeometry(),
            geoMossRock: GeometryFactory.createMossRockGeometry(),
            geoPebble: GeometryFactory.createSphere(0.18, 10, 8, 1.25, 0.55, 0.95),
            geoPellet: GeometryFactory.createSphere(0.055, 8, 6, 1.0, 0.72, 1.0),
            geoBubble: GeometryFactory.createSphere(0.065, 10, 8, 1, 1, 1)
          };
        }

        _initScenes() {
          // 池底平面
          this.bedUniforms = {
            uMap: { value: this.assets.texBed },
            uTime: { value: 0 }
          };
          const bedMat = new THREE.ShaderMaterial({
            vertexShader: Shaders.pondBedVert,
            fragmentShader: Shaders.pondBedFrag,
            uniforms: this.bedUniforms
          });
          const bedMesh = new THREE.Mesh(GeometryFactory.createPlane(28, 36, 1, 1, true), bedMat);
          bedMesh.position.y = -2.0;
          this.underwaterScene.add(bedMesh);

          // 全螢幕水面合成層
          this.waterUniforms = {
            uUnderwater: { value: this.underwaterRT.texture },
            uRipples: { value: this.rippleSim.texture },
            uTime: { value: 0 }
          };
          const waterMat = new THREE.ShaderMaterial({
            vertexShader: Shaders.waterVert,
            fragmentShader: Shaders.waterFrag,
            uniforms: this.waterUniforms,
            depthTest: false,
            depthWrite: false,
            side: THREE.DoubleSide
          });
          this.waterPassScene.add(new THREE.Mesh(this.assets.geoQuad, waterMat));
        }

        _handleResize() {
          const cssW = window.innerWidth;
          const cssH = window.innerHeight;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          this.renderer.setSize(cssW, cssH, dpr);
          this.underwaterRT.resize(this.renderer.gl, cssW * dpr, cssH * dpr);

          this.camera.aspect = cssW / Math.max(1, cssH);
          this.camera.updateMatrices();

          // 精確計算水面 (y=0) 可視邊界，確保所有魚永遠在畫面內活動
          const topLeft = this.camera.screenToWaterPlane(-1, 1);
          const botRight = this.camera.screenToWaterPlane(1, -1);
          const minX = Math.min(topLeft.x, botRight.x);
          const maxX = Math.max(topLeft.x, botRight.x);
          const minZ = Math.min(topLeft.z, botRight.z);
          const maxZ = Math.max(topLeft.z, botRight.z);
          this.bounds = { minX, maxX, minZ, maxZ, w: maxX - minX, h: maxZ - minZ };

          this._rebuildRippleObstacles();
        }

        worldToRippleUV(x, z) {
          const u = (x - this.bounds.minX) / (this.bounds.w || 1);
          const v = (z - this.bounds.minZ) / (this.bounds.h || 1);
          return { u, v };
        }

        _rebuildRippleObstacles() {
          this.rippleSim.clearObstacles();
          for (const d of this.decors) {
            if (d.type === 'rock') {
              const uv = this.worldToRippleUV(d.x, d.z);
              const ru = (d.radius * 0.92) / (this.bounds.w || 1);
              const rv = (d.radius * 0.92) / (this.bounds.h || 1);
              this.rippleSim.addObstacleCircle(uv.u, uv.v, ru, rv);
            }
          }
        }

        showToast(msg) {
          const el = document.getElementById('toast');
          el.textContent = msg;
          el.classList.add('show');
          clearTimeout(this._toastTimer);
          this._toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
        }

        _updateStats() {
          const el = document.getElementById('stats-label');
          el.textContent = `${this.kois.length} 鯉 · ${this.sharks.length} 鯊`;
        }

        /* -------------------------------------------------------------------
         * 生成魚類：三種錦鯉 + 3D Pixar 可愛胖鯊魚
         * ------------------------------------------------------------------- */
        spawnFish(variant, x, z, silent = false) {
          const isShark = variant === 'shark';
          if (isShark && this.sharks.length >= 4) {
            this.showToast('水池最多放 4 隻胖鯊魚喔！');
            return;
          }
          if (!isShark && this.kois.length >= 20) {
            this.showToast('錦鯉已經很熱鬧囉（上限 20 尾）');
            return;
          }

          const root = new THREE.Object3D();
          const uniforms = {
            uSwimPhase: { value: Math.random() * Math.PI * 2 },
            uSwimAmp: { value: isShark ? 0.14 : 0.17 },
            uTurnBend: { value: 0.0 },
            uChomp: { value: 0.0 },
            uTime: { value: this.time }
          };

          if (isShark) {
            // 參考附圖：圓潤天空藍白肚胖鯊魚（軀幹 + 四鰭 + 亮黑大眼 + 紅口腔 + 13 顆白尖牙 + 小鼻孔）
            const makeSharkMat = (tex, gloss, isFin = 0, doubleSide = false) => new THREE.ShaderMaterial({
              vertexShader: Shaders.fishVert,
              fragmentShader: Shaders.sharkFrag,
              side: doubleSide ? THREE.DoubleSide : THREE.FrontSide,
              uniforms: {
                uMap: { value: tex },
                uSwimPhase: uniforms.uSwimPhase,
                uSwimAmp: uniforms.uSwimAmp,
                uTurnBend: uniforms.uTurnBend,
                uIsFin: { value: isFin },
                uChomp: uniforms.uChomp,
                uTime: uniforms.uTime,
                uGloss: { value: gloss }
              }
            });

            root.add(new THREE.Mesh(this.assets.geoSharkBody, makeSharkMat(this.assets.texSharkBody, 0.62, 0, true)));
            root.add(new THREE.Mesh(this.assets.geoSharkFins, makeSharkMat(this.assets.texSharkFin, 0.56, 1, true)));
            root.add(new THREE.Mesh(this.assets.geoSharkEyes, makeSharkMat(this.assets.texSharkEye, 0.98, 0, false)));
            root.add(new THREE.Mesh(this.assets.geoSharkMouth, makeSharkMat(this.assets.texSharkMouth, 0.25, 0, true)));
            root.add(new THREE.Mesh(this.assets.geoSharkTeeth, makeSharkMat(this.assets.texSharkTeeth, 0.72, 0, true)));
            root.add(new THREE.Mesh(this.assets.geoSharkNostrils, makeSharkMat(this.assets.texSharkNostril, 0.20, 0, false)));
          } else {
            const bodyMat = new THREE.ShaderMaterial({
              vertexShader: Shaders.fishVert,
              fragmentShader: Shaders.koiFrag,
              side: THREE.DoubleSide,
              uniforms: {
                uMap: { value: this.assets.texKoi[variant] || this.assets.texKoi.kohaku },
                uSwimPhase: uniforms.uSwimPhase,
                uSwimAmp: uniforms.uSwimAmp,
                uTurnBend: uniforms.uTurnBend,
                uIsFin: { value: 0.0 },
                uChomp: uniforms.uChomp,
                uTime: uniforms.uTime,
                uAlpha: { value: 1.0 }
              }
            });
            const finMat = new THREE.ShaderMaterial({
              vertexShader: Shaders.fishVert,
              fragmentShader: Shaders.koiFrag,
              transparent: true,
              depthWrite: false,
              side: THREE.DoubleSide,
              uniforms: {
                uMap: { value: this.assets.texKoiFin[variant] || this.assets.texKoiFin.kohaku },
                uSwimPhase: uniforms.uSwimPhase,
                uSwimAmp: uniforms.uSwimAmp,
                uTurnBend: uniforms.uTurnBend,
                uIsFin: { value: 1.0 },
                uChomp: uniforms.uChomp,
                uTime: uniforms.uTime,
                uAlpha: { value: 0.92 }
              }
            });
            const finMesh = new THREE.Mesh(this.assets.geoKoiFins, finMat);
            finMesh.renderOrder = 3;
            root.add(new THREE.Mesh(this.assets.geoKoiBody, bodyMat));
            root.add(finMesh);
          }

          // 池底投影
          const shadowMat = new THREE.ShaderMaterial({
            vertexShader: Shaders.shadowVert,
            fragmentShader: Shaders.shadowFrag,
            transparent: true,
            depthWrite: false,
            uniforms: {
              uMap: { value: this.assets.texFishShadow },
              uOpacity: { value: isShark ? 0.75 : 0.62 }
            }
          });
          const shadowMesh = new THREE.Mesh(this.assets.geoPlane, shadowMat);
          shadowMesh.renderOrder = 1;
          this.underwaterScene.add(shadowMesh);
          this.underwaterScene.add(root);

          const scale = isShark ? (1.18 + Math.random() * 0.16) : (0.72 + Math.random() * 0.24);
          const angle = Math.random() * Math.PI * 2;
          const baseDepth = isShark ? -0.46 : (-0.52 - Math.random() * 0.55);

          root.position.x = x;
          root.position.y = baseDepth;
          root.position.z = z;
          root.rotation.y = angle;
          root.scale.x = root.scale.y = root.scale.z = scale;

          const entity = {
            id: Math.random().toString(36).slice(2),
            variant,
            isShark,
            mesh: root,
            shadow: shadowMesh,
            uniforms,
            x,
            y: baseDepth,
            z,
            baseDepth,
            angle,
            speed: isShark ? 1.55 : (1.15 + Math.random() * 0.35),
            baseSpeed: isShark ? 1.55 : (1.15 + Math.random() * 0.35),
            scale,
            turnRate: 0,
            wanderAngle: angle,
            wanderTimer: 1 + Math.random() * 2,
            // 錦鯉追逐用
            chaseTarget: null,
            chaseTimer: 2 + Math.random() * 4,
            // 鯊魚掠食用
            state: 'cruise',
            prey: null,
            huntCooldown: 4.0 + Math.random() * 3.5,
            chompTimer: 0,
            roll: 0,
            pitch: 0
          };

          if (isShark) this.sharks.push(entity);
          else this.kois.push(entity);

          if (!silent) {
            const uv = this.worldToRippleUV(x, z);
            this.rippleSim.drop(uv.u, uv.v, isShark ? 7 : 4.5, isShark ? 1.15 : 0.75);
            this.audio.playPlop(isShark ? 0.68 : 1.05, isShark ? 0.16 : 0.12);
          }
          this._updateStats();
          return entity;
        }

        _removeFish(fish) {
          this.underwaterScene.remove(fish.mesh);
          this.underwaterScene.remove(fish.shadow);
          if (fish.isShark) {
            const idx = this.sharks.indexOf(fish);
            if (idx >= 0) this.sharks.splice(idx, 1);
          } else {
            const idx = this.kois.indexOf(fish);
            if (idx >= 0) this.kois.splice(idx, 1);
            // 清除任何正在追這條魚的參考
            for (const k of this.kois) if (k.chaseTarget === fish) k.chaseTarget = null;
            for (const s of this.sharks) if (s.prey === fish) { s.prey = null; s.state = 'cruise'; }
          }
          this._updateStats();
        }

        /* -------------------------------------------------------------------
         * 投餵飼料與氣泡粒子
         * ------------------------------------------------------------------- */
        dropFoodCluster(x, z) {
          if (this.pellets.length > 35) return;
          const count = 3 + Math.floor(Math.random() * 3);
          for (let i = 0; i < count; i++) {
            const px = x + (Math.random() - 0.5) * 0.65;
            const pz = z + (Math.random() - 0.5) * 0.65;
            const mat = new THREE.ShaderMaterial({
              vertexShader: Shaders.litVert,
              fragmentShader: Shaders.litFrag,
              uniforms: {
                uMap: { value: this.assets.texPellet },
                uAlpha: { value: 1.0 },
                uUnderwater: { value: 0.0 },
                uSpec: { value: 0.2 }
              }
            });
            const mesh = new THREE.Mesh(this.assets.geoPellet, mat);
            mesh.position.x = px;
            mesh.position.y = 0.03;
            mesh.position.z = pz;
            this.aboveWaterScene.add(mesh);

            this.pellets.push({
              mesh,
              x: px,
              z: pz,
              vx: (Math.random() - 0.5) * 0.18,
              vz: (Math.random() - 0.5) * 0.18,
              life: 24
            });
          }
          const uv = this.worldToRippleUV(x, z);
          this.rippleSim.drop(uv.u, uv.v, 3.8, 0.58);
          this.audio.playPlop(1.42 + Math.random() * 0.25, 0.10);
        }

        _removePellet(pellet) {
          this.aboveWaterScene.remove(pellet.mesh);
          const idx = this.pellets.indexOf(pellet);
          if (idx >= 0) this.pellets.splice(idx, 1);
        }

        _spawnBubbles(x, y, z, count = 12) {
          for (let i = 0; i < count; i++) {
            const uAlpha = { value: 0.95 };
            const mat = new THREE.ShaderMaterial({
              vertexShader: Shaders.litVert,
              fragmentShader: Shaders.bubbleFrag,
              transparent: true,
              depthWrite: false,
              uniforms: { uAlpha }
            });
            const mesh = new THREE.Mesh(this.assets.geoBubble, mat);
            const sc = 0.55 + Math.random() * 1.15;
            mesh.scale.x = mesh.scale.y = mesh.scale.z = sc;
            mesh.renderOrder = 6;
            const bx = x + (Math.random() - 0.5) * 0.65;
            const by = y + (Math.random() - 0.5) * 0.2;
            const bz = z + (Math.random() - 0.5) * 0.65;
            mesh.position.x = bx;
            mesh.position.y = by;
            mesh.position.z = bz;
            this.underwaterScene.add(mesh);

            this.bubbles.push({
              mesh,
              uAlpha,
              x: bx,
              y: by,
              z: bz,
              vx: (Math.random() - 0.5) * 0.55,
              vy: 0.65 + Math.random() * 0.75,
              vz: (Math.random() - 0.5) * 0.55,
              life: 0.85 + Math.random() * 0.65,
              maxLife: 1.4
            });
          }
        }

        /* -------------------------------------------------------------------
         * 池塘造景：睡蓮、荷葉、苔石、卵石
         * ------------------------------------------------------------------- */
        placeDecor(type, x, z, silent = false) {
          if (this.decors.length >= 28) {
            this.showToast('造景數量已達上限，可先切換「移除」整理');
            return;
          }

          let group = new THREE.Object3D();
          let shadow = null;
          let radius = 0.65;
          let floating = false;

          if (type === 'pad' || type === 'lotus') {
            floating = true;
            const padSize = type === 'lotus' ? (1.15 + Math.random() * 0.25) : (0.95 + Math.random() * 0.45);
            radius = padSize * 0.52;

            const padMat = new THREE.ShaderMaterial({
              vertexShader: Shaders.litVert,
              fragmentShader: Shaders.litFrag,
              transparent: true,
              depthWrite: true,
              side: THREE.DoubleSide,
              uniforms: {
                uMap: { value: this.assets.texLilyPad },
                uAlpha: { value: 1.0 },
                uUnderwater: { value: 0.0 },
                uSpec: { value: 0.26 }
              }
            });
            const padMesh = new THREE.Mesh(this.assets.geoPlane, padMat);
            padMesh.scale.x = padMesh.scale.z = padSize;
            padMesh.rotation.y = Math.random() * Math.PI * 2;
            group.add(padMesh);

            if (type === 'lotus') {
              const petalMat = new THREE.ShaderMaterial({
                vertexShader: Shaders.litVert,
                fragmentShader: Shaders.litFrag,
                side: THREE.DoubleSide,
                uniforms: {
                  uMap: { value: this.assets.texLotusPetal },
                  uAlpha: { value: 1.0 },
                  uUnderwater: { value: 0.0 },
                  uSpec: { value: 0.18 }
                }
              });
              const flower = new THREE.Mesh(this.assets.geoLotusFlower, petalMat);
              flower.position.y = 0.03;
              flower.scale.x = flower.scale.y = flower.scale.z = 1.05;
              flower.rotation.y = Math.random() * Math.PI * 2;
              group.add(flower);

              // 金黃花蕊
              const centerMat = new THREE.ShaderMaterial({
                vertexShader: Shaders.litVert,
                fragmentShader: Shaders.litFrag,
                uniforms: {
                  uMap: { value: this.assets.texPellet },
                  uAlpha: { value: 1.0 },
                  uUnderwater: { value: 0.0 },
                  uSpec: { value: 0.25 }
                }
              });
              const stamen = new THREE.Mesh(this.assets.geoPellet, centerMat);
              stamen.position.y = 0.13;
              stamen.scale.x = stamen.scale.y = stamen.scale.z = 1.65;
              group.add(stamen);
            }

            group.position.x = x;
            group.position.y = 0.04;
            group.position.z = z;
            this.aboveWaterScene.add(group);

            // 荷葉在池底的陰影
            const shMat = new THREE.ShaderMaterial({
              vertexShader: Shaders.shadowVert,
              fragmentShader: Shaders.shadowFrag,
              transparent: true,
              depthWrite: false,
              uniforms: { uMap: { value: this.assets.texSoftShadow }, uOpacity: { value: 0.52 } }
            });
            shadow = new THREE.Mesh(this.assets.geoPlane, shMat);
            shadow.position.x = x + 0.22;
            shadow.position.y = -1.92;
            shadow.position.z = z + 0.18;
            shadow.scale.x = shadow.scale.z = padSize * 1.08;
            shadow.renderOrder = 1;
            this.underwaterScene.add(shadow);
          } else if (type === 'rock') {
            const sc = 0.88 + Math.random() * 0.42;
            radius = 0.65 * sc;
            const rockMat = new THREE.ShaderMaterial({
              vertexShader: Shaders.litVert,
              fragmentShader: Shaders.litFrag,
              uniforms: {
                uMap: { value: this.assets.texMossRock },
                uAlpha: { value: 1.0 },
                uUnderwater: { value: 0.0 },
                uSpec: { value: 0.28 }
              }
            });
            const rockMesh = new THREE.Mesh(this.assets.geoMossRock, rockMat);
            rockMesh.scale.x = sc;
            rockMesh.scale.y = sc * 1.15;
            rockMesh.scale.z = sc * (0.85 + Math.random() * 0.3);
            rockMesh.rotation.y = Math.random() * Math.PI * 2;
            group.add(rockMesh);
            group.position.x = x;
            group.position.y = 0.06;
            group.position.z = z;
            this.aboveWaterScene.add(group);

            // 岩石池底陰影
            const shMat = new THREE.ShaderMaterial({
              vertexShader: Shaders.shadowVert,
              fragmentShader: Shaders.shadowFrag,
              transparent: true,
              depthWrite: false,
              uniforms: { uMap: { value: this.assets.texSoftShadow }, uOpacity: { value: 0.72 } }
            });
            shadow = new THREE.Mesh(this.assets.geoPlane, shMat);
            shadow.position.x = x + 0.18;
            shadow.position.y = -1.92;
            shadow.position.z = z + 0.16;
            shadow.scale.x = shadow.scale.z = radius * 2.5;
            shadow.renderOrder = 1;
            this.underwaterScene.add(shadow);
          } else if (type === 'pebble') {
            radius = 0.55;
            const count = 3 + Math.floor(Math.random() * 3);
            const pebMat = new THREE.ShaderMaterial({
              vertexShader: Shaders.litVert,
              fragmentShader: Shaders.litFrag,
              uniforms: {
                uMap: { value: this.assets.texPebble },
                uAlpha: { value: 1.0 },
                uUnderwater: { value: 1.0 },
                uSpec: { value: 0.22 }
              }
            });
            for (let i = 0; i < count; i++) {
              const m = new THREE.Mesh(this.assets.geoPebble, pebMat);
              const s = 0.7 + Math.random() * 0.85;
              m.position.x = (Math.random() - 0.5) * 0.62;
              m.position.y = 0.05 * s;
              m.position.z = (Math.random() - 0.5) * 0.62;
              m.rotation.y = Math.random() * Math.PI * 2;
              m.scale.x = s;
              m.scale.y = s * 0.85;
              m.scale.z = s * (0.8 + Math.random() * 0.35);
              group.add(m);
            }
            group.position.x = x;
            group.position.y = -1.95;
            group.position.z = z;
            this.underwaterScene.add(group);
          }

          this.decors.push({
            type,
            x,
            z,
            radius,
            floating,
            group,
            shadow,
            inUnderwater: type === 'pebble',
            phase: Math.random() * Math.PI * 2
          });

          if (type === 'rock') this._rebuildRippleObstacles();
          if (!silent) {
            const uv = this.worldToRippleUV(x, z);
            this.rippleSim.drop(uv.u, uv.v, type === 'rock' ? 7 : 5, type === 'rock' ? 1.0 : 0.62);
            this.audio.playPlop(type === 'rock' ? 0.62 : 1.12, 0.13);
          }
        }

        _removeDecor(d) {
          if (d.inUnderwater) this.underwaterScene.remove(d.group);
          else this.aboveWaterScene.remove(d.group);
          if (d.shadow) this.underwaterScene.remove(d.shadow);
          const idx = this.decors.indexOf(d);
          if (idx >= 0) this.decors.splice(idx, 1);
          if (d.type === 'rock') this._rebuildRippleObstacles();
        }

        removeNearestAt(x, z) {
          let best = null, bestDist = 1.25, kind = null;
          for (const d of this.decors) {
            const dist = Math.hypot(d.x - x, d.z - z);
            if (dist < Math.max(d.radius + 0.35, bestDist) && dist < bestDist) {
              best = d; bestDist = dist; kind = 'decor';
            }
          }
          for (const f of [...this.sharks, ...this.kois]) {
            const dist = Math.hypot(f.x - x, f.z - z);
            if (dist < bestDist) {
              best = f; bestDist = dist; kind = 'fish';
            }
          }
          if (!best) return;
          if (kind === 'decor') this._removeDecor(best);
          else this._removeFish(best);

          const uv = this.worldToRippleUV(best.x, best.z);
          this.rippleSim.drop(uv.u, uv.v, 4.5, 0.65);
          this.audio.playPlop(1.3, 0.1);
        }

        /* -------------------------------------------------------------------
         * 重置水池（預設 9 尾三色錦鯉 + 1 隻 3D Pixar 胖鯊魚 + 禪意造景）
         * ------------------------------------------------------------------- */
        resetPond() {
          for (const f of [...this.kois]) this._removeFish(f);
          for (const s of [...this.sharks]) this._removeFish(s);
          for (const p of [...this.pellets]) this._removePellet(p);
          for (const d of [...this.decors]) this._removeDecor(d);
          for (const b of this.bubbles) this.underwaterScene.remove(b.mesh);
          this.bubbles.length = 0;

          const rx = this.bounds.w * 0.34;
          const rz = this.bounds.h * 0.33;

          // 禪意造景
          this.placeDecor('rock', -rx * 0.92, -rz * 0.72, true);
          this.placeDecor('rock', rx * 0.96, rz * 0.66, true);
          this.placeDecor('lotus', -rx * 0.62, rz * 0.56, true);
          this.placeDecor('pad', -rx * 0.32, rz * 0.72, true);
          this.placeDecor('lotus', rx * 0.64, -rz * 0.60, true);
          this.placeDecor('pad', rx * 0.34, -rz * 0.76, true);
          this.placeDecor('pad', rx * 0.78, -rz * 0.25, true);

          for (let i = 0; i < 6; i++) {
            this.placeDecor('pebble', (Math.random() - 0.5) * rx * 2.1, (Math.random() - 0.5) * rz * 2.1, true);
          }

          // 三種錦鯉各 3 尾（共 9 尾）
          const variants = ['kohaku', 'sanke', 'yamabuki'];
          for (let i = 0; i < 9; i++) {
            const x = (Math.random() - 0.5) * rx * 1.5;
            const z = (Math.random() - 0.5) * rz * 1.5;
            this.spawnFish(variants[i % 3], x, z, true);
          }

          // 1 隻參考附圖的 3D Pixar 可愛胖鯊魚
          this.spawnFish('shark', 0, -rz * 0.18, true);

          this._updateStats();
          this.showToast('歡迎來到錦鯉池 · 划水面泛起漣漪');
        }

        /* -------------------------------------------------------------------
         * UI 與觸控／滑鼠互動綁定
         * ------------------------------------------------------------------- */
        _initUI() {
          const dockBtns = document.querySelectorAll('.dock-btn');
          const subFish = document.getElementById('sub-fish');
          const subDecor = document.getElementById('sub-decor');

          const setMode = (m) => {
            this.mode = m;
            dockBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === m));
            subFish.classList.toggle('open', m === 'fish');
            subDecor.classList.toggle('open', m === 'decor');

            const tips = {
              ripple: '滑動水面泛起漣漪與魚互動',
              feed: '點擊水面撒下飼料，錦鯉會游來吃',
              fish: '選擇品種後點擊水面放魚',
              decor: '選擇造景後點擊水面擺放',
              remove: '點擊造景或魚即可移除'
            };
            this.showToast(tips[m]);
          };

          dockBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

          document.querySelectorAll('#sub-fish .sub-btn').forEach(b => {
            b.addEventListener('click', () => {
              this.selectedFish = b.dataset.fish;
              document.querySelectorAll('#sub-fish .sub-btn').forEach(x => x.classList.toggle('active', x === b));
            });
          });

          document.querySelectorAll('#sub-decor .sub-btn').forEach(b => {
            b.addEventListener('click', () => {
              this.selectedDecor = b.dataset.decor;
              document.querySelectorAll('#sub-decor .sub-btn').forEach(x => x.classList.toggle('active', x === b));
            });
          });

          const soundBtn = document.getElementById('btn-sound');
          soundBtn.addEventListener('click', () => {
            this.audio.enabled = !this.audio.enabled;
            soundBtn.textContent = this.audio.enabled ? '🔊' : '🔇';
            this.showToast(this.audio.enabled ? '已開啟水聲效果' : '已靜音');
          });

          document.getElementById('btn-reset').addEventListener('click', () => {
            this.resetPond();
            this.audio.playPlop(0.9, 0.12);
          });

          window.addEventListener('resize', () => this._handleResize());
        }

        _initInput() {
          const toWorld = (clientX, clientY) => {
            const rect = this.canvas.getBoundingClientRect();
            const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
            const ndcY = 1 - ((clientY - rect.top) / rect.height) * 2;
            return this.camera.screenToWaterPlane(ndcX, ndcY);
          };

          const handleStart = (clientX, clientY) => {
            this._pointerDown = true;
            const pt = toWorld(clientX, clientY);
            this._lastWaterPos = pt;

            if (this.mode === 'ripple') {
              const uv = this.worldToRippleUV(pt.x, pt.z);
              this.rippleSim.drop(uv.u, uv.v, 5.2, 0.95);
              this.audio.playPlop(0.95 + Math.random() * 0.35, 0.11);
              this._pokeFishNear(pt.x, pt.z);
            } else if (this.mode === 'feed') {
              this.dropFoodCluster(pt.x, pt.z);
            } else if (this.mode === 'fish') {
              this.spawnFish(this.selectedFish, pt.x, pt.z);
            } else if (this.mode === 'decor') {
              this.placeDecor(this.selectedDecor, pt.x, pt.z);
            } else if (this.mode === 'remove') {
              this.removeNearestAt(pt.x, pt.z);
            }
          };

          const handleMove = (clientX, clientY) => {
            if (!this._pointerDown) return;
            const pt = toWorld(clientX, clientY);
            if (this.mode === 'ripple' && this._lastWaterPos) {
              const dist = Math.hypot(pt.x - this._lastWaterPos.x, pt.z - this._lastWaterPos.z);
              const steps = Math.max(1, Math.min(8, Math.ceil(dist / 0.18)));
              for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const ix = this._lastWaterPos.x + (pt.x - this._lastWaterPos.x) * t;
                const iz = this._lastWaterPos.z + (pt.z - this._lastWaterPos.z) * t;
                const uv = this.worldToRippleUV(ix, iz);
                this.rippleSim.drop(uv.u, uv.v, 3.8, 0.56);
              }
              if (dist > 0.12) {
                this.audio.playSwipe();
                this._pokeFishNear(pt.x, pt.z);
                this._lastWaterPos = pt;
              }
            }
          };

          const handleEnd = () => {
            this._pointerDown = false;
            this._lastWaterPos = null;
          };

          this.canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleStart(e.clientX, e.clientY);
          });
          window.addEventListener('pointermove', (e) => handleMove(e.clientX, e.clientY));
          window.addEventListener('pointerup', handleEnd);
          window.addEventListener('pointercancel', handleEnd);
        }

        _pokeFishNear(x, z) {
          for (const k of this.kois) {
            const dx = k.x - x, dz = k.z - z;
            const d = Math.hypot(dx, dz);
            if (d < 1.8 && d > 0.01) {
              k.wanderAngle = Math.atan2(dx, dz);
              k.speed = Math.max(k.speed, 2.75);
            }
          }
        }

        /* -------------------------------------------------------------------
         * AI 更新：錦鯉（漫游 + 互相追來追去 + 搶食飼料 + 躲鯊魚）與 胖鯊魚（隨機追捕吃魚）
         * ------------------------------------------------------------------- */
        _steerAngle(cur, target, maxTurn) {
          let diff = target - cur;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          const clamped = Math.max(-maxTurn, Math.min(maxTurn, diff));
          return { angle: cur + clamped, delta: clamped };
        }

        _avoidRocksAndBounds(f, desiredX, desiredZ) {
          let ax = desiredX, az = desiredZ;
          const padX = this.bounds.w * 0.10;
          const padZ = this.bounds.h * 0.11;
          const minX = this.bounds.minX + padX, maxX = this.bounds.maxX - padX;
          const minZ = this.bounds.minZ + padZ, maxZ = this.bounds.maxZ - padZ;

          if (f.x < minX) ax += (minX - f.x) * 2.8;
          if (f.x > maxX) ax -= (f.x - maxX) * 2.8;
          if (f.z < minZ) az += (minZ - f.z) * 2.8;
          if (f.z > maxZ) az -= (f.z - maxZ) * 2.8;

          // 閃避苔石
          for (const d of this.decors) {
            if (d.type !== 'rock') continue;
            const dx = f.x - d.x, dz = f.z - d.z;
            const dist = Math.hypot(dx, dz);
            const safeR = d.radius + (f.isShark ? 0.95 : 0.65);
            if (dist < safeR && dist > 0.001) {
              const push = ((safeR - dist) / safeR) * 4.5;
              ax += (dx / dist) * push;
              az += (dz / dist) * push;
            }
          }
          return { x: ax, z: az };
        }

        _updateKois(dt) {
          for (let i = 0; i < this.kois.length; i++) {
            const k = this.kois[i];
            let targetSpeed = k.baseSpeed;
            let targetDepth = k.baseDepth;

            // 1) 檢查是否正被鯊魚追捕或靠近 -> 驚慌蛇行逃竄
            let fleeing = false;
            let sx = Math.sin(k.wanderAngle), sz = Math.cos(k.wanderAngle);

            for (const s of this.sharks) {
              const dx = k.x - s.x, dz = k.z - s.z;
              const dist = Math.hypot(dx, dz);
              const dangerR = s.prey === k ? 3.8 : 2.1;
              if (dist < dangerR && dist > 0.01) {
                fleeing = true;
                const zig = Math.sin(this.time * 9.0 + i * 2.1) * 0.55;
                const away = Math.atan2(dx, dz) + zig;
                sx = Math.sin(away) * 2.4;
                sz = Math.cos(away) * 2.4;
                targetSpeed = 2.85;
                targetDepth = -0.78;
                break;
              }
            }

            // 2) 若安全且水面有飼料 -> 游上水面張口搶食
            let nearestPellet = null;
            if (!fleeing && this.pellets.length > 0) {
              let bestD = 5.2;
              for (const p of this.pellets) {
                const d = Math.hypot(p.x - k.x, p.z - k.z);
                if (d < bestD) { bestD = d; nearestPellet = p; }
              }
              if (nearestPellet) {
                const dx = nearestPellet.x - k.x, dz = nearestPellet.z - k.z;
                const d = Math.hypot(dx, dz) || 1;
                sx = (dx / d) * 1.9;
                sz = (dz / d) * 1.9;
                targetSpeed = 2.15;
                targetDepth = -0.18;

                if (d < 0.42) {
                  const uv = this.worldToRippleUV(nearestPellet.x, nearestPellet.z);
                  this.rippleSim.drop(uv.u, uv.v, 4.2, 0.72);
                  this.audio.playGulp();
                  this._removePellet(nearestPellet);
                }
              }
            }

            // 3) 錦鯉之間隨機「追來追去」與自然漫游
            if (!fleeing && !nearestPellet) {
              k.chaseTimer -= dt;
              if (k.chaseTimer <= 0) {
                if (k.chaseTarget || this.kois.length < 2 || Math.random() < 0.45) {
                  k.chaseTarget = null;
                  k.chaseTimer = 2.5 + Math.random() * 4.0;
                } else {
                  const cand = this.kois[Math.floor(Math.random() * this.kois.length)];
                  if (cand !== k) {
                    k.chaseTarget = cand;
                    k.chaseTimer = 3.5 + Math.random() * 4.5;
                  }
                }
              }

              if (k.chaseTarget) {
                const dx = k.chaseTarget.x - k.x, dz = k.chaseTarget.z - k.z;
                const d = Math.hypot(dx, dz);
                if (d > 0.55) {
                  sx = (dx / d) * 1.6;
                  sz = (dz / d) * 1.6;
                  targetSpeed = 2.05;
                } else {
                  // 追上後角色互換或 playfully 轉彎
                  k.chaseTarget.chaseTarget = k;
                  k.chaseTarget.chaseTimer = 3.5;
                  k.chaseTarget = null;
                  k.wanderAngle += (Math.random() > 0.5 ? 1 : -1) * 1.3;
                }
              } else {
                k.wanderTimer -= dt;
                if (k.wanderTimer <= 0) {
                  k.wanderAngle += (Math.random() - 0.5) * 1.55;
                  k.wanderTimer = 1.2 + Math.random() * 2.4;
                }
                sx = Math.sin(k.wanderAngle);
                sz = Math.cos(k.wanderAngle);
              }

              // 同伴輕微防重疊
              for (let j = 0; j < this.kois.length; j++) {
                if (i === j) continue;
                const o = this.kois[j];
                const dx = k.x - o.x, dz = k.z - o.z;
                const d = Math.hypot(dx, dz);
                if (d < 0.72 && d > 0.001) {
                  sx += (dx / d) * (0.72 - d) * 2.0;
                  sz += (dz / d) * (0.72 - d) * 2.0;
                }
              }
            }

            const steered = this._avoidRocksAndBounds(k, sx, sz);
            const desiredAngle = Math.atan2(steered.x, steered.z);
            const turn = this._steerAngle(k.angle, desiredAngle, (fleeing ? 4.8 : 2.9) * dt);
            k.angle = turn.angle;
            k.turnRate += (turn.delta / Math.max(dt, 0.008) - k.turnRate) * Math.min(1, dt * 8);
            k.speed += (targetSpeed - k.speed) * Math.min(1, dt * 3.5);

            k.x += Math.sin(k.angle) * k.speed * dt;
            k.z += Math.cos(k.angle) * k.speed * dt;
            k.y += (targetDepth - k.y) * Math.min(1, dt * 2.4);

            // 硬邊界保險
            k.x = Math.max(this.bounds.minX + 0.35, Math.min(this.bounds.maxX - 0.35, k.x));
            k.z = Math.max(this.bounds.minZ + 0.35, Math.min(this.bounds.maxZ - 0.35, k.z));

            // 游動尾波偶爾輕擾水面
            if (k.y > -0.45 && Math.random() < dt * 2.4) {
              const uv = this.worldToRippleUV(k.x, k.z);
              this.rippleSim.drop(uv.u, uv.v, 2.2, 0.16);
            }

            // 更新網格與池底投影
            k.uniforms.uSwimPhase.value += dt * (4.8 + k.speed * 3.6);
            k.uniforms.uSwimAmp.value = 0.12 + k.speed * 0.036;
            k.uniforms.uTurnBend.value = Math.max(-0.85, Math.min(0.85, -k.turnRate * 0.25));
            k.uniforms.uTime.value = this.time;

            k.mesh.position.x = k.x;
            k.mesh.position.y = k.y;
            k.mesh.position.z = k.z;
            k.mesh.rotation.y = k.angle;

            k.shadow.position.x = k.x + 0.26 * (2.0 + k.y) * 0.45;
            k.shadow.position.y = -1.94;
            k.shadow.position.z = k.z + 0.22 * (2.0 + k.y) * 0.45;
            k.shadow.rotation.y = k.angle;
            k.shadow.scale.x = k.scale * 1.15;
            k.shadow.scale.z = k.scale * 2.15;
          }
        }

        _updateSharks(dt) {
          for (const s of this.sharks) {
            if (s.chompTimer > 0) {
              s.chompTimer = Math.max(0, s.chompTimer - dt * 2.8);
              s.uniforms.uChomp.value = s.chompTimer;
            } else {
              s.uniforms.uChomp.value = 0;
            }

            let targetSpeed = s.baseSpeed;
            let targetPitch = -0.10; // 微微抬吻讓可愛大眼與微笑尖牙在俯視角若隱若現
            let sx = Math.sin(s.wanderAngle), sz = Math.cos(s.wanderAngle);

            if (s.state === 'cruise') {
              s.huntCooldown -= dt;
              s.wanderTimer -= dt;
              if (s.wanderTimer <= 0) {
                s.wanderAngle += (Math.random() - 0.5) * 1.4;
                s.wanderTimer = 1.6 + Math.random() * 2.2;
              }
              sx = Math.sin(s.wanderAngle);
              sz = Math.cos(s.wanderAngle);

              // 冷卻結束，隨機鎖定池中一尾錦鯉展開追捕！
              if (s.huntCooldown <= 0 && this.kois.length > 0) {
                s.prey = this.kois[Math.floor(Math.random() * this.kois.length)];
                s.state = 'hunt';
              }
            } else if (s.state === 'hunt') {
              if (!s.prey || this.kois.indexOf(s.prey) < 0) {
                s.prey = null;
                s.state = 'cruise';
                s.huntCooldown = 4.0 + Math.random() * 3.0;
              } else {
                // 預測前置攔截目標錦鯉
                const leadX = s.prey.x + Math.sin(s.prey.angle) * s.prey.speed * 0.28;
                const leadZ = s.prey.z + Math.cos(s.prey.angle) * s.prey.speed * 0.28;
                const dx = leadX - s.x, dz = leadZ - s.z;
                const dist = Math.hypot(s.prey.x - s.x, s.prey.z - s.z);
                const dLead = Math.hypot(dx, dz) || 1;

                sx = (dx / dLead) * 2.4;
                sz = (dz / dLead) * 2.4;
                targetSpeed = 3.15;
                targetPitch = -0.22; // 追擊時微抬吻露出微笑尖牙

                // 追上並一口吃掉！
                if (dist < 0.78) {
                  const eaten = s.prey;
                  const ex = eaten.x, ey = eaten.y, ez = eaten.z;
                  this._removeFish(eaten);

                  s.chompTimer = 1.0;
                  s.prey = null;
                  s.state = 'cruise';
                  s.huntCooldown = 7.5 + Math.random() * 4.5;
                  s.wanderAngle = s.angle + (Math.random() > 0.5 ? 0.6 : -0.6);

                  const uv = this.worldToRippleUV(ex, ez);
                  this.rippleSim.drop(uv.u, uv.v, 8.5, 1.45);
                  this._spawnBubbles(ex, ey, ez, 14);
                  this.audio.playChomp();

                  if (this.kois.length === 0) {
                    this.showToast('胖鯊魚把錦鯉吃光囉！點「放魚」補充');
                  } else {
                    this.showToast('胖鯊魚一口吃掉了一尾錦鯉！');
                  }
                }
              }
            }

            const steered = this._avoidRocksAndBounds(s, sx, sz);
            const desiredAngle = Math.atan2(steered.x, steered.z);
            const maxTurn = (s.state === 'hunt' ? 4.2 : 2.3) * dt;
            const turn = this._steerAngle(s.angle, desiredAngle, maxTurn);
            s.angle = turn.angle;
            s.turnRate += (turn.delta / Math.max(dt, 0.008) - s.turnRate) * Math.min(1, dt * 7);
            s.speed += (targetSpeed - s.speed) * Math.min(1, dt * 3.8);

            s.x += Math.sin(s.angle) * s.speed * dt;
            s.z += Math.cos(s.angle) * s.speed * dt;
            s.x = Math.max(this.bounds.minX + 0.5, Math.min(this.bounds.maxX - 0.5, s.x));
            s.z = Math.max(this.bounds.minZ + 0.5, Math.min(this.bounds.maxZ - 0.5, s.z));

            // 可愛 Pixar 俏皮側搖（俯視時能交替清楚看見側臉黑豆大眼、白肚與鰓裂）
            const targetRoll = Math.sin(this.time * 2.2 + s.scale * 5.0) * 0.24 - s.turnRate * 0.14;
            s.roll += (targetRoll - s.roll) * Math.min(1, dt * 5);
            s.pitch += (targetPitch - s.pitch) * Math.min(1, dt * 4);

            // 鯊魚背鰭劃過水面產生細膩尾波
            if (Math.random() < dt * (s.state === 'hunt' ? 8.0 : 3.5)) {
              const uv = this.worldToRippleUV(s.x - Math.sin(s.angle) * 0.35, s.z - Math.cos(s.angle) * 0.35);
              this.rippleSim.drop(uv.u, uv.v, 2.8, s.state === 'hunt' ? 0.36 : 0.20);
            }

            s.uniforms.uSwimPhase.value += dt * (3.6 + s.speed * 2.6);
            s.uniforms.uSwimAmp.value = 0.10 + s.speed * 0.028;
            s.uniforms.uTurnBend.value = Math.max(-0.65, Math.min(0.65, -s.turnRate * 0.22));
            s.uniforms.uTime.value = this.time;

            s.mesh.position.x = s.x;
            s.mesh.position.y = s.baseDepth + Math.sin(this.time * 2.0) * 0.04;
            s.mesh.position.z = s.z;
            s.mesh.rotation.y = s.angle;
            s.mesh.rotation.x = s.pitch;
            s.mesh.rotation.z = s.roll;

            s.shadow.position.x = s.x + 0.32;
            s.shadow.position.y = -1.94;
            s.shadow.position.z = s.z + 0.28;
            s.shadow.rotation.y = s.angle;
            s.shadow.scale.x = s.scale * 1.55;
            s.shadow.scale.z = s.scale * 2.35;
          }
        }

        _updateWorldObjects(dt) {
          // 漂浮飼料隨水波晃動
          for (let i = this.pellets.length - 1; i >= 0; i--) {
            const p = this.pellets[i];
            p.life -= dt;
            if (p.life <= 0) { this._removePellet(p); continue; }
            const uv = this.worldToRippleUV(p.x, p.z);
            const r = this.rippleSim.sample(uv.u, uv.v);
            p.vx = (p.vx - r.dx * 0.8 * dt) * 0.96;
            p.vz = (p.vz - r.dy * 0.8 * dt) * 0.96;
            p.x += p.vx * dt;
            p.z += p.vz * dt;
            p.mesh.position.x = p.x;
            p.mesh.position.y = 0.03 + r.h * 0.14;
            p.mesh.position.z = p.z;
          }

          // 睡蓮與荷葉隨水波起伏搖擺
          for (const d of this.decors) {
            if (!d.floating) continue;
            const uv = this.worldToRippleUV(d.x, d.z);
            const r = this.rippleSim.sample(uv.u, uv.v);
            d.group.position.y = 0.04 + r.h * 0.16 + Math.sin(this.time * 1.4 + d.phase) * 0.012;
            d.group.rotation.x = Math.max(-0.22, Math.min(0.22, r.dy * 0.45));
            d.group.rotation.z = Math.max(-0.22, Math.min(0.22, -r.dx * 0.45));
          }

          // 上浮氣泡粒子
          for (let i = this.bubbles.length - 1; i >= 0; i--) {
            const b = this.bubbles[i];
            b.life -= dt;
            if (b.life <= 0 || b.y > -0.02) {
              this.underwaterScene.remove(b.mesh);
              this.bubbles.splice(i, 1);
              continue;
            }
            b.x += b.vx * dt + Math.sin(this.time * 8 + i) * 0.008;
            b.y += b.vy * dt;
            b.z += b.vz * dt;
            b.mesh.position.x = b.x;
            b.mesh.position.y = b.y;
            b.mesh.position.z = b.z;
            b.uAlpha.value = Math.max(0, b.life / b.maxLife);
          }
        }

        step(dt) {
          this.time += dt;
          this.bedUniforms.uTime.value = this.time;
          this.waterUniforms.uTime.value = this.time;

          // 偶爾自然微風落水點，讓池面永保生機
          if (Math.random() < dt * 0.45) {
            this.rippleSim.drop(0.15 + Math.random() * 0.7, 0.15 + Math.random() * 0.7, 3.0, 0.24);
          }

          this.rippleSim.step();
          this.rippleSim.updateTexture();

          this._updateKois(dt);
          this._updateSharks(dt);
          this._updateWorldObjects(dt);

          // Pass 1：渲染水下世界（池底、卵石、陰影、錦鯉、3D Pixar 胖鯊魚、氣泡）到 FBO
          this.renderer.render(this.underwaterScene, this.camera, this.underwaterRT, {
            clearColor: true,
            clearDepth: true,
            bgColor: [0.04, 0.15, 0.17, 1.0]
          });

          // Pass 2：全螢幕水波折射合成（將 FBO 依即時水波扭曲加上陽光反光）
          this.renderer.render(this.waterPassScene, null, null, {
            clearColor: true,
            clearDepth: true
          });

          // Pass 3：於水面上方疊加 3D 浮水物件（睡蓮、荷葉、苔石、飼料）
          this.renderer.render(this.aboveWaterScene, this.camera, null, {
            clearColor: false,
            clearDepth: true
          });
        }

        start() {
          let last = performance.now();
          const loop = (now) => {
            const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
            last = now;
            this.step(dt);
            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
        }
      }

      window.onload = function () {
        const canvas = document.getElementById('pond-canvas');
        try {
          const app = new KoiPondApp(canvas);
          app.start();
        } catch (err) {
          console.error('KoiPond init error:', err);
          document.getElementById('fallback-msg').style.display = 'flex';
        }
      };
    })();
  </script>
</body>
</html>
