        .level-btn {
            color: white; padding: 15px;

            cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 0 rgba(0,0,0,0.2), 0 15px 20px rgba(0,0,0,0.2); text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 140px;
        }
        .level-btn:hover { transform: translateY(-5px); filter: brightness(1.1); }
        .level-btn:active { transform: translateY(8px); box-shadow: 0 0px 0 rgba(0,0,0,0.2); }

        .audio-btn, .audio-btn-small { background-color: #2196F3; color: white; border: 3px solid #FFF; border-radius: 50%; width: 50px; height: 50px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 0 #1976D2; flex-shrink: 0; }
        .audio-btn-small { width: 45px; height: 45px; font-size: 20px; background-color: #00BCD4; box-shadow: 0 4px 0 #0097A7;}

        .wrong-ans { background-color: #FFCDD2 !important; border-color: #F44336 !important; opacity: 0.7; }

        /* 導航按鈕區 */
        .nav-container { display: flex; justify-content: center; gap: 20px; margin-top: 35px; border-top: 3px dashed #EEE; padding-top: 25px;}
        .nav-btn { padding: 15px 25px; font-size: 18px; font-weight: bold; border: 3px solid #FFF; border-radius: 15px; cursor: pointer; color: white; text-shadow: 1px 1px 0px rgba(0,0,0,0.2);}
        .btn-prev { background-color: #9E9E9E; box-shadow: 0 6px 0 #757575; }
        .btn-home { background-color: #FF9800; box-shadow: 0 6px 0 #F57C00; }
        .btn-next { background-color: #4CAF50; box-shadow: 0 6px 0 #388E3C; }
        .btn-skip { background-color: #F44336; box-shadow: 0 6px 0 #D32F2F; animation: pulse 1.5s infinite;}
        .nav-btn:active { transform: translateY(6px); box-shadow: none; }
        .nav-btn:disabled { background-color: #CCC; box-shadow: none; cursor: not-allowed; transform: none; border-color: #CCC;}
        
        .hint-box { background-color: #FFF9C4; padding: 20px; border-radius: 20px; border: 4px dashed #FBC02D; margin-top: 25px; display: flex; align-items: flex-start; gap: 15px; text-align: left; font-size: 20px; color: #D84315; animation: fadeIn 0.5s; font-weight: bold;}

        /* 總結與重做網格 */
        .summary-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 25px; }
        .summary-item { padding: 15px 5px; font-size: 18px; font-weight: bold; border-radius: 15px; border: 3px solid #FFF; color: white; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2);}
        .summary-item.right { background-color: #4CAF50; cursor: default; }
        .summary-item.wrong { background-color: #F44336; animation: pulse 2s infinite; }
        .summary-item.wrong:active { transform: translateY(4px); box-shadow: none;}
        
        /* 動畫 */

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .hidden { display: none !important; }

    // 遊戲核心邏輯引擎

    let currentLevelData = null;
    let quizQueue = [];
    let userAnswers = []; 
    let currentQuestionIndex = 0;
    let isRetryMode = false; 
    let synth = window.speechSynthesis;
    let userProgress = JSON.parse(localStorage.getItem('teachercat_progress')) || {};

    function getThemeStyling(title, index) {
        let emoji = "🌟";
        if (title.includes("乘法")) emoji = "✖️";
        else if (title.includes("時間") || title.includes("報時") || title.includes("分鐘") || title.includes("記時")) emoji = "⏰";
        else if (title.includes("日數") || title.includes("日期")) emoji = "📅";
        else if (title.includes("立體圖形")) emoji = "🧊";
        
        const colorClass = "color-" + ((index % 4) + 1); 
        return { emoji, colorClass };
    }

    // 重新繪製首頁，並把星星記錄直接放入關卡按鈕中
    function initHome() {
        const levelsContainer = document.getElementById('levels-container');
        levelsContainer.innerHTML = '';

        gameData.forEach((level, index) => {
            const style = getThemeStyling(level.title, index);
            const parts = level.title.split("：");
            const levelNum = parts ? parts : "";
            const levelTheme = parts ? parts : level.title;

            // 抓取進度與星星狀態
            let score = userProgress[level.id] !== undefined ? userProgress[level.id] : 0;
            let starHTML = '⚪'; 
            if (score >= 20) { starHTML = '🌟'; } else if (score >= 10) { starHTML = '⭐'; }

            const btn = document.createElement('button');
            btn.className = `level-btn ${style.colorClass}`;
            btn.innerHTML = `
                <div style="width: 100%;">
                    <div style="font-size:16px; opacity:0.9; margin-bottom:5px;">${levelNum}</div>
                    <div style="font-size:24px; font-weight:900;">${style.emoji} ${levelTheme}</div>
                </div>
                <!-- 嵌入到按鈕底部的進度條 -->
                <div class="btn-progress-bar">
                    <span style="font-size: 16px; font-weight: bold; text-shadow: none;">最高分: ${score}/20</span>
                    <span style="font-size: 22px; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.2));">${starHTML}</span>
                </div>
            `;
            btn.onclick = () => showIntro(level.id);
            levelsContainer.appendChild(btn);
        });
    }

    initHome();

    function clearRecord() {
        if(confirm("確定要清除所有學習記錄和星星嗎？這無法復原喔！")) {
            userProgress = {};
            localStorage.removeItem('teachercat_progress');
            initHome(); alert("記錄已成功清除！");
        }
    }

    function showScreen(screenId) {
        ['home-screen', 'intro-screen', 'quiz-screen', 'result-screen'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(screenId).classList.remove('hidden');
        synth.cancel();
        document.getElementById('hint-box').classList.add('hidden');
    }

    function showHome() {
        if (document.getElementById('quiz-screen').classList.contains('hidden') === false) {
            if(!confirm("確定要回到主頁嗎？目前的進度將不會儲存喔！")) return;
        }
        initHome(); 
        showScreen('home-screen');
    }

    function showIntro(levelId) {
        currentLevelData = gameData.find(l => l.id === levelId);
        document.getElementById('intro-title').innerText = currentLevelData.title;
        document.getElementById('intro-lesson').innerHTML = currentLevelData.lesson;
        showScreen('intro-screen');
    }

        let easyQ = [...currentLevelData.easy].sort(() => 0.5 - Math.random()).slice(0, 10);

        quizQueue = [...easyQ, ...hardQ];
        userAnswers = new Array(quizQueue.length).fill(null);
        currentQuestionIndex = 0;
        isRetryMode = false;
        
        document.getElementById('level-title-display').innerText = currentLevelData.title;
        showScreen('quiz-screen');
        loadQuestion();
    }

    function stripHtml(html) { let tmp = document.createElement("DIV"); tmp.innerHTML = html; return tmp.textContent || tmp.innerText || ""; }
    
    function playAudio(elementIdOrText) {
        synth.cancel();
        let text = document.getElementById(elementIdOrText) ? document.getElementById(elementIdOrText).innerText : elementIdOrText;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK'; utterance.rate = 0.9; synth.speak(utterance);
    }

    function playWinEffects() {
        const container = document.getElementById('game-container');
        container.classList.add('shake-effect');
        setTimeout(() => container.classList.remove('shake-effect'), 400);

        const emoji = document.createElement('div');
        emoji.innerText = "🎉✨ 答對了！ ✨🎉";
        emoji.className = "popup-exaggerated"; document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);

        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gainNode = ctx.createGain();
            osc.type = 'triangle'; osc.connect(gainNode); gainNode.connect(ctx.destination);
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.4, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.start(); osc.stop(ctx.currentTime + 0.5);
        } catch(e) {}
    }

    function loadQuestion() {
        if (currentQuestionIndex >= quizQueue.length && !isRetryMode) { endQuiz(); return; }
        const qData = quizQueue[currentQuestionIndex];
        
        document.getElementById('prev-btn').disabled = (currentQuestionIndex === 0);
        document.getElementById('hint-box').classList.add('hidden');
        document.getElementById('skip-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');

        if (isRetryMode) {
            document.getElementById('question-counter').innerText = `🔥 錯誤重做：第 ${currentQuestionIndex + 1} 題`;
            document.getElementById('prev-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('hint-box').classList.remove('hidden');
            document.getElementById('hint-text').innerText = "提示：\n" + stripHtml(currentLevelData.lesson);
        } else {
            document.getElementById('question-counter').innerText = `第 ${currentQuestionIndex + 1} 題 / 共 ${quizQueue.length} 題`;
            document.getElementById('prev-btn').classList.remove('hidden');
            
            // 已經解除必須作答才能跳轉的限制，讓按鈕隨時保持可按狀態
            document.getElementById('next-btn').disabled = false;
            
            if(userAnswers[currentQuestionIndex] === false) {
                document.getElementById('skip-btn').classList.remove('hidden');
                document.getElementById('next-btn').classList.add('hidden');
            }
        }

        document.getElementById('question-text').innerText = qData.q;
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        qData.options.forEach((opt, index) => {
            const wrapper = document.createElement('div'); wrapper.className = 'option-container';
            const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt;
            
            if (!isRetryMode && userAnswers[currentQuestionIndex] === true) {
                btn.disabled = true;
                if (index === qData.ans) wrapper.classList.add('correct-ans');
            } else {
                btn.onclick = () => checkAnswer(index, qData.ans, btn, wrapper);
            }

            const audioBtn = document.createElement('button'); audioBtn.className = 'audio-btn-small'; audioBtn.innerText = '🔊';
            audioBtn.onclick = (e) => { e.stopPropagation(); playAudio(opt); };
            wrapper.appendChild(btn); wrapper.appendChild(audioBtn); optionsContainer.appendChild(wrapper);
        });
    }

    function saveScoreDynamically() {
        let score = userAnswers.filter(a => a === true).length;
        let oldScore = userProgress[currentLevelData.id] || 0;
        if (score > oldScore) {
            userProgress[currentLevelData.id] = score;
            localStorage.setItem('teachercat_progress', JSON.stringify(userProgress));
        }
    }

    function checkAnswer(selectedIndex, correctIndex, btnElement, wrapperElement) {
        const allOptionBtns = document.querySelectorAll('.option-btn');
        
        if (selectedIndex === correctIndex) {
            wrapperElement.classList.add('correct-ans');
            playWinEffects();
            document.getElementById('hint-box').classList.add('hidden');

            if (isRetryMode) {
                userAnswers[currentQuestionIndex] = true; 
                saveScoreDynamically(); 
                setTimeout(() => { alert("太棒了！你已經學會這題了！分數提升啦！"); endQuiz(); }, 1200);
            } else {
                allOptionBtns.forEach(b => b.disabled = true);
                userAnswers[currentQuestionIndex] = true; 
                
                document.getElementById('next-btn').disabled = false;
                document.getElementById('skip-btn').classList.add('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
                setTimeout(() => nextQuestion(), 1200);
            }
        } else {
            wrapperElement.classList.add('wrong-ans');
            document.getElementById('hint-box').classList.remove('hidden');
            document.getElementById('hint-text').innerText = "哎呀，答案不對喔！看看提示：\n" + stripHtml(currentLevelData.lesson);

            if (isRetryMode) {
                btnElement.disabled = true; 
            } else {
                btnElement.disabled = true; 
                if (userAnswers[currentQuestionIndex] === null) {
                    userAnswers[currentQuestionIndex] = false; 
                }
                document.getElementById('skip-btn').classList.remove('hidden');
                document.getElementById('next-btn').classList.add('hidden');
            }
        }
    }

    function prevQuestion() { if (currentQuestionIndex > 0) { currentQuestionIndex--; loadQuestion(); } }
    function nextQuestion() { currentQuestionIndex++; loadQuestion(); }

    function endQuiz() {
        isRetryMode = false;
        showScreen('result-screen');
        
        saveScoreDynamically(); 
        
        // 遇到跳過的題目(null)時，結算時將不計入得分，只計算 userAnswers 內為 true 的數量
        let score = userAnswers.filter(a => a === true).length;
        document.getElementById('score-display').innerText = `本次得分：${score} / ${quizQueue.length}`;
        
        let starAward = '';
        if (score >= 20) starAward = '🌟 滿分太棒了！獲得大星星！ 🌟';
        else if (score >= 10) starAward = '⭐ 做得好！獲得小星星！ ⭐';
        else starAward = '💪 加油！點擊紅色題目再試一次吧！';
        document.getElementById('star-award-display').innerText = starAward;
        
        const grid = document.getElementById('summary-grid');
        grid.innerHTML = '';
        userAnswers.forEach((isCorrect, index) => {
            const btn = document.createElement('button');
            // 跳過的題目(null)與錯題(false)都會顯示成紅色 ❌，讓小朋友有機會點擊重做
            btn.className = 'summary-item ' + (isCorrect ? 'right' : 'wrong');
            btn.innerText = `第 ${index + 1} 題\n${isCorrect ? '✅' : '❌'}`;
            if (!isCorrect) { btn.title = "點擊重新挑戰這題！"; btn.onclick = () => startRetry(index); }
            grid.appendChild(btn);
        });
    }

    function startRetry(index) {
        isRetryMode = true; currentQuestionIndex = index;
        showScreen('quiz-screen'); loadQuestion();
    }
</script>
