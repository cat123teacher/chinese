        window.speechSynthesis.speak(utterance);

            let row = document.createElement('div');
            row.style.display = 'flex'; row.style.alignItems = 'center'; row.style.gap = '10px'; row.style.marginBottom = '12px';
            
            let btn = document.createElement('button');
            btn.className = 'audio-btn'; btn.innerText = '🔊';
            btn.onclick = () => speakText(part);
            
            let txt = document.createElement('div');
            txt.innerHTML = part;

            container.appendChild(row);
        });
    }

    function clearProgress() {
        if(confirm("確定要清除所有關卡的星星和成績記錄嗎？")) {
            localStorage.removeItem('teacherCatHighScores'); 
            renderLevelButtons(); 
            alert("成績已全部清除！重新開始挑戰吧！");
        }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function selectLevel(level) {
        currentLevel = level;
        if(!levelData[level] || !levelData[level].easy) { alert("題庫尚未載入！老師稍後會補上喔！"); return; }
        document.getElementById('intro-title').innerText = levelData[level].title + " - 課前預習";
        renderIntroWithAudio('intro-text-container', levelData[level].intro);
        showScreen('intro-screen');
    }

    function startQuiz() {
        const easyPool = levelData[currentLevel].easy || [];
        const hardPool = levelData[currentLevel].hard || [];
        
        if(easyPool.length === 0 || hardPool.length === 0) {
            alert("這關的題目還沒準備好喔，請先玩其他關卡！");
            return;
        }

        gameQuestions = shuffleArray(easyPool).slice(0, 10).concat(shuffleArray(hardPool).slice(0, 10));
        
        userAnswers = new Array(gameQuestions.length).fill(null);
        currentSessionScore = 0;
        currentQuestionIndex = 0;
        
        showScreen('quiz-screen');
        renderQuestion();
    }

    function renderQuestion() {
        const qData = gameQuestions[currentQuestionIndex];
        document.getElementById('quiz-progress').innerText = `第 ${currentQuestionIndex + 1} 題 / 共 ${gameQuestions.length} 題`;
        document.getElementById('question-text').innerText = qData.q;
        
        document.getElementById('hint-box').style.display = 'none';
        
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        
        qData.options.forEach((opt, index) => {
            let row = document.createElement('div'); row.className = 'option-row';
            
            let audioBtn = document.createElement('button');
            audioBtn.className = 'audio-btn'; audioBtn.innerText = '🔊';
            audioBtn.onclick = (e) => { e.stopPropagation(); speakText(opt); };
            
            let btn = document.createElement('button');
            btn.className = 'option-btn'; btn.innerText = opt;
            
            if (userAnswers[currentQuestionIndex] === "correct" || userAnswers[currentQuestionIndex] === "skipped") {
                btn.disabled = true;
                if (index === qData.ans) btn.style.backgroundColor = '#4caf50'; 
            } else {
                btn.onclick = () => checkAnswer(index, btn);
            }
            
            row.appendChild(audioBtn); row.appendChild(btn);
            optsContainer.appendChild(row);
        });
    }

    function checkAnswer(selectedIndex, btnElement) {
        const qData = gameQuestions[currentQuestionIndex];
        
        if (selectedIndex === qData.ans) {
            userAnswers[currentQuestionIndex] = "correct";
            btnElement.style.backgroundColor = '#4caf50';
            
            const buttons = document.querySelectorAll('#options-container .option-btn');
            buttons.forEach(btn => btn.disabled = true);

            triggerExaggeratedEffect();
            
            // 答對後自動跳轉到下一題
            setTimeout(() => { autoNextQuestion(); }, 1000);
        } else {
            btnElement.style.backgroundColor = '#f44336';
            btnElement.disabled = true; 
            
            document.querySelector('.container').style.animation = "shake 0.5s";
            setTimeout(() => document.querySelector('.container').style.animation = "", 500);
            
            speakText("哎呀，不對喔！看看提示再試一次吧！");
            
            renderIntroWithAudio('hint-text-container', levelData[currentLevel].intro);
            document.getElementById('hint-box').style.display = 'block';
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
        } else {
            speakText("這已經是第一題囉！");
        }
    }

    function nextQuestion() {
        if (userAnswers[currentQuestionIndex] === null) {
            userAnswers[currentQuestionIndex] = "skipped";
        }
        autoNextQuestion();
    }
    
    function autoNextQuestion() {
        if (currentQuestionIndex < gameQuestions.length - 1) { 
            currentQuestionIndex++; 
            renderQuestion(); 
        } else { 
            showResult(); 
        }
    }

    function triggerExaggeratedEffect() {
        speakText("哇！你太棒了！答對啦！");
        const effect = document.getElementById('correct-effect');
        effect.style.display = 'flex';
        setTimeout(() => { effect.style.display = 'none'; }, 2000);
    }

    function updateScoreDisplay() {
        document.getElementById('final-score').innerText = `最終得分: ${currentSessionScore} / ${gameQuestions.length}`;
        
        let highScores = JSON.parse(localStorage.getItem('teacherCatHighScores')) || {};
        let oldScore = highScores[currentLevel] || 0;
        
        if (currentSessionScore > oldScore) {
            highScores[currentLevel] = currentSessionScore;
            localStorage.setItem('teacherCatHighScores', JSON.stringify(highScores));
            if(currentSessionScore === 20) speakText("滿分！你太厲害了，打破了最高分記錄！");
            else speakText("恭喜你！創造了新的高分記錄！");
        }
        renderLevelButtons();
    }

    function showResult() {
        currentSessionScore = 0;
        const summaryContainer = document.getElementById('summary-container');
        summaryContainer.innerHTML = '';

        gameQuestions.forEach((q, idx) => {
            const isCorrect = (userAnswers[idx] === "correct");
            if(isCorrect) currentSessionScore++;
            
            let item = document.createElement('div');
            item.className = 'summary-item';
            let qText = `<span>${idx + 1}. ${q.q} ${isCorrect ? '✅' : '❌'}</span>`;
            
            if (!isCorrect) {
                qText += `<button class="retry-btn" onclick="openRetryModal(${idx})">點擊重做</button>`;
            }
            item.innerHTML = qText;
            summaryContainer.appendChild(item);
        });

        updateScoreDisplay();
        showScreen('result-screen');
    }

    let retryIndex = -1;
    function openRetryModal(idx) {
        retryIndex = idx;
        const qData = gameQuestions[idx];
        document.getElementById('retry-modal').style.display = 'block';
        document.getElementById('retry-question-text').innerText = qData.q;
        document.getElementById('retry-q-audio').onclick = () => speakText(qData.q);
        
        renderIntroWithAudio('retry-hint-text-container', levelData[currentLevel].intro);
        
        const optsContainer = document.getElementById('retry-options-container');
        optsContainer.innerHTML = '';
        
        qData.options.forEach((opt, index) => {
            let row = document.createElement('div'); row.className = 'option-row';
            
            let audioBtn = document.createElement('button');
            audioBtn.className = 'audio-btn'; audioBtn.innerText = '🔊';
            audioBtn.onclick = (e) => { e.stopPropagation(); speakText(opt); };
            
            let btn = document.createElement('button');
            btn.className = 'option-btn'; btn.innerText = opt;
            btn.onclick = () => checkRetryAnswer(index, btn);
            
            row.appendChild(audioBtn); row.appendChild(btn);
            optsContainer.appendChild(row);
        });
    }

    function checkRetryAnswer(selectedIndex, btnElement) {
        const qData = gameQuestions[retryIndex];
        if (selectedIndex === qData.ans) {
            btnElement.style.backgroundColor = '#4caf50';
            triggerExaggeratedEffect();
            
            currentSessionScore++;
            updateScoreDisplay(); 
            
            setTimeout(() => {
                closeModal('retry-modal');
                document.getElementsByClassName('summary-item')[retryIndex].innerHTML = `<span>${retryIndex + 1}. ${qData.q} 🔄 (已補回分數!)</span>`;
            }, 2000);
        } else {
            btnElement.style.backgroundColor = '#f44336';
            speakText("還是不對喔，仔細聽聽提示！");
            document.getElementById('retry-modal').style.animation = "shake 0.5s";
            setTimeout(() => document.getElementById('retry-modal').style.animation = "", 500);
        }
    }
</script>

</body>
</html>
