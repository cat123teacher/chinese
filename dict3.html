<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1B默書三(趣味默書)練習</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F7FFF7;
            --text: #2D3047;
        }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang TC', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            display: none;
        }
        .active {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1, h2 {
            text-align: center;
            color: var(--primary);
            text-shadow: 2px 2px 0px var(--accent);
        }
        .timer {
            font-size: 1.5em;
            font-weight: bold;
            color: #FF9F1C;
            margin-bottom: 10px;
            background: white;
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid #FF9F1C;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            box-shadow: 0 6px 0 #D93838;
            transition: all 0.1s;
            width: 80%;
            max-width: 300px;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }
        .btn-secondary {
            background-color: var(--secondary);
            box-shadow: 0 6px 0 #2B938B;
        }
        .btn-secondary:active {
            box-shadow: none;
        }
        .question-box {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5em;
            border: 4px solid var(--secondary);
        }
        .answer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }
        .option-btn {
            background: white;
            color: var(--text);
            border: 3px solid var(--accent);
            border-radius: 15px;
            padding: 20px 10px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--accent);
            transition: all 0.1s;
        }
        .option-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        .writing-paper {
            background: white;
            width: 100%;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ccc;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2em;
            letter-spacing: 5px;
            min-height: 50px;
            background-image: linear-gradient(#eee 1px, transparent 1px), linear-gradient(90deg, #eee 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center top;
        }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: auto;
        }
        .nav-btn {
            background: #eee;
            border: 2px solid #ccc;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
        }
        .leaderboard {
            background: white;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: 20px;
            border: 3px solid #FFD166;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 1.2em;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #06D6A0;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(6, 214, 160, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(6, 214, 160, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 214, 160, 0); }
        }
        input[type="text"] {
            padding: 10px;
            font-size: 1.2em;
            border-radius: 10px;
            border: 2px solid var(--secondary);
            width: 80%;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 你的 Firebase 設定[cite: 2]
    const firebaseConfig = {
      apiKey: "AIzaSyBdzlMQ57R0M-JYUlhA3hsSPP5k_-Ictq4",
      authDomain: "hkbuas-1b-games.firebaseapp.com",
      projectId: "hkbuas-1b-games",
      storageBucket: "hkbuas-1b-games.firebasestorage.app",
      messagingSenderId: "667373437790",
      appId: "1:667373437790:web:8117960182c15969a585cf"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 全局變數
    window.db = db;
    window.collection = collection;
    window.addDoc = addDoc;
    window.query = query;
    window.orderBy = orderBy;
    window.getDocs = getDocs;
    window.limit = limit;

    // 頁面載入時讀取排行榜
    loadLeaderboard();
</script>

<div id="home" class="container active">
    <h1>📝 1B默書三(趣味默書)練習</h1>
    <button class="btn" onclick="startGame()">🚀 開始默書挑戰！(12題)</button>
    
    <div class="leaderboard">
        <h2>🏆 1B 雲端即時龍虎榜</h2>
        <div style="text-align: center; margin-bottom: 10px; font-size: 0.9em; color: gray;">
            <span class="status-dot"></span>雲端即時同步中
        </div>
        <div id="leaderboard-list">
            載入中...
        </div>
    </div>
</div>

<div id="game" class="container">
    <div class="timer" id="timerDisplay">⏱️ 00:00</div>
    <div class="question-box" id="questionBox">載入中...</div>
    <div class="writing-paper" id="writingPaper"></div>
    <div class="answer-grid" id="answerGrid"></div>
    
    <div class="nav-bar">
        <button class="nav-btn" onclick="prevQuestion()" id="prevBtn" style="visibility: hidden;">⬅️ 上一頁</button>
        <button class="nav-btn" onclick="goHome()">🏠 回主頁</button>
        <button class="nav-btn" onclick="nextQuestion()" id="nextBtn" style="visibility: hidden;">下一頁 ➡️</button>
    </div>
</div>

<div id="result" class="container">
    <h1>🎉 挑戰完成！</h1>
    <div class="question-box">
        <p>答對題數：<span id="scoreText"></span> / 12</p>
        <p>所需時間：<span id="finalTimeText"></span></p>
    </div>
    
    <div id="submitRecordDiv">
        <h3>📝 登錄龍虎榜</h3>
        <input type="text" id="playerName" placeholder="請輸入你的名字 (例如: 林煒晴)" maxlength="10">
        <button class="btn btn-secondary" onclick="submitScore()">🚀 提交成績</button>
    </div>

    <button class="btn" onclick="startGame()">🔄 再玩一次</button>
    <button class="btn btn-secondary" onclick="goHome()">🏠 回主頁</button>
</div>

<script>
    // 題庫資料 (12 個形容詞 x 10 個例子)
    const dictationData = {
        "香甜": ["的蘋果", "的芒果", "的草莓", "的果汁", "的西瓜", "的蜜糖", "的雪糕", "的蛋糕", "的菠蘿", "的水蜜桃"],
        "尖尖": ["的鉛筆", "的牙齒", "的指甲", "的刀子", "的樹枝", "的針", "的屋頂", "的山峰", "的剪刀", "的角"],
        "閃亮": ["的星星", "的鑽石", "的眼睛", "的燈光", "的寶石", "的皇冠", "的鏡子", "的戒指", "的項鍊", "的陽光"],
        "高高": ["的大廈", "的山", "的樹木", "的長頸鹿", "的塔", "的圍牆", "的雲", "的梯子", "的摩天輪", "的橋"],
        "潔白": ["的牙齒", "的雪", "的雲", "的紙", "的羽毛", "的天鵝", "的牆壁", "的裙子", "的襯衫", "的花朵"],
        "彎彎": ["的月亮", "的小河", "的香蕉", "的小路", "的眉毛", "的橋", "的彩虹", "的梳子", "的微笑", "的弓"],
        "明亮": ["的教室", "的眼睛", "的房間", "的月光", "的燈泡", "的星空", "的早上", "的窗戶", "的火光", "的太陽"],
        "美麗": ["的花朵", "的公主", "的風景", "的蝴蝶", "的衣服", "的彩虹", "的天空", "的圖畫", "的故事", "的香港"],
        "好看": ["的圖書", "的電影", "的電視", "的表演", "的衣服", "的裙子", "的鞋子", "的卡通", "的漫畫", "的顏色"],
        "圓圓": ["的皮球", "的西瓜", "的臉蛋", "的月亮", "的太陽", "的車輪", "的眼睛", "的餅乾", "的雞蛋", "的硬幣"],
        "甜甜": ["的糖果", "的笑容", "的巧克力", "的草莓", "的果汁", "的雪糕", "的蛋糕", "的夢", "的聲音", "的蜜糖"],
        "香香": ["的花朵", "的飯菜", "的麵包", "的香水", "的洗頭水", "的番皂", "的餅乾", "的烤肉", "的茶", "的草地"]
    };

    const adjectives = Object.keys(dictationData);
    let currentQuestions = [];
    let currentQIndex = 0;
    let userAnswers = [];
    let timerInterval;
    let startTime;
    let totalSeconds = 0;

    // 語音功能 (普通話)
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN'; // 設定為普通話
            window.speechSynthesis.speak(utterance);
        }
    }

    function generateQuestions() {
        let shuffledAdjs = [...adjectives].sort(() => 0.5 - Math.random());
        currentQuestions = shuffledAdjs.map(adj => {
            let noun = dictationData[adj][Math.floor(Math.random() * dictationData[adj].length)];
            
            // 產生干擾選項
            let options = [adj];
            let otherAdjs = adjectives.filter(a => a !== adj).sort(() => 0.5 - Math.random());
            options.push(otherAdjs[0], otherAdjs[1], otherAdjs[2]);
            options.sort(() => 0.5 - Math.random());

            return { adj, noun, options, answer: adj + noun, qText: "＿＿" + noun };
        });
    }

    function showPage(pageId) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function goHome() {
        clearInterval(timerInterval);
        showPage('home');
        loadLeaderboard();
    }

    function startTimer() {
        startTime = Date.now();
        timerInterval = setInterval(() => {
            totalSeconds = Math.floor((Date.now() - startTime) / 1000);
            let m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            let s = String(totalSeconds % 60).padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `⏱️ ${m}:${s}`;
        }, 1000);
    }

    function formatTime(seconds) {
        let m = String(Math.floor(seconds / 60)).padStart(2, '0');
        let s = String(seconds % 60).padStart(2, '0');
        return `${m}:${s}`;
    }

    function startGame() {
        generateQuestions();
        currentQIndex = 0;
        userAnswers = new Array(12).fill(null);
        totalSeconds = 0;
        document.getElementById('submitRecordDiv').style.display = 'block';
        document.getElementById('playerName').value = '';
        startTimer();
        renderQuestion();
        showPage('game');
    }

    function renderQuestion() {
        let q = currentQuestions[currentQIndex];
        document.getElementById('questionBox').innerText = `第 ${currentQIndex + 1} 題：${q.qText}`;
        speak(q.qText.replace("＿＿", "甚麼"));
        
        let paper = document.getElementById('writingPaper');
        if (userAnswers[currentQIndex]) {
            paper.innerText = userAnswers[currentQIndex] + q.noun;
            paper.style.color = 'var(--text)';
        } else {
            paper.innerText = "＿＿" + q.noun;
            paper.style.color = '#ccc';
        }

        let grid = document.getElementById('answerGrid');
        grid.innerHTML = '';
        q.options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            // 標示已選答案
            if (userAnswers[currentQIndex] === opt) {
                btn.style.backgroundColor = '#FFE66D';
                btn.style.borderColor = '#FF9F1C';
            }
            btn.onclick = () => selectAnswer(opt, q.noun);
            grid.appendChild(btn);
        });

        document.getElementById('prevBtn').style.visibility = currentQIndex > 0 ? 'visible' : 'hidden';
        
        let nextBtn = document.getElementById('nextBtn');
        nextBtn.style.visibility = 'visible';
        if (currentQIndex === 11) {
            nextBtn.innerText = "交卷 🏁";
            nextBtn.style.backgroundColor = "#06D6A0";
        } else {
            nextBtn.innerText = "下一頁 ➡️";
            nextBtn.style.backgroundColor = "#eee";
        }
    }

    function selectAnswer(adj, noun) {
        speak(adj + noun);
        userAnswers[currentQIndex] = adj;
        
        let paper = document.getElementById('writingPaper');
        paper.innerText = adj + noun;
        paper.style.color = 'var(--text)';

        let btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => {
            b.style.backgroundColor = 'white';
            b.style.borderColor = 'var(--accent)';
            if(b.innerText === adj) {
                b.style.backgroundColor = '#FFE66D';
                b.style.borderColor = '#FF9F1C';
            }
        });
        
        // 延遲自動跳下一題
        setTimeout(() => {
            if(currentQIndex < 11) {
                nextQuestion();
            }
        }, 500);
    }

    function prevQuestion() {
        if (currentQIndex > 0) {
            currentQIndex--;
            renderQuestion();
        }
    }

    function nextQuestion() {
        if (currentQIndex < 11) {
            currentQIndex++;
            renderQuestion();
        } else {
            finishGame();
        }
    }

    let currentScore = 0;
    function finishGame() {
        clearInterval(timerInterval);
        currentScore = 0;
        for(let i=0; i<12; i++) {
            if(userAnswers[i] === currentQuestions[i].adj) {
                currentScore++;
            }
        }
        document.getElementById('scoreText').innerText = currentScore;
        document.getElementById('finalTimeText').innerText = formatTime(totalSeconds);
        speak(`挑戰完成，你答對了${currentScore}題，用了${Math.floor(totalSeconds/60)}分${totalSeconds%60}秒`);
        showPage('result');
    }

    // 提交成績到 Firebase
    async function submitScore() {
        const name = document.getElementById('playerName').value.trim();
        if(!name) {
            alert("請輸入名字喔！");
            return;
        }
        
        try {
            document.querySelector('#submitRecordDiv button').innerText = "上傳中...";
            document.querySelector('#submitRecordDiv button').disabled = true;

            await window.addDoc(window.collection(window.db, "leaderboard"), {
                name: name,
                score: currentScore,
                time: totalSeconds,
                timestamp: new Date()
            });

            document.getElementById('submitRecordDiv').innerHTML = "<h3>✅ 成績已上傳到雲端！</h3>";
            loadLeaderboard();
        } catch (e) {
            console.error("Error adding document: ", e);
            alert("上傳失敗，請稍後再試。");
            document.querySelector('#submitRecordDiv button').innerText = "🚀 提交成績";
            document.querySelector('#submitRecordDiv button').disabled = false;
        }
    }

    // 從 Firebase 讀取排行榜
    async function loadLeaderboard() {
        const listDiv = document.getElementById('leaderboard-list');
        if(!window.db) return; // SDK 尚未載入

        try {
            const q = window.query(
                window.collection(window.db, "leaderboard"),
                window.orderBy("score", "desc"),
                window.orderBy("time", "asc"),
                window.limit(10)
            );
            
            const querySnapshot = await window.getDocs(q);
            listDiv.innerHTML = '';
            
            let rank = 1;
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : ` ${rank}. `;
                
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.innerHTML = `
                    <span>${medal} ${data.name}</span>
                    <span>✅ ${data.score}題 ⏱️ ${formatTime(data.time)}</span>
                `;
                listDiv.appendChild(item);
                rank++;
            });
            
            if(rank === 1) {
                listDiv.innerHTML = '<div style="text-align:center; padding: 20px;">快來成為第一個挑戰者吧！🚀</div>';
            }
        } catch (error) {
            console.error("Error reading leaderboard:", error);
            listDiv.innerHTML = '<div style="color:red; text-align:center;">讀取失敗，請確認 Firebase 設定。</div>';
        }
    }
</script>
</body>
</html>
