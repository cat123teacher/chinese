<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <!-- 【關鍵修改1】開放最大縮放倍率，允許雙指放大縮小 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>兒童填色與畫畫遊戲</title>
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            /* 移除 overflow: hidden 讓頁面在需要時可以滾動 */
            font-family: 'Comic Sans MS', '微軟正黑體', sans-serif; 
            background-color: #e0f7fa; 
            user-select: none;
        }

        /* 偽全螢幕模式 (專為 iOS Safari 設計) */
        body.pseudo-fullscreen #game-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background-color: #e0f7fa;
        }

        /* ================= 首頁圖庫選單樣式 ================= */
        #home-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #e0f7fa;
            background-image: radial-gradient(#b2ebf2 20%, transparent 20%), radial-gradient(#b2ebf2 20%, transparent 20%);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
        }
        #home-screen h1 { 
            color: #ff5252; 
            font-size: 2.2rem; 
            text-shadow: 3px 3px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; 
            margin: 20px 0 10px 0;
            text-align: center;
            letter-spacing: 2px;
        }
        .instruction {
            color: #00796b;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        #image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px;
            width: 92%;
            max-width: 700px;
            max-height: 75vh;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            touch-action: pan-y; 
            padding: 15px;
            padding-bottom: 40px;
        }
        @media (min-width: 500px) { #image-grid { grid-template-columns: repeat(3, 1fr); } }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            background-color: #ffffff; 
            border: 5px solid #80deea; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            padding: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .card:active { 
            transform: scale(0.95); 
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .card-img { 
            width: 100%;
            height: 100px;
            object-fit: contain;
            -webkit-user-drag: none; 
            user-select: none;
        }

        .card-title {
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: 900;
            color: #00796b;
            background-color: #e0f7fa;
            padding: 4px 16px;
            border-radius: 20px;
            border: 2px solid #b2ebf2;
            letter-spacing: 1px;
        }

        /* ================= 遊戲主頁面樣式 ================= */
        #game-screen { 
            display: none; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw;
        }
        
        #toolbar-wrapper {
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
            flex-shrink: 0;
            width: 100%;
        }

        #toggle-toolbar-btn {
            background-color: #ffe082;
            color: #d84315;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px;
            border: none;
            cursor: pointer;
            border-bottom: 2px solid #ffca28;
            text-align: center;
            width: 100%;
        }
        #toggle-toolbar-btn:active { background-color: #ffca28; }

        #toolbar { 
            display: flex; 
            flex-wrap: wrap; 
            align-items: center;
            justify-content: center; 
            gap: 6px; 
            padding: 10px 5px; 
        }
        #toolbar.collapsed {
            display: none !important;
        }
        
        .color-btn { 
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
            border: 3px solid #eee; 
            cursor: pointer; 
            transition: transform 0.1s;
        }
        .color-btn.active { 
            border-color: #333; 
            transform: scale(1.2); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .rainbow-btn {
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
        }

        .size-btn, .tool-btn { 
            padding: 5px 8px; 
            font-size: 0.9rem; 
            font-weight: bold;
            border-radius: 10px; 
            border: 2px solid #ccc; 
            background: #f9f9f9; 
            cursor: pointer; 
            color: #333;
        }
        .size-btn.active, .tool-btn.active { 
            background: #ffeb3b; 
            border-color: #ff9800; 
            color: #d84315;
        }
        
        #btn-fullscreen { background-color: #e3f2fd; border-color: #2196f3; color: #0d47a1; }
        #btn-switch-mode { background-color: #f3e5f5; border-color: #9c27b0; color: #4a148c; }

        .divider { width: 2px; height: 25px; background: #ddd; margin: 0 2px; border-radius: 2px; }

        /* 【關鍵修改2】工作區支援上下滑動 (overflow: auto) */
        #workspaces {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 讓內容可往上推以滾動 */
            background-color: #b2ebf2;
            overflow: auto; /* 允許打橫時出現捲軸 */
            -webkit-overflow-scrolling: touch;
            position: relative;
            padding: 20px 0 60px 0; /* 底部多留白方便滾動 */
        }

        .workspace-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            min-height: 100%; /* 確保最小佔滿 */
        }

        .section-title {
            font-size: 1.1rem;
            color: #00796b;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 1px 1px #fff;
        }

        .canvas-wrapper {
            position: relative;
            background-color: #ffffff;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 10px;
            /* 移除 touch-action: none 讓雙指縮放能生效 */
        }

        .draw-canvas {
            display: block;
            border-radius: 10px;
            z-index: 1;
        }

        #image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none; 
            mix-blend-mode: multiply; 
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- 首頁 -->
    <div id="home-screen">
        <h1>🎨 兒童畫畫樂園 🖌️</h1>
        <div class="instruction">👇 點擊圖案開始 👇</div>
        <div id="image-grid"></div>
    </div>

    <!-- 遊戲頁面 -->
    <div id="game-screen">
        <div id="toolbar-wrapper">
            <button id="toggle-toolbar-btn">⬆️ 收起工具列 (極致放大畫布)</button>
            <div id="toolbar">
                <button class="tool-btn active" id="btn-brush">🖌️ 畫筆</button>
                <button class="tool-btn" id="btn-eraser">🧽 橡皮</button>
                <div class="divider"></div>
                
                <button class="size-btn" data-size="5">極細</button>
                <button class="size-btn" data-size="10">細</button>
                <button class="size-btn active" data-size="25">中</button>
                <button class="size-btn" data-size="45">粗</button>
                <div class="divider"></div>
                
                <div class="color-btn active" style="background-color: #f44336;" data-color="#f44336"></div>
                <div class="color-btn" style="background-color: #ff9800;" data-color="#ff9800"></div>
                <div class="color-btn" style="background-color: #ffeb3b;" data-color="#ffeb3b"></div>
                <div class="color-btn" style="background-color: #4caf50;" data-color="#4caf50"></div>
                <div class="color-btn" style="background-color: #00bcd4;" data-color="#00bcd4"></div>
                <div class="color-btn" style="background-color: #2196f3;" data-color="#2196f3"></div>
                <div class="color-btn" style="background-color: #9c27b0;" data-color="#9c27b0"></div>
                <div class="color-btn" style="background-color: #e91e63;" data-color="#e91e63"></div>
                <div class="color-btn" style="background-color: #795548;" data-color="#795548"></div>
                <div class="color-btn" style="background-color: #000000;" data-color="#000000"></div>
                <div class="color-btn rainbow-btn" data-color="rainbow"></div>
                <div class="divider"></div>
                
                <button class="tool-btn" id="btn-clear">🗑️ 重畫</button>
                <button class="tool-btn" id="btn-switch-mode">🔄 空白畫板</button>
                <button class="tool-btn" id="btn-fullscreen">⛶ 全螢幕</button>
                <button class="tool-btn" id="btn-home">🏠 首頁</button>
            </div>
        </div>
        
        <div id="workspaces">
            <div id="coloring-workspace" class="workspace-section">
                <div class="section-title">✨ 開心填色區 ✨</div>
                <div class="canvas-wrapper">
                    <canvas id="coloring-canvas" class="draw-canvas"></canvas>
                    <img src="" id="image-overlay" alt="coloring outline">
                </div>
            </div>
            <div id="drawing-workspace" class="workspace-section" style="display: none;">
                <div class="section-title">✨ 創意空白畫板 ✨</div>
                <div class="canvas-wrapper">
                    <canvas id="drawing-canvas" class="draw-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageList = [
            { src: "Dcar.jpg", name: "汽車" },
            { src: "Dcat.jpg", name: "小貓" },
            { src: "Ddeer.jpg", name: "小鹿" },
            { src: "Dexcavator.jpg", name: "挖土機" },
            { src: "Dhorse.jpg", name: "小馬" },
            { src: "Drat.jpg", name: "小兔" },
            { src: "D倉鼠.jpg", name: "倉鼠" },
            { src: "D消防車.jpg", name: "消防車" },
            { src: "Nfish.jpg", name: "小魚" },
            { src: "公主.jpg", name: "公主" },
            { src: "城堡.jpg", name: "城堡" },
            { src: "巴士.jpg", name: "巴士" },
            { src: "恐龍.jpg", name: "恐龍" },
            { src: "拖車.jpg", name: "拖車" },
            { src: "救護車.jpg", name: "救護車" },
            { src: "火車.jpg", name: "火車" },
            { src: "獅子.jpg", name: "獅子" },
            { src: "老鷹.jpg", name: "老鷹" },
            { src: "蜘蛛.jpg", name: "蜘蛛" },
            { src: "警車.jpg", name: "警車" },
            { src: "貨車.jpg", name: "貨車" },
            { src: "鯊魚.jpg", name: "鯊魚" }
        ];

        const homeScreen = document.getElementById('home-screen');
        const gameScreen = document.getElementById('game-screen');
        const imageGrid = document.getElementById('image-grid');
        const overlay = document.getElementById('image-overlay');
        const workspaces = document.getElementById('workspaces');
        const canvases = document.querySelectorAll('.draw-canvas');

        let isDrawing = false;
        let currentColor = '#f44336';
        let currentSize = 25;
        let isEraser = false;
        let activeCanvas = null;
        let activeCtx = null;
        let lastX = 0, lastY = 0;
        
        let isRainbow = false;
        let rainbowHue = 0;
        let currentMode = 'coloring'; 

        // 生成首頁圖案
        imageList.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const img = document.createElement('img');
            img.src = item.src;
            img.className = 'card-img';
            img.draggable = false; 
            
            const title = document.createElement('div');
            title.className = 'card-title';
            title.innerText = item.name;
            
            card.appendChild(img);
            card.appendChild(title);

            card.addEventListener('click', () => {
                overlay.src = item.src; 
                homeScreen.style.display = 'none';
                gameScreen.style.display = 'flex';
                
                overlay.onload = () => { initCanvas(false); };
                setTimeout(() => { initCanvas(false); }, 150); 
            });
            
            imageGrid.appendChild(card);
        });

        function initCanvas(preserveDrawing = false) {
            const tempCanvases = [];
            if (preserveDrawing) {
                canvases.forEach((canvas, index) => {
                    const temp = document.createElement('canvas');
                    temp.width = canvas.width || 1; 
                    temp.height = canvas.height || 1;
                    if (canvas.width > 0 && canvas.height > 0) {
                        temp.getContext('2d').drawImage(canvas, 0, 0);
                    }
                    tempCanvases[index] = temp;
                });
            }

            let imgAspect = overlay.naturalWidth / overlay.naturalHeight;
            if (!imgAspect || isNaN(imgAspect)) imgAspect = 1; 

            let maxWidth = workspaces.clientWidth * 0.96;
            let maxHeight = workspaces.clientHeight * 0.92; 
            
            // 【關鍵修改3】防止打橫時高度縮得太小，設定最低高度
            if (maxHeight < 300) maxHeight = 300; 
            if (maxWidth > 900) maxWidth = 900; 

            let newWidth = maxWidth;
            let newHeight = newWidth / imgAspect;

            if (newHeight > maxHeight) {
                newHeight = maxHeight;
                newWidth = newHeight * imgAspect;
            }

            if (newWidth === 0 || newHeight === 0) return; 

            canvases.forEach((canvas, index) => {
                canvas.width = newWidth;
                canvas.height = newHeight;
                canvas.parentElement.style.width = newWidth + 'px';
                canvas.parentElement.style.height = newHeight + 'px';

                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (preserveDrawing && tempCanvases[index] && tempCanvases[index].width > 1) {
                    ctx.drawImage(tempCanvases[index], 0, 0, canvas.width, canvas.height);
                }
            });

            overlay.style.width = newWidth + 'px';
            overlay.style.height = newHeight + 'px';
        }

        document.getElementById('btn-switch-mode').addEventListener('click', function() {
            if (currentMode === 'coloring') {
                currentMode = 'drawing';
                document.getElementById('coloring-workspace').style.display = 'none';
                document.getElementById('drawing-workspace').style.display = 'flex';
                this.innerHTML = '🎨 填色區';
            } else {
                currentMode = 'coloring';
                document.getElementById('coloring-workspace').style.display = 'flex';
                document.getElementById('drawing-workspace').style.display = 'none';
                this.innerHTML = '🔄 空白畫板';
            }
            setTimeout(() => { initCanvas(true); }, 50);
        });

        // 【關鍵修改4】強化全螢幕支援 (加入偽全螢幕備用方案)
        document.getElementById('btn-fullscreen').addEventListener('click', function() {
            const elem = document.documentElement;
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains('pseudo-fullscreen');

            if (!isFullscreen) {
                // 嘗試啟用原生全螢幕
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {
                        document.body.classList.add('pseudo-fullscreen'); // 如果被阻擋，啟用 CSS 偽全螢幕
                    });
                } else if (elem.webkitRequestFullscreen) { 
                    elem.webkitRequestFullscreen();
                } else {
                    document.body.classList.add('pseudo-fullscreen'); // iOS Safari 備用
                }
                this.innerHTML = '📴 退出全螢幕';
            } else {
                // 退出全螢幕
                if (document.exitFullscreen && document.fullscreenElement) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen && document.webkitFullscreenElement) {
                    document.webkitExitFullscreen();
                }
                document.body.classList.remove('pseudo-fullscreen'); // 移除 CSS 偽全螢幕
                this.innerHTML = '⛶ 全螢幕';
            }
            
            setTimeout(() => { initCanvas(true); }, 400);
        });

        document.getElementById('toggle-toolbar-btn').addEventListener('click', function() {
            const tb = document.getElementById('toolbar');
            tb.classList.toggle('collapsed');
            
            if (tb.classList.contains('collapsed')) {
                this.innerHTML = '⬇️ 打開畫筆與顏色 🎨';
            } else {
                this.innerHTML = '⬆️ 收起工具列 (極致放大畫布)';
            }
            setTimeout(() => { initCanvas(true); }, 50);
        });

        function clearCanvas() {
            canvases.forEach(canvas => {
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            });
        }

        document.getElementById('btn-home').addEventListener('click', () => {
            gameScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            document.body.classList.remove('pseudo-fullscreen');
            document.getElementById('btn-fullscreen').innerHTML = '⛶ 全螢幕';
        });

        document.getElementById('btn-clear').addEventListener('click', clearCanvas);

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                const selectedColor = e.target.getAttribute('data-color');
                if (selectedColor === 'rainbow') {
                    isRainbow = true;
                } else {
                    isRainbow = false;
                    currentColor = selectedColor;
                }
                isEraser = false;
                updateToolUI();
            });
        });

        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentSize = parseInt(e.target.getAttribute('data-size'));
            });
        });

        document.getElementById('btn-brush').addEventListener('click', () => { isEraser = false; updateToolUI(); });
        document.getElementById('btn-eraser').addEventListener('click', () => { isEraser = true; updateToolUI(); });

        function updateToolUI() {
            document.getElementById('btn-brush').classList.toggle('active', !isEraser);
            document.getElementById('btn-eraser').classList.toggle('active', isEraser);
        }

        function getPos(e, targetCanvas) {
            const rect = targetCanvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches.item(0).clientX;
                clientY = e.touches.item(0).clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches.item(0).clientX;
                clientY = e.changedTouches.item(0).clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        // 【關鍵修改5】智慧判別多指觸控，放行畫面拖曳與縮放
        function startDrawing(e) {
            // 如果偵測到「兩根以上手指」在畫布上，就不阻止預設行為 (交給瀏覽器縮放/滑動)
            if (e.touches && e.touches.length > 1) return;
            
            e.preventDefault(); 
            isDrawing = true;
            activeCanvas = e.target; 
            activeCtx = activeCanvas.getContext('2d');
            
            const pos = getPos(e, activeCanvas);
            lastX = pos.x;
            lastY = pos.y;

            activeCtx.beginPath();
            activeCtx.arc(lastX, lastY, currentSize / 2, 0, Math.PI * 2);
            if (isEraser) {
                activeCtx.fillStyle = '#ffffff';
            } else if (isRainbow) {
                activeCtx.fillStyle = `hsl(${rainbowHue}, 100%, 50%)`;
            } else {
                activeCtx.fillStyle = currentColor;
            }
            activeCtx.fill();
            activeCtx.closePath();
        }

        function draw(e) {
            // 放行多根手指的操作
            if (e.touches && e.touches.length > 1) return;
            
            e.preventDefault();
            if (!isDrawing || e.target !== activeCanvas) return; 
            const pos = getPos(e, activeCanvas);
            
            activeCtx.beginPath();
            activeCtx.moveTo(lastX, lastY);
            activeCtx.lineTo(pos.x, pos.y);
            
            if (isEraser) {
                activeCtx.strokeStyle = '#ffffff';
            } else if (isRainbow) {
                rainbowHue = (rainbowHue + 4) % 360; 
                activeCtx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`;
            } else {
                activeCtx.strokeStyle = currentColor;
            }
            
            activeCtx.lineWidth = currentSize;
            activeCtx.lineCap = 'round'; 
            activeCtx.lineJoin = 'round';
            activeCtx.stroke();
            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing(e) {
            // 只有單指操作結束才觸發
            if (e && (!e.touches || e.touches.length === 0)) e.preventDefault();
            isDrawing = false;
            activeCanvas = null;
            activeCtx = null;
        }

        canvases.forEach(canvas => {
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            // passive: false 是必須的，這樣才能在「單指」時用 e.preventDefault() 停用系統滾動
            canvas.addEventListener('touchstart', startDrawing, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', stopDrawing, {passive: false});
            canvas.addEventListener('touchcancel', stopDrawing, {passive: false});
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            if (gameScreen.style.display === 'flex') {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    initCanvas(true);
                }, 300);
            }
        });
    </script>
</body>
</html>
